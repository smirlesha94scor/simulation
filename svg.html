<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Интерактивный редактор электрических схем SVG</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; display: flex; height: 100vh; background: #1e1e1e; color: #d4d4d4; overflow: hidden; }
        
        #sidebar { width: 360px; background: #252526; border-right: 1px solid #333; padding: 15px; display: flex; flex-direction: column; gap: 12px; z-index: 10; box-shadow: 2px 0 10px rgba(0,0,0,0.5); overflow-y: auto; }
        h3 { margin: 0 0 5px 0; color: #4ec9b0; font-size: 18px; }
        
        .section { background: #2d2d2d; padding: 10px; border-radius: 6px; border: 1px solid #3c3c3c; display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 12px; font-weight: bold; color: #9cdcfe; }
        
        input[type="file"], input[type="text"], input[type="number"], select {
            background: #3c3c3c; border: 1px solid #555; color: #fff; padding: 6px 8px; border-radius: 4px; font-size: 13px; width: 100%;
        }
        input[type="range"] { width: 100%; }
        
        .btn-group { display: flex; gap: 6px; }
        button {
            background: #0e639c; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; font-weight: 500; font-size: 13px; flex: 1; transition: background 0.2s;
        }
        button:hover { background: #1177bb; }
        button.secondary { background: #515151; }
        button.secondary:hover { background: #616161; }
        button.danger { background: #a12c2c; }
        button.danger:hover { background: #c53838; }

        .components-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .comp-btn {
            background: #333333; border: 1px solid #4f4f4f; color: #fff; padding: 8px; border-radius: 4px; cursor: pointer; text-align: left; font-size: 12px; display: flex; align-items: center; gap: 6px; transition: all 0.2s;
        }
        .comp-btn:hover { background: #3c3c3c; border-color: #4ec9b0; color: #4ec9b0; }
        .comp-btn.active { background: #0e639c; border-color: #1177bb; }

        textarea { width: 100%; height: 130px; font-family: Consolas, monospace; font-size: 11px; background: #1e1e1e; color: #ce9178; border: 1px solid #3c3c3c; border-radius: 4px; resize: vertical; padding: 6px; }

        #canvas-container { flex-grow: 1; position: relative; overflow: hidden; background: #121212; display: flex; justify-content: center; align-items: center; }
        svg { background: #ffffff; box-shadow: 0 0 20px rgba(0,0,0,0.8); cursor: crosshair; }
        
        .hint { font-size: 11px; color: #858585; line-height: 1.3; }
        .flex-row { display: flex; align-items: center; justify-content: space-between; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h3>SVG Редактор Схем</h3>
        <div class="hint">Зажмите клавишу <b>Shift</b> при рисовании линии, резистора или конденсатора, чтобы элемент встал строго вертикально или горизонтально.</div>

        <div class="section">
            <label>1. Картинка-подложка (для обводки):</label>
            <input type="file" id="imageLoader" accept="image/*">
            <div class="flex-row">
                <label>Прозрачность:</label>
                <span id="opacityVal" style="font-size:12px;">0.5</span>
            </div>
            <input type="range" id="opacityRange" min="0" max="1" step="0.05" value="0.5">
        </div>

        <div class="section">
            <label>2. Выберите элемент или инструмент:</label>
            <div class="components-grid">
                <button class="comp-btn active" data-tool="line">✏️ Линия (провод)</button>
                <button class="comp-btn" data-tool="node">⏺ Точка соединения</button>
                <button class="comp-btn" data-tool="resistor">⚡ Резистор</button>
                <button class="comp-btn" data-tool="capacitor">🔋 Конденсатор</button>
                <button class="comp-btn" data-tool="diode">▶ Диод</button>
                <button class="comp-btn" data-tool="npn">🔲 Транзистор NPN</button>
                <button class="comp-btn" data-tool="pnp">🔲 Транзистор PNP</button>
                <button class="comp-btn" data-tool="battery">➕ Батарея 9В</button>
                <button class="comp-btn" data-tool="text">🔤 Текст / Метка</button>
            </div>
        </div>

        <div class="section" id="paramsSection">
            <label>Параметры элементов:</label>
            <div id="textParamContainer" style="display:none; flex-direction:column; gap:4px;">
                <label style="font-weight:normal;">Текст надписи:</label>
                <input type="text" id="textContent" value="R1 750k">
            </div>
            <div class="flex-row">
                <label style="font-weight:normal;">Толщина линий (до 20):</label>
                <input type="number" id="strokeWidth" value="3" min="1" max="20" style="width: 80px;">
            </div>
            <div class="flex-row" style="margin-top: 4px;">
                <label style="font-weight:normal;">Радиус точки (на холсте):</label>
                <input type="number" id="nodeRadius" value="4" min="1" max="15" style="width: 80px;">
            </div>
        </div>

        <div class="btn-group">
            <button class="secondary" id="undoBtn">↩ Отменить</button>
            <button class="danger" id="clearBtn">🗑 Очистить всё</button>
        </div>

        <div class="section" style="flex-grow:1; display:flex; flex-direction:column;">
            <label>Итоговый SVG Код:</label>
            <textarea id="svgCodeOutput" readonly></textarea>
            <button id="copyBtn" style="background:#388a34;">📋 Скопировать код</button>
        </div>
    </div>

    <div id="canvas-container">
        <svg id="drawingCanvas" width="850" height="650" viewBox="0 0 850 650">
            <image id="bg-image" href="" width="850" height="650" opacity="0.5" preserveAspectRatio="none" />
            <g id="elementsGroup"></g>
            <g id="previewGroup" style="pointer-events: none; opacity: 0.6;"></g>
        </svg>
    </div>

    <script>
        const imageLoader = document.getElementById('imageLoader');
        const bgImage = document.getElementById('bg-image');
        const opacityRange = document.getElementById('opacityRange');
        const opacityVal = document.getElementById('opacityVal');
        
        const canvas = document.getElementById('drawingCanvas');
        const elementsGroup = document.getElementById('elementsGroup');
        const previewGroup = document.getElementById('previewGroup');
        
        const textParamContainer = document.getElementById('textParamContainer');
        const textContentInput = document.getElementById('textContent');
        const strokeWidthInput = document.getElementById('strokeWidth');
        const nodeRadiusInput = document.getElementById('nodeRadius');
        
        const undoBtn = document.getElementById('undoBtn');
        const clearBtn = document.getElementById('clearBtn');
        const svgCodeOutput = document.getElementById('svgCodeOutput');
        const copyBtn = document.getElementById('copyBtn');
        
        let currentTool = 'line';
        let isDrawing = false;
        let startX, startY;
        let actionHistory = [];

        document.querySelectorAll('.comp-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.comp-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTool = btn.getAttribute('data-tool');
                textParamContainer.style.display = (currentTool === 'text') ? 'flex' : 'none';
                clearPreview();
            });
        });

        imageLoader.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    bgImage.setAttribute('href', event.target.result);
                };
                reader.readAsDataURL(file);
            }
        });

        opacityRange.addEventListener('input', (e) => {
            const val = e.target.value;
            bgImage.setAttribute('opacity', val);
            opacityVal.textContent = val;
        });

        strokeWidthInput.addEventListener('input', () => {
            let val = parseInt(strokeWidthInput.value);
            if (val > 20) strokeWidthInput.value = 20;
            if (val < 1) strokeWidthInput.value = 1;
        });

        nodeRadiusInput.addEventListener('input', () => {
            let val = parseInt(nodeRadiusInput.value);
            if (val > 15) nodeRadiusInput.value = 15;
            if (val < 1) nodeRadiusInput.value = 1;
        });

        function getSVGPoint(evt) {
            const pt = canvas.createSVGPoint();
            pt.x = evt.clientX;
            pt.y = evt.clientY;
            return pt.matrixTransform(canvas.getScreenCTM().inverse());
        }

        function findNearestSnapPoint(x, y) {
            const nodes = elementsGroup.querySelectorAll('[data-node-coord]');
            let nearest = null;
            let minDist = 12;

            nodes.forEach(node => {
                const nx = parseFloat(node.getAttribute('cx') || node.getAttribute('data-x'));
                const ny = parseFloat(node.getAttribute('cy') || node.getAttribute('data-y'));
                const dist = Math.hypot(nx - x, ny - y);
                if (dist < minDist) {
                    minDist = dist;
                    nearest = { x: nx, y: ny };
                }
            });
            return nearest;
        }

        function getAdjustedCoordinates(rawX, rawY, shiftKey) {
            let endX = rawX;
            let endY = rawY;
            if (shiftKey) {
                const dx = Math.abs(endX - startX);
                const dy = Math.abs(endY - startY);
                if (dx > dy) {
                    endY = startY; // строго горизонтально
                } else {
                    endX = startX; // строго вертикально
                }
            }
            return { x: endX, y: endY };
        }

        function clearPreview() {
            previewGroup.innerHTML = '';
        }

        function createComponentXML(tool, x1, y1, x2, y2, sw, textVal, nodeR, isForPreview = false) {
            const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            const stroke = '#000000';
            const width = Math.min(Math.max(parseInt(sw) || 3, 1), 20);
            const rVal = Math.min(Math.max(parseInt(nodeR) || 4, 1), 15);

            if (tool === 'line') {
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x1); line.setAttribute('y1', y1);
                line.setAttribute('x2', x2); line.setAttribute('y2', y2);
                line.setAttribute('stroke', stroke);
                line.setAttribute('stroke-width', width);
                line.setAttribute('stroke-linecap', 'square');
                group.appendChild(line);
            } 
            else if (tool === 'node') {
                const circ = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circ.setAttribute('cx', x1); circ.setAttribute('cy', y1);
                circ.setAttribute('r', rVal);
                circ.setAttribute('fill', stroke);
                circ.setAttribute('data-node-coord', 'true');
                if (!isForPreview) {
                    group.setAttribute('data-helper', 'true');
                }
                group.appendChild(circ);
            }
            else if (tool === 'resistor') {
                const rx = Math.min(x1, x2);
                const ry = Math.min(y1, y2);
                const totalDist = Math.abs(x2 - x1);
                const rw = Math.max(totalDist, 20);
                const rh = 25;
                
                const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                rect.setAttribute('x', rx); rect.setAttribute('y', ry - rh/2);
                rect.setAttribute('width', rw); rect.setAttribute('height', rh);
                rect.setAttribute('stroke', stroke); rect.setAttribute('stroke-width', width);
                rect.setAttribute('fill', 'none');
                
                const l1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                l1.setAttribute('x1', x1); l1.setAttribute('y1', y1);
                l1.setAttribute('x2', rx); l1.setAttribute('y2', ry);
                l1.setAttribute('stroke', stroke); l1.setAttribute('stroke-width', width);

                const l2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                l2.setAttribute('x1', rx + rw); l2.setAttribute('y1', ry);
                l2.setAttribute('x2', Math.max(x1, x2)); l2.setAttribute('y2', y2);
                l2.setAttribute('stroke', stroke); l2.setAttribute('stroke-width', width);

                group.appendChild(rect);
                group.appendChild(l1);
                group.appendChild(l2);
            }
            else if (tool === 'capacitor') {
                const cx = (x1 + x2) / 2;
                const cy = (y1 + y2) / 2;
                
                const halfHeight = 18; 
                const gapOffset = 4.5; 

                const l1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                l1.setAttribute('x1', x1); l1.setAttribute('y1', y1);
                l1.setAttribute('x2', cx - gapOffset); l1.setAttribute('y2', cy);
                l1.setAttribute('stroke', stroke); l1.setAttribute('stroke-width', width);

                const plate1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                plate1.setAttribute('x1', cx - gapOffset); plate1.setAttribute('y1', cy - halfHeight);
                plate1.setAttribute('x2', cx - gapOffset); plate1.setAttribute('y2', cy + halfHeight);
                plate1.setAttribute('stroke', stroke); plate1.setAttribute('stroke-width', width);

                const plate2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                plate2.setAttribute('x1', cx + gapOffset); plate2.setAttribute('y1', cy - halfHeight);
                plate2.setAttribute('x2', cx + gapOffset); plate2.setAttribute('y2', cy + halfHeight);
                plate2.setAttribute('stroke', stroke); plate2.setAttribute('stroke-width', width);

                const l2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                l2.setAttribute('x1', cx + gapOffset); l2.setAttribute('y1', cy);
                l2.setAttribute('x2', x2); l2.setAttribute('y2', y2);
                l2.setAttribute('stroke', stroke); l2.setAttribute('stroke-width', width);

                group.appendChild(l1); group.appendChild(plate1); group.appendChild(plate2); group.appendChild(l2);
            }
            else if (tool === 'diode') {
                const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                poly.setAttribute('points', `${x1},${y1} ${x1+30},${y1-10} ${x1+30},${y1+10}`);
                poly.setAttribute('fill', stroke);

                const bar = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                bar.setAttribute('x1', x1+30); bar.setAttribute('y1', y1-12);
                bar.setAttribute('x2', x1+30); bar.setAttribute('y2', y1+12);
                bar.setAttribute('stroke', stroke); bar.setAttribute('stroke-width', width);

                const l1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                l1.setAttribute('x1', x1-15); l1.setAttribute('y1', y1);
                l1.setAttribute('x2', x1); l1.setAttribute('y2', y1);
                l1.setAttribute('stroke', stroke); l1.setAttribute('stroke-width', width);

                const l2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                l2.setAttribute('x1', x1+30); l2.setAttribute('y1', y1);
                l2.setAttribute('x2', x1+45); l2.setAttribute('y2', y1);
                l2.setAttribute('stroke', stroke); l2.setAttribute('stroke-width', width);

                group.appendChild(poly); group.appendChild(bar); group.appendChild(l1); group.appendChild(l2);
            }
            else if (tool === 'npn' || tool === 'pnp') {
                const gTranslate = `translate(${x1}, ${y1})`;
                group.setAttribute('transform', gTranslate);
                group.setAttribute('data-x', x1);
                group.setAttribute('data-y', y1);

                const circ = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circ.setAttribute('cx', 30); circ.setAttribute('cy', 30);
                circ.setAttribute('r', 28);
                circ.setAttribute('stroke', stroke); circ.setAttribute('stroke-width', width);
                circ.setAttribute('fill', 'none');

                const baseLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                baseLine.setAttribute('x1', 0); baseLine.setAttribute('y1', 30);
                baseLine.setAttribute('x2', 18); baseLine.setAttribute('y2', 30);
                baseLine.setAttribute('stroke', stroke); baseLine.setAttribute('stroke-width', width);

                const baseBar = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                baseBar.setAttribute('x1', 18); baseBar.setAttribute('y1', 12);
                baseBar.setAttribute('x2', 18); baseBar.setAttribute('y2', 48);
                baseBar.setAttribute('stroke', stroke); baseBar.setAttribute('stroke-width', Math.max(width, 3));

                const colLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                colLine.setAttribute('x1', 18); colLine.setAttribute('y1', 18);
                colLine.setAttribute('x2', 45); colLine.setAttribute('y2', 0);
                colLine.setAttribute('stroke', stroke); colLine.setAttribute('stroke-width', width);

                const emLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                emLine.setAttribute('x1', 18); emLine.setAttribute('y1', 42);
                emLine.setAttribute('x2', 45); emLine.setAttribute('y2', 60);
                emLine.setAttribute('stroke', stroke); emLine.setAttribute('stroke-width', width);

                const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                if (tool === 'npn') {
                    arrow.setAttribute('points', '45,60 33,52 38,44');
                } else {
                    arrow.setAttribute('points', '28,35 38,44 33,52');
                }
                arrow.setAttribute('fill', stroke);

                group.appendChild(circ); group.appendChild(baseLine); group.appendChild(baseBar);
                group.appendChild(colLine); group.appendChild(emLine); group.appendChild(arrow);
            }
            else if (tool === 'battery') {
                const gTranslate = `translate(${x1}, ${y1})`;
                group.setAttribute('transform', gTranslate);
                group.setAttribute('data-x', x1);
                group.setAttribute('data-y', y1);

                const l1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                l1.setAttribute('x1', 20); l1.setAttribute('y1', 0);
                l1.setAttribute('x2', 20); l1.setAttribute('y2', 25);
                l1.setAttribute('stroke', stroke); l1.setAttribute('stroke-width', width);

                const p1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                p1.setAttribute('x1', 5); p1.setAttribute('y1', 25);
                p1.setAttribute('x2', 35); p1.setAttribute('y2', 25);
                p1.setAttribute('stroke', stroke); p1.setAttribute('stroke-width', width);

                const p2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                p2.setAttribute('x1', 12); p2.setAttribute('y1', 35);
                p2.setAttribute('x2', 28); p2.setAttribute('y2', 35);
                p2.setAttribute('stroke', stroke); p2.setAttribute('stroke-width', Math.max(width, 3));

                const l2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                l2.setAttribute('x1', 20); l2.setAttribute('y1', 35);
                l2.setAttribute('x2', 20); l2.setAttribute('y2', 60);
                l2.setAttribute('stroke', stroke); l2.setAttribute('stroke-width', width);

                group.appendChild(l1); group.appendChild(p1); group.appendChild(p2); group.appendChild(l2);
            }
            else if (tool === 'text') {
                const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                txt.setAttribute('x', x1); txt.setAttribute('y', y1);
                txt.setAttribute('fill', stroke);
                txt.setAttribute('font-family', 'Courier New, monospace');
                txt.setAttribute('font-size', '16');
                txt.setAttribute('font-weight', 'bold');
                txt.textContent = textVal || 'R1';
                group.appendChild(txt);
            }

            return group;
        }

        canvas.addEventListener('mousedown', (e) => {
            const pt = getSVGPoint(e);
            isDrawing = true;
            
            const snap = findNearestSnapPoint(pt.x, pt.y);
            startX = snap ? snap.x : Math.round(pt.x);
            startY = snap ? snap.y : Math.round(pt.y);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const pt = getSVGPoint(e);
            
            let snap = findNearestSnapPoint(pt.x, pt.y);
            let targetX = snap ? snap.x : Math.round(pt.x);
            let targetY = snap ? snap.y : Math.round(pt.y);

            const adjusted = getAdjustedCoordinates(targetX, targetY, e.shiftKey);
            const sw = strokeWidthInput.value;
            const textVal = textContentInput.value;
            const nodeR = nodeRadiusInput.value;

            clearPreview();
            const previewEl = createComponentXML(currentTool, startX, startY, adjusted.x, adjusted.y, sw, textVal, nodeR, true);
            previewGroup.appendChild(previewEl);
        });

        canvas.addEventListener('mouseup', (e) => {
            if (!isDrawing) return;
            isDrawing = false;
            const pt = getSVGPoint(e);
            
            let snap = findNearestSnapPoint(pt.x, pt.y);
            let targetX = snap ? snap.x : Math.round(pt.x);
            let targetY = snap ? snap.y : Math.round(pt.y);

            const adjusted = getAdjustedCoordinates(targetX, targetY, e.shiftKey);
            const endX = adjusted.x;
            const endY = adjusted.y;

            const sw = strokeWidthInput.value;
            const textVal = textContentInput.value;
            const nodeR = nodeRadiusInput.value;

            clearPreview();

            let finalX2 = endX;
            let finalY2 = endY;
            if (['node', 'npn', 'pnp', 'battery', 'diode', 'text'].includes(currentTool)) {
                finalX2 = startX;
                finalY2 = startY;
            }

            const newElement = createComponentXML(currentTool, startX, startY, finalX2, finalY2, sw, textVal, nodeR, false);
            if (newElement) {
                elementsGroup.appendChild(newElement);

                const helperNodes = [];
                if (currentTool !== 'node') {
                    if (!findNearestSnapPoint(startX, startY)) {
                        const startNode = createComponentXML('node', startX, startY, startX, startY, sw, textVal, nodeR, false);
                        elementsGroup.appendChild(startNode);
                        helperNodes.push(startNode);
                    }

                    if (['line', 'resistor', 'capacitor'].includes(currentTool)) {
                        if (!findNearestSnapPoint(finalX2, finalY2)) {
                            const endNode = createComponentXML('node', finalX2, finalY2, finalX2, finalY2, sw, textVal, nodeR, false);
                            elementsGroup.appendChild(endNode);
                            helperNodes.push(endNode);
                        }
                    }
                }

                actionHistory.push({ element: newElement, helpers: helperNodes });
                updateOutputCode();
            }
        });

        undoBtn.addEventListener('click', () => {
            if (actionHistory.length > 0) {
                const action = actionHistory.pop();
                action.element.remove();
                action.helpers.forEach(h => h.remove());
                updateOutputCode();
            }
        });

        clearBtn.addEventListener('click', () => {
            if (confirm('Очистить все элементы схемы?')) {
                elementsGroup.innerHTML = '';
                actionHistory = [];
                updateOutputCode();
            }
        });

        function updateOutputCode() {
            const clone = canvas.cloneNode(true);
            const bg = clone.querySelector('#bg-image');
            if (bg) bg.remove();
            const preview = clone.querySelector('#previewGroup');
            if (preview) preview.remove();
            
            const helpers = clone.querySelectorAll('[data-helper="true"]');
            helpers.forEach(h => h.remove());

            svgCodeOutput.value = clone.outerHTML;
        }

        copyBtn.addEventListener('click', () => {
            svgCodeOutput.select();
            document.execCommand('copy');
            alert('SVG код успешно скопирован в буфер обмена!');
        });

        updateOutputCode();
    </script>
</body>
</html>
