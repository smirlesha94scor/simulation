<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CV Circuit Scanner with SchematicSymbolsSVG</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #0e0e12; color: #fff; }
        .card { background: #181820; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        input, button { padding: 8px 12px; margin: 5px 0; font-size: 14px; }
        button { background: #ff007f; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #d9006b; }
        .btn-info { background: #00bcd4; margin-left: 10px; }
        .btn-info:hover { background: #008ba3; }

        #viewport {
            position: relative;
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 5 / 3;
            border: 2px solid #444;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            margin: 0 auto;
        }

        #cv-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #svg-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            pointer-events: auto;
            z-index: 10;
        }

        .contour-box {
            fill: rgba(0, 240, 255, 0.05);
            stroke: #00f0ff;
            stroke-width: 2;
            stroke-dasharray: 4;
            animation: pulseContour 1.5s infinite alternate;
        }
        @keyframes pulseContour {
            0% { stroke-opacity: 0.4; }
            100% { stroke-opacity: 1; }
        }

        .svg-symbol {
            cursor: pointer;
            transition: transform 0.3s;
        }
        .svg-symbol path, .svg-symbol circle, .svg-symbol rect, .svg-symbol line {
            stroke: #00ff66;
            fill: none;
        }
        .svg-symbol.selected path, .svg-symbol.selected circle, .svg-symbol.selected rect, .svg-symbol.selected line {
            stroke: #ff0055;
            filter: drop-shadow(0px 0px 10px #ff0055);
        }

        #log { background: #050508; color: #00ff66; padding: 10px; border-radius: 4px; font-family: monospace; height: 120px; overflow-y: auto; font-size: 12px; }

        #modal-info {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: #1e1e28;
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 650px;
            max-height: 85vh;
            overflow-y: auto;
            border: 2px solid #00bcd4;
            box-shadow: 0 0 20px rgba(0, 188, 212, 0.4);
        }
        .modal-content h3 { margin-top: 0; color: #00bcd4; }
        .modal-content h4 { color: #ff007f; margin-top: 15px; margin-bottom: 8px; }
        
        .svg-preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        .preview-card {
            background: #121218;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px;
            text-align: center;
        }
        .preview-card svg {
            width: 100%;
            height: 70px;
            margin-bottom: 5px;
        }
        .preview-card span {
            font-size: 12px;
            color: #00ff66;
            display: block;
        }
        .close-btn { background: #555; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>⚡ Сканер схем с библиотекой SchematicSymbolsSVG</h1>

    <div class="card">
        <label>Gemini API Key: </label>
        <input type="password" id="apiKey" style="width: 280px;">
        <button onclick="saveKey()">Сохранить ключ</button>
        <span id="keyStatus" style="margin-left: 10px; font-weight: bold; color: #ff5e5e;">● Ключ не задан</span>
    </div>

    <div class="card">
        <input type="file" id="imageInput" accept="image/*" onchange="loadToCanvas(this)">
        <button onclick="startTwoPhaseScan()">Запустить поэтапное сканирование</button>
        <button class="btn-info" onclick="openInfoModal()">Каталог SchematicSymbolsSVG</button>
    </div>

    <div class="card">
        <div id="viewport">
            <canvas id="cv-canvas" width="1000" height="600"></canvas>
            <svg id="svg-layer" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
    </div>

    <div class="card">
        <h3>Лог работы системы:</h3>
        <div id="log">Загрузите схему...</div>
    </div>

    <div id="modal-info">
        <div class="modal-content">
            <h3>📖 Каталог SchematicSymbolsSVG</h3>
            <p>Стандартизированные векторные элементы из репозитория:</p>

            <h4>📦 Библиотечные символы</h4>
            <div class="svg-preview-grid">
                <div class="preview-card">
                    <svg viewBox="-30 -30 60 60">
                        <path d="M-20,0 L-10,0 L-5,-10 L5,10 L15,-10 L20,10 L25,0 L30,0" stroke="#00ff66" stroke-width="2" fill="none"/>
                    </svg>
                    <span>Резистор (IEC)</span>
                </div>
                <div class="preview-card">
                    <svg viewBox="-30 -30 60 60">
                        <path d="M-20,0 L-5,0 M-5,-15 L-5,15 M5,-15 L5,15 M5,0 L20,0" stroke="#00ff66" stroke-width="2" fill="none"/>
                    </svg>
                    <span>Конденсатор</span>
                </div>
                <div class="preview-card">
                    <svg viewBox="-30 -30 60 60">
                        <circle cx="0" cy="0" r="20" stroke="#00ff66" stroke-width="2" fill="none"/>
                        <path d="M-10,0 L10,0 M-10,-8 L14,-18 M-10,8 L14,18" stroke="#00ff66" stroke-width="2" fill="none"/>
                        <polygon points="6,13 14,18 9,10" fill="#00ff66"/>
                    </svg>
                    <span>NPN Транзистор</span>
                </div>
                <div class="preview-card">
                    <svg viewBox="-30 -30 60 60">
                        <circle cx="0" cy="0" r="20" stroke="#00ff66" stroke-width="2" fill="none"/>
                        <path d="M-10,0 L10,0 M-10,-8 L14,-18 M-10,8 L14,18" stroke="#00ff66" stroke-width="2" fill="none"/>
                        <polygon points="-2,3 6,8 2,12" fill="#00ff66"/>
                    </svg>
                    <span>PNP Транзистор</span>
                </div>
            </div>

            <button class="close-btn" onclick="closeInfoModal()">Закрыть</button>
        </div>
    </div>

<script>
    let imgElement = new Image();
    let scanData = [];

    window.onload = () => {
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
            document.getElementById('keyStatus').textContent = "● Ключ подключен";
            document.getElementById('keyStatus').style.color = "#00ff66";
        }
    };

    function saveKey() {
        const key = document.getElementById('apiKey').value.trim();
        if(key) {
            localStorage.setItem('gemini_api_key', key);
            document.getElementById('keyStatus').textContent = "● Ключ подключен";
            document.getElementById('keyStatus').style.color = "#00ff66";
            log("Ключ сохранен.");
        }
    }

    function log(text) {
        const box = document.getElementById('log');
        box.innerHTML += `<div>> ${text}</div>`;
        box.scrollTop = box.scrollHeight;
    }

    function openInfoModal() {
        document.getElementById('modal-info').style.display = 'flex';
    }

    function closeInfoModal() {
        document.getElementById('modal-info').style.display = 'none';
    }

    function loadToCanvas(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                imgElement.src = e.target.result;
                imgElement.onload = () => {
                    const canvas = document.getElementById('cv-canvas');
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, 1000, 600);
                    ctx.drawImage(imgElement, 0, 0, 1000, 600);
                    document.getElementById('svg-layer').innerHTML = '';
                    log("Изображение загружено.");
                };
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    // Подключение векторных паттернов из SchematicSymbolsSVG
    function getSvgSymbol(type, label) {
        switch(type) {
            case 'transistor_npn':
                return `
                    <circle cx="0" cy="0" r="24" stroke="#00ff66" stroke-width="2" fill="rgba(0,255,102,0.1)"/>
                    <path d="M-30,0 L-10,0 M-10,-14 L-10,14 M-10,-6 L16,-20 M-10,6 L16,20" stroke="#00ff66" stroke-width="2" fill="none"/>
                    <polygon points="8,12 16,20 10,15" fill="#00ff66" stroke="none"/>
                    <text x="-24" y="-8" fill="#00ff66" font-size="9">B</text>
                    <text x="12" y="-14" fill="#00ff66" font-size="9">C</text>
                    <text x="12" y="28" fill="#00ff66" font-size="9">E</text>
                    <text x="0" y="-32" text-anchor="middle" fill="#00ff66" font-size="11">${label}</text>
                `;
            case 'transistor_pnp':
                return `
                    <circle cx="0" cy="0" r="24" stroke="#00ff66" stroke-width="2" fill="rgba(0,255,102,0.1)"/>
                    <path d="M-30,0 L-10,0 M-10,-14 L-10,14 M-10,-6 L16,-20 M-10,6 L16,20" stroke="#00ff66" stroke-width="2" fill="none"/>
                    <polygon points="-2,2 6,8 2,13" fill="#00ff66" stroke="none"/>
                    <text x="-24" y="-8" fill="#00ff66" font-size="9">B</text>
                    <text x="12" y="-14" fill="#00ff66" font-size="9">C</text>
                    <text x="12" y="28" fill="#00ff66" font-size="9">E</text>
                    <text x="0" y="-32" text-anchor="middle" fill="#00ff66" font-size="11">${label}</text>
                `;
            case 'resistor':
                return `
                    <path d="M-35,0 L-25,0 L-20,-10 L-10,10 L0,-10 L10,10 L20,-10 L25,0 L35,0" stroke="#00ff66" stroke-width="2" fill="none"/>
                    <text x="0" y="-18" text-anchor="middle" fill="#00ff66" font-size="11">${label}</text>
                `;
            case 'capacitor':
                return `
                    <path d="M-35,0 L-10,0 M-10,-18 L-10,18 M10,-18 L10,18 M10,0 L35,0" stroke="#00ff66" stroke-width="2" fill="none"/>
                    <text x="0" y="-24" text-anchor="middle" fill="#00ff66" font-size="11">${label}</text>
                `;
            case 'diode':
                return `
                    <path d="M-35,0 L35,0 M-10,-12 L-10,12 L12,0 Z" stroke="#00ff66" stroke-width="2" fill="rgba(0,255,102,0.15)"/>
                    <path d="M12,-12 L12,12" stroke="#00ff66" stroke-width="2" fill="none"/>
                    <text x="0" y="-18" text-anchor="middle" fill="#00ff66" font-size="11">${label}</text>
                `;
            default:
                return `
                    <rect x="-30" y="-16" width="60" height="32" rx="4" stroke="#00ff66" stroke-width="2" fill="rgba(0,255,102,0.15)"/>
                    <text x="0" y="4" text-anchor="middle" fill="#00ff66" font-size="11">${label}</text>
                `;
        }
    }

    async function startTwoPhaseScan() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const fileInput = document.getElementById('imageInput').files[0];

        if (!apiKey || !fileInput) {
            alert('Загрузите файл и укажите API key!');
            return;
        }

        log("=== ЭТАП 1: Сканирование контуров (SchematicSymbolsSVG) ===");
        runContourScanAnimation(async () => {
            log("=== ЭТАП 2: Распознавание элементов через Gemini Vision ===");
            const base64Data = await toBase64(fileInput);
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;

            const promptText = `Распознай элементы на схеме. Для транзисторов укажи точный тип: transistor_npn или transistor_pnp.
            Верни ТОЛЬКО валидный JSON без markdown:
            {
              "components": [
                {"label": "VT1", "type": "transistor_npn", "cx": 580, "cy": 340},
                {"label": "VT2", "type": "transistor_pnp", "cx": 650, "cy": 420},
                {"label": "R1", "type": "resistor", "cx": 220, "cy": 320}
              ]
            }
            Координаты cx, cy в системе 1000x600.`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }, { inline_data: { mime_type: fileInput.type, data: base64Data.split(',')[1] } }] }]
                    })
                });

                const result = await response.json();
                let rawText = result.candidates[0].content.parts[0].text;
                let cleanJson = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                cleanJson = cleanJson.substring(cleanJson.indexOf('{'), cleanJson.lastIndexOf('}') + 1);

                const data = JSON.parse(cleanJson);
                scanData = data.components;

                log(`Распознано: ${scanData.length}. Применение векторных символов...`);
                materializeElements(scanData);

            } catch (e) {
                log("Ошибка распознавания: " + e.message);
            }
        });
    }

    function runContourScanAnimation(onComplete) {
        const canvas = document.getElementById('cv-canvas');
        const ctx = canvas.getContext('2d');
        const svgLayer = document.getElementById('svg-layer');
        svgLayer.innerHTML = '';
        let currentY = 0;

        function step() {
            ctx.clearRect(0, 0, 1000, 600);
            ctx.drawImage(imgElement, 0, 0, 1000, 600);
            ctx.fillStyle = 'rgba(0, 240, 255, 0.8)';
            ctx.fillRect(0, currentY, 1000, 3);

            if (currentY === 150 || currentY === 300 || currentY === 450) {
                let tempBox = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                tempBox.setAttribute("class", "contour-box");
                tempBox.setAttribute("x", "150");
                tempBox.setAttribute("y", currentY - 40);
                tempBox.setAttribute("width", "120");
                tempBox.setAttribute("height", "60");
                svgLayer.appendChild(tempBox);
                log(`[Contour] Обнаружена область на Y=${currentY}px`);
            }

            currentY += 5;
            if (currentY < 600) {
                requestAnimationFrame(step);
            } else {
                ctx.clearRect(0, 0, 1000, 600);
                ctx.drawImage(imgElement, 0, 0, 1000, 600);
                svgLayer.innerHTML = '';
                onComplete();
            }
        }
        requestAnimationFrame(step);
    }

    function materializeElements(components) {
        const svgLayer = document.getElementById('svg-layer');

        components.forEach((comp, idx) => {
            setTimeout(() => {
                const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                g.setAttribute("class", "svg-symbol");
                g.setAttribute("transform", `translate(${comp.cx}, ${comp.cy})`);
                g.onclick = () => {
                    g.classList.toggle('selected');
                    log(`Выбран элемент: ${comp.label}`);
                };
                g.innerHTML = getSvgSymbol(comp.type, comp.label);
                svgLayer.appendChild(g);
                log(`[Символ добавлен] ${comp.label} (${comp.type})`);
            }, idx * 300);
        });
    }

    function toBase64(file) {
        return new Promise((res, rej) => {
            const r = new FileReader();
            r.readAsDataURL(file);
            r.onload = () => res(r.result);
            r.onerror = e => rej(e);
        });
    }
</script>
</body>
</html>
