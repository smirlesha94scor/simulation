<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Raycasting Симуляція (JS)</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        canvas {
            border: 2px solid #555;
            background: #000;
        }
        .controls {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <h2>Raycasting: Вид зверху vs Вид збоку (3D)</h2>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div class="controls">Керування: Стрілки <b>Вліво / Вправо</b> — поворот, <b>Вгору / Вниз</b> — рух.</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Світ (Карта): 1 - стіна, 0 - пусто
const MAP_SIZE = 8;
const TILE_SIZE = 50; // Розмір одного куба на карті 2D
const map = [,
 ,
 ,
 ,
 ,
 ,
 ,
    [1,1,1,1,1,1,1,1]
];

// Гравець
const player = {
    x: 120,
    y: 120,
    angle: 0, // Кут погляду в радіанах
    speed: 2,
    rotSpeed: 0.05
};

// Налаштування променів (Екрану)
const FOV = Math.PI / 3; // Кут огляду (60 градусів)
const NUM_RAYS = 400;    // Кількість променів (ширина 3D екрану)
const HALF_WIDTH = 400;  // Половина екрану (ліва частина - 2D, права - 3D)

// Клава
const keys = {};
window.addEventListener("keydown", e => keys[e.code] = true);
window.addEventListener("keyup", e => keys[e.code] = false);

// Оновлення логіки
function update() {
    if (keys["ArrowLeft"])  player.angle -= player.rotSpeed;
    if (keys["ArrowRight"]) player.angle += player.rotSpeed;
    
    let newX = player.x;
    let newY = player.y;
    
    if (keys["ArrowUp"]) {
        newX += Math.cos(player.angle) * player.speed;
        newY += Math.sin(player.angle) * player.speed;
    }
    if (keys["ArrowDown"]) {
        newX -= Math.cos(player.angle) * player.speed;
        newY -= Math.sin(player.angle) * player.speed;
    }

    // Проста перевірка колізій із картою перед рухом
    let checkMapX = Math.floor(newX / TILE_SIZE);
    let checkMapY = Math.floor(newY / TILE_SIZE);
    if (map[checkMapY] && map[checkMapY][checkMapX] === 0) {
        player.x = newX;
        player.y = newY;
    }
}

// Малювання всього
function draw() {
    // Очищення екрану
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // --- 1. МАЛЮЄМО ВИД ЗВЕРХУ (Ліва половина) ---
    for (let r = 0; r < MAP_SIZE; r++) {
        for (let c = 0; c < MAP_SIZE; c++) {
            if (map[r][c] === 1) {
                ctx.fillStyle = "#555";
                ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE - 1, TILE_SIZE - 1);
            }
        }
    }

    // --- 2. СИМУЛЯЦІЯ ПРОМЕНІВ (RAYCASTING) ---
    let startAngle = player.angle - FOV / 2;
    let rayAngleInc = FOV / NUM_RAYS;

    // Малюємо небо та землю для 3D вигляду (Права половина)
    ctx.fillStyle = "#223344"; // Небо
    ctx.fillRect(HALF_WIDTH, 0, HALF_WIDTH, canvas.height / 2);
    ctx.fillStyle = "#332211"; // Земля
    ctx.fillRect(HALF_WIDTH, canvas.height / 2, HALF_WIDTH, canvas.height / 2);

    for (let i = 0; i < NUM_RAYS; i++) {
        let rayAngle = startAngle + i * rayAngleInc;
        let distance = 0;
        let hitWall = false;

        // Вектори напрямку променя
        let cos = Math.cos(rayAngle);
        let sin = Math.sin(rayAngle);

        // Цикл випуску променя: збільшуємо дистанцію, поки не впоремося в об'єкт
        while (!hitWall && distance < 400) {
            distance += 1; // крок променя в пікселях

            // Рахуємо поточну координату кінчика променя
            let rayX = player.x + cos * distance;
            let rayY = player.y + sin * distance;

            // Перевіряємо, в якій клітинці карти знаходиться кінчик променя
            let mapX = Math.floor(rayX / TILE_SIZE);
            let mapY = Math.floor(rayY / TILE_SIZE);

            // Якщо вийшли за межі або влучили в стіну (1)
            if (mapX < 0 || mapX >= MAP_SIZE || mapY < 0 || mapY >= MAP_SIZE || map[mapY][mapX] === 1) {
                hitWall = true;
            }
        }

        // Малюємо промінь на карті 2D (Вид зверху)
        ctx.strokeStyle = "rgba(255, 255, 0, 0.1)";
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.x + cos * distance, player.y + sin * distance);
        ctx.stroke();

        // --- 3. МАЛЮЄМО ВИД ЗБОКУ (3D Екран - Права половина) ---
        // Корекція ефекту "риб'ячого ока" (fish-eye)
        let correctedDist = distance * Math.cos(rayAngle - player.angle);
        
        // Розрахунок висоти стіни: чим ближче, тим вона вища
        let wallHeight = Math.min(canvas.height, (TILE_SIZE * 300) / correctedDist);

        // Чим далі стіна, тим вона темніша (імітація глибини/тіні)
        let colorValue = Math.max(0, 255 - correctedDist * 0.7);
        ctx.fillStyle = `rgb(${colorValue}, ${colorValue}, ${colorValue})`;

        // Малюємо вертикальну смужку стіни
        let wallX = HALF_WIDTH + (i * (HALF_WIDTH / NUM_RAYS));
        let wallY = (canvas.height / 2) - (wallHeight / 2);
        ctx.fillRect(wallX, wallY, (HALF_WIDTH / NUM_RAYS) + 1, wallHeight);
    }

    // Малюємо самого гравця на карті 2D
    ctx.fillStyle = "red";
    ctx.beginPath();
    ctx.arc(player.x, player.y, 5, 0, Math.PI * 2);
    ctx.fill();
    
    // Лінія розділення екранів
    ctx.strokeStyle = "#555";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(HALF_WIDTH, 0);
    ctx.lineTo(HALF_WIDTH, canvas.height);
    ctx.stroke();
    ctx.lineWidth = 1;
}

// Головний ігровий цикл
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// Старт
gameLoop();
</script>

</body>
</html>
