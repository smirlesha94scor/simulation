<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Диспетчерская ЖД Сеть — Симулятор Поездов по Расписанию</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  body, html { width: 100%; height: 100%; overflow: hidden; background: #141a17; color: #e6edf3; }
  #simCanvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
  #simCanvas:active { cursor: grabbing; }

  .top-bar {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); left: 14px;
    display: flex; align-items: center; gap: 12px;
    background: rgba(18, 24, 29, 0.88); backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 10px;
    padding: 8px 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.45); z-index: 10;
  }
  .clock-box { display: flex; flex-direction: column; padding-right: 12px; border-right: 1px solid rgba(255,255,255,0.12); }
  .clock-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; color: #8b949e; }
  .clock-value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; color: #58a6ff; }
  .speed-controls { display: flex; gap: 4px; }
  .btn {
    background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.12);
    color: #c9d1d9; padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all 0.15s ease;
  }
  .btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
  .btn.active { background: #1f6feb; border-color: #388bfd; color: #fff; }

  .schedule-panel {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 76px); left: 14px; width: 340px;
    max-height: calc(100vh - 100px);
    background: rgba(18, 24, 29, 0.88); backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 10px; padding: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    display: flex; flex-direction: column; gap: 8px; z-index: 10; overflow-y: auto;
  }
  .panel-header {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px;
    color: #8b949e; padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .train-card {
    background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08);
    border-left: 4px solid #58a6ff; border-radius: 6px; padding: 8px 10px;
    cursor: pointer; transition: background 0.15s, transform 0.1s;
  }
  .train-card:hover { background: rgba(255, 255, 255, 0.09); }
  .train-card.selected { background: rgba(31, 111, 235, 0.2); border-color: rgba(56, 139, 253, 0.6); }
  .train-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .train-title { font-weight: 700; font-size: 13px; color: #f0f6fc; }
  .train-badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: 600; background: rgba(46, 160, 67, 0.2); color: #3fb950; }
  .train-badge.waiting { background: rgba(210, 153, 34, 0.2); color: #d29922; }
  .train-badge.boarding { background: rgba(56, 139, 253, 0.2); color: #58a6ff; }
  .train-route { font-size: 12px; color: #8b949e; display: flex; justify-content: space-between; }
  .train-meta {
    margin-top: 5px; padding-top: 5px; border-top: 1px dashed rgba(255,255,255,0.08);
    font-size: 11px; color: #adbac7; display: flex; justify-content: space-between;
  }

  .camera-controls {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); right: 14px;
    display: flex; flex-direction: column; gap: 6px;
    background: rgba(18, 24, 29, 0.88); backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 10px; padding: 8px; z-index: 10;
  }
  .camera-controls button { width: 34px; height: 34px; font-size: 16px; display: flex; align-items: center; justify-content: center; padding: 0; }
  .zoom-readout { font-size: 11px; text-align: center; color: #8b949e; font-variant-numeric: tabular-nums; }

  .minimap-box {
    position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); right: 14px;
    background: rgba(18, 24, 29, 0.9); border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 10px; padding: 6px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 10;
  }
  #minimapCanvas { display: block; border-radius: 6px; cursor: crosshair; }

  .stop-panel {
    position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); left: 14px; width: 300px;
    background: rgba(18, 24, 29, 0.88); backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 10px; padding: 10px 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.45); z-index: 10;
    display: flex; flex-direction: column; gap: 6px;
  }
  .stop-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #adbac7; }
  .stop-row b { color: #58a6ff; font-variant-numeric: tabular-nums; }
  .stop-panel input[type=range] { width: 100%; cursor: pointer; accent-color: #1f6feb; }
  .stop-scale { display: flex; justify-content: space-between; font-size: 10px; color: #6e7681; }

  .hint-bar {
    position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); left: 50%; transform: translateX(-50%);
    background: rgba(18, 24, 29, 0.82); border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px; padding: 6px 16px; font-size: 12px; color: #8b949e;
    pointer-events: none; z-index: 9; white-space: nowrap;
  }
</style>
</head>
<body>

<canvas id="simCanvas"></canvas>

<div class="top-bar">
  <div class="clock-box">
    <span class="clock-label">Диспетчерское время</span>
    <span class="clock-value" id="simClock">08:00:00</span>
  </div>
  <div class="speed-controls">
    <button class="btn" data-speed="0">Пауза</button>
    <button class="btn active" data-speed="1">1x</button>
    <button class="btn" data-speed="3">3x</button>
    <button class="btn" data-speed="8">8x</button>
  </div>
  <button class="btn" id="toggleAutoSwitchBtn" title="Автоматический перевод стрелок по маршруту поезда">Стрелки: АВТО</button>
</div>

<div class="schedule-panel">
  <div class="panel-header">
    <span>Расписание составов</span>
    <span id="followStatus" style="color:#58a6ff; font-size:11px; cursor:pointer;">Обзор: свободный</span>
  </div>
  <div id="trainList"></div>
</div>

<div class="camera-controls">
  <button class="btn" id="zoomInBtn" title="Приблизить (+)">+</button>
  <div class="zoom-readout" id="zoomReadout">42%</div>
  <button class="btn" id="zoomOutBtn" title="Отдалить (-)">−</button>
  <button class="btn" id="resetCamBtn" title="Показать всю карту">⌂</button>
</div>

<div class="minimap-box">
  <canvas id="minimapCanvas" width="240" height="164"></canvas>
</div>

<div class="stop-panel">
  <div class="stop-row">
    <span>Точка остановки на платформе</span>
    <b id="stopOffsetValue">0 px</b>
  </div>
  <input type="range" id="stopOffsetSlider" min="-150" max="250" step="5" value="0">
  <div class="stop-scale"><span>← раньше</span><span>центр</span><span>дальше →</span></div>
  <button class="btn" id="stopOffsetReset">Сбросить</button>
</div>

<div class="hint-bar">
  ЛКМ + перетаскивание или WASD — обзор • Колесо мыши — зум • Клик по поезду — слежение • Клик по стрелке — перевод пути
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
