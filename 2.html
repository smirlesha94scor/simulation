<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AI Circuit Realtime Scanner</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #1e1e2f; color: #fff; }
        .card { background: #27293d; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        input, button { padding: 8px 12px; margin: 5px 0; font-size: 14px; }
        button { background: #e14eca; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #e14eca_cc; }

        /* Контейнер сканера */
        #scanner-viewport {
            position: relative;
            width: 100%;
            max-width: 700px;
            height: 450px;
            border: 2px solid #e14eca;
            border-radius: 8px;
            overflow: hidden;
            background: #111;
            margin: 0 auto;
        }

        #uploaded-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Сканирующий лазер */
        #scan-line {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: #00f0ff;
            box-shadow: 0 0 15px #00f0ff, 0 0 30px #00f0ff;
            animation: scanAnim 2s infinite linear;
            z-index: 10;
        }

        @keyframes scanAnim {
            0% { top: 0%; }
            50% { top: 98%; }
            100% { top: 0%; }
        }

        /* SVG наложение поверх картинки */
        #svg-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: auto;
            z-index: 5;
        }

        .found-element {
            fill: rgba(0, 240, 255, 0.15);
            stroke: #00f0ff;
            stroke-width: 2;
            cursor: pointer;
            transition: all 0.3s;
        }

        .found-element:hover {
            fill: rgba(225, 78, 202, 0.4);
            stroke: #e14eca;
            stroke-width: 3;
        }

        .wire-path {
            stroke: #00ff66;
            stroke-dasharray: 6;
            animation: flow 0.8s linear infinite;
        }

        @keyframes flow { to { stroke-dashoffset: -12; } }

        #log { background: #000; color: #00ff66; padding: 10px; border-radius: 4px; font-family: monospace; height: 100px; overflow-y: auto; font-size: 12px; }
    </style>
</head>
<body>

    <h1>🔍 AI Сканер Схем в Реальном Времени</h1>

    <div class="card">
        <label>Gemini API Key: </label>
        <input type="password" id="apiKey" style="width: 280px;">
        <button onclick="saveKey()">Сохранить</button>
        <span id="keyStatus" style="margin-left: 10px; font-weight: bold; color: #ff5e5e;">● Ключ не задан</span>
    </div>

    <div class="card">
        <input type="file" id="imageInput" accept="image/*" onchange="previewImage(this)">
        <button onclick="startScanning()">Запустить Сканирование</button>
    </div>

    <div class="card">
        <h3>Результат сканирования (Интерактивный пласт):</h3>
        <div id="scanner-viewport">
            <img id="uploaded-img" src="" alt="Загрузите схему" style="display:none;">
            <div id="scan-line"></div>
            <svg id="svg-overlay" viewBox="0 0 1000 600"></svg>
        </div>
    </div>

    <div class="card">
        <h3>Лог сканирования:</h3>
        <div id="log">Готов к работе...</div>
    </div>

<script>
    window.onload = () => {
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
            document.getElementById('keyStatus').textContent = "● Ключ подключен";
            document.getElementById('keyStatus').style.color = "#00ff66";
        }
    };

    function saveKey() {
        const key = document.getElementById('apiKey').value.trim();
        if(key) {
            localStorage.setItem('gemini_api_key', key);
            document.getElementById('keyStatus').textContent = "● Ключ подключен";
            document.getElementById('keyStatus').style.color = "#00ff66";
            log("Ключ сохранен!");
        }
    }

    function log(text) {
        const box = document.getElementById('log');
        box.innerHTML += `<div>> ${text}</div>`;
        box.scrollTop = box.scrollHeight;
    }

    function previewImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('uploaded-img');
                img.src = e.target.result;
                img.style.display = 'block';
                document.getElementById('svg-overlay').innerHTML = '';
                log("Изображение загружено. Нажмите 'Запустить Сканирование'.");
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function startScanning() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const fileInput = document.getElementById('imageInput').files[0];

        if (!apiKey || !fileInput) {
            alert('Проверьте наличие ключа и выбранного файла!');
            return;
        }

        // Включаем визуал лазера сканирования
        document.getElementById('scan-line').style.display = 'block';
        log("Запуск оптического сканера...");
        log("Считывание компонентов: VT1, VT2, VD1, R1, R2, C1, C2...");

        const base64Data = await toBase64(fileInput);
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;

        const promptText = `Найти все электронные компоненты на схеме.
        Верни ТОЛЬКО валидный JSON со строгой структурой без кодовых блоков markdown:
        {
          "components": [
            {"label": "R1 750k", "type": "resistor", "x": 180, "y": 320, "width": 80, "height": 40},
            {"label": "VT1 KT315A", "type": "transistor", "x": 520, "y": 350, "width": 70, "height": 70}
          ]
        }
        Система координат: x от 0 до 1000, y от 0 до 600. Укажи точные bounding box (x, y, width, height) для каждого элемента R1, R2, C1, C2, VD1, BF1, GB1, VT1, VT2, E1, E2.`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: promptText },
                            { inline_data: { mime_type: fileInput.type, data: base64Data.split(',')[1] } }
                        ]
                    }]
                })
            });

            const result = await response.json();
            document.getElementById('scan-line').style.display = 'none';

            if (result.error) {
                log("Ошибка: " + result.error.message);
                return;
            }

            let rawText = result.candidates[0].content.parts[0].text;
            let cleanJson = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
            const circuitData = JSON.parse(cleanJson);

            log("Сканирование завершено! Найдено элементов: " + circuitData.components.length);
            renderOverlay(circuitData.components);

        } catch (e) {
            document.getElementById('scan-line').style.display = 'none';
            log("Ошибка обработчика: " + e.message);
        }
    }

    function renderOverlay(components) {
        const svg = document.getElementById('svg-overlay');
        let html = '';

        components.forEach((c, idx) => {
            html += `
                <g class="found-element" onclick="highlightElement('${c.label}')">
                    <rect x="${c.x}" y="${c.y}" width="${c.width}" height="${c.height}" rx="5"/>
                    <text x="${c.x + 5}" y="${c.y - 8}" fill="#00f0ff" font-size="14" font-weight="bold">${c.label}</text>
                </g>
            `;
        });

        svg.innerHTML = html;
    }

    function highlightElement(label) {
        log("Выбран элемент: " + label + " (Готов к симуляции)");
    }

    function toBase64(file) {
        return new Promise((res, rej) => {
            const r = new FileReader();
            r.readAsDataURL(file);
            r.onload = () => res(r.result);
            r.onerror = e => rej(e);
        });
    }
</script>
</body>
</html>
