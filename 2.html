<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Конструктор стрелочных переводов и путей</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      z-index: 10;
    }
    .group {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-right: 10px;
      border-right: 1px solid #334155;
    }
    .group:last-child {
      border-right: none;
    }
    button {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover {
      background: #475569;
    }
    button.active {
      background: #2563eb;
      border-color: #60a5fa;
      color: #ffffff;
      font-weight: 600;
    }
    button.danger {
      background: #7f1d1d;
      border-color: #991b1b;
    }
    button.danger:hover {
      background: #991b1b;
    }
    label {
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    input[type="number"] {
      width: 60px;
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 13px;
    }
    input[type="checkbox"] {
      accent-color: #2563eb;
    }
    #canvas-wrap {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    #switch-panel {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 12px;
      width: 280px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
      z-index: 20;
    }
    #switch-panel h3 {
      font-size: 14px;
      color: #f8fafc;
      margin-bottom: 2px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    #hint {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      color: #cbd5e1;
      pointer-events: none;
      line-height: 1.45;
    }
  </style>
</head>
<body>

  <div id="toolbar">
    <div class="group">
      <button id="tool-switch" class="active" title="Поставить стрелку">🔀 Стрелка</button>
      <button id="tool-track" title="Продолжить путь">🛤 Путь</button>
      <button id="tool-train" title="Поставить поезд">🚆 Поезд</button>
      <button id="tool-delete" class="danger" title="Удалить">🗑 Удалить</button>
    </div>

    <div class="group">
      <label>Колея: <input type="number" id="gauge-input" value="18" min="10" max="40" /></label>
      <label>Угол 1 (°): <input type="number" id="angle1-input" value="0" min="-60" max="60" /></label>
      <label>Угол 2 (°): <input type="number" id="angle2-input" value="-22" min="-60" max="60" /></label>
      <label>Длина: <input type="number" id="len-input" value="180" min="80" max="400" step="10" /></label>
    </div>

    <div class="group">
      <label><input type="checkbox" id="snap-grid" checked /> Сетка</label>
      <button id="btn-reverse">⇄ Реверс</button>
      <button id="btn-pause">⏯ Пауза</button>
      <button id="btn-clear" class="danger">Сброс</button>
    </div>
  </div>

  <div id="canvas-wrap">
    <canvas id="canvas"></canvas>

    <div id="switch-panel">
      <h3>Параметры стрелки</h3>
      <div class="row">
        <span>Маршрут:</span>
        <button id="sp-toggle" style="background:#2563eb; font-weight:600;">Путь 1</button>
      </div>
      <div class="row">
        <span>Угол Пути 1 (°):</span>
        <input type="number" id="sp-ang1" value="0" step="1" />
      </div>
      <div class="row">
        <span>Угол Пути 2 (°):</span>
        <input type="number" id="sp-ang2" value="-22" step="1" />
      </div>
      <div class="row">
        <span>Остряк пож. 1 (отвод):</span>
        <input type="number" id="sp-blade1" value="2.5" min="0" max="8" step="0.5" />
      </div>
      <div class="row">
        <span>Остряк пож. 2 (отвод):</span>
        <input type="number" id="sp-blade2" value="6.0" min="0" max="8" step="0.5" />
      </div>
      <div class="row">
        <span>Длина стрелки:</span>
        <input type="number" id="sp-length" value="180" step="10" />
      </div>
    </div>

    <div id="hint">
      <b>Управление:</b> Клик — поставить стрелку/путь • Клик по приводу — переключить маршрут • Колёсико — масштаб • Пробел + ЛКМ — сдвиг
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const state = {
      tool: 'switch', // 'switch' | 'track' | 'train' | 'delete'
      gauge: 18,
      snapGrid: true,
      gridSize: 20,

      nodes: [],
      edges: [],
      switches: [],

      selectedSwitchId: null,
      draftStartNodeId: null,

      mouseWorld: { x: 0, y: 0 },
      camX: 0,
      camY: 0,
      zoom: 1,
      isPanning: false,
      panStart: { x: 0, y: 0 },
      spacePressed: false,

      train: null,
      nextId: 1
    };

    function genId() { return state.nextId++; }

    function resize() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function screenToWorld(sx, sy) {
      return {
        x: (sx - state.camX) / state.zoom,
        y: (sy - state.camY) / state.zoom
      };
    }

    function snapPoint(x, y) {
      const r = 16 / state.zoom;
      for (const n of state.nodes) {
        if (Math.hypot(n.x - x, n.y - y) <= r) return { x: n.x, y: n.y, nodeId: n.id };
      }
      if (state.snapGrid) {
        return {
          x: Math.round(x / state.gridSize) * state.gridSize,
          y: Math.round(y / state.gridSize) * state.gridSize,
          nodeId: null
        };
      }
      return { x, y, nodeId: null };
    }

    function getNode(id) { return state.nodes.find(n => n.id === id); }
    function getEdge(id) { return state.edges.find(e => e.id === id); }
    function getSwitch(id) { return state.switches.find(s => s.id === id); }

    function getOrCreateNode(x, y) {
      for (const n of state.nodes) {
        if (Math.hypot(n.x - x, n.y - y) < 3) return n;
      }
      const node = { id: genId(), x, y };
      state.nodes.push(node);
      return node;
    }

    function addEdge(fromId, toId, switchId = null, branchIndex = null) {
      if (fromId === toId) return null;
      const exists = state.edges.find(
        e => (e.from === fromId && e.to === toId) || (e.from === toId && e.to === fromId)
      );
      if (exists) return exists;
      const edge = { id: genId(), from: fromId, to: toId, switchId, branchIndex };
      state.edges.push(edge);
      return edge;
    }

    function updateSwitchGeometry(sw) {
      const stem = getNode(sw.stemNodeId);
      const entry = getNode(sw.entryNodeId);
      const tip1 = getNode(sw.tipNode1);
      const tip2 = getNode(sw.tipNode2);
      if (!stem || !tip1 || !tip2) return;

      if (entry) {
        entry.x = stem.x - 60;
        entry.y = stem.y;
      }

      const rad1 = (sw.angle1 * Math.PI) / 180;
      const rad2 = (sw.angle2 * Math.PI) / 180;

      tip1.x = stem.x + Math.cos(rad1) * sw.length;
      tip1.y = stem.y + Math.sin(rad1) * sw.length;

      tip2.x = stem.x + Math.cos(rad2) * sw.length;
      tip2.y = stem.y + Math.sin(rad2) * sw.length;
    }

    function createTurnout(x, y) {
      const ang1 = parseFloat(document.getElementById('angle1-input').value) || 0;
      const ang2 = parseFloat(document.getElementById('angle2-input').value) || -22;
      const length = parseFloat(document.getElementById('len-input').value) || 180;

      const stemNode = getOrCreateNode(x, y);
      const entryNode = getOrCreateNode(x - 60, y);

      const tip1 = { id: genId(), x: 0, y: 0 };
      const tip2 = { id: genId(), x: 0, y: 0 };
      state.nodes.push(tip1, tip2);

      const sw = {
        id: genId(),
        entryNodeId: entryNode.id,
        stemNodeId: stemNode.id,
        tipNode1: tip1.id,
        tipNode2: tip2.id,
        angle1: ang1,
        angle2: ang2,
        length: length,
        bladeOffset1: 2.5,
        bladeOffset2: 6.0,
        activeBranch: 0 // 0 -> Путь 1, 1 -> Путь 2
      };

      updateSwitchGeometry(sw);
      state.switches.push(sw);

      addEdge(entryNode.id, stemNode.id);
      addEdge(stemNode.id, tip1.id, sw.id, 0);
      addEdge(stemNode.id, tip2.id, sw.id, 1);

      selectSwitch(sw.id);
      return sw;
    }

    function selectSwitch(swId) {
      state.selectedSwitchId = swId;
      const panel = document.getElementById('switch-panel');
      const sw = getSwitch(swId);
      if (!sw) {
        panel.style.display = 'none';
        return;
      }
      panel.style.display = 'flex';
      document.getElementById('sp-toggle').textContent = sw.activeBranch === 0 ? 'Путь 1 (Активен)' : 'Путь 2 (Активен)';
      document.getElementById('sp-toggle').style.background = sw.activeBranch === 0 ? '#2563eb' : '#059669';
      document.getElementById('sp-ang1').value = sw.angle1;
      document.getElementById('sp-ang2').value = sw.angle2;
      document.getElementById('sp-blade1').value = sw.bladeOffset1;
      document.getElementById('sp-blade2').value = sw.bladeOffset2;
      document.getElementById('sp-length').value = sw.length;
    }

    // Отрисовка пути с постоянной шириной колеи
    function drawTrackSegment(x1, y1, x2, y2, options = {}) {
      const { isSwitchBranch = false, switchSide = 0, isActive = true } = options;
      const dx = x2 - x1;
      const dy = y2 - y1;
      const len = Math.hypot(dx, dy);
      if (len < 1) return;

      const ux = dx / len;
      const uy = dy / len;
      const nx = -uy;
      const ny = ux;
      const halfG = state.gauge / 2;

      // Балласт
      if (!isSwitchBranch) {
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = state.gauge + 16;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }

      // Шпалы
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (let d = 6; d < len - 4; d += 12) {
        const sx = x1 + ux * d;
        const sy = y1 + uy * d;
        ctx.moveTo(sx + nx * (halfG + 5), sy + ny * (halfG + 5));
        ctx.lineTo(sx - nx * (halfG + 5), sy - ny * (halfG + 5));
      }
      ctx.stroke();

      const drawRail = (ax, ay, bx, by) => {
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 3.6;
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(bx, by);
        ctx.stroke();

        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(bx, by);
        ctx.stroke();
      };

      const lx1 = x1 + nx * halfG, ly1 = y1 + ny * halfG;
      const lx2 = x2 + nx * halfG, ly2 = y2 + ny * halfG;
      const rx1 = x1 - nx * halfG, ry1 = y1 - ny * halfG;
      const rx2 = x2 - nx * halfG, ry2 = y2 - ny * halfG;

      if (!isSwitchBranch) {
        drawRail(lx1, ly1, lx2, ly2);
        drawRail(rx1, ry1, rx2, ry2);
      } else {
        // Внешний рамный рельс цельный, внутренний начинается после остряка
        const rootOff = Math.min(len * 0.32, 50);
        if (switchSide === 0) {
          drawRail(lx1, ly1, lx2, ly2);
          drawRail(rx1 + ux * rootOff, ry1 + uy * rootOff, rx2, ry2);
        } else {
          drawRail(rx1, ry1, rx2, ry2);
          drawRail(lx1 + ux * rootOff, ly1 + uy * rootOff, lx2, ly2);
        }
      }
    }

    // Отрисовка связанных остряков
    function drawSwitchBlades(sw) {
      const stem = getNode(sw.stemNodeId);
      const tip1 = getNode(sw.tipNode1);
      const tip2 = getNode(sw.tipNode2);
      if (!stem || !tip1 || !tip2) return;

      const halfG = state.gauge / 2;
      const bladeLen = Math.min(sw.length * 0.32, 50);

      const dL = Math.hypot(tip1.x - stem.x, tip1.y - stem.y) || 1;
      const ux1 = (tip1.x - stem.x) / dL, uy1 = (tip1.y - stem.y) / dL;
      const nx1 = -uy1, ny1 = ux1;

      const dR = Math.hypot(tip2.x - stem.x, tip2.y - stem.y) || 1;
      const ux2 = (tip2.x - stem.x) / dR, uy2 = (tip2.y - stem.y) / dR;
      const nx2 = -uy2, ny2 = ux2;

      // Корни остряков (шарниры)
      const root1x = stem.x + ux1 * bladeLen - nx1 * halfG;
      const root1y = stem.y + uy1 * bladeLen - ny1 * halfG;
      const root2x = stem.x + ux2 * bladeLen + nx2 * halfG;
      const root2y = stem.y + uy2 * bladeLen + ny2 * halfG;

      // Острия лепестков (с учетом выбранного положения activeBranch)
      const off1 = sw.activeBranch === 0 ? 1.2 : sw.bladeOffset1;
      const off2 = sw.activeBranch === 1 ? 1.2 : sw.bladeOffset2;

      const tip1x = stem.x + ux1 * 6 + nx1 * (halfG - off1);
      const tip1y = stem.y + uy1 * 6 + ny1 * (halfG - off1);
      const tip2x = stem.x + ux2 * 6 - nx2 * (halfG - off2);
      const tip2y = stem.y + uy2 * 6 - ny2 * (halfG - off2);

      // Переводная тяга
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(tip1x, tip1y);
      ctx.lineTo(tip2x, tip2y);
      ctx.stroke();

      // Привод сбоку
      const boxX = stem.x + ux2 * 8 - nx2 * (halfG + 16);
      const boxY = stem.y + uy2 * 8 - ny2 * (halfG + 16);
      ctx.fillStyle = sw.id === state.selectedSwitchId ? '#2563eb' : '#334155';
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 1.2;
      ctx.fillRect(boxX - 6, boxY - 6, 12, 12);
      ctx.strokeRect(boxX - 6, boxY - 6, 12, 12);

      const drawBlade = (ax, ay, bx, by) => {
        ctx.strokeStyle = '#334155'; ctx.lineWidth = 3.2;
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
        ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
      };

      drawBlade(root1x, root1y, tip1x, tip1y);
      drawBlade(root2x, root2y, tip2x, tip2y);
    }

    function updateTrain(dt) {
      if (!state.train || state.train.paused) return;
      let edge = getEdge(state.train.edgeId);
      if (!edge) { state.train = null; return; }

      const a = getNode(edge.from), b = getNode(edge.to);
      const len = Math.hypot(b.x - a.x, b.y - a.y) || 1;
      state.train.dist += state.train.speed * state.train.dir * dt;

      while (state.train && (state.train.dist > len || state.train.dist < 0)) {
        const forward = state.train.dist > len;
        const overflow = forward ? state.train.dist - len : -state.train.dist;
        const arrivalNodeId = forward ? edge.to : edge.from;

        const candidates = state.edges.filter(
          e => e.id !== edge.id && (e.from === arrivalNodeId || e.to === arrivalNodeId)
        );

        if (candidates.length === 0) {
          state.train.dir *= -1;
          state.train.dist = Math.max(0, Math.min(len, state.train.dist));
          break;
        }

        const swAtNode = state.switches.find(s => s.stemNodeId === arrivalNodeId);
        let nextEdge = null;

        if (swAtNode) {
          const branchEdges = candidates.filter(e => e.switchId === swAtNode.id);
          if (branchEdges.length > 0 && edge.switchId !== swAtNode.id) {
            nextEdge = branchEdges.find(e => e.branchIndex === swAtNode.activeBranch) || branchEdges[0];
          } else {
            nextEdge = candidates.find(e => e.switchId !== swAtNode.id) || candidates[0];
          }
        } else {
          nextEdge = candidates[0];
        }

        edge = nextEdge;
        state.train.edgeId = edge.id;
        const na = getNode(edge.from), nb = getNode(edge.to);
        const nextLen = Math.hypot(nb.x - na.x, nb.y - na.y) || 1;

        if (edge.from === arrivalNodeId) {
          state.train.dir = 1;
          state.train.dist = overflow;
        } else {
          state.train.dir = -1;
          state.train.dist = nextLen - overflow;
        }
      }
    }

    function drawTrain() {
      if (!state.train) return;
      const edge = getEdge(state.train.edgeId);
      if (!edge) return;
      const a = getNode(edge.from), b = getNode(edge.to);
      const len = Math.hypot(b.x - a.x, b.y - a.y) || 1;
      const t = Math.max(0, Math.min(1, state.train.dist / len));

      const x = a.x + (b.x - a.x) * t;
      const y = a.y + (b.y - a.y) * t;
      const angle = Math.atan2(b.y - a.y, b.x - a.x) + (state.train.dir < 0 ? Math.PI : 0);

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);

      const bodyW = 44, bodyH = state.gauge + 6;
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(-bodyW / 2 + 2, -bodyH / 2 + 3, bodyW, bodyH);

      ctx.fillStyle = '#dc2626';
      ctx.strokeStyle = '#fca5a5';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(-bodyW / 2, -bodyH / 2, bodyW, bodyH, 4);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#991b1b';
      ctx.fillRect(-bodyW / 2 + 6, -bodyH / 2 + 3, bodyW - 14, bodyH - 6);

      ctx.fillStyle = '#fef08a';
      ctx.beginPath();
      ctx.arc(bodyW / 2 - 2, 0, 2.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;

      updateTrain(dt);

      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(state.camX, state.camY);
      ctx.scale(state.zoom, state.zoom);

      // Сетка
      if (state.snapGrid) {
        const startX = Math.floor(-state.camX / state.zoom / state.gridSize) * state.gridSize;
        const startY = Math.floor(-state.camY / state.zoom / state.gridSize) * state.gridSize;
        const endX = startX + canvas.width / state.zoom + state.gridSize * 2;
        const endY = startY + canvas.height / state.zoom + state.gridSize * 2;

        ctx.strokeStyle = 'rgba(51, 65, 85, 0.35)';
        ctx.lineWidth = 1 / state.zoom;
        ctx.beginPath();
        for (let gx = startX; gx < endX; gx += state.gridSize) {
          ctx.moveTo(gx, startY); ctx.lineTo(gx, endY);
        }
        for (let gy = startY; gy < endY; gy += state.gridSize) {
          ctx.moveTo(startX, gy); ctx.lineTo(endX, gy);
        }
        ctx.stroke();
      }

      // Обычные пути
      for (const e of state.edges) {
        if (e.switchId !== null) continue;
        const a = getNode(e.from), b = getNode(e.to);
        if (!a || !b) continue;
        drawTrackSegment(a.x, a.y, b.x, b.y);
      }

      // Стрелочные ветви
      for (const sw of state.switches) {
        const stem = getNode(sw.stemNodeId);
        const tip1 = getNode(sw.tipNode1);
        const tip2 = getNode(sw.tipNode2);
        if (!stem || !tip1 || !tip2) continue;

        drawTrackSegment(stem.x, stem.y, tip1.x, tip1.y, {
          isSwitchBranch: true, switchSide: 0, isActive: sw.activeBranch === 0
        });
        drawTrackSegment(stem.x, stem.y, tip2.x, tip2.y, {
          isSwitchBranch: true, switchSide: 1, isActive: sw.activeBranch === 1
        });

        drawSwitchBlades(sw);
      }

      // Предпросмотр пути
      if (state.tool === 'track' && state.draftStartNodeId !== null) {
        const startNode = getNode(state.draftStartNodeId);
        if (startNode) {
          const snapped = snapPoint(state.mouseWorld.x, state.mouseWorld.y);
          ctx.save();
          ctx.globalAlpha = 0.65;
          drawTrackSegment(startNode.x, startNode.y, snapped.x, snapped.y);
          ctx.restore();
        }
      }

      // Узлы
      for (const n of state.nodes) {
        const isSwitchStem = state.switches.some(s => s.stemNodeId === n.id);
        ctx.fillStyle = isSwitchStem ? '#f59e0b' : '#64748b';
        ctx.beginPath();
        ctx.arc(n.x, n.y, isSwitchStem ? 5 : 4, 0, Math.PI * 2);
        ctx.fill();
      }

      drawTrain();
      ctx.restore();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // События
    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const sx = e.clientX - rect.left, sy = e.clientY - rect.top;

      if (e.button === 1 || (e.button === 0 && state.spacePressed)) {
        state.isPanning = true;
        state.panStart = { x: sx - state.camX, y: sy - state.camY };
        return;
      }
      if (e.button === 2) { state.draftStartNodeId = null; return; }
      if (e.button !== 0) return;

      const world = screenToWorld(sx, sy);
      const snapped = snapPoint(world.x, world.y);

      if (state.tool === 'switch') {
        createTurnout(snapped.x, snapped.y);
      } else if (state.tool === 'track') {
        if (state.draftStartNodeId === null) {
          const node = snapped.nodeId ? getNode(snapped.nodeId) : getOrCreateNode(snapped.x, snapped.y);
          state.draftStartNodeId = node.id;
        } else {
          const endNode = snapped.nodeId ? getNode(snapped.nodeId) : getOrCreateNode(snapped.x, snapped.y);
          addEdge(state.draftStartNodeId, endNode.id);
          state.draftStartNodeId = endNode.id;
        }
      } else if (state.tool === 'train') {
        // Ищем ребро для поезда
        let bestEdge = null, minDist = 20;
        for (const e of state.edges) {
          const a = getNode(e.from), b = getNode(e.to);
          if (!a || !b) continue;
          // Упрощенная проверка близости
          const d = Math.hypot((a.x+b.x)/2 - world.x, (a.y+b.y)/2 - world.y);
          if (d < minDist) { minDist = d; bestEdge = e; }
        }
        if (bestEdge) {
          const a = getNode(bestEdge.from), b = getNode(bestEdge.to);
          const len = Math.hypot(b.x - a.x, b.y - a.y) || 1;
          state.train = { edgeId: bestEdge.id, dist: len * 0.5, dir: 1, speed: 120, paused: false };
        }
      } else if (state.tool === 'delete') {
        for (let i = state.switches.length - 1; i >= 0; i--) {
          const sw = state.switches[i];
          const stem = getNode(sw.stemNodeId);
          if (stem && Math.hypot(stem.x - world.x, stem.y - world.y) < 20) {
            state.edges = state.edges.filter(e => e.switchId !== sw.id);
            state.switches.splice(i, 1);
            selectSwitch(null);
            return;
          }
        }
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
      if (state.isPanning) {
        state.camX = sx - state.panStart.x;
        state.camY = sy - state.panStart.y;
        return;
      }
      state.mouseWorld = screenToWorld(sx, sy);
    });

    window.addEventListener('mouseup', () => { state.isPanning = false; });
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
      const before = screenToWorld(sx, sy);
      const factor = e.deltaY < 0 ? 1.12 : 0.89;
      state.zoom = Math.max(0.3, Math.min(3.0, state.zoom * factor));
      state.camX = sx - before.x * state.zoom;
      state.camY = sy - before.y * state.zoom;
    }, { passive: false });

    window.addEventListener('keydown', e => { if (e.code === 'Space') state.spacePressed = true; });
    window.addEventListener('keyup', e => { if (e.code === 'Space') state.spacePressed = false; });

    // Инструменты
    const toolButtons = {
      switch: document.getElementById('tool-switch'),
      track: document.getElementById('tool-track'),
      train: document.getElementById('tool-train'),
      delete: document.getElementById('tool-delete')
    };

    function setTool(name) {
      state.tool = name;
      state.draftStartNodeId = null;
      Object.entries(toolButtons).forEach(([k, btn]) => btn.classList.toggle('active', k === name));
    }
    Object.entries(toolButtons).forEach(([k, btn]) => btn.addEventListener('click', () => setTool(k)));

    document.getElementById('gauge-input').addEventListener('input', e => {
      state.gauge = Math.max(10, Math.min(40, parseFloat(e.target.value) || 18));
    });

    // Панель настроек стрелки
    document.getElementById('sp-toggle').addEventListener('click', () => {
      const sw = getSwitch(state.selectedSwitchId);
      if (!sw) return;
      sw.activeBranch = sw.activeBranch === 0 ? 1 : 0;
      selectSwitch(sw.id);
    });

    document.getElementById('sp-ang1').addEventListener('input', e => {
      const sw = getSwitch(state.selectedSwitchId);
      if (!sw) return;
      sw.angle1 = parseFloat(e.target.value) || 0;
      updateSwitchGeometry(sw);
    });

    document.getElementById('sp-ang2').addEventListener('input', e => {
      const sw = getSwitch(state.selectedSwitchId);
      if (!sw) return;
      sw.angle2 = parseFloat(e.target.value) || 0;
      updateSwitchGeometry(sw);
    });

    document.getElementById('sp-blade1').addEventListener('input', e => {
      const sw = getSwitch(state.selectedSwitchId);
      if (!sw) return;
      sw.bladeOffset1 = parseFloat(e.target.value) || 2.5;
    });

    document.getElementById('sp-blade2').addEventListener('input', e => {
      const sw = getSwitch(state.selectedSwitchId);
      if (!sw) return;
      sw.bladeOffset2 = parseFloat(e.target.value) || 6.0;
    });

    document.getElementById('sp-length').addEventListener('input', e => {
      const sw = getSwitch(state.selectedSwitchId);
      if (!sw) return;
      sw.length = Math.max(80, parseFloat(e.target.value) || 180);
      updateSwitchGeometry(sw);
    });

    document.getElementById('btn-reverse').addEventListener('click', () => { if (state.train) state.train.dir *= -1; });
    document.getElementById('btn-pause').addEventListener('click', () => { if (state.train) state.train.paused = !state.train.paused; });
    document.getElementById('btn-clear').addEventListener('click', () => {
      state.nodes = []; state.edges = []; state.switches = []; state.train = null; selectSwitch(null);
    });

    // Старт
    createTurnout(canvas.width / 2 - 100, canvas.height / 2);
  </script>
</body>
</html>
