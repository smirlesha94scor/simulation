<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Симуляція крана, сканування та видачі</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            align-items: flex-start;
        }
        canvas {
            border: 2px solid #555;
            background: #050505;
        }
        .panel {
            width: 250px;
            background: #222;
            border: 2px solid #444;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        h2 {
            margin-top: 0;
            font-size: 18px;
            text-align: center;
        }
        .box-item {
            background: #1a1a1a;
            padding: 8px;
            border-left: 5px solid #555;
            cursor: pointer;
            font-size: 13px;
        }
        .box-item:hover {
            background: #2a2a2a;
        }
        .box-item.selected {
            background: #333;
            border-color: #fff;
        }
        button {
            background: #00aa55;
            color: white;
            border: none;
            padding: 10px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background: #00cc66;
        }
        button.secondary {
            background: #aa3333;
        }
        button.secondary:hover {
            background: #cc4444;
        }
        .controls-hint {
            margin-top: 10px;
            font-size: 13px;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Автоматизований складський кран зі сканером</h2>
    
    <div class="container">
        <!-- Холст для симуляції -->
        <canvas id="gameCanvas" width="750" height="400"></canvas>

        <!-- Адаптивна бічна панель -->
        <div class="panel">
            <h3>СПИСОК ВАНТАЖІВ</h3>
            <div id="boxList" style="display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto;">
                <!-- Динамічний список -->
            </div>
            <button id="startBtn">Знайти та забрати</button>
            <button id="clearBtn" class="secondary">Забрати з зони видачі</button>
        </div>
    </div>

    <div class="controls-hint">
        Виберіть коробку у списку, натисніть <b>«Знайти та забрати»</b>. Після доставки натисніть <b>«Забрати з зони видачі»</b>, щоб з'явилися нові вантажі!
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let nextId = 1;
// Початковий список коробок
let boxes = [
    { id: nextId++, name: "Коробка #001", x: 100, y: 260, width: 60, height: 50, color: "#ff5555", status: "warehouse" },
    { id: nextId++, name: "Коробка #002", x: 220, y: 250, width: 70, height: 60, color: "#55ff55", status: "warehouse" },
    { id: nextId++, name: "Коробка #003", x: 350, y: 270, width: 80, height: 40, color: "#5555ff", status: "warehouse" }
];

let selectedCard = boxes[0];

// Зона видачі (праворуч)
const dropZone = {
    x: 520,
    y: 270,
    width: 90,
    height: 50,
    currentBox: null // Коробка, яка зараз знаходиться у зоні видачі
};

const HOME_X = 60;

const crane = {
    x: HOME_X,
    hookY: 50,
    targetHookY: 50,
    state: "IDLE", // IDLE, SCANNING_SEARCH, LOWERING, GRABBING, LIFTING, MOVING_TO_DROP, LOWERING_DROP, RELEASING, RETURN_HOME
    holding: null,
    scannedBox: null
};

// Оновлення списку в HTML-панелі
function updateBoxListUI() {
    const listContainer = document.getElementById("boxList");
    listContainer.innerHTML = "";

    boxes.forEach(box => {
        if (box.status === "warehouse") {
            const div = document.createElement("div");
            div.className = `box-item ${box === selectedCard ? 'selected' : ''}`;
            div.style.borderLeftColor = box.color;
            div.innerHTML = `<b>${box.name}</b><br><span style="color:#aaa;">Статус: На складі</span>`;
            div.onclick = () => {
                if (crane.state === "IDLE") {
                    selectedCard = box;
                    updateBoxListUI();
                }
            };
            listContainer.appendChild(div);
        }
    });
}

// Кнопки керування
document.getElementById("startBtn").onclick = () => {
    if (crane.state === "IDLE" && selectedCard && selectedCard.status === "warehouse") {
        crane.state = "SCANNING_SEARCH";
    }
};

document.getElementById("clearBtn").onclick = () => {
    // Забрати вантаж з зони видачі та згенерувати від 1 до 3 нових
    if (dropZone.currentBox !== null && crane.state === "IDLE") {
        // Видаляємо доставлену коробку повністю зі списку
        boxes = boxes.filter(b => b !== dropZone.currentBox);
        dropZone.currentBox = null;

        // Генеруємо від 1 до 3 нових коробок
        let newCount = Math.floor(Math.random() * 3) + 1; // 1, 2 або 3
        let colors = ["#ff55aaff", "#ffa755", "#55ffff", "#cc55ff", "#ffff55"];
        
        for (let i = 0; i < newCount; i++) {
            let randomWidth = Math.floor(Math.random() * 30) + 50;
            let randomHeight = Math.floor(Math.random() * 30) + 40;
            let randomX = 80 + Math.random() * 380; // В межах складу
            let randomColor = colors[Math.floor(Math.random() * colors.length)];

            let newBox = {
                id: nextId++,
                name: `Коробка #00${nextId-1}`,
                x: randomX,
                y: 320 - randomHeight,
                width: randomWidth,
                height: randomHeight,
                color: randomColor,
                status: "warehouse"
            };
            boxes.push(newBox);
        }

        // Обираємо першу доступну за замовчуванням
        let available = boxes.filter(b => b.status === "warehouse");
        if (available.length > 0) {
            selectedCard = available[0];
        }
        updateBoxListUI();
    }
};

function update() {
    if (crane.state === "IDLE") return;

    switch (crane.state) {
        case "SCANNING_SEARCH":
            if (crane.x < 500) {
                crane.x += 2;

                boxes.forEach(box => {
                    if (box.status === "warehouse" && crane.x >= box.x && crane.x <= box.x + box.width) {
                        if (box.id === selectedCard.id) {
                            crane.scannedBox = box;
                            crane.state = "LOWERING";
                            crane.targetHookY = box.y;
                        }
                    }
                });
            } else {
                crane.state = "RETURN_HOME";
            }
            break;

        case "LOWERING":
            if (crane.hookY < crane.targetHookY) {
                crane.hookY += 2;
            } else {
                crane.state = "GRABBING";
            }
            break;

        case "GRABBING":
            crane.holding = crane.scannedBox;
            crane.state = "LIFTING";
            crane.targetHookY = 50;
            break;

        case "LIFTING":
            if (crane.hookY > crane.targetHookY) {
                crane.hookY -= 2;
                if (crane.holding) crane.holding.y = crane.hookY;
            } else {
                crane.state = "MOVING_TO_DROP";
            }
            break;

        case "MOVING_TO_DROP":
            let dropX = dropZone.x + dropZone.width / 2;
            if (crane.x < dropX) {
                crane.x += 2;
                if (crane.holding) crane.holding.x = crane.x - selectedCard.width / 2;
            } else {
                crane.state = "LOWERING_DROP";
                crane.targetHookY = dropZone.y - selectedCard.height;
            }
            break;

        case "LOWERING_DROP":
            if (crane.hookY < crane.targetHookY) {
                crane.hookY += 2;
                if (crane.holding) crane.holding.y = crane.hookY;
            } else {
                crane.state = "RELEASING";
            }
            break;

        case "RELEASING":
            if (crane.holding) {
                crane.holding.y = dropZone.y - selectedCard.height;
                crane.holding.status = "delivered";
                dropZone.currentBox = crane.holding;
                crane.holding = null;
            }
            crane.state = "RETURN_HOME";
            crane.targetHookY = 50;
            break;

        case "RETURN_HOME":
            if (crane.hookY > 50) {
                crane.hookY -= 2;
            } else if (Math.abs(crane.x - HOME_X) > 1) {
                crane.x += (HOME_X > crane.x) ? 2 : -2;
            } else {
                crane.state = "IDLE";
                updateBoxListUI();
            }
            break;
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. Поверхня землі
    ctx.fillStyle = "#333";
    ctx.fillRect(0, 320, canvas.width, 20);

    // 2. Зона видачі
    ctx.fillStyle = "rgba(0, 255, 100, 0.15)";
    ctx.fillRect(dropZone.x, dropZone.y, dropZone.width, dropZone.height);
    ctx.strokeStyle = "#00ff66";
    ctx.setLineDash([4, 4]);
    ctx.strokeRect(dropZone.x, dropZone.y, dropZone.width, dropZone.height);
    ctx.setLineDash([]);
    ctx.fillStyle = "#00ff66";
    ctx.font = "10px sans-serif";
    ctx.fillText("ЗОНА ВИДАЧІ", dropZone.x + 10, dropZone.y + 30);

    // 3. Коробки (тільки ті, що на складі або в процесі перенесення)
    boxes.forEach(box => {
        if (box.status === "warehouse" || box === crane.holding || box === dropZone.currentBox) {
            ctx.fillStyle = box.color;
            ctx.fillRect(box.x, box.y, box.width, box.height);
            
            if (box === selectedCard && crane.state === "IDLE" && box.status === "warehouse") {
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 2;
                ctx.strokeRect(box.x - 2, box.y - 2, box.width + 4, box.height + 4);
                ctx.lineWidth = 1;
            }

            ctx.fillStyle = "#000";
            ctx.font = "10px sans-serif";
            ctx.fillText(box.id, box.x + 5, box.y + 20);
        }
    });

    // 4. Рейка і кран
    ctx.fillStyle = "#555";
    ctx.fillRect(0, 20, canvas.width, 10);

    ctx.fillStyle = "#00ffff";
    ctx.fillRect(crane.x - 15, 15, 30, 20);

    // Промінь сканера
    ctx.strokeStyle = (crane.state === "SCANNING_SEARCH") ? "#ff00ff" : "#00ffff";
    ctx.lineWidth = (crane.state === "SCANNING_SEARCH") ? 3 : 1;
    ctx.beginPath();
    ctx.moveTo(crane.x, 35);
    ctx.lineTo(crane.x, crane.hookY);
    ctx.stroke();
    ctx.lineWidth = 1;

    // Гак
    ctx.fillStyle = "#ffcc00";
    ctx.fillRect(crane.x - 8, crane.hookY, 16, 10);

    // Статус на екрані
    ctx.fillStyle = "#00ffcc";
    ctx.font = "11px monospace";
    ctx.fillText(`Статус: ${crane.state}`, 20, 375);
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// Ініціалізація списку при старті
updateBoxListUI();
gameLoop();
</script>

</body>
</html>
