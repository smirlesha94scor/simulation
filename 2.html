<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live ASCII to SVG Schematic Generator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', monospace, sans-serif; background: #1e1e24; color: #fff; height: 100vh; display: flex; flex-direction: column; }
        header { background: #2a2a32; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3a3a46; }
        h1 { font-size: 16px; color: #61afef; font-weight: 600; }
        .main { display: flex; flex: 1; overflow: hidden; }
        .editor-pane { width: 45%; border-right: 1px solid #3a3a46; display: flex; flex-direction: column; background: #25252d; }
        .pane-title { background: #1e1e24; padding: 8px 15px; font-size: 12px; color: #abb2bf; font-weight: bold; text-transform: uppercase; border-bottom: 1px solid #3a3a46; }
        textarea { flex: 1; background: #18181c; color: #98c379; border: none; padding: 15px; font-family: 'Courier New', Courier, monospace; font-size: 14px; line-height: 1.2; resize: none; outline: none; white-space: pre; }
        .preview-pane { flex: 1; background: #141416; display: flex; flex-direction: column; }
        .canvas-wrapper { flex: 1; overflow: auto; display: flex; justify-content: center; align-items: center; padding: 20px; }
        #svg-output { background: #ffffff; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 4px; }
        .legend { background: #25252d; padding: 10px 15px; border-top: 1px solid #3a3a46; font-size: 11px; color: #abb2bf; display: flex; gap: 15px; flex-wrap: wrap; }
        .legend span { background: #1e1e24; padding: 2px 6px; border-radius: 3px; color: #61afef; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Генератор схем в реальном времени (ASCII ➔ SVG)</h1>
        <button onclick="copySVG()" style="background:#61afef; color:#fff; border:none; padding:6px 12px; border-radius:4px; font-weight:bold; cursor:pointer;">📋 Копировать SVG</button>
    </header>

    <div class="main">
        <div class="editor-pane">
            <div class="pane-title">Текстовый ввод (ASCII Схема)</div>
            <textarea id="ascii-input" spellcheck="false" placeholder="Вводите текст схемы сюда..."></textarea>
        </div>
        
        <div class="preview-pane">
            <div class="pane-title">Реальное время (SVG Отрисовка)</div>
            <div class="canvas-wrapper">
                <svg id="svg-output" width="650" height="450" viewBox="0 0 650 450" xmlns="http://www.w3.org/2000/svg">
                    <g id="render-layer"></g>
                </svg>
            </div>
            <div class="legend">
                <div>Проводники: <span>-</span> <span>|</span> <span>+</span></div>
                <div>Элементы: <span>[R1]</span> <span>[C1]</span> <span>[VD1]</span> <span>[VT1] (NPN)</span> <span>[VT2] (PNP)</span> <span>[BF1]</span> <span>[GB1]</span></div>
            </div>
        </div>
    </div>

    <script>
        const defaultText = 
`       +------------+-----------+
       |            |           |
     [VD1]        [BF1]       [GB1]
       |            |           |
       |            | (Коллектор)
       +---[R1]----[VT1] (База) |
       |            | (Эмиттер) |
      [C1]          |           |
       |            |           |
       +------------+-----------+`;

        const textarea = document.getElementById('ascii-input');
        const renderLayer = document.getElementById('render-layer');
        const svgOutput = document.getElementById('svg-output');

        textarea.value = defaultText;

        const CELL_SIZE = 24;

        function parseAndRender() {
            const text = textarea.value;
            const lines = text.split('\n');
            
            const maxCols = Math.max(...lines.map(l => l.length), 10);
            const maxRows = Math.max(lines.length, 10);
            
            const width = Math.max(maxCols * CELL_SIZE + 40, 400);
            const height = Math.max(maxRows * CELL_SIZE + 40, 300);

            svgOutput.setAttribute('width', width);
            svgOutput.setAttribute('height', height);
            svgOutput.setAttribute('viewBox', `0 0 ${width} ${height}`);

            let html = '';

            // 1. Отрисовка линий проводников
            for (let r = 0; r < lines.length; r++) {
                for (let c = 0; c < lines[r].length; c++) {
                    const ch = lines[r][c];
                    const x = c * CELL_SIZE + 30;
                    const y = r * CELL_SIZE + 30;

                    if (ch === '-') {
                        html += `<line x1="${x - CELL_SIZE/2}" y1="${y}" x2="${x + CELL_SIZE/2}" y2="${y}" stroke="#000" stroke-width="2.5"/>`;
                    } else if (ch === '|') {
                        html += `<line x1="${x}" y1="${y - CELL_SIZE/2}" x2="${x}" y2="${y + CELL_SIZE/2}" stroke="#000" stroke-width="2.5"/>`;
                    } else if (ch === '+') {
                        html += `<line x1="${x - CELL_SIZE/2}" y1="${y}" x2="${x + CELL_SIZE/2}" y2="${y}" stroke="#000" stroke-width="2.5"/>`;
                        html += `<line x1="${x}" y1="${y - CELL_SIZE/2}" x2="${x}" y2="${y + CELL_SIZE/2}" stroke="#000" stroke-width="2.5"/>`;
                        html += `<circle cx="${x}" cy="${y}" r="3" fill="#000"/>`;
                    }
                }
            }

            // 2. Распознавание радиокомпонентов [НАЗВАНИЕ]
            const compRegex = /\[([^\]]+)\]/g;
            for (let r = 0; r < lines.length; r++) {
                let match;
                while ((match = compRegex.exec(lines[r])) !== null) {
                    const name = match[1].trim();
                    const startCol = match.index;
                    const endCol = match.index + match[0].length;
                    
                    const startX = startCol * CELL_SIZE + 30;
                    const endX = (endCol - 1) * CELL_SIZE + 30;
                    const centerX = (startX + endX) / 2;
                    const centerY = r * CELL_SIZE + 30;

                    html += renderComponent(name, centerX, centerY);
                }
            }

            renderLayer.innerHTML = html;
        }

        function renderComponent(name, x, y) {
            let svg = '';
            const type = name.toUpperCase();

            if (type.startsWith('VT1')) { 
                // NPN (VT1): Коллектор (сверху), База (слева), Эмиттер (снизу со стрелкой наружу по центру линии)
                svg = `<rect x="${x-18}" y="${y-18}" width="36" height="36" fill="#fff" opacity="0"/>
                       <circle cx="${x}" cy="${y}" r="16" fill="#fff" stroke="#000" stroke-width="2"/>
                       <line x1="${x-6}" y1="${y-9}" x2="${x-6}" y2="${y+9}" stroke="#000" stroke-width="3.5"/>
                       <line x1="${x-18}" y1="${y}" x2="${x-6}" y2="${y}" stroke="#000" stroke-width="2.5"/>
                       <line x1="${x-6}" y1="${y-4}" x2="${x+6}" y2="${y-12}" stroke="#000" stroke-width="2.5"/>
                       <line x1="${x+6}" y1="${y-12}" x2="${x+6}" y2="${y-20}" stroke="#000" stroke-width="2.5"/>
                       <line x1="${x-6}" y1="${y+4}" x2="${x+6}" y2="${y+12}" stroke="#000" stroke-width="2.5"/>
                       <line x1="${x+6}" y1="${y+12}" x2="${x+6}" y2="${y+20}" stroke="#000" stroke-width="2.5"/>
                       <polygon points="${x+6},${y+12} ${x+1},${y+7} ${x+5},${y+3}" fill="#000"/>
                       <text x="${x+22}" y="${y+4}" font-size="11" font-weight="bold" font-family="Arial">${name}</text>`;
            } else if (type.startsWith('VT2')) { 
                // PNP (VT2): Коллектор (сверху), База (слева), Эмиттер (снизу со стрелкой вовнутрь)
                svg = `<rect x="${x-18}" y="${y-18}" width="36" height="36" fill="#fff" opacity="0"/>
                       <circle cx="${x}" cy="${y}" r="16" fill="#fff" stroke="#000" stroke-width="2"/>
                       <line x1="${x-6}" y1="${y-9}" x2="${x-6}" y2="${y+9}" stroke="#000" stroke-width="3.5"/>
                       <line x1="${x-18}" y1="${y}" x2="${x-6}" y2="${y}" stroke="#000" stroke-width="2.5"/>
                       <line x1="${x-6}" y1="${y-4}" x2="${x+6}" y2="${y-12}" stroke="#000" stroke-width="2.5"/>
                       <line x1="${x+6}" y1="${y-12}" x2="${x+6}" y2="${y-20}" stroke="#000" stroke-width="2.5"/>
                       <line x1="${x-6}" y1="${y+4}" x2="${x+6}" y2="${y+12}" stroke="#000" stroke-width="2.5"/>
                       <line x1="${x+6}" y1="${y+12}" x2="${x+6}" y2="${y+20}" stroke="#000" stroke-width="2.5"/>
                       <polygon points="${x-6},${y+4} ${x-1},${y} ${x+1},${y+5}" fill="#000"/>
                       <text x="${x+22}" y="${y+4}" font-size="11" font-weight="bold" font-family="Arial">${name}</text>`;
            } else if (type.startsWith('R')) {
                svg = `<rect x="${x-18}" y="${y-7}" width="36" height="14" fill="#fff" stroke="#000" stroke-width="2.5"/>
                       <text x="${x}" y="${y+22}" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial">${name}</text>`;
            } else if (type.startsWith('C')) {
                svg = `<rect x="${x-12}" y="${y-12}" width="24" height="24" fill="#fff"/>
                       <line x1="${x-5}" y1="${y-10}" x2="${x-5}" y2="${y+10}" stroke="#000" stroke-width="3"/>
                       <line x1="${x+5}" y1="${y-10}" x2="${x+5}" y2="${y+10}" stroke="#000" stroke-width="3"/>
                       <text x="${x}" y="${y+24}" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial">${name}</text>`;
            } else if (type.startsWith('VD')) {
                svg = `<rect x="${x-12}" y="${y-10}" width="24" height="20" fill="#fff"/>
                       <polygon points="${x-8},${y-6} ${x+4},${y} ${x-8},${y+6}" fill="#000"/>
                       <line x1="${x+4}" y1="${y-7}" x2="${x+4}" y2="${y+7}" stroke="#000" stroke-width="2.5"/>
                       <text x="${x}" y="${y+22}" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial">${name}</text>`;
            } else if (type.startsWith('BF')) {
                svg = `<rect x="${x-12}" y="${y-10}" width="24" height="20" fill="#fff" stroke="#000" stroke-width="2"/>
                       <text x="${x}" y="${y+24}" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial">${name}</text>`;
            } else if (type.startsWith('GB')) {
                svg = `<line x1="${x-10}" y1="${y-10}" x2="${x+10}" y2="${y-10}" stroke="#000" stroke-width="3"/>
                       <line x1="${x-5}" y1="${y-5}" x2="${x+5}" y2="${y-5}" stroke="#000" stroke-width="1.5"/>
                       <line x1="${x-10}" y1="${y}" x2="${x+10}" y2="${y}" stroke="#000" stroke-width="3"/>
                       <line x1="${x-5}" y1="${y+5}" x2="${x+5}" y2="${y+5}" stroke="#000" stroke-width="1.5"/>
                       <text x="${x}" y="${y+24}" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial">${name}</text>`;
            } else {
                svg = `<rect x="${x-15}" y="${y-8}" width="30" height="16" fill="#fff" stroke="#000" stroke-width="1.5"/>
                       <text x="${x}" y="${y+4}" font-size="10" font-weight="bold" text-anchor="middle" font-family="Arial">${name}</text>`;
            }

            return svg;
        }

        function copySVG() {
            navigator.clipboard.writeText(svgOutput.outerHTML);
            alert("SVG код скопирован!");
        }

        textarea.addEventListener('input', parseAndRender);
        parseAndRender();
    </script>
</body>
</html>
