<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Реалистичный поезд 2D</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            background: #1a1a2e;
            font-family: sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Сцена */
        .scene {
            position: relative;
            width: 100%;
            max-width: 1000px;
            height: 400px;
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
            overflow: hidden;
            border-bottom: 5px solid #333;
        }

        /* Небо и облака (медленный параллакс) */
        .clouds {
            position: absolute;
            top: 20px;
            width: 200%;
            height: 100px;
            background: repeating-linear-gradient(90deg, transparent, transparent 150px, rgba(255,255,255,0.4) 150px, rgba(255,255,255,0.4) 300px);
            animation: moveClouds 20s linear infinite;
        }

        /* Задний план (горы / холмы) */
        .hills {
            position: absolute;
            bottom: 80px;
            width: 200%;
            height: 150px;
            background: repeating-linear-gradient(90deg, #4a7c59, #6b9ac4 300px, #4a7c59 600px);
            clip-path: polygon(0 100%, 0 40%, 15% 20%, 30% 60%, 45% 30%, 60% 70%, 75% 10%, 90% 50%, 100% 30%, 100% 100%);
            animation: moveHills 10s linear infinite;
            opacity: 0.7;
        }

        /* Земля */
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            background: #555;
            border-top: 4px solid #222;
        }

        /* Рельсы и шпалы */
        .tracks {
            position: absolute;
            bottom: 70px;
            width: 200%;
            height: 15px;
            background: #222;
            background-image: repeating-linear-gradient(90deg, #111, #111 20px, #fff 20px, #fff 25px);
            animation: moveTracks 1.5s linear infinite;
        }

        /* Поезд в сборе */
        .train {
            position: absolute;
            bottom: 75px;
            left: 150px;
            display: flex;
            align-items: flex-end;
            /* Легкое покачивание поезда для реализма */
            animation: shake 0.5s ease-in-out infinite alternate;
        }

        /* Вагоны / Локомотив */
        .car {
            position: relative;
            height: 120px;
            background: #b22222;
            border-radius: 10px 10px 0 0;
            margin-right: 5px;
            box-shadow: inset -10px 0 20px rgba(0,0,0,0.3);
        }

        .engine {
            width: 220px;
            background: #2c3e50;
            border-radius: 20px 10px 0 0;
        }

        .engine::before {
            content: '';
            position: absolute;
            top: -30px;
            left: 20px;
            width: 60px;
            height: 35px;
            background: #34495e;
            border-radius: 10px 10px 0 0;
        }

        /* Окна поезда */
        .window {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            background: #f1c40f;
            border-radius: 5px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5), 60px 0 0 #f1c40f, 120px 0 0 #f1c40f;
        }

        .passenger-car {
            width: 180px;
        }

        .passenger-car .window {
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5), 50px 0 0 #f1c40f, 100px 0 0 #f1c40f;
        }

        /* Колесные тележки и колеса */
        .bogies {
            position: absolute;
            bottom: -20px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 0 15px;
        }

        .wheel-pair {
            display: flex;
            gap: 30px; /* Расстояние между колесами тележки */
        }

        .wheel {
            width: 40px;
            height: 40px;
            background: #111;
            border: 4px dashed #7f8c8d; /* Штрихи имитируют спицы колеса */
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            box-shadow: 0 0 0 3px #333;
        }

        /* Дым из трубы */
        .smoke {
            position: absolute;
            top: -45px;
            left: 25px;
            width: 15px;
            height: 15px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            animation: riseSmoke 1.5s ease-out infinite;
        }

        /* Анимации */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes moveTracks {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50px); }
        }

        @keyframes moveHills {
            0% { transform: translateX(0); }
            100% { transform: translateX(-300px); }
        }

        @keyframes moveClouds {
            0% { transform: translateX(0); }
            100% { transform: translateX(-300px); }
        }

        @keyframes shake {
            0% { transform: translateY(0); }
            100% { transform: translateY(-2px); }
        }

        @keyframes riseSmoke {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.8;
            }
            100% {
                transform: translate(-30px, -50px) scale(2.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="clouds"></div>
        <div class="hills"></div>
        <div class="tracks"></div>

        <div class="train">
            <!-- Локомотив -->
            <div class="car engine">
                <div class="smoke"></div>
                <div class="window"></div>
                <div class="bogies">
                    <div class="wheel-pair">
                        <div class="wheel"></div>
                        <div class="wheel"></div>
                    </div>
                    <div class="wheel-pair">
                        <div class="wheel"></div>
                        <div class="wheel"></div>
                    </div>
                </div>
            </div>

            <!-- Вагон 1 -->
            <div class="car passenger-car">
                <div class="window"></div>
                <div class="bogies">
                    <div class="wheel-pair">
                        <div class="wheel"></div>
                        <div class="wheel"></div>
                    </div>
                    <div class="wheel-pair">
                        <div class="wheel"></div>
                        <div class="wheel"></div>
                    </div>
                </div>
            </div>

            <!-- Вагон 2 -->
            <div class="car passenger-car">
                <div class="window"></div>
                <div class="bogies">
                    <div class="wheel-pair">
                        <div class="wheel"></div>
                        <div class="wheel"></div>
                    </div>
                    <div class="wheel-pair">
                        <div class="wheel"></div>
                        <div class="wheel"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
