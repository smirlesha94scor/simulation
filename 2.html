<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CV Circuit Scanner — Верхняя панель управления</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #0e0e12; color: #fff; }
        
        /* Верхняя панель на всю ширину */
        .top-toolbar {
            background: #181820;
            padding: 15px 20px;
            border-bottom: 2px solid #444;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        input, button { padding: 6px 10px; font-size: 13px; }
        
        button { background: #ff007f; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #d9006b; }
        button:disabled { background: #444; cursor: not-allowed; }

        .btn-auto { background: #00ff66; color: #000; }
        .btn-auto:hover { background: #00cc52; }
        .btn-bg { background: #00bcd4; color: #fff; }
        .btn-bg:hover { background: #008ba3; }
        .btn-align { background: #9b51e0; color: #fff; }
        .btn-align:hover { background: #823ab7; }

        input[type="range"] { width: 180px; vertical-align: middle; }

        .container {
            padding: 20px;
        }

        #viewport {
            position: relative;
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 5 / 3;
            border: 2px solid #444;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            margin: 0 auto 20px auto;
        }

        #cv-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
            cursor: crosshair;
            z-index: 1;
        }

        .card { background: #181820; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; max-width: 1000px; margin-left: auto; margin-right: auto; }
        #log { background: #050508; color: #00ff66; padding: 10px; border-radius: 4px; font-family: monospace; height: 100px; overflow-y: auto; font-size: 12px; }
        .color-preview { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 1px solid #fff; vertical-align: middle; margin-left: 3px; }
    </style>
</head>
<body>

    <!-- ВЕРХНЯЯ ПАНЕЛЬ НА ВСЮ ШИРИНУ -->
    <div class="top-toolbar">
        <div class="toolbar-group">
            <input type="file" id="imageInput" accept="image/*" onchange="loadToCanvas(this)">
        </div>

        <div class="toolbar-group">
            <label>Чувствительность: <span id="sensValue">50</span></label>
            <input type="range" id="sensitivity" min="10" max="150" value="50" oninput="onSensitivityChange(this.value)">
        </div>

        <div class="toolbar-group">
            <span id="selectedColorStatus">1. Загрузите схему и кликните по линии</span>
            <span id="colorBox" class="color-preview" style="display:none;"></span>
        </div>

        <div class="toolbar-group">
            <button id="btnAutoClean" class="btn-auto" onclick="autoCleanBackground()" disabled>🪄 Авто-очистка фона</button>
            <button id="btnMakeWhite" class="btn-bg" onclick="runColorFilter()" disabled>Ручная очистка</button>
            <button id="btnAlign" class="btn-align" onclick="handleAlignStep()" disabled>📐 Шаг 1: Найти ось (1px)</button>
        </div>

        <div style="font-size: 12px; color: #aaa; width: 100%; margin-top: -5px;">
            💡 <b>Инструкция:</b> Выделите рамкой участок. Нажмите <b>1 раз</b> — найдет и покажет зеленую ось. Нажмите <b>2 раз</b> — выровняет в ровную линию 3px.
        </div>
    </div>

    <div class="container">
        <div id="viewport">
            <canvas id="cv-canvas" width="1000" height="600"></canvas>
        </div>

        <div class="card">
            <h3>Лог работы системы:</h3>
            <div id="log">Загрузите изображение...</div>
        </div>
    </div>

<script>
    let imgElement = new Image();
    let selectedColorRgb = null;

    let isDrawing = false;
    let startX = 0, startY = 0;
    let endX = 0, endY = 0;
    let originalImageSnapshot = null;
    let cleanedImageSnapshot = null;

    let alignStep = 1;
    let cachedAxisData = null;

    window.onload = () => {
        setupCanvasInteraction();
    };

    function log(text) {
        const box = document.getElementById('log');
        box.innerHTML += `<div>> ${text}</div>`;
        box.scrollTop = box.scrollHeight;
    }

    function loadToCanvas(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                imgElement.src = e.target.result;
                imgElement.onload = () => {
                    const canvas = document.getElementById('cv-canvas');
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, 1000, 600);
                    ctx.drawImage(imgElement, 0, 0, 1000, 600);
                    originalImageSnapshot = ctx.getImageData(0, 0, 1000, 600);
                    cleanedImageSnapshot = null;
                    
                    selectedColorRgb = null;
                    alignStep = 1;
                    cachedAxisData = null;
                    document.getElementById('btnAlign').textContent = "📐 Шаг 1: Найти ось (1px)";
                    document.getElementById('colorBox').style.display = 'none';
                    document.getElementById('selectedColorStatus').textContent = "1. Кликните по линии схемы для выбора цвета";
                    document.getElementById('btnMakeWhite').disabled = true;
                    document.getElementById('btnAutoClean').disabled = true;
                    document.getElementById('btnAlign').disabled = true;
                    log("Изображение загружено. Кликните пипеткой по линии.");
                };
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    function setupCanvasInteraction() {
        const canvas = document.getElementById('cv-canvas');

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = 1000 / rect.width;
            const scaleY = 600 / rect.height;
            const currentX = Math.floor((e.clientX - rect.left) * scaleX);
            const currentY = Math.floor((e.clientY - rect.top) * scaleY);

            if (!selectedColorRgb) {
                const ctx = canvas.getContext('2d');
                const pixel = ctx.getImageData(currentX, currentY, 1, 1).data;

                if (pixel[0] > 180 && pixel[1] < 100 && pixel[2] < 100) {
                    log("⚠️ Вы кликнули на красный фон! Кликните точно по черной линии схемы.");
                    return;
                }

                selectedColorRgb = { r: pixel[0], g: pixel[1], b: pixel[2] };
                const colorHex = `rgb(${pixel[0]}, ${pixel[1]}, ${pixel[2]})`;
                const colorBox = document.getElementById('colorBox');
                colorBox.style.background = colorHex;
                colorBox.style.display = 'inline-block';

                document.getElementById('selectedColorStatus').textContent = `Цвет линии: RGB(${pixel[0]}, ${pixel[1]}, ${pixel[2]})`;
                document.getElementById('btnMakeWhite').disabled = false;
                document.getElementById('btnAutoClean').disabled = false;
                document.getElementById('btnAlign').disabled = false;

                log(`🎨 Выбран цвет линии: RGB(${pixel[0]}, ${pixel[1]}, ${pixel[2]}). Выполните очистку.`);
                return;
            }

            startX = currentX;
            startY = currentY;
            endX = currentX;
            endY = currentY;
            isDrawing = true;
            alignStep = 1;
            cachedAxisData = null;
            document.getElementById('btnAlign').textContent = "📐 Шаг 1: Найти ось (1px)";
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing || !selectedColorRgb) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = 1000 / rect.width;
            const scaleY = 600 / rect.height;
            endX = Math.floor((e.clientX - rect.left) * scaleX);
            endY = Math.floor((e.clientY - rect.top) * scaleY);

            const ctx = canvas.getContext('2d');
            if (cleanedImageSnapshot) {
                ctx.putImageData(cleanedImageSnapshot, 0, 0);
            } else {
                ctx.putImageData(originalImageSnapshot, 0, 0);
            }
            
            ctx.strokeStyle = '#ff007f';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.strokeRect(startX, startY, endX - startX, endY - startY);
            ctx.setLineDash([]);
        });

        canvas.addEventListener('mouseup', (e) => {
            if (!isDrawing) return;
            isDrawing = false;
            log(`📐 Область выделена рамкой.`);
        });
    }

    function onSensitivityChange(val) {
        document.getElementById('sensValue').textContent = val;
    }

    function runColorFilter(customTolerance = null) {
        if (!selectedColorRgb) return;

        const tolerance = customTolerance !== null ? customTolerance : parseInt(document.getElementById('sensitivity').value);
        const canvas = document.getElementById('cv-canvas');
        const ctx = canvas.getContext('2d');
        
        ctx.drawImage(imgElement, 0, 0, 1000, 600);
        const imgData = ctx.getImageData(0, 0, 1000, 600);
        const data = imgData.data;

        for (let i = 0; i < data.length; i += 4) {
            let r = data[i], g = data[i+1], b = data[i+2];

            let distanceToLine = Math.sqrt(
                Math.pow(r - selectedColorRgb.r, 2) +
                Math.pow(g - selectedColorRgb.g, 2) +
                Math.pow(b - selectedColorRgb.b, 2)
            );

            let isRedBackground = (r > 100 && r > g * 1.5 && r > b * 1.5);
            
            if (distanceToLine > tolerance || isRedBackground) {
                data[i] = 255; data[i+1] = 255; data[i+2] = 255;
            } else {
                let gray = Math.floor(0.299 * r + 0.587 * g + 0.114 * b);
                if (gray > 120) gray = 0;
                data[i] = gray; data[i+1] = gray; data[i+2] = gray;
            }
        }

        ctx.putImageData(imgData, 0, 0);
        originalImageSnapshot = ctx.getImageData(0, 0, 1000, 600);
        cleanedImageSnapshot = ctx.getImageData(0, 0, 1000, 600);
        log(`✅ Фон полностью очищен и зафиксирован.`);
    }

    function autoCleanBackground() {
        if (!selectedColorRgb) return;
        let autoSensitivity = 65;
        document.getElementById('sensitivity').value = autoSensitivity;
        document.getElementById('sensValue').textContent = autoSensitivity;
        log(`🪄 Авто-очистка фона (порог: ${autoSensitivity})...`);
        runColorFilter(autoSensitivity);
    }

    function handleAlignStep() {
        if (!selectedColorRgb) {
            alert('Сначала выберите цвет линии!');
            return;
        }

        if (alignStep === 1) {
            runStep1_FindAxis();
        } else if (alignStep === 2) {
            runStep2_DrawLine();
        }
    }

    function runStep1_FindAxis() {
        const canvas = document.getElementById('cv-canvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        
        if (cleanedImageSnapshot) {
            ctx.putImageData(cleanedImageSnapshot, 0, 0);
        } else {
            ctx.putImageData(originalImageSnapshot, 0, 0);
        }
        
        const imgData = ctx.getImageData(0, 0, width, height);
        const data = imgData.data;
        const origData = cleanedImageSnapshot ? cleanedImageSnapshot.data : originalImageSnapshot.data;

        let x1 = Math.max(0, Math.min(startX, endX));
        let x2 = Math.min(width, Math.max(startX, endX));
        let y1 = Math.max(0, Math.min(startY, endY));
        let y2 = Math.min(height, Math.max(startY, endY));

        if (x1 === x2 || y1 === y2) {
            log("⚠️ Сначала выделите рамкой участок с линией!");
            return;
        }

        function isLinePixel(r, g, b) {
            return (r < 180 || g < 180 || b < 180);
        }

        let spanX = x2 - x1;
        let spanY = y2 - y1;
        let isHorizontal = spanX >= spanY;

        for (let x = x1; x <= x2; x++) {
            for (let y = y1; y <= y2; y++) {
                let idx = (y * width + x) * 4;
                data[idx] = 255; data[idx+1] = 255; data[idx+2] = 255;
            }
        }

        let axisPoints = [];

        if (isHorizontal) {
            let bestRow = y1;
            let maxLen = 0;
            let bestSegment = null;

            for (let y = y1; y <= y2; y++) {
                let currentLen = 0;
                let currentStart = -1;
                for (let x = x1; x <= x2; x++) {
                    let idx = (y * width + x) * 4;
                    if (isLinePixel(origData[idx], origData[idx+1], origData[idx+2])) {
                        if (currentStart === -1) currentStart = x;
                        currentLen++;
                    } else {
                        if (currentLen > maxLen) {
                            maxLen = currentLen;
                            bestRow = y;
                            bestSegment = { start: currentStart, end: x - 1, fixedY: y };
                        }
                        currentLen = 0;
                        currentStart = -1;
                    }
                }
                if (currentLen > maxLen) {
                    maxLen = currentLen;
                    bestRow = y;
                    bestSegment = { start: currentStart, end: x2, fixedY: y };
                }
            }

            if (!bestSegment || maxLen < 2) {
                log("⚠️ Не удалось найти горизонтальный отрезок в рамке.");
                return;
            }

            for (let x = bestSegment.start; x <= bestSegment.end; x++) {
                axisPoints.push({ x: x, y: bestSegment.fixedY });
                let idx = (bestSegment.fixedY * width + x) * 4;
                data[idx] = 0; data[idx+1] = 255; data[idx+2] = 0;
            }
            log(`🟢 Шаг 1: Найден горизонтальный отрезок длиной ${maxLen}px.`);

        } else {
            let maxLen = 0;
            let bestSegment = null;

            for (let x = x1; x <= x2; x++) {
                let currentLen = 0;
                let currentStart = -1;
                for (let y = y1; y <= y2; y++) {
                    let idx = (y * width + x) * 4;
                    if (isLinePixel(origData[idx], origData[idx+1], origData[idx+2])) {
                        if (currentStart === -1) currentStart = y;
                        currentLen++;
                    } else {
                        if (currentLen > maxLen) {
                            maxLen = currentLen;
                            bestSegment = { start: currentStart, end: y - 1, fixedX: x };
                        }
                        currentLen = 0;
                        currentStart = -1;
                    }
                }
                if (currentLen > maxLen) {
                    maxLen = currentLen;
                    bestSegment = { start: currentStart, end: y2, fixedX: x };
                }
            }

            if (!bestSegment || maxLen < 2) {
                log("⚠️ Не удалось найти вертикальный отрезок в рамке.");
                return;
            }

            for (let y = bestSegment.start; y <= bestSegment.end; y++) {
                axisPoints.push({ x: bestSegment.fixedX, y: y });
                let idx = (y * width + bestSegment.fixedX) * 4;
                data[idx] = 0; data[idx+1] = 255; data[idx+2] = 0;
            }
            log(`🟢 Шаг 1: Найден вертикальный отрезок длиной ${maxLen}px.`);
        }

        ctx.putImageData(imgData, 0, 0);

        cachedAxisData = { isHorizontal, axisPoints, x1, x2, y1, y2 };
        alignStep = 2;
        document.getElementById('btnAlign').textContent = "📐 Шаг 2: Выровнять в линию (3px)";
    }

    function runStep2_DrawLine() {
        if (!cachedAxisData) return;

        const canvas = document.getElementById('cv-canvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        
        if (cleanedImageSnapshot) {
            ctx.putImageData(cleanedImageSnapshot, 0, 0);
        } else {
            ctx.putImageData(originalImageSnapshot, 0, 0);
        }
        
        const imgData = ctx.getImageData(0, 0, width, height);
        const data = imgData.data;

        let { isHorizontal, axisPoints, x1, x2, y1, y2 } = cachedAxisData;

        for (let x = x1; x <= x2; x++) {
            for (let y = y1; y <= y2; y++) {
                let idx = (y * width + x) * 4;
                data[idx] = 255; data[idx+1] = 255; data[idx+2] = 255;
            }
        }

        if (isHorizontal) {
            axisPoints.forEach(p => {
                for (let dy = -1; dy <= 1; dy++) {
                    let py = p.y + dy;
                    if (py >= 0 && py < height) {
                        let idx = (py * width + p.x) * 4;
                        data[idx] = 0; data[idx+1] = 0; data[idx+2] = 0;
                    }
                }
            });
            log(`✅ Шаг 2: Построена идеальная ровная горизонтальная линия 3px.`);
        } else {
            axisPoints.forEach(p => {
                for (let dx = -1; dx <= 1; dx++) {
                    let px = p.x + dx;
                    if (px >= 0 && px < width) {
                        let idx = (p.y * width + px) * 4;
                        data[idx] = 0; data[idx+1] = 0; data[idx+2] = 0;
                    }
                }
            });
            log(`✅ Шаг 2: Построена идеальная ровная вертикальная линия 3px.`);
        }

        ctx.putImageData(imgData, 0, 0);
        originalImageSnapshot = ctx.getImageData(0, 0, width, height);
        cleanedImageSnapshot = ctx.getImageData(0, 0, width, height);

        alignStep = 1;
        cachedAxisData = null;
        document.getElementById('btnAlign').textContent = "📐 Шаг 1: Найти ось (1px)";
    }
</script>
</body>
</html>
