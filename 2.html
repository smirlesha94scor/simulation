<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Сканування та перетин з вантажем</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        canvas {
            border: 2px solid #555;
            background: #050505;
        }
        .controls {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <h2>Сканування поверхні та визначення координат вантажу</h2>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div class="controls">Керування вантажем: Стрілки <b>Вліво / Вправо / Вгору / Вниз</b></div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Вантаж, який можна переміщати по поверхні
const cargo = {
    x: 350,
    y: 250,
    width: 100,
    height: 60,
    speed: 3
};

// Позиція скануючого датчика зверху (може рухатися або бути стабільним)
const scanner = {
    y: 50 // Висота, з якої сканує датчик
};

// Клавіші керування
const keys = {};
window.addEventListener("keydown", e => keys[e.code] = true);
window.addEventListener("keyup", e => keys[e.code] = false);

function update() {
    // Переміщення вантажу стрілками
    if (keys["ArrowLeft"])  cargo.x -= cargo.speed;
    if (keys["ArrowRight"]) cargo.x += cargo.speed;
    if (keys["ArrowUp"])    cargo.y -= cargo.speed;
    if (keys["ArrowDown"])  cargo.y += cargo.speed;

    // Обмеження в межах canvas
    if (cargo.x < 0) cargo.x = 0;
    if (cargo.x + cargo.width > canvas.width) cargo.x = canvas.width - cargo.width;
    if (cargo.y < 100) cargo.y = 100; // Не вище лінії сканування
    if (cargo.y + cargo.height > canvas.height - 20) cargo.y = canvas.height - 20 - cargo.height;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. Малюємо поверхню землі (внизу)
    ctx.fillStyle = "#333";
    ctx.fillRect(0, canvas.height - 20, canvas.width, 20);

    // 2. Малюємо сам вантаж
    ctx.fillStyle = "#ff5555";
    ctx.fillRect(cargo.x, cargo.y, cargo.width, cargo.height);
    ctx.strokeStyle = "#ff9999";
    ctx.strokeRect(cargo.x, cargo.y, cargo.width, cargo.height);

    // Напис на вантажі
    ctx.fillStyle = "#fff";
    ctx.font = "12px sans-serif";
    ctx.fillText("ВАНТАЖ", cargo.x + 25, cargo.y + 35);

    // 3. Сканування зверху: випускаємо вертикальні промені вниз
    const numBeams = 40;
    const step = canvas.width / numBeams;

    for (let i = 0; i < numBeams; i++) {
        let beamX = i * step + step / 2;
        let intersectionY = null;

        // Перевіряємо, чи перетинає промінь вантаж
        if (beamX >= cargo.x && beamX <= cargo.x + cargo.width) {
            intersectionY = cargo.y; // Верхня границя вантажу — точка перетину!
        }

        // Малюємо промінь від датчика (сканера) до землі або до вантажу
        ctx.strokeStyle = "rgba(0, 255, 255, 0.2)";
        ctx.beginPath();
        ctx.moveTo(beamX, scanner.y);
        ctx.lineTo(beamX, intersectionY !== null ? intersectionY : canvas.height - 20);
        ctx.stroke();

        // Якщо є перетин із вантажем — фіксуємо його яскравою точкою
        if (intersectionY !== null) {
            ctx.fillStyle = "#00ffcc";
            ctx.beginPath();
            ctx.arc(beamX, intersectionY, 3, 0, Math.PI * 2);
            ctx.fill();

            // Виводимо координати перетину для кількох центральних променів
            if (i === Math.floor(numBeams / 2)) {
                ctx.fillStyle = "#00ffcc";
                ctx.font = "11px monospace";
                ctx.fillText(`Перетин: X=${Math.round(beamX)}, Y=${Math.round(intersectionY)}`, beamX + 10, intersectionY - 10);
            }
        }
    }

    // 4. Малюємо сам датчик зверху
    ctx.fillStyle = "#00ffff";
    ctx.fillRect(0, scanner.y - 10, canvas.width, 10);
    ctx.fillStyle = "#000";
    ctx.fillText("ДАТЧИК СКАНУВАННЯ ЗВЕРХУ", 20, scanner.y - 2);
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
