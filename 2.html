<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Реалістична залізнична стрілка на JS</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        canvas {
            background-color: #2b2b2b;
            border: 2px solid #444;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 15px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #007acc;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background 0.2s;
        }
        button:hover { background: #005999; }
    </style>
</head>
<body>

    <h2>Симуляція залізничного стрілочного переводу</h2>
    <canvas id="railwayCanvas" width="900" height="400"></canvas>
    <div class="controls">
        <button id="toggleSwitch">Перевести стрілку (Пробіл)</button>
        <button id="spawnTrain">Запустити потяг</button>
    </div>

<script>
const canvas = document.getElementById('railwayCanvas');
const ctx = canvas.getContext('2d');

// Налаштування колії
const GAUGE = 28; // Ширина колії (відстань між рейками)
const SLEEPERS_SPACING = 18; // Відстань між шпалами

// Стан стрілки: 0 - прямо (основна колія), 1 - на відгалуження
let switchTargetState = 0; 
let switchCurrentState = 0; // Для плавної анімації (від 0.0 до 1.0)

// Масив потягів (візків)
let trains = [];

// Математичні функції для кривих Безьє
function getQuadraticBezierPoint(t, p0, p1, p2) {
    const x = (1 - t) * (1 - t) * p0.x + 2 * (1 - t) * t * p1.x + t * t * p2.x;
    const y = (1 - t) * (1 - t) * p0.y + 2 * (1 - t) * t * p1.y + t * t * p2.y;
    return { x, y };
}

function getQuadraticBezierAngle(t, p0, p1, p2) {
    const dx = 2 * (1 - t) * (p1.x - p0.x) + 2 * t * (p2.x - p1.x);
    const dy = 2 * (1 - t) * (p1.y - p0.y) + 2 * t * (p2.y - p1.y);
    return Math.atan2(dy, dx);
}

// Геометрія шляхів (осьові лінії)
const mainTrack = { p0: { x: 50, y: 250 }, p1: { x: 450, y: 250 }, p2: { x: 850, y: 250 } };
const branchTrack = { p0: { x: 250, y: 250 }, p1: { x: 500, y: 250 }, p2: { x: 850, y: 100 } };

// Функція малювання шпал вздовж кривої
function drawSleepers(track, startT = 0, endT = 1, count = 40) {
    ctx.fillStyle = '#4a3b32'; // Колір дерев'яних шпал
    for (let i = 0; i <= count; i++) {
        const t = startT + (endT - startT) * (i / count);
        const pt = getQuadraticBezierPoint(t, track.p0, track.p1, track.p2);
        const angle = getQuadraticBezierAngle(t, track.p0, track.p1, track.p2);

        ctx.save();
        ctx.translate(pt.x, pt.y);
        ctx.rotate(angle);
        ctx.fillRect(-4, -GAUGE * 0.85, 8, GAUGE * 1.7);
        ctx.restore();
    }
}

// Функція малювання двох паралельних рейок вздовж кривої
function drawRails(track, startT = 0, endT = 1, steps = 50) {
    ctx.strokeStyle = '#a0a5aa'; // Сталевий колір рейок
    ctx.lineWidth = 3;

    [-GAUGE / 2, GAUGE / 2].forEach(offset => {
        ctx.beginPath();
        for (let i = 0; i <= steps; i++) {
            const t = startT + (endT - startT) * (i / steps);
            const pt = getQuadraticBezierPoint(t, track.p0, track.p1, track.p2);
            const angle = getQuadraticBezierAngle(t, track.p0, track.p1, track.p2);

            const rx = pt.x - Math.sin(angle) * offset;
            const ry = pt.y + Math.cos(angle) * offset;

            if (i === 0) ctx.moveTo(rx, ry);
            else ctx.lineTo(rx, ry);
        }
        ctx.stroke();
    });
}

// Малювання рухомих вістряків (найважливіша частина реалізму)
function drawSwitchBlades() {
    // Початок вістряків (x = 250) та їхня довжина (до x = 350)
    const startX = 250;
    const endX = 350;
    const baseY = 250;

    // Зміщення кінчиків вістряків залежно від стану стрілки
    // Коли 0 (прямо): верхній вістряк відведений від рамної рейки, нижній притиснутий
    // Коли 1 (бокова): верхній вістряк притиснутий, нижній відведений
    const throwGap = 6; // Зазор між вістряком і рамною рейкою

    // Верхня рейка (y = baseY - GAUGE/2)
    const topRailY = baseY - GAUGE / 2;
    const topBladeTipY = topRailY + (1 - switchCurrentState) * throwGap;

    // Нижня рейка (y = baseY + GAUGE/2)
    const bottomRailY = baseY + GAUGE / 2;
    const bottomBladeTipY = bottomRailY - switchCurrentState * throwGap;

    // Малюємо тягу (з'єднує обидва вістряки)
    ctx.strokeStyle = '#666';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(startX + 15, topBladeTipY);
    ctx.lineTo(startX + 15, bottomBladeTipY);
    ctx.stroke();

    // Малюємо самі вістряки (загострені рейки)
    ctx.strokeStyle = '#ff9800'; // Підсвічуємо рухомі елементи для наочності
    ctx.lineWidth = 3;

    // Верхній вістряк (кріпиться в кінці на бокову колію)
    const branchPt = getQuadraticBezierPoint(0.18, branchTrack.p0, branchTrack.p1, branchTrack.p2);
    ctx.beginPath();
    ctx.moveTo(startX, topBladeTipY);
    ctx.lineTo(endX, branchPt.y - GAUGE / 2);
    ctx.stroke();

    // Нижній вістряк (кріпиться в кінці на пряму колію)
    ctx.beginPath();
    ctx.moveTo(startX, bottomBladeTipY);
    ctx.lineTo(endX, bottomRailY);
    ctx.stroke();

    // Світлофорний індикатор біля стрілки
    ctx.fillStyle = switchTargetState === 0 ? '#4caf50' : '#ffeb3b';
    ctx.beginPath();
    ctx.arc(startX, baseY + 45, 7, 0, Math.PI * 2);
    ctx.fill();
}

// Клас для потяга
class Train {
    constructor() {
        this.x = 50;
        this.y = 250;
        this.speed = 3;
        this.route = null; // Визначається в момент проїзду стрілки
        this.branchT = 0;
        this.angle = 0;
    }

    update() {
        // Якщо потяг ще не доїхав до стрілки (x < 250)
        if (this.x < 250) {
            this.x += this.speed;
            this.angle = 0;
        } else {
            // Фіксуємо маршрут у момент наїзду на вістряки
            if (this.route === null) {
                this.route = switchTargetState; 
            }

            if (this.route === 0) {
                // Рух прямо
                this.x += this.speed;
                this.angle = 0;
            } else {
                // Рух по кривій Безьє (відгалуження)
                this.branchT += 0.0052; // Підібрана швидкість для плавності
                const pt = getQuadraticBezierPoint(this.branchT, branchTrack.p0, branchTrack.p1, branchTrack.p2);
                this.angle = getQuadraticBezierAngle(this.branchT, branchTrack.p0, branchTrack.p1, branchTrack.p2);
                this.x = pt.x;
                this.y = pt.y;
            }
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        // Тінь вагона
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(-38, -14, 80, 32);

        // Корпус локомотива
        ctx.fillStyle = '#d32f2f';
        ctx.fillRect(-40, -16, 80, 32);

        // Кабіна та деталі
        ctx.fillStyle = '#ffcdd2';
        ctx.fillRect(20, -12, 12, 24);
        ctx.fillStyle = '#212121';
        ctx.fillRect(-30, -10, 40, 20);

        ctx.restore();
    }
}

// Головний цикл рендерингу
function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Плавна анімація переведення стрілки
    switchCurrentState += (switchTargetState - switchCurrentState) * 0.15;

    // 1. Малюємо шпали
    drawSleepers(mainTrack, 0, 1, 45);
    drawSleepers(branchTrack, 0.15, 1, 35); // Починаємо трохи далі, щоб не накладалися

    // 2. Малюємо основні рамні рейки
    drawRails(mainTrack, 0, 1);
    drawRails(branchTrack, 0.16, 1);

    // 3. Малюємо рухомі вістряки поверх
    drawSwitchBlades();

    // 4. Оновлюємо та малюємо потяги
    trains.forEach((train, index) => {
        train.update();
        train.draw();
        // Видаляємо потяг, якщо виїхав за межі екрана
        if (train.x > canvas.width + 50 || train.y < -50) {
            trains.splice(index, 1);
        }
    });

    requestAnimationFrame(animate);
}

// Керування
function toggleSwitch() {
    // Забороняємо переводити стрілку, якщо на ній зараз знаходиться потяг (захист від сходу з рейок)
    const trainOnSwitch = trains.some(t => t.x > 220 && t.x < 380);
    if (!trainOnSwitch) {
        switchTargetState = switchTargetState === 0 ? 1 : 0;
    } else {
        console.warn("Стрілка зайнята потягом! Переведення заблоковано.");
    }
}

document.getElementById('toggleSwitch').addEventListener('click', toggleSwitch);
canvas.addEventListener('click', toggleSwitch);
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
        e.preventDefault();
        toggleSwitch();
    }
});

document.getElementById('spawnTrain').addEventListener('click', () => {
    trains.push(new Train());
});

// Запуск симуляції та першого потяга
trains.push(new Train());
animate();
</script>
</body>
</html>
