<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live ASCII to SVG Generator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', monospace, sans-serif; background: #1e1e24; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background: #2a2a32; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3a3a46; flex-shrink: 0; }
        h1 { font-size: 15px; color: #61afef; font-weight: 600; }
        
        .main { display: flex; flex: 1; overflow: hidden; }
        
        .editor-pane { width: 45%; border-right: 1px solid #3a3a46; display: flex; flex-direction: column; background: #25252d; height: 100%; }
        .pane-title { background: #1e1e24; padding: 6px 12px; font-size: 11px; color: #abb2bf; font-weight: bold; text-transform: uppercase; border-bottom: 1px solid #3a3a46; flex-shrink: 0; }
        
        textarea#ascii-input { 
            flex: 1; 
            min-height: 250px; 
            background: #18181c; 
            color: #98c379; 
            border: none; 
            padding: 14px; 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 14px; 
            line-height: 1.25; 
            resize: vertical; 
            outline: none; 
            white-space: pre; 
        }
        
        .bottom-editors { background: #22222b; border-top: 1px solid #3a3a46; display: flex; flex-direction: column; flex-shrink: 0; }
        .comp-editor-panel { padding: 8px 12px; border-bottom: 1px solid #3a3a46; max-height: 85px; overflow-y: auto; }
        .comp-list { display: flex; flex-wrap: wrap; gap: 6px; }
        .comp-item { background: #2a2a32; border: 1px solid #3a3a46; padding: 2px 6px; border-radius: 4px; display: flex; align-items: center; gap: 4px; font-size: 11px; }
        .comp-item input { background: #18181c; color: #fff; border: 1px solid #555; border-radius: 3px; padding: 1px 4px; width: 70px; font-family: monospace; font-size: 11px; }
        
        .svg-template-editor { padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; background: #1b1b22; }
        .svg-template-controls { display: flex; gap: 10px; align-items: center; }
        .svg-template-controls select { background: #2a2a32; color: #61afef; border: 1px solid #3a3a46; padding: 2px 6px; border-radius: 3px; font-weight: bold; outline: none; font-size: 11px; }
        .svg-template-code { width: 100%; height: 70px; background: #121215; color: #e06c75; border: 1px solid #3a3a46; padding: 6px; font-family: 'Courier New', monospace; font-size: 11px; border-radius: 4px; resize: vertical; outline: none; }

        .preview-pane { flex: 1; background: #141416; display: flex; flex-direction: column; height: 100%; }
        .canvas-wrapper { flex: 1; overflow: auto; display: flex; justify-content: center; align-items: center; padding: 20px; }
        #svg-output { background: #ffffff; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 4px; }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Генератор схем в реальном времени</h1>
        <button onclick="copySVG()" style="background:#61afef; color:#fff; border:none; padding:5px 12px; border-radius:4px; font-weight:bold; cursor:pointer; font-size:12px;">📋 Копировать SVG</button>
    </header>

    <div class="main">
        <div class="editor-pane">
            <div class="pane-title">Текстовый ввод (ASCII Схема)</div>
            <textarea id="ascii-input" spellcheck="false"></textarea>
            
            <div class="bottom-editors">
                <div class="comp-editor-panel">
                    <div style="font-size: 10px; color: #61afef; margin-bottom: 4px; font-weight: bold;">ОБОЗНАЧЕНИЯ ЭЛЕМЕНТОВ В СХЕМЕ:</div>
                    <div id="components-list" class="comp-list"></div>
                </div>

                <div class="svg-template-editor">
                    <div class="svg-template-controls">
                        <span style="font-size: 10px; color: #abb2bf; font-weight: bold;">РЕДАКТОР SVG-КОДА ЭЛЕМЕНТА:</span>
                        <select id="svg-type-select" onchange="loadSVGTemplateToEdit()">
                            <option value="VT1">VT1 (NPN Транзистор)</option>
                            <option value="VT2">VT2 (PNP Транзистор)</option>
                            <option value="R">R (Резистор)</option>
                            <option value="C">C (Конденсатор)</option>
                            <option value="VD">VD (Диод)</option>
                            <option value="BF">BF (Динамик)</option>
                            <option value="GB">GB (Батарея)</option>
                            <option value="DEFAULT">Прочий блок [name]</option>
                        </select>
                    </div>
                    <textarea id="svg-template-input" class="svg-template-code" spellcheck="false" placeholder="SVG код элемента..."></textarea>
                </div>
            </div>
        </div>
        
        <div class="preview-pane">
            <div class="pane-title">Реальное время (SVG Отрисовка)</div>
            <div class="canvas-wrapper">
                <svg id="svg-output" width="650" height="450" viewBox="0 0 650 450" xmlns="http://www.w3.org/2000/svg">
                    <g id="render-layer"></g>
                </svg>
            </div>
        </div>
    </div>

    <script>
        const defaultText = 
`+-------[GB1]-------+
|                   |
[R1]               [C1]
|                   |
+-------[VD1]-------+`;

        const customSVG = {
            VT1: `<circle cx="{x}" cy="{y}" r="16" fill="#fff" stroke="#000" stroke-width="2"/>
<line x1="{x}-6" y1="{y}-9" x2="{x}-6" y2="{y}+9" stroke="#000" stroke-width="3.5"/>
<line x1="{x}-18" y1="{y}" x2="{x}-6" y2="{y}" stroke="#000" stroke-width="2.5"/>
<line x1="{x}-6" y1="{y}-4" x2="{x}+6" y2="{y}-12" stroke="#000" stroke-width="2.5"/>
<line x1="{x}+6" y1="{y}-12" x2="{x}+6" y2="{y}-18" stroke="#000" stroke-width="2.5"/>
<line x1="{x}-6" y1="{y}+4" x2="{x}+6" y2="{y}+12" stroke="#000" stroke-width="2.5"/>
<line x1="{x}+6" y1="{y}+12" x2="{x}+6" y2="{y}+18" stroke="#000" stroke-width="2.5"/>
<polygon points="{x}+6,{y}+12 {x}+1,{y}+7 {x}+5,{y}+3" fill="#000"/>
<text x="{x}+22" y="{y}+4" font-size="11" font-weight="bold" font-family="Arial" fill="#000">{name}</text>`,

            VT2: `<circle cx="{x}" cy="{y}" r="16" fill="#fff" stroke="#000" stroke-width="2"/>
<line x1="{x}-6" y1="{y}-9" x2="{x}-6" y2="{y}+9" stroke="#000" stroke-width="3.5"/>
<line x1="{x}-18" y1="{y}" x2="{x}-6" y2="{y}" stroke="#000" stroke-width="2.5"/>
<line x1="{x}-6" y1="{y}-4" x2="{x}+6" y2="{y}-12" stroke="#000" stroke-width="2.5"/>
<line x1="{x}+6" y1="{y}-12" x2="{x}+6" y2="{y}-18" stroke="#000" stroke-width="2.5"/>
<line x1="{x}-6" y1="{y}+4" x2="{x}+6" y2="{y}+12" stroke="#000" stroke-width="2.5"/>
<line x1="{x}+6" y1="{y}+12" x2="{x}+6" y2="{y}+18" stroke="#000" stroke-width="2.5"/>
<polygon points="{x}-6,{y}+4 {x}-1,{y} {x}+1,{y}+5" fill="#000"/>
<text x="{x}+22" y="{y}+4" font-size="11" font-weight="bold" font-family="Arial" fill="#000">{name}</text>`,

            R: `<rect x="{x}-18" y="{y}-10" width="36" height="20" fill="#fff"/>
<rect x="{x}-18" y="{y}-7" width="36" height="14" fill="#fff" stroke="#000" stroke-width="2.5"/>
<text x="{x}" y="{y}+22" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial" fill="#000">{name}</text>`,

            C: `<rect x="{x}-10" y="{y}-12" width="20" height="24" fill="#fff"/>
<line x1="{x}-5" y1="{y}-12" x2="{x}-5" y2="{y}+12" stroke="#000" stroke-width="3"/>
<line x1="{x}+5" y1="{y}-12" x2="{x}+5" y2="{y}+12" stroke="#000" stroke-width="3"/>
<text x="{x}" y="{y}+24" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial" fill="#000">{name}</text>`,

            VD: `<rect x="{x}-14" y="{y}-10" width="28" height="20" fill="#fff"/>
<polygon points="{x}-8,{y}-6 {x}+4,{y} {x}-8,{y}+6" fill="#000"/>
<line x1="{x}+4" y1="{y}-7" x2="{x}+4" y2="{y}+7" stroke="#000" stroke-width="2.5"/>
<text x="{x}" y="{y}+22" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial" fill="#000">{name}</text>`,

            BF: `<rect x="{x}-12" y="{y}-12" width="24" height="24" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="{x}+16" y="{y}+4" font-size="11" font-weight="bold" font-family="Arial" fill="#000">{name}</text>`,

            GB: `<rect x="{x}-16" y="{y}-12" width="32" height="24" fill="#fff"/>
<line x1="{x}-9" y1="{y}-6" x2="{x}-9" y2="{y}+6" stroke="#000" stroke-width="1.5"/>
<line x1="{x}-5" y1="{y}-10" x2="{x}-5" y2="{y}+10" stroke="#000" stroke-width="3"/>
<line x1="{x}-5" y1="{y}" x2="{x}+5" y2="{y}" stroke="#000" stroke-width="2" stroke-dasharray="3, 3"/>
<line x1="{x}+5" y1="{y}-10" x2="{x}+5" y2="{y}+10" stroke="#000" stroke-width="3"/>
<line x1="{x}+9" y1="{y}-6" x2="{x}+9" y2="{y}+6" stroke="#000" stroke-width="1.5"/>
<text x="{x}" y="{y}+24" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial" fill="#000">{name}</text>`,

            DEFAULT: `<rect x="{x}-22" y="{y}-10" width="44" height="20" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="{x}" y="{y}+4" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial" fill="#000">{name}</text>`
        };

        function parseAndRender() {
            const rawText = textarea.value;
            const lines = rawText.split('\n');
            
            updateComponentEditor(rawText);

            // Очищаем теги элементов из сетки проводников без создания лишних отступов
            let wireLines = lines.map(line => {
                return line.replace(/\[([^\]]+)\]/g, (match) => ' '.repeat(match.length));
            });

            const maxCols = Math.max(...lines.map(l => l.length), 10);
            const maxRows = Math.max(lines.length, 10);
            
            const width = Math.max(maxCols * CELL_SIZE + 60, 400);
            const height = Math.max(maxRows * CELL_SIZE + 60, 300);

            svgOutput.setAttribute('width', width);
            svgOutput.setAttribute('height', height);
            svgOutput.setAttribute('viewBox', `0 0 ${width} ${height}`);

            let html = '';

            const getWireChar = (r, c) => (r >= 0 && r < wireLines.length && c >= 0 && c < wireLines[r].length) ? wireLines[r][c] : ' ';
            const isWire = (ch) => ch === '-' || ch === '|' || ch === '+';

            // 1. Отрисовка линий
            for (let r = 0; r < wireLines.length; r++) {
                for (let c = 0; c < wireLines[r].length; c++) {
                    const ch = wireLines[r][c];
                    const x = c * CELL_SIZE + 40;
                    const y = r * CELL_SIZE + 40;

                    if (ch === '-') {
                        html += `<line x1="${x - CELL_SIZE/2}" y1="${y}" x2="${x + CELL_SIZE/2}" y2="${y}" stroke="#000" stroke-width="2.5"/>`;
                    } else if (ch === '|') {
                        html += `<line x1="${x}" y1="${y - CELL_SIZE/2}" x2="${x}" y2="${y + CELL_SIZE/2}" stroke="#000" stroke-width="2.5"/>`;
                    } else if (ch === '+') {
                        const top = isWire(getWireChar(r - 1, c));
                        const bottom = isWire(getWireChar(r + 1, c));
                        const left = isWire(getWireChar(r, c - 1));
                        const right = isWire(getWireChar(r, c + 1));

                        let count = (top?1:0) + (bottom?1:0) + (left?1:0) + (right?1:0);

                        if (left)  html += `<line x1="${x - CELL_SIZE/2}" y1="${y}" x2="${x}" y2="${y}" stroke="#000" stroke-width="2.5"/>`;
                        if (right) html += `<line x1="${x}" y1="${y}" x2="${x + CELL_SIZE/2}" y2="${y}" stroke="#000" stroke-width="2.5"/>`;
                        if (top)   html += `<line x1="${x}" y1="${y - CELL_SIZE/2}" x2="${x}" y2="${y}" stroke="#000" stroke-width="2.5"/>`;
                        if (bottom)html += `<line x1="${x}" y1="${y}" x2="${x}" y2="${y + CELL_SIZE/2}" stroke="#000" stroke-width="2.5"/>`;

                        if (count >= 3) {
                            html += `<circle cx="${x}" cy="{y}" r="3.5" fill="#000"/>`.replace('{y}', y);
                        }
                    }
                }
            }

            // 2. Отрисовка элементов строго по центру ячейки без интервалов
            const compRegex = /\[([^\]]+)\]/g;
            for (let r = 0; r < lines.length; r++) {
                let match;
                while ((match = compRegex.exec(lines[r])) !== null) {
                    const name = match[1].trim();
                    const startCol = match.index;
                    const endCol = match.index + match[0].length;
                    
                    const midCol = startCol + Math.floor(match[0].length / 2);
                    const isVertical = getWireChar(r - 1, midCol) === '|' || getWireChar(r + 1, midCol) === '|';

                    const centerX = isVertical 
                        ? (midCol * CELL_SIZE + 40) 
                        : (((startCol * CELL_SIZE + 40) + ((endCol - 1) * CELL_SIZE + 40)) / 2);
                    const centerY = r * CELL_SIZE + 40;

                    html += renderComponent(name, centerX, centerY, isVertical);
                }
            }

            renderLayer.innerHTML = html;
        }

        function renderComponent(fullName, x, y, isVertical) {
            const type = fullName.split(' ')[0].toUpperCase();
            // Ищем подходящий шаблон по префиксу имени (R, C, VD, VT1 и т.д.), иначе берем DEFAULT
            let key = Object.keys(customSVG)
                .filter(k => k !== 'DEFAULT')
                .sort((a, b) => b.length - a.length) // Сначала проверяем более длинные ключи (VT1 перед V)
                .find(k => type.startsWith(k)) || 'DEFAULT';
            
            let template = customSVG[key] || '';
            
            let compiled = template.replace(/\{x\}([\+\-]\d+)?/g, (_, offset) => x + (offset ? parseInt(offset) : 0))
                                   .replace(/\{y\}([\+\-]\d+)?/g, (_, offset) => y + (offset ? parseInt(offset) : 0))
                                   .replace(/\{name\}/g, fullName);

            if (isVertical && !type.startsWith('VT')) {
                return `<g transform="rotate(90 ${x} ${y})">${compiled}</g>`;
            }

            return `<g>${compiled}</g>`;
        }

        textarea.addEventListener('input', parseAndRender);
        loadSVGTemplateToEdit();
        parseAndRender();
    </script>
</body>
</html>
