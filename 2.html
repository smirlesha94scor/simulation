<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CV Circuit Scanner — Загрузка и Ч/Б</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #0e0e12; color: #fff; }
        .top-toolbar {
            background: #181820;
            padding: 12px 15px;
            border-bottom: 2px solid #444;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .container { padding: 20px; }
        #viewport {
            position: relative;
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 5 / 3;
            border: 2px solid #444;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            margin: 0 auto 20px auto;
        }
        #cv-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
        }
        .card { background: #181820; padding: 15px 20px; border-radius: 8px; max-width: 1000px; margin: 0 auto; }
        #log { background: #050508; color: #00ff66; padding: 10px; border-radius: 4px; font-family: monospace; height: 120px; overflow-y: auto; font-size: 12px; }
        input, button { padding: 6px 10px; font-size: 12px; }
        button { background: #00bcd4; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #008ba3; }
        button:disabled { background: #444; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="top-toolbar">
        <input type="file" id="imageInput" accept="image/*" onchange="loadToCanvas(this)">
        <span id="statusLabel" style="font-size: 13px; color: #aaa;">Загрузите схему</span>
    </div>

    <div class="container">
        <div id="viewport">
            <canvas id="cv-canvas" width="1000" height="600"></canvas>
        </div>

        <div class="card">
            <h3>Системный лог:</h3>
            <div id="log">Ожидание загрузки изображения...</div>
        </div>
    </div>

    <!-- Базовое ядро: только загрузка -->
    <script>
        let imgElement = new Image();
        let originalImageSnapshot = null;
        let cleanedImageSnapshot = null;

        function logSys(text) {
            const box = document.getElementById('log');
            if (box) {
                box.innerHTML += `<div>> ${text}</div>`;
                box.scrollTop = box.scrollHeight;
            }
            console.log("SYS:", text);
        }

        function loadToCanvas(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imgElement.src = e.target.result;
                    imgElement.onload = () => {
                        const canvas = document.getElementById('cv-canvas');
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, 1000, 600);
                        ctx.drawImage(imgElement, 0, 0, 1000, 600);
                        
                        originalImageSnapshot = ctx.getImageData(0, 0, 1000, 600);
                        cleanedImageSnapshot = ctx.getImageData(0, 0, 1000, 600);
                        
                        logSys("✅ Картинка успешно загружена.");
                        document.getElementById('statusLabel').textContent = "Загружено";

                        // Вызываем функцию конвертации из script.js сразу после загрузки
                        if (typeof convertToBlackAndWhite === 'function') {
                            convertToBlackAndWhite();
                        }
                    };
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>

    <!-- Подключение файла с продолжением логики -->
    <script src="script.js"></script>
</body>
</html>
