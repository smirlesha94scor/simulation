<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live ASCII to SVG Generator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', monospace, sans-serif; background: #1e1e24; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background: #2a2a32; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3a3a46; flex-shrink: 0; }
        h1 { font-size: 15px; color: #61afef; font-weight: 600; }

        .main { display: flex; flex: 1; overflow: hidden; }

        .editor-pane { width: 45%; border-right: 1px solid #3a3a46; display: flex; flex-direction: column; background: #25252d; height: 100%; }
        .pane-title { background: #1e1e24; padding: 6px 12px; font-size: 11px; color: #abb2bf; font-weight: bold; text-transform: uppercase; border-bottom: 1px solid #3a3a46; flex-shrink: 0; }

        textarea#ascii-input {
            flex: 1;
            min-height: 200px;
            background: #18181c;
            color: #98c379;
            border: none;
            padding: 14px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1.25;
            resize: vertical;
            outline: none;
            white-space: pre;
        }

        .bottom-editors { background: #22222b; border-top: 1px solid #3a3a46; display: flex; flex-direction: column; flex-shrink: 0; }
        .comp-editor-panel { padding: 8px 12px; border-bottom: 1px solid #3a3a46; max-height: 110px; overflow-y: auto; }
        .comp-list { display: flex; flex-wrap: wrap; gap: 6px; }
        .comp-item { background: #2a2a32; border: 1px solid #3a3a46; padding: 2px 6px; border-radius: 4px; display: flex; align-items: center; gap: 4px; font-size: 11px; }
        .comp-item input { background: #18181c; color: #fff; border: 1px solid #555; border-radius: 3px; padding: 1px 4px; width: 60px; font-family: monospace; font-size: 11px; }
        .comp-item input.val { width: 62px; color: #e5c07b; }

        .svg-template-editor { padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; background: #1b1b22; }
        .svg-template-controls { display: flex; gap: 10px; align-items: center; }
        .svg-template-controls select { background: #2a2a32; color: #61afef; border: 1px solid #3a3a46; padding: 2px 6px; border-radius: 3px; font-weight: bold; outline: none; font-size: 11px; }
        .svg-template-code { width: 100%; height: 70px; background: #121215; color: #e06c75; border: 1px solid #3a3a46; padding: 6px; font-family: 'Courier New', monospace; font-size: 11px; border-radius: 4px; resize: vertical; outline: none; }

        .preview-pane { flex: 1; background: #141416; display: flex; flex-direction: column; height: 100%; min-width: 0; }
        .canvas-wrapper { flex: 1; overflow: auto; display: flex; padding: 20px; }
        #svg-output { background: #ffffff; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 4px; margin: auto; flex-shrink: 0; }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Генератор схем в реальном времени</h1>
        <button id="touch-btn" style="background:#e06c75; color:#fff; border:none; padding:5px 10px; border-radius:4px; font-weight:bold; cursor:pointer; font-size:12px; margin-left:10px;">👆 Замкнуть E1–E2 (держать)</button>
        <label style="font-size:12px; color:#abb2bf; margin-left:auto; margin-right:14px; cursor:pointer;"><input type="checkbox" id="flow-toggle" checked> Показать ток</label>
        <button onclick="copySVG()" style="background:#61afef; color:#fff; border:none; padding:5px 12px; border-radius:4px; font-weight:bold; cursor:pointer; font-size:12px;">📋 Копировать SVG</button>
    </header>

    <div class="main">
        <div class="editor-pane">
            <div class="pane-title">Текстовый ввод (ASCII Схема) · # — пересечение проводов без точки</div>
            <textarea id="ascii-input" spellcheck="false"></textarea>

            <div class="bottom-editors">
                <div class="comp-editor-panel">
                    <div style="font-size: 10px; color: #61afef; margin-bottom: 4px; font-weight: bold;">ОБОЗНАЧЕНИЯ И НОМИНАЛЫ ЭЛЕМЕНТОВ:</div>
                    <div id="components-list" class="comp-list"></div>
                </div>

                <div class="svg-template-editor">
                    <div class="svg-template-controls">
                        <span style="font-size: 10px; color:#abb2bf ; font-weight: bold;">РЕДАКТОР SVG-КОДА ЭЛЕМЕНТА:</span>
                        <select id="svg-type-select" onchange="loadSVGTemplateToEdit()">
                            <option value="VT1">VT1 (NPN Транзистор)</option>
                            <option value="VT2">VT2 (PNP Транзистор)</option>
                            <option value="R">R (Резистор)</option>
                            <option value="C">C (Конденсатор)</option>
                            <option value="VD">VD (Диод)</option>
                            <option value="BF">BF (Динамик)</option>
                            <option value="GB">GB (Батарея)</option>
                            <option value="E">E (Разъём / штекер)</option>
                            <option value="DEFAULT">Прочий блок [name]</option>
                        </select>
                    </div>
                    <textarea id="svg-template-input" class="svg-template-code" spellcheck="false" placeholder="SVG код элемента..."></textarea>
                </div>
            </div>
        </div>

        <div class="preview-pane">
            <div class="pane-title">Реальное время (SVG Отрисовка)</div>
            <div class="canvas-wrapper">
                <svg id="svg-output" width="650" height="450" viewBox="0 0 650 450" xmlns="http://www.w3.org/2000/svg">
                    <g id="render-layer"></g>
                </svg>
            </div>
        </div>
    </div>

    <script>
        const defaultText =
`                 +----+----+----+
                 |    |    |    |
               [VD1]  |  [BF1]  |
                 |    |    |    |
            +[C1]+[C2]#----+    |
            |         |    |    |
[E1]--[R1]--+--[R2]--[VT1^]|  [GB1]
                      |    |    |
                      +---[VT2] |
                           |    |
[E2]-----------------------+----+`;

        // Пока кнопка нажата — палец замыкает E1 и E2
        let isTouched = false;
        function setTouch(v) {
            if (isTouched !== v) { isTouched = v; parseAndRender(); }
        }
        const touchBtn = document.getElementById('touch-btn');
        touchBtn.addEventListener('mousedown', () => setTouch(true));
        ['mouseup', 'mouseleave'].forEach(ev => touchBtn.addEventListener(ev, () => setTouch(false)));
        touchBtn.addEventListener('touchstart', (e) => { e.preventDefault(); setTouch(true); }, { passive: false });
        ['touchend', 'touchcancel'].forEach(ev => touchBtn.addEventListener(ev, () => setTouch(false)));

        const compValues = {
            R1: '750k', R2: '470k',
            C1: '47н', C2: '6800',
            VD1: 'Д9Б',
            VT1: 'KT315A', VT2: 'KT361',
            GB1: '9 В'
        };

        const customSVG = {
            VT1: `<circle cx="{x}" cy="{y}" r="16" fill="#fff" stroke="#000" stroke-width="2"/>
<line x1="{x}-6" y1="{y}-9" x2="{x}-6" y2="{y}+9" stroke="#000" stroke-width="3.5"/>
<line x1="{x}-18" y1="{y}" x2="{x}-6" y2="{y}" stroke="#000" stroke-width="2.5"/>
<line x1="{x}-6" y1="{y}-4" x2="{x}+6" y2="{y}-12" stroke="#000" stroke-width="2.5"/>
<line x1="{x}+6" y1="{y}-12" x2="{x}+6" y2="{y}-24" stroke="#000" stroke-width="2.5"/>
<line x1="{x}-6" y1="{y}+4" x2="{x}+6" y2="{y}+12" stroke="#000" stroke-width="2.5"/>
<line x1="{x}+6" y1="{y}+12" x2="{x}+6" y2="{y}+24" stroke="#000" stroke-width="2.5"/>
<polygon points="{x}+6,{y}+12 {x}-3,{y}+10 {x}+0,{y}+4" fill="#000"/>
<text x="{x}-4" y="{y}+28" font-size="11" font-weight="bold" text-anchor="end" font-family="Arial" fill="#000">{name}</text>
<text x="{x}-4" y="{y}+40" font-size="11" text-anchor="end" font-family="Arial" fill="#000">{val}</text>`,

            VT2: `<circle cx="{x}" cy="{y}" r="16" fill="#fff" stroke="#000" stroke-width="2"/>
<line x1="{x}-6" y1="{y}-9" x2="{x}-6" y2="{y}+9" stroke="#000" stroke-width="3.5"/>
<line x1="{x}-18" y1="{y}" x2="{x}-6" y2="{y}" stroke="#000" stroke-width="2.5"/>
<line x1="{x}-6" y1="{y}-4" x2="{x}+6" y2="{y}-12" stroke="#000" stroke-width="2.5"/>
<line x1="{x}+6" y1="{y}-12" x2="{x}+6" y2="{y}-24" stroke="#000" stroke-width="2.5"/>
<line x1="{x}-6" y1="{y}+4" x2="{x}+6" y2="{y}+12" stroke="#000" stroke-width="2.5"/>
<line x1="{x}+6" y1="{y}+12" x2="{x}+6" y2="{y}+24" stroke="#000" stroke-width="2.5"/>
<polygon points="{x}-5,{y}+5 {x}+1,{y}+13 {x}+4,{y}+7" fill="#000"/>
<text x="{x}-4" y="{y}+28" font-size="11" font-weight="bold" text-anchor="end" font-family="Arial" fill="#000">{name}</text>
<text x="{x}-4" y="{y}+40" font-size="11" text-anchor="end" font-family="Arial" fill="#000">{val}</text>`,

            R: `<rect x="{x}-22" y="{y}-8" width="44" height="16" fill="#fff" stroke="#000" stroke-width="2.5"/>
<text x="{x}" y="{y}+26" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial" fill="#000">{name} {val}</text>`,

            C: `<rect x="{x}-5" y="{y}-12" width="10" height="24" fill="#fff"/>
<line x1="{x}-5" y1="{y}-12" x2="{x}-5" y2="{y}+12" stroke="#000" stroke-width="3"/>
<line x1="{x}+5" y1="{y}-12" x2="{x}+5" y2="{y}+12" stroke="#000" stroke-width="3"/>
<text x="{x}" y="{y}+26" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial" fill="#000">{name} {val}</text>`,

            VD: `<polygon points="{x}-9,{y}-8 {x}+5,{y} {x}-9,{y}+8" fill="#000"/>
<line x1="{x}+5" y1="{y}-8" x2="{x}+5" y2="{y}+8" stroke="#000" stroke-width="2.5"/>
<text x="{x}" y="{y}+26" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial" fill="#000">{name} {val}</text>`,

            BF: `<polygon points="{x}-2,{y}-8 {x}-12,{y}-16 {x}-12,{y}+16 {x}-2,{y}+8" fill="#fff" stroke="#000" stroke-width="2.5" stroke-linejoin="miter"/>
<rect x="{x}-2" y="{y}-8" width="10" height="16" fill="#fff" stroke="#000" stroke-width="2.5"/>
<text x="{x}" y="{y}+30" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial" fill="#000">{name}</text>`,

            GB: `<rect x="{x}-26" y="{y}-12" width="52" height="24" fill="#fff"/>
<line x1="{x}-26" y1="{y}-7" x2="{x}-26" y2="{y}+7" stroke="#000" stroke-width="4"/>
<line x1="{x}-20" y1="{y}-12" x2="{x}-20" y2="{y}+12" stroke="#000" stroke-width="2"/>
<line x1="{x}-20" y1="{y}" x2="{x}+20" y2="{y}" stroke="#000" stroke-width="2" stroke-dasharray="3 3"/>
<line x1="{x}+20" y1="{y}-7" x2="{x}+20" y2="{y}+7" stroke="#000" stroke-width="4"/>
<line x1="{x}+26" y1="{y}-12" x2="{x}+26" y2="{y}+12" stroke="#000" stroke-width="2"/>
<text x="{x}" y="{y}+26" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial" fill="#000">{name} {val}</text>`,

            E: `<rect x="{x}-36" y="{y}-7" width="38" height="14" fill="#000"/>
<rect x="{x}+2" y="{y}-4" width="12" height="8" fill="#000"/>
<text x="{x}-12" y="{y}+26" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial" fill="#000">{name}</text>`,

            DEFAULT: `<rect x="{x}-22" y="{y}-10" width="44" height="20" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="{x}" y="{y}+4" font-size="11" font-weight="bold" text-anchor="middle" font-family="Arial" fill="#000">{name}</text>`
        };

        const textarea = document.getElementById('ascii-input');
        const renderLayer = document.getElementById('render-layer');
        const svgOutput = document.getElementById('svg-output');
        const componentsListEl = document.getElementById('components-list');
        const svgTypeSelect = document.getElementById('svg-type-select');
        const svgTemplateInput = document.getElementById('svg-template-input');

        textarea.value = defaultText;
        const CELL_SIZE = 16;
        const WIRE_W = 2.5;
        let lastCompSig = null;

        const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
        const cleanName = (n) => n.toUpperCase().startsWith('VT') ? n.replace(/[\^_]$/, '') : n;

        function copySVG() {
            navigator.clipboard.writeText(svgOutput.outerHTML);
            alert("SVG код скопирован!");
        }

        function loadSVGTemplateToEdit() {
            const key = svgTypeSelect.value;
            svgTemplateInput.value = customSVG[key] || '';
        }

        svgTemplateInput.addEventListener('input', () => {
            const key = svgTypeSelect.value;
            customSVG[key] = svgTemplateInput.value;
            parseAndRender();
        });

        function getNames(text) {
            const re = /\[([^\]]+)\]/g;
            const names = [];
            let m;
            while ((m = re.exec(text)) !== null) {
                if (!names.includes(m[1])) names.push(m[1]);
            }
            return names;
        }

        function updateComponentEditor(text) {
            const names = getNames(text);
            const sig = names.join('\u0001');
            if (sig === lastCompSig) return;
            lastCompSig = sig;

            componentsListEl.innerHTML = '';
            names.forEach(compName => {
                const item = document.createElement('div');
                item.className = 'comp-item';

                const input = document.createElement('input');
                input.value = compName;
                input.title = 'Обозначение';
                input.dataset.oldName = compName;

                const valInput = document.createElement('input');
                valInput.className = 'val';
                valInput.placeholder = 'номинал';
                valInput.title = 'Номинал / тип';
                valInput.value = compValues[cleanName(compName)] || '';
                valInput.dataset.name = cleanName(compName);

                input.addEventListener('input', (e) => {
                    const oldName = e.target.dataset.oldName;
                    const newName = e.target.value;
                    if (!newName.trim() || newName.includes(']')) return;
                    const oldStr = `[${oldName}]`;
                    const newStr = `[${newName}]`;
                    if (!textarea.value.includes(oldStr)) return;
                    textarea.value = textarea.value.split(oldStr).join(newStr);
                    const oldKey = cleanName(oldName), newKey = cleanName(newName);
                    if (oldKey !== newKey && oldKey in compValues) {
                        compValues[newKey] = compValues[oldKey];
                        delete compValues[oldKey];
                    }
                    e.target.dataset.oldName = newName;
                    valInput.dataset.name = newKey;
                    lastCompSig = getNames(textarea.value).join('\u0001');
                    parseAndRender();
                });

                valInput.addEventListener('input', (e) => {
                    compValues[e.target.dataset.name] = e.target.value;
                    parseAndRender();
                });

                item.appendChild(input);
                item.appendChild(valInput);
                componentsListEl.appendChild(item);
            });
        }

        function parseAndRender() {
            const rawText = textarea.value;
            const lines = rawText.split('\n');

            updateComponentEditor(rawText);

            const compRegex = /\[([^\]]+)\]/g;
            let verticalMap = {};

            for (let r = 0; r < lines.length; r++) {
                let match;
                while ((match = compRegex.exec(lines[r])) !== null) {
                    const name = match[1].trim();
                    const type = name.split(' ')[0].toUpperCase();
                    const startCol = match.index;
                    const midCol = startCol + Math.floor(match[0].length / 2);

                    let topRow = lines[r - 1];
                    let botRow = lines[r + 1];

                    let topCh = (topRow && midCol < topRow.length) ? topRow[midCol] : ' ';
                    let botCh = (botRow && midCol < botRow.length) ? botRow[midCol] : ' ';

                    let hasVerticalTop = (topCh === '|' || topCh === '+');
                    let hasVerticalBottom = (botCh === '|' || botCh === '+');

                    const isVert = (hasVerticalTop && hasVerticalBottom && !type.startsWith('VT'));
                    if (isVert) {
                        verticalMap[`${r},${midCol}`] = true;
                    }
                }
            }

            let wireLines = lines.map((line, r) => {
                let newLine = '';
                for (let c = 0; c < line.length; c++) {
                    if (line[c] === '[') {
                        let endIdx = line.indexOf(']', c);
                        if (endIdx !== -1) {
                            const len = endIdx - c + 1;
                            const type = line.slice(c + 1, endIdx).trim().split(' ')[0].toUpperCase();
                            let midCol = c + Math.floor(len / 2);

                            if (type.startsWith('VT')) {
                                newLine += '-' + ' '.repeat(len - 1);
                            } else if (verticalMap[`${r},${midCol}`]) {
                                for (let i = c; i <= endIdx; i++) {
                                    newLine += (i === midCol) ? '|' : ' ';
                                }
                            } else {
                                newLine += '-'.repeat(len);
                            }
                            c = endIdx;
                            continue;
                        }
                    }
                    newLine += line[c];
                }
                return newLine;
            });

            const maxCols = Math.max(...lines.map(l => l.length), 10);
            const maxRows = Math.max(lines.length, 10);

            const width = Math.max(maxCols * CELL_SIZE + 60, 400);
            const height = Math.max(maxRows * CELL_SIZE + 60, 300);

            svgOutput.setAttribute('width', width);
            svgOutput.setAttribute('height', height);
            svgOutput.setAttribute('viewBox', `0 0 ${width} ${height}`);

            const getWireChar = (r, c) => (r >= 0 && r < wireLines.length && c >= 0 && c < wireLines[r].length) ? wireLines[r][c] : ' ';
            const isH = (ch) => ch === '-' || ch === '+' || ch === '#';
            const isV = (ch) => ch === '|' || ch === '+' || ch === '#';

            const hLink = (r, c) => isH(getWireChar(r, c)) && isH(getWireChar(r, c + 1));
            const vLink = (r, c) => isV(getWireChar(r, c)) && isV(getWireChar(r + 1, c));

            const px = (c) => c * CELL_SIZE + 40;
            const py = (r) => r * CELL_SIZE + 40;

            let d = '';

            for (let r = 0; r < wireLines.length; r++) {
                let c = 0;
                const len = wireLines[r].length;
                while (c < len) {
                    if (hLink(r, c)) {
                        let start = c;
                        while (hLink(r, c)) c++;
                        d += `M${px(start)} ${py(r)}L${px(c)} ${py(r)}`;
                    } else {
                        c++;
                    }
                }
            }

            for (let c = 0; c < maxCols; c++) {
                let r = 0;
                while (r < wireLines.length) {
                    if (vLink(r, c)) {
                        let start = r;
                        while (vLink(r, c)) r++;
                        d += `M${px(c)} ${py(start)}L${px(c)} ${py(r)}`;
                    } else {
                        r++;
                    }
                }
            }

            let html = `<path d="${d}" fill="none" stroke="#000" stroke-width="${WIRE_W}" stroke-linecap="square" stroke-linejoin="miter"/>`;

            for (let r = 0; r < wireLines.length; r++) {
                for (let c = 0; c < wireLines[r].length; c++) {
                    if (wireLines[r][c] !== '+') continue;
                    const count =
                        (hLink(r, c) ? 1 : 0) +
                        (c > 0 && hLink(r, c - 1) ? 1 : 0) +
                        (vLink(r, c) ? 1 : 0) +
                        (r > 0 && vLink(r - 1, c) ? 1 : 0);
                    if (count >= 3) {
                        html += `<circle cx="${px(c)}" cy="${py(r)}" r="3.5" fill="#000"/>`;
                    }
                }
            }

            html += buildFlow(lines, verticalMap, getWireChar, hLink, vLink, wireLines, px, py);

            for (let r = 0; r < lines.length; r++) {
                let match;
                while ((match = compRegex.exec(lines[r])) !== null) {
                    const name = match[1].trim();
                    const type = name.split(' ')[0].toUpperCase();
                    const startCol = match.index;
                    const endCol = match.index + match[0].length;

                    const midCol = startCol + Math.floor(match[0].length / 2);
                    const isVertical = !!verticalMap[`${r},${midCol}`];

                    let centerX;
                    if (type.startsWith('VT')) {
                        centerX = px(startCol + 1) - 6;
                    } else if (isVertical) {
                        centerX = px(midCol);
                    } else {
                        centerX = (px(startCol) + px(endCol - 1)) / 2;
                    }
                    const centerY = py(r);

                    html += renderComponent(name, centerX, centerY, isVertical);
                }
            }

            html += buildFinger(lines, px, py);
            renderLayer.innerHTML = html;
        }

        function templateKey(type) {
            return Object.keys(customSVG)
                .filter(k => k !== 'DEFAULT')
                .sort((a, b) => b.length - a.length)
                .find(k => type.startsWith(k)) || 'DEFAULT';
        }

        /*
          Ток считается как в настоящей цепи постоянного тока: «+» батареи = 1, «−» = 0.
          Провода — малое сопротивление, элементы (R, BF, E, переходы транзисторов) — большое.
          Конденсаторы ток не пропускают; диод и переходы транзисторов проводят в одну сторону.
          Точки бегут по проводам от большего потенциала к меньшему; без перепада тока нет.
        */
        function buildACFlow(lines, verticalMap, getWireChar, hLink, vLink, wireLines, px, py) {
            if (!document.getElementById('flow-toggle').checked) return '';
            
            const re = /\[([^\]]+)\]/g;
            const nid = (r, c, p) => getWireChar(r, c) === '#' ? `${r},${c},${p}` : `${r},${c}`;
            const G_EL = 0.05;
            const L = [];
            const link = (a, b, g, oneWay, ctl) => L.push({ a, b, g, d: !!oneWay, ctl });
            const cut = new Set(), srcs = [], sinks = [], plugs = [], vts = [];

            for (let r = 0; r < lines.length; r++) {
                let m;
                while ((m = re.exec(lines[r])) !== null) {
                    const raw = m[1].trim();
                    const type = raw.split(' ')[0].toUpperCase();
                    const s = m.index, e = s + m[0].length, mid = s + Math.floor(m[0].length / 2);
                    const key = templateKey(type);

                    if (type.startsWith('VT')) {
                        const col = s + 1;
                        const top = nid(r - 1, col, 'v'), bot = nid(r + 1, col, 'v'), base = nid(r, s, 'h');
                        const flip = /\^$/.test(raw);
                        const c = flip ? bot : top, em = flip ? top : bot;
                        vts.push({ b: base, c, e: em, p: key === 'VT2' ? -1 : 1 });
                        if (key === 'VT2') { link(em, c, G_EL, true, { b: base, e: em, p: -1 }); link(em, base, G_EL, true); }
                        else { link(c, em, G_EL, true, { b: base, e: em, p: 1 }); link(base, em, G_EL, true); }
                        continue;
                    }

                    const vert = !!verticalMap[`${r},${mid}`];
                    let A, B;
                    if (vert) {
                        A = nid(r - 1, mid, 'v'); B = nid(r + 1, mid, 'v');
                        cut.add(`v${r - 1},${mid}`); cut.add(`v${r},${mid}`);
                    } else {
                        A = nid(r, s, 'h'); B = nid(r, e - 1, 'h');
                        for (let c = s; c < e - 1; c++) cut.add(`h${r},${c}`);
                    }

                    if (key === 'C') {
                        // Конденсатор: при касании пропускает переменный сигнал лучше
                        const gCap = isTouched ? 0.08 : 0.01;
                        link(A, B, gCap); link(B, A, gCap);
                    } else if (key === 'GB') {
                        srcs.push(B); sinks.push(A);
                    } else if (key === 'VD') {
                        if (vert) link(B, A, G_EL, true); else link(A, B, G_EL, true);
                    } else {
                        link(A, B, G_EL); link(B, A, G_EL);
                    }
                    if (key === 'E') plugs.push(B);
                }
            }

            const segs = [];
            for (let r = 0; r < wireLines.length; r++) {
                for (let c = 0; c < wireLines[r].length; c++) {
                    if (hLink(r, c) && !cut.has(`h${r},${c}`)) {
                        const a = nid(r, c, 'h'), b = nid(r, c + 1, 'h');
                        link(a, b, 1.0); link(b, a, 1.0);
                        segs.push([a, b, c, r, c + 1, r]);
                    }
                    if (vLink(r, c) && !cut.has(`v${r},${c}`)) {
                        const a = nid(r, c, 'v'), b = nid(r + 1, c, 'v');
                        link(a, b, 1.0); link(b, a, 1.0);
                        segs.push([a, b, c, r, c, r + 1]);
                    }
                }
            }

            if (isTouched) for (let i = 1; i < plugs.length; i++) link(plugs[0], plugs[i], G_EL);

            if (!srcs.length || !sinks.length) return '';

            const ids = new Map();
            const ix = (id) => { if (!ids.has(id)) ids.set(id, ids.size); return ids.get(id); };
            L.forEach(l => { l.a = ix(l.a); l.b = ix(l.b); if (l.ctl) { l.ctl.b = ix(l.ctl.b); l.ctl.e = ix(l.ctl.e); } });
            const fixed = new Map();
            srcs.forEach(n => fixed.set(ix(n), 1));
            sinks.forEach(n => fixed.set(ix(n), 0));
            const N = ids.size;
            const nb = Array.from({ length: N }, () => []);
            L.forEach((l, i) => { nb[l.a].push(i); nb[l.b].push(i); });
            const V = new Float64Array(N);
            fixed.forEach((v, n) => { V[n] = v; });

            const VB = 0.03;
            const G_LEAK = 0.0005;
            const effG = (l) => {
                if (l.d && V[l.a] <= V[l.b]) return 0;
                if (l.ctl && (V[l.ctl.b] - V[l.ctl.e]) * l.ctl.p < VB) return G_LEAK;
                return l.g;
            };

            for (let it = 0; it < 12000; it++) {
                let maxd = 0;
                for (let n = 0; n < N; n++) {
                    if (fixed.has(n)) continue;
                    let sw = 0, sv = 0;
                    for (const li of nb[n]) {
                        const l = L[li];
                        const g = effG(l);
                        if (!g) continue;
                        const mNode = l.a === n ? l.b : l.a;
                        sw += g;
                        sv += g * V[mNode];
                    }
                    if (sw > 0) {
                        const nv = sv / sw;
                        maxd = Math.max(maxd, Math.abs(nv - V[n]));
                        V[n] = nv;
                    }
                }
                if (maxd < 1e-8) break;
            }

            const parent = Array.from({ length: N }, (_, i) => i);
            const find = (x) => { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
            segs.forEach(([a, b]) => { parent[find(ids.get(a))] = find(ids.get(b)); });
            const masked = new Set();
            vts.forEach(t => {
                const bb = ids.get(t.b), cc = ids.get(t.c), ee = ids.get(t.e);
                if ((V[bb] - V[ee]) * t.p < VB) {
                    if (t.p === 1) { masked.add(find(cc)); masked.add(find(ee)); }
                    else { masked.add(find(bb)); masked.add(find(cc)); }
                }
            });

            const EPS = 2e-4;
            let d = '';
            segs.forEach(([a, b, c1, r1, c2, r2]) => {
                if (masked.has(find(ids.get(a)))) return;
                const dv = V[ids.get(a)] - V[ids.get(b)];
                if (Math.abs(dv) < EPS) return;
                d += dv > 0
                    ? `M${px(c1)} ${py(r1)}L${px(c2)} ${py(r2)}`
                    : `M${px(c2)} ${py(r2)}L${px(c1)} ${py(r1)}`;
            });
            if (!d) return '';

            const half = CELL_SIZE / 2;
            const duration = isTouched ? '0.2s' : '0.7s';
            const strokeColor = isTouched ? '#61afef' : '#ff3b30';

            return `<path d="${d}" fill="none" stroke="${strokeColor}" stroke-width="5" stroke-linecap="round" stroke-dasharray="0.1 ${half - 0.1}"><animate attributeName="stroke-dashoffset" from="0" to="-${half}" dur="${duration}" repeatCount="indefinite"/></path>`;
        }

        // «Палец», замыкающий разъёмы E1 и E2
        function buildFinger(lines, px, py) {
            if (!isTouched) return '';
            const re = /\[([^\]]+)\]/g;
            const pts = [];
            for (let r = 0; r < lines.length; r++) {
                let m;
                while ((m = re.exec(lines[r])) !== null) {
                    const type = m[1].trim().split(' ')[0].toUpperCase();
                    if (templateKey(type) !== 'E') continue;
                    const s = m.index, e = s + m[0].length;
                    pts.push({ x: (px(s) + px(e - 1)) / 2 - 17, y: py(r) });
                }
            }
            if (pts.length < 2) return '';
            const path = pts.map((p, i) => `${i ? 'L' : 'M'}${p.x} ${p.y}`).join('');
            return `<path d="${path}" fill="none" stroke="#f4a261" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>`;
        }

        function renderComponent(rawName, x, y, isVertical) {
            const isTr = rawName.toUpperCase().startsWith('VT');
            const flip = isTr && /\^$/.test(rawName);
            const fullName = cleanName(rawName);
            const type = fullName.split(' ')[0].toUpperCase();
            let key = templateKey(type);

            const parts = fullName.split(' ');
            const val = compValues[fullName] || parts.slice(1).join(' ');

            let template = customSVG[key] || '';
            let cleanTemplate = template;
            if (key === 'GB') {
                cleanTemplate = template.replace(/<text[^>]*>[\+\-]<\/text>/g, '');
            }

            let compiled = cleanTemplate.replace(/\{x\}([\+\-]\d+)?/g, (_, offset) => x + (offset ? parseInt(offset) : 0))
                                       .replace(/\{y\}([\+\-]\d+)?/g, (_, offset) => y + (offset ? parseInt(offset) : 0))
                                       .replace(/\{name\}/g, () => esc(parts[0]))
                                       .replace(/\{val\}/g, () => esc(val));

            if (isVertical && !type.startsWith('VT')) {
                const rot = type.startsWith('VD') ? -90 : 90;
                const body = compiled.replace(/<text[\s\S]*?<\/text>/g, '');
                const st = 'font-size="11" font-family="Arial" fill="#000"';
                let label = `<text x="${x + 20}" y="${y - 1}" ${st} font-weight="bold">${esc(parts[0])}</text>`;
                if (val) label += `<text x="${x + 20}" y="${y + 12}" ${st}>${esc(val)}</text>`;

                let polarityLabels = '';
                if (key === 'GB') {
                    const pst = 'font-size="12" font-weight="bold" font-family="Arial" fill="#000" text-anchor="middle"';
                    polarityLabels = `
                        <text x="${x - 20}" y="${y - 20}" ${pst}>-</text>
                        <text x="${x - 20}" y="${y + 26}" ${pst}>+</text>
                    `;
                }

                return `<g transform="rotate(${rot} ${x} ${y})">${body}</g>${label}${polarityLabels}`;
            }

            if (key === 'GB') {
                const pst = 'font-size="12" font-weight="bold" font-family="Arial" fill="#000" text-anchor="middle"';
                const horizontalPolarity = `
                    <text x="${x - 20}" y="${y - 20}" ${pst}>-</text>
                    <text x="${x - 20}" y="${y + 26}" ${pst}>+</text>
                `;
                return `<g>${compiled}</g>${horizontalPolarity}`;
            }

            if (flip) {
                const texts = compiled.match(/<text[\s\S]*?<\/text>/g) || [];
                const body = compiled.replace(/<text[\s\S]*?<\/text>/g, '');
                return `<g transform="translate(0 ${2 * y}) scale(1 -1)">${body}</g>${texts.join('')}`;
            }

            return `<g>${compiled}</g>`;
        }

        textarea.addEventListener('input', parseAndRender);
        document.getElementById('flow-toggle').addEventListener('change', parseAndRender);
        loadSVGTemplateToEdit();
        parseAndRender();
    </script>
</body>
</html>
