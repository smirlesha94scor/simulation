<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Реалістична залізнична стрілка на JS</title>
  <style>
    body {
      margin: 0;
      background: #1e1e1e;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    canvas {
      background: #2b2623; /* Колір баласту (щебеню) */
      border: 2px solid #444;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      cursor: pointer;
    }
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 15px;
      align-items: center;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background: #d97706;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
    }
    button:hover { background: #b45309; }
    .status { font-size: 18px; }
  </style>
</head>
<body>

  <canvas id="railCanvas" width="900" height="400"></canvas>
  
  <div class="controls">
    <button id="toggleBtn">Перевести стрілку (Пробіл)</button>
    <div class="status">Напрямок: <strong id="dirText">Прямо (Головна колія)</strong></div>
  </div>

<script>
const canvas = document.getElementById('railCanvas');
const ctx = canvas.getContext('2d');
const toggleBtn = document.getElementById('toggleBtn');
const dirText = document.getElementById('dirText');

// Налаштування колії
const GAUGE = 36; // Ширина колії в пікселях
const HALF_GAUGE = GAUGE / 2;
const Y_MAIN = 260; // Y-координата головної колії

// Стан стрілки
let isDiverging = false; // false = прямо, true = на бокову колію
let switchProgress = 0;  // 0.0 (прямо) -> 1.0 (відхилення) для плавної анімації

// Параметри поїзда
let train = {
  t: 0, // Прогрес руху (від 0 до 1)
  speed: 0.003,
  length: 140
};

// --- МАТЕМАТИКА КРИВИХ (Крива Безьє для відгалуження) ---
// Точки відгалуження центральної осі
const P0 = { x: 250, y: Y_MAIN };          // Початок вістряків
const P1 = { x: 450, y: Y_MAIN };          // Контрольна точка 1 (плавний вихід)
const P2 = { x: 520, y: Y_MAIN - 110 };    // Контрольна точка 2
const P3 = { x: 850, y: Y_MAIN - 110 };    // Кінець бокової колії

// Отримання координати (x, y) на кривій Безьє для t [0..1]
function getBezierPoint(t, p0, p1, p2, p3) {
  const u = 1 - t;
  const tt = t * t;
  const uu = u * u;
  const uuu = uu * u;
  const ttt = tt * t;

  return {
    x: uuu * p0.x + 3 * uu * t * p1.x + 3 * u * tt * p2.x + ttt * p3.x,
    y: uuu * p0.y + 3 * uu * t * p1.y + 3 * u * tt * p2.y + ttt * p3.y
  };
}

// Отримання кута дотичної (нахилу) в точці t
function getBezierAngle(t, p0, p1, p2, p3) {
  const u = 1 - t;
  const dx = 3 * u * u * (p1.x - p0.x) + 6 * u * t * (p2.x - p1.x) + 3 * t * t * (p3.x - p2.x);
  const dy = 3 * u * u * (p1.y - p0.y) + 6 * u * t * (p2.y - p1.y) + 3 * t * t * (p3.y - p2.y);
  return Math.atan2(dy, dx);
}

// Отримання точки рейки зі зміщенням (offset = +HALF_GAUGE або -HALF_GAUGE)
function getOffsetPoint(t, offset) {
  const pt = getBezierPoint(t, P0, P1, P2, P3);
  const angle = getBezierAngle(t, P0, P1, P2, P3);
  return {
    x: pt.x - Math.sin(angle) * offset,
    y: pt.y + Math.cos(angle) * offset
  };
}

// --- ВІЗУАЛІЗАЦІЯ ---

function drawSleepers() {
  ctx.fillStyle = '#3e352f'; // Колір дерев'яних/бетонних шпал
  
  // 1. Шпали головної колії (до стрілки та після)
  for (let x = 20; x < 880; x += 18) {
    // Подовжені перевідні бруси в зоні стрілки
    if (x >= 240 && x <= 560) {
      let extraHeight = (x - 240) * 0.35;
      ctx.fillRect(x - 4, Y_MAIN - HALF_GAUGE - 10 - extraHeight, 8, GAUGE + 20 + extraHeight);
    } else {
      ctx.fillRect(x - 4, Y_MAIN - HALF_GAUGE - 10, 8, GAUGE + 20);
    }
  }

  // 2. Шпали бокової колії (після розділення)
  for (let t = 0.45; t <= 1.0; t += 0.03) {
    const pt = getBezierPoint(t, P0, P1, P2, P3);
    const angle = getBezierAngle(t, P0, P1, P2, P3);
    ctx.save();
    ctx.translate(pt.x, pt.y);
    ctx.rotate(angle);
    ctx.fillRect(-4, -HALF_GAUGE - 10, 8, GAUGE + 20);
    ctx.restore();
  }
}

function drawRailPath(drawFunc, width = 4, color = '#9ca3af') {
  ctx.beginPath();
  drawFunc();
  ctx.lineWidth = width;
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  ctx.stroke();

  // Блік на головці рейки для об'єму
  ctx.beginPath();
  drawFunc();
  ctx.lineWidth = width * 0.4;
  ctx.strokeStyle = '#e5e7eb';
  ctx.stroke();
}

function drawTrack() {
  // 1. РАМНІ РЕЙКИ (нерухомі зовнішні рейки)
  // Нижня рамна рейка (пряма)
  drawRailPath(() => {
    ctx.moveTo(0, Y_MAIN + HALF_GAUGE);
    ctx.lineTo(900, Y_MAIN + HALF_GAUGE);
  });

  // Верхня рамна рейка (йде прямо до P0, а далі повертає на бокову колію)
  drawRailPath(() => {
    ctx.moveTo(0, Y_MAIN - HALF_GAUGE);
    ctx.lineTo(P0.x, Y_MAIN - HALF_GAUGE);
    for (let t = 0; t <= 1; t += 0.02) {
      const pt = getOffsetPoint(t, -HALF_GAUGE);
      ctx.lineTo(pt.x, pt.y);
    }
  });

  // 2. ВНУТРІШНІ РЕЙКИ (після хрестовини)
  // Верхня рейка головної колії (починається після вістряків)
  drawRailPath(() => {
    ctx.moveTo(P0.x + 110, Y_MAIN - HALF_GAUGE);
    ctx.lineTo(900, Y_MAIN - HALF_GAUGE);
  });

  // Нижня рейка бокової колії (починається після вістряків)
  drawRailPath(() => {
    for (let t = 0.18; t <= 1; t += 0.02) {
      const pt = getOffsetPoint(t, +HALF_GAUGE);
      if (t === 0.18) ctx.moveTo(pt.x, pt.y);
      else ctx.lineTo(pt.x, pt.y);
    }
  });

  // 3. КОНТРРЕЙКИ (важливий елемент реалізму біля хрестовини)
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#6b7280';
  // Нижня контррейка (біля головної рейки)
  ctx.beginPath();
  ctx.moveTo(455, Y_MAIN + HALF_GAUGE - 5);
  ctx.lineTo(525, Y_MAIN + HALF_GAUGE - 5);
  ctx.stroke();

  // 4. РУХОМІ ВІСТРЯКИ (Гостряки стрілки)
  const switchLen = 110; // Довжина рухомої частини
  const throwDist = 10;  // На скільки пікселів відходить вістряк від рамної рейки

  // Верхній вістряк (притискається до верхньої рамної рейки, коли їдемо ПРЯМО)
  const topBladeGap = switchProgress * throwDist;
  drawRailPath(() => {
    ctx.moveTo(P0.x + switchLen, Y_MAIN - HALF_GAUGE); // Корінь вістряка
    ctx.lineTo(P0.x, Y_MAIN - HALF_GAUGE + topBladeGap); // Вістря
  }, 3.5, '#f59e0b'); // Підсвітимо трохи золотистим для наочності

  // Нижній вістряк (притискається до нижньої рамної рейки, коли їдемо НА БОКОВУ)
  const botBladeGap = (1 - switchProgress) * throwDist;
  const bladeRoot = getOffsetPoint(0.18, +HALF_GAUGE);
  drawRailPath(() => {
    ctx.moveTo(bladeRoot.x, bladeRoot.y); // Корінь вістряка
    ctx.lineTo(P0.x, Y_MAIN + HALF_GAUGE - botBladeGap); // Вістря
  }, 3.5, '#f59e0b');

  // Стрілочна тяга (з'єднує обидва вістряки)
  ctx.beginPath();
  ctx.moveTo(P0.x + 15, Y_MAIN - HALF_GAUGE + topBladeGap);
  ctx.lineTo(P0.x + 15, Y_MAIN + HALF_GAUGE - botBladeGap);
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#ef4444';
  ctx.stroke();
}

// --- ФІЗИКА ТА ВІЗУАЛІЗАЦІЯ ПОЇЗДА ---

// Отримання позиції та кута вагону на колії в залежності від пройденої дистанції S
function getTrackTransformAtDistance(dist) {
  if (dist < P0.x) {
    // До стрілки (прямо)
    return { x: dist, y: Y_MAIN, angle: 0 };
  } 
  
  if (!isDiverging) {
    // По головній колії (прямо)
    return { x: dist, y: Y_MAIN, angle: 0 };
  } else {
    // По боковій колії (рух по кривій Безьє)
    const curveDist = dist - P0.x;
    const totalCurveLen = 620; // Приблизна довжина кривої в пікселях
    let t = curveDist / totalCurveLen;
    if (t > 1) t = 1;
    
    const pt = getBezierPoint(t, P0, P1, P2, P3);
    const angle = getBezierAngle(t, P0, P1, P2, P3);
    return { x: pt.x, y: pt.y, angle: angle };
  }
}

function drawTrain() {
  // Поїзд має два візки (передній та задній) для реалістичного входу в поворот!
  const frontDist = train.t * 1050;
  const rearDist = frontDist - 90; // Відстань між візками

  if (rearDist > 920) {
    train.t = 0; // Перезапуск поїзда
    return;
  }

  const frontBogie = getTrackTransformAtDistance(frontDist);
  const rearBogie = getTrackTransformAtDistance(rearDist);

  // Центр кузова вагону — між візками
  const centerX = (frontBogie.x + rearBogie.x) / 2;
  const centerY = (frontBogie.y + rearBogie.y) / 2;
  // Кут кузова визначається лінією між візками
  const bodyAngle = Math.atan2(frontBogie.y - rearBogie.y, frontBogie.x - rearBogie.x);

  // Малюємо колісні пари (візки)
  [frontBogie, rearBogie].forEach(bogie => {
    ctx.save();
    ctx.translate(bogie.x, bogie.y);
    ctx.rotate(bogie.angle);
    ctx.fillStyle = '#111';
    ctx.fillRect(-12, -HALF_GAUGE - 2, 24, GAUGE + 4);
    ctx.restore();
  });

  // Малюємо кузов локомотива
  ctx.save();
  ctx.translate(centerX, centerY);
  ctx.rotate(bodyAngle);

  // Тінь
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(-65, -20, 130, 44);

  // Корпус
  ctx.fillStyle = '#2563eb';
  ctx.strokeStyle = '#1d4ed8';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(-65, -22, 130, 44, 6);
  ctx.fill();
  ctx.stroke();

  // Кабіна та деталі даху
  ctx.fillStyle = '#1e40af';
  ctx.fillRect(35, -18, 22, 36); // Лобове скло
  ctx.fillStyle = '#93c5fd';
  ctx.fillRect(48, -16, 6, 32);  // Скло

  // Прожектор
  ctx.fillStyle = '#fef08a';
  ctx.beginPath();
  ctx.arc(65, 0, 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// --- ГОЛОВНИЙ ЦИКЛ ---

function toggleSwitch() {
  // Забороняємо переведення стрілки, якщо поїзд зараз на ній (захист від сходу з рейок!)
  const frontDist = train.t * 1050;
  const rearDist = frontDist - 90;
  if (frontDist > P0.x - 20 && rearDist < P0.x + 250) {
    alert("Небезпечно! Поїзд на стрілці!");
    return;
  }

  isDiverging = !isDiverging;
  dirText.textContent = isDiverging ? "На бокову колію (Відхилення)" : "Прямо (Головна колія)";
  dirText.style.color = isDiverging ? "#f59e0b" : "#4ade80";
}

toggleBtn.addEventListener('click', toggleSwitch);
canvas.addEventListener('click', toggleSwitch);
window.addEventListener('keydown', (e) => {
