<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CV Circuit Scanner - Полуавтоматическое выравнивание областей</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #0e0e12; color: #fff; }
        .card { background: #181820; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        input, button, select { padding: 8px 12px; margin: 5px 0; font-size: 14px; }
        
        button { background: #ff007f; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #d9006b; }
        button:disabled { background: #444; cursor: not-allowed; }

        .btn-auto { background: #00ff66; color: #000; }
        .btn-auto:hover { background: #00cc52; }

        .btn-bg { background: #00bcd4; color: #fff; }
        .btn-bg:hover { background: #008ba3; }

        .btn-align { background: #9b51e0; color: #fff; }
        .btn-align:hover { background: #823ab7; }

        input[type="range"] { width: 250px; vertical-align: middle; }

        #viewport {
            position: relative;
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 5 / 3;
            border: 2px solid #444;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            margin: 0 auto;
        }

        #cv-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
            cursor: crosshair;
            z-index: 1;
        }

        #log { background: #050508; color: #00ff66; padding: 10px; border-radius: 4px; font-family: monospace; height: 120px; overflow-y: auto; font-size: 12px; }
        .color-preview { display: inline-block; width: 16px; height: 16px; border-radius: 50%; border: 1px solid #fff; vertical-align: middle; margin-left: 5px; }
        .btn-group { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <h1>⚡ Сканер схем: Полуавтоматическое выравнивание по областям</h1>

    <div class="card">
        <input type="file" id="imageInput" accept="image/*" onchange="loadToCanvas(this)"><br>
        
        <div style="margin: 10px 0;">
            <label>Чувствительность очистки фона: <span id="sensValue">50</span></label><br>
            <input type="range" id="sensitivity" min="10" max="180" value="50" oninput="onSensitivityChange(this.value)">
        </div>

        <span id="selectedColorStatus">1. Кликните по линии для выбора цвета</span>
        <span id="colorBox" class="color-preview" style="display:none;"></span><br>

        <div class="btn-group">
            <button id="btnAutoClean" class="btn-auto" onclick="autoCleanBackground()" disabled>🪄 Авто-очистка фона</button>
            <button id="btnMakeWhite" class="btn-bg" onclick="runColorFilter()" disabled>Ручная очистка</button>
            <button id="btnAlignH" class="btn-align" onclick="alignSelectedArea('horizontal')" disabled>↔️ Выровнять выделение в горизонт</button>
            <button id="btnAlignV" class="btn-align" onclick="alignSelectedArea('vertical')" disabled>↕️ Выровнять выделение в вертикаль</button>
        </div>
        <p style="font-size: 13px; color: #aaa; margin-top: 10px;">💡 <i>После выбора цвета зажмите левую кнопку мыши на схеме и выделите рамкой нужную кривую линию.</i></p>
    </div>

    <div class="card">
        <div id="viewport">
            <canvas id="cv-canvas" width="1000" height="600"></canvas>
        </div>
    </div>

    <div class="card">
        <h3>Лог работы системы:</h3>
        <div id="log">Загрузите изображение и выберите цвет пипеткой...</div>
    </div>

<script>
    let imgElement = new Image();
    let selectedColorRgb = null;

    // Переменные для выделения области мышкой
    let isDrawing = false;
    let startX = 0, startY = 0;
    let endX = 0, endY = 0;
    let originalImageSnapshot = null;

    window.onload = () => {
        setupCanvasInteraction();
    };

    function log(text) {
        const box = document.getElementById('log');
        box.innerHTML += `<div>> ${text}</div>`;
        box.scrollTop = box.scrollHeight;
    }

    function loadToCanvas(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                imgElement.src = e.target.result;
                imgElement.onload = () => {
                    const canvas = document.getElementById('cv-canvas');
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, 1000, 600);
                    ctx.drawImage(imgElement, 0, 0, 1000, 600);
                    originalImageSnapshot = ctx.getImageData(0, 0, 1000, 600);
                    selectedColorRgb = null;
                    document.getElementById('colorBox').style.display = 'none';
                    document.getElementById('selectedColorStatus').textContent = "1. Кликните по линии на схеме для выбора цвета";
                    document.getElementById('btnMakeWhite').disabled = true;
                    document.getElementById('btnAutoClean').disabled = true;
                    document.getElementById('btnAlignH').disabled = true;
                    document.getElementById('btnAlignV').disabled = true;
                    log("Изображение загружено. Выберите цвет пипеткой.");
                };
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    function setupCanvasInteraction() {
        const canvas = document.getElementById('cv-canvas');

        canvas.addEventListener('mousedown', (e) => {
            if (!selectedColorRgb) {
                // Если цвет еще не выбран — работаем как пипетка (клик)
                const rect = canvas.getBoundingClientRect();
                const scaleX = 1000 / rect.width;
                const scaleY = 600 / rect.height;
                const x = Math.floor((e.clientX - rect.left) * scaleX);
                const y = Math.floor((e.clientY - rect.top) * scaleY);

                try {
                    const ctx = canvas.getContext('2d');
                    const pixel = ctx.getImageData(x, y, 1, 1).data;
                    selectedColorRgb = { r: pixel[0], g: pixel[1], b: pixel[2] };

                    const colorHex = `rgb(${pixel[0]}, ${pixel[1]}, ${pixel[2]})`;
                    const colorBox = document.getElementById('colorBox');
                    colorBox.style.background = colorHex;
                    colorBox.style.display = 'inline-block';

                    document.getElementById('selectedColorStatus').textContent = `Выбран цвет: RGB(${pixel[0]}, ${pixel[1]}, ${pixel[2]})`;
                    document.getElementById('btnMakeWhite').disabled = false;
                    document.getElementById('btnAutoClean').disabled = false;
                    document.getElementById('btnAlignH').disabled = false;
                    document.getElementById('btnAlignV').disabled = false;

                    log(`🎨 Выбран эталонный цвет RGB(${pixel[0]}, ${pixel[1]}, ${pixel[2]}). Теперь можно выделять области рамкой.`);
                } catch (err) {
                    log("❌ Ошибка выбора цвета: " + err.message);
                }
                return;
            }

            // Инициализация выделения области рамкой
            const rect = canvas.getBoundingClientRect();
            const scaleX = 1000 / rect.width;
            const scaleY = 600 / rect.height;
            startX = Math.floor((e.clientX - rect.left) * scaleX);
            startY = Math.floor((e.clientY - rect.top) * scaleY);
            isDrawing = true;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing || !selectedColorRgb) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = 1000 / rect.width;
            const scaleY = 600 / rect.height;
            endX = Math.floor((e.clientX - rect.left) * scaleX);
            endY = Math.floor((e.clientY - rect.top) * scaleY);

            // Перерисовываем холст и показываем рамку выделения в реальном времени
            const ctx = canvas.getContext('2d');
            ctx.putImageData(originalImageSnapshot, 0, 0);
            
            ctx.strokeStyle = '#ff007f';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.strokeRect(startX, startY, endX - startX, endY - startY);
            ctx.setLineDash([]);
        });

        canvas.addEventListener('mouseup', (e) => {
            if (!isDrawing) return;
            isDrawing = false;
            const rect = canvas.getBoundingClientRect();
            const scaleX = 1000 / rect.width;
            const scaleY = 600 / rect.height;
            endX = Math.floor((e.clientX - rect.left) * scaleX);
            endY = Math.floor((e.clientY - rect.top) * scaleY);
            log(`📐 Выделена область: X[${Math.min(startX, endX)}...${Math.max(startX, endX)}], Y[${Math.min(startY, endY)}...${Math.max(startY, endY)}]`);
        });
    }

    function onSensitivityChange(val) {
        document.getElementById('sensValue').textContent = val;
    }

    function runColorFilter(customTolerance = null) {
        if (!selectedColorRgb) return;

        const tolerance = customTolerance !== null ? customTolerance : parseInt(document.getElementById('sensitivity').value);
        const canvas = document.getElementById('cv-canvas');
        const ctx = canvas.getContext('2d');
        
        ctx.drawImage(imgElement, 0, 0, 1000, 600);
        const imgData = ctx.getImageData(0, 0, 1000, 600);
        const data = imgData.data;

        for (let i = 0; i < data.length; i += 4) {
            let r = data[i], g = data[i+1], b = data[i+2];
            let distance = Math.sqrt(
                Math.pow(r - selectedColorRgb.r, 2) +
                Math.pow(g - selectedColorRgb.g, 2) +
                Math.pow(b - selectedColorRgb.b, 2)
            );
            if (distance > tolerance) {
                data[i] = 255; data[i+1] = 255; data[i+2] = 255;
            }
        }

        ctx.putImageData(imgData, 0, 0);
        originalImageSnapshot = ctx.getImageData(0, 0, 1000, 600); // Сохраняем состояние после очистки
        log(`✅ Фон очищен.`);
    }

    function autoCleanBackground() {
        if (!selectedColorRgb) return;
        const canvas = document.getElementById('cv-canvas');
        const ctx = canvas.getContext('2d');
        ctx.drawImage(imgElement, 0, 0, 1000, 600);
        const imgData = ctx.getImageData(0, 0, 1000, 600);
        const data = imgData.data;

        let distances = [];
        for (let i = 0; i < data.length; i += 16) {
            let r = data[i], g = data[i+1], b = data[i+2];
            let dist = Math.sqrt(
                Math.pow(r - selectedColorRgb.r, 2) +
                Math.pow(g - selectedColorRgb.g, 2) +
                Math.pow(b - selectedColorRgb.b, 2)
            );
            distances.push(dist);
        }
        distances.sort((a, b) => a - b);
        let autoSensitivity = Math.floor(distances[Math.floor(distances.length * 0.25)]);
        if (autoSensitivity < 25) autoSensitivity = 25;
        if (autoSensitivity > 140) autoSensitivity = 140;

        document.getElementById('sensitivity').value = autoSensitivity;
        document.getElementById('sensValue').textContent = autoSensitivity;
        log(`🪄 Автоподбор чувствительности: ${autoSensitivity}`);
        runColorFilter(autoSensitivity);
    }

    // ПОЛУАВТОМАТИЧЕСКОЕ ВЫРАВНИВАНИЕ ВЫДЕЛЕННОЙ ОБЛАСТИ
    function alignSelectedArea(direction) {
        if (!selectedColorRgb) {
            alert('Сначала выберите цвет линии!');
            return;
        }

        const canvas = document.getElementById('cv-canvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        
        // Восстанавливаем чистый холст перед применением выравнивания к выделению
        ctx.putImageData(originalImageSnapshot, 0, 0);
        const imgData = ctx.getImageData(0, 0, width, height);
        const data = imgData.data;

        let x1 = Math.max(0, Math.min(startX, endX));
        let x2 = Math.min(width, Math.max(startX, endX));
        let y1 = Math.max(0, Math.min(startY, endY));
        let y2 = Math.min(height, Math.max(startY, endY));

        // Если область не выделена, применяем ко всему холсту
        if (x1 === x2 || y1 === y2) {
            x1 = 0; x2 = width; y1 = 0; y2 = height;
        }

        const lineR = selectedColorRgb.r;
        const lineG = selectedColorRgb.g;
        const lineB = selectedColorRgb.b;

        function isLinePixel(r, g, b) {
            let dist = Math.sqrt(Math.pow(r - lineR, 2) + Math.pow(g - lineG, 2) + Math.pow(b - lineB, 2));
            return dist < 60;
        }

        log(`⚙️ Выравнивание выделенной области (${direction === 'horizontal' ? 'Горизонталь' : 'Вертикаль'})...`);

        if (direction === 'horizontal') {
            // Выравнивание в горизонтальную линию (усреднение Y для каждого столбца в выделении)
            for (let x = x1; x <= x2; x++) {
                let sumY = 0;
                let count = 0;
                let minY = height, maxY = 0;

                for (let y = y1; y <= y2; y++) {
                    let idx = (y * width + x) * 4;
                    if (isLinePixel(data[idx], data[idx+1], data[idx+2])) {
                        sumY += y;
                        count++;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                    }
                }

                if (count >= 2) {
                    let avgY = Math.round(sumY / count);
                    // Очищаем старый вертикальный столбец в пределах выделения
                    for (let y = y1; y <= y2; y++) {
                        let idx = (y * width + x) * 4;
                        data[idx] = 255; data[idx+1] = 255; data[idx+2] = 255;
                    }
                    // Рисуем строго ровную горизонтальную точку/опору
                    for (let y = minY; y <= maxY; y++) {
                        let idx = (y * width + x) * 4;
                        data[idx] = lineR; data[idx+1] = lineG; data[idx+2] = lineB;
                    }
                }
            }
        } else {
            // Выравнивание в вертикальную линию (усреднение X для каждой строки в выделении)
            for (let y = y1; y <= y2; y++) {
                let sumX = 0;
                let count = 0;
                let minX = width, maxX = 0;

                for (let x = x1; x <= x2; x++) {
                    let idx = (y * width + x) * 4;
                    if (isLinePixel(data[idx], data[idx+1], data[idx+2])) {
                        sumX += x;
                        count++;
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                    }
                }

                if (count >= 2) {
                    let avgX = Math.round(sumX / count);
                    for (let x = x1; x <= x2; x++) {
                        let idx = (y * width + x) * 4;
                        data[idx] = 255; data[idx+1] = 255; data[idx+2] = 255;
                    }
                    for (let x = minX; x <= maxX; x++) {
                        let idx = (y * width + x) * 4;
                        data[idx] = lineR; data[idx+1] = lineG; data[idx+2] = lineB;
                    }
                }
            }
        }

        ctx.putImageData(imgData, 0, 0);
        originalImageSnapshot = ctx.getImageData(0, 0, width, height); // Сохраняем результат
        log(`✅ Выделенная область успешно выровнена.`);
    }
</script>
</body>
</html>
