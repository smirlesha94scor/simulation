<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CV Circuit Scanner - Выравнивание линий с защитой текста</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #0e0e12; color: #fff; }
        .card { background: #181820; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        input, button, select { padding: 8px 12px; margin: 5px 0; font-size: 14px; }
        
        button { background: #ff007f; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #d9006b; }
        button:disabled { background: #444; cursor: not-allowed; }

        .btn-bg { background: #00bcd4; color: #fff; }
        .btn-bg:hover { background: #008ba3; }

        .btn-align { background: #9b51e0; color: #fff; }
        .btn-align:hover { background: #823ab7; }

        input[type="range"] { width: 250px; vertical-align: middle; }

        #viewport {
            position: relative;
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 5 / 3;
            border: 2px solid #444;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            margin: 0 auto;
        }

        #cv-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
            cursor: crosshair;
            z-index: 1;
        }

        #svg-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #log { background: #050508; color: #00ff66; padding: 10px; border-radius: 4px; font-family: monospace; height: 120px; overflow-y: auto; font-size: 12px; }
        .color-preview { display: inline-block; width: 16px; height: 16px; border-radius: 50%; border: 1px solid #fff; vertical-align: middle; margin-left: 5px; }
        .btn-group { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <h1>⚡ Сканер схем: Выравнивание линий с защитой текста</h1>

    <div class="card">
        <input type="file" id="imageInput" accept="image/*" onchange="loadToCanvas(this)"><br>
        
        <div style="margin: 10px 0;">
            <label>Допуск близких оттенков: <span id="sensValue">50</span></label><br>
            <input type="range" id="sensitivity" min="10" max="150" value="50" oninput="onSensitivityChange(this.value)">
        </div>

        <span id="selectedColorStatus">1. Кликните по линии на схеме для выбора цвета</span>
        <span id="colorBox" class="color-preview" style="display:none;"></span><br>

        <div class="btn-group">
            <button id="btnMakeWhite" class="btn-bg" onclick="runColorFilter()" disabled>1. Сделать фон белым</button>
            <button id="btnAlignLines" class="btn-align" onclick="optimizeGeometry()" disabled>2. Выровнять линии (защита букв)</button>
        </div>
    </div>

    <div class="card">
        <div id="viewport">
            <canvas id="cv-canvas" width="1000" height="600"></canvas>
            <svg id="svg-layer" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
    </div>

    <div class="card">
        <h3>Лог работы системы:</h3>
        <div id="log">Загрузите изображение и выберите цвет пипеткой...</div>
    </div>

<script>
    let imgElement = new Image();
    let selectedColorRgb = null;

    window.onload = () => {
        setupCanvasEyedropper();
    };

    function log(text) {
        const box = document.getElementById('log');
        box.innerHTML += `<div>> ${text}</div>`;
        box.scrollTop = box.scrollHeight;
    }

    function loadToCanvas(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                imgElement.src = e.target.result;
                imgElement.onload = () => {
                    const canvas = document.getElementById('cv-canvas');
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, 1000, 600);
                    ctx.drawImage(imgElement, 0, 0, 1000, 600);
                    document.getElementById('svg-layer').innerHTML = '';
                    selectedColorRgb = null;
                    document.getElementById('colorBox').style.display = 'none';
                    document.getElementById('selectedColorStatus').textContent = "1. Кликните по линии на схеме для выбора цвета";
                    document.getElementById('btnMakeWhite').disabled = true;
                    document.getElementById('btnAlignLines').disabled = true;
                    log("Изображение загружено. Выберите цвет пипеткой.");
                };
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    function setupCanvasEyedropper() {
        const canvas = document.getElementById('cv-canvas');

        canvas.addEventListener('click', (e) => {
            if (!imgElement.src) {
                log("⚠️ Сначала загрузите изображение схемы!");
                return;
            }

            const rect = canvas.getBoundingClientRect();
            const scaleX = 1000 / rect.width;
            const scaleY = 600 / rect.height;

            const x = Math.floor((e.clientX - rect.left) * scaleX);
            const y = Math.floor((e.clientY - rect.top) * scaleY);

            try {
                const ctx = canvas.getContext('2d');
                const pixel = ctx.getImageData(x, y, 1, 1).data;

                selectedColorRgb = { r: pixel[0], g: pixel[1], b: pixel[2] };

                const colorHex = `rgb(${pixel[0]}, ${pixel[1]}, ${pixel[2]})`;
                const colorBox = document.getElementById('colorBox');
                colorBox.style.background = colorHex;
                colorBox.style.display = 'inline-block';

                document.getElementById('selectedColorStatus').textContent = `Выбран цвет: RGB(${pixel[0]}, ${pixel[1]}, ${pixel[2]})`;
                document.getElementById('btnMakeWhite').disabled = false;
                document.getElementById('btnAlignLines').disabled = false;

                log(`🎨 Выбран цвет RGB(${pixel[0]}, ${pixel[1]}, ${pixel[2]}). Нажмите "Сделать фон белым".`);
            } catch (err) {
                log("❌ Ошибка считывания цвета: " + err.message);
            }
        });
    }

    function onSensitivityChange(val) {
        document.getElementById('sensValue').textContent = val;
    }

    function runColorFilter() {
        if (!selectedColorRgb) {
            alert('Сначала кликните по линии на схеме!');
            return;
        }

        const tolerance = parseInt(document.getElementById('sensitivity').value);
        const canvas = document.getElementById('cv-canvas');
        const ctx = canvas.getContext('2d');
        
        ctx.drawImage(imgElement, 0, 0, 1000, 600);
        const imgData = ctx.getImageData(0, 0, 1000, 600);
        const data = imgData.data;

        for (let i = 0; i < data.length; i += 4) {
            let r = data[i], g = data[i+1], b = data[i+2];

            let distance = Math.sqrt(
                Math.pow(r - selectedColorRgb.r, 2) +
                Math.pow(g - selectedColorRgb.g, 2) +
                Math.pow(b - selectedColorRgb.b, 2)
            );

            if (distance > tolerance) {
                data[i] = 255;
                data[i+1] = 255;
                data[i+2] = 255;
            }
        }

        ctx.putImageData(imgData, 0, 0);
        log("✅ Фон успешно очищен до белого цвета.");
    }

    // КНОПКА 2: Выравнивание линий с защитой текстовых областей
    function optimizeGeometry() {
        if (!selectedColorRgb) {
            alert('Сначала выберите цвет линии!');
            return;
        }

        const canvas = document.getElementById('cv-canvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        const imgData = ctx.getImageData(0, 0, width, height);
        const data = imgData.data;

        log("⚙️ Сканирование и выравнивание линий с защитой букв и текста...");

        const lineR = selectedColorRgb.r;
        const lineG = selectedColorRgb.g;
        const lineB = selectedColorRgb.b;
        const stripSize = 15;

        // Вспомогательная функция проверки: является ли пиксель частью линии
        function isLinePixel(r, g, b) {
            let dist = Math.sqrt(
                Math.pow(r - lineR, 2) +
                Math.pow(g - lineG, 2) +
                Math.pow(b - lineB, 2)
            );
            return dist < 60;
        }

        // КАРТА ЗАЩИТЫ ТЕКСТА: определяем плотные скопления символов (букв и цифр)
        // Блоки текста имеют высокую локальную плотность пикселей в небольших квадратах
        const textMask = new Uint8Array(width * height);
        const blockSize = 16;
        
        for (let y = 0; y < height; y += blockSize) {
            for (let x = 0; x < width; x += blockSize) {
                let darkPixelsInBlock = 0;
                let bWidth = Math.min(blockSize, width - x);
                let bHeight = Math.min(blockSize, height - y);

                for (let by = 0; by < bHeight; by++) {
                    for (let bx = 0; bx < bWidth; bx++) {
                        let idx = ((y + by) * width + (x + bx)) * 4;
                        if (isLinePixel(data[idx], data[idx+1], data[idx+2])) {
                            darkPixelsInBlock++;
                        }
                    }
                }

                // Если в блоке слишком много темных пикселей на тесной площади — это текст/маркировка (например C1, R1)
                // Обычные длинные линии такую плотность в квадрате 16x16 не дают
                if (darkPixelsInBlock > 35 && darkPixelsInBlock < 120) {
                    for (let by = 0; by < bHeight; by++) {
                        for (let bx = 0; bx < bWidth; bx++) {
                            textMask[(y + by) * width + (x + bx)] = 1; // Помечаем как защищенный текст
                        }
                    }
                }
            }
        }

        // 1. Вертикальное выравнивание (только там, где нет защищенного текста)
        for (let x = 0; x < width; x += stripSize) {
            let xEnd = Math.min(x + stripSize, width);

            for (let y = 0; y < height; y++) {
                if (textMask[y * width + x] === 1) continue; // Пропускаем текст

                let countX = 0;
                let firstX = -1;
                let lastX = -1;

                for (let cx = x; cx < xEnd; cx++) {
                    if (textMask[y * width + cx] === 1) continue;
                    let idx = (y * width + cx) * 4;
                    if (isLinePixel(data[idx], data[idx+1], data[idx+2])) {
                        countX++;
                        if (firstX === -1) firstX = cx;
                        lastX = cx;
                    }
                }

                if (countX >= 2) {
                    for (let cx = firstX; cx <= lastX; cx++) {
                        if (textMask[y * width + cx] === 1) continue;
                        let idx = (y * width + cx) * 4;
                        data[idx] = lineR; data[idx+1] = lineG; data[idx+2] = lineB;
                    }
                    for (let cx = x; cx < xEnd; cx++) {
                        if (textMask[y * width + cx] === 1) continue;
                        if (cx < firstX || cx > lastX) {
                            let idx = (y * width + cx) * 4;
                            data[idx] = 255; data[idx+1] = 255; data[idx+2] = 255;
                        }
                    }
                }
            }
        }

        // 2. Горизонтальное выравнивание (только там, где нет защищенного текста)
        for (let y = 0; y < height; y += stripSize) {
            let yEnd = Math.min(y + stripSize, height);

            for (let x = 0; x < width; x++) {
                if (textMask[y * width + x] === 1) continue; // Пропускаем текст

                let countY = 0;
                let firstY = -1;
                let lastY = -1;

                for (let cy = y; cy < yEnd; cy++) {
                    if (textMask[cy * width + x] === 1) continue;
                    let idx = (cy * width + x) * 4;
                    if (isLinePixel(data[idx], data[idx+1], data[idx+2])) {
                        countY++;
                        if (firstY === -1) firstY = cy;
                        lastY = cy;
                    }
                }

                if (countY >= 2) {
                    for (let cy = firstY; cy <= lastY; cy++) {
                        if (textMask[cy * width + x] === 1) continue;
                        let idx = (cy * width + x) * 4;
                        data[idx] = lineR; data[idx+1] = lineG; data[idx+2] = lineB;
                    }
                    for (let cy = y; cy < yEnd; cy++) {
                        if (textMask[cy * width + x] === 1) continue;
                        if (cy < firstY || cy > lastY) {
                            let idx = (cy * width + x) * 4;
                            data[idx] = 255; data[idx+1] = 255; data[idx+2] = 255;
                        }
                    }
                }
            }
        }

        ctx.putImageData(imgData, 0, 0);
        log("✅ Линии выровнены, буквенные обозначения (текст) защищены и остались неизменными.");
    }
</script>
</body>
</html>
