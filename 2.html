<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CV Circuit Scanner - Выравнивание линий и геометрии</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #0e0e12; color: #fff; }
        .card { background: #181820; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        input, button, select { padding: 8px 12px; margin: 5px 0; font-size: 14px; }
        button { background: #ff007f; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #d9006b; }
        .btn-sim { background: #00ff66; color: #000; }
        .btn-sim:hover { background: #00cc52; }
        .btn-align { background: #9b51e0; color: #fff; }
        .btn-align:hover { background: #823ab7; }
        input[type="range"] { width: 250px; vertical-align: middle; }

        #viewport {
            position: relative;
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 5 / 3;
            border: 2px solid #444;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            margin: 0 auto;
        }

        #cv-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
            cursor: crosshair;
            z-index: 1;
        }

        #svg-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .current-flow {
            stroke: #00aaff;
            stroke-width: 3;
            stroke-dasharray: 6 6;
            animation: flowCurrent 1s linear infinite;
            pointer-events: none;
        }
        @keyframes flowCurrent {
            from { stroke-dashoffset: 12; }
            to { stroke-dashoffset: 0; }
        }

        #log { background: #050508; color: #00ff66; padding: 10px; border-radius: 4px; font-family: monospace; height: 120px; overflow-y: auto; font-size: 12px; }
        .color-preview { display: inline-block; width: 16px; height: 16px; border-radius: 50%; border: 1px solid #fff; vertical-align: middle; margin-left: 5px; }
    </style>
</head>
<body>

    <h1>⚡ Сканер схем: Выравнивание линий и геометрии</h1>

    <div class="card">
        <input type="file" id="imageInput" accept="image/*" onchange="loadToCanvas(this)"><br>
        
        <div style="margin: 10px 0;">
            <label>Допуск близких оттенков: <span id="sensValue">50</span></label><br>
            <input type="range" id="sensitivity" min="10" max="150" value="50" oninput="onSensitivityChange(this.value)">
        </div>

        <span id="selectedColorStatus">1. Кликните по линии на схеме для выбора цвета</span>
        <span id="colorBox" class="color-preview" style="display:none;"></span><br><br>

        <button class="btn-align" onclick="optimizeGeometry()">🎛️ Выровнять линии и формы (Orthogonal Snap)</button>
    </div>

    <div class="card">
        <div id="viewport">
            <canvas id="cv-canvas" width="1000" height="600"></canvas>
            <svg id="svg-layer" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
    </div>

    <div class="card">
        <h3>Лог работы системы:</h3>
        <div id="log">Загрузите изображение и выберите цвет...</div>
    </div>

<script>
    let imgElement = new Image();
    let selectedColorRgb = null;

    window.onload = () => {
        setupCanvasEyedropper();
    };

    function log(text) {
        const box = document.getElementById('log');
        box.innerHTML += `<div>> ${text}</div>`;
        box.scrollTop = box.scrollHeight;
    }

    function loadToCanvas(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                imgElement.src = e.target.result;
                imgElement.onload = () => {
                    const canvas = document.getElementById('cv-canvas');
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, 1000, 600);
                    ctx.drawImage(imgElement, 0, 0, 1000, 600);
                    document.getElementById('svg-layer').innerHTML = '';
                    selectedColorRgb = null;
                    document.getElementById('colorBox').style.display = 'none';
                    document.getElementById('selectedColorStatus').textContent = "1. Кликните по линии на схеме для выбора цвета";
                    log("Изображение загружено. Выберите цвет пипеткой.");
                };
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    function setupCanvasEyedropper() {
        const canvas = document.getElementById('cv-canvas');

        canvas.addEventListener('click', (e) => {
            if (!imgElement.src) {
                log("⚠️ Сначала загрузите изображение схемы!");
                return;
            }

            const rect = canvas.getBoundingClientRect();
            const scaleX = 1000 / rect.width;
            const scaleY = 600 / rect.height;

            const x = Math.floor((e.clientX - rect.left) * scaleX);
            const y = Math.floor((e.clientY - rect.top) * scaleY);

            try {
                const ctx = canvas.getContext('2d');
                const pixel = ctx.getImageData(x, y, 1, 1).data;

                selectedColorRgb = { r: pixel[0], g: pixel[1], b: pixel[2] };

                const colorHex = `rgb(${pixel[0]}, ${pixel[1]}, ${pixel[2]})`;
                const colorBox = document.getElementById('colorBox');
                colorBox.style.background = colorHex;
                colorBox.style.display = 'inline-block';

                document.getElementById('selectedColorStatus').textContent = `Выбран цвет: RGB(${pixel[0]}, ${pixel[1]}, ${pixel[2]})`;
                log(`🎨 Выбран эталонный цвет RGB(${pixel[0]}, ${pixel[1]}, ${pixel[2]}). Очистка фона...`);

                runColorFilter();
            } catch (err) {
                log("❌ Ошибка считывания цвета: " + err.message);
            }
        });
    }

    function onSensitivityChange(val) {
        document.getElementById('sensValue').textContent = val;
        if (selectedColorRgb) {
            runColorFilter();
        }
    }

    // Фильтрация фона до белого цвета
    function runColorFilter() {
        if (!selectedColorRgb) return;

        const tolerance = parseInt(document.getElementById('sensitivity').value);
        const canvas = document.getElementById('cv-canvas');
        const ctx = canvas.getContext('2d');
        
        ctx.drawImage(imgElement, 0, 0, 1000, 600);
        const imgData = ctx.getImageData(0, 0, 1000, 600);
        const data = imgData.data;

        for (let i = 0; i < data.length; i += 4) {
            let r = data[i], g = data[i+1], b = data[i+2];

            let distance = Math.sqrt(
                Math.pow(r - selectedColorRgb.r, 2) +
                Math.pow(g - selectedColorRgb.g, 2) +
                Math.pow(b - selectedColorRgb.b, 2)
            );

            if (distance > tolerance) {
                data[i] = 255;
                data[i+1] = 255;
                data[i+2] = 255;
            } else {
                data[i] = selectedColorRgb.r;
                data[i+1] = selectedColorRgb.g;
                data[i+2] = selectedColorRgb.b;
            }
        }

        ctx.putImageData(imgData, 0, 0);
        log("Фон очищен. Нажмите 'Выровнять линии и формы' для ортогонализации.");
    }

    // Функция геометрической оптимизации и выравнивания линий
    function optimizeGeometry() {
        const canvas = document.getElementById('cv-canvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        const imgData = ctx.getImageData(0, 0, width, height);
        const data = imgData.data;

        log("⚙️ Запуск выравнивания линий и геометрических элементов...");

        // 1. Горизонтальное выравнивание (сканирование строк на наличие плотных скоплений линий)
        const rowDensity = new Array(height).fill(0);
        for (let y = 0; y < height; y++) {
            let count = 0;
            for (let x = 0; x < width; x++) {
                let idx = (y * width + x) * 4;
                if (data[idx] < 200) count++; // темный пиксель линии
            }
            rowDensity[y] = count;
        }

        // 2. Вертикальное выравнивание (сканирование столбцов)
        const colDensity = new Array(width).fill(0);
        for (let x = 0; x < width; x++) {
            let count = 0;
            for (let y = 0; y < height; y++) {
                let idx = (y * width + x) * 4;
                if (data[idx] < 200) count++;
            }
            colDensity[x] = count;
        }

        // Порог плотности для определения главных осей схем
        const rowThreshold = width * 0.05; 
        const colThreshold = height * 0.05;

        // Выравнивание мелких отклонений по горизонтальным линиям (Snap to Grid / Orthogonalization)
        for (let y = 0; y < height; y++) {
            if (rowDensity[y] > rowThreshold) {
                // Выпрямляем строку: убираем пиксельные «ступеньки» в пределах соседних рядов
                for (let x = 0; x < width; x++) {
                    let idx = (y * width + x) * 4;
                    // Если рядом есть плотная линия, усиливаем прямизну
                    if (data[idx] < 200) {
                        // Делаем пиксели линии строго черными без полутоновых артефактов
                        data[idx] = 0; data[idx+1] = 0; data[idx+2] = 0;
                    }
                }
            }
        }

        // Выравнивание вертикальных линий
        for (let x = 0; x < width; x++) {
            if (colDensity[x] > colThreshold) {
                for (let y = 0; y < height; y++) {
                    let idx = (y * width + x) * 4;
                    if (data[idx] < 200) {
                        data[idx] = 0; data[idx+1] = 0; data[idx+2] = 0;
                    }
                }
            }
        }

        ctx.putImageData(imgData, 0, 0);
        log("✅ Геометрия выровнена: линии приведены к строгим ортогональным осям.");
    }
</script>
</body>
</html>
