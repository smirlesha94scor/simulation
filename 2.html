<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CV Circuit Scanner - Выбор SVG Библиотек</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #0e0e12; color: #fff; }
        .card { background: #181820; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        input, button, select { padding: 8px 12px; margin: 5px 0; font-size: 14px; }
        button { background: #ff007f; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #d9006b; }
        select { background: #2a2a36; color: #00ff66; border: 1px solid #444; border-radius: 4px; font-weight: bold; }
        .btn-info { background: #00bcd4; margin-left: 10px; }
        .btn-info:hover { background: #008ba3; }

        #viewport {
            position: relative;
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 5 / 3;
            border: 2px solid #444;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            margin: 0 auto;
        }

        #cv-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
        }

        #svg-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: auto;
            z-index: 10;
        }

        .contour-box {
            fill: rgba(0, 240, 255, 0.05);
            stroke: #00f0ff;
            stroke-width: 2;
            stroke-dasharray: 4;
            animation: pulseContour 1.5s infinite alternate;
        }
        @keyframes pulseContour {
            0% { stroke-opacity: 0.4; }
            100% { stroke-opacity: 1; }
        }

        .svg-symbol { cursor: pointer; transition: transform 0.3s; }
        .svg-symbol path, .svg-symbol circle, .svg-symbol rect, .svg-symbol line, .svg-symbol polygon {
            stroke: #00ff66; fill: none;
        }
        .svg-symbol polygon.filled { fill: #00ff66; }
        .svg-symbol.selected path, .svg-symbol.selected circle, .svg-symbol.selected rect, .svg-symbol.selected line, .svg-symbol.selected polygon {
            stroke: #ff0055; fill: none; filter: drop-shadow(0px 0px 10px #ff0055);
        }
        .svg-symbol.selected polygon.filled { fill: #ff0055; }

        #log { background: #050508; color: #00ff66; padding: 10px; border-radius: 4px; font-family: monospace; height: 120px; overflow-y: auto; font-size: 12px; }

        #modal-info {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center;
        }
        .modal-content {
            background: #1e1e28; padding: 25px; border-radius: 10px; width: 90%; max-width: 750px;
            max-height: 85vh; overflow-y: auto; border: 2px solid #00bcd4; box-shadow: 0 0 20px rgba(0, 188, 212, 0.4);
        }
        .modal-content h3 { margin-top: 0; color: #00bcd4; }
        .svg-preview-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
        .preview-card { background: #121218; border: 1px solid #333; border-radius: 6px; padding: 12px; text-align: center; }
        .preview-card svg { width: 100%; height: 80px; margin-bottom: 5px; }
        .preview-card span { font-size: 12px; color: #00ff66; display: block; }
        .close-btn { background: #555; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>⚡ Сканер схем: Выбор стиля библиотеки SVG</h1>

    <div class="card">
        <label>Gemini API Key: </label>
        <input type="password" id="apiKey" style="width: 280px;">
        <button onclick="saveKey()">Сохранить ключ</button>
        <span id="keyStatus" style="margin-left: 10px; font-weight: bold; color: #ff5e5e;">● Ключ не задан</span>
    </div>

    <div class="card">
        <label>Выбор стиля библиотеки: </label>
        <select id="libraryStyle" onchange="changeLibraryStyle()">
            <option value="gost">1. ГОСТ 2.730-73 (Точные математические углы)</option>
            <option value="kicad">2. KiCad CAD Style (Инженерный с узлами)</option>
            <option value="iec">3. IEC 60617 (Европейский тонкий контур)</option>
        </select>
        <button class="btn-info" onclick="openInfoModal()">Сравнить стили в каталоге</button>
    </div>

    <div class="card">
        <input type="file" id="imageInput" accept="image/*" onchange="loadToCanvas(this)">
        <button onclick="startTwoPhaseScan()">Запустить поэтапное сканирование</button>
    </div>

    <div class="card">
        <div id="viewport">
            <canvas id="cv-canvas" width="1000" height="600"></canvas>
            <svg id="svg-layer" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
    </div>

    <div class="card">
        <h3>Лог работы системы:</h3>
        <div id="log">Загрузите схему...</div>
    </div>

    <div id="modal-info">
        <div class="modal-content">
            <h3>📖 Предпросмотр выбранной библиотеки SVG</h3>
            <p id="styleDescription">Текущий стиль: ГОСТ 2.730-73</p>

            <div class="svg-preview-grid" id="previewGrid"></div>

            <button class="close-btn" onclick="closeInfoModal()">Закрыть</button>
        </div>
    </div>

<script>
    let imgElement = new Image();
    let scanData = [];
    let currentStyle = 'gost';

    window.onload = () => {
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
            document.getElementById('keyStatus').textContent = "● Ключ подключен";
            document.getElementById('keyStatus').style.color = "#00ff66";
        }
        updateModalPreview();
    };

    function saveKey() {
        const key = document.getElementById('apiKey').value.trim();
        if(key) {
            localStorage.setItem('gemini_api_key', key);
            document.getElementById('keyStatus').textContent = "● Ключ подключен";
            document.getElementById('keyStatus').style.color = "#00ff66";
            log("Ключ сохранен.");
        }
    }

    function log(text) {
        const box = document.getElementById('log');
        box.innerHTML += `<div>> ${text}</div>`;
        box.scrollTop = box.scrollHeight;
    }

    function changeLibraryStyle() {
        currentStyle = document.getElementById('libraryStyle').value;
        log(`Стиль библиотеки изменен на: ${currentStyle.toUpperCase()}`);
        if (scanData.length > 0) {
            materializeElements(scanData);
        }
        updateModalPreview();
    }

    function openInfoModal() {
        document.getElementById('modal-info').style.display = 'flex';
    }

    function closeInfoModal() {
        document.getElementById('modal-info').style.display = 'none';
    }

    function loadToCanvas(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                imgElement.src = e.target.result;
                imgElement.onload = () => {
                    const canvas = document.getElementById('cv-canvas');
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, 1000, 600);
                    ctx.drawImage(imgElement, 0, 0, 1000, 600);
                    document.getElementById('svg-layer').innerHTML = '';
                    log("Изображение загружено.");
                };
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    // Векторные библиотеки элементов
    function getSvgSymbol(type, label) {
        if (currentStyle === 'gost') {
            switch(type) {
                case 'transistor_npn':
                    return `
                        <circle cx="0" cy="0" r="26" stroke="#00ff66" stroke-width="2"/>
                        <line x1="-35" y1="0" x2="-10" y2="0" stroke="#00ff66" stroke-width="2"/>
                        <line x1="-10" y1="-16" x2="-10" y2="16" stroke="#00ff66" stroke-width="3"/>
                        <line x1="-10" y1="-6" x2="18" y2="-20" stroke="#00ff66" stroke-width="2"/>
                        <line x1="-10" y1="6" x2="18" y2="20" stroke="#00ff66" stroke-width="2"/>
                        <g transform="translate(18,20) rotate(26)">
                            <polygon points="0,0 -10,-4 -8,0 -10,4" class="filled" />
                        </g>
                        <text x="-28" y="-6" fill="#00ff66" font-size="10">B</text>
                        <text x="14" y="-14" fill="#00ff66" font-size="10">C</text>
                        <text x="14" y="30" fill="#00ff66" font-size="10">E</text>
                        <text x="0" y="-34" text-anchor="middle" fill="#00ff66" font-size="11">NPN ${label}</text>
                    `;
                case 'transistor_pnp':
                    return `
                        <circle cx="0" cy="0" r="26" stroke="#00ff66" stroke-width="2"/>
                        <line x1="-35" y1="0" x2="-10" y2="0" stroke="#00ff66" stroke-width="2"/>
                        <line x1="-10" y1="-16" x2="-10" y2="16" stroke="#00ff66" stroke-width="3"/>
                        <line x1="-10" y1="-6" x2="18" y2="-20" stroke="#00ff66" stroke-width="2"/>
                        <line x1="-10" y1="6" x2="18" y2="20" stroke="#00ff66" stroke-width="2"/>
                        <g transform="translate(-10,6) rotate(206)">
                            <polygon points="0,0 -10,-4 -8,0 -10,4" class="filled" />
                        </g>
                        <text x="-28" y="-6" fill="#00ff66" font-size="10">B</text>
                        <text x="14" y="-14" fill="#00ff66" font-size="10">C</text>
                        <text x="14" y="30" fill="#00ff66" font-size="10">E</text>
                        <text x="0" y="-34" text-anchor="middle" fill="#00ff66" font-size="11">PNP ${label}</text>
                    `;
                case 'resistor':
                    return `<rect x="-32" y="-12" width="64" height="24" stroke="#00ff66" stroke-width="2"/><line x1="-50" y1="0" x2="-32" y2="0" stroke="#00ff66" stroke-width="2"/><line x1="32" y1="0" x2="50" y2="0" stroke="#00ff66" stroke-width="2"/><text x="0" y="-18" text-anchor="middle" fill="#00ff66" font-size="12">${label}</text>`;
                default:
                    return `<rect x="-30" y="-16" width="60" height="32" rx="4" stroke="#00ff66" stroke-width="2"/><text x="0" y="4" text-anchor="middle" fill="#00ff66" font-size="11">${label}</text>`;
            }
        } else if (currentStyle === 'kicad') {
            switch(type) {
                case 'transistor_npn':
                    return `
                        <circle cx="-35" cy="0" r="3" class="filled"/>
                        <circle cx="18" cy="-20" r="3" class="filled"/>
                        <circle cx="18" cy="20" r="3" class="filled"/>
                        <circle cx="0" cy="0" r="28" stroke="#00ff66" stroke-width="1.5" stroke-dasharray="4"/>
                        <line x1="-35" y1="0" x2="-10" y2="0" stroke="#00ff66" stroke-width="2"/>
                        <line x1="-10" y1="-18" x2="-10" y2="18" stroke="#00ff66" stroke-width="3.5"/>
                        <line x1="-10" y1="-8" x2="18" y2="-20" stroke="#00ff66" stroke-width="2"/>
                        <line x1="-10" y1="8" x2="18" y2="20" stroke="#00ff66" stroke-width="2"/>
                        <g transform="translate(18,20) rotate(23)">
                            <polygon points="0,0 -12,-5 -12,5" class="filled" />
                        </g>
                        <text x="0" y="-34" text-anchor="middle" fill="#00ff66" font-size="11">KiCad NPN ${label}</text>
                    `;
                case 'transistor_pnp':
                    return `
                        <circle cx="-35" cy="0" r="3" class="filled"/>
                        <circle cx="18" cy="-20" r="3" class="filled"/>
                        <circle cx="18" cy="20" r="3" class="filled"/>
                        <circle cx="0" cy="0" r="28" stroke="#00ff66" stroke-width="1.5" stroke-dasharray="4"/>
                        <line x1="-35" y1="0" x2="-10" y2="0" stroke="#00ff66" stroke-width="2"/>
                        <line x1="-10" y1="-18" x2="-10" y2="18" stroke="#00ff66" stroke-width="3.5"/>
                        <line x1="-10" y1="-8" x2="18" y2="-20" stroke="#00ff66" stroke-width="2"/>
                        <line x1="-10" y1="8" x2="18" y2="20" stroke="#00ff66" stroke-width="2"/>
                        <g transform="translate(-10,8) rotate(203)">
                            <polygon points="0,0 -12,-5 -12,5" class="filled" />
                        </g>
                        <text x="0" y="-34" text-anchor="middle" fill="#00ff66" font-size="11">KiCad PNP ${label}</text>
                    `;
                case 'resistor':
                    return `<rect x="-35" y="-10" width="70" height="20" stroke="#00ff66" stroke-width="2"/><line x1="-50" y1="0" x2="-35" y2="0" stroke="#00ff66" stroke-width="2"/><line x1="35" y1="0" x2="50" y2="0" stroke="#00ff66" stroke-width="2"/><circle cx="-50" cy="0" r="3" class="filled"/><circle cx="50" cy="0" r="3" class="filled"/><text x="0" y="-16" text-anchor="middle" fill="#00ff66" font-size="11">${label}</text>`;
                default:
                    return `<rect x="-30" y="-16" width="60" height="32" stroke="#00ff66" stroke-width="2"/><text x="0" y="4" text-anchor="middle" fill="#00ff66" font-size="11">${label}</text>`;
            }
        } else {
            // IEC 60617
            switch(type) {
                case 'transistor_npn':
                    return `
                        <line x1="-35" y1="0" x2="-12" y2="0" stroke="#00ff66" stroke-width="1.5"/>
                        <line x1="-12" y1="-18" x2="-12" y2="18" stroke="#00ff66" stroke-width="2"/>
                        <line x1="-12" y1="-6" x2="18" y2="-20" stroke="#00ff66" stroke-width="1.5"/>
                        <line x1="-12" y1="6" x2="18" y2="20" stroke="#00ff66" stroke-width="1.5"/>
                        <g transform="translate(18,20) rotate(25)">
                            <path d="M0,0 L-8,-3 L-8,3 Z" fill="#00ff66"/>
                        </g>
                        <text x="0" y="-28" text-anchor="middle" fill="#00ff66" font-size="10">IEC NPN ${label}</text>
                    `;
                case 'transistor_pnp':
                    return `
                        <line x1="-35" y1="0" x2="-12" y2="0" stroke="#00ff66" stroke-width="1.5"/>
                        <line x1="-12" y1="-18" x2="-12" y2="18" stroke="#00ff66" stroke-width="2"/>
                        <line x1="-12" y1="-6" x2="18" y2="-20" stroke="#00ff66" stroke-width="1.5"/>
                        <line x1="-12" y1="6" x2="18" y2="20" stroke="#00ff66" stroke-width="1.5"/>
                        <g transform="translate(-12,6) rotate(205)">
                            <path d="M0,0 L-8,-3 L-8,3 Z" fill="#00ff66"/>
                        </g>
                        <text x="0" y="-28" text-anchor="middle" fill="#00ff66" font-size="10">IEC PNP ${label}</text>
                    `;
                case 'resistor':
                    return `<rect x="-30" y="-8" width="60" height="16" stroke="#00ff66" stroke-width="1.5"/><line x1="-50" y1="0" x2="-30" y2="0" stroke="#00ff66" stroke-width="1.5"/><line x1="30" y1="0" x2="50" y2="0" stroke="#00ff66" stroke-width="1.5"/><text x="0" y="-14" text-anchor="middle" fill="#00ff66" font-size="11">${label}</text>`;
                default:
                    return `<rect x="-28" y="-14" width="56" height="28" stroke="#00ff66" stroke-width="1.5"/><text x="0" y="4" text-anchor="middle" fill="#00ff66" font-size="10">${label}</text>`;
            }
        }
    }

    function updateModalPreview() {
        const grid = document.getElementById('previewGrid');
        const desc = document.getElementById('styleDescription');
        
        desc.textContent = `Текущий выбранный стиль: ${currentStyle.toUpperCase()}`;
        grid.innerHTML = `
            <div class="preview-card">
                <svg viewBox="-50 -40 100 80">${getSvgSymbol('transistor_npn', 'VT1')}</svg>
                <span>NPN Транзистор</span>
            </div>
            <div class="preview-card">
                <svg viewBox="-50 -40 100 80">${getSvgSymbol('transistor_pnp', 'VT2')}</svg>
                <span>PNP Транзистор</span>
            </div>
            <div class="preview-card">
                <svg viewBox="-60 -30 120 60">${getSvgSymbol('resistor', 'R1')}</svg>
                <span>Резистор</span>
            </div>
        `;
    }

    async function startTwoPhaseScan() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const fileInput = document.getElementById('imageInput').files[0];

        if (!apiKey || !fileInput) {
            alert('Загрузите файл и укажите API key!');
            return;
        }

        log("=== ЭТАП 1: Сканирование контуров ===");
        runContourScanAnimation(async () => {
            log("=== ЭТАП 2: Распознавание элементов через Gemini Vision ===");
            const base64Data = await toBase64(fileInput);
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;

            const promptText = `Распознай элементы на схеме. Для транзисторов укажи тип: transistor_npn или transistor_pnp. Для резисторов: resistor.
            Верни ТОЛЬКО валидный JSON без markdown:
            {
              "components": [
                {"label": "VT1", "type": "transistor_npn", "cx": 580, "cy": 340},
                {"label": "VT2", "type": "transistor_pnp", "cx": 650, "cy": 420},
                {"label": "R1", "type": "resistor", "cx": 220, "cy": 320}
              ]
            }
            Координаты cx, cy в системе 1000x600.`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }, { inline_data: { mime_type: fileInput.type, data: base64Data.split(',')[1] } }] }]
                    })
                });

                const result = await response.json();
                let rawText = result.candidates[0].content.parts[0].text;
                let cleanJson = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                cleanJson = cleanJson.substring(cleanJson.indexOf('{'), cleanJson.lastIndexOf('}') + 1);

                const data = JSON.parse(cleanJson);
                scanData = data.components;

                log(`Распознано: ${scanData.length}. Материализация выбранного стиля SVG...`);
                materializeElements(scanData);

            } catch (e) {
                log("Ошибка распознавания: " + e.message);
            }
        });
    }

    function runContourScanAnimation(onComplete) {
        const canvas = document.getElementById('cv-canvas');
        const ctx = canvas.getContext('2d');
        const svgLayer = document.getElementById('svg-layer');
        svgLayer.innerHTML = '';
        let currentY = 0;

        function step() {
            ctx.clearRect(0, 0, 1000, 600);
            ctx.drawImage(imgElement, 0, 0, 1000, 600);
            ctx.fillStyle = 'rgba(0, 240, 255, 0.8)';
            ctx.fillRect(0, currentY, 1000, 3);

            if (currentY === 150 || currentY === 300 || currentY === 450) {
                let tempBox = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                tempBox.setAttribute("class", "contour-box");
                tempBox.setAttribute("x", "150");
                tempBox.setAttribute("y", currentY - 40);
                tempBox.setAttribute("width", "120");
                tempBox.setAttribute("height", "60");
                svgLayer.appendChild(tempBox);
                log(`[Contour] Обнаружена область на Y=${currentY}px`);
            }

            currentY += 5;
            if (currentY < 600) {
                requestAnimationFrame(step);
            } else {
                ctx.clearRect(0, 0, 1000, 600);
                ctx.drawImage(imgElement, 0, 0, 1000, 600);
                svgLayer.innerHTML = '';
                onComplete();
            }
        }
        requestAnimationFrame(step);
    }

    function materializeElements(components) {
        const svgLayer = document.getElementById('svg-layer');
        svgLayer.innerHTML = '';

        components.forEach((comp, idx) => {
            setTimeout(() => {
                const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                g.setAttribute("class", "svg-symbol");
                g.setAttribute("transform", `translate(${comp.cx}, ${comp.cy})`);
                g.onclick = () => {
                    g.classList.toggle('selected');
                    log(`Выбран элемент: ${comp.label}`);
                };
                g.innerHTML = getSvgSymbol(comp.type, comp.label);
                svgLayer.appendChild(g);
                log(`[Символ добавлен] ${comp.label} (${comp.type}) [Стиль: ${currentStyle}]`);
            }, idx * 300);
        });
    }

    function toBase64(file) {
        return new Promise((res, rej) => {
            const r = new FileReader();
            r.readAsDataURL(file);
            r.onload = () => res(r.result);
            r.onerror = e => rej(e);
        });
    }
</script>
</body>
</html>
