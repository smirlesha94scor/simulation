name: Deploy React App to Root

on:
  push:
    branches: [ main ] # Срабатывает при каждом пуше в ветку main
  workflow_dispatch:  # Позволяет запустить деплой вручную из вкладки Actions

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: uno/package-lock.json

      - name: Install dependencies
        run: |
          cd uno
          npm install
        
      - name: Build React app
        run: |
          cd uno
          npm run build

      - name: Commit and push built files to root
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # Копируем скомпилированные файлы из uno/dist в корень репозитория
          # Убедитесь, что ваш build создает папку dist (если у вас build, замените dist на build)
          cp -r uno/dist/* .
          
          git add .
          git status
          
          # Проверяем, есть ли изменения для коммита
          if git diff-index --quiet HEAD; then
            echo "No changes to deploy"
          else
            git commit -m "Auto-deploy React app to root [skip ci]"
            git push origin main
          fi
