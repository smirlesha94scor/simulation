<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Структура Нанотрубок c Видом Сверху</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .glass { background: rgba(22, 27, 34, 0.85); backdrop-filter: blur(8px); border: 1px solid rgba(48, 54, 61, 0.7); }
  </style>
</head>
<body class="relative select-none">

  <!-- UI Панель -->
  <div class="absolute top-4 left-4 z-10 w-80 glass rounded-xl p-4 shadow-2xl flex flex-col gap-4 max-h-[92vh] overflow-y-auto">
    <h1 class="text-lg font-bold text-teal-400 flex items-center justify-between">
      <span>Нанотрубки 3D</span>
      <span id="fps-counter" class="text-xs bg-emerald-950 text-emerald-300 border border-emerald-800 px-2 py-0.5 rounded-full font-mono">60 FPS</span>
    </h1>

    <div class="space-y-3">
      <div>
        <div class="flex justify-between text-xs mb-1">
          <label class="font-bold text-white">Количество труб</label>
          <span id="val-tubes" class="font-mono text-teal-400">9 (3x3)</span>
        </div>
        <input id="slider-tubes" type="range" min="1" max="25" value="9" class="w-full accent-teal-500 bg-gray-700 h-1 rounded">
      </div>

      <div>
        <div class="flex justify-between text-xs mb-1">
          <label>Окружность (N ячеек)</label>
          <span id="val-n" class="font-mono text-teal-400">10</span>
        </div>
        <input id="slider-n" type="range" min="6" max="20" value="10" class="w-full accent-teal-500 bg-gray-700 h-1 rounded">
      </div>

      <div>
        <div class="flex justify-between text-xs mb-1">
          <label>Длина (M рядов)</label>
          <span id="val-m" class="font-mono text-teal-400">15</span>
        </div>
        <input id="slider-m" type="range" min="5" max="30" value="15" class="w-full accent-teal-500 bg-gray-700 h-1 rounded">
      </div>

      <div>
        <div class="flex justify-between text-xs mb-1">
          <label>Сворачивание</label>
          <span id="val-roll" class="font-mono text-teal-400">100%</span>
        </div>
        <input id="slider-roll" type="range" min="0" max="100" value="100" class="w-full accent-teal-500 bg-gray-700 h-1 rounded">
      </div>
    </div>

    <hr class="border-gray-800">

    <div class="space-y-2 text-xs">
      <label class="flex items-center justify-between cursor-pointer">
        <span>Анимированное вращение</span>
        <input id="toggle-wave" type="checkbox" checked class="accent-teal-500 w-4 h-4">
      </label>
    </div>

    <hr class="border-gray-800">

    <div class="bg-gray-900/60 p-3 rounded-lg border border-gray-800 space-y-1.5 text-xs">
      <div class="flex justify-between text-gray-400">
        <span>Всего атомов:</span>
        <span id="stat-atoms" class="font-mono text-white">0</span>
      </div>
      <div class="flex justify-between text-gray-400">
        <span>Всего связей:</span>
        <span id="stat-bonds" class="font-mono text-white">0</span>
      </div>
    </div>
  </div>

  <!-- Рамка Мини-окна 2D Вид Сверху -->
  <div class="absolute bottom-4 right-4 z-10 w-64 h-56 glass rounded-xl overflow-hidden border border-teal-500/40 shadow-2xl pointer-events-none flex flex-col justify-between p-2">
    <div class="flex justify-between items-center text-[10px] font-bold text-teal-400 bg-gray-900/80 px-2 py-1 rounded border border-gray-800">
      <span>2D ВИД СВЕРХУ</span>
      <span class="text-gray-400 font-mono">TOP-VIEW</span>
    </div>
  </div>

  <script>
    const BOND_LENGTH = 1.42;

    let scene, camera, topCamera, renderer, controls;
    let globalAtomsMesh, globalBondsMesh;
    const clock = new THREE.Clock();

    let frameCount = 0;
    let lastFpsUpdate = 0;

    let params = {
      tubeCount: 9,
      N: 10,
      M: 15,
      roll: 1.0,
      animateWave: true
    };

    let singleTubeAtoms = [];
    let singleTubeBonds = [];
    let tubeOffsets = [];

    let localAtomsX = new Float32Array(0);
    let localAtomsY = new Float32Array(0);
    let localAtomsZ = new Float32Array(0);

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0d12);

      // 1. Главная 3D Камера
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(30, 40, 60);

      // 2. Ортографическая камера для Вида Сверху
      const aspect = 256 / 224;
      topCamera = new THREE.OrthographicCamera(-30 * aspect, 30 * aspect, 30, -30, 0.1, 1000);
      topCamera.position.set(0, 150, 0);
      topCamera.lookAt(0, 0, 0);
      topCamera.up.set(0, 0, -1);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.autoClear = false; // Важно для использования нескольких viewport
      document.body.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0x00f0ff, 1.2);
      dirLight.position.set(30, 100, 30);
      scene.add(dirLight);

      rebuildGridAndTopology();
      setupUI();

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function initTubeOffsets() {
      tubeOffsets = [];
      const tubeCount = params.tubeCount;
      const gridSide = Math.ceil(Math.sqrt(tubeCount));
      const width = params.N * Math.sqrt(3) * BOND_LENGTH;
      const R = width / (2 * Math.PI);
      const spacing = R * 3.5 + 8;

      for (let t = 0; t < tubeCount; t++) {
        let gx = (t % gridSide) - (gridSide - 1) / 2;
        let gz = Math.floor(t / gridSide) - (gridSide - 1) / 2;
        tubeOffsets.push({ x: gx * spacing, z: gz * spacing });
      }
    }

    function rebuildGridAndTopology() {
      singleTubeAtoms = [];
      singleTubeBonds = [];

      const N = params.N;
      const M = params.M;
      const a = BOND_LENGTH;
      const width = N * Math.sqrt(3) * a;

      const nodeMap = new Map();
      let atomIndex = 0;

      for (let i = 0; i < N; i++) {
        for (let j = 0; j < M; j++) {
          let x0 = i * Math.sqrt(3) * a;
          let y0 = j * 3 * a;

          let pts = [
            { x: x0, y: y0 },
            { x: x0 + (Math.sqrt(3)/2)*a, y: y0 + 0.5*a },
            { x: x0 + (Math.sqrt(3)/2)*a, y: y0 + 1.5*a },
            { x: x0, y: y0 + 2.0*a }
          ];

          pts.forEach(p => {
            let wrappedX = (p.x % width + width) % width;
            let key = `${wrappedX.toFixed(3)},${p.y.toFixed(3)}`;

            if (!nodeMap.has(key)) {
              nodeMap.set(key, atomIndex++);
              singleTubeAtoms.push({ x: wrappedX, y: p.y });
            }
          });
        }
      }

      const maxDistSq = (a * 1.15) ** 2;
      for (let i = 0; i < singleTubeAtoms.length; i++) {
        for (let j = i + 1; j < singleTubeAtoms.length; j++) {
          let p1 = singleTubeAtoms[i];
          let p2 = singleTubeAtoms[j];

          let dx = Math.abs(p1.x - p2.x);
          if (dx > width / 2) dx = width - dx;

          let dy = Math.abs(p1.y - p2.y);
          if (dx * dx + dy * dy <= maxDistSq) {
            singleTubeBonds.push({ a: i, b: j });
          }
        }
      }

      initTubeOffsets();
      updateBaseTubeCache();
      rebuildGlobalInstancedMeshes();
      updateTopCameraZoom();
    }

    function updateBaseTubeCache() {
      const numAtoms = singleTubeAtoms.length;
      localAtomsX = new Float32Array(numAtoms);
      localAtomsY = new Float32Array(numAtoms);
      localAtomsZ = new Float32Array(numAtoms);

      const N = params.N;
      const width = N * Math.sqrt(3) * BOND_LENGTH;
      const R = width / (2 * Math.PI);
      const roll = params.roll;
      const offsetY = (params.M * BOND_LENGTH * 1.5) / 2;

      for (let i = 0; i < numAtoms; i++) {
        let atom = singleTubeAtoms[i];
        let angle = (atom.x / width) * Math.PI * 2;

        let flatX = atom.x - width / 2;
        let flatY = atom.y - offsetY;

        let cylX = R * Math.cos(angle - Math.PI / 2);
        let cylY = atom.y - offsetY;
        let cylZ = R * Math.sin(angle - Math.PI / 2);

        localAtomsX[i] = THREE.MathUtils.lerp(flatX, cylX, roll);
        localAtomsY[i] = THREE.MathUtils.lerp(flatY, cylY, roll);
        localAtomsZ[i] = THREE.MathUtils.lerp(0, cylZ, roll);
      }
    }

    function updateTopCameraZoom() {
      const width = params.N * Math.sqrt(3) * BOND_LENGTH;
      const R = width / (2 * Math.PI);
      const spacing = R * 3.5 + 8;
      const side = Math.ceil(Math.sqrt(params.tubeCount));
      const extent = Math.max(side * spacing * 0.75 + 15, 25);

      const aspect = 256 / 224;
      topCamera.left = -extent * aspect;
      topCamera.right = extent * aspect;
      topCamera.top = extent;
      topCamera.bottom = -extent;
      topCamera.updateProjectionMatrix();
    }

    function rebuildGlobalInstancedMeshes() {
      if (globalAtomsMesh) scene.remove(globalAtomsMesh);
      if (globalBondsMesh) scene.remove(globalBondsMesh);

      const totalAtoms = singleTubeAtoms.length * params.tubeCount;
      const totalBonds = singleTubeBonds.length * params.tubeCount;

      const sphereGeo = new THREE.SphereGeometry(0.35, 6, 6);
      const cylGeo = new THREE.CylinderGeometry(0.08, 0.08, 1, 5);
      cylGeo.translate(0, 0.5, 0);
      cylGeo.rotateX(Math.PI / 2);

      const atomMat = new THREE.MeshStandardMaterial({ color: 0x00f0ff, roughness: 0.3, metalness: 0.8 });
      const bondMat = new THREE.MeshStandardMaterial({ color: 0x2e3846, roughness: 0.5 });

      globalAtomsMesh = new THREE.InstancedMesh(sphereGeo, atomMat, totalAtoms);
      globalBondsMesh = new THREE.InstancedMesh(cylGeo, bondMat, totalBonds);

      globalAtomsMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      globalBondsMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

      scene.add(globalAtomsMesh);
      scene.add(globalBondsMesh);

      document.getElementById('stat-atoms').innerText = totalAtoms;
      document.getElementById('stat-bonds').innerText = totalBonds;

      fastUpdateTransforms(0);
    }

    function fastUpdateTransforms(time) {
      if (!globalAtomsMesh || !globalBondsMesh) return;

      const numAtoms = singleTubeAtoms.length;
      const numBonds = singleTubeBonds.length;
      const tubeCount = params.tubeCount;

      const atomMatrixArray = globalAtomsMesh.instanceMatrix.array;
      const bondMatrixArray = globalBondsMesh.instanceMatrix.array;

      let atomOffset = 0;
      let bondOffset = 0;

      const worldX = new Float32Array(numAtoms);
      const worldY = new Float32Array(numAtoms);
      const worldZ = new Float32Array(numAtoms);

      for (let t = 0; t < tubeCount; t++) {
        let tubeOffsetX = tubeOffsets[t].x;
        let tubeOffsetZ = tubeOffsets[t].z;

        let waveRot = params.animateWave ? Math.sin(time * 1.5 + t * 0.4) * 0.5 : 0;
        let cosW = Math.cos(waveRot);
        let sinW = Math.sin(waveRot);

        for (let i = 0; i < numAtoms; i++) {
          let lx = localAtomsX[i];
          let ly = localAtomsY[i];
          let lz = localAtomsZ[i];

          let rx = lx * cosW - lz * sinW + tubeOffsetX;
          let ry = ly;
          let rz = lx * sinW + lz * cosW + tubeOffsetZ;

          worldX[i] = rx;
          worldY[i] = ry;
          worldZ[i] = rz;

          let idx = (atomOffset + i) * 16;
          atomMatrixArray[idx] = 1;      atomMatrixArray[idx+4] = 0;  atomMatrixArray[idx+8] = 0;   atomMatrixArray[idx+12] = rx;
          atomMatrixArray[idx+1] = 0;    atomMatrixArray[idx+5] = 1;  atomMatrixArray[idx+9] = 0;   atomMatrixArray[idx+13] = ry;
          atomMatrixArray[idx+2] = 0;    atomMatrixArray[idx+6] = 0;  atomMatrixArray[idx+10] = 1;  atomMatrixArray[idx+14] = rz;
          atomMatrixArray[idx+3] = 0;    atomMatrixArray[idx+7] = 0;  atomMatrixArray[idx+11] = 0;  atomMatrixArray[idx+15] = 1;
        }

        for (let i = 0; i < numBonds; i++) {
          let b = singleTubeBonds[i];
          let idxA = b.a;
          let idxB = b.b;

          let ax = worldX[idxA], ay = worldY[idxA], az = worldZ[idxA];
          let bx = worldX[idxB], by = worldY[idxB], bz = worldZ[idxB];

          let dx = bx - ax;
          let dy = by - ay;
          let dz = bz - az;
          let len = Math.sqrt(dx * dx + dy * dy + dz * dz);

          let bIdx = (bondOffset + i) * 16;

          if (len > BOND_LENGTH * 2.5) {
            bondMatrixArray[bIdx] = 0;
          } else {
            let nx = dx / len, ny = dy / len, nz = dz / len;
            let upX = 0, upY = 1, upZ = 0;
            if (Math.abs(ny) > 0.99) { upX = 1; upY = 0; }

            let rx = upY * nz - upZ * ny;
            let ry = upZ * nx - upX * nz;
            let rz = upX * ny - upY * nx;
            let rLen = Math.sqrt(rx * rx + ry * ry + rz * rz);
            rx /= rLen; ry /= rLen; rz /= rLen;

            let ux = ny * rz - nz * ry;
            let uy = nz * rx - nx * rz;
            let uz = nx * ry - ny * rx;

            bondMatrixArray[bIdx] = rx;      bondMatrixArray[bIdx+4] = ux;      bondMatrixArray[bIdx+8] = nx * len;  bondMatrixArray[bIdx+12] = ax;
            bondMatrixArray[bIdx+1] = ry;    bondMatrixArray[bIdx+5] = uy;      bondMatrixArray[bIdx+9] = ny * len;  bondMatrixArray[bIdx+13] = ay;
            bondMatrixArray[bIdx+2] = rz;    bondMatrixArray[bIdx+6] = uz;      bondMatrixArray[bIdx+10] = nz * len; bondMatrixArray[bIdx+14] = az;
            bondMatrixArray[bIdx+3] = 0;     bondMatrixArray[bIdx+7] = 0;       bondMatrixArray[bIdx+11] = 0;        bondMatrixArray[bIdx+15] = 1;
          }
        }

        atomOffset += numAtoms;
        bondOffset += numBonds;
      }

      globalAtomsMesh.instanceMatrix.needsUpdate = true;
      globalBondsMesh.instanceMatrix.needsUpdate = true;
    }

    function setupUI() {
      document.getElementById('slider-tubes').addEventListener('input', (e) => {
        params.tubeCount = parseInt(e.target.value);
        let side = Math.ceil(Math.sqrt(params.tubeCount));
        document.getElementById('val-tubes').innerText = `${params.tubeCount} (${side}x${side})`;
        rebuildGridAndTopology();
      });

      document.getElementById('slider-n').addEventListener('input', (e) => {
        params.N = parseInt(e.target.value);
        document.getElementById('val-n').innerText = params.N;
        rebuildGridAndTopology();
      });

      document.getElementById('slider-m').addEventListener('input', (e) => {
        params.M = parseInt(e.target.value);
        document.getElementById('val-m').innerText = params.M;
        rebuildGridAndTopology();
      });

      document.getElementById('slider-roll').addEventListener('input', (e) => {
        params.roll = parseFloat(e.target.value) / 100;
        document.getElementById('val-roll').innerText = `${e.target.value}%`;
        updateBaseTubeCache();
        fastUpdateTransforms(clock.getElapsedTime());
      });

      document.getElementById('toggle-wave').addEventListener('change', (e) => {
        params.animateWave = e.target.checked;
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      let time = clock.getElapsedTime();

      frameCount++;
      if (time - lastFpsUpdate > 0.5) {
        let fps = Math.round((frameCount / (time - lastFpsUpdate)));
        document.getElementById('fps-counter').innerText = `${fps} FPS`;
        frameCount = 0;
        lastFpsUpdate = time;
      }

      if (params.animateWave) {
        fastUpdateTransforms(time);
      }

      controls.update();

      // 1. Рендер основного 3D окна
      renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
      renderer.setScissorTest(false);
      renderer.clear();
      renderer.render(scene, camera);

      // 2. Рендер правого нижнего 2D Top-View окна
      const miniWidth = 256;
      const miniHeight = 224;
      const margin = 16;

      renderer.setViewport(window.innerWidth - miniWidth - margin, margin, miniWidth, miniHeight);
      renderer.setScissor(window.innerWidth - miniWidth - margin, margin, miniWidth, miniHeight);
      renderer.setScissorTest(true);
      renderer.clearDepth(); // Очистка буфера глубины для нормального отображения вида сверху
      renderer.render(scene, topCamera);
    }

    window.onload = init;
  </script>
</body>
</html>
