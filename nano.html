<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Бесшовная Пустотелая Труба</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .glass { background: rgba(22, 27, 34, 0.85); backdrop-filter: blur(8px); border: 1px solid rgba(48, 54, 61, 0.7); }
  </style>
</head>
<body class="relative select-none">

  <!-- UI Панель управления -->
  <div class="absolute top-4 left-4 z-10 w-80 glass rounded-xl p-4 shadow-2xl flex flex-col gap-4 max-h-[92vh] overflow-y-auto">
    <h1 class="text-lg font-bold text-teal-400 flex items-center justify-between">
      <span>3D Нанотрубка</span>
      <span class="text-xs bg-teal-950 text-teal-300 border border-teal-800 px-2 py-0.5 rounded-full">Замкнутая</span>
    </h1>

    <p class="text-xs text-gray-400">Бесшовная генерация сетки с оптимизацией памяти.</p>

    <!-- Ползунки параметров -->
    <div class="space-y-3">
      <div>
        <div class="flex justify-between text-xs mb-1">
          <label>Окружность (N ячеек)</label>
          <span id="val-n" class="font-mono text-teal-400">12</span>
        </div>
        <input id="slider-n" type="range" min="6" max="30" value="12" class="w-full accent-teal-500 bg-gray-700 h-1 rounded">
      </div>

      <div>
        <div class="flex justify-between text-xs mb-1">
          <label>Длина (M рядов)</label>
          <span id="val-m" class="font-mono text-teal-400">20</span>
        </div>
        <input id="slider-m" type="range" min="5" max="50" value="20" class="w-full accent-teal-500 bg-gray-700 h-1 rounded">
      </div>

      <div>
        <div class="flex justify-between text-xs mb-1">
          <label>Сворачивание (Труба / Лист)</label>
          <span id="val-roll" class="font-mono text-teal-400">100%</span>
        </div>
        <input id="slider-roll" type="range" min="0" max="100" value="100" class="w-full accent-teal-500 bg-gray-700 h-1 rounded">
      </div>

      <div>
        <div class="flex justify-between text-xs mb-1">
          <label>Продольный срез</label>
          <span id="val-cut" class="font-mono text-teal-400">100%</span>
        </div>
        <input id="slider-cut" type="range" min="10" max="100" value="100" class="w-full accent-teal-500 bg-gray-700 h-1 rounded">
      </div>
    </div>

    <hr class="border-gray-800">

    <!-- Переключатели -->
    <div class="space-y-2 text-xs">
      <label class="flex items-center justify-between cursor-pointer">
        <span>Карта нагрузок (Stress)</span>
        <input id="toggle-stress" type="checkbox" class="accent-teal-500 w-4 h-4">
      </label>
    </div>

    <hr class="border-gray-800">

    <!-- Статистика -->
    <div class="bg-gray-900/60 p-3 rounded-lg border border-gray-800 space-y-1.5 text-xs">
      <div class="flex justify-between text-gray-400">
        <span>Атомов:</span>
        <span id="stat-atoms" class="font-mono text-white">0</span>
      </div>
      <div class="flex justify-between text-gray-400">
        <span>Связей:</span>
        <span id="stat-bonds" class="font-mono text-white">0</span>
      </div>
      <div class="flex justify-between text-gray-400">
        <span>Стык трубы:</span>
        <span class="font-mono text-teal-400 font-bold">100% Замкнут</span>
      </div>
    </div>
  </div>

  <script>
    const BOND_LENGTH = 1.42;

    let scene, camera, renderer, controls;
    let atomsMesh, bondsMesh;
    
    // Переиспользуемые глобальные объекты для исключения работы Garbage Collector
    const dummy = new THREE.Object3D();
    const tempColor = new THREE.Color();
    const vecA = new THREE.Vector3();
    const vecB = new THREE.Vector3();

    let params = {
      N: 12,
      M: 20,
      roll: 1.0,
      cutout: 1.0,
      stressMap: false
    };

    let baseAtoms = [];
    let baseBonds = [];
    let worldPositions = []; // Кэш векторов узлов

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0d1117);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(25, 20, 35);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0x00f0ff, 0.8);
      dirLight.position.set(20, 40, 20);
      scene.add(dirLight);

      rebuildTopology();
      setupUI();

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    // --- Математически идеальное замыкание цилиндра без зазоров ---
    function rebuildTopology() {
      baseAtoms = [];
      baseBonds = [];

      const N = params.N;
      const M = params.M;
      const a = BOND_LENGTH;
      
      // Ширина развертки с учетом полного цикла бесшовного соединения
      const width = N * Math.sqrt(3) * a;

      const nodeMap = new Map();
      let atomIndex = 0;

      for (let i = 0; i < N; i++) {
        for (let j = 0; j < M; j++) {
          let x0 = i * Math.sqrt(3) * a;
          let y0 = j * 3 * a;

          let pts = [
            { x: x0, y: y0 },
            { x: x0 + (Math.sqrt(3)/2)*a, y: y0 + 0.5*a },
            { x: x0 + (Math.sqrt(3)/2)*a, y: y0 + 1.5*a },
            { x: x0, y: y0 + 2.0*a }
          ];

          pts.forEach(p => {
            // Замыкание координат по ширине X (периодические граничные условия)
            let wrappedX = (p.x % width + width) % width;
            let key = `${wrappedX.toFixed(3)},${p.y.toFixed(3)}`;

            if (!nodeMap.has(key)) {
              nodeMap.set(key, atomIndex++);
              baseAtoms.push({ x: wrappedX, y: p.y, rawX: p.x });
            }
          });
        }
      }

      // Быстрое определение связей
      const maxDistSq = (a * 1.15) ** 2;
      for (let i = 0; i < baseAtoms.length; i++) {
        for (let j = i + 1; j < baseAtoms.length; j++) {
          let p1 = baseAtoms[i];
          let p2 = baseAtoms[j];

          let dx = Math.abs(p1.x - p2.x);
          // Учет бесшовной связи первого и последнего столбцов
          if (dx > width / 2) dx = width - dx;

          let dy = Math.abs(p1.y - p2.y);
          let distSq = dx * dx + dy * dy;

          if (distSq <= maxDistSq) {
            baseBonds.push({ a: i, b: j });
          }
        }
      }

      // Инициализация кэша векторов координат
      worldPositions = new Array(baseAtoms.length);
      for (let i = 0; i < baseAtoms.length; i++) {
        worldPositions[i] = new THREE.Vector3();
      }

      document.getElementById('stat-atoms').innerText = baseAtoms.length;
      document.getElementById('stat-bonds').innerText = baseBonds.length;

      buildInstancedMeshes();
    }

    function buildInstancedMeshes() {
      if (atomsMesh) {
        scene.remove(atomsMesh);
        atomsMesh.geometry.dispose();
        atomsMesh.material.dispose();
      }
      if (bondsMesh) {
        scene.remove(bondsMesh);
        bondsMesh.geometry.dispose();
        bondsMesh.material.dispose();
      }

      const sphereGeo = new THREE.SphereGeometry(0.32, 8, 8);
      const cylGeo = new THREE.CylinderGeometry(0.08, 0.08, 1, 6);
      cylGeo.translate(0, 0.5, 0);
      cylGeo.rotateX(Math.PI / 2);

      const atomMat = new THREE.MeshStandardMaterial({ color: 0x00f0ff, roughness: 0.3, metalness: 0.7 });
      const bondMat = new THREE.MeshStandardMaterial({ color: 0x4a5568, roughness: 0.5 });

      atomsMesh = new THREE.InstancedMesh(sphereGeo, atomMat, baseAtoms.length);
      bondsMesh = new THREE.InstancedMesh(cylGeo, bondMat, baseBonds.length);

      scene.add(atomsMesh);
      scene.add(bondsMesh);

      updateTransforms();
    }

    // --- Высокооптимизированное обновление матриц (Zero Memory Allocation) ---
    function updateTransforms() {
      if (!atomsMesh || !bondsMesh) return;

      const N = params.N;
      const width = N * Math.sqrt(3) * BOND_LENGTH;
      const R = width / (2 * Math.PI);
      const roll = params.roll;
      const cutoutAngle = params.cutout * Math.PI * 2;
      const offsetY = (params.M * BOND_LENGTH * 1.5) / 2;

      for (let i = 0; i < baseAtoms.length; i++) {
        let atom = baseAtoms[i];
        let u = atom.x / width;
        let angle = u * Math.PI * 2;

        if (angle > cutoutAngle && roll > 0.1) {
          dummy.scale.set(0, 0, 0);
          dummy.updateMatrix();
          atomsMesh.setMatrixAt(i, dummy.matrix);
          worldPositions[i].set(NaN, NaN, NaN); // Пометка видимости
          continue;
        }

        let flatX = atom.x - width / 2;
        let flatY = atom.y - offsetY;
        let flatZ = 0;

        let cylX = R * Math.cos(angle - Math.PI / 2);
        let cylY = atom.y - offsetY;
        let cylZ = R * Math.sin(angle - Math.PI / 2);

        let x = THREE.MathUtils.lerp(flatX, cylX, roll);
        let y = THREE.MathUtils.lerp(flatY, cylY, roll);
        let z = THREE.MathUtils.lerp(flatZ, cylZ, roll);

        worldPositions[i].set(x, y, z);

        dummy.position.set(x, y, z);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        atomsMesh.setMatrixAt(i, dummy.matrix);

        if (params.stressMap) {
          let stress = Math.abs(Math.sin(angle));
          tempColor.setHSL(0.6 - stress * 0.6, 1.0, 0.5);
        } else {
          tempColor.setHex(0x00f0ff);
        }
        atomsMesh.setColorAt(i, tempColor);
      }

      for (let i = 0; i < baseBonds.length; i++) {
        let bond = baseBonds[i];
        let pA = worldPositions[bond.a];
        let pB = worldPositions[bond.b];

        if (isNaN(pA.x) || isNaN(pB.x)) {
          dummy.scale.set(0, 0, 0);
          dummy.updateMatrix();
          bondsMesh.setMatrixAt(i, dummy.matrix);
          continue;
        }

        // Проверка на корректность отрисовки замкнутых крайних связей
        if (pA.distanceToSquared(pB) > (BOND_LENGTH * 2.5) ** 2) {
          dummy.scale.set(0, 0, 0);
          dummy.updateMatrix();
          bondsMesh.setMatrixAt(i, dummy.matrix);
          continue;
        }

        dummy.position.copy(pA);
        dummy.lookAt(pB);
        let dist = pA.distanceTo(pB);
        dummy.scale.set(1, 1, dist);
        dummy.updateMatrix();

        bondsMesh.setMatrixAt(i, dummy.matrix);
      }

      atomsMesh.instanceMatrix.needsUpdate = true;
      if (atomsMesh.instanceColor) atomsMesh.instanceColor.needsUpdate = true;
      bondsMesh.instanceMatrix.needsUpdate = true;
    }

    function setupUI() {
      document.getElementById('slider-n').addEventListener('input', (e) => {
        params.N = parseInt(e.target.value);
        document.getElementById('val-n').innerText = params.N;
        rebuildTopology();
      });

      document.getElementById('slider-m').addEventListener('input', (e) => {
        params.M = parseInt(e.target.value);
        document.getElementById('val-m').innerText = params.M;
        rebuildTopology();
      });

      document.getElementById('slider-roll').addEventListener('input', (e) => {
        params.roll = parseFloat(e.target.value) / 100;
        document.getElementById('val-roll').innerText = `${e.target.value}%`;
        updateTransforms();
      });

      document.getElementById('slider-cut').addEventListener('input', (e) => {
        params.cutout = parseFloat(e.target.value) / 100;
        document.getElementById('val-cut').innerText = `${e.target.value}%`;
        updateTransforms();
      });

      document.getElementById('toggle-stress').addEventListener('change', (e) => {
        params.stressMap = e.target.checked;
        updateTransforms();
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>
