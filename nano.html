<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Модель Пустотелой Трубы (Углеродная Нанотрубка)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .glass { background: rgba(22, 27, 34, 0.85); backdrop-filter: blur(8px); border: 1px solid rgba(48, 54, 61, 0.7); }
  </style>
</head>
<body class="relative select-none">

  <!-- UI Панель управления -->
  <div class="absolute top-4 left-4 z-10 w-80 glass rounded-xl p-4 shadow-2xl flex flex-col gap-4 max-h-[92vh] overflow-y-auto">
    <h1 class="text-lg font-bold text-teal-400 flex items-center justify-between">
      <span>3D Нанотрубка</span>
      <span class="text-xs bg-teal-950 text-teal-300 border border-teal-800 px-2 py-0.5 rounded-full">Пустотелая</span>
    </h1>

    <p class="text-xs text-gray-400">Параметры гексагональной сетки и структуры трубы.</p>

    <!-- Ползунки параметров -->
    <div class="space-y-3">
      <div>
        <div class="flex justify-between text-xs mb-1">
          <label>Окружность (N ячеек)</label>
          <span id="val-n" class="font-mono text-teal-400">12</span>
        </div>
        <input id="slider-n" type="range" min="6" max="30" value="12" class="w-full accent-teal-500 bg-gray-700 h-1 rounded">
      </div>

      <div>
        <div class="flex justify-between text-xs mb-1">
          <label>Длина (M рядов)</label>
          <span id="val-m" class="font-mono text-teal-400">20</span>
        </div>
        <input id="slider-m" type="range" min="5" max="50" value="20" class="w-full accent-teal-500 bg-gray-700 h-1 rounded">
      </div>

      <div>
        <div class="flex justify-between text-xs mb-1">
          <label>Сворачивание (Труба / Лист)</label>
          <span id="val-roll" class="font-mono text-teal-400">100%</span>
        </div>
        <input id="slider-roll" type="range" min="0" max="100" value="100" class="w-full accent-teal-500 bg-gray-700 h-1 rounded">
      </div>

      <div>
        <div class="flex justify-between text-xs mb-1">
          <label>Продольный срез</label>
          <span id="val-cut" class="font-mono text-teal-400">100%</span>
        </div>
        <input id="slider-cut" type="range" min="10" max="100" value="100" class="w-full accent-teal-500 bg-gray-700 h-1 rounded">
      </div>
    </div>

    <hr class="border-gray-800">

    <!-- Переключатели -->
    <div class="space-y-2 text-xs">
      <label class="flex items-center justify-between cursor-pointer">
        <span>Карта нагрузок (Stress)</span>
        <input id="toggle-stress" type="checkbox" class="accent-teal-500 w-4 h-4">
      </label>
      <label class="flex items-center justify-between cursor-pointer">
        <span>Автовращение</span>
        <input id="toggle-autorotate" type="checkbox" class="accent-teal-500 w-4 h-4">
      </label>
    </div>

    <hr class="border-gray-800">

    <!-- Информационная карточка -->
    <div class="bg-gray-900/60 p-3 rounded-lg border border-gray-800 space-y-1.5 text-xs">
      <div class="flex justify-between text-gray-400">
        <span>Всего атомов (узлов):</span>
        <span id="stat-atoms" class="font-mono text-white">0</span>
      </div>
      <div class="flex justify-between text-gray-400">
        <span>Всего связей:</span>
        <span id="stat-bonds" class="font-mono text-white">0</span>
      </div>
      <div class="flex justify-between text-gray-400">
        <span>Экономия массы:</span>
        <span id="stat-saving" class="font-mono text-teal-400 font-bold">~82%</span>
      </div>
    </div>
  </div>

  <!-- JavaScript код приложения -->
  <script>
    // --- Константы геолокации и топологии ---
    const BOND_LENGTH = 1.42; 
    const RAD = BOND_LENGTH * Math.sqrt(3);

    // --- Переменные сцены ---
    let scene, camera, renderer, controls;
    let atomsMesh, bondsMesh;
    let clock = new THREE.Clock();

    // Параметры
    let params = {
      N: 12,
      M: 20,
      roll: 1.0,
      cutout: 1.0,
      stressMap: false,
      autoRotate: false
    };

    // Топологические данные
    let baseAtoms = []; 
    let baseBonds = [];

    // --- Инициализация Three.js ---
    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0d1117);
      scene.fog = new THREE.FogExp2(0x0d1117, 0.015);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(25, 20, 35);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.rotateSpeed = 0.8;
      controls.zoomSpeed = 1.2;

      // Освещение
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight1 = new THREE.DirectionalLight(0x00f0ff, 0.8);
      dirLight1.position.set(20, 40, 20);
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0xff0055, 0.5);
      dirLight2.position.set(-20, -20, -20);
      scene.add(dirLight2);

      // Генерация сетки
      rebuildTopology();
      setupUI();

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    // --- Математический расчет 2D/3D гексагональной трубки ---
    function rebuildTopology() {
      baseAtoms = [];
      baseBonds = [];

      const N = params.N;
      const M = params.M;
      const a = BOND_LENGTH;

      // Генерация узлов графеневой плоскости
      const nodeMap = new Map();
      let atomIndex = 0;

      for (let i = 0; i < N; i++) {
        for (let j = 0; j < M; j++) {
          let x0 = i * Math.sqrt(3) * a;
          let y0 = j * 3 * a;

          let p1 = { x: x0, y: y0, i, j, type: 0 };
          let p2 = { x: x0 + (Math.sqrt(3)/2)*a, y: y0 + 0.5*a, i, j, type: 1 };
          let p3 = { x: x0 + (Math.sqrt(3)/2)*a, y: y0 + 1.5*a, i, j, type: 2 };
          let p4 = { x: x0, y: y0 + 2.0*a, i, j, type: 3 };

          [p1, p2, p3, p4].forEach(p => {
            let key = `${p.x.toFixed(2)},${p.y.toFixed(2)}`;
            if (!nodeMap.has(key)) {
              nodeMap.set(key, atomIndex++);
              baseAtoms.push(p);
            }
          });
        }
      }

      // Быстрый расчет связей (Spatial Grid $O(V)$)
      const grid = new Map();
      const cellSize = a * 1.2;

      baseAtoms.forEach((atom, idx) => {
        let cx = Math.floor(atom.x / cellSize);
        let cy = Math.floor(atom.y / cellSize);
        let key = `${cx},${cy}`;
        if (!grid.has(key)) grid.set(key, []);
        grid.get(key).push({ idx, x: atom.x, y: atom.y });
      });

      const maxDistSq = (a * 1.1) ** 2;

      baseAtoms.forEach((atom, i) => {
        let cx = Math.floor(atom.x / cellSize);
        let cy = Math.floor(atom.y / cellSize);

        for (let dx = -1; dx <= 1; dx++) {
          for (let dy = -1; dy <= 1; dy++) {
            let neighborKey = `${cx + dx},${cy + dy}`;
            let neighbors = grid.get(neighborKey);
            if (neighbors) {
              neighbors.forEach(n => {
                if (n.idx > i) {
                  let distSq = (atom.x - n.x)**2 + (atom.y - n.y)**2;
                  if (distSq <= maxDistSq) {
                    baseBonds.push({ a: i, b: n.idx });
                  }
                }
              });
            }
          }
        }
      });

      document.getElementById('stat-atoms').innerText = baseAtoms.length;
      document.getElementById('stat-bonds').innerText = baseBonds.length;

      buildInstancedMeshes();
    }

    // --- Построение GPU Instanced Mesh ---
    function buildInstancedMeshes() {
      if (atomsMesh) scene.remove(atomsMesh);
      if (bondsMesh) scene.remove(bondsMesh);

      const sphereGeo = new THREE.SphereGeometry(0.35, 10, 10);
      const cylGeo = new THREE.CylinderGeometry(0.1, 0.1, 1, 6);
      cylGeo.translate(0, 0.5, 0);
      cylGeo.rotateX(Math.PI / 2);

      const atomMat = new THREE.MeshStandardMaterial({
        color: 0x00f0ff,
        roughness: 0.2,
        metalness: 0.8
      });

      const bondMat = new THREE.MeshStandardMaterial({
        color: 0x3a506b,
        roughness: 0.4,
        metalness: 0.5
      });

      atomsMesh = new THREE.InstancedMesh(sphereGeo, atomMat, baseAtoms.length);
      bondsMesh = new THREE.InstancedMesh(cylGeo, bondMat, baseBonds.length);

      scene.add(atomsMesh);
      scene.add(bondsMesh);

      updateTransforms();
    }

    // --- Плавное обновление координат и трансформации ---
    function updateTransforms() {
      if (!atomsMesh || !bondsMesh) return;

      const N = params.N;
      const width = N * Math.sqrt(3) * BOND_LENGTH;
      const R = width / (2 * Math.PI);
      const roll = params.roll;
      const cutoutAngle = params.cutout * Math.PI * 2;

      const dummy = new THREE.Object3D();
      const color = new THREE.Color();
      const positions = [];

      // Обновление узлов
      let activeAtoms = 0;
      baseAtoms.forEach((atom, i) => {
        let u = atom.x / width;
        let angle = u * Math.PI * 2;

        if (angle > cutoutAngle && roll > 0.1) {
          dummy.scale.set(0, 0, 0);
          dummy.updateMatrix();
          atomsMesh.setMatrixAt(i, dummy.matrix);
          positions.push(null);
          return;
        }

        activeAtoms++;
        let flatX = atom.x - width / 2;
        let flatY = atom.y;
        let flatZ = 0;

        let cylX = R * Math.cos(angle - Math.PI / 2);
        let cylY = atom.y;
        let cylZ = R * Math.sin(angle - Math.PI / 2);

        let x = THREE.MathUtils.lerp(flatX, cylX, roll);
        let y = THREE.MathUtils.lerp(flatY, cylY, roll);
        let z = THREE.MathUtils.lerp(flatZ, cylZ, roll);

        positions.push(new THREE.Vector3(x, y - (params.M * BOND_LENGTH * 1.5)/2, z));

        dummy.position.set(x, y - (params.M * BOND_LENGTH * 1.5)/2, z);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        atomsMesh.setMatrixAt(i, dummy.matrix);

        // Стресс-карта
        if (params.stressMap) {
          let stress = Math.abs(Math.sin(angle));
          color.setHSL(0.6 - stress * 0.6, 1.0, 0.5);
        } else {
          color.setHex(0x00f0ff);
        }
        atomsMesh.setColorAt(i, color);
      });

      // Обновление связей
      baseBonds.forEach((bond, i) => {
        let pA = positions[bond.a];
        let pB = positions[bond.b];

        if (!pA || !pB) {
          dummy.scale.set(0, 0, 0);
          dummy.updateMatrix();
          bondsMesh.setMatrixAt(i, dummy.matrix);
          return;
        }

        dummy.position.copy(pA);
        dummy.lookAt(pB);
        let dist = pA.distanceTo(pB);
        dummy.scale.set(1, 1, dist);
        dummy.updateMatrix();

        bondsMesh.setMatrixAt(i, dummy.matrix);
      });

      atomsMesh.instanceMatrix.needsUpdate = true;
      if (atomsMesh.instanceColor) atomsMesh.instanceColor.needsUpdate = true;
      bondsMesh.instanceMatrix.needsUpdate = true;
    }

    // --- Интерфейс и обработчики событий ---
    function setupUI() {
      document.getElementById('slider-n').addEventListener('input', (e) => {
        params.N = parseInt(e.target.value);
        document.getElementById('val-n').innerText = params.N;
        rebuildTopology();
      });

      document.getElementById('slider-m').addEventListener('input', (e) => {
        params.M = parseInt(e.target.value);
        document.getElementById('val-m').innerText = params.M;
        rebuildTopology();
      });

      document.getElementById('slider-roll').addEventListener('input', (e) => {
        params.roll = parseFloat(e.target.value) / 100;
        document.getElementById('val-roll').innerText = `${e.target.value}%`;
        updateTransforms();
      });

      document.getElementById('slider-cut').addEventListener('input', (e) => {
        params.cutout = parseFloat(e.target.value) / 100;
        document.getElementById('val-cut').innerText = `${e.target.value}%`;
        updateTransforms();
      });

      document.getElementById('toggle-stress').addEventListener('change', (e) => {
        params.stressMap = e.target.checked;
        updateTransforms();
      });

      document.getElementById('toggle-autorotate').addEventListener('change', (e) => {
        params.autoRotate = e.target.checked;
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // --- Цикл рендеринга (60/120 FPS) ---
    function animate() {
      requestAnimationFrame(animate);

      let delta = clock.getDelta();

      if (params.autoRotate) {
        scene.rotation.y += delta * 0.5;
      } else {
        scene.rotation.y = 0;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>
