<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Многотрубный Массив (Extreme Optimization)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .glass { background: rgba(22, 27, 34, 0.85); backdrop-filter: blur(8px); border: 1px solid rgba(48, 54, 61, 0.7); }
  </style>
</head>
<body class="relative select-none">

  <!-- UI Панель управления -->
  <div class="absolute top-4 left-4 z-10 w-80 glass rounded-xl p-4 shadow-2xl flex flex-col gap-4 max-h-[92vh] overflow-y-auto">
    <h1 class="text-lg font-bold text-teal-400 flex items-center justify-between">
      <span>Мульти-Трубный Массив</span>
      <span id="fps-counter" class="text-xs bg-emerald-950 text-emerald-300 border border-emerald-800 px-2 py-0.5 rounded-full font-mono">60 FPS</span>
    </h1>

    <p class="text-xs text-gray-400">GPU Instancing: Все трубки рендерятся за 2 Draw Call.</p>

    <!-- Ползунки параметров -->
    <div class="space-y-3">
      <div>
        <div class="flex justify-between text-xs mb-1">
          <label class="font-bold text-white">Количество труб</label>
          <span id="val-tubes" class="font-mono text-teal-400">9 (3x3)</span>
        </div>
        <input id="slider-tubes" type="range" min="1" max="25" value="9" class="w-full accent-teal-500 bg-gray-700 h-1 rounded">
      </div>

      <div>
        <div class="flex justify-between text-xs mb-1">
          <label>Окружность (N ячеек)</label>
          <span id="val-n" class="font-mono text-teal-400">10</span>
        </div>
        <input id="slider-n" type="range" min="6" max="20" value="10" class="w-full accent-teal-500 bg-gray-700 h-1 rounded">
      </div>

      <div>
        <div class="flex justify-between text-xs mb-1">
          <label>Длина (M рядов)</label>
          <span id="val-m" class="font-mono text-teal-400">15</span>
        </div>
        <input id="slider-m" type="range" min="5" max="30" value="15" class="w-full accent-teal-500 bg-gray-700 h-1 rounded">
      </div>

      <div>
        <div class="flex justify-between text-xs mb-1">
          <label>Сворачивание</label>
          <span id="val-roll" class="font-mono text-teal-400">100%</span>
        </div>
        <input id="slider-roll" type="range" min="0" max="100" value="100" class="w-full accent-teal-500 bg-gray-700 h-1 rounded">
      </div>
    </div>

    <hr class="border-gray-800">

    <!-- Переключатели -->
    <div class="space-y-2 text-xs">
      <label class="flex items-center justify-between cursor-pointer">
        <span>Анимированное вращение труб</span>
        <input id="toggle-wave" type="checkbox" checked class="accent-teal-500 w-4 h-4">
      </label>
    </div>

    <hr class="border-gray-800">

    <!-- Статистика -->
    <div class="bg-gray-900/60 p-3 rounded-lg border border-gray-800 space-y-1.5 text-xs">
      <div class="flex justify-between text-gray-400">
        <span>Всего атомов на GPU:</span>
        <span id="stat-atoms" class="font-mono text-white">0</span>
      </div>
      <div class="flex justify-between text-gray-400">
        <span>Всего связей на GPU:</span>
        <span id="stat-bonds" class="font-mono text-white">0</span>
      </div>
      <div class="flex justify-between text-gray-400">
        <span>Вызовов отрисовки (Draw Calls):</span>
        <span class="font-mono text-emerald-400 font-bold">2</span>
      </div>
    </div>
  </div>

  <script>
    const BOND_LENGTH = 1.42;

    let scene, camera, renderer, controls;
    let globalAtomsMesh, globalBondsMesh;
    
    // Пул объектов для исключения Garbage Collection
    const dummy = new THREE.Object3D();
    const tempColor = new THREE.Color();
    const clock = new THREE.Clock();

    // Замеры FPS
    let frameCount = 0;
    let lastFpsUpdate = 0;

    let params = {
      tubeCount: 9,
      N: 10,
      M: 15,
      roll: 1.0,
      animateWave: true
    };

    // Топологический шаблон одной трубы
    let singleTubeAtoms = [];
    let singleTubeBonds = [];
    let tubePositionsCache = []; // Выделенный буфер координат

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0d12);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(30, 40, 60);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); // Оптимизация под 4K экраны
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0x00f0ff, 1.0);
      dirLight.position.set(30, 50, 30);
      scene.add(dirLight);

      rebuildGridAndTopology();
      setupUI();

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    // --- Генерация базвых топологий (выполняется 1 раз при смене параметров) ---
    function rebuildGridAndTopology() {
      singleTubeAtoms = [];
      singleTubeBonds = [];

      const N = params.N;
      const M = params.M;
      const a = BOND_LENGTH;
      const width = N * Math.sqrt(3) * a;

      const nodeMap = new Map();
      let atomIndex = 0;

      for (let i = 0; i < N; i++) {
        for (let j = 0; j < M; j++) {
          let x0 = i * Math.sqrt(3) * a;
          let y0 = j * 3 * a;

          let pts = [
            { x: x0, y: y0 },
            { x: x0 + (Math.sqrt(3)/2)*a, y: y0 + 0.5*a },
            { x: x0 + (Math.sqrt(3)/2)*a, y: y0 + 1.5*a },
            { x: x0, y: y0 + 2.0*a }
          ];

          pts.forEach(p => {
            let wrappedX = (p.x % width + width) % width;
            let key = `${wrappedX.toFixed(3)},${p.y.toFixed(3)}`;

            if (!nodeMap.has(key)) {
              nodeMap.set(key, atomIndex++);
              singleTubeAtoms.push({ x: wrappedX, y: p.y });
            }
          });
        }
      }

      const maxDistSq = (a * 1.15) ** 2;
      for (let i = 0; i < singleTubeAtoms.length; i++) {
        for (let j = i + 1; j < singleTubeAtoms.length; j++) {
          let p1 = singleTubeAtoms[i];
          let p2 = singleTubeAtoms[j];

          let dx = Math.abs(p1.x - p2.x);
          if (dx > width / 2) dx = width - dx;

          let dy = Math.abs(p1.y - p2.y);
          if (dx * dx + dy * dy <= maxDistSq) {
            singleTubeBonds.push({ a: i, b: j });
          }
        }
      }

      // Выделяем память под массив координат
      const totalAtoms = singleTubeAtoms.length * params.tubeCount;
      tubePositionsCache = new Array(totalAtoms);
      for (let i = 0; i < totalAtoms; i++) {
        tubePositionsCache[i] = new THREE.Vector3();
      }

      rebuildGlobalInstancedMeshes();
    }

    // --- Пересоздание глобальных InstancedMesh на GPU ---
    function rebuildGlobalInstancedMeshes() {
      if (globalAtomsMesh) {
        scene.remove(globalAtomsMesh);
        globalAtomsMesh.geometry.dispose();
        globalAtomsMesh.material.dispose();
      }
      if (globalBondsMesh) {
        scene.remove(globalBondsMesh);
        globalBondsMesh.geometry.dispose();
        globalBondsMesh.material.dispose();
      }

      const totalAtoms = singleTubeAtoms.length * params.tubeCount;
      const totalBonds = singleTubeBonds.length * params.tubeCount;

      // Низкополигональные базовые формы для высокого FPS
      const sphereGeo = new THREE.SphereGeometry(0.3, 6, 6);
      const cylGeo = new THREE.CylinderGeometry(0.07, 0.07, 1, 5);
      cylGeo.translate(0, 0.5, 0);
      cylGeo.rotateX(Math.PI / 2);

      const atomMat = new THREE.MeshStandardMaterial({ color: 0x00f0ff, roughness: 0.3, metalness: 0.8 });
      const bondMat = new THREE.MeshStandardMaterial({ color: 0x3b4252, roughness: 0.5 });

      globalAtomsMesh = new THREE.InstancedMesh(sphereGeo, atomMat, totalAtoms);
      globalBondsMesh = new THREE.InstancedMesh(cylGeo, bondMat, totalBonds);

      // Включаем динамический режим обновления GPU буфера
      globalAtomsMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      globalBondsMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

      scene.add(globalAtomsMesh);
      scene.add(globalBondsMesh);

      document.getElementById('stat-atoms').innerText = totalAtoms;
      document.getElementById('stat-bonds').innerText = totalBonds;

      updateMeshTransforms(0);
    }

    // --- Высокоскоростной расчет трансформаций (Zero Allocation Loop) ---
    function updateMeshTransforms(time) {
      if (!globalAtomsMesh || !globalBondsMesh) return;

      const N = params.N;
      const width = N * Math.sqrt(3) * BOND_LENGTH;
      const R = width / (2 * Math.PI);
      const roll = params.roll;
      const offsetY = (params.M * BOND_LENGTH * 1.5) / 2;

      const gridSide = Math.ceil(Math.sqrt(params.tubeCount));
      const spacing = R * 3.5 + 8;

      let globalAtomIdx = 0;
      let globalBondIdx = 0;

      for (let t = 0; t < params.tubeCount; t++) {
        // Смещение трубки в сетке
        let gx = (t % gridSide) - (gridSide - 1) / 2;
        let gz = Math.floor(t / gridSide) - (gridSide - 1) / 2;

        let tubeOffsetX = gx * spacing;
        let tubeOffsetZ = gz * spacing;

        // Вращение каждой трубки с индивидуальной фазой
        let waveRot = params.animateWave ? Math.sin(time * 1.5 + t * 0.4) * 0.5 : 0;
        let cosW = Math.cos(waveRot);
        let sinW = Math.sin(waveRot);

        let atomStartOffset = globalAtomIdx;

        // 1. Обновляем узлы (Атомы)
        for (let i = 0; i < singleTubeAtoms.length; i++) {
          let atom = singleTubeAtoms[i];
          let angle = (atom.x / width) * Math.PI * 2;

          let flatX = atom.x - width / 2;
          let flatY = atom.y - offsetY;
          let flatZ = 0;

          let cylX = R * Math.cos(angle - Math.PI / 2);
          let cylY = atom.y - offsetY;
          let cylZ = R * Math.sin(angle - Math.PI / 2);

          let localX = THREE.MathUtils.lerp(flatX, cylX, roll);
          let localY = THREE.MathUtils.lerp(flatY, cylY, roll);
          let localZ = THREE.MathUtils.lerp(flatZ, cylZ, roll);

          // Применяем локальное вращение waveRot вокруг оси Y
          let rotX = localX * cosW - localZ * sinW;
          let rotZ = localX * sinW + localZ * cosW;

          let finalX = rotX + tubeOffsetX;
          let finalY = localY;
          let finalZ = rotZ + tubeOffsetZ;

          tubePositionsCache[globalAtomIdx].set(finalX, finalY, finalZ);

          dummy.position.set(finalX, finalY, finalZ);
          dummy.scale.set(1, 1, 1);
          dummy.updateMatrix();

          globalAtomsMesh.setMatrixAt(globalAtomIdx, dummy.matrix);
          globalAtomIdx++;
        }

        // 2. Обновляем связи (Цилиндры)
        for (let i = 0; i < singleTubeBonds.length; i++) {
          let bond = singleTubeBonds[i];
          let pA = tubePositionsCache[atomStartOffset + bond.a];
          let pB = tubePositionsCache[atomStartOffset + bond.b];

          // Исключаем разрывы на краях
          if (pA.distanceToSquared(pB) > (BOND_LENGTH * 2.5) ** 2) {
            dummy.scale.set(0, 0, 0);
            dummy.updateMatrix();
            globalBondsMesh.setMatrixAt(globalBondIdx, dummy.matrix);
          } else {
            dummy.position.copy(pA);
            dummy.lookAt(pB);
            let dist = pA.distanceTo(pB);
            dummy.scale.set(1, 1, dist);
            dummy.updateMatrix();

            globalBondsMesh.setMatrixAt(globalBondIdx, dummy.matrix);
          }
          globalBondIdx++;
        }
      }

      globalAtomsMesh.instanceMatrix.needsUpdate = true;
      globalBondsMesh.instanceMatrix.needsUpdate = true;
    }

    // --- UI События ---
    function setupUI() {
      document.getElementById('slider-tubes').addEventListener('input', (e) => {
        params.tubeCount = parseInt(e.target.value);
        let side = Math.ceil(Math.sqrt(params.tubeCount));
        document.getElementById('val-tubes').innerText = `${params.tubeCount} (${side}x${side})`;
        rebuildGridAndTopology();
      });

      document.getElementById('slider-n').addEventListener('input', (e) => {
        params.N = parseInt(e.target.value);
        document.getElementById('val-n').innerText = params.N;
        rebuildGridAndTopology();
      });

      document.getElementById('slider-m').addEventListener('input', (e) => {
        params.M = parseInt(e.target.value);
        document.getElementById('val-m').innerText = params.M;
        rebuildGridAndTopology();
      });

      document.getElementById('slider-roll').addEventListener('input', (e) => {
        params.roll = parseFloat(e.target.value) / 100;
        document.getElementById('val-roll').innerText = `${e.target.value}%`;
        updateMeshTransforms(clock.getElapsedTime());
      });

      document.getElementById('toggle-wave').addEventListener('change', (e) => {
        params.animateWave = e.target.checked;
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // --- Кадровый цикл (Замер FPS и плавный рендер) ---
    function animate() {
      requestAnimationFrame(animate);

      let time = clock.getElapsedTime();

      // FPS Счетчик
      frameCount++;
      if (time - lastFpsUpdate > 0.5) {
        let fps = Math.round((frameCount / (time - lastFpsUpdate)));
        document.getElementById('fps-counter').innerText = `${fps} FPS`;
        frameCount = 0;
        lastFpsUpdate = time;
      }

      if (params.animateWave) {
        updateMeshTransforms(time);
      }

      controls.update();
      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>
