<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Солнце и Земля - Three.js</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-family: sans-serif;
            font-size: 13px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 6px;
            pointer-events: none;
        }
    </style>

    <!-- Подключаем Three.js и OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="info">
        <b>Модель системы Солнце-Земля</b><br>
        • Наклон оси Земли: 23.44°<br>
        • Форма: геоид/эллипсоид (сплюснутость 1:0.9966)<br>
        • Орбита: эллиптическая (e = 0.0167)<br>
        • Освещение: параллельные лучи (имитация дальнего Солнца)
    </div>

    <script>
        // --- 1. СЦЕНА, КАМЕРА И РЕНДЕРЕР ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 25, 45);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // --- 2. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ДЛЯ ТЕКСТУР (без внешних файлов) ---
        function createSunTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(256, 256, 0, 256, 256, 256);
            grad.addColorStop(0, '#fff7d0');
            grad.addColorStop(0.2, '#ffae00');
            grad.addColorStop(1, '#ff3300');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 512, 512);
            return new THREE.CanvasTexture(canvas);
        }

        function createEarthTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#1a3b5c'; // Океан
            ctx.fillRect(0, 0, 1024, 512);
            ctx.fillStyle = '#2d6a4f'; // Материки (условная сетка)
            for (let i = 0; i < 80; i++) {
                ctx.beginPath();
                ctx.arc(Math.random() * 1024, Math.random() * 512, 20 + Math.random() * 60, 0, Math.PI * 2);
                ctx.fill();
            }
            return new THREE.CanvasTexture(canvas);
        }

        // --- 3. СОЛНЦЕ (Маленькое и близкое визуально) ---
        const sunRadius = 1.8;
        const sunGeo = new THREE.SphereGeometry(sunRadius, 32, 32);
        const sunMat = new THREE.MeshBasicMaterial({ map: createSunTexture() });
        const sunMesh = new THREE.Mesh(sunGeo, sunMat);
        scene.add(sunMesh);

        // --- 4. ОСВЕЩЕНИЕ (Параллельные лучи от Солнца к Земле) ---
        // DirectionalLight обеспечивает параллельные лучи, как от бесконечно удаленного Солнца
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.8);
        scene.add(sunLight);

        // Мягкий рассеянный свет для теневой стороны Земли (космический фон)
        const ambientLight = new THREE.AmbientLight(0x111122, 0.2);
        scene.add(ambientLight);

        // --- 5. ЗЕМЛЯ И ИЕРАРХИЯ ОБОЛОЧЕК НАКЛОНА ---
        // Иерархия: PositionGroup (орбита) -> TiltGroup (наклон 23.44°) -> EarthMesh (сплюснутая Земля)
        const earthPositionGroup = new THREE.Group();
        scene.add(earthPositionGroup);

        const earthTiltGroup = new THREE.Group();
        const axialTilt = THREE.MathUtils.degToRad(23.44); // 23.44 градуса
        earthTiltGroup.rotation.z = axialTilt; 
        earthPositionGroup.add(earthTiltGroup);

        // Геометрия Земли с реальными пропорциями сплюснутости (Геоид/Сфероид)
        const earthEquatorialRadius = 1.0;
        const earthPolarRadius = 0.9966; // Реальное отношение радиусов Земли (6356.8 / 6378.1)
        const earthGeo = new THREE.SphereGeometry(earthEquatorialRadius, 64, 64);
        
        const earthMat = new THREE.MeshStandardMaterial({
            map: createEarthTexture(),
            roughness: 0.7,
            metalness: 0.1
        });

        const earthMesh = new THREE.Mesh(earthGeo, earthMat);
        // Применяем физическую сплюснутость по оси Y
        earthMesh.scale.set(1, earthPolarRadius, 1);
        earthTiltGroup.add(earthMesh);

        // Наглядная визуализация оси вращения Земли
        const axisGeo = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(0, -1.8, 0),
            new THREE.Vector3(0, 1.8, 0)
        ]);
        const axisMat = new THREE.LineBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.5 });
        const axisLine = new THREE.Line(axisGeo, axisMat);
        earthTiltGroup.add(axisLine);

        // --- 6. ТРАЕКТОРИЯ ОРБИТЫ (Эллипс e = 0.0167) ---
        const a = 18.0; // Большая полуось
        const e = 0.0167; // Эксцентриситет орбиты Земли
        const b = a * Math.sqrt(1 - e * e); // Малая полуось
        const c = a * e; // Фокальное расстояние (Солнце в фокусе)

        // Помещаем Солнце в фокус эллипса
        sunMesh.position.set(-c, 0, 0);

        // Рисуем линию орбиты
        const orbitPoints = [];
        for (let i = 0; i <= 128; i++) {
            const theta = (i / 128) * Math.PI * 2;
            orbitPoints.push(new THREE.Vector3(a * Math.cos(theta) - c, 0, b * Math.sin(theta)));
        }
        const orbitGeo = new THREE.BufferGeometry().setFromPoints(orbitPoints);
        const orbitMat = new THREE.LineBasicMaterial({ color: 0x444466 });
        scene.add(new THREE.Line(orbitGeo, orbitMat));

        // Звездный фон
        const starsGeo = new THREE.BufferGeometry();
        const starCoords = [];
        for (let i = 0; i < 1500; i++) {
            starCoords.push((Math.random() - 0.5) * 300, (Math.random() - 0.5) * 300, (Math.random() - 0.5) * 300);
        }
        starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(starCoords, 3));
        scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({ color: 0xaaaaaa, size: 0.5 })));

        // --- 7. АНИМАЦИОННЫЙ ЦИКЛ ---
        let orbitAngle = 0;

        function animate() {
            requestAnimationFrame(animate);

            // 1. Движение по эллиптической орбите
            orbitAngle += 0.003;
            const x = a * Math.cos(orbitAngle) - c;
            const z = b * Math.sin(orbitAngle);
            earthPositionGroup.position.set(x, 0, z);

            // 2. Вращение Земли вокруг собственной наклоненной оси
            earthMesh.rotation.y += 0.015;

            // 3. Коррекция света: DirectionalLight всегда светит от центра Солнца на Землю
            sunLight.position.copy(sunMesh.position);
            sunLight.target = earthMesh;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Адаптация под изменение размеров окна
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
