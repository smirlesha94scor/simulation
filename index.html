<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Земля — Симуляция</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #ui {
            position: absolute; top: 10px; left: 10px; color: #fff;
            background: rgba(0, 0, 0, 0.8); padding: 12px; border-radius: 8px; z-index: 10;
        }
        button {
            background: #2b5278; color: white; border: none;
            padding: 6px 12px; margin-top: 8px; border-radius: 4px; cursor: pointer;
        }
        button:hover { background: #3b6e9e; }
        
        #map-container {
            position: absolute; bottom: 15px; right: 15px;
            width: 280px; background: rgba(0, 0, 0, 0.85);
            border: 1px solid #444; border-radius: 8px; padding: 8px; color: #fff;
            z-index: 10;
        }
        #map-canvas {
            width: 280px; height: 140px; background: #1a3b5c;
            cursor: crosshair; border-radius: 4px; display: block;
        }
        .info-text { font-size: 11px; color: #aaa; margin-top: 4px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="ui">
        Режим: <b id="cam-mode">Вид из космоса</b><br>
        <button id="toggle-cam">Переключить вид (C)</button>
        <div class="info-text">Стрелки (← → ↑ ↓): Огляд поворотом головы</div>
    </div>

    <div id="map-container">
        <div style="font-size: 12px; font-weight: bold; margin-bottom: 4px;">Выбор положения на Земле:</div>
        <canvas id="map-canvas" width="280" height="140"></canvas>
        <div class="info-text" id="coords-text">Широта: 0.0°, Долгота: 0.0°</div>
    </div>

    <script>
        const scene = new THREE.Scene();

        const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- МАСШТАБЫ ---
        const R_eq = 10.0;
        const R_pol = 9.9664;
        const humanHeight = 0.000003135; 

        let currentLat = 0; 
        let currentLon = 0; 

        let yaw = 0;   
        let pitch = 0; 

        // --- КАМЕРЫ ---
        const spaceCamera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        spaceCamera.position.set(0, 15, 30);

        const humanCamera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.0000001, 1000);
        
        const humanPivot = new THREE.Group();
        let activeCamera = spaceCamera;
        
        const controls = new THREE.OrbitControls(spaceCamera, renderer.domElement);
        controls.enableDamping = true;

        // --- ОСВЕЩЕНИЕ ---
        const sunMesh = new THREE.Mesh(
            new THREE.SphereGeometry(2.0, 32, 32),
            new THREE.MeshBasicMaterial({ color: 0xffffaa })
        );
        sunMesh.position.set(-40, 10, 20);
        scene.add(sunMesh);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.8);
        sunLight.position.copy(sunMesh.position);
        scene.add(sunLight);
        scene.add(new THREE.AmbientLight(0x223344, 0.4));

        // --- ПРОЦЕДУРНАЯ ТЕКСТУРА ЗЕМЛИ ---
        function generateEarthTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            // Океан
            ctx.fillStyle = '#1d3557';
            ctx.fillRect(0, 0, 1024, 512);

            // Материки (условная сетка суши)
            ctx.fillStyle = '#2a9d8f';
            for (let i = 0; i < 80; i++) {
                const x = Math.random() * 1024;
                const y = Math.random() * 512;
                const r = 30 + Math.random() * 80;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }
            return new THREE.CanvasTexture(canvas);
        }

        // --- ЗЕМЛЯ ---
        const earthPositionGroup = new THREE.Group();
        scene.add(earthPositionGroup);

        const earthTiltGroup = new THREE.Group();
        earthTiltGroup.rotation.z = THREE.MathUtils.degToRad(23.44);
        earthPositionGroup.add(earthTiltGroup);

        const earthGeo = new THREE.SphereGeometry(R_eq, 128, 128);
        const earthMat = new THREE.MeshStandardMaterial({ 
            map: generateEarthTexture(), 
            roughness: 0.7 
        });
        const earthMesh = new THREE.Mesh(earthGeo, earthMat);
        earthMesh.scale.set(1, R_pol / R_eq, 1);
        earthTiltGroup.add(earthMesh);

        earthMesh.add(humanPivot);
        humanPivot.add(humanCamera);

        // --- МЕТКИ СТОРУН СВЕТА ---
        function createCompassLabel(text, color) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = color;
            ctx.font = 'Bold 100px sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(text, 128, 128);

            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), depthTest: false }));
            sprite.scale.set(0.005, 0.005, 1);
            return sprite;
        }

        const north = createCompassLabel('С (N)', '#ff3333');
        const south = createCompassLabel('Ю (S)', '#3388ff');
        const east = createCompassLabel('В (E)', '#33ff33');
        const west = createCompassLabel('З (W)', '#ffff33');

        humanPivot.add(north); humanPivot.add(south); humanPivot.add(east); humanPivot.add(west);

        const dist = 0.1;
        north.position.set(0, dist, 0);
        south.position.set(0, -dist, 0);
        east.position.set(0, 0, dist);
        west.position.set(0, 0, -dist);

        // --- ПОЗИЦИОНИРОВАНИЕ ЧЕЛОВЕКА ---
        function updateHumanPosition(lat, lon) {
            currentLat = lat; currentLon = lon;

            const phi = THREE.MathUtils.degToRad(90 - lat);
            const theta = THREE.MathUtils.degToRad(lon);

            // Вычисляем координаты сферы
            const x = R_eq * Math.sin(phi) * Math.cos(theta);
            const y = R_pol * Math.cos(phi);
            const z = R_eq * Math.sin(phi) * Math.sin(theta);

            humanPivot.position.set(x, y, z);

            // Безопасное вычисление вектора ВЕРХ
            const normal = new THREE.Vector3(
                x / (R_eq * R_eq), 
                (y === 0 ? 0.0001 : y) / (R_pol * R_pol), 
                z / (R_eq * R_eq)
            ).normalize();

            const quaternion = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal);
            humanPivot.quaternion.copy(quaternion);

            humanCamera.position.set(0, humanHeight, 0);

            drawMap();
            document.getElementById('coords-text').innerText = `Широта: ${lat.toFixed(1)}°, Долгота: ${lon.toFixed(1)}°`;
        }

        // --- УПРАВЛЕНИЕ КЛАВИАТУРОЙ ---
        const keys = {};
        window.addEventListener('keydown', (e) => { keys[e.code] = true; });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        function handleLookControls() {
            if (activeCamera !== humanCamera) return;

            const speed = 0.02;
            if (keys['ArrowLeft'])  yaw += speed;
            if (keys['ArrowRight']) yaw -= speed;
            if (keys['ArrowUp'])    pitch = Math.min(Math.PI / 2.2, pitch + speed);
            if (keys['ArrowDown'])  pitch = Math.max(-Math.PI / 2.2, pitch - speed);

            humanCamera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
        }

        // --- 2D КАРТА ---
        const mapCanvas = document.getElementById('map-canvas');
        const mapCtx = mapCanvas.getContext('2d');

        function drawMap() {
            mapCtx.fillStyle = '#1a3b5c';
            mapCtx.fillRect(0, 0, 280, 140);

            // Сетка экватора и меридиана
            mapCtx.strokeStyle = '#335577';
            mapCtx.beginPath();
            mapCtx.moveTo(0, 70); mapCtx.lineTo(280, 70);
            mapCtx.moveTo(140, 0); mapCtx.lineTo(140, 140);
            mapCtx.stroke();

            // Точка
            const px = (currentLon + 180) * (280 / 360);
            const py = (90 - currentLat) * (140 / 180);

            mapCtx.fillStyle = '#ff3333';
            mapCtx.beginPath();
            mapCtx.arc(px, py, 4, 0, Math.PI * 2);
            mapCtx.fill();
        }

        mapCanvas.addEventListener('click', (e) => {
            const rect = mapCanvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            const lon = (clickX / 280) * 360 - 180;
            const lat = 90 - (clickY / 140) * 180;

            updateHumanPosition(lat, lon);
        });

        // Инициализация
        updateHumanPosition(10, 20);

        // --- ПЕРЕКЛЮЧЕНИЕ КАМЕР ---
        function toggleCamera() {
            if (activeCamera === spaceCamera) {
                activeCamera = humanCamera;
                controls.enabled = false;
                document.getElementById('cam-mode').innerText = 'Глазами человека';
            } else {
                activeCamera = spaceCamera;
                controls.enabled = true;
                document.getElementById('cam-mode').innerText = 'Вид из космоса';
            }
        }

        document.getElementById('toggle-cam').addEventListener('click', toggleCamera);
        window.addEventListener('keydown', (e) => { if (e.code === 'KeyC') toggleCamera(); });

        // --- АНИМАЦИЯ ---
        function animate() {
            requestAnimationFrame(animate);

            earthMesh.rotation.y += 0.002;
            handleLookControls();

            if (activeCamera === spaceCamera) controls.update();

            renderer.render(scene, activeCamera);
        }

        animate();

        window.addEventListener('resize', () => {
            spaceCamera.aspect = window.innerWidth / window.innerHeight;
            spaceCamera.updateProjectionMatrix();
            humanCamera.aspect = window.innerWidth / window.innerHeight;
            humanCamera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
