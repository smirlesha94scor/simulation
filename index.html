<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Three.js Симуляция: Вид от первого лица на Солнце и Землю</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 260px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 100;
        }
        .control-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 12px; color: #aaa; }
        input, button { 
            background: #222; 
            color: #fff; 
            border: 1px solid #444; 
            padding: 6px 10px; 
            border-radius: 4px; 
            cursor: pointer;
        }
        input[type="range"] { padding: 0; }
        button:hover { background: #333; }
        .help-text { font-size: 11px; color: #888; margin-top: 5px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="ui">
    <div class="control-group">
        <label>Дата и время симуляции:</label>
        <input type="datetime-local" id="datetime-input">
    </div>

    <div class="control-group">
        <label>Скорость времени: <span id="speed-val">1x</span></label>
        <input type="range" id="time-speed" min="1" max="3" value="1" step="0.1">
    </div>

    <div class="control-group">
        <label>Режим камеры:</label>
        <button id="cam-btn" onclick="toggleCamera()">Камера: Около Земли</button>
        <button onclick="resetCamera()">Сбросить фокус на Землю</button>
    </div>

    <div class="help-text">
        Управление: <b>Стрелки клавиатуры</b> для поворота головы человека (вверх — на Солнце, вниз — на Землю).
    </div>
</div>

<script>
// --- 1. Астрономические константы ---
const SUN_RADIUS = 696340000;           
const EARTH_RADIUS = 6371000;           
const ORBIT_RADIUS = 149597870700;      
const AXIS_TILT = THREE.MathUtils.degToRad(23.44); 

const EPOCH = new Date(Date.UTC(2026, 2, 20, 14, 46, 0)).getTime();

let simDate = new Date(); 
let timeScale = 1; 

// --- 2. Инициализация сцены ---
const scene = new THREE.Scene();

const renderer = new THREE.WebGLRenderer({ 
    antialias: true,
    logarithmicDepthBuffer: true 
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

// --- 3. Загрузка текстур ---
const textureLoader = new THREE.TextureLoader();
const earthMap = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg');
const earthBumpMap = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_normal_2048.jpg');
const earthSpecMap = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_specular_2048.jpg');

const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();
earthMap.anisotropy = maxAnisotropy;
earthBumpMap.anisotropy = maxAnisotropy;
earthSpecMap.anisotropy = maxAnisotropy;

// --- 4. Камеры ---
const aspect = window.innerWidth / window.innerHeight;

const freeCam = new THREE.PerspectiveCamera(45, aspect, 1000, ORBIT_RADIUS * 20);
// Широкий угол обзора (75 градусов) для человеческого зрения
const surfaceCam = new THREE.PerspectiveCamera(75, aspect, 0.1, ORBIT_RADIUS * 20);
let activeCamera = freeCam;

const controls = new THREE.OrbitControls(freeCam, renderer.domElement);
controls.enableDamping = true;
controls.maxDistance = ORBIT_RADIUS * 10;
controls.minDistance = EARTH_RADIUS * 1.2;

// --- 5. Объекты ---

// 5.1 СОЛНЦЕ
const sunMesh = new THREE.Mesh(
    new THREE.SphereGeometry(SUN_RADIUS, 64, 64),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
);
scene.add(sunMesh);

const sunLight = new THREE.PointLight(0xffffff, 3.0, 0, 0);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x111122));

// 5.2 ИЕРАРХИЯ ЗЕМЛИ
const orbitGroup = new THREE.Group();
scene.add(orbitGroup);

const tiltGroup = new THREE.Group();
tiltGroup.position.x = ORBIT_RADIUS; 
tiltGroup.rotation.z = AXIS_TILT;
orbitGroup.add(tiltGroup);

const earthMesh = new THREE.Mesh(
    new THREE.SphereGeometry(EARTH_RADIUS, 128, 128),
    new THREE.MeshPhongMaterial({ 
        map: earthMap,                       
        normalMap: earthBumpMap,             
        normalScale: new THREE.Vector2(0.8, 0.8),
        specularMap: earthSpecMap,           
        specular: new THREE.Color(0x333333),
        shininess: 15
    })
);
tiltGroup.add(earthMesh);

// 5.3 Атмосфера
const atmosphereGeo = new THREE.SphereGeometry(EARTH_RADIUS * 1.015, 64, 64);
const atmosphereMat = new THREE.ShaderMaterial({
    vertexShader: `
        varying vec3 vNormal;
        void main() {
            vNormal = normalize(normalMatrix * normal);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `,
    fragmentShader: `
        varying vec3 vNormal;
        void main() {
            float intensity = pow(0.6 - dot(vNormal, vec3(0, 0, 1.0)), 2.0);
            gl_FragColor = vec4(0.3, 0.6, 1.0, 1.0) * intensity;
        }
    `,
    blending: THREE.AdditiveBlending,
    side: THREE.BackSide,
    transparent: true
});

const atmosphereMesh = new THREE.Mesh(atmosphereGeo, atmosphereMat);
tiltGroup.add(atmosphereMesh);

// Орбита
const orbitCurve = new THREE.EllipseCurve(0, 0, ORBIT_RADIUS, ORBIT_RADIUS);
const points = orbitCurve.getPoints(128);
const orbitGeo = new THREE.BufferGeometry().setFromPoints(
    points.map(p => new THREE.Vector3(p.x, 0, p.y))
);
const orbitMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.15 });
scene.add(new THREE.Line(orbitGeo, orbitMat));

// 5.4 Камера Человека (Стоит на поверхности Земли)
const humanPositionPivot = new THREE.Group();
// Помещаем человека на экватор
humanPositionPivot.position.set(EARTH_RADIUS, 0, 0); 
earthMesh.add(humanPositionPivot);

// Поднимаем камеру на 2 метра над землей
const humanHeadNode = new THREE.Group();
humanHeadNode.position.set(2, 0, 0); 
humanPositionPivot.add(humanHeadNode);
humanHeadNode.add(surfaceCam);

// Углы поворота головы
let humanYaw = 0;   // Поворот влево/вправо
let humanPitch = 0.2; // Легкий наклон вверх (в сторону неба)

function updateHumanLook() {
    // Ограничиваем вертикальный обзор (-80° до +80°)
    humanPitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, humanPitch));

    // Направление взгляда относительно локальных координат человека:
    // X — вверх в космос, Y — восток, Z — север
    const lookTarget = new THREE.Vector3(
        Math.sin(humanPitch),                  // Наклон вверх/вниз относительно поверхности
        Math.cos(humanPitch) * Math.cos(humanYaw), // Поворот горизонтальный
        Math.cos(humanPitch) * Math.sin(humanYaw)
    );

    // Вектор "Верха" человека направлен от центра планеты наружу
    surfaceCam.up.set(1, 0, 0);
    surfaceCam.lookAt(lookTarget.add(surfaceCam.position));
}
updateHumanLook();

// --- 6. Управление стрелками ---
const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

window.addEventListener('keydown', (e) => {
    if (keys.hasOwnProperty(e.code)) {
        keys[e.code] = true;
        e.preventDefault();
    }
});

window.addEventListener('keyup', (e) => {
    if (keys.hasOwnProperty(e.code)) {
        keys[e.code] = false;
        e.preventDefault();
    }
});

function handleCameraRotation(delta) {
    const rotateSpeed = 1.0; 

    if (activeCamera === surfaceCam) {
        if (keys.ArrowLeft)  humanYaw += rotateSpeed * delta;
        if (keys.ArrowRight) humanYaw -= rotateSpeed * delta;
        if (keys.ArrowUp)    humanPitch += rotateSpeed * delta;
        if (keys.ArrowDown)  humanPitch -= rotateSpeed * delta;

        if (keys.ArrowLeft || keys.ArrowRight || keys.ArrowUp || keys.ArrowDown) {
            updateHumanLook();
        }
    } else if (activeCamera === freeCam) {
        if (keys.ArrowLeft)  controls.rotateLeft(rotateSpeed * delta);
        if (keys.ArrowRight) controls.rotateLeft(-rotateSpeed * delta);
        if (keys.ArrowUp)    controls.rotateUp(rotateSpeed * delta);
        if (keys.ArrowDown)  controls.rotateUp(-rotateSpeed * delta);
    }
}

// --- 7. Фокусировка свободной камеры ---
function focusCameraOnEarth() {
    const earthWorldPos = new THREE.Vector3();
    earthMesh.getWorldPosition(earthWorldPos);

    freeCam.position.set(
        earthWorldPos.x + EARTH_RADIUS * 5,
        earthWorldPos.y + EARTH_RADIUS * 2,
        earthWorldPos.z + EARTH_RADIUS * 5
    );
    
    controls.target.copy(earthWorldPos);
    controls.update();
}

function resetCamera() {
    if (activeCamera === freeCam) {
        focusCameraOnEarth();
    }
}

// --- 8. Работа со временем и UI ---
const datetimeInput = document.getElementById('datetime-input');
const speedInput = document.getElementById('time-speed');
const speedVal = document.getElementById('speed-val');

function updateUIFromDate() {
    const local = new Date(simDate.getTime() - simDate.getTimezoneOffset() * 60000);
    datetimeInput.value = local.toISOString().slice(0, 16);
}

datetimeInput.addEventListener('change', (e) => {
    simDate = new Date(e.target.value);
});

speedInput.addEventListener('input', (e) => {
    timeScale = parseFloat(e.target.value);
    speedVal.innerText = `${timeScale}x`;
});

function updatePositionsFromDate(date) {
    const elapsedSeconds = (date.getTime() - EPOCH) / 1000;

    const yearInSeconds = 31556952;
    const orbitAngle = (elapsedSeconds / yearInSeconds) * (Math.PI * 2);
    orbitGroup.rotation.y = orbitAngle;

    const dayInSeconds = 86164.1;
    const dayAngle = (elapsedSeconds / dayInSeconds) * (Math.PI * 2);
    earthMesh.rotation.y = dayAngle;
}

// --- 9. Переключение камер ---
function toggleCamera() {
    const btn = document.getElementById('cam-btn');
    if (activeCamera === freeCam) {
        activeCamera = surfaceCam;
        controls.enabled = false;
        btn.innerText = "Камера: Человек на Земле (2м)";
        updateHumanLook();
    } else {
        activeCamera = freeCam;
        controls.enabled = true;
        btn.innerText = "Камера: Около Земли";
        focusCameraOnEarth();
    }
}

// --- 10. Анимационный цикл ---
const clock = new THREE.Clock();
updateUIFromDate();

updatePositionsFromDate(simDate);
focusCameraOnEarth();

function animate() {
    requestAnimationFrame(animate);

    const delta = clock.getDelta();

    handleCameraRotation(delta);

    if (timeScale > 0) {
        simDate = new Date(simDate.getTime() + (delta * timeScale * 1000));
        updateUIFromDate();
    }

    updatePositionsFromDate(simDate);

    if (activeCamera === freeCam) {
        const earthWorldPos = new THREE.Vector3();
        earthMesh.getWorldPosition(earthWorldPos);
        
        const camOffset = freeCam.position.clone().sub(controls.target);
        controls.target.copy(earthWorldPos);
        freeCam.position.copy(earthWorldPos).add(camOffset);
        
        controls.update();
    }

    renderer.render(scene, activeCamera);
}

window.addEventListener('resize', () => {
    const w = window.innerWidth, h = window.innerHeight;
    freeCam.aspect = w / h; freeCam.updateProjectionMatrix();
    surfaceCam.aspect = w / h; surfaceCam.updateProjectionMatrix();
    renderer.setSize(w, h);
});

animate();
</script>
</body>
</html>
