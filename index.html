<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>3D Doom | Random Exit Maze</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace; }
        #ui { position: absolute; top: 10px; left: 10px; color: #0f0; background: rgba(0,0,0,0.8); padding: 8px; border: 1px solid #0f0; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #f00; font-size: 24px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="ui">Выход в случайной точке лабиринта</div>
    <div id="crosshair">+</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>

    <script>
        // ==========================================
        //  1. ГЕНЕРАТОР ЛАБИРИНТА (DFS)
        // ==========================================
        const GRID_SIZE = 17; // Размер карты

        function generateMaze(size) {
            let grid = Array(size).fill().map(() => Array(size).fill(1));

            function walk(x, y) {
                grid[y][x] = 0;

                const dirs = [
                    [0, -2], [2, 0], [0, 2], [-2, 0]
                ].sort(() => Math.random() - 0.5);

                for (let [dx, dy] of dirs) {
                    const nx = x + dx;
                    const ny = y + dy;

                    if (nx > 0 && nx < size - 1 && ny > 0 && ny < size - 1 && grid[ny][nx] === 1) {
                        grid[y + dy / 2][x + dx / 2] = 0;
                        walk(nx, ny);
                    }
                }
            }

            walk(1, 1);
            return grid;
        }

        const map = generateMaze(GRID_SIZE);
        const UNIT_SIZE = 4;
        const mapWidth = map[0].length;
        const mapHeight = map.length;
        const PLAYER_RADIUS = 0.1;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 100);

        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // ==========================================
        //  2. ТЕКСТУРА КИРПИЧА
        // ==========================================
        function createBrickTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#888888';
            ctx.fillRect(0, 0, 128, 128);

            ctx.fillStyle = '#b83b14';
            const rows = 8, cols = 4;
            const brickH = 128 / rows, brickW = 128 / cols;

            for (let r = 0; r < rows; r++) {
                const offsetX = (r % 2 === 0) ? 0 : brickW / 2;
                for (let c = -1; c < cols + 1; c++) {
                    ctx.fillRect(c * brickW + offsetX + 1, r * brickH + 1, brickW - 2, brickH - 2);
                }
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;
            return texture;
        }

        const brickTexture = createBrickTexture();

        // ==========================================
        //  3. ПОСТРОЕНИЕ ЦЕЛЬНЫХ СТЕН И СЦЕНЫ
        // ==========================================
        const wallMaterial = new THREE.MeshBasicMaterial({ map: brickTexture });
        const floorMaterial = new THREE.MeshBasicMaterial({ color: 0x555555 });
        const ceilingMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const exitMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00 }); // Зеленый блок выходя

        const totalWidth = mapWidth * UNIT_SIZE;
        const totalHeight = mapHeight * UNIT_SIZE;
        const floorGeo = new THREE.PlaneBufferGeometry(totalWidth, totalHeight);

        const floor = new THREE.Mesh(floorGeo, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.position.set(0, -0.01, 0);
        scene.add(floor);

        const ceiling = new THREE.Mesh(floorGeo, ceilingMaterial);
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.set(0, UNIT_SIZE + 0.01, 0);
        scene.add(ceiling);

        // Объединение стен в единый меш
        const geometries = [];
        const baseBoxGeo = new THREE.BoxBufferGeometry(UNIT_SIZE, UNIT_SIZE, UNIT_SIZE);

        for (let r = 0; r < mapHeight; r++) {
            for (let c = 0; c < mapWidth; c++) {
                if (map[r][c] === 1) {
                    const clonedGeo = baseBoxGeo.clone();
                    const x = (c - mapWidth / 2 + 0.5) * UNIT_SIZE;
                    const z = (r - mapHeight / 2 + 0.5) * UNIT_SIZE;
                    clonedGeo.translate(x, UNIT_SIZE / 2, z);
                    geometries.push(clonedGeo);
                }
            }
        }

        const mergedGeometry = THREE.BufferGeometryUtils.mergeBufferGeometries(geometries);
        const mergedWallMesh = new THREE.Mesh(mergedGeometry, wallMaterial);
        scene.add(mergedWallMesh);

        // ==========================================
        //  4. РАНДОМИЗАЦИЯ СТАРТА И ВЫХОДА
        // ==========================================
        // Функция поиска всех пустых клеток (проходов)
        function getEmptyCells() {
            let cells = [];
            for (let r = 1; r < mapHeight - 1; r++) {
                for (let c = 1; c < mapWidth - 1; c++) {
                    if (map[r][c] === 0) {
                        cells.push({ r, c });
                    }
                }
            }
            return cells;
        }

        const emptyCells = getEmptyCells();

        // 1. Игрок ставится в случайную пустую клетку
        const startCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
        const startX = (startCell.c - mapWidth / 2 + 0.5) * UNIT_SIZE;
        const startZ = (startCell.r - mapHeight / 2 + 0.5) * UNIT_SIZE;
        camera.position.set(startX, UNIT_SIZE / 2, startZ);

        // 2. Ищем случайную клетку для ВЫХОДА, которая находится далеко от спавна игрока
        let exitCell;
        let maxDistance = 0;

        // Фильтруем пустые клетки и находим удаленные от точки старта
        for (let cell of emptyCells) {
            const dist = Math.hypot(cell.c - startCell.c, cell.r - startCell.r);
            // Берем клетки на расстоянии больше 5 блоков от игрока
            if (dist > 5 && Math.random() > 0.3) {
                exitCell = cell;
                break;
            }
        }

        // Страховка: если подходящая клетка не выбрана случайным образом, берем самую дальнюю
        if (!exitCell) {
            emptyCells.forEach(cell => {
                const dist = Math.hypot(cell.c - startCell.c, cell.r - startCell.r);
                if (dist > maxDistance) {
                    maxDistance = dist;
                    exitCell = cell;
                }
            });
        }

        const exitX = (exitCell.c - mapWidth / 2 + 0.5) * UNIT_SIZE;
        const exitZ = (exitCell.r - mapHeight / 2 + 0.5) * UNIT_SIZE;

        // Создаем зеленый блок выходя
        const exitMesh = new THREE.Mesh(new THREE.BoxBufferGeometry(UNIT_SIZE, UNIT_SIZE, UNIT_SIZE), exitMaterial);
        exitMesh.position.set(exitX, UNIT_SIZE / 2, exitZ);
        scene.add(exitMesh);

        // ==========================================
        //  5. КОЛЛИЗИЯ И ИГРОВОЙ ЦИКЛ
        // ==========================================
        const HALF_UNIT = UNIT_SIZE / 2;

        function isPointInWall(x, z) {
            for (let r = 0; r < mapHeight; r++) {
                for (let c = 0; c < mapWidth; c++) {
                    if (map[r][c] === 1) {
                        const wallX = (c - mapWidth / 2 + 0.5) * UNIT_SIZE;
                        const wallZ = (r - mapHeight / 2 + 0.5) * UNIT_SIZE;
                        if (
                            x + PLAYER_RADIUS > wallX - HALF_UNIT &&
                            x - PLAYER_RADIUS < wallX + HALF_UNIT &&
                            z + PLAYER_RADIUS > wallZ - HALF_UNIT &&
                            z - PLAYER_RADIUS < wallZ + HALF_UNIT
                        ) return true;
                    }
                }
            }
            return false;
        }

        // Управление
        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
        document.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = true; });
        document.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = false; });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const moveSpeed = 8.0 * delta;
            const turnSpeed = 2.5 * delta;

            if (keys.ArrowLeft) camera.rotation.y += turnSpeed;
            if (keys.ArrowRight) camera.rotation.y -= turnSpeed;

            let moveX = 0;
            let moveZ = 0;

            if (keys.ArrowUp) {
                moveX -= Math.sin(camera.rotation.y) * moveSpeed;
                moveZ -= Math.cos(camera.rotation.y) * moveSpeed;
            }
            if (keys.ArrowDown) {
                moveX += Math.sin(camera.rotation.y) * moveSpeed;
                moveZ += Math.cos(camera.rotation.y) * moveSpeed;
            }

            const newX = camera.position.x + moveX;
            const newZ = camera.position.z + moveZ;

            if (!isPointInWall(newX, camera.position.z)) camera.position.x = newX;
            if (!isPointInWall(camera.position.x, newZ)) camera.position.z = newZ;

            // Проверка достижения зеленой клетки выхода
            const distToExit = Math.hypot(camera.position.x - exitX, camera.position.z - exitZ);
            if (distToExit < 2) {
                alert("Победа! Вы нашли выход из лабиринта!");
                location.reload();
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
