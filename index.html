<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вид от первого лица (Canvas 2D)</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 250px;
            z-index: 100;
        }
        .control-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 12px; color: #aaa; }
        input { 
            background: #222; 
            color: #fff; 
            border: 1px solid #444; 
            padding: 6px 10px; 
            border-radius: 4px; 
        }
        .help-text { font-size: 11px; color: #888; margin-top: 5px; }
    </style>
</head>
<body>

<div id="ui">
    <div class="control-group">
        <label>Дата и время симуляции:</label>
        <input type="datetime-local" id="datetime-input">
    </div>

    <div class="control-group">
        <label>Скорость времени: <span id="speed-val">1x</span></label>
        <input type="range" id="time-speed" min="1" max="5" value="1" step="0.1">
    </div>

    <div class="help-text">
        Управление: <b>Стрелки клавиатуры</b> — осмотр во все стороны (небо/земля).
    </div>
</div>

<canvas id="view"></canvas>

<script>
const canvas = document.getElementById('view');
const ctx = canvas.getContext('2d');

let width, height;
function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Углы поворота головы (в радианах)
let yaw = 0;      // Поворот влево/вправо
let pitch = 0;    // Поворот вверх/вниз

// Обработка клавиш-стрелок
const keys = {};
window.addEventListener('keydown', e => { if (e.code.startsWith('Arrow')) keys[e.code] = true; });
window.addEventListener('keyup', e => { if (e.code.startsWith('Arrow')) keys[e.code] = false; });

// Время
let simDate = new Date();
let timeScale = 1;

const datetimeInput = document.getElementById('datetime-input');
const speedInput = document.getElementById('time-speed');
const speedVal = document.getElementById('speed-val');

function updateUI() {
    const local = new Date(simDate.getTime() - simDate.getTimezoneOffset() * 60000);
    datetimeInput.value = local.toISOString().slice(0, 16);
}
updateUI();

speedInput.addEventListener('input', (e) => {
    timeScale = parseFloat(e.target.value);
    speedVal.innerText = `${timeScale}x`;
});

let lastTime = performance.now();

function draw() {
    const now = performance.now();
    const delta = (now - lastTime) / 1000;
    lastTime = now;

    // Поворот камеры стрелками
    const speed = 1.5;
    if (keys.ArrowLeft)  yaw -= speed * delta;
    if (keys.ArrowRight) yaw += speed * delta;
    if (keys.ArrowUp)    pitch += speed * delta;
    if (keys.ArrowDown)  pitch -= speed * delta;

    // Ограничение наклона вверх/вниз (90 градусов)
    pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));

    // Симуляция времени
    simDate = new Date(simDate.getTime() + delta * timeScale * 1000);
    updateUI();

    // Расчет линии горизонта от угла наклона pitch
    const horizonY = height / 2 + Math.tan(pitch) * (height / 2);

    // 1. Отрисовка Синего Неба
    const skyGrad = ctx.createLinearGradient(0, 0, 0, Math.max(0, horizonY));
    skyGrad.addColorStop(0, '#1a5276');
    skyGrad.addColorStop(1, '#5adeff');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, width, Math.max(0, horizonY));

    // 2. Отрисовка Земли (внизу)
    if (horizonY < height) {
        const groundGrad = ctx.createLinearGradient(0, Math.max(0, horizonY), 0, height);
        groundGrad.addColorStop(0, '#2d5a27');
        groundGrad.addColorStop(1, '#153311');
        ctx.fillStyle = groundGrad;
        ctx.fillRect(0, Math.max(0, horizonY), width, height - horizonY);
    }

    // 3. Линия горизонта и ориентиры при повороте (360 градусов)
    ctx.save();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, horizonY);
    ctx.lineTo(width, horizonY);
    ctx.stroke();

    // Метки сторон света для наглядности вращения
    const fov = Math.PI / 3; // Поле зрения ~60 градусов
    const directions = [
        { label: 'СЕВЕР', angle: 0 },
        { label: 'ВОСТОК', angle: Math.PI / 2 },
        { label: 'ЮГ', angle: Math.PI },
        { label: 'ЗАПАД', angle: -Math.PI / 2 }
    ];

    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';

    directions.forEach(dir => {
        let diff = dir.angle - yaw;
        // Нормализация угла в пределы [-PI, PI]
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;

        if (Math.abs(diff) < fov / 2) {
            const x = width / 2 + (diff / (fov / 2)) * (width / 2);
            ctx.fillText(dir.label, x, horizonY - 15);
            ctx.fillRect(x - 2, horizonY - 10, 4, 10);
        }
    });

    ctx.restore();

    requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
