<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Three.js Симуляция: Выбор времени и даты</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 250px;
        }
        .control-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 12px; color: #ccc; }
        input, button { 
            background: #222; 
            color: #fff; 
            border: 1px solid #444; 
            padding: 6px 10px; 
            border-radius: 4px; 
            cursor: pointer;
        }
        input[type="range"] { padding: 0; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="ui">
    <div class="control-group">
        <label>Дата и время симуляции:</label>
        <input type="datetime-local" id="datetime-input">
    </div>

    <div class="control-group">
        <label>Скорость времени: <span id="speed-val">1x</span></label>
        <input type="range" id="time-speed" min="0" max="1000000" value="100000" step="1000">
    </div>

    <div class="control-group">
        <label>Режим камеры:</label>
        <button id="cam-btn" onclick="toggleCamera()">Камера: Свободная</button>
    </div>
</div>

<script>
// --- 1. Реальные астрономические константы (в метрах) ---
const SUN_RADIUS = 696340000;           
const EARTH_RADIUS = 6371000;           
const ORBIT_RADIUS = 149597870700;      
const AXIS_TILT = THREE.MathUtils.degToRad(23.44); 

// Точка отсчета: Весеннее равноденствие 2026 года (20 марта ~14:46 UTC)
// В этот момент Земля пересекает нулевую точку орбиты
const EPOCH = new Date(Date.UTC(2026, 2, 20, 14, 46, 0)).getTime();

let simDate = new Date(); // Текущее время симуляции
let timeScale = 100000;   // Множитель скорости прокрутки времени

// --- 2. Инициализация сцены ---
const scene = new THREE.Scene();

const renderer = new THREE.WebGLRenderer({ 
    antialias: true,
    logarithmicDepthBuffer: true 
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

// --- 3. Камеры ---
const aspect = window.innerWidth / window.innerHeight;

const freeCam = new THREE.PerspectiveCamera(45, aspect, 10, ORBIT_RADIUS * 10);
freeCam.position.set(0, ORBIT_RADIUS * 0.5, ORBIT_RADIUS * 1.5);

const surfaceCam = new THREE.PerspectiveCamera(60, aspect, 0.1, ORBIT_RADIUS * 10);
let activeCamera = freeCam;

const controls = new THREE.OrbitControls(freeCam, renderer.domElement);
controls.enableDamping = true;

// --- 4. Объекты ---
// 4.1 Солнце
const sunMesh = new THREE.Mesh(
    new THREE.SphereGeometry(SUN_RADIUS, 64, 64),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
);
scene.add(sunMesh);

const sunLight = new THREE.PointLight(0xffffff, 2.0, 0, 0);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x111122));

// 4.2 Иерархия Земли
const orbitGroup = new THREE.Group();
scene.add(orbitGroup);

const tiltGroup = new THREE.Group();
tiltGroup.position.x = ORBIT_RADIUS; 
tiltGroup.rotation.z = AXIS_TILT;
orbitGroup.add(tiltGroup);

const earthMesh = new THREE.Mesh(
    new THREE.SphereGeometry(EARTH_RADIUS, 64, 64),
    new THREE.MeshStandardMaterial({ color: 0x2233ff, roughness: 0.6 })
);
tiltGroup.add(earthMesh);

// 4.3 Камера на поверхности (2 метра)
const surfaceCamHolder = new THREE.Group();
surfaceCamHolder.position.set(0, EARTH_RADIUS + 2, 0); 
earthMesh.add(surfaceCamHolder);
surfaceCamHolder.add(surfaceCam);
surfaceCam.lookAt(surfaceCamHolder.position.x + 100, surfaceCamHolder.position.y, surfaceCamHolder.position.z);

// --- 5. Связка времени с физикой ---
const datetimeInput = document.getElementById('datetime-input');
const speedInput = document.getElementById('time-speed');
const speedVal = document.getElementById('speed-val');

// Инициализация поля ввода текущей датой
function updateUIFromDate() {
    // Приводим дату к формату YYYY-MM-THH:mm для HTML input
    const local = new Date(simDate.getTime() - simDate.getTimezoneOffset() * 60000);
    datetimeInput.value = local.toISOString().slice(0, 16);
}

// При изменении пользователем даты вручную:
datetimeInput.addEventListener('change', (e) => {
    simDate = new Date(e.target.value);
});

// Управление скоростью
speedInput.addEventListener('input', (e) => {
    timeScale = parseFloat(e.target.value);
    speedVal.innerText = `${timeScale.toLocaleString()}x`;
});

// Функция обновления поворотов Земли на основе объекта Date
function updatePositionsFromDate(date) {
    const elapsedSeconds = (date.getTime() - EPOCH) / 1000;

    // 1. Угол орбиты (1 оборот = 365.2425 дней)
    const yearInSeconds = 31556952;
    const orbitAngle = (elapsedSeconds / yearInSeconds) * (Math.PI * 2);
    orbitGroup.rotation.y = orbitAngle;

    // 2. Угол вращения вокруг своей оси (1 оборот = 86164.1 сек — сидерические сутки)
    const dayInSeconds = 86164.1;
    const dayAngle = (elapsedSeconds / dayInSeconds) * (Math.PI * 2);
    earthMesh.rotation.y = dayAngle;
}

// --- 6. Переключение камер ---
function toggleCamera() {
    const btn = document.getElementById('cam-btn');
    if (activeCamera === freeCam) {
        activeCamera = surfaceCam;
        controls.enabled = false;
        btn.innerText = "Камера: Поверхность (2м)";
    } else {
        activeCamera = freeCam;
        controls.enabled = true;
        btn.innerText = "Камера: Свободная";
    }
}

// --- 7. Анимационный цикл ---
const clock = new THREE.Clock();
updateUIFromDate();

function animate() {
    requestAnimationFrame(animate);

    const delta = clock.getDelta();

    // Если время идет (скорость > 0), продвигаем simDate вперед
    if (timeScale > 0) {
        simDate = new Date(simDate.getTime() + (delta * timeScale * 1000));
        updateUIFromDate();
    }

    // Рассчитываем физические углы на основе симулируемого времени
    updatePositionsFromDate(simDate);

    if (activeCamera === freeCam) {
        controls.update();
    }

    renderer.render(scene, activeCamera);
}

window.addEventListener('resize', () => {
    const w = window.innerWidth, h = window.innerHeight;
    freeCam.aspect = w / h; freeCam.updateProjectionMatrix();
    surfaceCam.aspect = w / h; surfaceCam.updateProjectionMatrix();
    renderer.setSize(w, h);
});

animate();
</script>
</body>
</html>
