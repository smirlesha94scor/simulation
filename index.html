<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Солнце и Земля - Фиксированная орбита</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-family: sans-serif;
            font-size: 13px;
            background: rgba(0, 0, 0, 0.75);
            padding: 12px;
            border-radius: 6px;
        }
        button {
            background: #2b5278;
            color: white;
            border: none;
            padding: 6px 12px;
            margin-top: 6px;
            margin-right: 4px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #3b6e9e; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="ui">
        <div id="cam-info">Режим: <b>Вид из космоса</b></div>
        <div id="orbit-info">Орбита: <b>Зафиксирована</b></div>
        <button id="toggle-cam">Переключить камеру (C)</button>
        <button id="toggle-orbit">Старт/Стоп орбита (Пробел)</button>
    </div>

    <script>
        const scene = new THREE.Scene();
        
        // --- 1. КАМЕРЫ ---
        const spaceCamera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        spaceCamera.position.set(0, 25, 45);

        const humanCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.0001, 1000);
        let activeCamera = spaceCamera;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(spaceCamera, renderer.domElement);
        controls.enableDamping = true;

        // --- 2. ТЕКСТУРЫ И СОЛНЦЕ ---
        function createSunTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(256, 256, 0, 256, 256, 256);
            grad.addColorStop(0, '#fff7d0');
            grad.addColorStop(0.2, '#ffae00');
            grad.addColorStop(1, '#ff3300');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 512, 512);
            return new THREE.CanvasTexture(canvas);
        }

        function createEarthTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#1a3b5c';
            ctx.fillRect(0, 0, 1024, 512);
            ctx.fillStyle = '#2d6a4f';
            for (let i = 0; i < 80; i++) {
                ctx.beginPath();
                ctx.arc(Math.random() * 1024, Math.random() * 512, 20 + Math.random() * 60, 0, Math.PI * 2);
                ctx.fill();
            }
            return new THREE.CanvasTexture(canvas);
        }

        const sunMesh = new THREE.Mesh(
            new THREE.SphereGeometry(1.8, 32, 32),
            new THREE.MeshBasicMaterial({ map: createSunTexture() })
        );
        scene.add(sunMesh);

        const sunLight = new THREE.DirectionalLight(0xffffff, 2.0);
        scene.add(sunLight);
        scene.add(new THREE.AmbientLight(0x111122, 0.15));

        // --- 3. ЗЕМЛЯ И ПОЗИЦИОНИРОВАНИЕ ---
        const earthPositionGroup = new THREE.Group();
        scene.add(earthPositionGroup);

        const earthTiltGroup = new THREE.Group();
        earthTiltGroup.rotation.z = THREE.MathUtils.degToRad(23.44);
        earthPositionGroup.add(earthTiltGroup);

        const R_eq = 1.0;
        const R_pol = 0.9966;
        const earthGeo = new THREE.SphereGeometry(R_eq, 64, 64);
        const earthMat = new THREE.MeshStandardMaterial({ map: createEarthTexture(), roughness: 0.7 });
        const earthMesh = new THREE.Mesh(earthGeo, earthMat);
        earthMesh.scale.set(1, R_pol, 1);
        earthTiltGroup.add(earthMesh);

        // Настройка камеры на поверхности
        const humanHeight = 0.0005; 
        humanCamera.position.set(R_eq + humanHeight, 0, 0);
        humanCamera.up.set(1, 0, 0);
        humanCamera.lookAt(R_eq + humanHeight, 0, 1);
        earthMesh.add(humanCamera);

        // --- 4. ОРБИТА ---
        const a = 18.0, e = 0.0167, b = a * Math.sqrt(1 - e * e), c = a * e;
        sunMesh.position.set(-c, 0, 0);

        // Задаем начальное фиксированное положение на орбите
        let orbitAngle = 0;
        earthPositionGroup.position.set(a * Math.cos(orbitAngle) - c, 0, b * Math.sin(orbitAngle));

        const starsGeo = new THREE.BufferGeometry();
        const starCoords = [];
        for (let i = 0; i < 2000; i++) {
            starCoords.push((Math.random() - 0.5) * 400, (Math.random() - 0.5) * 400, (Math.random() - 0.5) * 400);
        }
        starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(starCoords, 3));
        scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.5 })));

        // --- 5. ФЛАГ СОСТОЯНИЯ ОРБИТЫ И УПРАВЛЕНИЕ ---
        let isOrbitMoving = false; // По умолчанию орбита зафиксирована

        function toggleOrbit() {
            isOrbitMoving = !isOrbitMoving;
            document.getElementById('orbit-info').innerHTML = 
                `Орбита: <b>${isOrbitMoving ? 'В движении' : 'Зафиксирована'}</b>`;
        }

        function toggleCamera() {
            if (activeCamera === spaceCamera) {
                activeCamera = humanCamera;
                controls.enabled = false;
                document.getElementById('cam-info').innerHTML = 'Режим: <b>Глазами человека на Земле</b>';
            } else {
                activeCamera = spaceCamera;
                controls.enabled = true;
                document.getElementById('cam-info').innerHTML = 'Режим: <b>Вид из космоса</b>';
            }
        }

        document.getElementById('toggle-cam').addEventListener('click', toggleCamera);
        document.getElementById('toggle-orbit').addEventListener('click', toggleOrbit);
        
        window.addEventListener('keydown', (e) => { 
            if (e.code === 'KeyC') toggleCamera(); 
            if (e.code === 'Space') toggleOrbit();
        });

        // --- 6. АНИМАЦИЯ ---
        function animate() {
            requestAnimationFrame(animate);

            // Движение по орбите происходит только при включенном флаге
            if (isOrbitMoving) {
                orbitAngle += 0.0015;
                earthPositionGroup.position.set(a * Math.cos(orbitAngle) - c, 0, b * Math.sin(orbitAngle));
            }

            // Суточное вращение Земли продолжается всегда
            earthMesh.rotation.y += 0.005;

            // Направление света от Солнца к Земле
            sunLight.position.copy(sunMesh.position);
            sunLight.target = earthMesh;

            if (activeCamera === spaceCamera) {
                controls.update();
            }

            renderer.render(scene, activeCamera);
        }

        animate();

        window.addEventListener('resize', () => {
            spaceCamera.aspect = window.innerWidth / window.innerHeight;
            spaceCamera.updateProjectionMatrix();
            humanCamera.aspect = window.innerWidth / window.innerHeight;
            humanCamera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
