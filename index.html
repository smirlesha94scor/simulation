<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Земля — Гладкий горизонт и Компас</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #ui {
            position: absolute; top: 10px; left: 10px; color: #fff;
            font-family: sans-serif; font-size: 13px;
            background: rgba(0, 0, 0, 0.75); padding: 10px 14px; border-radius: 6px;
        }
        button {
            background: #2b5278; color: white; border: none;
            padding: 6px 10px; margin-top: 8px; border-radius: 4px; cursor: pointer;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="ui">
        Режим: <b id="cam-mode">Вид из космоса</b><br>
        <button id="toggle-cam">Переключить вид (C)</button>
    </div>

    <script>
        const scene = new THREE.Scene();

        const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- МАСШТАБЫ ---
        const R_eq = 10.0;
        const R_pol = 9.9664;
        const humanHeight = 0.000003135; // 2 метра в масштабе R_eq = 10

        // --- КАМЕРЫ ---
        const spaceCamera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        spaceCamera.position.set(0, 15, 30);

        const humanCamera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.0000001, 1000);
        
        let activeCamera = spaceCamera;
        const controls = new THREE.OrbitControls(spaceCamera, renderer.domElement);
        controls.enableDamping = true;

        // --- ОСВЕЩЕНИЕ И СОЛНЦЕ ---
        const sunMesh = new THREE.Mesh(
            new THREE.SphereGeometry(2.0, 32, 32),
            new THREE.MeshBasicMaterial({ color: 0xffaa00 })
        );
        sunMesh.position.set(-40, 0, 0);
        scene.add(sunMesh);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.8);
        scene.add(sunLight);
        scene.add(new THREE.AmbientLight(0x111122, 0.2));

        // --- ЗЕМЛЯ С ВЫСОКОЙ ДЕТАЛИЗАЦИЕЙ (256x256 для идеального горизонта) ---
        const earthPositionGroup = new THREE.Group();
        scene.add(earthPositionGroup);

        const earthTiltGroup = new THREE.Group();
        earthTiltGroup.rotation.z = THREE.MathUtils.degToRad(23.44);
        earthPositionGroup.add(earthTiltGroup);

        // Увеличено число сегментов с 64 до 256
        const earthGeo = new THREE.SphereGeometry(R_eq, 256, 256);
        const earthMat = new THREE.MeshStandardMaterial({ roughness: 0.8, color: 0x1d3557 });
        const earthMesh = new THREE.Mesh(earthGeo, earthMat);
        
        earthMesh.scale.set(1, R_pol / R_eq, 1);
        earthTiltGroup.add(earthMesh);

        // --- ПОЗИЦИОНИРОВАНИЕ КАМЕРЫ ---
        humanCamera.position.set(R_eq + humanHeight, 0, 0);
        humanCamera.up.set(1, 0, 0); // Зенит
        humanCamera.lookAt(R_eq + humanHeight, 0, 10); // Взгляд на Восток/Горизонт
        earthMesh.add(humanCamera);

        // --- ФУНКЦИЯ СОЗДАНИЯ 3D-ТЕКСТА СТОРУН СВЕТА ---
        function createCompassLabel(text, color) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = color;
            ctx.font = 'Bold 120px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 128, 128);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, depthTest: false });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(0.005, 0.005, 1); // Маленький размер на горизонте
            return sprite;
        }

        // РАСТАВЛЯЕМ СТОРУНЫ СВЕТА (Светятся на горизонте)
        const dist = 0.1; // Дистанция меток от человека

        const north = createCompassLabel('С (N)', '#ff3333');
        north.position.set(R_eq + humanHeight, dist, 0); // Север (вдоль локальной оси Y)
        earthMesh.add(north);

        const south = createCompassLabel('Ю (S)', '#3388ff');
        south.position.set(R_eq + humanHeight, -dist, 0); // Юг
        earthMesh.add(south);

        const east = createCompassLabel('В (E)', '#33ff33');
        east.position.set(R_eq + humanHeight, 0, dist); // Восток (вдоль локальной оси Z)
        earthMesh.add(east);

        const west = createCompassLabel('З (W)', '#ffff33');
        west.position.set(R_eq + humanHeight, 0, -dist); // Запад
        earthMesh.add(west);

        // --- УПРАВЛЕНИЕ КАМЕРАМИ ---
        function toggleCamera() {
            if (activeCamera === spaceCamera) {
                activeCamera = humanCamera;
                controls.enabled = false;
                document.getElementById('cam-mode').innerText = 'Глазами человека (2м от Земли)';
            } else {
                activeCamera = spaceCamera;
                controls.enabled = true;
                document.getElementById('cam-mode').innerText = 'Вид из космоса';
            }
        }

        document.getElementById('toggle-cam').addEventListener('click', toggleCamera);
        window.addEventListener('keydown', (e) => { if (e.code === 'KeyC') toggleCamera(); });

        // --- АНИМАЦИЯ ---
        function animate() {
            requestAnimationFrame(animate);

            earthMesh.rotation.y += 0.003;

            sunLight.position.copy(sunMesh.position);
            sunLight.target = earthMesh;

            if (activeCamera === spaceCamera) controls.update();

            renderer.render(scene, activeCamera);
        }

        animate();

        window.addEventListener('resize', () => {
            spaceCamera.aspect = window.innerWidth / window.innerHeight;
            spaceCamera.updateProjectionMatrix();
            humanCamera.aspect = window.innerWidth / window.innerHeight;
            humanCamera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
