<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мои серии просмотров Twitch</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0e0e10; color: #efeff1; }
    .twitch-purple { color: #a970ff; }
    .bg-twitch-card { background-color: #18181b; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-4xl mx-auto">
    <!-- Шапка -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 border-b border-gray-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold flex items-center gap-2">
          <span class="twitch-purple">🟣</span> Серии просмотров Twitch
        </h1>
        <div class="flex items-center gap-3 mt-1 text-xs text-gray-400">
          <p id="last-update">Загрузка данных...</p>
          <span>•</span>
          <p id="timer">Следующее обновление через: 10:00</p>
        </div>
      </div>
    </header>

    <!-- Сетка каналов -->
    <div id="channels-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Карточки каналов -->
    </div>
  </div>

  <script>
    let nextUpdateSeconds = 600;

    async function loadData() {
      try {
        const res = await fetch('data.json?t=' + new Date().getTime());
        const data = await res.json();
        
        document.getElementById('last-update').innerText = `Обновлено: ${data.updatedAt || 'неизвестно'}`;
        render(data.channels || []);
        nextUpdateSeconds = 600;
      } catch (e) {
        document.getElementById('last-update').innerText = 'Данные еще не собраны или произошла ошибка.';
      }
    }

    function render(channels) {
      const grid = document.getElementById('channels-grid');
      grid.innerHTML = '';

      if (channels.length === 0) {
        grid.innerHTML = '<p class="col-span-full text-gray-500 text-center py-8">Сейчас нет отслеживаемых каналов в эфире</p>';
        return;
      }

      channels.forEach(c => {
        const card = document.createElement('div');
        card.className = "bg-twitch-card border border-gray-800 rounded-lg p-4 flex flex-col justify-between hover:border-purple-500 transition";

        card.innerHTML = `
          <div class="flex justify-between items-center mb-3">
            <a href="https://twitch.tv/${c.username}" target="_blank" class="font-bold text-lg hover:underline text-white">
              ${c.name}
            </a>
            <span class="bg-red-600 text-white text-xs px-2 py-0.5 rounded font-bold uppercase animate-pulse">Live</span>
          </div>

          <div class="bg-gray-900 border border-gray-800/80 rounded-md p-3 mt-2">
            <div class="flex items-center justify-between text-sm">
              <span class="text-gray-400 flex items-center gap-1.5">
                <span>🪙</span> Ваша серия просмотров:
              </span>
              <span class="font-bold text-amber-400 text-base">
                🔥 ${c.streak}
              </span>
            </div>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // Таймер обратного отсчета
    setInterval(() => {
      if (nextUpdateSeconds > 0) {
        nextUpdateSeconds--;
        const mins = Math.floor(nextUpdateSeconds / 60);
        const secs = nextUpdateSeconds % 60;
        document.getElementById('timer').innerText = `Следующее обновление через: ${mins}:${secs < 10 ? '0' : ''}${secs}`;
      } else {
        loadData();
      }
    }, 1000);

    loadData();
  </script>
</body>
</html>
