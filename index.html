<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Простой SVG Редактор Схем</title>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; background: #f0f0f0; }
        #sidebar { width: 320px; background: #fff; border-right: 1px solid #ccc; padding: 15px; display: flex; flex-direction: column; gap: 15px; box-sizing: border-box; overflow-y: auto; }
        #canvas-container { flex-grow: 1; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; background: #e5e5e5; }
        svg { background: #fff; box-shadow: 0 0 10px rgba(0,0,0,0.1); cursor: crosshair; }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 14px; font-weight: bold; color: #333; }
        input, select, button { padding: 8px; font-size: 14px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background: #0056b3; }
        button.secondary { background: #6c757d; }
        button.secondary:hover { background: #5a6268; }
        textarea { width: 100%; height: 150px; font-family: monospace; font-size: 12px; resize: vertical; }
        #bg-image { pointer-events: none; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h3>SVG Редактор схем</h3>
        
        <div class="control-group">
            <label>1. Загрузить подложку (картинку):</label>
            <input type="file" id="imageLoader" accept="image/*">
            <label>Прозрачность подложки: <span id="opacityVal">0.5</span></label>
            <input type="range" id="opacityRange" min="0" max="1" step="0.05" value="0.5">
        </div>

        <hr style="width:100%; border:0; border-top:1px solid #ddd;">

        <div class="control-group">
            <label>2. Инструмент рисования:</label>
            <select id="toolSelect">
                <option value="line">Линия</option>
                <option value="rect">Прямоугольник (компонент)</option>
                <option value="circle">Точка соединения (узел)</option>
                <option value="text">Текст (надпись)</option>
            </select>
        </div>

        <div class="control-group" id="textSettings" style="display:none;">
            <label>Текст надписи:</label>
            <input type="text" id="textContent" value="R1">
        </div>

        <div class="control-group">
            <label>Толщина линий:</label>
            <input type="number" id="strokeWidth" value="3" min="1" max="10">
        </div>

        <div style="display: flex; gap: 10px;">
            <button class="secondary" id="undoBtn" style="flex:1;">Отменить</button>
            <button class="secondary" id="clearBtn" style="flex:1;">Очистить</button>
        </div>

        <hr style="width:100%; border:0; border-top:1px solid #ddd;">

        <div class="control-group">
            <label>Готовый SVG код:</label>
            <textarea id="svgCodeOutput" readonly></textarea>
            <button id="copyBtn">Скопировать код</button>
        </div>
    </div>

    <div id="canvas-container">
        <svg id="drawingCanvas" width="850" height="650" viewBox="0 0 850 650">
            <image id="bg-image" href="" width="850" height="650" opacity="0.5" preserveAspectRatio="none" />
            <g id="elementsGroup"></g>
        </svg>
    </div>

    <script>
        const imageLoader = document.getElementById('imageLoader');
        const bgImage = document.getElementById('bg-image');
        const opacityRange = document.getElementById('opacityRange');
        const opacityVal = document.getElementById('opacityVal');
        const canvas = document.getElementById('drawingCanvas');
        const elementsGroup = document.getElementById('elementsGroup');
        const toolSelect = document.getElementById('toolSelect');
        const textSettings = document.getElementById('textSettings');
        const textContentInput = document.getElementById('textContent');
        const strokeWidthInput = document.getElementById('strokeWidth');
        const undoBtn = document.getElementById('undoBtn');
        const clearBtn = document.getElementById('clearBtn');
        const svgCodeOutput = document.getElementById('svgCodeOutput');
        const copyBtn = document.getElementById('copyBtn');

        let isDrawing = false;
        let startX, startY;
        let actionHistory = [];

        // Управление видимостью настроек текста
        toolSelect.addEventListener('change', (e) => {
            textSettings.style.display = e.target.value === 'text' ? 'flex' : 'none';
        });

        // Загрузка подложки
        imageLoader.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    bgImage.setAttribute('href', event.target.result);
                }
                reader.readAsDataURL(file);
            }
        });

        // Изменение прозрачности подложки
        opacityRange.addEventListener('input', (e) => {
            const val = e.target.value;
            bgImage.setAttribute('opacity', val);
            opacityVal.textContent = val;
        });

        // Получение координат клика внутри SVG с учетом масштаба
        function getSVGPoint(evt) {
            const pt = canvas.createSVGPoint();
            pt.x = evt.clientX;
            pt.y = evt.clientY;
            return pt.matrixTransform(canvas.getScreenCTM().inverse());
        }

        // Начало рисования
        canvas.addEventListener('mousedown', (e) => {
            const pt = getSVGPoint(e);
            isDrawing = true;
            startX = Math.round(pt.x);
            startY = Math.round(pt.y);
        });

        // Конец рисования / создание элементов
        canvas.addEventListener('mouseup', (e) => {
            if (!isDrawing) return;
            isDrawing = false;
            const pt = getSVGPoint(e);
            const endX = Math.round(pt.x);
            const endY = Math.round(pt.y);

            const tool = toolSelect.value;
            const sw = strokeWidthInput.value;
            let newElement = null;

            if (tool === 'line') {
                if (Math.abs(endX - startX) < 2 && Math.abs(endY - startY) < 2) return; // случайный клик
                newElement = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                newElement.setAttribute('x1', startX);
                newElement.setAttribute('y1', startY);
                newElement.setAttribute('x2', endX);
                newElement.setAttribute('y2', endY);
                newElement.setAttribute('stroke', '#000');
                newElement.setAttribute('stroke-width', sw);
                newElement.setAttribute('stroke-linecap', 'square');
            } else if (tool === 'rect') {
                const x = Math.min(startX, endX);
                const y = Math.min(startY, endY);
                const w = Math.abs(endX - startX) || 40;
                const h = Math.abs(endY - startY) || 20;
                newElement = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                newElement.setAttribute('x', x);
                newElement.setAttribute('y', y);
                newElement.setAttribute('width', w);
                newElement.setAttribute('height', h);
                newElement.setAttribute('stroke', '#000');
                newElement.setAttribute('stroke-width', sw);
                newElement.setAttribute('fill', 'none');
            } else if (tool === 'circle') {
                newElement = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                newElement.setAttribute('cx', startX);
                newElement.setAttribute('cy', startY);
                newElement.setAttribute('r', 4);
                newElement.setAttribute('fill', '#000');
            } else if (tool === 'text') {
                newElement = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                newElement.setAttribute('x', startX);
                newElement.setAttribute('y', startY);
                newElement.setAttribute('fill', '#000');
                newElement.setAttribute('font-family', 'monospace');
                newElement.setAttribute('font-size', '16');
                newElement.setAttribute('font-weight', 'bold');
                newElement.textContent = textContentInput.value;
            }

            if (newElement) {
                elementsGroup.appendChild(newElement);
                actionHistory.push(newElement);
                updateOutputCode();
            }
        });

        // Кнопка Отменить
        undoBtn.addEventListener('click', () => {
            if (actionHistory.length > 0) {
                const el = actionHistory.pop();
                el.remove();
                updateOutputCode();
            }
        });

        // Кнопка Очистить
        clearBtn.addEventListener('click', () => {
            if (confirm('Очистить все нарисованные элементы?')) {
                elementsGroup.innerHTML = '';
                actionHistory = [];
                updateOutputCode();
            }
        });

        // Генерация и обновление текста SVG кода
        function updateOutputCode() {
            // Создаем чистый клон svg без подложки для кода
            const svgClone = canvas.cloneNode(true);
            const bgInClone = svgClone.querySelector('#bg-image');
            if (bgInClone) bgInClone.remove(); // удаляем картинку-подложку из итогового кода
            
            svgCodeOutput.value = svgClone.outerHTML;
        }

        // Копирование в буфер
        copyBtn.addEventListener('click', () => {
            svgCodeOutput.select();
            document.execCommand('copy');
            alert('SVG код скопирован в буфер обмена!');
        });

        // Первичная инициализация кода
        updateOutputCode();
    </script>
</body>
</html>
