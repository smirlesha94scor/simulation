<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Земля R_eq = 10 units</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #ui {
            position: absolute; top: 10px; left: 10px; color: #fff;
            font-family: sans-serif; font-size: 13px;
            background: rgba(0, 0, 0, 0.75); padding: 10px 14px; border-radius: 6px;
        }
        button {
            background: #2b5278; color: white; border: none;
            padding: 6px 10px; margin-top: 8px; border-radius: 4px; cursor: pointer;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="ui">
        Режим: <b id="cam-mode">Вид из космоса</b><br>
        <button id="toggle-cam">Переключить вид (C)</button>
    </div>

    <script>
        const scene = new THREE.Scene();

        // 1. ВКЛЮЧАЕМ logarithmicDepthBuffer ДЛЯ РАБОТЫ С МИКРО-РАССТОЯНИЯМИ
        const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- МАСШТАБЫ И ЗЕМЛЯ ---
        const R_eq = 10.0;          // Экваториальный радиус = 10 units
        const R_pol = 9.9664;        // Полярный радиус (физическая пропорция)
        const humanHeight = 0.000003135; // 2 метра в масштабе R_eq = 10

        // --- КАМЕРЫ ---
        const spaceCamera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        spaceCamera.position.set(0, 15, 30); // Соразмерный вид космоса для R = 10

        const humanCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.0000001, 1000);
        
        let activeCamera = spaceCamera;
        const controls = new THREE.OrbitControls(spaceCamera, renderer.domElement);
        controls.enableDamping = true;

        // --- ОСВЕЩЕНИЕ И СОЛНЦЕ ---
        const sunMesh = new THREE.Mesh(
            new THREE.SphereGeometry(2.0, 32, 32),
            new THREE.MeshBasicMaterial({ color: 0xffaa00 })
        );
        sunMesh.position.set(-40, 0, 0);
        scene.add(sunMesh);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.8);
        scene.add(sunLight);
        scene.add(new THREE.AmbientLight(0x111122, 0.2));

        // --- ЗЕМЛЯ ---
        const earthPositionGroup = new THREE.Group();
        scene.add(earthPositionGroup);

        const earthTiltGroup = new THREE.Group();
        earthTiltGroup.rotation.z = THREE.MathUtils.degToRad(23.44); // Наклон оси 23.44°
        earthPositionGroup.add(earthTiltGroup);

        // Создаем сферу радиусом 10 units
        const earthGeo = new THREE.SphereGeometry(R_eq, 64, 64);
        const earthMat = new THREE.MeshStandardMaterial({ roughness: 0.8, color: 0x223366 });
        const earthMesh = new THREE.Mesh(earthGeo, earthMat);
        
        // Применяем геоидальную сплюснутость по оси Y
        earthMesh.scale.set(1, R_pol / R_eq, 1);
        earthTiltGroup.add(earthMesh);

        // --- ПОЗИЦИОНИРОВАНИЕ ЧЕЛОВЕКА СТРОГО НА 2 МЕТРАХ НАД ЗЕМЛЕЙ ---
        humanCamera.position.set(R_eq + humanHeight, 0, 0);
        humanCamera.up.set(1, 0, 0); // Зенит (верх) смотрит в космос от центра Земли
        humanCamera.lookAt(R_eq + humanHeight, 0, 10); // Взгляд строго на горизонт
        earthMesh.add(humanCamera); // Привязка к вращению планеты

        // --- УПРАВЛЕНИЕ КАМЕРАМИ ---
        function toggleCamera() {
            if (activeCamera === spaceCamera) {
                activeCamera = humanCamera;
                controls.enabled = false;
                document.getElementById('cam-mode').innerText = 'Глазами человека (2м от Земли)';
            } else {
                activeCamera = spaceCamera;
                controls.enabled = true;
                document.getElementById('cam-mode').innerText = 'Вид из космоса';
            }
        }

        document.getElementById('toggle-cam').addEventListener('click', toggleCamera);
        window.addEventListener('keydown', (e) => { if (e.code === 'KeyC') toggleCamera(); });

        // --- АНИМАЦИЯ ---
        function animate() {
            requestAnimationFrame(animate);

            // Суточное вращение вокруг оси (против часовой стрелки, если смотреть с Северного полюса)
            earthMesh.rotation.y += 0.005;

            // Направление света
            sunLight.position.copy(sunMesh.position);
            sunLight.target = earthMesh;

            if (activeCamera === spaceCamera) controls.update();

            renderer.render(scene, activeCamera);
        }

        animate();

        window.addEventListener('resize', () => {
            spaceCamera.aspect = window.innerWidth / window.innerHeight;
            spaceCamera.updateProjectionMatrix();
            humanCamera.aspect = window.innerWidth / window.innerHeight;
            humanCamera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
