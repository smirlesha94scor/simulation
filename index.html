<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Three.js: Реальный масштаб Земли (Вид 2м)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 260px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 100;
        }
        .control-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 12px; color: #aaa; }
        input, button { 
            background: #222; 
            color: #fff; 
            border: 1px solid #444; 
            padding: 6px 10px; 
            border-radius: 4px; 
            cursor: pointer;
        }
        input[type="range"] { padding: 0; }
        button:hover { background: #333; }
        .help-text { font-size: 11px; color: #888; margin-top: 5px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Sky.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="ui">
    <div class="control-group">
        <label>Дата и время симуляции:</label>
        <input type="datetime-local" id="datetime-input">
    </div>

    <div class="control-group">
        <label>Скорость времени: <span id="speed-val">1x</span></label>
        <input type="range" id="time-speed" min="1" max="5" value="1" step="0.1">
    </div>

    <div class="control-group">
        <label>Режим камеры:</label>
        <button id="cam-btn" onclick="toggleCamera()">Камера: На Земле (2м)</button>
        <button onclick="resetCamera()">Сбросить фокус на Землю</button>
    </div>

    <div class="help-text">
        Управление: <b>Стрелки клавиатуры</b> — осмотр во все стороны (небо/земля под ногами).
    </div>
</div>

<script>
// --- 1. Астрономические масштабы (в метрах) ---
const EARTH_RADIUS = 6371000;              // 6 371 000 метров (Реальный радиус)
const SUN_DISTANCE = 149597870700;         // 1 А.Е.
const AXIS_TILT = THREE.MathUtils.degToRad(23.44); 
const EPOCH = new Date(Date.UTC(2026, 2, 20, 14, 46, 0)).getTime();

let simDate = new Date(); 
let timeScale = 1; 

// --- 2. Сцена и Рендерер с логарифмическим буфером глубины ---
const scene = new THREE.Scene();

const renderer = new THREE.WebGLRenderer({ 
    antialias: true,
    logarithmicDepthBuffer: true // Предотвращает мерцание и артефакты огромных масштабов
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.6;
document.body.appendChild(renderer.domElement);

// --- 3. Камеры ---
const aspect = window.innerWidth / window.innerHeight;

// Свободная камера для Космоса
const freeCam = new THREE.PerspectiveCamera(45, aspect, 1000, SUN_DISTANCE * 10);

// Камера от первого лица: Near = 0.001м (1 мм), чтобы видеть землю под ногами с 2м
const surfaceCam = new THREE.PerspectiveCamera(75, aspect, 0.001, SUN_DISTANCE * 10);
let activeCamera = surfaceCam;

const controls = new THREE.OrbitControls(freeCam, renderer.domElement);
controls.enableDamping = true;

// --- 4. Текстуры ---
const textureLoader = new THREE.TextureLoader();
const earthMap = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg');
const earthBump = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_normal_2048.jpg');
const earthSpec = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_specular_2048.jpg');

const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();
earthMap.anisotropy = maxAnisotropy;
earthBump.anisotropy = maxAnisotropy;
earthSpec.anisotropy = maxAnisotropy;

// --- 5. Источники света и Солнце ---
const sunLight = new THREE.DirectionalLight(0xffffff, 2.5);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x222233, 0.3));

// 5.2 Иерархия Орбиты и Земли
const orbitGroup = new THREE.Group();
scene.add(orbitGroup);

const tiltGroup = new THREE.Group();
tiltGroup.position.x = SUN_DISTANCE; 
tiltGroup.rotation.z = AXIS_TILT;
orbitGroup.add(tiltGroup);

// Огромный шар Земли
const earthMesh = new THREE.Mesh(
    new THREE.SphereGeometry(EARTH_RADIUS, 256, 256), // Высокая детализация сферы
    new THREE.MeshPhongMaterial({ 
        map: earthMap,                       
        normalMap: earthBump,             
        normalScale: new THREE.Vector2(0.8, 0.8),
        specularMap: earthSpec,           
        specular: new THREE.Color(0x333333),
        shininess: 15
    })
);
tiltGroup.add(earthMesh);

// --- 6. Атмосфера и Небо ---
const sky = new THREE.Sky();
sky.scale.setScalar(EARTH_RADIUS * 10);
scene.add(sky);

const skyUniforms = sky.material.uniforms;
skyUniforms['turbidity'].value = 8;
skyUniforms['rayleigh'].value = 2;
skyUniforms['mieCoefficient'].value = 0.005;
skyUniforms['mieDirectionalG'].value = 0.8;

// --- 7. Закрепление Человека на Поверхности Земли ---
const humanPivot = new THREE.Group();
// Позиция на поверхности шара (по оси X)
humanPivot.position.set(EARTH_RADIUS, 0, 0); 
earthMesh.add(humanPivot);

// Подъем ровно на 2 метра над Землей
const headNode = new THREE.Group();
headNode.position.set(2, 0, 0); // 2 метра наружу от сферы
humanPivot.add(headNode);
headNode.add(surfaceCam);

let humanYaw = 0;   
let humanPitch = -0.2; // Наклон слегка вниз на горизонт/землю

function updateHumanLook() {
    // Ограничение поворота головы вверх/вниз
    humanPitch = Math.max(-Math.PI/2 + 0.01, Math.min(Math.PI/2 - 0.01, humanPitch));

    // Направление взгляда от первого лица
    const lookDir = new THREE.Vector3(
        Math.sin(humanPitch),                  // Наклон вверх/вниз
        Math.cos(humanPitch) * Math.cos(humanYaw), // Влево/Вправо
        Math.cos(humanPitch) * Math.sin(humanYaw)
    );

    // Вертикальная ось человека направлена от центра планеты вверх в космос
    surfaceCam.up.set(1, 0, 0);
    surfaceCam.lookAt(lookDir.add(surfaceCam.position));
}
updateHumanLook();

// --- 8. Управление Стрелками ---
const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

window.addEventListener('keydown', (e) => {
    if (keys.hasOwnProperty(e.code)) {
        keys[e.code] = true;
        e.preventDefault();
    }
});

window.addEventListener('keyup', (e) => {
    if (keys.hasOwnProperty(e.code)) {
        keys[e.code] = false;
        e.preventDefault();
    }
});

function handleCameraRotation(delta) {
    const rotateSpeed = 1.2; 

    if (activeCamera === surfaceCam) {
        if (keys.ArrowLeft)  humanYaw += rotateSpeed * delta;
        if (keys.ArrowRight) humanYaw -= rotateSpeed * delta;
        if (keys.ArrowUp)    humanPitch += rotateSpeed * delta;
        if (keys.ArrowDown)  humanPitch -= rotateSpeed * delta;

        if (keys.ArrowLeft || keys.ArrowRight || keys.ArrowUp || keys.ArrowDown) {
            updateHumanLook();
        }
    } else if (activeCamera === freeCam) {
        if (keys.ArrowLeft)  controls.rotateLeft(rotateSpeed * delta);
        if (keys.ArrowRight) controls.rotateLeft(-rotateSpeed * delta);
        if (keys.ArrowUp)    controls.rotateUp(rotateSpeed * delta);
        if (keys.ArrowDown)  controls.rotateUp(-rotateSpeed * delta);
    }
}

// --- 9. Симуляция времени ---
const datetimeInput = document.getElementById('datetime-input');
const speedInput = document.getElementById('time-speed');
const speedVal = document.getElementById('speed-val');

function updateUIFromDate() {
    const local = new Date(simDate.getTime() - simDate.getTimezoneOffset() * 60000);
    datetimeInput.value = local.toISOString().slice(0, 16);
}

datetimeInput.addEventListener('change', (e) => {
    simDate = new Date(e.target.value);
});

speedInput.addEventListener('input', (e) => {
    timeScale = parseFloat(e.target.value);
    speedVal.innerText = `${timeScale}x`;
});

function updatePositionsFromDate(date) {
    const elapsedSeconds = (date.getTime() - EPOCH) / 1000;

    // Вращение по орбите
    const yearInSeconds = 31556952;
    const orbitAngle = (elapsedSeconds / yearInSeconds) * (Math.PI * 2);
    orbitGroup.rotation.y = orbitAngle;

    // Суточное вращение
    const dayInSeconds = 86164.1;
    const dayAngle = (elapsedSeconds / dayInSeconds) * (Math.PI * 2);
    earthMesh.rotation.y = dayAngle;

    // Позиционирование света Солнца
    const earthWorldPos = new THREE.Vector3();
    earthMesh.getWorldPosition(earthWorldPos);

    const sunDir = new THREE.Vector3().subVectors(new THREE.Vector3(0,0,0), earthWorldPos).normalize();
    sunLight.position.copy(earthWorldPos).sub(sunDir.clone().multiplyScalar(SUN_DISTANCE));
    sunLight.target.position.copy(earthWorldPos);
    sunLight.target.updateMatrixWorld();

    // Синхронизация купола неба с головой человека
    const humanWorldPos = new THREE.Vector3();
    headNode.getWorldPosition(humanWorldPos);
    sky.position.copy(humanWorldPos);

    const sunRelativePos = new THREE.Vector3().subVectors(new THREE.Vector3(0,0,0), humanWorldPos).normalize();
    skyUniforms['sunPosition'].value.copy(sunRelativePos);
}

function focusCameraOnEarth() {
    const earthWorldPos = new THREE.Vector3();
    earthMesh.getWorldPosition(earthWorldPos);

    freeCam.position.set(
        earthWorldPos.x + EARTH_RADIUS * 4,
        earthWorldPos.y + EARTH_RADIUS * 2,
        earthWorldPos.z + EARTH_RADIUS * 4
    );
    
    controls.target.copy(earthWorldPos);
    controls.update();
}

function resetCamera() {
    if (activeCamera === freeCam) {
        focusCameraOnEarth();
    }
}

function toggleCamera() {
    const btn = document.getElementById('cam-btn');
    if (activeCamera === freeCam) {
        activeCamera = surfaceCam;
        controls.enabled = false;
        sky.visible = true;
        btn.innerText = "Камера: На Земле (2м)";
        updateHumanLook();
    } else {
        activeCamera = freeCam;
        controls.enabled = true;
        sky.visible = false;
        btn.innerText = "Камера: Около Земли (Космос)";
        focusCameraOnEarth();
    }
}

// --- 10. Цикл анимации ---
const clock = new THREE.Clock();
updateUIFromDate();
updatePositionsFromDate(simDate);

function animate() {
    requestAnimationFrame(animate);

    const delta = clock.getDelta();
    handleCameraRotation(delta);

    if (timeScale > 0) {
        simDate = new Date(simDate.getTime() + (delta * timeScale * 1000));
        updateUIFromDate();
    }

    updatePositionsFromDate(simDate);

    if (activeCamera === freeCam) {
        const earthWorldPos = new THREE.Vector3();
        earthMesh.getWorldPosition(earthWorldPos);
        
        const camOffset = freeCam.position.clone().sub(controls.target);
        controls.target.copy(earthWorldPos);
        freeCam.position.copy(earthWorldPos).add(camOffset);
        
        controls.update();
    }

    renderer.render(scene, activeCamera);
}

window.addEventListener('resize', () => {
    const w = window.innerWidth, h = window.innerHeight;
    freeCam.aspect = w / h; freeCam.updateProjectionMatrix();
    surfaceCam.aspect = w / h; surfaceCam.updateProjectionMatrix();
    renderer.setSize(w, h);
});

animate();
</script>
</body>
</html>
