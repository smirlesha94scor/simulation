<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Схема зарядки аккумулятора</title>
  <style>
    :root {
      --bg: #121824;
      --card-bg: #1a2234;
      --wire-off: #4a5568;
      --wire-on: #3182ce;
      --wire-glow: #63b3ed;
      --red-led: #f56565;
      --green-led: #48bb78;
      --text: #e2e8f0;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h2 {
      margin-bottom: 10px;
      color: #edf2f7;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-width: 800px;
      width: 100%;
    }

    svg {
      width: 100%;
      height: 380px;
      background: #0f141d;
      border-radius: 8px;
    }

    /* Анимация тока */
    .current-particle {
      fill: #ebf8ff;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .active-circuit .current-particle {
      opacity: 1;
      animation: flow 2s linear infinite;
    }

    @keyframes flow {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }

    .wire-active {
      stroke: var(--wire-on);
      transition: stroke 0.3s;
    }

    .wire-active.charging {
      stroke-dasharray: 8, 8;
      animation: dash 1s linear infinite;
    }

    @keyframes dash {
      to { stroke-dashoffset: -16; }
    }

    /* Элементы управления */
    .controls {
      display: flex;
      gap: 15px;
      margin-top: 20px;
      justify-content: center;
      align-items: center;
    }

    button {
      background-color: #3182ce;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 15px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: #2b6cb0;
    }

    button:active {
      transform: scale(0.98);
    }

    button.btn-reset {
      background-color: #4a5568;
    }
    
    button.btn-reset:hover {
      background-color: #718096;
    }

    .status-panel {
      display: flex;
      justify-content: space-around;
      margin-top: 15px;
      background: #0f141d;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #4a5568;
      box-shadow: 0 0 5px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Схема зарядки аккумулятора</h2>
    
    <svg id="circuit" viewBox="0 0 700 320">
      <defs>
        <!-- Свечение индикатора -->
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="6" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>

      <!-- ТРАССА ПРОВОДОВ -->
      <!-- Основной контур -->
      <path id="main-wire" class="wire-active" d="M 120 160 L 120 70 L 250 70 M 330 70 L 450 70 L 450 110 M 450 210 L 450 250 L 120 250 L 120 200" fill="none" stroke="#4a5568" stroke-width="4" stroke-linejoin="round"/>
      
      <!-- Цепь индикатора (параллельно резистору и АКБ) -->
      <path id="led-wire" d="M 330 70 L 330 140 L 400 140 M 400 180 L 330 180 L 330 250" fill="none" stroke="#4a5568" stroke-width="3" stroke-linejoin="round"/>

      <!-- ИСТОЧНИК ПИТАНИЯ (5V DC) -->
      <g transform="translate(100, 160)">
        <circle cx="20" cy="20" r="22" fill="#1a2234" stroke="#e2e8f0" stroke-width="2"/>
        <text x="20" y="15" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="bold">DC 5V</text>
        <text x="20" y="32" fill="#e2e8f0" font-size="16" text-anchor="middle" font-weight="bold">+</text>
        <text x="20" y="-10" fill="#e2e8f0" font-size="12" text-anchor="middle">+</text>
        <text x="20" y="55" fill="#e2e8f0" font-size="12" text-anchor="middle">-</text>
      </g>

      <!-- ВЫКЛЮЧАТЕЛЬ -->
      <g transform="translate(250, 70)">
        <circle cx="0" cy="0" r="5" fill="#e2e8f0"/>
        <circle cx="80" cy="0" r="5" fill="#e2e8f0"/>
        <line id="switch-lever" x1="0" y1="0" x2="75" y2="-25" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" style="transition: all 0.2s;"/>
        <text x="40" y="-30" fill="#a0aec0" font-size="12" text-anchor="middle">S1 (Ключ)</text>
      </g>

      <!-- ОГРАНИЧИТЕЛЬНЫЙ РЕЗИСТОР -->
      <g transform="translate(370, 70)">
        <rect x="0" y="-12" width="50" height="24" fill="#1a2234" stroke="#e2e8f0" stroke-width="2" rx="3"/>
        <text x="25" y="-18" fill="#a0aec0" font-size="12" text-anchor="middle">R1 (10 Ом)</text>
        <!-- Полосы резистора -->
        <line x1="10" y1="-12" x2="10" y2="12" stroke="#e53e3e" stroke-width="3"/>
        <line x1="20" y1="-12" x2="20" y2="12" stroke="#e53e3e" stroke-width="3"/>
        <line x1="30" y1="-12" x2="30" y2="12" stroke="#black" stroke-width="3"/>
      </g>

      <!-- ДВУХЦВЕТНЫЙ СВЕТОДИОД (LED) -->
      <g transform="translate(400, 160)">
        <!-- Обозначение корпуса светодиода -->
        <circle id="led-body" cx="0" cy="0" r="16" fill="#2d3748" stroke="#e2e8f0" stroke-width="2"/>
        <!-- Треугольник диода -->
        <polygon points="-8,8 8,8 0,-8" fill="none" stroke="#e2e8f0" stroke-width="2"/>
        <line x1="-8" y1="-8" x2="8" y2="-8" stroke="#e2e8f0" stroke-width="2"/>
        <text x="30" y="5" fill="#a0aec0" font-size="12">Индикатор</text>
      </g>

      <!-- АККУМУЛЯТОР (BATTERY) -->
      <g transform="translate(450, 160)">
        <!-- Внешний корпус -->
        <rect x="-25" y="-35" width="50" height="70" rx="6" fill="#1a2234" stroke="#e2e8f0" stroke-width="2"/>
        <!-- Плюс контакта -->
        <rect x="-10" y="-42" width="20" height="7" rx="2" fill="#e2e8f0"/>
        
        <!-- Уровень заряда -->
        <rect id="battery-level" x="-20" y="30" width="40" height="0" rx="3" fill="#e53e3e" style="transition: all 0.2s;"/>
        
        <!-- Текст процентов -->
        <text id="battery-text" x="0" y="5" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">0%</text>
        
        <text x="40" y="5" fill="#a0aec0" font-size="12">АКБ (3.7V)</text>
      </g>
    </svg>

    <div class="status-panel">
      <div class="status-item">
        <span>Статус цепи:</span>
        <strong id="circuit-status" style="color: #a0aec0;">Разомкнута</strong>
      </div>
      <div class="status-item">
        <div id="status-indicator-dot" class="status-dot"></div>
        <span>Индикатор:</span>
        <strong id="led-status-text" style="color: #a0aec0;">Выключен</strong>
      </div>
      <div class="status-item">
        <span>Ток зарядки:</span>
        <strong id="current-text" style="color: #a0aec0;">0 mA</strong>
      </div>
    </div>

    <div class="controls">
      <button id="btn-toggle">Замкнуть выключатель</button>
      <button id="btn-reset" class="btn-reset">Сбросить аккумулятор</button>
    </div>
  </div>

  <script>
    // Состояние системы
    let isClosed = false;
    let batteryCharge = 10; // начальный заряд %
    let chargeInterval = null;

    // DOM Элементы
    const switchLever = document.getElementById('switch-lever');
    const mainWire = document.getElementById('main-wire');
    const ledWire = document.getElementById('led-wire');
    const ledBody = document.getElementById('led-body');
    const batteryLevel = document.getElementById('battery-level');
    const batteryText = document.getElementById('battery-text');
    
    const circuitStatus = document.getElementById('circuit-status');
    const ledStatusText = document.getElementById('led-status-text');
    const statusIndicatorDot = document.getElementById('status-indicator-dot');
    const currentText = document.getElementById('current-text');
    
    const btnToggle = document.getElementById('btn-toggle');
    const btnReset = document.getElementById('btn-reset');

    // Обновление отображения аккумулятора
    function updateBatteryUI() {
      batteryText.textContent = `${Math.round(batteryCharge)}%`;
      
      // Высота заливки аккумулятора (макс. 60px)
      const height = (batteryCharge / 100) * 60;
      const yOffset = 30 - height;
      
      batteryLevel.setAttribute('height', height);
      batteryLevel.setAttribute('y', yOffset);

      // Цвет индикатора на аккумуляторе
      if (batteryCharge < 20) {
        batteryLevel.setAttribute('fill', '#e53e3e'); // Красный
      } else if (batteryCharge < 80) {
        batteryLevel.setAttribute('fill', '#dd6b20'); // Оранжевый
      } else {
        batteryLevel.setAttribute('fill', '#38a169'); // Зеленый
      }
    }

    // Состояние цепи и индикаторов
    function updateCircuitState() {
      if (!isClosed) {
        // Выключатель разомкнут
        switchLever.setAttribute('x2', '75');
        switchLever.setAttribute('y2', '-25');
        
        mainWire.classList.remove('charging');
        mainWire.style.stroke = '#4a5568';
        ledWire.style.stroke = '#4a5568';
        
        ledBody.setAttribute('fill', '#2d3748');
        ledBody.removeAttribute('filter');

        circuitStatus.textContent = 'Разомкнута';
        circuitStatus.style.color = '#a0aec0';
        
        ledStatusText.textContent = 'Выключен';
        ledStatusText.style.color = '#a0aec0';
        statusIndicatorDot.style.backgroundColor = '#4a5568';
        statusIndicatorDot.style.boxShadow = 'none';

        currentText.textContent = '0 mA';
        currentText.style.color = '#a0aec0';

        btnToggle.textContent = 'Замкнуть выключатель';
        
        clearInterval(chargeInterval);
        return;
      }

      // Выключатель замкнут
      switchLever.setAttribute('x2', '80');
      switchLever.setAttribute('y2', '0');
      
      mainWire.classList.add('charging');
      mainWire.style.stroke = '#3182ce';
      ledWire.style.stroke = '#3182ce';
      
      circuitStatus.textContent = 'Замкнута (Зарядка)';
      circuitStatus.style.color = '#63b3ed';
      btnToggle.textContent = 'Разомкнуть выключатель';

      if (batteryCharge < 100) {
        // Режим ЗАРЯДКИ — Красный индикатор
        ledBody.setAttribute('fill', '#f56565');
        ledBody.setAttribute('filter', 'url(#glow)');
        
        ledStatusText.textContent = 'Красный (Идёт зарядка)';
        ledStatusText.style.color = '#f56565';
        statusIndicatorDot.style.backgroundColor = '#f56565';
        statusIndicatorDot.style.boxShadow = '0 0 8px #f56565';

        // Расчет тока (уменьшается по мере заряда)
        const current = Math.round(450 * (1 - batteryCharge / 120));
        currentText.textContent = `${current} mA`;
        currentText.style.color = '#63b3ed';
      } else {
        // Заряд ЗАВЕРШЕН — Зеленый индикатор
        mainWire.classList.remove('charging'); // Анимация тока останавливается
        
        ledBody.setAttribute('fill', '#48bb78');
        ledBody.setAttribute('filter', 'url(#glow)');
        
        ledStatusText.textContent = 'Зелёный (Заряжен)';
        ledStatusText.style.color = '#48bb78';
        statusIndicatorDot.style.backgroundColor = '#48bb78';
        statusIndicatorDot.style.boxShadow = '0 0 8px #48bb78';

        currentText.textContent = '5 mA (Подпитка)';
        currentText.style.color = '#48bb78';
      }
    }

    // Симуляция процесса зарядки
    function startChargingSimulation() {
      clearInterval(chargeInterval);
      
      chargeInterval = setInterval(() => {
        if (isClosed && batteryCharge < 100) {
          batteryCharge += 1.5; // Скорость зарядки
          if (batteryCharge > 100) batteryCharge = 100;
          
          updateBatteryUI();
          updateCircuitState();
        }
      }, 200);
    }

    // Переключение ключа
    btnToggle.addEventListener('click', () => {
      isClosed = !isClosed;
      updateCircuitState();
      if (isClosed) {
        startChargingSimulation();
      }
    });

    // Сброс заряда
    btnReset.addEventListener('click', () => {
      batteryCharge = 10;
      updateBatteryUI();
      updateCircuitState();
      if (isClosed) {
        startChargingSimulation();
      }
    });

    // Инициализация при старте
    updateBatteryUI();
    updateCircuitState();
  </script>
</body>
</html>
