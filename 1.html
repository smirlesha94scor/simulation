<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Планетарий: Затмение 12 августа 2026</title>
    <style>
        body { margin: 0; background: #0a0d14; color: #fff; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        #ui { 
            width: 350px; background: #131722; padding: 15px; box-sizing: border-box; 
            display: flex; flex-direction: column; gap: 10px; font-size: 13px; z-index: 10; 
            border-right: 1px solid #232936; overflow-y: auto;
        }
        h3 { margin: 0; color: #4da6ff; font-size: 16px; }
        label { font-weight: bold; color: #aaa; margin-bottom: 3px; display: block; }
        select, input { 
            width: 100%; padding: 6px; background: #1c2230; border: 1px solid #323b4e; 
            color: #fff; border-radius: 4px; box-sizing: border-box; 
        }
        .time-readout { font-family: monospace; color: #00ffcc; font-size: 15px; font-weight: bold; margin-bottom: 5px; }
        
        .btn-group { display: flex; flex-direction: column; gap: 6px; }
        .btn-preset { color: #fff; font-weight: bold; border: none; padding: 8px; border-radius: 4px; cursor: pointer; text-align: left; font-size: 12px; }
        .btn-local { background: #00aa70; }
        .btn-local:hover { background: #008855; }
        .btn-valencia { background: #e67e22; }
        .btn-valencia:hover { background: #d35400; }
        
        #canvas-container { flex: 1; display: flex; flex-direction: column; height: 100%; }
        .canvas-box { flex: 1; position: relative; border-bottom: 1px solid #232936; }
        .canvas-label { 
            position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); 
            padding: 4px 8px; border-radius: 4px; font-weight: bold; color: #00ffcc; font-size: 12px; pointer-events: none;
        }
        canvas { width: 100%; height: 100%; display: block; cursor: grab; }
        canvas:active { cursor: grabbing; }
    </style>
</head>
<body>

<div id="ui">
    <h3>2D Астрономический симулятор</h3>
    
    <div>
        <label>1. Ваше местоположение (Частное):</label>
        <div class="btn-group">
            <button class="btn-preset btn-local" id="local-start-btn">▶ Старт фазы (20:39 EEST)</button>
            <button class="btn-preset btn-local" id="local-max-btn">✹ Максимум на закате (21:03 EEST)</button>
        </div>
    </div>

    <div>
        <label>2. Валенсия (Полное затмение):</label>
        <div class="btn-group">
            <button class="btn-preset btn-valencia" id="valencia-start-btn">▶ Старт фазы (19:38 CEST)</button>
            <button class="btn-preset btn-valencia" id="valencia-peak-btn">★ Пик полной фазы (20:33 CEST)</button>
        </div>
    </div>

    <div>
        <label>Часовой пояс отображения:</label>
        <select id="tz-select">
            <option value="3" selected>Местное время (EEST UTC+3)</option>
            <option value="2">Время в Испании (CEST UTC+2)</option>
            <option value="0">Всемирное время (UTC)</option>
        </select>
    </div>

    <div>
        <label>Дата и время симуляции:</label>
        <div id="time-display" class="time-readout">2026-08-12 21:03:00 (EEST)</div>
        <input type="datetime-local" id="datetime-picker">
    </div>

    <div>
        <label>Скорость времени: <span id="speed-val">1x</span></label>
        <input type="range" id="time-speed" min="0" max="1000" value="1" step="1">
    </div>

    <div>
        <label>Направление взгляда (Азимут): <span id="azimuth-val">285° (Северо-Запад)</span></label>
        <input type="range" id="azimuth-slider" min="0" max="360" value="285" step="1">
    </div>

    <div>
        <label>Угол обзора глаза (FOV): <span id="fov-val">50°</span></label>
        <input type="range" id="fov-slider" min="10" max="120" value="50" step="1">
    </div>

    <div style="margin-top: auto; background: #0d111a; padding: 10px; border-radius: 4px; line-height: 1.4;">
        <label>Астрономические данные:</label>
        <div id="info-text" style="color: #ffcc00; margin-top: 4px; font-family: monospace;">Загрузка...</div>
    </div>
</div>

<div id="canvas-container">
    <div class="canvas-box">
        <div class="canvas-label">1. Космос (Вид с Северного Полюса: Вращение ПРОТИВ часовой)</div>
        <canvas id="spaceCanvas"></canvas>
    </div>
    <div class="canvas-box">
        <div class="canvas-label">2. Вид с Земли (Панорама горизонта)</div>
        <canvas id="skyCanvas"></canvas>
    </div>
</div>

<script>
    const spaceCanvas = document.getElementById('spaceCanvas');
    const spaceCtx = spaceCanvas.getContext('2d');
    
    const skyCanvas = document.getElementById('skyCanvas');
    const skyCtx = skyCanvas.getContext('2d');

    function resize() {
        spaceCanvas.width = spaceCanvas.parentElement.clientWidth;
        spaceCanvas.height = spaceCanvas.parentElement.clientHeight;
        skyCanvas.width = skyCanvas.parentElement.clientWidth;
        skyCanvas.height = skyCanvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // UTC тайминги
    const UTC_LOCAL_START    = new Date('2026-08-12T17:39:00Z'); // 20:39 EEST
    const UTC_LOCAL_MAX      = new Date('2026-08-12T18:03:00Z'); // 21:03 EEST
    const UTC_VALENCIA_START = new Date('2026-08-12T17:38:25Z'); // 19:38 CEST
    const UTC_VALENCIA_PEAK  = new Date('2026-08-12T18:33:00Z'); // 20:33 CEST

    // Настройки местоположения по умолчанию (Ваше текущее местоположение, UTC+3)
    let lat = 48.73, lon = 37.56; 
    let simDate = new Date(UTC_LOCAL_MAX.getTime());
    let speed = 1;
    let viewAzimuth = 285; 
    let fov = 50; 
    let displayTzOffset = 3;

    const timeDisplay = document.getElementById('time-display');
    const datetimePicker = document.getElementById('datetime-picker');
    const tzSelect = document.getElementById('tz-select');
    const speedSlider = document.getElementById('time-speed');
    const speedVal = document.getElementById('speed-val');
    const azimuthSlider = document.getElementById('azimuth-slider');
    const azimuthVal = document.getElementById('azimuth-val');
    const fovSlider = document.getElementById('fov-slider');
    const fovVal = document.getElementById('fov-val');
    const infoText = document.getElementById('info-text');

    function updatePickerFromSimDate() {
        const localDisplayDate = new Date(simDate.getTime() + displayTzOffset * 3600000);
        datetimePicker.value = localDisplayDate.toISOString().slice(0, 16);
    }
    updatePickerFromSimDate();

    tzSelect.addEventListener('change', e => {
        displayTzOffset = parseFloat(e.target.value);
        updatePickerFromSimDate();
    });

    datetimePicker.addEventListener('change', e => { 
        if(e.target.value) {
            const chosen = new Date(e.target.value);
            simDate = new Date(chosen.getTime() - displayTzOffset * 3600000);
        }
    });

    speedSlider.addEventListener('input', e => { speed = parseFloat(e.target.value); speedVal.innerText = speed + 'x'; });
    azimuthSlider.addEventListener('input', e => { viewAzimuth = parseFloat(e.target.value); updateAzimuthLabel(); });
    fovSlider.addEventListener('input', e => { fov = parseFloat(e.target.value); fovVal.innerText = fov + '°'; });

    // КНОПКИ ДЛЯ ВАШЕГО МЕСТОПОЛОЖЕНИЯ
    document.getElementById('local-start-btn').addEventListener('click', () => {
        lat = 48.73; lon = 37.56;
        displayTzOffset = 3; tzSelect.value = "3";
        simDate = new Date(UTC_LOCAL_START.getTime());
        speed = 30; speedSlider.value = 30; speedVal.innerText = '30x';
        viewAzimuth = 280; azimuthSlider.value = 280;
        updateAzimuthLabel();
        updatePickerFromSimDate();
    });

    document.getElementById('local-max-btn').addEventListener('click', () => {
        lat = 48.73; lon = 37.56;
        displayTzOffset = 3; tzSelect.value = "3";
        simDate = new Date(UTC_LOCAL_MAX.getTime());
        speed = 1; speedSlider.value = 1; speedVal.innerText = '1x';
        viewAzimuth = 285; azimuthSlider.value = 285;
        updateAzimuthLabel();
        updatePickerFromSimDate();
    });

    // КНОПКИ ДЛЯ ВАЛЕНСИИ
    document.getElementById('valencia-start-btn').addEventListener('click', () => {
        lat = 39.47; lon = -0.37;
        displayTzOffset = 2; tzSelect.value = "2";
        simDate = new Date(UTC_VALENCIA_START.getTime());
        speed = 60; speedSlider.value = 60; speedVal.innerText = '60x';
        viewAzimuth = 270; azimuthSlider.value = 270;
        updateAzimuthLabel();
        updatePickerFromSimDate();
    });

    document.getElementById('valencia-peak-btn').addEventListener('click', () => {
        lat = 39.47; lon = -0.37;
        displayTzOffset = 2; tzSelect.value = "2";
        simDate = new Date(UTC_VALENCIA_PEAK.getTime());
        speed = 1; speedSlider.value = 1; speedVal.innerText = '1x';
        viewAzimuth = 280; azimuthSlider.value = 280;
        updateAzimuthLabel();
        updatePickerFromSimDate();
    });

    function updateAzimuthLabel() {
        const dirs = ['Сев', 'С-В', 'Вост', 'Ю-В', 'Юг', 'Ю-З', 'Зап', 'С-З'];
        const idx = Math.round(viewAzimuth / 45) % 8;
        azimuthVal.innerText = `${Math.round(viewAzimuth)}° (${dirs[idx]})`;
    }

    let isDragging = false, lastMouseX = 0;
    skyCanvas.addEventListener('mousedown', e => { isDragging = true; lastMouseX = e.clientX; });
    window.addEventListener('mousemove', e => {
        if (!isDragging) return;
        const dx = e.clientX - lastMouseX;
        lastMouseX = e.clientX;
        const degreesPerPixel = fov / skyCanvas.width;
        viewAzimuth = (viewAzimuth - dx * degreesPerPixel + 360) % 360;
        azimuthSlider.value = viewAzimuth;
        updateAzimuthLabel();
    });
    window.addEventListener('mouseup', () => { isDragging = false; });

    // 1. Космос (Вид с Северного Полюса)
    function drawSpace() {
        const w = spaceCanvas.width, h = spaceCanvas.height;
        spaceCtx.clearRect(0, 0, w, h);
        const centerX = w / 2, centerY = h / 2;

        // Солнце (Слева)
        const sunX = centerX - 180, sunY = centerY;
        spaceCtx.beginPath();
        spaceCtx.arc(sunX, sunY, 14, 0, Math.PI * 2);
        spaceCtx.fillStyle = '#ffcc00';
        spaceCtx.shadowColor = '#ffcc00';
        spaceCtx.shadowBlur = 15;
        spaceCtx.fill();
        spaceCtx.shadowBlur = 0;

        // Земля
        const earthX = centerX + 60, earthY = centerY, earthR = 18;
        
        // Дневная сторона
        spaceCtx.beginPath();
        spaceCtx.arc(earthX, earthY, earthR, 0, Math.PI * 2);
        spaceCtx.fillStyle = '#1d55bb';
        spaceCtx.fill();

        // Ночная сторона (справа)
        spaceCtx.beginPath();
        spaceCtx.arc(earthX, earthY, earthR, -Math.PI / 2, Math.PI / 2);
        spaceCtx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        spaceCtx.fill();

        // Положение наблюдателя (Земля вращается ПРОТИВ ЧАСОВОЙ СТРЕЛКИ)
        const utcHours = simDate.getUTCHours() + simDate.getUTCMinutes()/60 + simDate.getUTCSeconds()/3600;
        const dayAngle = ((utcHours / 24) * Math.PI * 2) + (lon * Math.PI / 180);
        
        const cityX = earthX - Math.cos(dayAngle) * earthR;
        const cityY = earthY - Math.sin(dayAngle) * earthR; 

        spaceCtx.beginPath();
        spaceCtx.arc(cityX, cityY, 3.5, 0, Math.PI * 2);
        spaceCtx.fillStyle = '#ff0055';
        spaceCtx.fill();

        // Орбита и Луна (Вращение ПРОТИВ ЧАСОВОЙ СТРЕЛКИ)
        const moonOrbitR = 55;
        const minDiff = (simDate - UTC_VALENCIA_PEAK) / (1000 * 60); 

        const moonAngle = Math.PI + (minDiff * 0.0012); 

        const moonX = earthX + Math.cos(moonAngle) * moonOrbitR;
        const moonY = earthY - Math.sin(moonAngle) * moonOrbitR; 

        // Траектория орбиты
        spaceCtx.beginPath();
        spaceCtx.arc(earthX, earthY, moonOrbitR, 0, Math.PI * 2);
        spaceCtx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        spaceCtx.stroke();

        // Луна
        spaceCtx.beginPath();
        spaceCtx.arc(moonX, moonY, 5, 0, Math.PI * 2);
        spaceCtx.fillStyle = '#cccccc';
        spaceCtx.fill();
        
        spaceCtx.fillStyle = '#aaa';
        spaceCtx.font = '11px sans-serif';
        spaceCtx.fillText('Земля (↺)', earthX - 20, earthY + 32);
        spaceCtx.fillText('Солнце', sunX - 18, sunY + 30);
    }

    // 2. Вид с Земли
    function drawSky() {
        const w = skyCanvas.width, h = skyCanvas.height;
        const horizonY = h * 0.75;

        const minDiff = (simDate - UTC_VALENCIA_PEAK) / (1000 * 60);
        const hours = simDate.getUTCHours() + simDate.getUTCMinutes()/60 + simDate.getUTCSeconds()/3600 + (lon/15);
        const sunAltDeg = Math.sin((hours - 6) / 24 * Math.PI * 2) * (90 - Math.abs(lat - 23.44));
        
        let sunAzimuth = (hours / 24) * 360; 
        if (sunAzimuth >= 360) sunAzimuth -= 360;

        const latOffset = (lat - 39.47) * 0.012; 
        const moonAltDeg = sunAltDeg - (minDiff * 0.003) - latOffset;
        const moonAzimuth = sunAzimuth - (minDiff * 0.009);

        const angularDist = Math.hypot(sunAzimuth - moonAzimuth, sunAltDeg - moonAltDeg);
        let coveragePct = Math.max(0, Math.min(100, Math.round((1 - (angularDist / 0.55)) * 100)));

        let phaseStatus = "Частная фаза";
        if (coveragePct >= 98) phaseStatus = "ПОЛНОЕ ЗАТМЕНИЕ";
        else if (coveragePct === 0) phaseStatus = "Нет затмения";

        infoText.innerText = `Место: ${lat.toFixed(2)}°N, ${lon.toFixed(2)}°E\nСтатус: ${phaseStatus}\nПерекрытие: ${coveragePct}%\nВысота: ${sunAltDeg.toFixed(1)}°\nАзимут: ${sunAzimuth.toFixed(1)}°`;

        let skyGrad = skyCtx.createLinearGradient(0, 0, 0, h);
        if (coveragePct >= 98) {
            skyGrad.addColorStop(0, '#02050e'); skyGrad.addColorStop(1, '#070b14');
        } else if (sunAltDeg > 5) {
            skyGrad.addColorStop(0, '#1a75ff'); skyGrad.addColorStop(1, '#80b3ff');
        } else if (sunAltDeg > -2) {
            skyGrad.addColorStop(0, '#0b1d3a'); skyGrad.addColorStop(1, '#d9534f');
        } else {
            skyGrad.addColorStop(0, '#020509'); skyGrad.addColorStop(1, '#08101d');
        }
        skyCtx.fillStyle = skyGrad;
        skyCtx.fillRect(0, 0, w, h);

        function getScreenCoords(azimuth, altitude) {
            let diffAz = azimuth - viewAzimuth;
            while (diffAz < -180) diffAz += 360;
            while (diffAz > 180) diffAz -= 360;
            const x = w / 2 + (diffAz / fov) * w;
            const verticalFOV = fov * (h / w);
            const y = horizonY - (altitude / verticalFOV) * h;
            return { x, y, visible: Math.abs(diffAz) < fov };
        }

        const sunScreen = getScreenCoords(sunAzimuth, sunAltDeg);
        const moonScreen = getScreenCoords(moonAzimuth, moonAltDeg);

        const sunRadius = (0.53 / fov) * w;
        const moonRadius = sunRadius * 1.02;

        if (coveragePct >= 98 && sunScreen.visible) {
            let corona = skyCtx.createRadialGradient(sunScreen.x, sunScreen.y, sunRadius, sunScreen.x, sunScreen.y, sunRadius * 4.5);
            corona.addColorStop(0, 'rgba(255, 255, 255, 0.98)');
            corona.addColorStop(0.25, 'rgba(180, 220, 255, 0.6)');
            corona.addColorStop(1, 'rgba(0, 0, 0, 0)');
            skyCtx.beginPath();
            skyCtx.arc(sunScreen.x, sunScreen.y, sunRadius * 4.5, 0, Math.PI * 2);
            skyCtx.fillStyle = corona;
            skyCtx.fill();
        }

        if (sunScreen.visible) {
            skyCtx.beginPath();
            skyCtx.arc(sunScreen.x, sunScreen.y, Math.max(2, sunRadius), 0, Math.PI * 2);
            skyCtx.fillStyle = '#ffffff';
            skyCtx.shadowColor = '#ffea9f';
            skyCtx.shadowBlur = coveragePct > 90 ? 2 : 15;
            skyCtx.fill();
            skyCtx.shadowBlur = 0;
        }

        if (moonScreen.visible) {
            skyCtx.beginPath();
            skyCtx.arc(moonScreen.x, moonScreen.y, Math.max(2, moonRadius), 0, Math.PI * 2);
            skyCtx.fillStyle = '#080b12';
            skyCtx.fill();
        }

        skyCtx.fillStyle = coveragePct >= 98 ? '#030502' : '#0a1207';
        skyCtx.fillRect(0, horizonY, w, h - horizonY);
        skyCtx.strokeStyle = '#1e3818';
        skyCtx.lineWidth = 2;
        skyCtx.beginPath();
        skyCtx.moveTo(0, horizonY);
        skyCtx.lineTo(w, horizonY);
        skyCtx.stroke();

        const compassPoints = [
            { az: 0, label: 'N' }, { az: 45, label: 'NE' },
            { az: 90, label: 'E' }, { az: 135, label: 'SE' },
            { az: 180, label: 'S' }, { az: 225, label: 'SW' },
            { az: 270, label: 'W' }, { az: 315, label: 'NW' }
        ];

        skyCtx.font = '11px sans-serif';
        skyCtx.textAlign = 'center';

        compassPoints.forEach(pt => {
            let diff = pt.az - viewAzimuth;
            while (diff < -180) diff += 360;
            while (diff > 180) diff -= 360;

            if (Math.abs(diff) < fov) {
                const x = w / 2 + (diff / fov) * w;
                skyCtx.fillStyle = '#00ffcc';
                skyCtx.fillRect(x - 1, horizonY - 6, 2, 6);
                skyCtx.fillStyle = '#aaa';
                skyCtx.fillText(pt.label, x, horizonY + 18);
            }
        });
    }

    let lastTime = performance.now();
    function loop(now) {
        const dt = (now - lastTime) / 1000;
        lastTime = now;

        simDate = new Date(simDate.getTime() + dt * 1000 * speed);

        const displayDate = new Date(simDate.getTime() + displayTzOffset * 3600000);
        let tzName = displayTzOffset === 3 ? 'EEST' : (displayTzOffset === 2 ? 'CEST' : 'UTC');
        timeDisplay.innerText = displayDate.toISOString().replace('T', ' ').slice(0, 19) + ` (${tzName})`;

        drawSpace();
        drawSky();

        requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
</script>
</body>
</html>
