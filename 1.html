<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Горизонтальная светомузыка (Без Canvas)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #080810;
      color: #fff;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
    }

    /* Верхняя панель управления */
    .controls {
      margin-top: 20px;
      z-index: 10;
    }
    button {
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      color: #000;
      background: linear-gradient(135deg, #00ffcc, #0099ff);
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.8);
    }

    /* Контейнер эквалайзера (внизу экрана) */
    .visualizer-container {
      width: 90vw;
      height: 60vh;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 4px;
      margin-bottom: 20px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 12px;
      border-bottom: 2px solid rgba(0, 255, 204, 0.2);
    }

    /* Каждый столбик гистограммы */
    .bar {
      flex: 1;
      height: 0%; /* Меняется динамически через JS */
      background: linear-gradient(to top, #00ffcc, #0099ff, #ff0055);
      border-radius: 4px 4px 0 0;
      position: relative;
      transition: height 0.05s ease-out; /* Плавность движения */
      box-shadow: 0 0 8px rgba(0, 255, 204, 0.3);
    }

    /* Метка пикового значения (Peak Hold) */
    .peak {
      position: absolute;
      top: -6px;
      left: 0;
      width: 100%;
      height: 3px;
      background-color: #ffffff;
      border-radius: 2px;
      box-shadow: 0 0 6px #fff;
    }
  </style>
</head>
<body>

  <div class="controls">
    <button id="startBtn">Включить гистограмму</button>
  </div>

  <div class="visualizer-container" id="equalizer"></div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const equalizer = document.getElementById('equalizer');

    const BARS_COUNT = 32; // Количество столбиков
    const bars = [];
    const peaks = [];
    const peakPos = new Array(BARS_COUNT).fill(0);

    // Создаем DOM-элементы столбиков и пиков
    for (let i = 0; i < BARS_COUNT; i++) {
      const bar = document.createElement('div');
      bar.className = 'bar';

      const peak = document.createElement('div');
      peak.className = 'peak';
      bar.appendChild(peak);

      equalizer.appendChild(bar);
      bars.push(bar);
      peaks.push(peak);
    }

    startBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: true
        });

        const audioTrack = stream.getAudioTracks()[0];
        if (!audioTrack) {
          alert('Ошибка: Не поставлена галочка "Предоставить доступ к аудиосистемы"!');
          return;
        }

        startBtn.style.display = 'none';

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(new MediaStream([audioTrack]));
        const analyser = audioCtx.createAnalyser();

        analyser.fftSize = 128; // Данные частот
        source.connect(analyser);

        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        function render() {
          requestAnimationFrame(render);

          analyser.getByteFrequencyData(dataArray);

          for (let i = 0; i < BARS_COUNT; i++) {
            const value = dataArray[i]; // Значение от 0 до 255
            const percent = (value / 255) * 100; // Высота в %

            // 1. Обновляем высоту DOM-элемента <div>
            bars[i].style.height = percent + '%';

            // 2. Логика плавно падающих пиков (Peak Hold)
            if (percent > peakPos[i]) {
              peakPos[i] = percent;
            } else {
              peakPos[i] -= 1.2; // Скорость падения
              if (peakPos[i] < 0) peakPos[i] = 0;
            }

            // Позиционируем пик относительно высоты столбика
            peaks[i].style.top = `-6px`;
          }
        }

        render();

      } catch (err) {
        console.error("Ошибка доступа: ", err);
      }
    });
  </script>
</body>
</html>
