<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Физическое рассеивание света</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
    canvas { display: block; }
    #controls {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); color: #fff; padding: 12px 24px; border-radius: 8px;
      display: flex; gap: 15px; align-items: center;
    }
    input[type=range] { width: 200px; }
  </style>
</head>
<body>

<div id="controls">
  <label for="sunAngle">Высота Солнца (Закат / День):</label>
  <input type="range" id="sunAngle" min="-0.1" max="1.2" step="0.005" value="0.2">
</div>

<canvas id="sky"></canvas>

<script>
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');
const slider = document.getElementById('sunAngle');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Цвета спектра (RGB коэффициенты рассеивания)
const rayleighRGB = { r: 0.15, g: 0.45, b: 1.0 }; // Синий рассеивается сильнее всего

function render() {
  const width = canvas.width;
  const height = canvas.height;
  const horizonY = height * 0.7;

  // Высота солнца над горизонтом (от -0.1 до 1.2)
  const sunAlt = parseFloat(slider.value);
  
  // Координаты Солнца
  const sunX = width / 2;
  const sunY = horizonY - sunAlt * (height * 0.6);

  // 1. Расчет толщины атмосферы (Optical Depth)
  // Чем ниже Солнце к горизонту, тем больше толщина воздуха (opticalDepth)
  const opticalDepth = 1 / Math.max(0.05, Math.sin(Math.max(0.01, sunAlt)));

  // 2. Расчет цвета неба (Рэлеем)
  // Синий цвет ослабляется при увеличении opticalDepth
  const skyR = Math.min(255, Math.floor(255 * (1 - Math.exp(-0.08 * opticalDepth)) + 10));
  const skyG = Math.min(255, Math.floor(200 * Math.exp(-0.15 * opticalDepth * 0.5) + 20));
  const skyB = Math.min(255, Math.floor(255 * Math.exp(-0.35 * opticalDepth)));

  // Градиент неба от зенита к горизонту
  const skyGradient = ctx.createLinearGradient(0, 0, 0, horizonY);
  skyGradient.addColorStop(0, `rgb(${Math.floor(skyR*0.3)}, ${Math.floor(skyG*0.4)}, ${Math.floor(skyB*0.8)})`);
  skyGradient.addColorStop(1, `rgb(${skyR}, ${skyG}, ${skyB})`);

  ctx.fillStyle = skyGradient;
  ctx.fillRect(0, 0, width, horizonY);

  // 3. Земля / Горизонт
  ctx.fillStyle = '#080c10';
  ctx.fillRect(0, horizonY, width, height - horizonY);

  // 4. Солнечный ореол (Рассеивание Ми — Mie Scattering)
  if (sunY < horizonY + 50) {
    // Цвет диска Солнца краснеет у горизонта
    const sunColorR = 255;
    const sunColorG = Math.min(255, Math.floor(240 * Math.exp(-0.2 * opticalDepth)));
    const sunColorB = Math.max(0, Math.floor(200 * Math.exp(-0.8 * opticalDepth)));

    // Ореол
    const halo = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 300);
    halo.addColorStop(0, `rgba(${sunColorR}, ${sunColorG}, ${sunColorB}, 0.9)`);
    halo.addColorStop(0.2, `rgba(${sunColorR}, ${sunColorG}, ${sunColorB}, 0.3)`);
    halo.addColorStop(1, 'rgba(0,0,0,0)');

    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(sunX, sunY, 300, 0, Math.PI * 2);
    ctx.fill();

    // Солнечный диск
    ctx.fillStyle = `rgb(${sunColorR}, ${sunColorG}, ${sunColorB})`;
    ctx.beginPath();
    ctx.arc(sunX, sunY, 20, 0, Math.PI * 2);
    ctx.fill();
  }
}

slider.addEventListener('input', render);
render();
</script>
</body>
</html>
