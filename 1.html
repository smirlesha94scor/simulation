<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>До 1 сентября</title>
    <!-- Leaflet CSS для интерактивной карты -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
</head>
<body>
<!-- Контейнер с возможностью растягивания за уголок -->
<div id="widgetContainer" style="
  width: 450px; 
  height: 400px; 
  resize: both; 
  overflow: hidden; 
  border: 1px dashed #ccc; 
  padding: 2px;
  box-sizing: border-box;
">
  <a href="https://allcalc.ru/node/1900" id="calcLink" data-weight="100%" data-height="100%">Сколько дней осталось до 1 сентября - allcalc</a>
  <script src="https://allcalc.ru/widgets/script.js"></script>
</div>

<script>
  const container = document.getElementById('widgetContainer');

  // Отслеживаем изменение размеров блока пользователем
  const resizeObserver = new ResizeObserver(entries => {
    for (let entry of entries) {
      const width = entry.contentRect.width + 'px';
      const height = entry.contentRect.height + 'px';
      
      const iframe = container.querySelector('iframe');
      if (iframe) {
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.width = entry.contentRect.width;
        iframe.height = entry.contentRect.height;
      }
    }
  });

  resizeObserver.observe(container);
</script>


</body>
</html>
