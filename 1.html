<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Реалистичный вид неба на ЮГ</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; color: #fff; }
    canvas { display: block; }
    #ui {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(10, 15, 25, 0.85); backdrop-filter: blur(8px);
      padding: 15px 25px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
      display: flex; gap: 20px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .control-group { display: flex; flex-direction: column; gap: 5px; font-size: 12px; }
    input[type=range] { width: 160px; }
    button {
      background: #2563eb; color: white; border: none; padding: 8px 16px;
      border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s;
    }
    button:hover { background: #1d4ed8; }
    #compass {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.6); padding: 6px 18px; border-radius: 20px;
      font-size: 14px; letter-spacing: 2px; font-weight: bold; color: #60a5fa;
      border: 1px solid rgba(96, 165, 250, 0.3);
    }
  </style>
</head>
<body>

<div id="compass">◄ ВОСТОК (E) &nbsp;&nbsp;&nbsp; • ЮГ (S) • &nbsp;&nbsp;&nbsp; ЗАПАД (W) ►</div>

<div id="ui">
  <div class="control-group">
    <label for="timeSlider">Положение Солнца (Восток ➔ Запад):</label>
    <input type="range" id="timeSlider" min="0" max="180" value="90">
  </div>
  <div class="control-group">
    <label for="moonOrbitSlider">Положение Луны на небе:</label>
    <input type="range" id="moonOrbitSlider" min="0" max="180" value="95">
  </div>
  <button id="playBtn">▶ Суточный ход</button>
</div>

<canvas id="sky"></canvas>

<script>
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');

const timeSlider = document.getElementById('timeSlider');
const moonOrbitSlider = document.getElementById('moonOrbitSlider');
const playBtn = document.getElementById('playBtn');

let isPlaying = false;

// Звезды
const stars = Array.from({ length: 350 }, () => ({
  x: Math.random(),
  y: Math.random() * 0.7,
  size: Math.random() * 1.5 + 0.5,
  alpha: Math.random() * 0.8 + 0.2
}));

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function render() {
  const w = canvas.width;
  const h = canvas.height;
  const horizonY = h * 0.75;

  // --- 1. АСТРОНОМИЧЕСКИЙ РАСЧЕТ ДВИЖЕНИЯ ПО ДУГЕ НА ЮГ ---
  // 0 deg = Восток (слева), 90 deg = Юг (центр), 180 deg = Запад (справа)
  const sunDeg = parseFloat(timeSlider.value);
  const sunRad = (sunDeg * Math.PI) / 180;

  const moonDeg = parseFloat(moonOrbitSlider.value);
  const moonRad = (moonDeg * Math.PI) / 180;

  // Максимальная высота подъема над горизонтом (на Юге)
  const maxAltitude = h * 0.45;

  // Координаты Солнца: X от 0 до w, Y очерчивает параболу/дугу
  const sunX = (sunDeg / 180) * w;
  const sunAlt = Math.sin(sunRad); // Высота над горизонтом (0..1)
  const sunY = horizonY - sunAlt * maxAltitude;

  // Координаты Луны (с учетом небольшого наклона орбиты в 5 градусов)
  const moonX = (moonDeg / 180) * w;
  const moonAlt = Math.sin(moonRad);
  const moonY = horizonY - moonAlt * (maxAltitude * 0.92);

  // --- 2. РАССЕИВАНИЕ СВЕТА В АТМОСФЕРЕ ---
  const opticalDepth = 1 / Math.max(0.04, sunAlt);

  let r, g, b;
  if (sunAlt > 0.12) {
    // День (голубое небо)
    r = Math.floor(120 - opticalDepth * 2);
    g = Math.floor(190 - opticalDepth * 4);
    b = Math.floor(250 - opticalDepth * 1.5);
  } else if (sunAlt > -0.05) {
    // Закат (справа) / Рассвет (слева)
    const t = (sunAlt + 0.05) / 0.17;
    r = Math.floor(255 * (1 - t * 0.5));
    g = Math.floor(110 * t + 20);
    b = Math.floor(180 * t);
  } else {
    // Ночь
    r = 4; g = 7; b = 18;
  }

  // Градиент неба
  const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
  skyGrad.addColorStop(0, `rgb(${Math.max(2, r - 35)}, ${Math.max(4, g - 35)}, ${Math.max(10, b - 25)})`);
  skyGrad.addColorStop(1, `rgb(${Math.max(10, r)}, ${Math.max(15, g)}, ${Math.max(25, b)})`);

  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, w, horizonY);

  // --- 3. ЗВЕЗДЫ ---
  const starVisibility = Math.max(0, Math.min(1, (-sunAlt - 0.02) * 5));
  if (starVisibility > 0) {
    ctx.save();
    stars.forEach(s => {
      ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha * starVisibility})`;
      ctx.beginPath();
      ctx.arc(s.x * w, s.y * horizonY, s.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }

  const angularRadius = Math.min(w, h) * 0.032;

  // Проверка Затмения
  const distSunMoon = Math.hypot(sunX - moonX, sunY - moonY);
  const isEclipse = distSunMoon < angularRadius * 1.2 && sunAlt > -0.05;

  // --- 4. СОЛНЦЕ ---
  if (sunY < horizonY + angularRadius * 2) {
    // Ореол Ми (Mie)
    const haloGrad = ctx.createRadialGradient(sunX, sunY, angularRadius, sunX, sunY, angularRadius * 7);
    const haloColor = sunAlt < 0.1 ? 'rgba(255, 100, 30,' : 'rgba(255, 245, 210,';
    haloGrad.addColorStop(0, `${haloColor} ${Math.max(0, sunAlt + 0.1) * 0.7})`);
    haloGrad.addColorStop(1, 'rgba(0,0,0,0)');

    ctx.fillStyle = haloGrad;
    ctx.beginPath();
    ctx.arc(sunX, sunY, angularRadius * 7, 0, Math.PI * 2);
    ctx.fill();

    // Корона при затмении
    if (isEclipse && distSunMoon < angularRadius * 0.3) {
      const coronaGrad = ctx.createRadialGradient(sunX, sunY, angularRadius, sunX, sunY, angularRadius * 3);
      coronaGrad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
      coronaGrad.addColorStop(0.5, 'rgba(180, 210, 255, 0.4)');
      coronaGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = coronaGrad;
      ctx.beginPath();
      ctx.arc(sunX, sunY, angularRadius * 3, 0, Math.PI * 2);
      ctx.fill();
    }

    // Солнечный диск
    ctx.fillStyle = sunAlt < 0.05 ? '#ff3300' : '#ffffff';
    ctx.beginPath();
    ctx.arc(sunX, sunY, angularRadius, 0, Math.PI * 2);
    ctx.fill();
  }

  // --- 5. ЛУНА И ФАЗЫ ---
  if (moonY < horizonY + angularRadius * 2) {
    ctx.save();
    
    // Темная сторона
    ctx.fillStyle = 'rgba(25, 30, 40, 0.96)';
    ctx.beginPath();
    ctx.arc(moonX, moonY, angularRadius, 0, Math.PI * 2);
    ctx.fill();

    // Направление на Солнце в 2D пространстве неба
    const dx = sunX - moonX;
    const dy = sunY - moonY;
    const angleToSun = Math.atan2(dy, dx);

    // Освещенная сторона
    ctx.fillStyle = '#f1f5f9';
    ctx.beginPath();
    ctx.arc(moonX, moonY, angularRadius, angleToSun - Math.PI / 2, angleToSun + Math.PI / 2);
    ctx.fill();

    ctx.restore();
  }

  // --- 6. ЛАНДШАФТ (Южный горизонт) ---
  ctx.fillStyle = '#040711';
  ctx.beginPath();
  ctx.moveTo(0, horizonY);
  for (let x = 0; x <= w; x += 40) {
    const hill = Math.sin(x * 0.004) * 12 + Math.cos(x * 0.008) * 8;
    ctx.lineTo(x, horizonY + hill);
  }
  ctx.lineTo(w, h);
  ctx.lineTo(0, h);
  ctx.closePath();
  ctx.fill();

  // Метки сторон света у горизонта
  ctx.fillStyle = '#475569';
  ctx.font = 'bold 12px sans-serif';
  ctx.fillText('В (Восток)', 20, horizonY + 30);
  ctx.fillText('ЮГ', w / 2 - 10, horizonY + 30);
  ctx.fillText('З (Запад)', w - 80, horizonY + 30);

  if (isPlaying) {
    let nextSun = (parseFloat(timeSlider.value) + 0.15);
    if (nextSun > 180) nextSun = 0;
    timeSlider.value = nextSun;

    let nextMoon = (parseFloat(moonOrbitSlider.value) + 0.18);
    if (nextMoon > 180) nextMoon = 0;
    moonOrbitSlider.value = nextMoon;

    requestAnimationFrame(render);
  }
}

timeSlider.addEventListener('input', render);
moonOrbitSlider.addEventListener('input', render);

playBtn.addEventListener('click', () => {
  isPlaying = !isPlaying;
  playBtn.textContent = isPlaying ? '⏸ Пауза' : '▶ Суточный ход';
  if (isPlaying) render();
});

render();
</script>
</body>
</html>
