<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шаг 2: Орбиты и Оптимизация</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #info {
            position: absolute; top: 10px; left: 10px; color: #fff;
            background: rgba(0, 0, 0, 0.7); padding: 10px 15px; border-radius: 8px;
        }
    </style>
</head>
<body>

<div id="info">
    <b>Шаг 2: Орбитальное движение (Оптимизированное)</b><br>
    • Используются контейнеры (Group) вместо сложных формул.<br>
    • Добавлены визуальные линии орбит.<br>
    <small>FPS не проседает благодаря правильной иерархии объектов.</small>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
    // 1. Инициализация сцены
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 25, 40);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    // Ограничиваем PixelRatio для 4K/Retina экранов (чтобы видеокарта не перегревалась)
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 2. Свет
    const ambientLight = new THREE.AmbientLight(0x222222);
    scene.add(ambientLight);

    const sunLight = new THREE.PointLight(0xffffff, 2, 300);
    sunLight.castShadow = true;
    // Оптимизируем размер карты теней для баланса качества и FPS
    sunLight.shadow.mapSize.width = 1024; 
    sunLight.shadow.mapSize.height = 1024;
    scene.add(sunLight);

    // 3. Создание ИЕРАРХИИ (Групп) для оптимизации вращения

    // А) Центр системы — Солнце
    const sunGeometry = new THREE.SphereGeometry(3, 32, 32);
    const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
    const sun = new THREE.Mesh(sunGeometry, sunMaterial);
    scene.add(sun);

    // Б) Группа для вращения Земли вокруг Солнца
    const earthSystemGroup = new THREE.Group();
    scene.add(earthSystemGroup); // Привязываем к сцене

    // Меш Земли (относительно группы смещен на 18 единиц)
    const earthGeometry = new THREE.SphereGeometry(1.2, 32, 32);
    const earthMaterial = new THREE.MeshStandardMaterial({ color: 0x2233ff, roughness: 0.6 });
    const earth = new THREE.Mesh(earthGeometry, earthMaterial);
    earth.position.set(18, 0, 0); 
    earth.castShadow = true;
    earth.receiveShadow = true;
    earthSystemGroup.add(earth); // Добавляем Землю ВНУТРЬ группы

    // В) Группа для вращения Луны вокруг Земли
    const moonSystemGroup = new THREE.Group();
    moonSystemGroup.position.set(18, 0, 0); // Ставим в ту же точку, где Земля
    earthSystemGroup.add(moonSystemGroup); // Добавляем в группу Земли!

    // Меш Луны (относительно Земли смещен на 3 единицы)
    const moonGeometry = new THREE.SphereGeometry(0.35, 16, 16); // Меньше полигонов для Луны!
    const moonMaterial = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.9 });
    const moon = new THREE.Mesh(moonGeometry, moonMaterial);
    moon.position.set(3, 0, 0);
    moon.castShadow = true;
    moon.receiveShadow = true;
    moonSystemGroup.add(moon);

    // 4. Добавляем линии орбит (для наглядности)
    function createOrbitLine(radius) {
        const points = [];
        for (let i = 0; i <= 64; i++) {
            const theta = (i / 64) * Math.PI * 2;
            points.push(new THREE.Vector3(Math.cos(theta) * radius, 0, Math.sin(theta) * radius));
        }
        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const material = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.15 });
        return new THREE.LineLoop(geometry, material);
    }
    scene.add(createOrbitLine(18)); // Орбита Земли

    // 5. Оптимизированный цикл анимации
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);

        const delta = clock.getDelta(); // Получаем дельту времени для стабильной скорости FPS

        // Вместо тяжелых формул просто вращаем группы по оси Y!
        earthSystemGroup.rotation.y += 0.5 * delta;  // Вращение Земли вокруг Солнца
        earth.rotation.y += 2.0 * delta;             // Собственное вращение Земли (день/ночь)
        moonSystemGroup.rotation.y += 1.5 * delta;   // Вращение Луны вокруг Земли

        controls.update();
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
