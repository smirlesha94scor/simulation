<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Интерактивный декодер стереограмм</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background: #1e1e1e;
            color: #fff;
            margin-top: 30px;
        }
        #drop-zone {
            width: 80%;
            max-width: 600px;
            height: 100px;
            border: 3px dashed #4CAF50;
            border-radius: 10px;
            margin: 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2d2d2d;
            color: #bbb;
            font-size: 16px;
        }
        #drop-zone.hover { background: #388E3C; color: #fff; }
        .controls {
            margin: 15px auto;
            display: none;
        }
        input[type=range] { width: 300px; }
        canvas { display: none; }
        #result img {
            max-width: 100%;
            margin-top: 15px;
            border-radius: 5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <h2>Декодер стереограмм</h2>
    <div id="drop-zone">Перетащите картинку сюда</div>

    <div class="controls" id="controls">
        <label>Период узора: <span id="period-val">100</span> px</label><br>
        <input type="range" id="period-range" min="50" max="250" value="100">
    </div>

    <h3 id="status"></h3>
    <canvas id="canvas"></canvas>
    <div id="result"></div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const statusText = document.getElementById('status');
        const resultDiv = document.getElementById('result');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const controls = document.getElementById('controls');
        const periodRange = document.getElementById('period-range');
        const periodVal = document.getElementById('period-val');

        let originalImageData = null;
        let imgWidth = 0;
        let imgHeight = 0;

        // Настройка Drag and Drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, e => { e.preventDefault(); e.stopPropagation(); }, false);
        });
        dropZone.addEventListener('dragenter', () => dropZone.classList.add('hover'));
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('hover'));
        dropZone.addEventListener('drop', e => {
            dropZone.classList.remove('hover');
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                loadImage(e.dataTransfer.files[0]);
            }
        });

        function loadImage(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    imgWidth = img.width;
                    imgHeight = img.height;
                    canvas.width = imgWidth;
                    canvas.height = imgHeight;
                    ctx.drawImage(img, 0, 0);
                    originalImageData = ctx.getImageData(0, 0, imgWidth, imgHeight);

                    // Автоподбор в более узком и реалистичном диапазоне (от 70 до 160 px)
                    const bestP = autoFindPeriod(originalImageData, imgWidth, imgHeight);
                    periodRange.value = bestP;
                    periodVal.innerText = bestP;
                    controls.style.display = 'block';

                    render(bestP);
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function autoFindPeriod(imgData, width, height) {
            const midY = Math.floor(height / 2);
            let bestPeriod = 100;
            let minDiffSum = Infinity;
            const data = imgData.data;

            for (let p = 70; p <= 160; p++) {
                let diffSum = 0;
                for (let x = p; x < width - p; x += 3) {
                    const idx1 = (midY * width + x) * 4;
                    const idx2 = (midY * width + (x + p)) * 4;
                    diffSum += Math.abs(data[idx1] - data[idx2]) + 
                               Math.abs(data[idx1+1] - data[idx2+1]) + 
                               Math.abs(data[idx1+2] - data[idx2+2]);
                }
                if (diffSum < minDiffSum) {
                    minDiffSum = diffSum;
                    bestPeriod = p;
                }
            }
            return bestPeriod;
        }

        function render(period) {
            const data = originalImageData.data;
            const outputData = new Uint8ClampedArray(data.length);
            const contrastFactor = 3.5;

            for (let y = 0; y < imgHeight; y++) {
                for (let x = 0; x < imgWidth; x++) {
                    const idx = (y * imgWidth + x) * 4;
                    const targetX = x + parseInt(period);

                    if (targetX < imgWidth) {
                        const targetIdx = (y * imgWidth + targetX) * 4;
                        const r = Math.abs(data[idx] - data[targetIdx]);
                        const g = Math.abs(data[idx + 1] - data[targetIdx + 1]);
                        const b = Math.abs(data[idx + 2] - data[targetIdx + 2]);

                        outputData[idx]     = Math.min(255, r * contrastFactor);
                        outputData[idx + 1] = Math.min(255, g * contrastFactor);
                        outputData[idx + 2] = Math.min(255, b * contrastFactor);
                        outputData[idx + 3] = 255;
                    } else {
                        outputData[idx] = outputData[idx+1] = outputData[idx+2] = 0;
                        outputData[idx + 3] = 255;
                    }
                }
            }

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = imgWidth;
            tempCanvas.height = imgHeight;
            const tempCtx = tempCanvas.getContext('2d');
            const newImgData = tempCtx.createImageData(imgWidth, imgHeight);
            newImgData.data.set(outputData);
            tempCtx.putImageData(newImgData, 0, 0);

            resultDiv.innerHTML = '';
            const resultImg = document.createElement('img');
            resultImg.src = tempCanvas.toDataURL('image/png');
            resultDiv.appendChild(resultImg);
            statusText.innerText = `Текущий период: ${period}px`;
        }

        periodRange.addEventListener('input', function() {
            periodVal.innerText = this.value;
            if (originalImageData) {
                render(this.value);
            }
        });
    </script>
</body>
</html>
