<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>До 1 сентября</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }

        .countdown-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 25px;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .timer {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px 10px;
            border-radius: 12px;
            min-width: 75px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .number-wrapper {
            position: relative;
            height: 2.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .number {
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1;
            position: absolute;
            width: 100%;
            text-align: center;
            left: 0;
            top: 0;
            transition: filter 0.1s linear, opacity 0.1s linear;
        }

        .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
            opacity: 0.85;
        }

        @media (max-width: 480px) {
            .timer {
                gap: 8px;
            }
            .time-box {
                min-width: 60px;
                padding: 10px 5px;
            }
            .number {
                font-size: 1.6rem;
            }
            .number-wrapper {
                height: 1.6rem;
            }
            .label {
                font-size: 0.65rem;
            }
        }
    </style>
</head>
<body>

    <div class="countdown-container">
        <h1>До 1 сентября осталось</h1>
        <div class="timer">
            <div class="time-box">
                <div class="number-wrapper">
                    <span class="number" id="days">00</span>
                </div>
                <span class="label">Дней</span>
            </div>
            <div class="time-box">
                <div class="number-wrapper">
                    <span class="number" id="hours">00</span>
                </div>
                <span class="label">Часов</span>
            </div>
            <div class="time-box">
                <div class="number-wrapper">
                    <span class="number" id="minutes">00</span>
                </div>
                <span class="label">Минут</span>
            </div>
            <div class="time-box">
                <div class="number-wrapper">
                    <span class="number" id="seconds">00</span>
                </div>
                <span class="label">Секунд</span>
            </div>
        </div>
    </div>

    <script>
        function transitionBrightness(element, newValue) {
            const wrapper = element.parentElement;
            const newNum = parseInt(newValue);
            const isNewEven = newNum % 2 === 0;

            // Создаем элемент для новой (уменьшенной) цифры
            const newDigit = document.createElement('span');
            newDigit.className = 'number';
            newDigit.innerText = newValue;

            // Если новая цифра четная: старая (нечетная) угасает 100% -> 0%, новая разгорается 0% -> 100%
            // Если новая цифра нечетная: наоборот
            let initialNewOpacity = isNewEven ? 0 : 1;
            let initialOldOpacity = isNewEven ? 1 : 0;

            newDigit.style.opacity = initialNewOpacity;
            newDigit.style.filter = `brightness(${initialNewOpacity * 100}%)`;
            
            wrapper.appendChild(newDigit);

            let step = 0;
            const interval = setInterval(() => {
                step++;
                const progress = step / 10; // 0.1 -> 1.0

                let oldOpacity, newOpacity;

                if (isNewEven) {
                    // Переход к ЧЁТНОЙ цифре (например, с 3 на 2): 
                    // 3 затухает (100% -> 0%), 2 проявляется (0% -> 100%)
                    oldOpacity = 1 - progress;
                    newOpacity = progress;
                } else {
                    // Переход к НЕЧЁТНОЙ цифре (например, с 2 на 1): 
                    // 2 угасает (0% -> 100% инверсивно), 1 проявляется (100% -> 0% инверсивно)
                    oldOpacity = progress;
                    newOpacity = 1 - progress;
                }

                element.style.opacity = oldOpacity;
                element.style.filter = `brightness(${oldOpacity * 100}%)`;

                newDigit.style.opacity = newOpacity;
                newDigit.style.filter = `brightness(${newOpacity * 100}%)`;

                if (step >= 10) {
                    clearInterval(interval);
                    element.innerText = newValue;
                    element.style.opacity = '1';
                    element.style.filter = 'brightness(100%)';
                    newDigit.remove();
                }
            }, 100);
        }

        function updateElement(id, newValue) {
            const el = document.getElementById(id);
            if (el.innerText !== newValue) {
                transitionBrightness(el, newValue);
            }
        }

        function updateTimer() {
            const now = new Date();
            let targetYear = now.getFullYear();
            
            let targetDate = new Date(`September 1, ${targetYear} 00:00:00`);
            if (now > targetDate) {
                targetDate = new Date(`September 1, ${targetYear + 1} 00:00:00`);
            }

            const diff = targetDate - now;

            const d = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, '0');
            const h = String(Math.floor((diff / (1000 * 60 * 60)) % 24)).padStart(2, '0');
            const m = String(Math.floor((diff / 1000 / 60) % 60)).padStart(2, '0');
            const s = String(Math.floor((diff / 1000) % 60)).padStart(2, '0');

            updateElement('days', d);
            updateElement('hours', h);
            updateElement('minutes', m);
            updateElement('seconds', s);
        }

        setInterval(updateTimer, 1000);
        updateTimer();
    </script>

</body>
</html>
