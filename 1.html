<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Minimal 2D Satisfactory</title>
  <style>
    body {
      margin: 0;
      background: #1a1a1a;
      color: #fff;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #ui {
      margin: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
      background: #2a2a2a;
      padding: 10px;
      border-radius: 5px;
      flex-wrap: wrap;
    }
    button {
      background: #ff9900;
      border: none;
      color: #000;
      padding: 8px 12px;
      font-weight: bold;
      cursor: pointer;
    }
    button.craft-btn {
      background: #4caf50;
      color: #fff;
    }
    button.active {
      outline: 3px solid #fff;
    }
    canvas {
      border: 2px solid #444;
      background: #111;
    }
    .info {
      font-size: 14px;
      color: #aaa;
      margin-top: 5px;
    }
  </style>
</head>
<body>

<div id="ui">
  <div>⚡ Энергия: <span id="power">-</span></div>
  <div>📦 Инвентарь: Руда: <span id="inv-ore">0</span> | Слитки: <span id="inv-ingot">0</span></div>
  <div>| Ручной крафт:</div>
  <button class="craft-btn" onclick="craftIngot()">🔨 Сделать слиток (1 Руда)</button>
  <div>| Постройки:</div>
  <button id="btn-miner" onclick="setMode('miner')">⛏️ Вышка (5 Слитков)</button>
  <button id="btn-smelter" onclick="setMode('smelter')">🔥 Плавильня (5 Слитков)</button>
  <button id="btn-belt" onclick="setMode('belt')">➡️ Конвейер (1 Слиток)</button>
  <button id="btn-clear" onclick="setMode('select')">🔍 Инспекция</button>
</div>

<canvas id="game" width="800" height="600"></canvas>
<div class="info">Клик мышкой — поставить/добыть. R — повернуть направление постройки (Текущее: <span id="dir-info">Восток</span>).</div>

<script>
const CANVAS_SIZE = { w: 800, h: 600 };
const TILE = 40;
const GRID = { cols: CANVAS_SIZE.w / TILE, rows: CANVAS_SIZE.h / TILE };

// Константы направлений: 0: Восток (Right), 1: Юг (Down), 2: Запад (Left), 3: Север (Up)
const DIRS = [{x:1,y:0}, {x:0,y:1}, {x:-1,y:0}, {x:0,y:-1}];
const DIR_NAMES = ["Восток", "Юг", "Запад", "Север"];

// Состояние игры: 0 слитков на старте, добываем и плавим сами!
const state = {
  inventory: { iron_ore: 0, iron_ingot: 0 },
  powerProduction: 20,
  powerConsumption: 0,
  buildMode: 'select',
  buildDir: 0,
  grid: Array(GRID.cols).fill(null).map(() => Array(GRID.rows).fill(null)),
  resourceDeposits: []
};

// Генерация рудных жил
state.resourceDeposits.push({x: 3, y: 7}, {x: 3, y: 8}, {x: 4, y: 7});

// Функция ручного крафта
function craftIngot() {
  if (state.inventory.iron_ore > 0) {
    state.inventory.iron_ore--;
    state.inventory.iron_ingot++;
  }
}

// Классы построек
class Miner {
  constructor(x, y) {
    this.type = 'miner';
    this.x = x; this.y = y;
    this.progress = 0;
    this.powerReq = 5;
  }
  tick() {
    this.progress += 1;
    if (this.progress >= 120) {
      this.progress = 0;
      const target = getEntity(this.x + 1, this.y);
      if (target && target.acceptItem) {
        target.acceptItem('iron_ore');
      } else {
        state.inventory.iron_ore++;
      }
    }
  }
}

class Smelter {
  constructor(x, y) {
    this.type = 'smelter';
    this.x = x; this.y = y;
    this.bufferIn = 0;
    this.progress = 0;
    this.powerReq = 10;
  }
  acceptItem(item) {
    if (item === 'iron_ore' && this.bufferIn < 10) {
      this.bufferIn++;
      return true;
    }
    return false;
  }
  tick() {
    if (this.bufferIn > 0) {
      this.progress++;
      if (this.progress >= 180) {
        this.progress = 0;
        this.bufferIn--;
        const target = getEntity(this.x + 1, this.y);
        if (target && target.acceptItem) {
          target.acceptItem('iron_ingot');
        } else {
          state.inventory.iron_ingot++;
        }
      }
    }
  }
}

class Belt {
  constructor(x, y, dirIndex) {
    this.type = 'belt';
    this.x = x; this.y = y;
    this.dir = dirIndex;
    this.item = null;
    this.progress = 0;
  }
  acceptItem(item) {
    if (!this.item) {
      this.item = item;
      this.progress = 0;
      return true;
    }
    return false;
  }
  tick() {
    if (this.item) {
      this.progress += 2;
      if (this.progress >= 100) {
        const d = DIRS[this.dir];
        const target = getEntity(this.x + d.x, this.y + d.y);
        if (target && target.acceptItem && target.acceptItem(this.item)) {
          this.item = null;
          this.progress = 0;
        } else if (!target) {
          if (this.item === 'iron_ore') state.inventory.iron_ore++;
          if (this.item === 'iron_ingot') state.inventory.iron_ingot++;
          this.item = null;
          this.progress = 0;
        }
      }
    }
  }
}

function getEntity(x, y) {
  if (x < 0 || x >= GRID.cols || y < 0 || y >= GRID.rows) return null;
  return state.grid[x][y];
}

function setMode(mode) {
  state.buildMode = mode;
  document.querySelectorAll('#ui button').forEach(b => {
    if (!b.classList.contains('craft-btn')) b.classList.remove('active');
  });
  if (mode !== 'select') document.getElementById(`btn-${mode}`).classList.add('active');
}

window.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'К' || e.key === 'к') {
    state.buildDir = (state.buildDir + 1) % 4;
    document.getElementById('dir-info').innerText = DIR_NAMES[state.buildDir];
  }
});

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const gx = Math.floor((e.clientX - rect.left) / TILE);
  const gy = Math.floor((e.clientY - rect.top) / TILE);

  const existing = state.grid[gx][gy];

  if (state.buildMode === 'select') {
    const deposit = state.resourceDeposits.find(d => d.x === gx && d.y === gy);
    if (deposit) {
      state.inventory.iron_ore++;
    }
    return;
  }

  if (existing) return;

  if (state.buildMode === 'miner') {
    const isDeposit = state.resourceDeposits.some(d => d.x === gx && d.y === gy);
    if (isDeposit && state.inventory.iron_ingot >= 5) {
      state.inventory.iron_ingot -= 5;
      state.grid[gx][gy] = new Miner(gx, gy);
    }
  } else if (state.buildMode === 'smelter') {
    if (state.inventory.iron_ingot >= 5) {
      state.inventory.iron_ingot -= 5;
      state.grid[gx][gy] = new Smelter(gx, gy);
    }
  } else if (state.buildMode === 'belt') {
    if (state.inventory.iron_ingot >= 1) {
      state.inventory.iron_ingot -= 1;
      state.grid[gx][gy] = new Belt(gx, gy, state.buildDir);
    }
  }
});

function gameLoop() {
  let consumption = 0;
  for (let x = 0; x < GRID.cols; x++) {
    for (let y = 0; y < GRID.rows; y++) {
      const e = state.grid[x][y];
      if (e && e.powerReq) consumption += e.powerReq;
    }
  }
  state.powerConsumption = consumption;
  const hasPower = state.powerProduction >= state.powerConsumption;

  if (hasPower) {
    for (let x = 0; x < GRID.cols; x++) {
      for (let y = 0; y < GRID.rows; y++) {
        const e = state.grid[x][y];
        if (e) e.tick();
      }
    }
  }

  ctx.clearRect(0, 0, CANVAS_SIZE.w, CANVAS_SIZE.h);

  ctx.strokeStyle = '#222';
  for (let x = 0; x < GRID.cols; x++) {
    for (let y = 0; y < GRID.rows; y++) {
      ctx.strokeRect(x * TILE, y * TILE, TILE, TILE);
    }
  }

  ctx.fillStyle = '#795548';
  state.resourceDeposits.forEach(d => {
    ctx.fillRect(d.x * TILE + 4, d.y * TILE + 4, TILE - 8, TILE - 8);
  });

  for (let x = 0; x < GRID.cols; x++) {
    for (let y = 0; y < GRID.rows; y++) {
      const e = state.grid[x][y];
      if (!e) continue;

      const px = x * TILE;
      const py = y * TILE;

      if (e.type === 'miner') {
        ctx.fillStyle = '#ff9900';
        ctx.fillRect(px + 2, py + 2, TILE - 4, TILE - 4);
        ctx.fillStyle = '#000';
        ctx.fillText('⛏️', px + 12, py + 24);
      } else if (e.type === 'smelter') {
        ctx.fillStyle = '#e65100';
        ctx.fillRect(px + 2, py + 2, TILE - 4, TILE - 4);
        ctx.fillStyle = '#fff';
        ctx.fillText(`🔥${e.bufferIn}`, px + 8, py + 24);
      } else if (e.type === 'belt') {
        ctx.fillStyle = '#555';
        ctx.fillRect(px + 4, py + 4, TILE - 8, TILE - 8);
        
        ctx.fillStyle = '#aaa';
        const arrows = ["➔", "⬇", "⬅", "⬆"];
        ctx.fillText(arrows[e.dir], px + 14, py + 24);

        if (e.item) {
          ctx.fillStyle = e.item === 'iron_ore' ? '#a1887f' : '#e0e0e0';
          const progressOffset = (e.progress / 100) * 16 - 8;
          const dx = DIRS[e.dir].x * progressOffset;
          const dy = DIRS[e.dir].y * progressOffset;
          ctx.beginPath();
          ctx.arc(px + 20 + dx, py + 20 + dy, 6, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
  }

  document.getElementById('power').innerText = `${state.powerConsumption} / ${state.powerProduction} МВт`;
  document.getElementById('inv-ore').innerText = state.inventory.iron_ore;
  document.getElementById('inv-ingot').innerText = state.inventory.iron_ingot;

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
