<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Декодер стереограмм с быстрой анимацией (500 мс)</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background: #1e1e1e;
            color: #fff;
            margin-top: 20px;
        }
        #drop-zone {
            width: 80%;
            max-width: 600px;
            height: 70px;
            border: 3px dashed #4CAF50;
            border-radius: 10px;
            margin: 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2d2d2d;
            color: #bbb;
            font-size: 15px;
            cursor: pointer;
        }
        #drop-zone.hover { background: #388E3C; color: #fff; }
        #file-input { display: none; }
        
        .controls {
            margin: 15px auto;
            display: none;
        }
        input[type=range] { width: 250px; }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #45a049; }
        canvas { display: none; }
        #result img {
            max-width: 100%;
            margin-top: 15px;
            border-radius: 5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <h2>Декодер стереограмм (Автоперебор 500 мс)</h2>
    <div id="drop-zone">Перетащите картинку сюда или кликните для выбора</div>
    <input type="file" id="file-input" accept="image/*">

    <div class="controls" id="controls">
        <button id="anim-btn">▶ Запустить автоперебор (500 мс)</button><br><br>

        <label>Горизонтальный период (X): <span id="val-x">0</span> px</label><br>
        <input type="range" id="range-x" min="0" max="250" value="0"><br><br>

        <label>Вертикальный сдвиг (Y): <span id="val-y">0</span> px</label><br>
        <input type="range" id="range-y" min="-10" max="10" value="0">
    </div>

    <h3 id="status"></h3>
    <div id="result"></div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const statusText = document.getElementById('status');
        const resultDiv = document.getElementById('result');
        const controls = document.getElementById('controls');
        
        const rangeX = document.getElementById('range-x');
        const rangeY = document.getElementById('range-y');
        const valX = document.getElementById('val-x');
        const valY = document.getElementById('val-y');
        const animBtn = document.getElementById('anim-btn');

        let originalImageData = null;
        let imgWidth = 0;
        let imgHeight = 0;
        let animInterval = null;

        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', e => {
            if (e.target.files[0]) loadImage(e.target.files[0]);
        });

        // Drag and Drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, e => { e.preventDefault(); e.stopPropagation(); }, false);
        });
        dropZone.addEventListener('drop', e => {
            if (e.dataTransfer.files[0]) loadImage(e.dataTransfer.files[0]);
        });

        function loadImage(file) {
            stopAnimation();
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    imgWidth = img.width;
                    imgHeight = img.height;
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = imgWidth;
                    canvas.height = imgHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    
                    originalImageData = ctx.getImageData(0, 0, imgWidth, imgHeight);
                    controls.style.display = 'block';
                    render();
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function render() {
            if (!originalImageData) return;

            const shiftX = parseInt(rangeX.value);
            const shiftY = parseInt(rangeY.value);
            
            valX.innerText = shiftX;
            valY.innerText = shiftY;

            const data = originalImageData.data;
            const outputData = new Uint8ClampedArray(data.length);
            const contrastFactor = 3.5;

            for (let y = 0; y < imgHeight; y++) {
                for (let x = 0; x < imgWidth; x++) {
                    const idx = (y * imgWidth + x) * 4;
                    
                    const targetX = x + shiftX;
                    const targetY = y + shiftY;

                    if (targetX < imgWidth && targetX >= 0 && targetY >= 0 && targetY < imgHeight) {
                        const targetIdx = (targetY * imgWidth + targetX) * 4;
                        
                        const r = Math.abs(data[idx] - data[targetIdx]);
                        const g = Math.abs(data[idx + 1] - data[targetIdx + 1]);
                        const b = Math.abs(data[idx + 2] - data[targetIdx + 2]);

                        outputData[idx]     = Math.min(255, r * contrastFactor);
                        outputData[idx + 1] = Math.min(255, g * contrastFactor);
                        outputData[idx + 2] = Math.min(255, b * contrastFactor);
                        outputData[idx + 3] = 255;
                    } else {
                        outputData[idx] = outputData[idx+1] = outputData[idx+2] = 0;
                        outputData[idx + 3] = 255;
                    }
                }
            }

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = imgWidth;
            tempCanvas.height = imgHeight;
            const tempCtx = tempCanvas.getContext('2d');
            const newImgData = tempCtx.createImageData(imgWidth, imgHeight);
            newImgData.data.set(outputData);
            tempCtx.putImageData(newImgData, 0, 0);

            resultDiv.innerHTML = '';
            const resultImg = document.createElement('img');
            resultImg.src = tempCanvas.toDataURL('image/png');
            resultDiv.appendChild(resultImg);
            statusText.innerText = `Текущий сдвиг (X: ${shiftX}px, Y: ${shiftY}px)`;
        }

        animBtn.addEventListener('click', () => {
            if (animInterval) {
                stopAnimation();
            } else {
                startAnimation();
            }
        });

        function startAnimation() {
            animBtn.innerText = '⏹ Остановить автоперебор';
            animBtn.style.background = '#f44336';
            
            animInterval = setInterval(() => {
                let xVal = parseInt(rangeX.value);
                let yVal = parseInt(rangeY.value);
                
                xVal += 1;
                if (xVal > parseInt(rangeX.max)) {
                    xVal = parseInt(rangeX.min);
                    yVal += 1; // Сдвигаем вертикаль на 1 пиксель после полного прохода X
                    if (yVal > parseInt(rangeY.max)) {
                        yVal = parseInt(rangeY.min);
                    }
                    rangeY.value = yVal;
                }
                rangeX.value = xVal;
                render();
            }, 500); // Интервал установлен на 500 миллисекунд
        }

        function stopAnimation() {
            if (animInterval) {
                clearInterval(animInterval);
                animInterval = null;
                animBtn.innerText = '▶ Запустить автоперебор (500 мс)';
                animBtn.style.background = '#4CAF50';
            }
        }

        rangeX.addEventListener('input', () => { stopAnimation(); render(); });
        rangeY.addEventListener('input', () => { stopAnimation(); render(); });
    </script>
</body>
</html>
