<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Парадокс огурцов</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 10px;
        }
        .container {
            background: white;
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 1100px;
            height: 100%;
            max-height: 98vh;
            display: flex;
            flex-direction: column;
        }
        h1 {
            color: #2c3e50;
            font-size: 18px;
            text-align: center;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        .main-content {
            display: flex;
            gap: 15px;
            flex: 1;
            min-height: 0;
        }
        .controls-panel {
            flex: 1;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        label {
            font-weight: bold;
            font-size: 11px;
        }
        input {
            width: 100%;
            padding: 5px 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 12px;
        }
        .result {
            padding: 8px;
            background-color: #e8f8f5;
            border: 1px solid #a3e4d7;
            border-radius: 6px;
        }
        .result h3 {
            font-size: 13px;
            color: #16a085;
            margin-bottom: 2px;
        }
        .explanation {
            font-size: 11px;
            color: #555;
            line-height: 1.2;
        }
        .pairs-container {
            flex: 1;
            min-height: 100px;
            background: #fafafa;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 6px;
            display: flex;
            flex-direction: column;
        }
        .pairs-header {
            font-weight: bold;
            font-size: 11px;
            color: #2c3e50;
            margin-bottom: 4px;
        }
        .pairs-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .pair-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 6px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .pair-item:hover {
            background: #27ae60;
            color: white;
            border-color: #27ae60;
        }
        .charts-panel {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
        }
        .chart-box {
            flex: 1;
            position: relative;
            min-height: 0;
            background: #fafafa;
            border-radius: 8px;
            padding: 5px;
            border: 1px solid #eee;
        }
        canvas {
            width: 100% !important;
            height: 100% !important;
        }

        @media (max-width: 768px) {
            body { overflow: auto; height: auto; }
            .container { max-height: none; height: auto; }
            .main-content { flex-direction: column; }
            .controls-panel { max-width: 100%; }
            .chart-box { min-height: 220px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Интерактивный «Парадокс огурцов»</h1>
    
    <div class="main-content">
        <!-- Панель управления -->
        <div class="controls-panel">
            <div class="input-group">
                <label for="initialWeight">Начальный вес (кг):</label>
                <input type="number" id="initialWeight" value="100" min="0.1" step="any">
            </div>

            <div class="input-group">
                <label for="targetWeight">Желаемый вес после усыхания (кг):</label>
                <input type="number" id="targetWeight" value="50" min="0.1" step="any">
            </div>

            <div class="input-group">
                <label for="initialWater">Текущая начальная влажность (%):</label>
                <input type="number" id="initialWater" value="99" min="0.2" max="99.9" step="0.1">
            </div>

            <div class="input-group">
                <label for="finalWater">Текущая конечная влажность (%):</label>
                <input type="number" id="finalWater" value="98" min="0.1" max="98.9" step="0.1" readonly style="background: #f0f0f0;">
            </div>

            <div class="result">
                <h3>Результат:</h3>
                <div class="explanation" id="explanationText"></div>
            </div>

            <!-- Список всех пар влажности -->
            <div class="pairs-container">
                <div class="pairs-header">Допустимые пары влажностей ($W_1 \rightarrow W_2$):</div>
                <div class="pairs-list" id="pairsList"></div>
            </div>
        </div>

        <!-- Панель графиков -->
        <div class="charts-panel">
            <div class="chart-box">
                <canvas id="comparisonChart"></canvas>
            </div>
            <div class="chart-box">
                <canvas id="humidityChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    let humidityChartInstance = null;
    let comparisonChartInstance = null;

    function applyPair(w1, w2) {
        document.getElementById('initialWater').value = w1.toFixed(1);
        document.getElementById('finalWater').value = w2.toFixed(1);
        calculateCucumbers();
    }

    function generateHumidityPairs(m1, targetM2) {
        const listContainer = document.getElementById('pairsList');
        listContainer.innerHTML = '';

        if (targetM2 >= m1 || targetM2 <= 0) {
            listContainer.innerHTML = '<div style="font-size:10px; color:#e74c3c;">Конечная масса должна быть меньше начальной.</div>';
            return;
        }

        // Перебираем возможную начальную влажность от 99.9% вниз
        let count = 0;
        for (let w1 = 99.9; w1 >= 10; w1 -= 1) {
            const dryMass = (m1 * (100 - w1)) / 100;
            
            // Проверяем, может ли при такой начальной влажности получиться целевой вес
            if (targetM2 > dryMass) {
                const w2 = (1 - (dryMass / targetM2)) * 100;
                if (w2 >= 0 && w2 < w1) {
                    count++;
                    const item = document.createElement('div');
                    item.className = 'pair-item';
                    item.onclick = () => applyPair(w1, w2);
                    item.innerHTML = `<span>Старт: <b>${w1.toFixed(1)}%</b></span> <span>→</span> <span>Финиш: <b>${w2.toFixed(1)}%</b></span>`;
                    listContainer.appendChild(item);
                }
            }
        }

        if (count === 0) {
            listContainer.innerHTML = '<div style="font-size:10px; color:#7f8c8d;">Нет возможных пар для этих масс.</div>';
        }
    }

    function calculateCucumbers() {
        const m1 = parseFloat(document.getElementById('initialWeight').value);
        const targetM2 = parseFloat(document.getElementById('targetWeight').value);
        let w1 = parseFloat(document.getElementById('initialWater').value);

        if (isNaN(m1) || isNaN(targetM2) || isNaN(w1) || m1 <= 0 || targetM2 <= 0 || targetM2 >= m1) {
            return;
        }

        const dryMass = (m1 * (100 - w1)) / 100;
        
        // Коррекция если вес меньше сухого остатка
        if (targetM2 <= dryMass) {
            document.getElementById('explanationText').innerHTML = `<span style="color:#e74c3c">Ошибка: вес не может быть меньше массы сухого вещества (${dryMass.toFixed(2)} кг).</span>`;
            return;
        }

        const w2 = (1 - (dryMass / targetM2)) * 100;
        document.getElementById('finalWater').value = w2.toFixed(2);

        const initialWaterMass = m1 - dryMass;
        const finalWaterMass = targetM2 - dryMass;

        document.getElementById('explanationText').innerHTML = `
            Сухой остаток: <b>${dryMass.toFixed(2)} кг</b><br>
            Потеря воды: <b>${(initialWaterMass - finalWaterMass).toFixed(2)} кг</b><br>
            Соотношение: <b>${w1.toFixed(1)}%</b> → <b>${w2.toFixed(1)}%</b>
        `;

        renderComparisonChart(dryMass, initialWaterMass, finalWaterMass);
        renderHumidityChart(m1, w1, w2, dryMass);
    }

    function renderComparisonChart(dryMass, initialWaterMass, finalWaterMass) {
        const ctx = document.getElementById('comparisonChart').getContext('2d');
        if (comparisonChartInstance) comparisonChartInstance.destroy();

        comparisonChartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['До усыхания', 'После усыхания'],
                datasets: [
                    { label: 'Сухое вещество (кг)', data: [dryMass.toFixed(2), dryMass.toFixed(2)], backgroundColor: '#e67e22' },
                    { label: 'Масса воды (кг)', data: [initialWaterMass.toFixed(2), finalWaterMass.toFixed(2)], backgroundColor: '#3498db' }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 150 },
                plugins: { title: { display: true, text: 'Состав массы (До / После)', font: { size: 11 } } },
                scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } }
            }
        });
    }

    function renderHumidityChart(m1, w1, selectedW2, dryMass) {
        const labels = [];
        const data = [];

        const step = Math.max(1, Math.floor(w1 / 15));
        for (let w = 0; w < w1; w += step) {
            labels.push(`${w}%`);
            data.push(((dryMass / (100 - w)) * 100).toFixed(2));
        }

        labels.push(`${selectedW2.toFixed(1)}%`);
        data.push(((dryMass / (100 - selectedW2)) * 100).toFixed(2));
        labels.push(`${w1.toFixed(1)}%`);
        data.push(m1.toFixed(2));

        const combined = labels.map((label, i) => ({ x: parseFloat(label), label, y: parseFloat(data[i]) }))
                               .sort((a, b) => a.x - b.x);

        const ctx = document.getElementById('humidityChart').getContext('2d');
        if (humidityChartInstance) humidityChartInstance.destroy();

        humidityChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: combined.map(item => item.label),
                datasets: [{
                    label: 'Масса (кг) от влажности (%)',
                    data: combined.map(item => item.y),
                    borderColor: '#27ae60',
                    backgroundColor: 'rgba(39, 174, 96, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 150 },
                plugins: { title: { display: true, text: 'Кривая зависимости массы от влажности', font: { size: 11 } } },
                scales: { y: { beginAtZero: true } }
            }
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        const initialWeight = document.getElementById('initialWeight');
        const targetWeight = document.getElementById('targetWeight');
        const initialWater = document.getElementById('initialWater');

        const updateAll = () => {
            generateHumidityPairs(parseFloat(initialWeight.value), parseFloat(targetWeight.value));
            calculateCucumbers();
        };

        initialWeight.addEventListener('input', updateAll);
        targetWeight.addEventListener('input', updateAll);
        initialWater.addEventListener('input', calculateCucumbers);

        updateAll();
    });
</script>

</body>
</html>
