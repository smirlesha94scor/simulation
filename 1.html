<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таймер на 10 минут</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            gap: 25px;
            padding: 20px;
        }

        .countdown-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 25px;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .timer {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px 10px;
            border-radius: 12px;
            min-width: 90px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .number-wrapper {
            position: relative;
            height: 2.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .number {
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1;
            position: absolute;
            width: 100%;
            text-align: center;
            left: 0;
            top: 0;
        }

        .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
            opacity: 0.85;
            display: block;
        }

        /* Панель индикатора прозрачности */
        .opacity-info {
            margin-top: 25px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .opacity-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .opacity-item span {
            font-weight: 700;
            font-size: 1rem;
        }

        @media (max-width: 480px) {
            .timer { gap: 10px; }
            .time-box { min-width: 75px; padding: 10px 5px; }
            .number { font-size: 1.8rem; }
            .number-wrapper { height: 1.8rem; }
            .label { font-size: 0.65rem; }
            .opacity-info { font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <div class="countdown-container">
        <h1>Таймер (10 минут)</h1>
        <div class="timer">
            <div class="time-box">
                <div class="number-wrapper" id="minutes-wrapper"></div>
                <span class="label">Минут</span>
            </div>
            <div class="time-box">
                <div class="number-wrapper" id="seconds-wrapper"></div>
                <span class="label">Секунд</span>
            </div>
        </div>

        <!-- Индикатор текущей прозрачности -->
        <div class="opacity-info">
            <div class="opacity-item">
                Текущая цифра:
                <span id="curr-opacity-val">100%</span>
            </div>
            <div class="opacity-item">
                Следующая цифра:
                <span id="next-opacity-val">0%</span>
            </div>
        </div>
    </div>

    <script>
        let totalRemainingMs = 10 * 60 * 1000;

        function renderUnit(wrapperId, currentVal, nextVal, currentOpacity) {
            const wrapper = document.getElementById(wrapperId);
            const nextOpacity = (1 - currentOpacity).toFixed(2);
            const currOpacityFixed = currentOpacity.toFixed(2);

            if (currentVal === nextVal) {
                wrapper.innerHTML = `<span class="number" style="opacity: 1">${currentVal}</span>`;
                return;
            }

            wrapper.innerHTML = `
                <span class="number" style="opacity: ${currOpacityFixed}">${currentVal}</span>
                <span class="number" style="opacity: ${nextOpacity}">${nextVal}</span>
            `;
        }

        function updateTimer() {
            if (totalRemainingMs <= 0) {
                totalRemainingMs = 0;
            }

            const currentTotalSec = Math.floor(totalRemainingMs / 1000);
            const nextTotalSec = Math.max(0, currentTotalSec - 1);

            const currentOpacity = (totalRemainingMs % 1000) / 1000;
            const nextOpacity = 1 - currentOpacity;

            // Обновляем текстовый индикатор процентов
            document.getElementById('curr-opacity-val').innerText = Math.round(currentOpacity * 100) + '%';
            document.getElementById('next-opacity-val').innerText = Math.round(nextOpacity * 100) + '%';

            const formatTime = (totalSec) => ({
                m: String(Math.floor(totalSec / 60)).padStart(2, '0'),
                s: String(totalSec % 60).padStart(2, '0')
            });

            const curr = formatTime(currentTotalSec);
            const next = formatTime(nextTotalSec);

            renderUnit('minutes-wrapper', curr.m, next.m, currentOpacity);
            renderUnit('seconds-wrapper', curr.s, next.s, currentOpacity);
        }

        function tick() {
            updateTimer();
            if (totalRemainingMs > 0) {
                totalRemainingMs -= 100;
            }
        }

        updateTimer();
        setInterval(tick, 1000);
    </script>

</body>
</html>
