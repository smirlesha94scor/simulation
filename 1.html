<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>До 1 сентября</title>
    <!-- Leaflet CSS для интерактивной карты -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
</head>
<body>
<style>
  #widgetContainer {
    width: 450px; 
    height: 400px; 
    resize: both; 
    overflow: hidden; 
    border: 1px dashed #ccc; 
    padding: 2px;
    box-sizing: border-box;
    position: relative;
  }

  /* Убираем скроллбар и растягиваем iframe */
  #widgetContainer iframe {
    width: 100% !important;
    height: 100% !important;
    border: none !important;
    overflow: hidden !important;
  }
</style>

<!-- Контейнер -->
<div id="widgetContainer">
  <a href="https://allcalc.ru/node/1900" id="calcLink" data-weight="100%" data-height="100%">Сколько дней осталось до 1 сентября - allcalc</a>
  <script src="https://allcalc.ru/widgets/script.js"></script>
</div>

<script>
  // Убираем прокрутку у генерируемого iframe
  const observer = new MutationObserver(() => {
    const iframe = document.querySelector('#widgetContainer iframe');
    if (iframe) {
      iframe.scrolling = "no"; // Отключает скроллбар внутри iframe
    }
  });

  observer.observe(document.getElementById('widgetContainer'), { childList: true, subtree: true });
</script>


</body>
</html>
