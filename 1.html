<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Телеканалы Украины</title>

    <!-- Подключение Clappr -->
    <script src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .content-layout {
            display: flex;
            gap: 20px;
        }

        @media (max-width: 800px) {
            .content-layout {
                flex-direction: column;
            }
        }

        .player-box {
            flex: 2;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        #player {
            width: 100%;
            height: 100%;
        }

        /* ========================================================
           ИЗМЕНЕНИЕ ИНТЕРФЕЙСА ПЛЕЕРА CLAPPR ЧЕРЕЗ CSS
           ======================================================== */
        
        /* Изменение цвета акцентов (полоса прогресса, громкость) */
        [data-player] .bar-fill-1 {
            background-color: #38bdf8 !important; /* Голубой цвет */
        }
        [data-player] .bar-hover {
            background-color: rgba(56, 189, 248, 0.5) !important;
        }
        
        /* Стилизация панели управления */
        [data-player] .media-control[data-media-control] {
            background: linear-gradient(transparent, rgba(15, 23, 42, 0.9)) !important;
        }

        /* Цвет иконки воспроизведения по центру */
        [data-player] .play-wrapper[data-poster] svg path {
            fill: #38bdf8 !important;
        }

        /* Настройки внешнего списка каналов */
        .playlist-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            max-height: 500px;
            display: flex;
            flex-direction: column;
        }

        .playlist-title {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #38bdf8;
            font-weight: bold;
        }

        .channel-list {
            list-style: none;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 5px;
        }

        .channel-list::-webkit-scrollbar {
            width: 6px;
        }

        .channel-list::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        .channel-item {
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-word;
            display: flex;
            align-items: center;
        }

        .channel-item:hover {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
        }

        .channel-item.active {
            background: #0284c7;
            color: #fff;
            font-weight: bold;
        }

        .status {
            font-size: 0.9rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>IPTV Телеканалы Украины</h2>
            <div id="status" class="status">Загрузка плейлиста...</div>
        </div>

        <div class="content-layout">
            <div class="player-box">
                <div id="player"></div>
            </div>

            <div class="playlist-box">
                <div class="playlist-title">Список каналов</div>
                <ul id="channelList" class="channel-list"></ul>
            </div>
        </div>
    </div>

    <script>
        const M3U_URL = 'https://iptv-org.github.io/iptv/countries/ua.m3u';
        let player = null;

        async function fetchAndParseM3U(url) {
            try {
                const response = await fetch(url);
                const text = await response.text();

                const lines = text.split('\n');
                const playlist = [];
                let currentTitle = '';

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    
                    if (line.startsWith('#EXTINF:')) {
                        const commaIndex = line.lastIndexOf(',');
                        if (commaIndex !== -1) {
                            currentTitle = line.substring(commaIndex + 1).trim();
                        }
                    } else if (line && !line.startsWith('#')) {
                        if (currentTitle) {
                            playlist.push({
                                title: currentTitle,
                                file: line
                            });
                            currentTitle = '';
                        }
                    }
                }

                return playlist;
            } catch (error) {
                console.error('Ошибка при загрузке плейлиста:', error);
                document.getElementById('status').textContent = 'Ошибка загрузки плейлиста.';
                return [];
            }
        }

        function renderChannelList(playlist) {
            const listEl = document.getElementById('channelList');
            listEl.innerHTML = '';

            playlist.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = 'channel-item';
                if (index === 0) li.classList.add('active');

                li.textContent = `${index + 1}. ${item.title}`;
                li.title = item.title;

                li.addEventListener('click', () => {
                    document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                    li.classList.add('active');

                    if (player) {
                        player.load(item.file);
                        player.play();
                    }
                });

                listEl.appendChild(li);
            });
        }

        async function initPlayer() {
            const playlist = await fetchAndParseM3U(M3U_URL);

            if (playlist.length === 0) {
                document.getElementById('status').textContent = 'Плейлист пуст или недоступен.';
                return;
            }

            document.getElementById('status').textContent = `Загружено каналов: ${playlist.length}`;
            renderChannelList(playlist);

            // Инициализация Clappr с настройками интерфейса
            player = new Clappr.Player({
                source: playlist[0].file,
                parentId: "#player",
                width: '100%',
                height: '100%',
                autoPlay: true,

                // Настройки кастомизации интерфейса:
                mediacontrol: { 
                    seekbar: "#38bdf8",  // Цвет полосы прокрутки
                    buttons: "#ffffff"   // Цвет иконок/кнопок
                },
                hideMediaControlDelay: 2000, // Автоматическое скрытие элементов через 2 сек
                disableVideoTagContextMenu: true // Отключает контекстное меню по правому клику
            });
        }

        initPlayer();
    </script>

</body>
</html>
