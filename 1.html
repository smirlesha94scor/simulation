<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Three.js CPU Test</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #111;
      font-family: monospace;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #00ffcc;
      background: rgba(0, 0, 0, 0.8);
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #00ffcc;
      pointer-events: none;
    }
  </style>
  <!-- Подключаем Three.js через CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="info">
    <div><b>FPS:</b> <span id="fps">0</span></div>
    <div><b>Рендерер:</b> <span id="renderer-info">Загрузка...</span></div>
    <div><b>Режим:</b> <span id="mode-info">...</span></div>
  </div>

  <script>
    // 1. Создание сцены, камеры и рендерера
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 3;

    const renderer = new THREE.WebGLRenderer({ antialias: false }); // Отключаем сглаживание для экономии ресурсов CPU
    renderer.setPixelRatio(1); // Заживаем разрешение 1:1
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // 2. Добавление 3D-объекта (Куб)
    const geometry = new THREE.BoxGeometry(1, 1, 1);
    const material = new THREE.MeshPhongMaterial({ color: 0x00ff88, wireframe: false });
    const cube = new THREE.Mesh(geometry, material);
    scene.add(cube);

    // 3. Добавление источников света
    const ambientLight = new THREE.AmbientLight(0x404040);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0xffffff, 1, 100);
    pointLight.position.set(5, 5, 5);
    scene.add(pointLight);

    // 4. Определение видеокарты / эмулятора CPU
    const gl = renderer.getContext();
    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
    
    if (debugInfo) {
      const gpuName = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
      document.getElementById('renderer-info').innerText = gpuName;

      // Если в названии рендерера есть SwiftShader, LLVMpipe или Software — это CPU
      if (/SwiftShader|Software|LLVMpipe|Google SwiftShader/i.test(gpuName)) {
        document.getElementById('mode-info').innerText = 'Программный рендеринг (CPU)';
        document.getElementById('mode-info').style.color = '#ffcc00';
      } else {
        document.getElementById('mode-info').innerText = 'Аппаратное ускорение (GPU)';
        document.getElementById('mode-info').style.color = '#00ff88';
      }
    } else {
      document.getElementById('renderer-info').innerText = 'Неможливо определить';
    }

    // 5. Расчет FPS и Анимация
    let frameCount = 0;
    let lastTime = performance.now();

    function animate() {
      requestAnimationFrame(animate);

      // Вращение куба
      cube.rotation.x += 0.01;
      cube.rotation.y += 0.01;

      renderer.render(scene, camera);

      // Подсчет кадров в секунду
      frameCount++;
      const time = performance.now();
      if (time >= lastTime + 1000) {
        document.getElementById('fps').innerText = frameCount;
        frameCount = 0;
        lastTime = time;
      }
    }

    // Обработка изменения размера окна
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
