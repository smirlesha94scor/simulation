<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>До 1 сентября</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }

        .countdown-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 25px;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .timer {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px 10px;
            border-radius: 12px;
            min-width: 75px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .number {
            font-size: 2.2rem;
            font-weight: 700;
            display: block;
            line-height: 1;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        /* Класс анимации обновления цифры */
        .number.changing {
            opacity: 0.2;
            transform: translateY(-8px) scale(0.9);
        }

        .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
            opacity: 0.85;
        }

        @media (max-width: 480px) {
            .timer {
                gap: 8px;
            }
            .time-box {
                min-width: 60px;
                padding: 10px 5px;
            }
            .number {
                font-size: 1.6rem;
            }
            .label {
                font-size: 0.65rem;
            }
        }
    </style>
</head>
<body>

    <div class="countdown-container">
        <h1>До 1 сентября осталось</h1>
        <div class="timer">
            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">Дней</span>
            </div>
            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">Часов</span>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">Минут</span>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">Секунд</span>
            </div>
        </div>
    </div>

    <script>
        function setAnimatedValue(id, newValue) {
            const el = document.getElementById(id);
            if (el.innerText !== newValue) {
                el.classList.add('changing');
                setTimeout(() => {
                    el.innerText = newValue;
                    el.classList.remove('changing');
                }, 150);
            }
        }

        function updateTimer() {
            const now = new Date();
            let targetYear = now.getFullYear();
            
            let targetDate = new Date(`September 1, ${targetYear} 00:00:00`);
            if (now > targetDate) {
                targetDate = new Date(`September 1, ${targetYear + 1} 00:00:00`);
            }

            const diff = targetDate - now;

            const d = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, '0');
            const h = String(Math.floor((diff / (1000 * 60 * 60)) % 24)).padStart(2, '0');
            const m = String(Math.floor((diff / 1000 / 60) % 60)).padStart(2, '0');
            const s = String(Math.floor((diff / 1000) % 60)).padStart(2, '0');

            setAnimatedValue('days', d);
            setAnimatedValue('hours', h);
            setAnimatedValue('minutes', m);
            setAnimatedValue('seconds', s);
        }

        setInterval(updateTimer, 1000);
        updateTimer();
    </script>

</body>
</html>
