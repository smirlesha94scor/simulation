<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шаг 3: Наклон оси Земли и сезоны</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #info {
            position: absolute; top: 10px; left: 10px; color: #fff;
            background: rgba(0, 0, 0, 0.7); padding: 12px 18px; border-radius: 8px;
            max-width: 320px; font-size: 14px; line-height: 1.4;
        }
        .highlight { color: #4da6ff; font-weight: bold; }
    </style>
</head>
<body>

<div id="info">
    <b>Шаг 3: Наклон оси и физика суток</b><br>
    • Белая линия: Ось Земли (наклон <span class="highlight">23.5°</span>).<br>
    • Когда Северный полюс наклонен к Солнцу — в Северном полушарии <span class="highlight">Лето</span>.<br>
    • Наблюдайте, как освещается планета при движении по орбите.
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
    // 1. Сцена и Камера
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 15, 35);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 2. Свет
    const ambientLight = new THREE.AmbientLight(0x151525); // Легкий темно-синий заполняющий свет
    scene.add(ambientLight);

    const sunLight = new THREE.PointLight(0xffffff, 2, 300);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 1024;
    sunLight.shadow.mapSize.height = 1024;
    scene.add(sunLight);

    // 3. Солнце
    const sunGeometry = new THREE.SphereGeometry(3, 32, 32);
    const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
    const sun = new THREE.Mesh(sunGeometry, sunMaterial);
    scene.add(sun);

    // --- ИЕРАРХИЯ ОБЪЕКТОВ С НАКЛОНОМ ОСИ ---

    // А) Группа орбиты Земли (вращается вокруг Солнца)
    const earthOrbitGroup = new THREE.Group();
    scene.add(earthOrbitGroup);

    // Б) Группа позиции Земли (отнесена на расстояние 18 единиц)
    const earthPositionGroup = new THREE.Group();
    earthPositionGroup.position.set(18, 0, 0);
    earthOrbitGroup.add(earthPositionGroup);

    // В) Группа НАКЛОНА ОСИ (зафиксирована под углом 23.5 градуса = 0.41 радиан)
    const earthAxialTiltGroup = new THREE.Group();
    // Наклоняем ось Z (чтобы наклон сохранял направление в пространстве)
    earthAxialTiltGroup.rotation.z = THREE.MathUtils.degToRad(23.5);
    earthPositionGroup.add(earthAxialTiltGroup);

    // Г) Меш Земли (вращается вокруг собственной наклоненной оси Y)
    const earthGeometry = new THREE.SphereGeometry(1.2, 32, 32);
    const earthMaterial = new THREE.MeshStandardMaterial({ 
        color: 0x2255ff, 
        roughness: 0.6 
    });
    const earth = new THREE.Mesh(earthGeometry, earthMaterial);
    earth.castShadow = true;
    earth.receiveShadow = true;
    earthAxialTiltGroup.add(earth);

    // Д) Визуализация оси вращения (Белая линия)
    const axisPoints = [
        new THREE.Vector3(0, -2.2, 0),
        new THREE.Vector3(0, 2.2, 0)
    ];
    const axisGeometry = new THREE.BufferGeometry().setFromPoints(axisPoints);
    const axisMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 });
    const axisLine = new THREE.Line(axisGeometry, axisMaterial);
    earthAxialTiltGroup.add(axisLine); // Добавляем линию в группу наклона!

    // Е) Группа и меш Луны (вращается в плоскости экватора Земли)
    const moonOrbitGroup = new THREE.Group();
    earthAxialTiltGroup.add(moonOrbitGroup);

    const moonGeometry = new THREE.SphereGeometry(0.35, 16, 16);
    const moonMaterial = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.9 });
    const moon = new THREE.Mesh(moonGeometry, moonMaterial);
    moon.position.set(3, 0, 0);
    moon.castShadow = true;
    moon.receiveShadow = true;
    moonOrbitGroup.add(moon);

    // 4. Отрисовка линии орбиты Земли
    function createOrbitLine(radius) {
        const points = [];
        for (let i = 0; i <= 64; i++) {
            const theta = (i / 64) * Math.PI * 2;
            points.push(new THREE.Vector3(Math.cos(theta) * radius, 0, Math.sin(theta) * radius));
        }
        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const material = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.15 });
        return new THREE.LineLoop(geometry, material);
    }
    scene.add(createOrbitLine(18));

    // 5. Анимационный цикл
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);

        const delta = clock.getDelta();

        // 1. Годовое вращение Земли вокруг Солнца
        earthOrbitGroup.rotation.y += 0.2 * delta;

        // 2. Суточное вращение Земли вокруг своей НАКЛОНЕННОЙ оси
        earth.rotation.y += 2.5 * delta;

        // 3. Вращение Луны вокруг Земли
        moonOrbitGroup.rotation.y += 1.2 * delta;

        controls.update();
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
