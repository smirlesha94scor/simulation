<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конструктор Электросети</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: Arial, sans-serif;
      overflow: hidden;
      display: flex;
    }
    #main-area {
      flex: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #toolbar {
      height: 50px;
      background-color: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      padding: 0 15px;
      gap: 10px;
    }
    .tool-btn {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: 0.2s;
    }
    .tool-btn:hover {
      background: #30363d;
    }
    .tool-btn.active {
      background: #238636;
      border-color: #2ea44f;
      color: #fff;
    }
    .tool-btn.delete.active {
      background: #da3633;
      border-color: #f85149;
    }
    #canvas-container {
      flex: 1;
      position: relative;
    }
    canvas {
      display: block;
      cursor: crosshair;
    }
    #ui-panel {
      width: 260px;
      background-color: #161b22;
      border-left: 1px solid #30363d;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    h2 {
      margin: 0 0 10px 0;
      font-size: 18px;
      color: #58a6ff;
    }
    .stat-card {
      background: #21262d;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #30363d;
    }
    .stat-value {
      font-size: 20px;
      font-weight: bold;
      color: #7ee787;
    }
    .stat-label {
      font-size: 12px;
      color: #8b949e;
    }
    .hint {
      font-size: 12px;
      color: #8b949e;
      line-height: 1.4;
      background: #0d1117;
      padding: 10px;
      border-radius: 6px;
      border: 1px dashed #30363d;
    }
  </style>
</head>
<body>

  <div id="main-area">
    <div id="toolbar">
      <button class="tool-btn active" data-tool="select">👆 Выбор</button>
      <button class="tool-btn" data-tool="plant">⚡ Станция</button>
      <button class="tool-btn" data-tool="substation">🔷 Подстанция</button>
      <button class="tool-btn" data-tool="house">🏠 Дом</button>
      <button class="tool-btn" data-tool="wire">🔌 ЛЭП (Провод)</button>
      <button class="tool-btn delete" data-tool="delete">🗑️ Удалить</button>
    </div>
    <div id="canvas-container">
      <canvas id="simCanvas"></canvas>
    </div>
  </div>

  <div id="ui-panel">
    <h2>Статистика</h2>
    
    <div class="stat-card">
      <div class="stat-label">Всего узлов</div>
      <div class="stat-value" id="nodesCount" style="color: #58a6ff;">0</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">Запитано домов</div>
      <div class="stat-value" id="poweredHouses">0 / 0</div>
    </div>

    <div class="hint" id="helpText">
      Выберите инструмент сверху и кликните на поле, чтобы разместить объект.
    </div>
  </div>

  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = document.getElementById('canvas-container').clientWidth;
      canvas.height = document.getElementById('canvas-container').clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Состояние
    let currentTool = 'select';
    let selectedNodeForWire = null;
    let nextId = 1;

    let nodes = [];
    let lines = [];
    let dashOffset = 0;

    // Переключение инструментов
    document.querySelectorAll('.tool-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTool = btn.dataset.tool;
        selectedNodeForWire = null;
        updateHelpText();
      });
    });

    function updateHelpText() {
      const help = document.getElementById('helpText');
      switch (currentTool) {
        case 'plant': help.innerText = 'Кликните на карту, чтобы построить Электростанцию.'; break;
        case 'substation': help.innerText = 'Кликните на карту, чтобы построить Подстанцию.'; break;
        case 'house': help.innerText = 'Кликните на карту, чтобы построить Дом.'; break;
        case 'wire': help.innerText = 'Кликните сначала на первый узел, затем на второй, чтобы соединить их проводом.'; break;
        case 'delete': help.innerText = 'Кликните по объекту, чтобы удалить его.'; break;
        default: help.innerText = 'Режим просмотра. Вы можете изменять структуру сети через меню.'; break;
      }
    }

    // Обработка клика по Canvas
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const clickedNode = nodes.find(n => Math.hypot(n.x - x, n.y - y) < 25);

      if (currentTool === 'delete') {
        if (clickedNode) {
          nodes = nodes.filter(n => n.id !== clickedNode.id);
          lines = lines.filter(l => l.from !== clickedNode.id && l.to !== clickedNode.id);
        }
      } 
      else if (currentTool === 'wire') {
        if (clickedNode) {
          if (!selectedNodeForWire) {
            selectedNodeForWire = clickedNode;
          } else if (selectedNodeForWire.id !== clickedNode.id) {
            // Проверяем, нет ли уже такой линии
            const exists = lines.some(l => 
              (l.from === selectedNodeForWire.id && l.to === clickedNode.id) ||
              (l.from === clickedNode.id && l.to === selectedNodeForWire.id)
            );
            if (!exists) {
              lines.push({ from: selectedNodeForWire.id, to: clickedNode.id });
            }
            selectedNodeForWire = null;
          }
        }
      } 
      else if (['plant', 'substation', 'house'].includes(currentTool)) {
        if (!clickedNode) {
          nodes.push({
            id: nextId++,
            type: currentTool,
            x: x,
            y: y,
            powered: false
          });
        }
      }

      calculatePower();
      updateStats();
    });

    // Алгоритм поиска питаемых домов (BFS)
    function calculatePower() {
      // Сбрасываем статус питания
      nodes.forEach(n => n.powered = (n.type === 'plant'));

      let queue = nodes.filter(n => n.type === 'plant').map(n => n.id);
      let visited = new Set(queue);

      while (queue.length > 0) {
        let currentId = queue.shift();

        // Ищем все соседние узлы
        lines.forEach(line => {
          let neighborId = null;
          if (line.from === currentId) neighborId = line.to;
          if (line.to === currentId) neighborId = line.from;

          if (neighborId && !visited.has(neighborId)) {
            visited.add(neighborId);
            queue.push(neighborId);
            let node = nodes.find(n => n.id === neighborId);
            if (node) node.powered = true;
          }
        });
      }
    }

    function updateStats() {
      document.getElementById('nodesCount').innerText = nodes.length;
      const houses = nodes.filter(n => n.type === 'house');
      const powered = houses.filter(n => n.powered);
      document.getElementById('poweredHouses').innerText = `${powered.length} / ${houses.length}`;
    }

    // Отрисовка
    function drawGrid() {
      ctx.strokeStyle = '#161b22';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }
    }

    function drawLines() {
      lines.forEach(line => {
        const start = nodes.find(n => n.id === line.from);
        const end = nodes.find(n => n.id === line.to);
        if (!start || !end) return;

        const isPowered = start.powered && end.powered;

        ctx.beginPath();
        ctx.moveTo(start.x, start.y);
        ctx.lineTo(end.x, end.y);
        ctx.lineWidth = 3;
        ctx.strokeStyle = isPowered ? '#388bfd' : '#484f58';
        ctx.stroke();

        if (isPowered) {
          ctx.beginPath();
          ctx.moveTo(start.x, start.y);
          ctx.lineTo(end.x, end.y);
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#7ee787';
          ctx.setLineDash([6, 6]);
          ctx.lineDashOffset = -dashOffset;
          ctx.stroke();
          ctx.setLineDash([]);
        }
      });
    }

    function drawNodes() {
      nodes.forEach(node => {
        ctx.beginPath();

        // Подсветка выбранного узла при протяжке провода
        if (selectedNodeForWire && selectedNodeForWire.id === node.id) {
          ctx.arc(node.x, node.y, 25, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(88, 166, 255, 0.3)';
          ctx.fill();
        }

        if (node.type === 'plant') {
          ctx.fillStyle = '#2ea44f';
          ctx.fillRect(node.x - 20, node.y - 20, 40, 40);
          ctx.strokeStyle = '#7ee787';
          ctx.lineWidth = 2;
          ctx.strokeRect(node.x - 20, node.y - 20, 40, 40);
        } 
        else if (node.type === 'substation') {
          ctx.fillStyle = node.powered ? '#1f6feb' : '#30363d';
          ctx.beginPath();
          ctx.moveTo(node.x, node.y - 16); ctx.lineTo(node.x + 16, node.y);
          ctx.lineTo(node.x, node.y + 16); ctx.lineTo(node.x - 16, node.y);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = node.powered ? '#58a6ff' : '#8b949e';
          ctx.lineWidth = 2;
          ctx.stroke();
        } 
        else if (node.type === 'house') {
          ctx.arc(node.x, node.y, 14, 0, Math.PI * 2);
          ctx.fillStyle = node.powered ? '#a371f7' : '#da3633';
          ctx.fill();
        }
      });
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGrid();
      drawLines();
      drawNodes();
      dashOffset += 0.6;
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
