<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>До 1 сентября</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            gap: 20px;
            padding: 20px;
        }

        .countdown-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 650px;
            width: 100%;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 25px;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .timer {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px 10px;
            border-radius: 12px;
            min-width: 85px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .number-wrapper {
            position: relative;
            height: 2.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .number {
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1;
            position: absolute;
            width: 100%;
            text-align: center;
            left: 0;
            top: 0;
        }

        .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
            opacity: 0.85;
            display: block;
        }

        /* Таблица с прокруткой для новых строк */
        .opacity-table-container {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            padding: 15px;
            max-height: 250px;
            overflow-y: auto;
        }

        .opacity-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: center;
        }

        .opacity-table th, 
        .opacity-table td {
            padding: 8px 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .opacity-table th {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.8;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            position: sticky;
            top: 0;
            background: rgba(40, 30, 60, 0.95);
        }

        .val-sec {
            opacity: 0.7;
        }

        .val-curr {
            color: #a8ffb2;
            font-weight: bold;
        }

        .val-next {
            color: #ffd1a8;
            font-weight: bold;
        }

        @media (max-width: 480px) {
            .timer { gap: 8px; }
            .time-box { min-width: 65px; padding: 10px 5px; }
            .number { font-size: 1.6rem; }
            .number-wrapper { height: 1.6rem; }
            .label { font-size: 0.65rem; }
            .opacity-table { font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <div class="countdown-container">
        <h1>До 1 сентября осталось</h1>
        
        <div class="timer">
            <div class="time-box">
                <div class="number-wrapper" id="days-wrapper"></div>
                <span class="label">Дней</span>
            </div>
            <div class="time-box">
                <div class="number-wrapper" id="hours-wrapper"></div>
                <span class="label">Часов</span>
            </div>
            <div class="time-box">
                <div class="number-wrapper" id="minutes-wrapper"></div>
                <span class="label">Минут</span>
            </div>
            <div class="time-box">
                <div class="number-wrapper" id="seconds-wrapper"></div>
                <span class="label">Секунд</span>
            </div>
        </div>

        <div class="opacity-table-container" id="table-container">
            <table class="opacity-table">
                <thead>
                    <tr>
                        <th>№</th>
                        <th>Текущая цифра</th>
                        <th>Opacity</th>
                        <th>Следующая цифра</th>
                        <th>Opacity</th>
                    </tr>
                </thead>
                <tbody id="opacity-table-body">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let targetDate = null;
        let secondsPassed = 0;

        function initTargetDate() {
            const now = new Date();
            let targetYear = now.getFullYear();
            targetDate = new Date(`September 1, ${targetYear} 00:00:00`);
            
            if (now > targetDate) {
                targetDate = new Date(`September 1, ${targetYear + 1} 00:00:00`);
            }
        }

        function renderUnit(wrapperId, currentVal, nextVal, currentOpacity) {
            const wrapper = document.getElementById(wrapperId);
            const nextOpacity = (1 - currentOpacity).toFixed(2);
            const currOpacityFixed = currentOpacity.toFixed(2);

            if (currentVal === nextVal) {
                wrapper.innerHTML = `<span class="number" style="opacity: 1">${currentVal}</span>`;
                return;
            }

            wrapper.innerHTML = `
                <span class="number" style="opacity: ${currOpacityFixed}">${currentVal}</span>
                <span class="number" style="opacity: ${nextOpacity}">${nextVal}</span>
            `;
        }

        function appendRowToTable(stepNumber, currVal, currOp, nextVal, nextOp) {
            const tbody = document.getElementById('opacity-table-body');
            const row = document.createElement('tr');

            row.innerHTML = `
                <td class="val-sec">${stepNumber} с</td>
                <td class="val-curr">${currVal}</td>
                <td class="val-curr">${Math.round(currOp * 100)}%</td>
                <td class="val-next">${nextVal}</td>
                <td class="val-next">${Math.round(nextOp * 100)}%</td>
            `;

            tbody.appendChild(row);

            // Автоматическая прокрутка вниз к последней добавленной строке
            const container = document.getElementById('table-container');
            container.scrollTop = container.scrollHeight;
        }

        function tick() {
            secondsPassed++;

            const now = Date.now();
            let realDiffMs = targetDate - now;

            if (realDiffMs <= 0) {
                realDiffMs = 0;
            }

            // Каждую реальную секунду отнимается дополнительно 10 мс
            const extraMsDeducted = secondsPassed * 10;
            const adjustedDiffMs = Math.max(0, realDiffMs - extraMsDeducted);

            // Каждую реальную секунду вычитается 1% (0.01) прозрачности
            const currentOpacity = Math.max(0, 1 - (secondsPassed * 0.01));
            const nextOpacity = 1 - currentOpacity;

            const currentTotalSec = Math.floor(adjustedDiffMs / 1000);
            const nextTotalSec = Math.max(0, currentTotalSec - 1);

            const formatUnits = (totalSec) => ({
                d: String(Math.floor(totalSec / (60 * 60 * 24))).padStart(2, '0'),
                h: String(Math.floor((totalSec / (60 * 60)) % 24)).padStart(2, '0'),
                m: String(Math.floor((totalSec / 60) % 60)).padStart(2, '0'),
                s: String(totalSec % 60).padStart(2, '0')
            });

            const curr = formatUnits(currentTotalSec);
            const next = formatUnits(nextTotalSec);

            // Обновление таймера
            renderUnit('days-wrapper', curr.d, next.d, currentOpacity);
            renderUnit('hours-wrapper', curr.h, next.h, currentOpacity);
            renderUnit('minutes-wrapper', curr.m, next.m, currentOpacity);
            renderUnit('seconds-wrapper', curr.s, next.s, currentOpacity);

            // Добавление новой строки в таблицу
            appendRowToTable(secondsPassed, curr.s, currentOpacity, next.s, nextOpacity);
        }

        initTargetDate();
        tick();
        // Запуск каждые 1000 мс (1 реальную секунду)
        setInterval(tick, 1000);
    </script>

</body>
</html>
