<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV PlayerJS — Каналы Украины (iptv-org)</title>

    <!-- 1. HLS.js для поддержки .m3u8 потоков -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <!-- 2. Скрипт PlayerJS -->
    <script src="https://cdn.jsdelivr.net/gh/nomadtouch/PlayerJS@main/playerjs.js" type="text/javascript"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .player-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        #player {
            width: 100%;
            height: 100%;
        }

        .status {
            font-size: 0.9rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>IPTV Телеканалы Украины (iptv-org)</h2>
            <div id="status" class="status">Загрузка плейлиста...</div>
        </div>

        <div class="player-box">
            <div id="player"></div>
        </div>
    </div>

    <script>
        // Ссылка на плейлист Украины из iptv-org
        const M3U_URL = 'https://iptv-org.github.io/iptv/countries/ua.m3u';

        // Парсинг M3U плейлиста в формат массива PlayerJS
        async function fetchAndParseM3U(url) {
            try {
                const response = await fetch(url);
                const text = await response.text();

                const lines = text.split('\n');
                const playlist = [];
                let currentTitle = '';

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    
                    if (line.startsWith('#EXTINF:')) {
                        const commaIndex = line.lastIndexOf(',');
                        if (commaIndex !== -1) {
                            currentTitle = line.substring(commaIndex + 1).trim();
                        }
                    } else if (line && !line.startsWith('#')) {
                        if (currentTitle) {
                            playlist.push({
                                title: currentTitle,
                                file: line
                            });
                            currentTitle = '';
                        }
                    }
                }

                return playlist;
            } catch (error) {
                console.error('Ошибка при загрузке плейлиста:', error);
                document.getElementById('status').textContent = 'Ошибка загрузки плейлиста.';
                return [];
            }
        }

        // Инициализация плеера с украинскими каналами
        async function initPlayer() {
            const playlist = await fetchAndParseM3U(M3U_URL);

            if (playlist.length === 0) {
                document.getElementById('status').textContent = 'Плейлист пуст или недоступен.';
                return;
            }

            document.getElementById('status').textContent = `Загружено каналов: ${playlist.length}`;

            // Запуск PlayerJS со списком украинских каналов
            new Playerjs({
                id: "player",
                live: 1,
                file: playlist
            });
        }

        initPlayer();
    </script>

</body>
</html>
