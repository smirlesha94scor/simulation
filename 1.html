<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>До 1 сентября</title>
    <!-- Leaflet CSS для интерактивной карты -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
</head>
<body>
<style>
  #widgetWrapper {
    width: 450px;
    height: 400px;
    min-width: 350px; /* Минимальная ширина 350px */
    min-height: 250px; /* Минимальная высота (по желанию) */
    resize: both;
    overflow: hidden;
    border: 1px dashed #ccc;
    box-sizing: border-box;
  }

  #widgetWrapper iframe {
    width: 100% !important;
    height: 100% !important;
    border: none !important;
    display: block;
  }
</style>

<div id="widgetWrapper">
  <div id="widgetContainer">
    <a href="https://allcalc.ru/node/1900" id="calcLink" data-weight="450px" data-height="400px">Сколько дней осталось до 1 сентября - allcalc</a>
    <script id="widgetScript" src="https://allcalc.ru/widgets/script.js"></script>
  </div>
</div>

<script>
  const wrapper = document.getElementById('widgetWrapper');
  const container = document.getElementById('widgetContainer');
  let timeoutId = null;

  function reloadWidget(width, height) {
    container.innerHTML = `
      <a href="https://allcalc.ru/node/1900" id="calcLink" data-weight="${width}px" data-height="${height}px">Сколько дней осталось до 1 сентября - allcalc</a>
    `;
    const newScript = document.createElement('script');
    newScript.src = 'https://allcalc.ru/widgets/script.js';
    container.appendChild(newScript);
  }

  const resizeObserver = new ResizeObserver(entries => {
    for (let entry of entries) {
      // Ограничиваем значение ширины в скрипте не менее 350px
      const w = Math.max(350, Math.round(entry.contentRect.width));
      const h = Math.round(entry.contentRect.height);

      const iframe = container.querySelector('iframe');
      if (iframe) {
        iframe.style.width = '100%';
        iframe.style.height = '100%';
      }

      clearTimeout(timeoutId);
      timeoutId = setTimeout(() => {
        reloadWidget(w, h);
      }, 300);
    }
  });

  resizeObserver.observe(wrapper);
</script>


</body>
</html>
