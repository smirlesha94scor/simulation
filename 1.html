<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Трехполосная Светомузыка</title>
  <style>
    body {
      margin: 0;
      background: #050508;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
    }
    canvas {
      border-radius: 50%;
    }
    button {
      position: absolute;
      top: 20px;
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
      background: #00ffcc;
      border: none;
      border-radius: 20px;
      font-weight: bold;
      color: #000;
      z-index: 10;
      transition: transform 0.2s;
    }
    button:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <button id="startBtn">Включить трехполосную светомузыку</button>
  <canvas id="visualizer" width="600" height="600"></canvas>

  <script>
    const startBtn = document.getElementById('startBtn');
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');

    startBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: true
        });

        const audioTrack = stream.getAudioTracks()[0];
        if (!audioTrack) {
          alert('Ошибка: Вы не поставили галочку "Предоставить доступ к аудиосистемы"!');
          return;
        }

        startBtn.style.display = 'none';

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(new MediaStream([audioTrack]));
        const analyser = audioCtx.createAnalyser();

        // Увеличиваем размер FFT для более точного разделения частот
        analyser.fftSize = 256; 
        source.connect(analyser);

        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        function draw() {
          requestAnimationFrame(draw);

          analyser.getByteFrequencyData(dataArray);

          // 1. БАСЫ (Low frequencies): элементы от 0 до 5
          let bassSum = 0;
          const bassRange = 6;
          for (let i = 0; i < bassRange; i++) bassSum += dataArray[i];
          const bass = bassSum / bassRange; // 0..255

          // 2. СРЕДНИЕ (Mid frequencies): элементы от 6 до 30
          let midSum = 0;
          const midRange = 25;
          for (let i = 6; i < 6 + midRange; i++) midSum += dataArray[i];
          const mid = midSum / midRange; // 0..255

          // 3. ВЫСОКИЕ (High/Treble frequencies): элементы от 31 до 80
          let trebleSum = 0;
          const trebleRange = 50;
          for (let i = 31; i < 31 + trebleRange; i++) trebleSum += dataArray[i];
          const treble = trebleSum / trebleRange; // 0..255

          // Очистка холста
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          const centerX = canvas.width / 2;
          const centerY = canvas.height / 2;

          // --- 3. ВНЕШНЕЕ КОЛЬЦО: Высокие частоты (Treble) ---
          const trebleRadius = 140 + (treble / 255) * 80;
          ctx.beginPath();
          ctx.arc(centerX, centerY, trebleRadius, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(180, 50, 255, ${0.3 + (treble / 255) * 0.7})`; // Фиолетово-синий
          ctx.lineWidth = 4 + (treble / 255) * 12;
          ctx.shadowBlur = (treble / 255) * 30;
          ctx.shadowColor = '#b432ff';
          ctx.stroke();

          // --- 2. СРЕДНЕЕ КОЛЬЦО: Средние частоты (Mids) ---
          const midRadius = 80 + (mid / 255) * 60;
          ctx.beginPath();
          ctx.arc(centerX, centerY, midRadius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(0, 255, 180, ${0.2 + (mid / 255) * 0.6})`; // Изумрудно-зеленый
          ctx.shadowBlur = (mid / 255) * 25;
          ctx.shadowColor = '#00ffb4';
          ctx.fill();

          // --- 1. ЦЕНТРАЛЬНЫЙ ШАР: Басы (Bass) ---
          const bassRadius = 30 + (bass / 255) * 60;
          ctx.beginPath();
          ctx.arc(centerX, centerY, bassRadius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 60, 60, ${0.5 + (bass / 255) * 0.5})`; // Красный/Оранжевый
          ctx.shadowBlur = (bass / 255) * 40;
          ctx.shadowColor = '#ff3c3c';
          ctx.fill();
        }

        draw();

      } catch (err) {
        console.error("Ошибка доступа: ", err);
      }
    });
  </script>
</body>
</html>
