<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project P.I.T.T. Sandbox</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0f0f15;
            color: #eceff4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            height: 100vh;
        }

        #sidebar {
            width: 320px;
            background: #181920;
            border-right: 2px solid #2e3440;
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 15px;
            z-index: 10;
            box-shadow: 4px 0 15px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 1.4rem;
            color: #88c0d0;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid #2e3440;
            padding-bottom: 10px;
        }

        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #4c566a;
            letter-spacing: 1px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .tool-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .btn {
            background: #2e3440;
            color: #d8dee9;
            border: 1px solid #4c566a;
            padding: 10px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: #434c5e;
            border-color: #88c0d0;
        }

        .btn.active {
            background: #88c0d0;
            color: #2e3440;
            font-weight: bold;
            border-color: #88c0d0;
        }

        .btn-clear {
            background: #bf616a;
            color: #fff;
            border: none;
            margin-top: auto;
        }

        .btn-clear:hover {
            background: #d08770;
        }

        #viewport-container {
            flex-grow: 1;
            position: relative;
            background: radial-gradient(circle at center, #1b1c25 0%, #0a0a0e 100%);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .stats-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(24, 25, 32, 0.85);
            backdrop-filter: blur(5px);
            border: 1px solid #2e3440;
            padding: 12px 20px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9rem;
            color: #a3be8c;
            pointer-events: none;
        }

        .instructions {
            font-size: 0.75rem;
            color: #d8dee9;
            opacity: 0.7;
            line-height: 1.4;
            background: #2e3440;
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h1>Project P.I.T.T.</h1>
        
        <div class="section-title">Спавн объектов</div>
        <div class="tool-grid">
            <button class="btn active" data-tool="duck_std">🦆 Обычная уточка</button>
            <button class="btn" data-tool="duck_heavy">🦆 Тяжелая уточка</button>
            <button class="btn" data-tool="spawner">🏭 Спавнер уток</button>
        </div>

        <div class="section-title">Инструменты и элементы</div>
        <div class="tool-grid">
            <button class="btn" data-tool="fan">💨 Вентилятор</button>
            <button class="btn" data-tool="magnet">🧲 Магнит Бездны</button>
            <button class="btn" data-tool="bumper">💥 Батут / Отбойник</button>
            <button class="btn" data-tool="ramp">📐 Направляющий желоб</button>
            <button class="btn" data-tool="crusher">🔨 Измельчитель</button>
            <button class="btn" data-tool="upgrader">⚡ Преобразователь</button>
            <button class="btn" data-tool="portal_in">🌀 Вход портала</button>
            <button class="btn" data-tool="portal_out">🌀 Выход портала</button>
        </div>

        <div class="section-title">Управление</div>
        <div class="instructions">
            • <b>ЛКМ</b> — Поставить выбранный объект / перетащить утку<br>
            • <b>ПКМ</b> — Удалить инструмент/объект<br>
            • <b>Колесо мыши</b> — Повернуть размещаемый элемент (желоб, вентилятор)
        </div>

        <button class="btn btn-clear" id="clear-btn">🗑️ Очистить всё</button>
    </div>

    <div id="viewport-container">
        <canvas id="canvas"></canvas>
        <div class="stats-panel">
            Очков поглощено: <span id="score-val">0</span><br>
            Уточек в цеху: <span id="ducks-val">0</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scoreVal = document.getElementById('score-val');
        const ducksVal = document.getElementById('ducks-val');

        let width, height;
        let activeTool = 'duck_std';
        let placeAngle = 0;
        let score = 0;

        // Физика и игровые структуры
        const GRAVITY = 0.25;
        let objects = [];
        let tools = [];
        let portalIn = null;
        let portalOut = null;
        let draggedObject = null;

        // Позиция ямы (Maw)
        let maw = { x: 0, y: 0, radius: 65 };

        function resize() {
            width = canvas.width = document.getElementById('viewport-container').clientWidth;
            height = canvas.height = document.getElementById('viewport-container').clientHeight;
            maw.x = width / 2;
            maw.y = height - 40;
        }
        window.addEventListener('resize', resize);
        resize();

        // Выбор инструмента
        document.querySelectorAll('.tool-grid .btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tool-grid .btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeTool = btn.dataset.tool;
            });
        });

        document.getElementById('clear-btn').addEventListener('click', () => {
            objects = [];
            tools = [];
            portalIn = null;
            portalOut = null;
            score = 0;
            scoreVal.innerText = score;
        });

        window.addEventListener('wheel', (e) => {
            placeAngle += Math.sign(e.deltaY) * 0.15;
        });

        // Взаимодействие мышью
        let mousePos = { x: 0, y: 0 };
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mousePos.x = e.clientX - rect.left;
            mousePos.y = e.clientY - rect.top;

            if (draggedObject) {
                draggedObject.x = mousePos.x;
                draggedObject.y = mousePos.y;
                draggedObject.vx = 0;
                draggedObject.vy = 0;
            }
        });

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (e.button === 0) { // ЛКМ
                // Проверка на захват утки
                for (let obj of objects) {
                    let dist = Math.hypot(obj.x - x, obj.y - y);
                    if (dist < obj.radius) {
                        draggedObject = obj;
                        return;
                    }
                }

                // Размещение элементов
                spawnToolOrObject(x, y);
            } else if (e.button === 2) { // ПКМ - удаление
                tools = tools.filter(t => Math.hypot(t.x - x, t.y - y) > 30);
                objects = objects.filter(o => Math.hypot(o.x - x, o.y - y) > o.radius);
                if (portalIn && Math.hypot(portalIn.x - x, portalIn.y - y) < 30) portalIn = null;
                if (portalOut && Math.hypot(portalOut.x - x, portalOut.y - y) < 30) portalOut = null;
            }
        });

        window.addEventListener('mouseup', () => {
            draggedObject = null;
        });

        canvas.addEventListener('contextmenu', e => e.preventDefault());

        function spawnToolOrObject(x, y) {
            if (activeTool === 'duck_std') {
                objects.push(createDuck(x, y, 'std'));
            } else if (activeTool === 'duck_heavy') {
                objects.push(createDuck(x, y, 'heavy'));
            } else if (activeTool === 'spawner') {
                tools.push({ type: 'spawner', x, y, cooldown: 0 });
            } else if (activeTool === 'fan') {
                tools.push({ type: 'fan', x, y, angle: placeAngle });
            } else if (activeTool === 'magnet') {
                tools.push({ type: 'magnet', x, y });
            } else if (activeTool === 'bumper') {
                tools.push({ type: 'bumper', x, y });
            } else if (activeTool === 'ramp') {
                tools.push({ type: 'ramp', x, y, angle: placeAngle, length: 120 });
            } else if (activeTool === 'crusher') {
                tools.push({ type: 'crusher', x, y, phase: 0 });
            } else if (activeTool === 'upgrader') {
                tools.push({ type: 'upgrader', x, y });
            } else if (activeTool === 'portal_in') {
                portalIn = { x, y };
            } else if (activeTool === 'portal_out') {
                portalOut = { x, y };
            }
        }

        function createDuck(x, y, type) {
            return {
                x, y,
                vx: (Math.random() - 0.5) * 2,
                vy: (Math.random() - 0.5) * 2,
                radius: type === 'heavy' ? 18 : 14,
                mass: type === 'heavy' ? 2.5 : 1.0,
                tier: 1,
                type: type,
                color: type === 'heavy' ? '#e5e9f0' : '#ebcb8b'
            };
        }

        // Главный цикл обновлений
        function update() {
            // Обновление инструментов
            tools.forEach(tool => {
                if (tool.type === 'spawner') {
                    tool.cooldown++;
                    if (tool.cooldown > 120) {
                        objects.push(createDuck(tool.x, tool.y + 20, 'std'));
                        tool.cooldown = 0;
                    }
                } else if (tool.type === 'crusher') {
                    tool.phase += 0.05;
                }
            });

            // Физика уточек
            for (let i = objects.length - 1; i >= 0; i--) {
                let obj = objects[i];
                if (obj === draggedObject) continue;

                // Гравитация
                obj.vy += GRAVITY * obj.mass;

                // Воздействие инструментов
                tools.forEach(tool => {
                    let dx = obj.x - tool.x;
                    let dy = obj.y - tool.y;
                    let dist = Math.hypot(dx, dy);

                    // Вентилятор
                    if (tool.type === 'fan' && dist < 180) {
                        let fanDirX = Math.cos(tool.angle);
                        let fanDirY = Math.sin(tool.angle);
                        // Проверка угла конуса сдува
                        let dot = (dx * fanDirX + dy * fanDirY) / dist;
                        if (dot > 0.5) {
                            let force = (1 - dist / 180) * 0.8;
                            obj.vx += fanDirX * force;
                            obj.vy += fanDirY * force;
                        }
                    }

                    // Магнит
                    if (tool.type === 'magnet' && dist < 220) {
                        let force = (1 - dist / 220) * 0.6;
                        obj.vx -= (dx / dist) * force;
                        obj.vy -= (dy / dist) * force;
                    }

                    // Батут / Отбойник
                    if (tool.type === 'bumper' && dist < obj.radius + 20) {
                        let overlap = (obj.radius + 20) - dist;
                        let nx = dx / dist;
                        let ny = dy / dist;
                        obj.x += nx * overlap;
                        obj.y += ny * overlap;
                        obj.vx = nx * 12;
                        obj.vy = ny * 12;
                    }

                    // Преобразователь Уровень+
                    if (tool.type === 'upgrader' && Math.abs(dx) < 25 && Math.abs(dy) < 30) {
                        if (obj.tier === 1) {
                            obj.tier = 2;
                            obj.color = '#b48ead'; // Продвинутая фиолетовая утка
                            obj.radius = 16;
                        }
                    }

                    // Измельчитель / Пресс
                    if (tool.type === 'crusher' && Math.abs(dx) < 30 && Math.abs(dy) < 20) {
                        let crushState = Math.sin(tool.phase);
                        if (crushState > 0.8 && obj.tier < 3) {
                            obj.tier = 3;
                            obj.color = '#d08770'; // Спрессованная золотая утка
                            obj.radius = 10;
                        }
                    }

                    // Направляющий желоб
                    if (tool.type === 'ramp') {
                        let cos = Math.cos(-tool.angle);
                        let sin = Math.sin(-tool.angle);
                        let rx = cos * dx - sin * dy;
                        let ry = sin * dx + cos * dy;

                        if (Math.abs(rx) < tool.length / 2 && Math.abs(ry) < obj.radius + 5) {
                            if (ry > 0) {
                                obj.y += (obj.radius + 5 - ry);
                                obj.vy *= -0.3;
                                // Трение скольжения по рампе
                                obj.vx += Math.cos(tool.angle) * 0.2;
                            }
                        }
                    }
                });

                // Порталы
                if (portalIn && portalOut) {
                    let distIn = Math.hypot(obj.x - portalIn.x, obj.y - portalIn.y);
                    if (distIn < obj.radius + 15) {
                        obj.x = portalOut.x;
                        obj.y = portalOut.y + 25;
                    }
                }

                // Движение
                obj.x += obj.vx;
                obj.y += obj.vy;
                obj.vx *= 0.98; // Трение воздуха
                obj.vy *= 0.98;

                // Столкновения со стенами
                if (obj.x - obj.radius < 0) { obj.x = obj.radius; obj.vx *= -0.6; }
                if (obj.x + obj.radius > width) { obj.x = width - obj.radius; obj.vx *= -0.6; }

                // Попадание в Яму (Maw)
                let distMaw = Math.hypot(obj.x - maw.x, obj.y - maw.y);
                if (distMaw < maw.radius) {
                    score += obj.tier * 10;
                    scoreVal.innerText = score;
                    objects.splice(i, 1);
                }
            }

            ducksVal.innerText = objects.length;
        }

        // Отрисовка
        function render() {
            ctx.clearRect(0, 0, width, height);

            // Отрисовка Ямы (Maw)
            ctx.save();
            ctx.beginPath();
            ctx.arc(maw.x, maw.y, maw.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#bf616a';
            ctx.stroke();

            // Эффект притягивающего свечения Ямы
            ctx.beginPath();
            ctx.arc(maw.x, maw.y, maw.radius + 10 + Math.sin(Date.now() / 200) * 4, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(191, 97, 106, 0.3)';
            ctx.stroke();
            ctx.restore();

            // Отрисовка инструментов
            tools.forEach(tool => {
                ctx.save();
                ctx.translate(tool.x, tool.y);

                if (tool.type === 'spawner') {
                    ctx.fillStyle = '#4c566a';
                    ctx.fillRect(-20, -20, 40, 20);
                    ctx.fillStyle = '#a3be8c';
                    ctx.fillRect(-10, 0, 20, 10);
                } else if (tool.type === 'fan') {
                    ctx.rotate(tool.angle);
                    ctx.fillStyle = '#81a1c1';
                    ctx.fillRect(-15, -15, 30, 30);
                    // Лопасти
                    ctx.strokeStyle = '#eceff4';
                    ctx.beginPath();
                    ctx.moveTo(0, 0); ctx.lineTo(120, -40);
                    ctx.moveTo(0, 0); ctx.lineTo(120, 40);
                    ctx.stroke();
                } else if (tool.type === 'magnet') {
                    ctx.fillStyle = '#bf616a';
                    ctx.beginPath();
                    ctx.arc(0, 0, 20, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#d8dee9';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                } else if (tool.type === 'bumper') {
                    ctx.fillStyle = '#d08770';
                    ctx.beginPath();
                    ctx.arc(0, 0, 20, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#eceff4';
                    ctx.stroke();
                } else if (tool.type === 'upgrader') {
                    ctx.strokeStyle = '#ebcb8b';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(-20, -25, 40, 50);
                } else if (tool.type === 'crusher') {
                    ctx.fillStyle = '#4c566a';
                    ctx.fillRect(-25, -25, 50, 10);
                    let offset = Math.sin(tool.phase) * 15;
                    ctx.fillRect(-20, -15 + offset, 40, 15);
                } else if (tool.type === 'ramp') {
                    ctx.rotate(tool.angle);
                    ctx.fillStyle = '#434c5e';
                    ctx.fillRect(-tool.length / 2, -5, tool.length, 10);
                }

                ctx.restore();
            });

            // Порталы
            if (portalIn) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(portalIn.x, portalIn.y, 20, 0, Math.PI * 2);
                ctx.fillStyle = '#b48ead';
                ctx.fill();
                ctx.restore();
            }

            if (portalOut) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(portalOut.x, portalOut.y, 20, 0, Math.PI * 2);
                ctx.fillStyle = '#88c0d0';
                ctx.fill();
                ctx.restore();
            }

            // Отрисовка Уточек
            objects.forEach(obj => {
                ctx.save();
                ctx.translate(obj.x, obj.y);

                // Тело утки
                ctx.beginPath();
                ctx.arc(0, 0, obj.radius, 0, Math.PI * 2);
                ctx.fillStyle = obj.color;
                ctx.fill();
                ctx.strokeStyle = '#2e3440';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Клюв
                ctx.beginPath();
                ctx.arc(obj.radius * 0.6, -2, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#d08770';
                ctx.fill();

                // Глаз
                ctx.beginPath();
                ctx.arc(obj.radius * 0.2, -4, 2, 0, Math.PI * 2);
                ctx.fillStyle = '#2e3440';
                ctx.fill();

                ctx.restore();
            });

            // Предпросмотр установки инструмента при наведении
            if (activeTool === 'ramp' || activeTool === 'fan') {
                ctx.save();
                ctx.translate(mousePos.x, mousePos.y);
                ctx.rotate(placeAngle);
                ctx.strokeStyle = 'rgba(136, 192, 208, 0.5)';
                ctx.lineWidth = 2;
                if (activeTool === 'ramp') ctx.strokeRect(-60, -5, 120, 10);
                if (activeTool === 'fan') ctx.strokeRect(-15, -15, 30, 30);
                ctx.restore();
            }
        }

        function loop() {
            update();
            render();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
