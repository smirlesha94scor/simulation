<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Плеер & Чекер</title>

    <!-- Библиотеки HLS.js и Clappr -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>

    <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    
    /* Запрещаем скролл для всего окна браузера */
    html, body {
        width: 100%;
        height: 100vh;
        margin: 0;
        padding: 0;
        overflow: hidden; /* Жестко фиксирует страницу */
        background-color: #0f172a;
        color: #fff;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 15px;
    }

    .container {
        width: 100%;
        max-width: 1200px;
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .header, .custompanel, .custom-buttons-bar, .playlist-title {
        flex-shrink: 0; /* Не сжимаются при недостатке места */
    }

    .header { display: flex; justify-content: space-between; align-items: center; }
    
    .custompanel { 
        background: rgba(255, 255, 255, 0.05); 
        border: 1px solid rgba(255, 255, 255, 0.1); 
        border-radius: 12px; 
        padding: 10px 15px; 
        display: flex; 
        flex-direction: column; 
        gap: 8px; 
    }

    .playlist-input-container { display: flex; width: 100%; gap: 10px; }
    .playlist-input { 
        flex: 1; 
        background: rgba(0, 0, 0, 0.3); 
        border: 1px solid rgba(255, 255, 255, 0.2); 
        color: #fff; 
        padding: 8px 12px; 
        border-radius: 6px; 
        font-size: 0.9rem; 
        outline: none; 
    }
    .playlist-input:focus { border-color: #38bdf8; }

    .content-layout { 
        display: flex; 
        gap: 15px; 
        flex: 1; 
        min-height: 0; /* Важно: позволяет контенту сжиматься в рамках экрана */
    }

    @media (max-width: 800px) { 
        .content-layout { flex-direction: column; } 
        html, body { overflow-y: auto; } /* Для экранов смартфонов включаем адаптивный скролл */
    }

    .player-box { 
        flex: 2; 
        display: flex; 
        flex-direction: column; 
        gap: 10px; 
        min-height: 0; 
    }

    .player-container { 
        width: 100%; 
        aspect-ratio: 16 / 9; 
        background: #000; 
        border-radius: 12px; 
        overflow: hidden; 
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); 
        position: relative; 
    }
    #player { width: 100%; height: 100%; }

    .custom-buttons-bar { 
        display: flex; 
        flex-wrap: wrap; 
        gap: 10px; 
        background: rgba(255, 255, 255, 0.03); 
        padding: 10px; 
        border-radius: 8px; 
        border: 1px solid rgba(255, 255, 255, 0.08); 
        align-items: center; 
    }
    
    .custom-btn { 
        background: rgba(56, 189, 248, 0.15); 
        color: #38bdf8; 
        border: 1px solid rgba(56, 189, 248, 0.3); 
        padding: 8px 14px; 
        border-radius: 6px; 
        cursor: pointer; 
        font-size: 0.85rem; 
        font-weight: bold; 
        transition: all 0.2s; 
    }
    .custom-btn:hover { background: #38bdf8; color: #0f172a; }
    .btn-success { background: rgba(16, 185, 129, 0.2); color: #10b981; border-color: rgba(16, 185, 129, 0.4); }
    .btn-success:hover { background: #10b981; color: #fff; }

    /* Ограничиваем контейнер плейлиста высотой родительского блока */
    .playlist-box { 
        flex: 1; 
        background: rgba(255, 255, 255, 0.05); 
        border: 1px solid rgba(255, 255, 255, 0.1); 
        border-radius: 12px; 
        padding: 15px; 
        display: flex; 
        flex-direction: column; 
        overflow: hidden; 
        min-height: 0; 
    }
    .playlist-title { 
        font-size: 1.05rem; 
        margin-bottom: 10px; 
        color: #38bdf8; 
        font-weight: bold; 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
    }

    /* Включаем прокрутку ИСКЛЮЧИТЕЛЬНО для списка каналов */
    .channel-list { 
        list-style: none; 
        overflow-y: auto; /* Скролл только внутри списка */
        display: flex; 
        flex-direction: column; 
        gap: 6px; 
        padding-right: 5px; 
        flex: 1; 
        min-height: 0;
    }
    .channel-list::-webkit-scrollbar { width: 6px; }
    .channel-list::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

    .channel-item { 
        padding: 10px 12px; 
        background: rgba(255, 255, 255, 0.05); 
        border-radius: 8px; 
        cursor: pointer; 
        transition: all 0.2s ease; 
        font-size: 0.9rem; 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        border-left: 4px solid transparent; 
    }
    .channel-item:hover { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }
    .channel-item.active { background: #0284c7; color: #fff; font-weight: bold; }
    
    .channel-item.status-ok { border-left-color: #10b981; }
    .channel-item.status-checking { border-left-color: #f59e0b; }

    .status { font-size: 0.85rem; color: #94a3b8; }
    #hiddenVideo { width: 1px; height: 1px; opacity: 0; position: absolute; pointer-events: none; }
</style>
</head>
<body>

    <video id="hiddenVideo" muted playsinline></video>

    <div class="container">
        <div class="header">
            <h2>IPTV Плеер & Чекер</h2>
            <div id="status" class="status">Готов к работе</div>
        </div>

        <div class="custompanel">
            <div class="playlist-input-container">
                <input type="text" id="m3uUrlInput" class="playlist-input" value="https://raw.githubusercontent.com/smolnp/IPTVru/refs/heads/gh-pages/IPTVstable.m3u8" placeholder="Вставьте ссылку на M3U...">
                <button class="custom-btn" onclick="loadCustomPlaylist()">Загрузить</button>
            </div>
            <div style="display: flex; gap: 10px; align-items: center; font-size: 0.8rem;">
                <span>Или откройте файл с ПК:</span>
                <input type="file" id="fileInput" accept=".m3u,.m3u8" onchange="handleFileSelect(event)">
            </div>
        </div>

        <div class="content-layout">
            <div class="player-box">
                <div class="player-container">
                    <div id="player"></div>
                </div>
                
                <div class="custom-buttons-bar">
                    <button class="custom-btn" onclick="reloadStream()">🔄 Обновить</button>
                    <button class="custom-btn" onclick="toggleMute()">🔇 Звук</button>
                    <button class="custom-btn btn-success" onclick="startCheckAll()">⚡ Проверить и очистить нерабочие</button>
                    <button class="custom-btn btn-success" onclick="downloadWorkingM3U()" style="margin-left: auto;">💾 Скачать рабочие</button>
                </div>
            </div>

            <div class="playlist-box">
                <div class="playlist-title">
                    <span>Каналы</span>
                    <span id="counterText" style="font-size: 0.8rem; color: #94a3b8;">0/0</span>
                </div>
                <ul id="channelList" class="channel-list"></ul>
            </div>
        </div>
    </div>

    <script>
        let player = null;
        let globalPlaylist = [];
        let currentIndex = 0;
        let isCheckingAll = false;
        const testVideoEl = document.getElementById('hiddenVideo');

        function parseM3U(text) {
            const lines = text.split('\n');
            const playlist = [];
            let currentMeta = '';
            let currentTitle = '';

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    currentMeta = line;
                    const commaIdx = line.lastIndexOf(',');
                    if (commaIdx !== -1) currentTitle = line.substring(commaIdx + 1).trim();
                } else if (line && !line.startsWith('#')) {
                    if (currentTitle) {
                        playlist.push({
                            meta: currentMeta,
                            title: currentTitle,
                            file: line,
                            status: 'none'
                        });
                        currentMeta = '';
                        currentTitle = '';
                    }
                }
            }
            return playlist;
        }

        async function loadCustomPlaylist() {
            const url = document.getElementById('m3uUrlInput').value.trim();
            if (!url) return;
            document.getElementById('status').textContent = 'Загрузка плейлиста...';

            const fetchMethods = [
                async (u) => {
                    const res = await fetch(u);
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return await res.text();
                },
                async (u) => {
                    const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(u)}`);
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();
                    return data.contents;
                },
                async (u) => {
                    const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(u)}`);
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return await res.text();
                }
            ];

            let loadedText = null;

            for (let i = 0; i < fetchMethods.length; i++) {
                try {
                    if (i > 0) document.getElementById('status').textContent = `Попытка #${i + 1}...`;
                    const text = await fetchMethods[i](url);
                    if (text && (text.includes('#EXTM3U') || text.includes('#EXTINF') || text.includes('http'))) {
                        loadedText = text;
                        break;
                    }
                } catch (e) {
                    console.warn(`Метод #${i + 1} не сработал:`, e);
                }
            }

            if (loadedText) {
                globalPlaylist = parseM3U(loadedText);
                initList();
                document.getElementById('status').textContent = 'Плейлист загружен!';
            } else {
                alert('Не удалось загрузить плейлист. Возможно, ссылка не существует (404) или заблокирована.');
                document.getElementById('status').textContent = 'Ошибка загрузки';
            }
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                globalPlaylist = parseM3U(evt.target.result);
                initList();
            };
            reader.readAsText(file);
        }

        function initList() {
            currentIndex = 0;
            renderChannelList();
            updateCounter();
            if (globalPlaylist.length > 0) playChannel(0);
        }

        function updateCounter() {
            const ok = globalPlaylist.filter(c => c.status === 'ok').length;
            document.getElementById('counterText').textContent = `Рабочих: ${ok} | Всего: ${globalPlaylist.length}`;
        }

        function renderChannelList() {
            const listEl = document.getElementById('channelList');
            listEl.innerHTML = '';

            globalPlaylist.forEach((item, idx) => {
                if (item.status === 'fail') return;

                const li = document.createElement('li');
                let statusClass = '';
                let statusIcon = '⚪';

                if (item.status === 'ok') {
                    statusClass = 'status-ok';
                    statusIcon = '✔';
                } else if (item.status === 'checking') {
                    statusClass = 'status-checking';
                    statusIcon = '⏳';
                }

                li.className = `channel-item ${statusClass}`;
                if (idx === currentIndex) li.classList.add('active');

                li.innerHTML = `
                    <span>${idx + 1}. ${item.title}</span>
                    <span style="font-size:0.85rem;">${statusIcon}</span>
                `;

                li.onclick = () => switchChannel(idx);
                listEl.appendChild(li);
            });
        }

        function switchChannel(index) {
            if (index < 0 || index >= globalPlaylist.length) return;
            currentIndex = index;
            renderChannelList();
            playChannel(currentIndex);
        }

        function playChannel(index) {
            const item = globalPlaylist[index];
            if (!item) return;

            document.getElementById('status').textContent = `Воспроизведение: ${item.title}`;

            if (!player) {
                player = new Clappr.Player({
                    source: item.file,
                    parentId: "#player",
                    width: '100%',
                    height: '100%',
                    autoPlay: true,
                    playback: {
                        hlsjsConfig: {
                            manifestLoadingTimeOut: 8000,
                            levelLoadingTimeOut: 8000,
                            fragLoadingTimeOut: 8000
                        }
                    }
                });
            } else {
                player.load(item.file);
                player.play();
            }
        }

        async function startCheckAll() {
            if (isCheckingAll) return;
            isCheckingAll = true;
            document.getElementById('status').textContent = 'Проверка потоков...';

            for (let i = 0; i < globalPlaylist.length; i++) {
                const ch = globalPlaylist[i];
                if (ch.status === 'fail') continue;

                ch.status = 'checking';
                renderChannelList();

                const isOk = await checkStream(ch.file);
                ch.status = isOk ? 'ok' : 'fail';
                
                renderChannelList();
                updateCounter();
            }

            globalPlaylist = globalPlaylist.filter(ch => ch.status !== 'fail');
            renderChannelList();
            updateCounter();

            isCheckingAll = false;
            document.getElementById('status').textContent = 'Очистка завершена! Остались только рабочие.';
        }

        function checkStream(url) {
            return new Promise((resolve) => {
                let hls = null;
                let isResolved = false;

                const timer = setTimeout(() => {
                    cleanup();
                    if (!isResolved) {
                        isResolved = true;
                        resolve(false);
                    }
                }, 7000);

                function cleanup() {
                    testVideoEl.removeEventListener('timeupdate', onTimeUpdate);
                    testVideoEl.pause();
                    testVideoEl.removeAttribute('src');
                    testVideoEl.load();
                    if (hls) {
                        hls.destroy();
                        hls = null;
                    }
                }

                function onTimeUpdate() {
                    if (testVideoEl.currentTime > 0.1 && !isResolved) {
                        isResolved = true;
                        clearTimeout(timer);
                        cleanup();
                        resolve(true);
                    }
                }

                testVideoEl.addEventListener('timeupdate', onTimeUpdate);

                if (Hls.isSupported()) {
                    hls = new Hls({
                        manifestLoadingTimeOut: 7000,
                        levelLoadingTimeOut: 7000,
                        fragLoadingTimeOut: 7000,
                        enableWorker: false
                    });

                    hls.loadSource(url);
                    hls.attachMedia(testVideoEl);

                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        testVideoEl.play().catch(() => {});
                    });

                    hls.on(Hls.Events.ERROR, (event, data) => {
                        if (data.fatal) {
                            clearTimeout(timer);
                            cleanup();
                            if (!isResolved) {
                                isResolved = true;
                                resolve(false);
                            }
                        }
                    });
                } else {
                    testVideoEl.src = url;
                    testVideoEl.play().catch(() => {});
                    testVideoEl.onerror = () => {
                        clearTimeout(timer);
                        cleanup();
                        if (!isResolved) {
                            isResolved = true;
                            resolve(false);
                        }
                    };
                }
            });
        }

        function reloadStream() { playChannel(currentIndex); }
        function toggleMute() { if (player) player.getVolume() > 0 ? player.setVolume(0) : player.setVolume(100); }

        function downloadWorkingM3U() {
            const working = globalPlaylist.filter(c => c.status === 'ok');
            if (working.length === 0) {
                alert('Сначала нажмите "Проверить и очистить нерабочие".');
                return;
            }
            let out = "#EXTM3U\n";
            working.forEach(c => out += `${c.meta}\n${c.file}\n`);
            
            const blob = new Blob([out], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'working_iptv.m3u';
            a.click();
        }

        loadCustomPlaylist();
    </script>
</body>
</html>
