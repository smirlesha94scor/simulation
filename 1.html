<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ручка таймера</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f8f9fa;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Контейнер таймера */
    .timer-container {
      position: relative;
      width: 280px;
      height: 280px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Подложка круга и засечек */
    .dial-svg {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
    }

    /* Ручка регулировки */
    .knob-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ffffff, #d6d6d6);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15), inset 0 2px 4px rgba(255,255,255,0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: grab;
      touch-action: none;
    }

    .knob-wrapper:active {
      cursor: grabbing;
    }

    .knob {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f0f0f0 0%, #d8d8d8 100%);
      box-shadow: inset 0 3px 6px rgba(0,0,0,0.15), 0 2px 4px rgba(255,255,255,0.8);
      position: relative;
      transition: transform 0.05s ease-out;
    }

    /* Насечка на ручке */
    .knob-mark {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 18px;
      background-color: #adb5bd;
      border-radius: 2px;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <div class="timer-container">
    <svg class="dial-svg" viewBox="0 0 280 280">
      <!-- Внешняя дуга шкалы -->
      <path d="M 140 30 A 110 110 0 1 1 50 190" fill="none" stroke="#212529" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Засечки и текст генерируются через JS -->
      <g id="ticks"></g>
    </svg>

    <!-- Ручка регулировки -->
    <div class="knob-wrapper" id="knobWrapper">
      <div class="knob" id="knob">
        <div class="knob-mark"></div>
      </div>
    </div>
  </div>

  <script>
    const knobWrapper = document.getElementById('knobWrapper');
    const knob = document.getElementById('knob');
    const ticksGroup = document.getElementById('ticks');

    // Настройки шкалы (от 0 до 35 минут)
    const MAX_MINUTES = 35;
    const START_ANGLE = 0;   // 12 часов (0 мин)
    const END_ANGLE = 240;   // ~8 часов (35 мин)

    // Метки с особыми иконками
    const labels = [
      { min: 0, text: '0' },
      { min: 1, text: '1', icon: '☕' },
      { min: 2, text: '2' },
      { min: 3, text: '3', icon: '🍲' },
      { min: 4, text: '4' },
      { min: 5, text: '5' },
      { min: 6, text: '6' },
      { min: 7, text: '7', icon: '🥕' },
      { min: 8, text: '8' },
      { min: 9, text: '9' },
      { min: 10, text: '10' },
      { min: 15, text: '15' },
      { min: 20, text: '20' },
      { min: 25, text: '25' },
      { min: 30, text: '30' },
      { min: 35, text: '35' }
    ];

    let currentAngle = 0;
    let totalSeconds = 0;
    let timerInterval = null;
    let isDragging = false;
    let audioCtx = null;

    // Отрисовка шкалы засечек
    function renderDial() {
      labels.forEach(item => {
        const fraction = item.min / MAX_MINUTES;
        const angle = START_ANGLE + fraction * (END_ANGLE - START_ANGLE);
        const rad = (angle - 90) * (Math.PI / 180);

        const cx = 140, cy = 140;
        const rTickStart = 107;
        const rTickEnd = 113;
        const rText = 126;

        // Линии засечек
        const x1 = cx + rTickStart * Math.cos(rad);
        const y1 = cy + rTickStart * Math.sin(rad);
        const x2 = cx + rTickEnd * Math.cos(rad);
        const y2 = cy + rTickEnd * Math.sin(rad);

        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x1);
        line.setAttribute('y1', y1);
        line.setAttribute('x2', x2);
        line.setAttribute('y2', y2);
        line.setAttribute('stroke', '#212529');
        line.setAttribute('stroke-width', '2');
        ticksGroup.appendChild(line);

        // Числа на шкале
        const tx = cx + rText * Math.cos(rad);
        const ty = cy + rText * Math.sin(rad);

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', tx);
        text.setAttribute('y', ty + 4);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('font-size', '13');
        text.setAttribute('font-weight', 'bold');
        text.setAttribute('fill', '#212529');
        text.textContent = item.text;
        ticksGroup.appendChild(text);

        // Добавление иконки, если есть
        if (item.icon) {
          const rIcon = 142;
          const ix = cx + rIcon * Math.cos(rad);
          const iy = cy + rIcon * Math.sin(rad);
          const iconText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          iconText.setAttribute('x', ix);
          iconText.setAttribute('y', iy + 5);
          iconText.setAttribute('text-anchor', 'middle');
          iconText.setAttribute('font-size', '14');
          iconText.textContent = item.icon;
          ticksGroup.appendChild(iconText);
        }
      });
    }

    renderDial();

    // Звуковой сигнал по завершению
    function playBellSound() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.2);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 1.2);
    }

    // Обновление положения ручки
    function updateUI() {
      const currentFraction = (totalSeconds / 60) / MAX_MINUTES;
      currentAngle = START_ANGLE + currentFraction * (END_ANGLE - START_ANGLE);
      knob.style.transform = `rotate(${currentAngle}deg)`;
    }

    // Обработка вращения ручки
    function calculateAngle(e) {
      const rect = knobWrapper.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const deg = Math.atan2(clientY - centerY, clientX - centerX) * (180 / Math.PI);
      let angle = deg + 90; // Смещение относительно 12 часов

      if (angle < 0) angle += 360;

      if (angle > END_ANGLE + 30) angle = START_ANGLE;
      if (angle > END_ANGLE) angle = END_ANGLE;

      const fraction = angle / (END_ANGLE - START_ANGLE);
      const minutes = Math.round(fraction * MAX_MINUTES * 2) / 2; // Округление до 30 сек
      
      totalSeconds = Math.max(0, Math.min(MAX_MINUTES * 60, Math.round(minutes * 60)));
      updateUI();
    }

    function startTimer() {
      stopTimer();
      if (totalSeconds > 0) {
        timerInterval = setInterval(() => {
          if (totalSeconds > 0) {
            totalSeconds--;
            updateUI();
          } else {
            stopTimer();
            playBellSound();
          }
        }, 1000);
      }
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    // События мыши / тачпада
    function onPointerDown(e) {
      isDragging = true;
      stopTimer();
      calculateAngle(e);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
    }

    function onPointerMove(e) {
      if (isDragging) {
        calculateAngle(e);
      }
    }

    function onPointerUp() {
      if (isDragging) {
        isDragging = false;
        window.removeEventListener('pointermove', onPointerMove);
        window.removeEventListener('pointerup', onPointerUp);
        startTimer();
      }
    }

    knobWrapper.addEventListener('pointerdown', onPointerDown);
  </script>
</body>
</html>
