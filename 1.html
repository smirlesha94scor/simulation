<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLC Logic Studio Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .grid-bg {
            background-image: radial-gradient(#374151 1px, transparent 1px);
            background-size: 20px 20px;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937;
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
        .tutorial-highlight {
            box-shadow: 0 0 0 4px #f59e0b, 0 0 20px rgba(245, 158, 11, 0.8) !important;
            animation: pulse-border 1.5s infinite;
        }
        @keyframes pulse-border {
            0%, 100% { box-shadow: 0 0 0 4px #f59e0b, 0 0 15px rgba(245, 158, 11, 0.6); }
            50% { box-shadow: 0 0 0 6px #fbbf24, 0 0 25px rgba(251, 191, 36, 0.9); }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col font-sans overflow-hidden select-none">

    <!-- Header / Navbar -->
    <header class="bg-gray-800 border-b border-gray-700 px-4 py-2 flex justify-between items-center z-10">
        <div class="flex items-center gap-3">
            <i data-lucide="cpu" class="text-blue-400 w-7 h-7"></i>
            <div>
                <h1 class="font-bold text-lg leading-tight">PLC Logic Studio Pro</h1>
                <p class="text-xs text-gray-400">Интерактивный симулятор Ladder Logic (Интерактивная схема)</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button id="btn-open-theory" class="bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold px-3 py-1.5 rounded flex items-center gap-1.5 transition shadow">
                <i data-lucide="book-open" class="w-4 h-4"></i> База Знаний
            </button>
            <button id="btn-start-tutorial" class="bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold px-3 py-1.5 rounded flex items-center gap-1.5 transition shadow">
                <i data-lucide="graduation-cap" class="w-4 h-4"></i> Обучение / Курс
            </button>
        </div>

        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2 bg-gray-900 px-3 py-1 rounded border border-gray-700">
                <span class="text-xs text-gray-400">ПЛК:</span>
                <span id="plc-status-badge" class="inline-flex items-center gap-1 text-xs font-bold text-red-400">
                    <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span> STOP
                </span>
                <span class="text-xs text-gray-500 ml-2">Цикл: <span id="scan-time" class="text-gray-300">0</span>мс</span>
            </div>
            
            <button id="btn-run" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-1.5 rounded text-sm font-semibold flex items-center gap-1 shadow transition">
                <i data-lucide="play" class="w-4 h-4"></i> RUN
            </button>
            <button id="btn-stop" class="bg-red-600 hover:bg-red-500 text-white px-4 py-1.5 rounded text-sm font-semibold flex items-center gap-1 shadow transition">
                <i data-lucide="square" class="w-4 h-4"></i> STOP
            </button>
            <button id="btn-reset" class="bg-gray-700 hover:bg-gray-600 text-gray-200 px-3 py-1.5 rounded text-sm flex items-center gap-1 transition">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Сброс
            </button>
        </div>
    </header>

    <!-- Interactive Tutorial Overlay Bar -->
    <div id="tutorial-bar" class="bg-amber-950/90 border-b border-amber-600/50 px-4 py-2.5 flex items-center justify-between text-amber-100 hidden z-20">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-amber-600 flex items-center justify-center font-bold text-sm shadow shrink-0">
                <span id="tut-step-num">1</span>
            </div>
            <div>
                <div class="flex items-center gap-2">
                    <h4 id="tut-step-title" class="font-bold text-sm text-amber-300">Название шага</h4>
                </div>
                <p id="tut-step-desc" class="text-xs text-amber-200 leading-snug">Описание действий...</p>
            </div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
            <button id="tut-prev-btn" class="bg-amber-900 hover:bg-amber-800 text-xs px-3 py-1.5 rounded font-semibold transition">Назад</button>
            <button id="tut-next-btn" class="bg-amber-500 hover:bg-amber-400 text-gray-950 font-bold text-xs px-4 py-1.5 rounded transition shadow">Далее</button>
            <button id="tut-close-btn" class="bg-transparent hover:bg-amber-900/50 p-1 rounded text-amber-400 ml-2">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>
    </div>

    <!-- Main Workspace -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Left: Ladder Logic Editor -->
        <div class="w-3/5 border-r border-gray-700 flex flex-col bg-gray-900">
            <!-- Toolbar -->
            <div class="bg-gray-800/60 p-2 border-b border-gray-700 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="text-xs text-gray-400 font-semibold uppercase mr-2">Управление схемой:</span>
                    <button id="btn-add-rung" class="bg-blue-600 hover:bg-blue-500 text-white px-2.5 py-1 rounded text-xs flex items-center gap-1 transition">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i> Добавить цепь
                    </button>
                </div>
                <div class="text-[11px] text-gray-400">
                    💡 <span class="text-blue-300 font-semibold">ЛКМ</span> по элементу — сменить тип | <span class="text-emerald-300 font-semibold">ПКМ / Выбор</span> — сменить адрес
                </div>
            </div>

            <!-- Ladder Diagram Area -->
            <div id="ladder-container" class="flex-1 overflow-y-auto p-4 space-y-4 grid-bg">
                <!-- Rungs dynamically populated -->
            </div>
        </div>

        <!-- Right: Factory Visualization & Control Panel -->
        <div class="w-2/5 flex flex-col bg-gray-950">
            
            <!-- Task Header -->
            <div class="p-3 bg-gray-800/80 border-b border-gray-700 flex justify-between items-center">
                <div>
                    <h3 id="task-title" class="font-bold text-sm text-Пожалуйста, уточните ваш запрос или пришлите схему (текстом или описанием), чтобы я мог вам помочь. Что именно нужно разобрать или найти на схеме?
