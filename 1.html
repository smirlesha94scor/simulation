<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>До 1 сентября</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 20px;
        }

        .countdown-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 550px;
            width: 100%;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        /* Панель выбора эффекта */
        .controls {
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .controls label {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .controls select {
            background: rgba(0, 0, 0, 0.25);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 6px 12px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .controls select option {
            background: #4a3b69;
            color: #fff;
        }

        .timer {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px 10px;
            border-radius: 12px;
            min-width: 90px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .number-wrapper {
            position: relative;
            height: 2.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Скрывает выходящие за пределы цифры */
        }

        .number {
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1;
            position: absolute;
            width: 100%;
            text-align: center;
            left: 0;
            top: 0;
            will-change: transform, opacity;
        }

        .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            opacity: 0.85;
            display: block;
        }

        @media (max-width: 480px) {
            .timer { gap: 8px; }
            .time-box { min-width: 70px; padding: 15px 5px; }
            .number { font-size: 1.8rem; }
            .number-wrapper { height: 1.8rem; }
            .label { font-size: 0.65rem; }
        }
    </style>
</head>
<body>

    <div class="countdown-container">
        <h1>До 1 сентября осталось</h1>
        
        <div class="controls">
            <label for="anim-select">Эффект смены:</label>
            <select id="anim-select">
                <option value="fade">Прозрачность (Fade)</option>
                <option value="slide-down">Сдвиг вниз (Slide Down)</option>
                <option value="slide-up">Сдвиг вверх (Slide Up)</option>
                <option value="zoom">Масштабирование (Zoom)</option>
            </select>
        </div>

        <div class="timer">
            <div class="time-box">
                <div class="number-wrapper" id="days-wrapper"></div>
                <span class="label">Дней</span>
            </div>
            <div class="time-box">
                <div class="number-wrapper" id="hours-wrapper"></div>
                <span class="label">Часов</span>
            </div>
            <div class="time-box">
                <div class="number-wrapper" id="minutes-wrapper"></div>
                <span class="label">Минут</span>
            </div>
            <div class="time-box">
                <div class="number-wrapper" id="seconds-wrapper"></div>
                <span class="label">Секунд</span>
            </div>
        </div>
    </div>

    <script>
        let targetDate = null;

        function initTargetDate() {
            const now = new Date();
            let targetYear = now.getFullYear();
            targetDate = new Date(`September 1, ${targetYear} 00:00:00`);
            
            if (now >= targetDate) {
                targetDate = new Date(`September 1, ${targetYear + 1} 00:00:00`);
            }
        }

        function renderUnit(wrapperId, currentVal, nextVal, progress, animType) {
            const wrapper = document.getElementById(wrapperId);

            if (currentVal === nextVal) {
                wrapper.innerHTML = `<span class="number" style="opacity: 1; transform: none;">${currentVal}</span>`;
                return;
            }

            const currOp = progress;
            const nextOp = 1 - progress;

            let currTransform = '';
            let nextTransform = '';

            // Вычисление стилей под выбранный эффект
            switch (animType) {
                case 'slide-down':
                    // Текущая цифра сдвигается вниз (0px -> 30px), следующая заходит сверху (-30px -> 0px)
                    currTransform = `translateY(${(1 - progress) * 30}px)`;
                    nextTransform = `translateY(${-progress * 30}px)`;
                    break;

                case 'slide-up':
                    // Текущая цифра уходит вверх (0px -> -30px), следующая идет снизу (30px -> 0px)
                    currTransform = `translateY(${-(1 - progress) * 30}px)`;
                    nextTransform = `translateY(${progress * 30}px)`;
                    break;

                case 'zoom':
                    // Текущая уменьшается (1.0 -> 0.5), новая увеличивается (0.5 -> 1.0)
                    currTransform = `scale(${0.5 + progress * 0.5})`;
                    nextTransform = `scale(${1 - progress * 0.5})`;
                    break;

                case 'fade':
                default:
                    currTransform = 'none';
                    nextTransform = 'none';
                    break;
            }

            wrapper.innerHTML = `
                <span class="number" style="opacity: ${currOp}; transform: ${currTransform};">${currentVal}</span>
                <span class="number" style="opacity: ${nextOp}; transform: ${nextTransform};">${nextVal}</span>
            `;
        }

        function updateTimer() {
            const now = Date.now();
            let diffMs = targetDate - now;

            if (diffMs <= 0) {
                diffMs = 0;
            }

            const currentTotalSec = Math.floor(diffMs / 1000);
            const nextTotalSec = Math.max(0, currentTotalSec - 1);

            // Значение прогресса от 1.0 до 0.0 за период одной секунды
            const msRemainder = diffMs % 1000;
            const progress = msRemainder / 1000;

            const formatUnits = (totalSec) => ({
                d: String(Math.floor(totalSec / (60 * 60 * 24))).padStart(2, '0'),
                h: String(Math.floor((totalSec / (60 * 60)) % 24)).padStart(2, '0'),
                m: String(Math.floor((totalSec / 60) % 60)).padStart(2, '0'),
                s: String(totalSec % 60).padStart(2, '0')
            });

            const curr = formatUnits(currentTotalSec);
            const next = formatUnits(nextTotalSec);

            const animType = document.getElementById('anim-select').value;

            renderUnit('days-wrapper', curr.d, next.d, progress, animType);
            renderUnit('hours-wrapper', curr.h, next.h, progress, animType);
            renderUnit('minutes-wrapper', curr.m, next.m, progress, animType);
            renderUnit('seconds-wrapper', curr.s, next.s, progress, animType);

            requestAnimationFrame(updateTimer);
        }

        initTargetDate();
        requestAnimationFrame(updateTimer);
    </script>

</body>
</html>
