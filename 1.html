<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Песочница Автоматизации — Three.js + Cannon.js</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      user-select: none;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(20, 20, 20, 0.85);
      padding: 12px;
      border-radius: 8px;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .btn-group {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    button {
      background: #34495e;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.2s;
    }
    button:hover { background: #415b76; }
    button.active { background: #27ae60; }
    #info {
      position: absolute;
      bottom: 10px;
      left: 10px;
      color: white;
      background: rgba(0,0,0,0.7);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 13px;
      pointer-events: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="ui">
    <strong>Инструменты:</strong>
    <div class="btn-group">
      <button id="btn-fan" onclick="selectTool('fan')">🌀 Вентилятор</button>
      <button id="btn-magnet" onclick="selectTool('magnet')">🧲 Магнит</button>
      <button id="btn-panel" onclick="selectTool('panel')">📐 Панель</button>
      <button id="btn-piston" onclick="selectTool('piston')">🔨 Поршень</button>
      <button id="btn-launcher" onclick="selectTool('launcher')">🚀 Запускник</button>
      <button id="btn-spring" onclick="selectTool('spring')">🦘 Пружина</button>
      <button id="btn-rack" onclick="selectTool('rack')">📦 Стойка</button>
      <button id="btn-broom" onclick="selectTool('broom')">🧹 Метла</button>
    </div>
    <hr style="border: 0.5px solid #444; width: 100%;">
    <strong>Спавн объектов:</strong>
    <div class="btn-group">
      <button onclick="spawnMetalBox()">📦 Металл</button>
      <button onclick="spawnDuck()">🦆 Утка</button>
    </div>
  </div>

  <div id="info">Кликните по арене для размещения выбранного инструмента</div>

  <script>
    // --- 1. ИНИЦИАЛИЗАЦИЯ THREE.JS И CANNON.JS ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a24);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 12, 16);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2, 0);
    controls.update();

    // Физический мир
    const world = new CANNON.World();
    world.gravity.set(0, -9.81, 0);

    // --- 2. ОСВЕЩЕНИЕ И ОКРУЖЕНИЕ ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);

    // Пол (Арена)
    const groundGeo = new THREE.PlaneGeometry(20, 20);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50 });
    const groundMesh = new THREE.Mesh(groundGeo, groundMat);
    groundMesh.rotation.x = -Math.PI / 2;
    groundMesh.receiveShadow = true;
    scene.add(groundMesh);

    const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
    groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
    world.addBody(groundBody);

    // --- 3. ХРАНИЛИЩА ОБЪЕКТОВ И ИНСТРУМЕНТОВ ---
    const dynamicObjects = []; // Утки и Металлические ящики
    const activeTools = [];    // Инструменты автоматизации
    let selectedTool = null;

    // Сетки материалов Three.js
    const materials = {
      metal: new THREE.MeshStandardMaterial({ color: 0x7f8c8d, metalness: 0.8, roughness: 0.2 }),
      duck: new THREE.MeshStandardMaterial({ color: 0xf1c40f, roughness: 0.5 }),
      fan: new THREE.MeshStandardMaterial({ color: 0x3498db }),
      magnet: new THREE.MeshStandardMaterial({ color: 0xe74c3c }),
      panel: new THREE.MeshStandardMaterial({ color: 0xe67e22 }),
      piston: new THREE.MeshStandardMaterial({ color: 0x9b59b6 }),
      launcher: new THREE.MeshStandardMaterial({ color: 0x2ecc71 }),
      spring: new THREE.MeshStandardMaterial({ color: 0x1abc9c }),
      rack: new THREE.MeshStandardMaterial({ color: 0x34495e }),
      broom: new THREE.MeshStandardMaterial({ color: 0xd35400 })
    };

    // --- 4. КЛАССЫ ИНСТРУМЕНТОВ ---
    class Tool {
      constructor(type, position) {
        this.type = type;
        this.mesh = new THREE.Group();
        this.mesh.position.copy(position);
        scene.add(this.mesh);
        this.body = null;
      }
      update() {}
    }

    class FanTool extends Tool {
      constructor(pos) {
        super('fan', pos);
        const geo = new THREE.BoxGeometry(1.2, 1.2, 0.5);
        const mesh = new THREE.Mesh(geo, materials.fan);
        mesh.castShadow = true;
        this.mesh.add(mesh);
        this.mesh.position.y += 0.6;
      }
      update() {
        // Выдувает объекты перед собой вдоль Z+
        const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(this.mesh.quaternion);
        dynamicObjects.forEach(obj => {
          const dir = new THREE.Vector3().subVectors(obj.mesh.position, this.mesh.position);
          const dist = dir.length();
          if (dist < 6 && dir.angleTo(forward) < 0.5) {
            const force = forward.clone().multiplyScalar(15 / (dist + 1));
            obj.body.applyForce(new CANNON.Vec3(force.x, force.y, force.z), obj.body.position);
          }
        });
      }
    }

    class MagnetTool extends Tool {
      constructor(pos) {
        super('magnet', pos);
        const geo = new THREE.CylinderGeometry(0.5, 0.5, 1, 16);
        const mesh = new THREE.Mesh(geo, materials.magnet);
        mesh.castShadow = true;
        this.mesh.add(mesh);
        this.mesh.position.y += 0.5;
      }
      update() {
        dynamicObjects.forEach(obj => {
          if (obj.isMetallic) {
            const dir = new THREE.Vector3().subVectors(this.mesh.position, obj.mesh.position);
            const dist = dir.length();
            if (dist < 8) {
              dir.normalize().multiplyScalar(25 / (dist * dist + 0.5));
              obj.body.applyForce(new CANNON.Vec3(dir.x, dir.y, dir.z), obj.body.position);
            }
          }
        });
      }
    }

    class PanelTool extends Tool {
      constructor(pos) {
        super('panel', pos);
        const geo = new THREE.BoxGeometry(2, 1, 0.2);
        const mesh = new THREE.Mesh(geo, materials.panel);
        mesh.castShadow = true;
        this.mesh.add(mesh);
        this.mesh.position.y += 0.5;
        this.mesh.rotation.x = -Math.PI / 6; // Наклонная доска

        const shape = new CANNON.Box(new CANNON.Vec3(1, 0.5, 0.1));
        this.body = new CANNON.Body({ mass: 0 });
        this.body.addShape(shape);
        this.body.position.copy(this.mesh.position);
        this.body.quaternion.copy(this.mesh.quaternion);
        world.addBody(this.body);
      }
    }

    class PistonTool extends Tool {
      constructor(pos) {
        super('piston', pos);
        const geo = new THREE.BoxGeometry(1, 1, 1);
        const mesh = new THREE.Mesh(geo, materials.piston);
        mesh.castShadow = true;
        this.mesh.add(mesh);
        this.mesh.position.y += 0.5;
        this.timer = 0;
      }
      update() {
        this.timer += 0.05;
        if (Math.sin(this.timer) > 0.95) { // Имитация толчка каждые пару секунд
          dynamicObjects.forEach(obj => {
            const dist = this.mesh.position.distanceTo(obj.mesh.position);
            if (dist < 2.0) {
              obj.body.applyImpulse(new CANNON.Vec3(0, 5, 10), obj.body.position);
            }
          });
        }
      }
    }

    class SpringTool extends Tool {
      constructor(pos) {
        super('spring', pos);
        const geo = new THREE.CylinderGeometry(0.8, 0.8, 0.3, 16);
        const mesh = new THREE.Mesh(geo, materials.spring);
        mesh.castShadow = true;
        this.mesh.add(mesh);
        this.mesh.position.y += 0.15;
      }
      update() {
        dynamicObjects.forEach(obj => {
          const distXZ = new THREE.Vector2(
            this.mesh.position.x - obj.mesh.position.x,
            this.mesh.position.z - obj.mesh.position.z
          ).length();
          
          if (distXZ < 0.9 && Math.abs(obj.mesh.position.y - this.mesh.position.y) < 0.6) {
            obj.body.velocity.y = 12; // Подбрасывание
          }
        });
      }
    }

    // --- 5. СПАВН ДИНАМИЧЕСКИХ ОБЪЕКТОВ ---
    function spawnMetalBox() {
      const geo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
      const mesh = new THREE.Mesh(geo, materials.metal);
      mesh.castShadow = true;
      scene.add(mesh);

      const shape = new CANNON.Box(new CANNON.Vec3(0.4, 0.4, 0.4));
      const body = new CANNON.Body({ mass: 2, shape: shape });
      body.position.set((Math.random() - 0.5) * 4, 8, (Math.random() - 0.5) * 4);
      world.addBody(body);

      dynamicObjects.push({ mesh, body, isMetallic: true });
    }

    function spawnDuck() {
      const geo = new THREE.SphereGeometry(0.5, 16, 16);
      const mesh = new THREE.Mesh(geo, materials.duck);
      mesh.castShadow = true;
      scene.add(mesh);

      const shape = new CANNON.Sphere(0.5);
      const body = new CANNON.Body({ mass: 0.5, shape: shape });
      body.position.set((Math.random() - 0.5) * 4, 8, (Math.random() - 0.5) * 4);
      world.addBody(body);

      dynamicObjects.push({ mesh, body, isMetallic: false });
    }

    // --- 6. ВЗАИМОДЕЙСТВИЕ И РАЗМЕЩЕНИЕ (RAYCASTING) ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function selectTool(type) {
      selectedTool = type;
      document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById(`btn-${type}`);
      if (activeBtn) activeBtn.classList.add('active');
    }

    window.addEventListener('pointerdown', (e) => {
      // Игнорировать клики по UI
      if (e.target.tagName === 'BUTTON' || e.target.closest('#ui')) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(groundMesh);

      if (intersects.length > 0 && selectedTool) {
        const point = intersects[0].point;
        let tool = null;

        switch(selectedTool) {
          case 'fan': tool = new FanTool(point); break;
          case 'magnet': tool = new MagnetTool(point); break;
          case 'panel': tool = new PanelTool(point); break;
          case 'piston': tool = new PistonTool(point); break;
          case 'spring': tool = new SpringTool(point); break;
          default:
            // Базовая реализация для остального
            tool = new Tool(selectedTool, point);
            const geo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            const mesh = new THREE.Mesh(geo, materials[selectedTool] || materials.rack);
            tool.mesh.add(mesh);
            tool.mesh.position.y += 0.4;
            break;
        }

        if (tool) activeTools.push(tool);
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 7. РЕНДЕР И АНИМАЦИОННЫЙ ЦИКЛ ---
    const timeStep = 1 / 60;
    function animate() {
      requestAnimationFrame(animate);

      // Шаг физического мира
      world.step(timeStep);

      // Синхронизация трехмерных сеток с физическими телами
      dynamicObjects.forEach(obj => {
        obj.mesh.position.copy(obj.body.position);
        obj.mesh.quaternion.copy(obj.body.quaternion);
      });

      // Обновление работы логики инструментов
      activeTools.forEach(tool => tool.update());

      renderer.render(scene, camera);
    }

    // Запуск цикла
    animate();
  </script>
</body>
</html>
