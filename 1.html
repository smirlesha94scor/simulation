<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Телеканалы</title>

    <!-- 1. Подключение hls.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <!-- 2. Подключение Clappr -->
    <script src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .custompanel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .playlist-input-container {
            display: flex;
            width: 100%;
            gap: 10px;
        }

        .playlist-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }

        .playlist-input:focus {
            border-color: #38bdf8;
        }

        .content-layout {
            display: flex;
            gap: 20px;
        }

        @media (max-width: 800px) {
            .content-layout {
                flex-direction: column;
            }
        }

        .player-box {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .player-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        #player {
            width: 100%;
            height: 100%;
        }

        .custom-buttons-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            align-items: center;
        }

        .custom-btn {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            transition: all 0.2s;
        }

        .custom-btn:hover {
            background: #38bdf8;
            color: #0f172a;
        }

        .timer-info {
            font-size: 0.85rem;
            color: #38bdf8;
            font-weight: bold;
            margin-left: auto;
        }

        .playlist-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            max-height: 520px;
            display: flex;
            flex-direction: column;
        }

        .playlist-title {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #38bdf8;
            font-weight: bold;
        }

        .channel-list {
            list-style: none;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 5px;
        }

        .channel-list::-webkit-scrollbar {
            width: 6px;
        }

        .channel-list::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        .channel-item {
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-word;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .channel-item:hover {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
        }

        .channel-item.active {
            background: #0284c7;
            color: #fff;
            font-weight: bold;
        }

        .channel-item.verified {
            border-left: 4px solid #10b981;
        }

        .format-badge {
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            color: #cbd5e1;
            font-weight: normal;
        }

        .status {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        /* Контекстное меню */
        .context-menu {
            position: fixed;
            display: none;
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 1000;
            overflow: hidden;
        }

        .context-menu-item {
            padding: 10px 20px;
            color: #ef4444;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .context-menu-item:hover {
            background: rgba(239, 68, 68, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>IPTV Плеер</h2>
            <div id="status" class="status">Загрузка плейлиста...</div>
        </div>

        <div class="custompanel">
            <div class="playlist-input-container">
                <input type="text" id="m3uUrlInput" class="playlist-input" value="https://iptv-org.github.io/iptv/countries/ua.m3u" placeholder="Вставьте ссылку на M3U плейлист...">
                <button class="custom-btn" onclick="loadCustomPlaylist()">Загрузить</button>
            </div>
        </div>

        <div class="content-layout">
            <div class="player-box">
                <div class="player-container">
                    <div id="player"></div>
                </div>
                
                <div class="custom-buttons-bar">
                    <button class="custom-btn" onclick="reloadStream()">🔄 Обновить</button>
                    <button class="custom-btn" onclick="toggleMute()">🔇 Мут / Звук</button>
                    <span id="timerInfo" class="timer-info"></span>
                </div>
            </div>

            <div class="playlist-box">
                <div class="playlist-title">Все каналы</div>
                <ul id="channelList" class="channel-list"></ul>
            </div>
        </div>
    </div>

    <!-- Контекстное меню для ПКМ -->
    <div id="contextMenu" class="context-menu">
        <div class="context-menu-item" onclick="deleteSelectedChannel()">🗑 Удалить канал</div>
    </div>

    <script>
        let player = null;
        let globalPlaylist = [];
        let currentIndex = 0;
        let selectedChannelIndexForDelete = null;

        let isAutoPlaying = true;
        let bufferingTimeoutTimer = null;
        
        let stopwatchInterval = null;
        let playedSeconds = 0;
        let isStopwatchRunning = false;

        let isChangingChannel = false; 

        const contextMenu = document.getElementById('contextMenu');

        // Закрытие контекстного меню при клике в любое место
        document.addEventListener('click', () => {
            contextMenu.style.display = 'none';
        });

        function detectStreamFormat(url) {
            const cleanUrl = url.split('?')[0].toLowerCase();
            if (cleanUrl.endsWith('.m3u8')) return 'HLS';
            if (cleanUrl.endsWith('.ts')) return 'TS';
            if (cleanUrl.endsWith('.mp4')) return 'MP4';
            if (cleanUrl.endsWith('.m3u')) return 'M3U';
            return 'STREAM';
        }

        async function fetchAndParseM3U(url) {
            try {
                const response = await fetch(url);
                const text = await response.text();

                const lines = text.split('\n');
                const playlist = [];
                let currentTitle = '';

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    
                    if (line.startsWith('#EXTINF:')) {
                        const commaIndex = line.lastIndexOf(',');
                        if (commaIndex !== -1) {
                            currentTitle = line.substring(commaIndex + 1).trim();
                        }
                    } else if (line && !line.startsWith('#')) {
                        if (currentTitle) {
                            let streamUrl = line;
                            if (window.location.protocol === 'https:' && streamUrl.startsWith('http://')) {
                                streamUrl = streamUrl.replace('http://', 'https://');
                            }

                            playlist.push({
                                title: currentTitle,
                                file: streamUrl,
                                format: detectStreamFormat(streamUrl),
                                verified: false
                            });
                            currentTitle = '';
                        }
                    }
                }

                return playlist;
            } catch (error) {
                console.error('Ошибка загрузки плейлиста:', error);
                document.getElementById('status').textContent = 'Ошибка загрузки плейлиста.';
                return [];
            }
        }

        async function loadCustomPlaylist() {
            const inputUrl = document.getElementById('m3uUrlInput').value.trim();
            if (!inputUrl) return;

            document.getElementById('status').textContent = 'Загрузка нового плейлиста...';
            clearAllTimers();

            globalPlaylist = await fetchAndParseM3U(inputUrl);

            if (globalPlaylist.length === 0) {
                document.getElementById('status').textContent = 'Не удалось загрузить плейлист.';
                renderChannelList([]);
                return;
            }

            currentIndex = 0;
            updateStatusCount();
            renderChannelList(globalPlaylist);
            switchChannel(0);
        }

        function clearAllTimers() {
            clearTimeout(bufferingTimeoutTimer);
            stopStopwatch();
            document.getElementById('timerInfo').textContent = '';
        }

        function resetAndStartStopwatch() {
            if (isStopwatchRunning) return;

            stopStopwatch();
            playedSeconds = 0;
            isStopwatchRunning = true;

            stopwatchInterval = setInterval(() => {
                playedSeconds++;

                const timeLeft = 8 - playedSeconds;
                if (timeLeft > 0) {
                    document.getElementById('timerInfo').textContent = `До переключения: ${timeLeft} с.`;
                } else {
                    document.getElementById('timerInfo').textContent = `Сохранено ✔`;
                }

                if (playedSeconds >= 8) {
                    if (globalPlaylist[currentIndex] && !globalPlaylist[currentIndex].verified) {
                        globalPlaylist[currentIndex].verified = true;
                        renderChannelList(globalPlaylist);
                        const item = globalPlaylist[currentIndex];
                        document.getElementById('status').textContent = `Воспроизведение: ${item ? item.title : ''} (Проверен ✔)`;
                    }

                    if (isAutoPlaying) {
                        stopStopwatch();
                        let nextIdx = (currentIndex + 1) % globalPlaylist.length;
                        switchChannel(nextIdx);
                    }
                }
            }, 1000);
        }

        function stopStopwatch() {
            clearInterval(stopwatchInterval);
            isStopwatchRunning = false;
        }

        function updateStatusCount() {
            const statusEl = document.getElementById('status');
            statusEl.textContent = `Осталось каналов: ${globalPlaylist.length}`;
        }

        function startBufferingTimer() {
            if (globalPlaylist[currentIndex] && globalPlaylist[currentIndex].verified) return;

            clearTimeout(bufferingTimeoutTimer);
            
            bufferingTimeoutTimer = setTimeout(() => {
                if (!isChangingChannel) {
                    const item = globalPlaylist[currentIndex];
                    if (!item || !item.verified) {
                        handleStreamError('Буферизация более 15 секунд');
                    }
                }
            }, 15000);
        }

        function handleStreamBuffer() {
            if (isChangingChannel) return;

            stopStopwatch();
            
            const item = globalPlaylist[currentIndex];
            if (item) {
                document.getElementById('status').textContent = `Буферизация (${item.title})... Лимит 15с.`;
            }
            startBufferingTimer();
        }

        function handleStreamPlaying() {
            if (isChangingChannel) return;

            clearTimeout(bufferingTimeoutTimer);
            resetAndStartStopwatch();

            const item = globalPlaylist[currentIndex];
            if (!item) return;

            const isVerified = item.verified ? ' (Проверен ✔)' : '';
            document.getElementById('status').textContent = `Воспроизведение: ${item.title}${isVerified}`;
        }

        function removeChannelByIndex(index, reason = 'Удален вручную') {
            if (index < 0 || index >= globalPlaylist.length) return;

            const isCurrent = (index === currentIndex);
            const removedItem = globalPlaylist[index];
            
            globalPlaylist.splice(index, 1);
            renderChannelList(globalPlaylist);
            updateStatusCount();

            document.getElementById('status').textContent = `Канал "${removedItem ? removedItem.title : ''}" удалён (${reason}).`;

            if (globalPlaylist.length === 0) {
                if (player) player.stop();
                document.getElementById('status').textContent = 'Список каналов пуст.';
                return;
            }

            if (isCurrent) {
                if (currentIndex >= globalPlaylist.length) {
                    currentIndex = 0;
                }
                switchChannel(currentIndex);
            } else if (index < currentIndex) {
                currentIndex--;
            }
        }

        function deleteSelectedChannel() {
            if (selectedChannelIndexForDelete !== null) {
                removeChannelByIndex(selectedChannelIndexForDelete, 'Удален пользователем');
                selectedChannelIndexForDelete = null;
            }
        }

        function handleStreamError(reason = 'Ошибка потока') {
            if (isChangingChannel) return;

            const currentItem = globalPlaylist[currentIndex];

            if (playedSeconds >= 8 || (currentItem && currentItem.verified)) {
                return;
            }

            clearAllTimers();
            removeChannelByIndex(currentIndex, reason);
        }

        function switchChannel(index) {
            if (globalPlaylist.length === 0) return;

            clearAllTimers();
            playedSeconds = 0;
            isChangingChannel = true; 

            if (player) {
                try {
                    player.stop();
                } catch (e) {
                    console.warn("Ошибка при остановке плеера:", e);
                }
            }

            setTimeout(() => {
                if (globalPlaylist.length === 0) {
                    document.getElementById('status').textContent = 'Список каналов пуст.';
                    isChangingChannel = false;
                    return;
                }

                if (index >= globalPlaylist.length) {
                    index = 0;
                } else if (index < 0) {
                    index = globalPlaylist.length - 1;
                }

                isChangingChannel = false;
                playChannel(index);
            }, 300);
        }

        function playChannel(index) {
            currentIndex = index;
            const item = globalPlaylist[currentIndex];

            if (!item) return;

            const items = document.querySelectorAll('.channel-item');
            items.forEach((el, idx) => {
                if (idx === currentIndex) {
                    el.classList.add('active');
                    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    el.classList.remove('active');
                }
            });

            document.getElementById('status').textContent = `Подключение: ${item.title}...`;

            startBufferingTimer();

            if (player) {
                player.load(item.file);
                player.play();

                setTimeout(() => {
                    const videoEl = document.querySelector('#player video');
                    if (videoEl) {
                        videoEl.removeEventListener('playing', handleStreamPlaying);
                        videoEl.removeEventListener('timeupdate', handleStreamPlaying);
                        
                        videoEl.addEventListener('playing', handleStreamPlaying, { once: true });
                        videoEl.addEventListener('timeupdate', handleStreamPlaying, { once: true });
                    }
                }, 400);
            }
        }

        function reloadStream() {
            if (globalPlaylist[currentIndex]) {
                switchChannel(currentIndex);
            }
        }

        function toggleMute() {
            if (player) {
                if (player.getVolume() > 0) {
                    player.setVolume(0);
                } else {
                    player.setVolume(100);
                }
            }
        }

        function renderChannelList(playlist) {
            const listEl = document.getElementById('channelList');
            listEl.innerHTML = '';

            playlist.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = 'channel-item';
                
                if (index === currentIndex) li.classList.add('active');
                if (item.verified) li.classList.add('verified');

                const titleSpan = document.createElement('span');
                titleSpan.textContent = `${index + 1}. ${item.title} ${item.verified ? '✔' : ''}`;

                const formatBadge = document.createElement('span');
                formatBadge.className = 'format-badge';
                formatBadge.textContent = item.format;

                li.appendChild(titleSpan);
                li.appendChild(formatBadge);
                li.title = item.title;

                // Левый клик — переключение канала
                li.addEventListener('click', () => {
                    switchChannel(index);
                });

                // Правый клик (ПКМ) — открытие меню удаления
                li.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    selectedChannelIndexForDelete = index;
                    
                    contextMenu.style.left = `${e.clientX}px`;
                    contextMenu.style.top = `${e.clientY}px`;
                    contextMenu.style.display = 'block';
                });

                listEl.appendChild(li);
            });
        }

        async function initPlayer() {
            const defaultUrl = document.getElementById('m3uUrlInput').value;
            globalPlaylist = await fetchAndParseM3U(defaultUrl);

            if (globalPlaylist.length === 0) {
                document.getElementById('status').textContent = 'Плейлист пуст или недоступен.';
                return;
            }

            updateStatusCount();
            renderChannelList(globalPlaylist);

            player = new Clappr.Player({
                source: globalPlaylist[0].file,
                parentId: "#player",
                width: '100%',
                height: '100%',
                autoPlay: true,
                playback: {
                    hlsjsConfig: {
                        enableWorker: true,
                        maxBufferLength: 30,
                        forceHLS: true
                    }
                },
                events: {
                    onPlay: function() { handleStreamPlaying(); },
                    onPlaying: function() { handleStreamPlaying(); },
                    onBuffer: function() { handleStreamBuffer(); },
                    onTimeUpdate: function() { handleStreamPlaying(); },
                    onError: function(err) {
                        console.warn("Ошибка воспроизведения:", err);
                        handleStreamError('Неподдерживаемый формат/кодек');
                    }
                }
            });

            playChannel(0);
        }

        initPlayer();
    </script>

</body>
</html>
