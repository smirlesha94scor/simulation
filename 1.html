<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Three.js CPU Wave Test</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0a0a10; font-family: monospace; }
    #ui {
      position: absolute; top: 10px; left: 10px;
      color: #00ffcc; background: rgba(0,0,0,0.8);
      padding: 12px; border: 1px solid #00ffcc; border-radius: 6px;
    }
    button { background: #1a2636; color: #00ffcc; border: 1px solid #00ffcc; padding: 6px 10px; cursor: pointer; margin-top: 5px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="ui">
    <div><b>FPS:</b> <span id="fps">0</span></div>
    <div><b>Сегменты сетки:</b> <span id="grid-size">50x50</span></div>
    <div><b>Всего вершин:</b> <span id="vertex-count">2601</span></div>
    <button id="toggle-grid">Изменить разрешение сетки</button>
  </div>

  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 20, 25);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setPixelRatio(1);
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Размеры сетки
    let segments = 50;
    let geometry = new THREE.PlaneGeometry(30, 30, segments, segments);
    const material = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true });
    let terrain = new THREE.Mesh(geometry, material);
    terrain.rotation.x = -Math.PI / 2;
    scene.add(terrain);

    function updateGrid(newSegments) {
      scene.remove(terrain);
      geometry.dispose();
      segments = newSegments;
      geometry = new THREE.PlaneGeometry(30, 30, segments, segments);
      terrain = new THREE.Mesh(geometry, material);
      terrain.rotation.x = -Math.PI / 2;
      scene.add(terrain);

      const count = (segments + 1) * (segments + 1);
      document.getElementById('grid-size').innerText = `${segments}x${segments}`;
      document.getElementById('vertex-count').innerText = count;
    }

    document.getElementById('toggle-grid').onclick = () => {
      if (segments === 30) updateGrid(50);
      else if (segments === 50) updateGrid(80);
      else updateGrid(30);
    };

    // Анимация волн на CPU
    let clock = new THREE.Clock();
    let frameCount = 0;
    let lastTime = performance.now();

    function animate() {
      requestAnimationFrame(animate);

      const time = clock.getElapsedTime() * 3;
      const positionAttribute = geometry.attributes.position;

      // Пересчитываем высоту Z для каждой вершины
      for (let i = 0; i < positionAttribute.count; i++) {
        const x = positionAttribute.getX(i);
        const y = positionAttribute.getY(i);
        const z = Math.sin(x * 0.5 + time) * Math.cos(y * 0.5 + time) * 1.5;
        positionAttribute.setZ(i, z);
      }
      
      // Сигнализируем Three.js о том, что буфер вершин изменился на CPU
      positionAttribute.needsUpdate = true;

      renderer.render(scene, camera);

      frameCount++;
      const now = performance.now();
      if (now >= lastTime + 1000) {
        document.getElementById('fps').innerText = frameCount;
        frameCount = 0;
        lastTime = now;
      }
    }

    animate();
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
