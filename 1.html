<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Телеканалы Украины</title>

    <!-- Подключение Clappr -->
    <script src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* Панель кастомизации */
        .custompanel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            justify-content: space-between;
        }

        .panel-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .panel-group label {
            color: #94a3b8;
        }

        input[type="color"] {
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            background: transparent;
        }

        input[type="text"] {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            outline: none;
            font-size: 0.85rem;
        }

        .btn-add {
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .btn-add:hover {
            background: #0369a1;
        }

        .content-layout {
            display: flex;
            gap: 20px;
        }

        @media (max-width: 800px) {
            .content-layout {
                flex-direction: column;
            }
        }

        .player-box {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .player-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        #player {
            width: 100%;
            height: 100%;
        }

        /* Блок пользовательских кнопок под плеером */
        .custom-buttons-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .custom-btn {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .custom-btn:hover {
            background: #38bdf8;
            color: #0f172a;
        }

        /* Динамическая кастомизация Clappr */
        [data-player] .bar-fill-1 {
            background-color: var(--accent-color, #38bdf8) !important;
        }
        [data-player] .bar-hover {
            background-color: var(--accent-color, rgba(56, 189, 248, 0.5)) !important;
        }
        [data-player] .media-control[data-media-control] {
            background: linear-gradient(transparent, rgba(15, 23, 42, var(--bg-opacity, 0.9))) !important;
        }

        /* Список каналов */
        .playlist-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            max-height: 520px;
            display: flex;
            flex-direction: column;
        }

        .playlist-title {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #38bdf8;
            font-weight: bold;
        }

        .channel-list {
            list-style: none;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 5px;
        }

        .channel-list::-webkit-scrollbar {
            width: 6px;
        }

        .channel-list::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        .channel-item {
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-word;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .channel-item:hover {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
        }

        .channel-item.active {
            background: #0284c7;
            color: #fff;
            font-weight: bold;
        }

        .status {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .badge-working {
            font-size: 0.75rem;
            background: #10b981;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>IPTV Телеканалы Украины</h2>
            <div id="status" class="status">Загрузка плейлиста...</div>
        </div>

        <!-- Панель кастомизации -->
        <div class="custompanel">
            <div class="panel-group">
                <label for="colorPicker">Цвет элементов:</label>
                <input type="color" id="colorPicker" value="#38bdf8">
            </div>

            <div class="panel-group">
                <label for="opacityPicker">Прозрачность панели:</label>
                <input type="range" id="opacityPicker" min="0.2" max="1" step="0.1" value="0.9">
            </div>

            <div class="panel-group">
                <label>Добавить кнопку:</label>
                <input type="text" id="btnName" placeholder="Название (напр. Перезапустить)">
                <button class="btn-add" onclick="addCustomButton()">+ Добавить</button>
            </div>
        </div>

        <div class="content-layout">
            <div class="player-box">
                <div class="player-container">
                    <div id="player"></div>
                </div>
                
                <!-- Кастомные кнопки управления -->
                <div class="custom-buttons-bar" id="customButtonsBar">
                    <button class="custom-btn" onclick="reloadStream()">🔄 Обновить поток</button>
                    <button class="custom-btn" onclick="toggleMute()">🔇 Мут / Звук</button>
                </div>
            </div>

            <div class="playlist-box">
                <div class="playlist-title">Рабочие каналы</div>
                <ul id="channelList" class="channel-list"></ul>
            </div>
        </div>
    </div>

    <script>
        const M3U_URL = 'https://iptv-org.github.io/iptv/countries/ua.m3u';
        let player = null;
        let currentStreamUrl = '';

        // Панель кастомизации: изменение цвета и прозрачности
        document.getElementById('colorPicker').addEventListener('input', (e) => {
            document.documentElement.style.setProperty('--accent-color', e.target.value);
        });

        document.getElementById('opacityPicker').addEventListener('input', (e) => {
            document.documentElement.style.setProperty('--bg-opacity', e.target.value);
        });

        // Функция добавления новой пользовательской кнопки
        function addCustomButton() {
            const nameInput = document.getElementById('btnName');
            const btnName = nameInput.value.trim();

            if (!btnName) {
                alert('Введите название кнопки!');
                return;
            }

            const bar = document.getElementById('customButtonsBar');
            const btn = document.createElement('button');
            btn.className = 'custom-btn';
            btn.textContent = `⚡ ${btnName}`;
            btn.onclick = () => alert(`Нажата кнопка: "${btnName}"`);

            bar.appendChild(btn);
            nameInput.value = '';
        }

        function reloadStream() {
            if (player && currentStreamUrl) {
                player.load(currentStreamUrl);
                player.play();
            }
        }

        function toggleMute() {
            if (player) {
                if (player.getVolume() > 0) {
                    player.setVolume(0);
                } else {
                    player.setVolume(100);
                }
            }
        }

        // Парсинг M3U
        async function fetchAndParseM3U(url) {
            try {
                const response = await fetch(url);
                const text = await response.text();

                const lines = text.split('\n');
                const playlist = [];
                let currentTitle = '';

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    
                    if (line.startsWith('#EXTINF:')) {
                        const commaIndex = line.lastIndexOf(',');
                        if (commaIndex !== -1) {
                            currentTitle = line.substring(commaIndex + 1).trim();
                        }
                    } else if (line && !line.startsWith('#')) {
                        if (currentTitle) {
                            playlist.push({
                                title: currentTitle,
                                file: line
                            });
                            currentTitle = '';
                        }
                    }
                }

                return playlist;
            } catch (error) {
                console.error('Ошибка при загрузке плейлиста:', error);
                document.getElementById('status').textContent = 'Ошибка загрузки плейлиста.';
                return [];
            }
        }

        // Проверка одного потока на доступность
        async function checkStream(url) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 3000);

            try {
                const response = await fetch(url, {
                    method: 'GET',
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                return response.ok;
            } catch (e) {
                clearTimeout(timeoutId);
                return false;
            }
        }

        // Фильтрация рабочих каналов
        async function filterWorkingChannels(rawPlaylist, onProgress) {
            const workingPlaylist = [];
            const BATCH_SIZE = 10;

            for (let i = 0; i < rawPlaylist.length; i += BATCH_SIZE) {
                const batch = rawPlaylist.slice(i, i + BATCH_SIZE);
                
                const results = await Promise.all(
                    batch.map(async (item) => {
                        const isOk = await checkStream(item.file);
                        return isOk ? item : null;
                    })
                );

                results.forEach(item => {
                    if (item) workingPlaylist.push(item);
                });

                const checkedCount = Math.min(i + BATCH_SIZE, rawPlaylist.length);
                onProgress(checkedCount, rawPlaylist.length, workingPlaylist.length);
            }

            return workingPlaylist;
        }

        function renderChannelList(playlist) {
            const listEl = document.getElementById('channelList');
            listEl.innerHTML = '';

            playlist.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = 'channel-item';
                if (index === 0) li.classList.add('active');

                li.innerHTML = `
                    <span>${index + 1}. ${item.title}</span>
                    <span class="badge-working">ONLINE</span>
                `;
                li.title = item.title;

                li.addEventListener('click', () => {
                    document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                    li.classList.add('active');

                    currentStreamUrl = item.file;
                    if (player) {
                        player.load(item.file);
                        player.play();
                    }
                });

                listEl.appendChild(li);
            });
        }

        async function initPlayer() {
            const statusEl = document.getElementById('status');
            const rawPlaylist = await fetchAndParseM3U(M3U_URL);

            if (rawPlaylist.length === 0) {
                statusEl.textContent = 'Плейлист пуст или недоступен.';
                return;
            }

            statusEl.textContent = `Тестирование каналов (0/${rawPlaylist.length})...`;

            const workingPlaylist = await filterWorkingChannels(rawPlaylist, (checked, total, found) => {
                statusEl.textContent = `Проверено: ${checked}/${total} | Рабочих: ${found}`;
            });

            if (workingPlaylist.length === 0) {
                statusEl.textContent = 'Ни один канал не прошёл проверку доступности.';
                return;
            }

            statusEl.textContent = `Готово! Рабочих каналов: ${workingPlaylist.length} из ${rawPlaylist.length}`;
            renderChannelList(workingPlaylist);

            currentStreamUrl = workingPlaylist[0].file;

            player = new Clappr.Player({
                source: currentStreamUrl,
                parentId: "#player",
                width: '100%',
                height: '100%',
                autoPlay: true
            });
        }

        initPlayer();
    </script>

</body>
</html>
