<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Реалистичный вид неба с Земли</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; color: #fff; }
    canvas { display: block; }
    #ui {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(10, 15, 25, 0.85); backdrop-filter: blur(8px);
      padding: 15px 25px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
      display: flex; gap: 20px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .control-group { display: flex; flex-direction: column; gap: 5px; font-size: 12px; }
    input[type=range] { width: 160px; }
    button {
      background: #2563eb; color: white; border: none; padding: 8px 16px;
      border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>

<div id="ui">
  <div class="control-group">
    <label for="timeSlider">Время суток (Высота Солнца):</label>
    <input type="range" id="timeSlider" min="0" max="360" value="80">
  </div>
  <div class="control-group">
    <label for="moonOrbitSlider">Положение Луны на орбите:</label>
    <input type="range" id="moonOrbitSlider" min="0" max="360" value="80">
  </div>
  <button id="playBtn">▶ Анимация</button>
</div>

<canvas id="sky"></canvas>

<script>
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');

const timeSlider = document.getElementById('timeSlider');
const moonOrbitSlider = document.getElementById('moonOrbitSlider');
const playBtn = document.getElementById('playBtn');

let isPlaying = false;

// Генерируем случайные звезды для ночного неба
const stars = Array.from({ length: 300 }, () => ({
  x: Math.random(),
  y: Math.random() * 0.7, // Только выше горизонта
  size: Math.random() * 1.5 + 0.5,
  alpha: Math.random() * 0.8 + 0.2
}));

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function render() {
  const w = canvas.width;
  const h = canvas.height;
  const horizonY = h * 0.72;

  // 1. РАСЧЕТ 3D ПОЛОЖЕНИЙ И УГЛОВ
  const sunAngleRad = (parseFloat(timeSlider.value) * Math.PI) / 180;
  const moonAngleRad = (parseFloat(moonOrbitSlider.value) * Math.PI) / 180;

  // Высота и позиция Солнца (3D проекция на небосвод)
  const sunY = horizonY - Math.sin(sunAngleRad) * (h * 0.55);
  const sunX = w / 2 + Math.cos(sunAngleRad) * (w * 0.4);
  const sunAlt = Math.sin(sunAngleRad); // Высота над горизонтом (-1 до 1)

  // Позиция Луны (с учетом небольшого наклона орбиты)
  const moonY = horizonY - Math.sin(moonAngleRad) * (h * 0.53);
  const moonX = w / 2 + Math.cos(moonAngleRad) * (w * 0.38);

  // 2. ФИЗИЧЕСКАЯ МОДЕЛЬ АТМОСФЕРЫ (Рассеивание Рэлея)
  // Optical Depth (оптическая толщина слоя воздуха)
  const opticalDepth = 1 / Math.max(0.03, sunAlt > 0 ? sunAlt : -sunAlt * 0.2);

  let r, g, b;
  if (sunAlt > 0.1) {
    // Дневное небо (синий свет рассеивается)
    r = Math.floor(135 - opticalDepth * 2);
    g = Math.floor(206 - opticalDepth * 5);
    b = Math.floor(250 - opticalDepth * 2);
  } else if (sunAlt > -0.15) {
    // Рассвет / Закат (Красные и оранжевые тона)
    const t = (sunAlt + 0.15) / 0.25;
    r = Math.floor(255 * (1 - t * 0.5));
    g = Math.floor(100 * t + 30);
    b = Math.floor(180 * t);
  } else {
    // Ночь (Глубокий темный синий)
    r = 5; g = 8; b = 20;
  }

  // Градиент неба (Зенит темнее, Горизонт светлее/ярче)
  const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
  skyGrad.addColorStop(0, `rgb(${Math.max(2, r - 40)}, ${Math.max(4, g - 40)}, ${Math.max(10, b - 30)})`);
  skyGrad.addColorStop(1, `rgb(${Math.max(10, r)}, ${Math.max(15, g)}, ${Math.max(25, b)})`);

  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, w, horizonY);

  // 3. ЗВЕЗДЫ (Проявляются ночью и в сумерках)
  const starVisibility = Math.max(0, Math.min(1, (-sunAlt - 0.05) * 4));
  if (starVisibility > 0) {
    ctx.save();
    stars.forEach(s => {
      ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha * starVisibility})`;
      ctx.beginPath();
      ctx.arc(s.x * w, s.y * h, s.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }

  // Угловой радиус объектов (в реальной жизни они одинакового углового размера ~0.5 deg)
  const angularRadius = Math.min(w, h) * 0.035;

  // Проверка на Затмение (перекрытие дисков)
  const distSunMoon = Math.hypot(sunX - moonX, sunY - moonY);
  const isEclipse = distSunMoon < angularRadius * 1.5 && sunY < horizonY;

  // 4. ОТРИСОВКА СОЛНЦАИ СОЛНЕЧНОЙ КОРОНЫ
  if (sunY < horizonY + angularRadius * 2) {
    // Ореол Ми (Mie Scattering)
    const haloGrad = ctx.createRadialGradient(sunX, sunY, angularRadius, sunX, sunY, angularRadius * 8);
    const haloColor = sunAlt < 0.1 ? 'rgba(255, 120, 50,' : 'rgba(255, 245, 200,';
    haloGrad.addColorStop(0, `${haloColor} ${Math.max(0, sunAlt + 0.2) * 0.6})`);
    haloGrad.addColorStop(1, 'rgba(0,0,0,0)');

    ctx.fillStyle = haloGrad;
    ctx.beginPath();
    ctx.arc(sunX, sunY, angularRadius * 8, 0, Math.PI * 2);
    ctx.fill();

    // Солнечная корона (видима при полном затмении)
    if (isEclipse && distSunMoon < angularRadius * 0.3) {
      const coronaGrad = ctx.createRadialGradient(sunX, sunY, angularRadius, sunX, sunY, angularRadius * 3);
      coronaGrad.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
      coronaGrad.addColorStop(0.5, 'rgba(200, 220, 255, 0.4)');
      coronaGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = coronaGrad;
      ctx.beginPath();
      ctx.arc(sunX, sunY, angularRadius * 3, 0, Math.PI * 2);
      ctx.fill();
    }

    // Солнечный диск
    ctx.fillStyle = sunAlt < 0.05 ? '#ff4500' : '#ffffff';
    ctx.beginPath();
    ctx.arc(sunX, sunY, angularRadius, 0, Math.PI * 2);
    ctx.fill();
  }

  // 5. ОТРИСОВКА ЛУНЫ И ЕЕ ФАЗ
  if (moonY < horizonY + angularRadius * 2) {
    ctx.save();
    
    // Базовый темный диск Луны (пепельный свет)
    ctx.fillStyle = 'rgba(30, 35, 45, 0.95)';
    ctx.beginPath();
    ctx.arc(moonX, moonY, angularRadius, 0, Math.PI * 2);
    ctx.fill();

    // Освещенная Солнцем часть (фаза)
    const dx = sunX - moonX;
    const dy = sunY - moonY;
    const sunMoonAngle = Math.atan2(dy, dx);

    ctx.fillStyle = '#e2e8f0';
    ctx.beginPath();
    ctx.arc(moonX, moonY, angularRadius, sunMoonAngle - Math.PI / 2, sunMoonAngle + Math.PI / 2);
    ctx.fill();

    ctx.restore();
  }

  // 6. ГОРИЗОНТ И РЕЛЬЕФ (Силуэт Земли)
  ctx.fillStyle = '#050811';
  ctx.beginPath();
  ctx.moveTo(0, horizonY);
  // Легкий холмистый силуэт
  for (let x = 0; x <= w; x += 50) {
    const hillHeight = Math.sin(x * 0.005) * 15 + Math.cos(x * 0.01) * 10;
    ctx.lineTo(x, horizonY + hillHeight);
  }
  ctx.lineTo(w, h);
  ctx.lineTo(0, h);
  ctx.closePath();
  ctx.fill();

  if (isPlaying) {
    timeSlider.value = (parseFloat(timeSlider.value) + 0.2) % 360;
    moonOrbitSlider.value = (parseFloat(moonOrbitSlider.value) + 0.25) % 360;
    requestAnimationFrame(render);
  }
}

timeSlider.addEventListener('input', render);
moonOrbitSlider.addEventListener('input', render);

playBtn.addEventListener('click', () => {
  isPlaying = !isPlaying;
  playBtn.textContent = isPlaying ? '⏸ Пауза' : '▶ Анимация';
  if (isPlaying) render();
});

render();
</script>
</body>
</html>
