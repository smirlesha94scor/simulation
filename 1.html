<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Ультра-легкая гистограмма (Без удаления в тишине)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #080810;
      color: #fff;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
    }

    .controls {
      margin-top: 15px;
      display: flex;
      gap: 15px;
      align-items: center;
      z-index: 10;
      background: rgba(255, 255, 255, 0.05);
      padding: 10px 20px;
      border-radius: 20px;
    }
    button {
      padding: 8px 18px;
      font-size: 14px;
      font-weight: bold;
      color: #000;
      background: #00ffcc;
      border: none;
      border-radius: 15px;
      cursor: pointer;
    }

    .stats {
      font-size: 14px;
      font-family: monospace;
    }
    .fps-good { color: #00ffcc; }
    .fps-bad { color: #ff3366; }

    .visualizer-wrapper {
      height: 65vh;
      display: flex;
      flex-direction: column;
      margin-bottom: 20px;
    }

    .bars-container {
      flex: 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 4px;
    }

    .bar-item {
      width: 15px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
    }

    .bar {
      width: 100%;
      height: 0%;
      background-color: #00ffcc; 
      border-radius: 2px 2px 0 0;
      will-change: height;
    }

    .freq-label {
      margin-top: 6px;
      font-size: 9px;
      font-family: monospace;
      color: #8888aa;
      white-space: nowrap;
      user-select: none;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="controls">
    <button id="startBtn">Запустить</button>
    <div class="stats">
      FPS: <span id="fpsVal" class="fps-good">--</span> | 
      Столбцов: <span id="barsVal">24</span>
    </div>
  </div>

  <div class="visualizer-wrapper">
    <div class="bars-container" id="equalizer"></div>
  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const equalizer = document.getElementById('equalizer');
    const fpsVal = document.getElementById('fpsVal');
    const barsVal = document.getElementById('barsVal');

    let currentBarsCount = 24;
    let barStyles = [];
    let prevRenderedHeights = [];
    let binIndices = [];
    let sampleRate = 44100;

    let lastTime = performance.now();
    let frameCount = 0;
    let renderToggle = false;

    function formatFrequency(hz) {
      return hz >= 1000 ? (hz / 1000).toFixed(1) + 'k' : Math.round(hz) + '';
    }

    function updateBinIndices(count, totalBins) {
      binIndices = new Int32Array(count);
      for (let i = 0; i < count; i++) {
        const logPercent = Math.pow(i / (count - 1), 1.2);
        binIndices[i] = 1 + Math.floor(logPercent * (totalBins * 0.9 - 1));
      }
    }

    function rebuildBars(count) {
      equalizer.innerHTML = '';
      barStyles = [];
      prevRenderedHeights = new Float32Array(count);
      
      const nyquist = sampleRate / 2;
      const totalBins = 128;

      updateBinIndices(count, totalBins);

      const fragment = document.createDocumentFragment();

      for (let i = 0; i < count; i++) {
        const itemWrapper = document.createElement('div');
        itemWrapper.className = 'bar-item';

        const bar = document.createElement('div');
        bar.className = 'bar';

        const dataIndex = binIndices[i];
        const freqHz = (dataIndex / totalBins) * nyquist;

        const label = document.createElement('div');
        label.className = 'freq-label';
        if (i % 2 === 0) label.textContent = formatFrequency(freqHz);

        itemWrapper.appendChild(bar);
        itemWrapper.appendChild(label);
        fragment.appendChild(itemWrapper);

        barStyles.push(bar.style);
      }

      equalizer.appendChild(fragment);
      barsVal.textContent = count;
    }

    rebuildBars(currentBarsCount);

    startBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: true
        });

        const audioTrack = stream.getAudioTracks()[0];
        if (!audioTrack) return alert('Аудио не выбрано!');

        startBtn.style.display = 'none';

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        sampleRate = audioCtx.sampleRate;

        const source = audioCtx.createMediaStreamSource(new MediaStream([audioTrack]));
        const analyser = audioCtx.createAnalyser();

        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.75;
        
        source.connect(analyser);

        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        rebuildBars(currentBarsCount);

        function render() {
          requestAnimationFrame(render);

          analyser.getByteFrequencyData(dataArray);

          // Расчет средней громкости потока для проверки наличия звука
          let totalVolume = 0;
          for (let i = 0; i < dataArray.length; i++) {
            totalVolume += dataArray[i];
          }
          const avgVolume = totalVolume / dataArray.length;
          const hasAudio = avgVolume > 5; // Звук есть, если средняя громкость выше порога

          // 1. Измерение FPS и умная авто-коррекция
          const now = performance.now();
          frameCount++;
          if (now - lastTime >= 1000) {
            const currentFps = Math.round((frameCount * 1000) / (now - lastTime));
            fpsVal.textContent = currentFps;
            frameCount = 0;
            lastTime = now;

            // Удаляем столбцы ТОЛЬКО при просадке FPS И ЕСЛИ идет активный звук
            if (currentFps < 40 && currentBarsCount > 6 && hasAudio) {
              fpsVal.className = 'fps-bad';
              currentBarsCount -= 2;
              rebuildBars(currentBarsCount);
            } else if (currentFps >= 45) {
              fpsVal.className = 'fps-good';
            } else {
              fpsVal.className = 'fps-bad';
            }
          }

          // 2. Пропуск кадров для разгрузки процессора
          renderToggle = !renderToggle;
          if (renderToggle) return;

          // 3. Отрисовка
          for (let i = 0; i < currentBarsCount; i++) {
            const val = (dataArray[binIndices[i]] * 0.3921568) | 0;

            if (val !== prevRenderedHeights[i]) {
              barStyles[i].height = val + '%';
              prevRenderedHeights[i] = val;
            }
          }
        }

        render();

      } catch (err) {
        console.error(err);
      }
    });
  </script>
</body>
</html>
