<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Парадокс огурцов</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }
        .task-text {
            font-style: italic;
            background: #eef2f3;
            padding: 15px;
            border-left: 5px solid #27ae60;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #219653;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f8f5;
            border: 1px solid #a3e4d7;
            border-radius: 6px;
            display: none;
        }
        .result h3 {
            margin-top: 0;
            color: #16a085;
        }
        .explanation {
            font-size: 13px;
            color: #555;
            margin-top: 10px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Калькулятор «Парадокса огурцов»</h1>
    
    <div class="task-text">
        <strong>Классическое условие:</strong> Было 100 кг огурцов, которые содержали 99% воды. После усыхания содержание воды снизилось до 98%. Сколько теперь весят огурцы?
    </div>

    <div class="input-group">
        <label for="initialWeight">Начальный вес огурцов (кг):</label>
        <input type="number" id="initialWeight" value="100" min="0.1" step="any">
    </div>

    <div class="input-group">
        <label for="initialWater">Начальная влажность (%):</label>
        <input type="number" id="initialWater" value="99" min="1" max="99.9" step="any">
    </div>

    <div class="input-group">
        <label for="finalWater">Конечная влажность (%):</label>
        <input type="number" id="finalWater" value="98" min="1" max="99.9" step="any">
    </div>

    <button id="myButton">Рассчитать вес</button>

    <div class="result" id="resultBlock">
        <h3>Результат:</h3>
        <p>Новый вес огурцов: <strong id="finalWeight">0</strong> кг.</p>
        <div class="explanation" id="explanationText"></div>
    </div>
</div>

<script>
    function calculateCucumbers() {
        const m1 = parseFloat(document.getElementById('initialWeight').value);
        const w1 = parseFloat(document.getElementById('initialWater').value);
        const w2 = parseFloat(document.getElementById('finalWater').value);

        if (isNaN(m1) || isNaN(w1) || isNaN(w2) || m1 <= 0 || w1 >= 100 || w2 >= 100 || w2 >= w1) {
            alert("Пожалуйста, введите корректные данные. Конечная влажность должна быть меньше начальной.");
            return;
        }

        const dryPercent1 = 100 - w1;
        const dryPercent2 = 100 - w2;
        const dryMass = (m1 * dryPercent1) / 100;
        const m2 = (dryMass / dryPercent2) * 100;

        document.getElementById('finalWeight').innerText = m2.toFixed(2);
        
        document.getElementById('explanationText').innerHTML = `
            <strong>Как это получилось?</strong><br>
            1. Сначала сухого вещества было ${dryPercent1}% от ${m1} кг, то есть <b>${dryMass.toFixed(2)} кг</b>.<br>
            2. После усыхания влажность стала ${w2}%, значит сухое вещество теперь составляет <b>${dryPercent2}%</b> от новой массы.<br>
            3. Так как абсолютная масса сухого вещества не изменилась (${dryMass.toFixed(2)} кг), мы находим полную новую массу: ${dryMass.toFixed(2)} / ${dryPercent2}% * 100% = <b>${m2.toFixed(2)} кг</b>.
        `;

        document.getElementById('resultBlock').style.display = 'block';
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('myButton').addEventListener('click', calculateCucumbers);
    });
</script>

</body>
</html>
