<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Гистограмма (40 столбцов x 15px)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #080810;
      color: #fff;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
    }

    /* Панель управления */
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 15px;
      align-items: center;
      z-index: 10;
      background: rgba(255, 255, 255, 0.05);
      padding: 10px 20px;
      border-radius: 20px;
    }
    button {
      padding: 8px 18px;
      font-size: 14px;
      font-weight: bold;
      color: #000;
      background: #00ffcc;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #00cca3;
    }

    .stats {
      font-size: 14px;
      font-family: monospace;
    }
    .fps-good { color: #00ffcc; }
    .fps-bad { color: #ff3366; }

    /* Оболочка визуализатора */
    .visualizer-wrapper {
      height: 65vh;
      display: flex;
      flex-direction: column;
      margin-bottom: 20px;
    }

    /* Контейнер столбцов */
    .bars-container {
      flex: 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 3px; /* Отступ между столбцами */
    }

    /* Оболочка одного столбца фиксированной ширины */
    .bar-item {
      width: 15px; /* Фиксированная ширина 15px */
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
    }

    /* Столбец гистограммы */
    .bar {
      width: 100%;
      height: 0%;
      background: linear-gradient(to top, #00ffcc, #0099ff, #ff0055);
      border-radius: 2px 2px 0 0;
    }

    /* Подпись частоты */
    .freq-label {
      margin-top: 6px;
      font-size: 9px;
      font-family: monospace;
      color: #8888aa;
      white-space: nowrap;
      user-select: none;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="controls">
    <button id="startBtn">Запустить</button>
    <div class="stats">
      FPS: <span id="fpsVal" class="fps-good">--</span> | 
      Столбцов: <span id="barsVal">40</span>
    </div>
  </div>

  <div class="visualizer-wrapper">
    <div class="bars-container" id="equalizer"></div>
  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const equalizer = document.getElementById('equalizer');
    const fpsVal = document.getElementById('fpsVal');
    const barsVal = document.getElementById('barsVal');

    let currentBarsCount = 40; // Ровно 40 столбцов
    let barsElements = [];
    let sampleRate = 44100;

    let lastTime = performance.now();
    let frameCount = 0;
    let currentFps = 60;

    function formatFrequency(hz) {
      if (hz >= 1000) {
        return (hz / 1000).toFixed(1) + 'k';
      }
      return Math.round(hz) + '';
    }

    // Пересборка столбцов шириной 15px
    function rebuildBars(count) {
      equalizer.innerHTML = '';
      barsElements = [];

      const nyquist = sampleRate / 2;
      const totalBins = 256; // fftSize = 512 дает 256 бинов частот

      for (let i = 0; i < count; i++) {
        const itemWrapper = document.createElement('div');
        itemWrapper.className = 'bar-item';

        const bar = document.createElement('div');
        bar.className = 'bar';

        // Логарифмический расчет частоты для равномерной анимации
        const logPercent = Math.pow(i / count, 2);
        const dataIndex = Math.floor(logPercent * (totalBins * 0.75));
        const freqHz = (dataIndex / totalBins) * nyquist;

        const label = document.createElement('div');
        label.className = 'freq-label';
        
        // Показывать подписи через одну, чтобы текст 15px столбцов не сливался
        if (i % 2 === 0) {
          label.textContent = formatFrequency(freqHz);
        } else {
          label.textContent = '';
        }

        itemWrapper.appendChild(bar);
        itemWrapper.appendChild(label);
        equalizer.appendChild(itemWrapper);

        barsElements.push(bar);
      }
      barsVal.textContent = count;
    }

    rebuildBars(currentBarsCount);

    startBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: true
        });

        const audioTrack = stream.getAudioTracks()[0];
        if (!audioTrack) {
          alert('Не включен доступ к аудио!');
          return;
        }

        startBtn.style.display = 'none';

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        sampleRate = audioCtx.sampleRate;

        const source = audioCtx.createMediaStreamSource(new MediaStream([audioTrack]));
        const analyser = audioCtx.createAnalyser();

        analyser.fftSize = 512; // Увеличено разрешение частот для 40 столбцов
        source.connect(analyser);

        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        rebuildBars(currentBarsCount);

        function render() {
          requestAnimationFrame(render);

          // 1. Мониторинг FPS
          const now = performance.now();
          frameCount++;
          if (now - lastTime >= 1000) {
            currentFps = Math.round((frameCount * 1000) / (now - lastTime));
            fpsVal.textContent = currentFps;
            frameCount = 0;
            lastTime = now;

            // Защита от зависания CPU: при FPS < 45 убираем по 1 столбцу
            if (currentFps < 45 && currentBarsCount > 8) {
              fpsVal.className = 'fps-bad';
              currentBarsCount--;
              rebuildBars(currentBarsCount);
            } else {
              fpsVal.className = 'fps-good';
            }
          }

          // 2. Отрисовка частот с логарифмическим распределением
          analyser.getByteFrequencyData(dataArray);

          for (let i = 0; i < currentBarsCount; i++) {
            // Квадратичное смещение акцентирует внимание на басах и вокале
            const logPercent = Math.pow(i / currentBarsCount, 1.8);
            const dataIndex = Math.floor(logPercent * (dataArray.length * 0.75));
            
            const value = dataArray[dataIndex];
            const percent = (value / 255) * 100;

            if (barsElements[i]) {
              barsElements[i].style.height = percent + '%';
            }
          }
        }

        render();

      } catch (err) {
        console.error("Ошибка:", err);
      }
    });
  </script>
</body>
</html>
