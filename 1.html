<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>До 1 сентября</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 20px;
        }

        .countdown-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 520px;
            width: 100%;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 30px;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .timer {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px 10px;
            border-radius: 12px;
            min-width: 90px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .number-wrapper {
            position: relative;
            height: 2.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .number {
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1;
            position: absolute;
            width: 100%;
            text-align: center;
            left: 0;
            top: 0;
        }

        .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            opacity: 0.85;
            display: block;
        }

        @media (max-width: 480px) {
            .timer { gap: 8px; }
            .time-box { min-width: 70px; padding: 15px 5px; }
            .number { font-size: 1.8rem; }
            .number-wrapper { height: 1.8rem; }
            .label { font-size: 0.65rem; }
        }
    </style>
</head>
<body>

    <div class="countdown-container">
        <h1>До 1 сентября осталось</h1>
        
        <div class="timer">
            <div class="time-box">
                <div class="number-wrapper" id="days-wrapper"></div>
                <span class="label">Дней</span>
            </div>
            <div class="time-box">
                <div class="number-wrapper" id="hours-wrapper"></div>
                <span class="label">Часов</span>
            </div>
            <div class="time-box">
                <div class="number-wrapper" id="minutes-wrapper"></div>
                <span class="label">Минут</span>
            </div>
            <div class="time-box">
                <div class="number-wrapper" id="seconds-wrapper"></div>
                <span class="label">Секунд</span>
            </div>
        </div>
    </div>

    <script>
        let targetDate = null;

        function initTargetDate() {
            const now = new Date();
            let targetYear = now.getFullYear();
            targetDate = new Date(`September 1, ${targetYear} 00:00:00`);
            
            if (now >= targetDate) {
                targetDate = new Date(`September 1, ${targetYear + 1} 00:00:00`);
            }
        }

        function renderUnit(wrapperId, currentVal, nextVal, currentOpacity) {
            const wrapper = document.getElementById(wrapperId);
            const nextOpacity = (1 - currentOpacity).toFixed(2);
            const currOpacityFixed = currentOpacity.toFixed(2);

            if (currentVal === nextVal) {
                wrapper.innerHTML = `<span class="number" style="opacity: 1">${currentVal}</span>`;
                return;
            }

            wrapper.innerHTML = `
                <span class="number" style="opacity: ${currOpacityFixed}">${currentVal}</span>
                <span class="number" style="opacity: ${nextOpacity}">${nextVal}</span>
            `;
        }

        function updateTimer() {
            const now = Date.now();
            let diffMs = targetDate - now;

            if (diffMs <= 0) {
                diffMs = 0;
            }

            const currentTotalSec = Math.floor(diffMs / 1000);
            const nextTotalSec = Math.max(0, currentTotalSec - 1);

            // Определение доли миллисекунд для плавной смены прозрачности
            const msRemainder = diffMs % 1000;
            const currentOpacity = msRemainder / 1000;

            const formatUnits = (totalSec) => ({
                d: String(Math.floor(totalSec / (60 * 60 * 24))).padStart(2, '0'),
                h: String(Math.floor((totalSec / (60 * 60)) % 24)).padStart(2, '0'),
                m: String(Math.floor((totalSec / 60) % 60)).padStart(2, '0'),
                s: String(totalSec % 60).padStart(2, '0')
            });

            const curr = formatUnits(currentTotalSec);
            const next = formatUnits(nextTotalSec);

            renderUnit('days-wrapper', curr.d, next.d, currentOpacity);
            renderUnit('hours-wrapper', curr.h, next.h, currentOpacity);
            renderUnit('minutes-wrapper', curr.m, next.m, currentOpacity);
            renderUnit('seconds-wrapper', curr.s, next.s, currentOpacity);
        }

        initTargetDate();
        updateTimer();
        // Обновление раз в 10 мс для идеальной плавности
        setInterval(updateTimer, 10);
    </script>

</body>
</html>
