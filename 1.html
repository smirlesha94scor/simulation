<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>До 1 сентября</title>
    <!-- Leaflet CSS для интерактивной карты -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
</head>
<body>
<style>
  /* Контейнер с изменением размера */
  #widgetWrapper {
    width: 450px;
    height: 400px;
    resize: both;
    overflow: hidden;
    border: 1px dashed #ccc;
    box-sizing: border-box;
    position: relative;
  }

  /* Внутренний контейнер фиксированного размера для корректного zoom */
  #widgetInner {
    width: 450px;
    height: 400px;
    transform-origin: 0 0;
  }

  /* Убираем скроллбары и растягиваем iframe */
  #widgetInner iframe {
    width: 450px !important;
    height: 400px !important;
    border: none !important;
    display: block;
  }
</style>

<div id="widgetWrapper">
  <div id="widgetInner">
    <a href="https://allcalc.ru/node/1900" id="calcLink" data-weight="450px" data-height="400px">Сколько дней осталось до 1 сентября - allcalc</a>
    <script src="https://allcalc.ru/widgets/script.js"></script>
  </div>
</div>

<script>
  const wrapper = document.getElementById('widgetWrapper');
  const inner = document.getElementById('widgetInner');
  const baseWidth = 450;
  const baseHeight = 400;

  // Масштабируем содержимое под реальный размер контейнера
  const resizeObserver = new ResizeObserver(entries => {
    for (let entry of entries) {
      const currentWidth = entry.contentRect.width;
      const currentHeight = entry.contentRect.height;

      // Вычисляем масштаб по меньшей стороне
      const scaleX = currentWidth / baseWidth;
      const scaleY = currentHeight / baseHeight;
      const scale = Math.min(scaleX, scaleY);

      // Применяем масштабирование
      inner.style.transform = `scale(${scale})`;
    }
  });

  resizeObserver.observe(wrapper);
</script>


</body>
</html>
