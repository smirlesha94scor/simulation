<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Three.js Low-Poly Motion Test (CPU)</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #0d0d11;
      font-family: 'Segoe UI', Tahoma, monospace;
    }
    #ui-container {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #00ffcc;
      background: rgba(15, 15, 25, 0.85);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid rgba(0, 255, 204, 0.3);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      max-width: 380px;
      user-select: none;
    }
    .info-line {
      margin-bottom: 6px;
      font-size: 13px;
    }
    .fps-counter {
      font-size: 20px;
      font-weight: bold;
      color: #00ff88;
    }
    .controls {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      background: #1a2636;
      color: #00ffcc;
      border: 1px solid #00ffcc;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }
    button:hover {
      background: #00ffcc;
      color: #000;
    }
    button:active {
      transform: scale(0.98);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui-container">
    <div class="info-line"><b>FPS:</b> <span id="fps" class="fps-counter">0</span></div>
    <div class="info-line"><b>Полигонов на сферу:</b> <span id="poly-per-sphere" style="color: #00ffcc;">96</span></div>
    <div class="info-line"><b>Всего полигонов:</b> <span id="poly-count" style="color: #fff;">0</span></div>
    <div class="info-line"><b>Всего объектов:</b> <span id="object-count" style="color: #fff;">0</span></div>
    <div class="info-line"><b>Динамические тени:</b> <span id="shadow-status" style="color: #ff4444;">ВЫКЛ</span></div>
    <hr style="border-color: rgba(0,255,204,0.2); margin: 8px 0;">
    <div class="info-line" style="font-size: 11px; word-break: break-all;">
      <b>Рендерер:</b> <span id="renderer-info" style="color: #aaa;">Загрузка...</span>
    </div>

    <div class="controls">
      <button id="add-objs">+ Добавить 100 сфер</button>
      <button id="remove-objs">- Удалить 100 сфер</button>
      <button id="reduce-poly">🔻 Уменьшить детализацию сфер (LOD)</button>
      <button id="toggle-shadows">Включить / Выключить Тени</button>
      <button id="reset-scene">Сбросить сцену</button>
    </div>
  </div>

  <script>
    // 1. Инициализация сцены и камеры
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 15, 35);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setPixelRatio(1);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = false;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // 2. Источники света
    const ambientLight = new THREE.AmbientLight(0x666666);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
    dirLight.position.set(20, 40, 20);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 512;
    dirLight.shadow.mapSize.height = 512;
    scene.add(dirLight);

    // 3. Плоскость пола
    const floorGeo = new THREE.PlaneGeometry(60, 60);
    const floorMat = new THREE.MeshLambertMaterial({ color: 0x1f1f2e });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -10;
    floor.receiveShadow = true;
    scene.add(floor);

    // 4. Настройки уровней детализации (LOD)
    const lodLevels = [
      { w: 10, h: 6, polys: 96 }, // Высокая
      { w: 8,  h: 4, polys: 48 }, // Средняя
      { w: 6,  h: 3, polys: 24 }  // Низкая (Ultra Low)
    ];
    let currentLodIndex = 0;
    let sphereGeo = new THREE.SphereGeometry(1, lodLevels[0].w, lodLevels[0].h);

    const objects = [];
    const BOUNDS = 20;

    function addObjects(count) {
      for (let i = 0; i < count; i++) {
        const material = new THREE.MeshLambertMaterial({
          color: Math.random() * 0xffffff
        });
        const mesh = new THREE.Mesh(sphereGeo, material);
        
        mesh.position.set(
          (Math.random() - 0.5) * (BOUNDS * 2),
          (Math.random() - 0.5) * (BOUNDS) + 5,
          (Math.random() - 0.5) * (BOUNDS * 2)
        );
        
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        
        mesh.userData = {
          vx: (Math.random() - 0.5) * 0.2,
          vy: (Math.random() - 0.5) * 0.2,
          vz: (Math.random() - 0.5) * 0.2
        };

        scene.add(mesh);
        objects.push(mesh);
      }
      updateStats();
    }

    function removeObjects(count) {
      const toRemove = Math.min(count, objects.length);
      for (let i = 0; i < toRemove; i++) {
        const obj = objects.pop();
        scene.remove(obj);
        obj.geometry.dispose();
        obj.material.dispose();
      }
      updateStats();
    }

    // Изменение детализации сфер на лету
    function changePolyCount() {
      currentLodIndex = (currentLodIndex + 1) % lodLevels.length;
      const lod = lodLevels[currentLodIndex];
      
      // Заменяем общую геометрию
      sphereGeo.dispose();
      sphereGeo = new THREE.SphereGeometry(1, lod.w, lod.h);

      // Применяем новую геометрию ко всем существующим сферам
      for (let i = 0; i < objects.length; i++) {
        objects[i].geometry = sphereGeo;
      }
      
      document.getElementById('poly-per-sphere').innerText = lod.polys;
      updateStats();
    }

    function updateStats() {
      const polyPerSphere = lodLevels[currentLodIndex].polys;
      const totalPolys = (objects.length * polyPerSphere) + 2;
      document.getElementById('poly-count').innerText = totalPolys.toLocaleString();
      document.getElementById('object-count').innerText = objects.length;
    }

    // 5. Физика перемещения
    function updatePhysics() {
      for (let i = 0; i < objects.length; i++) {
        const obj = objects[i];
        const data = obj.userData;

        obj.position.x += data.vx;
        obj.position.y += data.vy;
        obj.position.z += data.vz;

        if (Math.abs(obj.position.x) > BOUNDS) data.vx *= -1;
        if (obj.position.y > BOUNDS || obj.position.y < -9) data.vy *= -1;
        if (Math.abs(obj.position.z) > BOUNDS) data.vz *= -1;
      }
    }

    // 6. Вывод инфо о рендерере
    const gl = renderer.getContext();
    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
    if (debugInfo) {
      document.getElementById('renderer-info').innerText = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
    }

    // 7. Обработчики кнопок
    document.getElementById('add-objs').onclick = () => addObjects(100);
    document.getElementById('remove-objs').onclick = () => removeObjects(100);
    document.getElementById('reduce-poly').onclick = () => changePolyCount();
    
    document.getElementById('toggle-shadows').onclick = () => {
      renderer.shadowMap.enabled = !renderer.shadowMap.enabled;
      scene.traverse((child) => {
        if (child.material) child.material.needsUpdate = true;
      });
      
      const statusEl = document.getElementById('shadow-status');
      if (renderer.shadowMap.enabled) {
        statusEl.innerText = "ВКЛ";
        statusEl.style.color = "#00ff88";
      } else {
        statusEl.innerText = "ВЫКЛ";
        statusEl.style.color = "#ff4444";
      }
    };

    document.getElementById('reset-scene').onclick = () => {
      removeObjects(objects.length);
      renderer.shadowMap.enabled = false;
      document.getElementById('shadow-status').innerText = "ВЫКЛ";
      document.getElementById('shadow-status').style.color = "#ff4444";
    };

    // 8. Анимационный цикл
    let frameCount = 0;
    let lastTime = performance.now();

    function animate() {
      requestAnimationFrame(animate);

      updatePhysics();
      renderer.render(scene, camera);

      frameCount++;
      const time = performance.now();
      if (time >= lastTime + 1000) {
        const fpsEl = document.getElementById('fps');
        fpsEl.innerText = frameCount;
        
        if (frameCount >= 30) fpsEl.style.color = "#00ff88";
        else if (frameCount >= 15) fpsEl.style.color = "#ffcc00";
        else fpsEl.style.color = "#ff4444";

        frameCount = 0;
        lastTime = time;
      }
    }

    addObjects(100);
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
