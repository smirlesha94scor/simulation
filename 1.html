<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ручка таймера микроволновки</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f0f2f5;
      font-family: Arial, sans-serif;
    }

    .timer-container {
      position: relative;
      width: 320px;
      height: 320px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    .dial-svg {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
    }

    /* Ручка регулятора */
    .knob-wrapper {
      position: relative;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ffffff, #e6e6e6);
      box-shadow: 0 8px 16px rgba(0,0,0,0.12), inset 0 2px 4px rgba(255,255,255,0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: grab;
      touch-action: none;
    }

    .knob-wrapper:active {
      cursor: grabbing;
    }

    .knob {
      width: 118px;
      height: 118px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f8f8f8 0%, #d8d8d8 100%);
      box-shadow: inset 0 3px 6px rgba(0,0,0,0.15), 0 2px 4px rgba(255,255,255,0.8);
      position: relative;
    }

    /* Риска на ручке */
    .knob-mark {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 16px;
      background-color: #b0b0b0;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <div class="timer-container">
    <svg class="dial-svg" viewBox="0 0 320 320">
      <!-- Дуга шкалы -->
      <path id="scaleArc" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
      
      <!-- Засечки, тексты и иконки -->
      <g id="ticksGroup"></g>
    </svg>

    <!-- Ручка регулировки -->
    <div class="knob-wrapper" id="knobWrapper">
      <div class="knob" id="knob">
        <div class="knob-mark"></div>
      </div>
    </div>
  </div>

  <script>
    const knobWrapper = document.getElementById('knobWrapper');
    const knob = document.getElementById('knob');
    const ticksGroup = document.getElementById('ticksGroup');
    const scaleArc = document.getElementById('scaleArc');

    const CENTER = 160;
    const R_ARC = 105;
    const R_TICK_INNER = 100;
    const R_TICK_OUTER = 110;
    const R_TEXT = 124;

    // Картографирование минут в углы (в градусах, где 0 - это верх/12 часов)
    // 0 мин = -12°, 35 мин = -45° (315°), идут по часовой стрелке
    const minuteAngles = {
      0: -12,
      1: 10,
      2: 28,
      3: 46,
      4: 64,
      5: 82,
      6: 100,
      7: 118,
      8: 136,
      9: 154,
      10: 172,
      15: 212,
      20: 242,
      25: 267,
      30: 290,
      35: 315
    };

    // Отрисовка дуги от 0 до 35 минут
    function drawArc() {
      const startAngle = minuteAngles[0] - 90;
      const endAngle = minuteAngles[35] - 90;

      const startRad = startAngle * (Math.PI / 180);
      const endRad = endAngle * (Math.PI / 180);

      const x1 = CENTER + R_ARC * Math.cos(startRad);
      const y1 = CENTER + R_ARC * Math.sin(startRad);
      const x2 = CENTER + R_ARC * Math.cos(endRad);
      const y2 = CENTER + R_ARC * Math.sin(endRad);

      // Окружная дуга
      scaleArc.setAttribute('d', `M ${x1} ${y1} A ${R_ARC} ${R_ARC} 0 1 1 ${x2} ${y2}`);
    }

    // Создание элемента SVG
    function createSVG(tag, attrs) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
      for (let k in attrs) el.setAttribute(k, attrs[k]);
      return el;
    }

    // Построение всех элементов шкалы
    function renderDial() {
      drawArc();

      Object.entries(minuteAngles).forEach(([minStr, angleDeg]) => {
        const min = Number(minStr);
        const rad = (angleDeg - 90) * (Math.PI / 180);

        // 1. Риски/засечки
        const x1 = CENTER + R_TICK_INNER * Math.cos(rad);
        const y1 = CENTER + R_TICK_INNER * Math.sin(rad);
        const x2 = CENTER + R_TICK_OUTER * Math.cos(rad);
        const y2 = CENTER + R_TICK_OUTER * Math.sin(rad);

        ticksGroup.appendChild(createSVG('line', {
          x1, y1, x2, y2,
          stroke: '#1a1a1a',
          'stroke-width': min % 5 === 0 ? '2.5' : '1.8',
          'stroke-linecap': 'round'
        }));

        // 2. Цифры
        const tx = CENTER + R_TEXT * Math.cos(rad);
        const ty = CENTER + R_TEXT * Math.sin(rad);

        const textEl = createSVG('text', {
          x: tx,
          y: ty + 4,
          'text-anchor': 'middle',
          'font-size': '13',
          'font-weight': 'bold',
          fill: '#1a1a1a'
        });
        textEl.textContent = minStr;
        ticksGroup.appendChild(textEl);

        // 3. Выносные линии с иконками для 1, 3, 7
        if ([1, 3, 7].includes(min)) {
          let lx1 = CENTER + (R_TEXT + 8) * Math.cos(rad);
          let ly1 = CENTER + (R_TEXT + 8) * Math.sin(rad);
          let lx2 = lx1 + 18;
          let ly2 = ly1 - 6;
          let iconX = lx2 + 10;
          let iconY = ly2 + 4;
          let icon = '';

          if (min === 1) icon = '☕';
          if (min === 3) icon = '🥣';
          if (min === 7) {
            ly2 = ly1 + 6;
            iconY = ly2 + 4;
            icon = '🥕';
          }

          // Полоска-выноска
          ticksGroup.appendChild(createSVG('polyline', {
            points: `${lx1},${ly1} ${lx2},${ly2}`,
            stroke: '#1a1a1a',
            'stroke-width': '1',
            fill: 'none'
          }));

          // Иконка
          const iconEl = createSVG('text', {
            x: iconX,
            y: iconY,
            'font-size': '14',
            'text-anchor': 'start'
          });
          iconEl.textContent = icon;
          ticksGroup.appendChild(iconEl);
        }
      });
    }

    renderDial();

    // Логика вращения ручки и таймера
    let currentAngle = minuteAngles[0];
    let totalSeconds = 0;
    let timerInterval = null;
    let isDragging = false;
    let audioCtx = null;

    function playBellSound() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.2);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 1.2);
    }

    function updateKnobPosition() {
      const currentFraction = totalSeconds / (35 * 60);
      const minAngle = minuteAngles[0];
      const maxAngle = minuteAngles[35];
      
      currentAngle = minAngle + currentFraction * (maxAngle - minAngle);
      knob.style.transform = `rotate(${currentAngle}deg)`;
    }

    function calculateAngle(e) {
      const rect = knobWrapper.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      let deg = Math.atan2(clientY - cy, clientX - cx) * (180 / Math.PI) + 90;
      if (deg < -20) deg += 360;

      const startA = minuteAngles[0];
      const endA = minuteAngles[35];

      if (deg < startA) deg = startA;
      if (deg > endA) deg = endA;

      const fraction = (deg - startA) / (endA - startA);
      const minutes = Math.round(fraction * 35 * 2) / 2;

      totalSeconds = Math.max(0, Math.min(35 * 60, Math.round(minutes * 60)));
      updateKnobPosition();
    }

    function startTimer() {
      stopTimer();
      if (totalSeconds > 0) {
        timerInterval = setInterval(() => {
          if (totalSeconds > 0) {
            totalSeconds--;
            updateKnobPosition();
          } else {
            stopTimer();
            playBellSound();
          }
        }, 1000);
      }
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function onPointerDown(e) {
      isDragging = true;
      stopTimer();
      calculateAngle(e);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
    }

    function onPointerMove(e) {
      if (isDragging) calculateAngle(e);
    }

    function onPointerUp() {
      if (isDragging) {
        isDragging = false;
        window.removeEventListener('pointermove', onPointerMove);
        window.removeEventListener('pointerup', onPointerUp);
        startTimer();
      }
    }

    knobWrapper.addEventListener('pointerdown', onPointerDown);
  </script>
</body>
</html>
