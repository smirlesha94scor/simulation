<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Парадокс огурцов</title>
    <!-- Библиотека Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }
        .task-text {
            font-style: italic;
            background: #eef2f3;
            padding: 15px;
            border-left: 5px solid #27ae60;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #219653;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f8f5;
            border: 1px solid #a3e4d7;
            border-radius: 6px;
            display: none;
        }
        .result h3 {
            margin-top: 0;
            color: #16a085;
        }
        .explanation {
            font-size: 13px;
            color: #555;
            margin-top: 10px;
            line-height: 1.4;
        }
        .charts-wrapper {
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin-top: 20px;
        }
        .chart-box {
            position: relative;
            width: 100%;
        }
        .doughnut-box {
            max-width: 320px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Калькулятор «Парадокса огурцов»</h1>
    
    <div class="task-text">
        <strong>Классическое условие:</strong> Было 100 кг огурцов, которые содержали 99% воды. После усыхания содержание воды снизилось до 98%. Сколько теперь весят огурцы?
    </div>

    <div class="input-group">
        <label for="initialWeight">Начальный вес огурцов (кг):</label>
        <input type="number" id="initialWeight" value="100" min="0.1" step="any">
    </div>

    <div class="input-group">
        <label for="initialWater">Начальная влажность (%):</label>
        <input type="number" id="initialWater" value="99" min="0.2" max="99.9" step="any">
    </div>

    <div class="input-group">
        <label for="finalWater">Конечная влажность (%):</label>
        <input type="number" id="finalWater" value="98" min="0.1" max="98.9" step="any">
    </div>

    <button id="myButton">Рассчитать вес</button>

    <div class="result" id="resultBlock">
        <h3>Результат:</h3>
        <p>Новый вес огурцов: <strong id="finalWeight">0</strong> кг.</p>
        <div class="explanation" id="explanationText"></div>

        <div class="charts-wrapper">
            <!-- График 1: Круговая диаграмма состава -->
            <div class="chart-box doughnut-box">
                <canvas id="compositionChart"></canvas>
            </div>
            <!-- График 2: Зависимость массы от влажности -->
            <div class="chart-box">
                <canvas id="humidityChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    let humidityChartInstance = null;
    let compositionChartInstance = null;

    function syncHumidityInputs(e) {
        const initialInput = document.getElementById('initialWater');
        const finalInput = document.getElementById('finalWater');

        let w1 = parseFloat(initialInput.value);
        let w2 = parseFloat(finalInput.value);

        if (e && e.target === initialInput) {
            if (!isNaN(w1) && !isNaN(w2) && w1 <= w2) {
                finalInput.value = Math.max(0.1, (w1 - 0.1)).toFixed(1);
            }
        } else if (e && e.target === finalInput) {
            if (!isNaN(w1) && !isNaN(w2) && w2 >= w1) {
                finalInput.value = Math.max(0.1, (w1 - 0.1)).toFixed(1);
            }
        }

        if (!isNaN(parseFloat(initialInput.value))) {
            finalInput.max = Math.max(0.1, (parseFloat(initialInput.value) - 0.1)).toFixed(1);
        }
        if (!isNaN(parseFloat(finalInput.value))) {
            initialInput.min = (parseFloat(finalInput.value) + 0.1).toFixed(1);
        }
    }

    function calculateCucumbers() {
        const m1 = parseFloat(document.getElementById('initialWeight').value);
        const w1 = parseFloat(document.getElementById('initialWater').value);
        const w2 = parseFloat(document.getElementById('finalWater').value);

        if (isNaN(m1) || isNaN(w1) || isNaN(w2)) {
            alert("Пожалуйста, заполните все поля корректными числами.");
            return;
        }

        if (m1 <= 0) {
            alert("Начальный вес должен быть больше 0.");
            return;
        }

        if (w1 >= 100 || w1 <= 0 || w2 >= 100 || w2 <= 0) {
            alert("Влажность должна быть в диапазоне от 0% до 100%.");
            return;
        }

        if (w1 <= w2) {
            alert("Начальная влажность не может быть меньше или равна конечной.");
            return;
        }

        const dryPercent1 = 100 - w1;
        const dryPercent2 = 100 - w2;
        const dryMass = (m1 * dryPercent1) / 100;
        const m2 = (dryMass / dryPercent2) * 100;
        const waterMass = m2 - dryMass;

        document.getElementById('finalWeight').innerText = m2.toFixed(2);
        
        document.getElementById('explanationText').innerHTML = `
            <strong>Состав нового веса (${m2.toFixed(2)} кг):</strong><br>
            • Сухое вещество: <b>${dryMass.toFixed(2)} кг</b> (${dryPercent2.toFixed(2)}%)<br>
            • Вода: <b>${waterMass.toFixed(2)} кг</b> (${w2}%)
        `;

        document.getElementById('resultBlock').style.display = 'block';

        renderCompositionChart(dryMass, waterMass);
        renderHumidityChart(m1, w1, w2, dryMass);
    }

    // Круговая диаграмма масс
    function renderCompositionChart(dryMass, waterMass) {
        const ctx = document.getElementById('compositionChart').getContext('2d');
        if (compositionChartInstance) {
            compositionChartInstance.destroy();
        }

        compositionChartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Сухое вещество (кг)', 'Масса воды (кг)'],
                datasets: [{
                    data: [dryMass.toFixed(2), waterMass.toFixed(2)],
                    backgroundColor: ['#e67e22', '#3498db'],
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    title: {
                        display: true,
                        text: 'Соотношение массы воды и сухого остатка'
                    }
                }
            }
        });
    }

    // Линейный график изменения массы
    function renderHumidityChart(m1, w1, selectedW2, dryMass) {
        const labels = [];
        const data = [];

        const step = Math.max(1, Math.floor(w1 / 20));
        for (let w = 0; w < w1; w += step) {
            labels.push(`${w}%`);
            const weight = (dryMass / (100 - w)) * 100;
            data.push(weight.toFixed(2));
        }

        if (!labels.includes(`${selectedW2}%`)) {
            labels.push(`${selectedW2}%`);
            data.push(((dryMass / (100 - selectedW2)) * 100).toFixed(2));
        }

        labels.push(`${w1}%`);
        data.push(m1.toFixed(2));

        const combined = labels.map((label, i) => ({
            x: parseFloat(label),
            label: label,
            y: parseFloat(data[i])
        })).sort((a, b) => a.x - b.x);

        const sortedLabels = combined.map(item => item.label);
        const sortedData = combined.map(item => item.y);

        const ctx = document.getElementById('humidityChart').getContext('2d');
        if (humidityChartInstance) {
            humidityChartInstance.destroy();
        }

        humidityChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: sortedLabels,
                datasets: [{
                    label: 'Зависимость общей массы (кг) от влажности (%)',
                    data: sortedData,
                    borderColor: '#27ae60',
                    backgroundColor: 'rgba(39, 174, 96, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.3,
                    pointBackgroundColor: sortedLabels.map(l => l === `${selectedW2}%` ? '#e74c3c' : '#27ae60'),
                    pointRadius: sortedLabels.map(l => l === `${selectedW2}%` ? 6 : 3)
                }]
            },
            options: {
                responsive: true,
                scales: {
                    x: { title: { display: true, text: 'Влажность (%)' } },
                    y: { title: { display: true, text: 'Масса (кг)' }, beginAtZero: true }
                }
            }
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        const initialInput = document.getElementById('initialWater');
        const finalInput = document.getElementById('finalWater');

        initialInput.addEventListener('input', syncHumidityInputs);
        finalInput.addEventListener('input', syncHumidityInputs);

        syncHumidityInputs();

        document.getElementById('myButton').addEventListener('click', calculateCucumbers);
    });
</script>

</body>
</html>
