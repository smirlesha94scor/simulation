<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>До 1 сентября</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            gap: 25px;
            padding: 20px;
        }

        .settings-panel {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            max-width: 600px;
            width: 100%;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .setting-group label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.9;
        }

        .setting-group select {
            padding: 6px 10px;
            border-radius: 8px;
            border: none;
            outline: none;
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            cursor: pointer;
        }

        .countdown-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 25px;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .timer {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px 10px;
            border-radius: 12px;
            min-width: 75px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .number-wrapper {
            position: relative;
            height: 2.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .number {
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1;
            position: absolute;
            width: 100%;
            text-align: center;
            left: 0;
            top: 0;
        }

        .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
            opacity: 0.85;
            display: block;
        }

        /* Индикатор значений opacity */
        .opacity-info {
            margin-top: 25px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 12px 15px;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-around;
            gap: 10px;
        }

        .opacity-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .opacity-item span {
            font-weight: 700;
            font-size: 1.1rem;
        }

        @media (max-width: 480px) {
            .timer { gap: 8px; }
            .time-box { min-width: 60px; padding: 10px 5px; }
            .number { font-size: 1.6rem; }
            .number-wrapper { height: 1.6rem; }
            .label { font-size: 0.65rem; }
            .opacity-info { font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <div class="settings-panel">
        <div class="setting-group">
            <label for="speedSelect">Длительность 1 сек</label>
            <select id="speedSelect" onchange="changeTimerSpeed()">
                <option value="1000" selected>1 сек (Реальное время - 1000 мс)</option>
                <option value="5000">5 сек (Замедленно)</option>
                <option value="60000">60 сек (1 сек = 1 мин)</option>
            </select>
        </div>
    </div>

    <div class="countdown-container">
        <h1>До 1 сентября осталось</h1>
        <div class="timer">
            <div class="time-box">
                <div class="number-wrapper">
                    <span class="number" id="days">00</span>
                </div>
                <span class="label">Дней</span>
            </div>
            <div class="time-box">
                <div class="number-wrapper">
                    <span class="number" id="hours">00</span>
                </div>
                <span class="label">Часов</span>
            </div>
            <div class="time-box">
                <div class="number-wrapper">
                    <span class="number" id="minutes">00</span>
                </div>
                <span class="label">Минут</span>
            </div>
            <div class="time-box">
                <div class="number-wrapper">
                    <span class="number" id="seconds">00</span>
                </div>
                <span class="label">Секунд</span>
            </div>
        </div>

        <!-- Вывод параметров прозрачности -->
        <div class="opacity-info">
            <div class="opacity-item">
                Текущая цифра:
                <span id="curr-opacity-val">1.000 (100%)</span>
            </div>
            <div class="opacity-item">
                Следующая цифра:
                <span id="next-opacity-val">0.000 (0%)</span>
            </div>
        </div>
    </div>

    <script>
        let mainTimerInterval = null;
        let totalRemainingSeconds = 0;

        function initTargetSeconds() {
            const now = new Date();
            let targetYear = now.getFullYear();
            let targetDate = new Date(`September 1, ${targetYear} 00:00:00`);
            
            if (now > targetDate) {
                targetDate = new Date(`September 1, ${targetYear + 1} 00:00:00`);
            }
            
            totalRemainingSeconds = Math.floor((targetDate - now) / 1000);
        }

        function updateOpacityDisplay(currOpacity, nextOpacity) {
            const currElem = document.getElementById('curr-opacity-val');
            const nextElem = document.getElementById('next-opacity-val');
            
            currElem.innerText = `${currOpacity.toFixed(3)} (${Math.round(currOpacity * 100)}%)`;
            nextElem.innerText = `${nextOpacity.toFixed(3)} (${Math.round(nextOpacity * 100)}%)`;
        }

        function transitionOpacity(element, newValue) {
            const wrapper = element.parentElement;

            const newDigit = document.createElement('span');
            newDigit.className = 'number';
            newDigit.innerText = newValue;

            element.style.opacity = '1';
            newDigit.style.opacity = '0';

            wrapper.appendChild(newDigit);

            const duration = 1000;
            let startTime = null;

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                
                let progress = elapsed / duration;
                if (progress > 1) progress = 1;

                const currOpacity = 1 - progress;
                const nextOpacity = progress;

                element.style.opacity = currOpacity.toFixed(3);
                newDigit.style.opacity = nextOpacity.toFixed(3);

                // Если меняется секунда, транслируем ее Opacity в блок информации
                if (element.id === 'seconds') {
                    updateOpacityDisplay(currOpacity, nextOpacity);
                }

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    element.innerText = newValue;
                    element.style.opacity = '1';
                    newDigit.remove();
                    
                    if (element.id === 'seconds') {
                        updateOpacityDisplay(1, 0);
                    }
                }
            }

            requestAnimationFrame(animate);
        }

        function updateElement(id, newValue) {
            const el = document.getElementById(id);
            if (el.innerText !== newValue) {
                transitionOpacity(el, newValue);
            }
        }

        function renderTimer() {
            if (totalRemainingSeconds <= 0) {
                totalRemainingSeconds = 0;
            }

            const d = String(Math.floor(totalRemainingSeconds / (60 * 60 * 24))).padStart(2, '0');
            const h = String(Math.floor((totalRemainingSeconds / (60 * 60)) % 24)).padStart(2, '0');
            const m = String(Math.floor((totalRemainingSeconds / 60) % 60)).padStart(2, '0');
            const s = String(totalRemainingSeconds % 60).padStart(2, '0');

            updateElement('days', d);
            updateElement('hours', h);
            updateElement('minutes', m);
            updateElement('seconds', s);
        }

        function tick() {
            renderTimer();
            if (totalRemainingSeconds > 0) {
                totalRemainingSeconds--;
            }
        }

        function changeTimerSpeed() {
            if (mainTimerInterval) clearInterval(mainTimerInterval);
            const speed = parseInt(document.getElementById('speedSelect').value) || 1000;
            
            if (speed === 1000) {
                initTargetSeconds();
            }

            tick();
            mainTimerInterval = setInterval(tick, speed);
        }

        initTargetSeconds();
        changeTimerSpeed();
    </script>

</body>
</html>
