<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конструктор Электросети</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: Arial, sans-serif;
      overflow: hidden;
      display: flex;
    }
    #main-area {
      flex: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #toolbar {
      height: 50px;
      background-color: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      padding: 0 15px;
      gap: 10px;
    }
    .tool-btn {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: 0.2s;
    }
    .tool-btn:hover {
      background: #30363d;
    }
    .tool-btn.active {
      background: #238636;
      border-color: #2ea44f;
      color: #fff;
    }
    .tool-btn.delete.active {
      background: #da3633;
      border-color: #f85149;
    }
    #canvas-container {
      flex: 1;
      position: relative;
    }
    canvas {
      display: block;
      cursor: crosshair;
    }
    #ui-panel {
      width: 260px;
      background-color: #161b22;
      border-left: 1px solid #30363d;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    h2 {
      margin: 0 0 10px 0;
      font-size: 18px;
      color: #58a6ff;
    }
    .stat-card {
      background: #21262d;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #30363d;
    }
    .stat-value {
      font-size: 20px;
      font-weight: bold;
      color: #7ee787;
    }
    .stat-label {
      font-size: 12px;
      color: #8b949e;
    }
    .hint {
      font-size: 12px;
      color: #8b949e;
      line-height: 1.4;
      background: #0d1117;
      padding: 10px;
      border-radius: 6px;
      border: 1px dashed #30363d;
    }
    .rules-list {
      font-size: 11px;
      color: #8b949e;
      padding-left: 15px;
      margin: 5px 0 0 0;
    }
  </style>
</head>
<body>

  <div id="main-area">
    <div id="toolbar">
      <button class="tool-btn active" data-tool="select">👆 Выбор</button>
      <button class="tool-btn" data-tool="plant">⚡ Станция</button>
      <button class="tool-btn" data-tool="substation">🔷 Подстанция</button>
      <button class="tool-btn" data-tool="house">🏠 Дом</button>
      <button class="tool-btn" data-tool="wire">🔌 ЛЭП (Провод)</button>
      <button class="tool-btn delete" data-tool="delete">🗑️ Удалить</button>
    </div>
    <div id="canvas-container">
      <canvas id="simCanvas"></canvas>
    </div>
  </div>

  <div id="ui-panel">
    <h2>Правила сети</h2>
    
    <div class="stat-card">
      <div class="stat-label">Запитано домов</div>
      <div class="stat-value" id="poweredHouses">0 / 0</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">Перегруженные ПС</div>
      <div class="stat-value" id="overloadedCount" style="color: #da3633;">0</div>
    </div>

    <div class="hint">
      <strong>Правила размещения:</strong>
      <ul class="rules-list">
        <li>Макс. 3 дома на 1 подстанцию.</li>
        <li>Радиус действия ПС — 200px.</li>
        <li>При перегрузке ПС отключается.</li>
      </ul>
    </div>

    <div class="hint" id="helpText">
      Выберите инструмент и кликните по полю.
    </div>
  </div>

  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    const SUBSTATION_RADIUS = 200;
    const MAX_HOUSES_PER_SUBSTATION = 3;

    function resizeCanvas() {
      canvas.width = document.getElementById('canvas-container').clientWidth;
      canvas.height = document.getElementById('canvas-container').clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let currentTool = 'select';
    let selectedNodeForWire = null;
    let hoveredSubstation = null;
    let nextId = 1;

    let nodes = [];
    let lines = [];
    let dashOffset = 0;

    document.querySelectorAll('.tool-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTool = btn.dataset.tool;
        selectedNodeForWire = null;
        updateHelpText();
      });
    });

    function updateHelpText() {
      const help = document.getElementById('helpText');
      switch (currentTool) {
        case 'plant': help.innerText = 'Постройте Электростанцию — источник энергии.'; break;
        case 'substation': help.innerText = `Подстанция питает до ${MAX_HOUSES_PER_SUBSTATION} домов в радиусе ${SUBSTATION_RADIUS}px.`; break;
        case 'house': help.innerText = 'Разместите прямоугольный дом в зоне действия подстанции.'; break;
        case 'wire': help.innerText = 'Соединяйте Станцию с Подстанцией, а Подстанцию с Домом.'; break;
        case 'delete': help.innerText = 'Удаление элементов сети.'; break;
        default: help.innerText = 'Режим просмотра.'; break;
      }
    }

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      hoveredSubstation = nodes.find(n => n.type === 'substation' && Math.hypot(n.x - x, n.y - y) < 25);
    });

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const clickedNode = nodes.find(n => Math.hypot(n.x - x, n.y - y) < 25);

      if (currentTool === 'delete') {
        if (clickedNode) {
          nodes = nodes.filter(n => n.id !== clickedNode.id);
          lines = lines.filter(l => l.from !== clickedNode.id && l.to !== clickedNode.id);
        }
      } 
      else if (currentTool === 'wire') {
        if (clickedNode) {
          if (!selectedNodeForWire) {
            selectedNodeForWire = clickedNode;
          } else if (selectedNodeForWire.id !== clickedNode.id) {
            
            const dist = Math.hypot(selectedNodeForWire.x - clickedNode.x, selectedNodeForWire.y - clickedNode.y);
            const isSubstationToHouse = 
              (selectedNodeForWire.type === 'substation' && clickedNode.type === 'house') ||
              (selectedNodeForWire.type === 'house' && clickedNode.type === 'substation');

            if (isSubstationToHouse && dist > SUBSTATION_RADIUS) {
              alert(`Слишком далеко! Подстанция достает только на ${SUBSTATION_RADIUS}px (сейчас: ${Math.round(dist)}px).`);
            } else {
              const exists = lines.some(l => 
                (l.from === selectedNodeForWire.id && l.to === clickedNode.id) ||
                (l.from === clickedNode.id && l.to === selectedNodeForWire.id)
              );
              if (!exists) {
                lines.push({ from: selectedNodeForWire.id, to: clickedNode.id });
              }
            }
            selectedNodeForWire = null;
          }
        }
      } 
      else if (['plant', 'substation', 'house'].includes(currentTool)) {
        if (!clickedNode) {
          nodes.push({
            id: nextId++,
            type: currentTool,
            x: x,
            y: y,
            powered: false,
            load: 0,
            overloaded: false
          });
        }
      }

      calculatePower();
      updateStats();
    });

    function calculatePower() {
      nodes.forEach(n => {
        n.powered = (n.type === 'plant');
        n.load = 0;
        n.overloaded = false;
      });

      nodes.filter(n => n.type === 'substation').forEach(sub => {
        const connectedHouses = lines.filter(l => {
          const otherId = l.from === sub.id ? l.to : (l.to === sub.id ? l.from : null);
          if (!otherId) return false;
          const otherNode = nodes.find(n => n.id === otherId);
          return otherNode && otherNode.type === 'house';
        });

        sub.load = connectedHouses.length;
        if (sub.load > MAX_HOUSES_PER_SUBSTATION) {
          sub.overloaded = true;
        }
      });

      let queue = nodes.filter(n => n.type === 'plant').map(n => n.id);
      let visited = new Set(queue);

      while (queue.length > 0) {
        let currentId = queue.shift();

        lines.forEach(line => {
          let neighborId = null;
          if (line.from === currentId) neighborId = line.to;
          if (line.to === currentId) neighborId = line.from;

          if (neighborId && !visited.has(neighborId)) {
            let neighborNode = nodes.find(n => n.id === neighborId);

            if (neighborNode) {
              if (neighborNode.type === 'substation' && neighborNode.overloaded) {
                return; 
              }

              neighborNode.powered = true;
              visited.add(neighborId);
              queue.push(neighborId);
            }
          }
        });
      }
    }

    function updateStats() {
      const houses = nodes.filter(n => n.type === 'house');
      const powered = houses.filter(n => n.powered);
      const overloaded = nodes.filter(n => n.type === 'substation' && n.overloaded);

      document.getElementById('poweredHouses').innerText = `${powered.length} / ${houses.length}`;
      document.getElementById('overloadedCount').innerText = overloaded.length;
    }

    function drawGrid() {
      ctx.strokeStyle = '#161b22';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }
    }

    function drawLines() {
      lines.forEach(line => {
        const start = nodes.find(n => n.id === line.from);
        const end = nodes.find(n => n.id === line.to);
        if (!start || !end) return;

        const isPowered = start.powered && end.powered;

        ctx.beginPath();
        ctx.moveTo(start.x, start.y);
        ctx.lineTo(end.x, end.y);
        ctx.lineWidth = 3;
        ctx.strokeStyle = isPowered ? '#388bfd' : '#484f58';
        ctx.stroke();

        if (isPowered) {
          ctx.beginPath();
          ctx.moveTo(start.x, start.y);
          ctx.lineTo(end.x, end.y);
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#7ee787';
          ctx.setLineDash([6, 6]);
          ctx.lineDashOffset = -dashOffset;
          ctx.stroke();
          ctx.setLineDash([]);
        }
      });
    }

    function drawNodes() {
      nodes.forEach(node => {
        if (node.type === 'substation' && (hoveredSubstation?.id === node.id || selectedNodeForWire?.id === node.id)) {
          ctx.beginPath();
          ctx.arc(node.x, node.y, SUBSTATION_RADIUS, 0, Math.PI * 2);
          ctx.fillStyle = node.overloaded ? 'rgba(218, 54, 51, 0.1)' : 'rgba(31, 111, 235, 0.1)';
          ctx.fill();
          ctx.strokeStyle = node.overloaded ? '#da3633' : '#1f6feb';
          ctx.setLineDash([4, 4]);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        ctx.beginPath();

        if (selectedNodeForWire && selectedNodeForWire.id === node.id) {
          ctx.arc(node.x, node.y, 25, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(88, 166, 255, 0.3)';
          ctx.fill();
        }

        if (node.type === 'plant') {
          ctx.fillStyle = '#2ea44f';
          ctx.fillRect(node.x - 20, node.y - 20, 40, 40);
          ctx.strokeStyle = '#7ee787';
          ctx.lineWidth = 2;
          ctx.strokeRect(node.x - 20, node.y - 20, 40, 40);
        } 
        else if (node.type === 'substation') {
          ctx.fillStyle = node.overloaded ? '#da3633' : (node.powered ? '#1f6feb' : '#30363d');
          ctx.beginPath();
          ctx.moveTo(node.x, node.y - 16); ctx.lineTo(node.x + 16, node.y);
          ctx.lineTo(node.x, node.y + 16); ctx.lineTo(node.x - 16, node.y);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = node.overloaded ? '#f85149' : (node.powered ? '#58a6ff' : '#8b949e');
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.fillStyle = '#c9d1d9';
          ctx.font = '10px Arial';
          ctx.textAlign = 'center';
          ctx.fillText(`${node.load}/${MAX_HOUSES_PER_SUBSTATION}`, node.x, node.y + 28);
        } 
        else if (node.type === 'house') {
          // Прямоугольный дом
          const w = 32;
          const h = 24;
          const x = node.x - w / 2;
          const y = node.y - h / 2;

          // Корпус дома
          ctx.fillStyle = node.powered ? '#8957e5' : '#da3633';
          ctx.fillRect(x, y, w, h);
          ctx.strokeStyle = node.powered ? '#d2a8ff' : '#f85149';
          ctx.lineWidth = 2;
          ctx.strokeRect(x, y, w, h);

          // Окна (светятся желтым, если дом запитан)
          ctx.fillStyle = node.powered ? '#ffe866' : '#21262d';
          ctx.fillRect(x + 5, y + 5, 8, 6);
          ctx.fillRect(x + 19, y + 5, 8, 6);
          ctx.fillRect(x + 5, y + 13, 8, 6);
          ctx.fillRect(x + 19, y + 13, 8, 6);
        }
      });
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGrid();
      drawLines();
      drawNodes();
      dashOffset += 0.6;
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
