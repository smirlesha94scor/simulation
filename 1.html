<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симуляция: Ограничение камеры у земли</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #info {
            position: absolute; top: 10px; left: 10px; color: #fff;
            background: rgba(0, 0, 0, 0.75); padding: 12px 18px; border-radius: 8px;
            max-width: 350px; font-size: 14px; line-height: 1.4; z-index: 10;
        }
        #controls-panel {
            position: absolute; bottom: 20px; left: 10px; z-index: 10;
            background: rgba(0, 0, 0, 0.75); padding: 10px; border-radius: 8px;
        }
        button {
            background: #007bff; color: white; border: none; padding: 8px 14px;
            font-size: 14px; border-radius: 4px; cursor: pointer; transition: 0.2s;
        }
        button:hover { background: #0056b3; }
        .highlight { color: #4da6ff; font-weight: bold; }
    </style>
</head>
<body>

<div id="info">
    <b>Микро-камера на Земле</b><br>
    Текущий режим: <span id="mode-text" class="highlight">Космос</span><br>
    <small id="hint">В режиме «С Земли» зажмите ЛКМ. Камера больше не проваливается под землю!</small>
</div>

<div id="controls-panel">
    <button id="toggle-cam-btn">Переключить вид (С Земли / Космос)</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
    // 1. Сцена
    const scene = new THREE.Scene();

    // 2. Камеры
    const spaceCamera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
    spaceCamera.position.set(0, 80, 150); 

    const surfaceCamera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.0001, 2000);

    let activeCamera = spaceCamera;
    let isSurfaceView = false;

    // Рендерер
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Управление для космоса
    const spaceControls = new THREE.OrbitControls(spaceCamera, renderer.domElement);
    spaceControls.enableDamping = true;

    // Управление для поверхности Земли
    const surfaceControls = new THREE.OrbitControls(surfaceCamera, renderer.domElement);
    surfaceControls.enableDamping = true;
    surfaceControls.enableZoom = false; // Отключаем приближение/отдаление
    surfaceControls.enabled = false;

    // --- ОГРАНИЧЕНИЕ НАКЛОНА (Чтобы не проваливаться под землю) ---
    surfaceControls.minPolarAngle = 0.01;            // Максимально вверх (в зенит)
    surfaceControls.maxPolarAngle = Math.PI / 2 - 0.02; // Максимально вниз (чуть выше горизонта)

    // Свет
    const ambientLight = new THREE.AmbientLight(0x333344);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
    sunLight.castShadow = true;
    scene.add(sunLight);

    // 3. СОЛНЦЕ
    const sunGeometry = new THREE.SphereGeometry(6, 32, 32);
    const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xfff5ea });
    const sun = new THREE.Mesh(sunGeometry, sunMaterial);
    sun.position.set(0, 0, -400);
    scene.add(sun);

    sunLight.position.copy(sun.position);

    // --- ЗЕМЛЯ ---
    const earthOrbitGroup = new THREE.Group();
    scene.add(earthOrbitGroup);

    const earthAxialTiltGroup = new THREE.Group();
    earthAxialTiltGroup.rotation.z = THREE.MathUtils.degToRad(23.5);
    earthOrbitGroup.add(earthAxialTiltGroup);

    const earthRotationGroup = new THREE.Group();
    earthAxialTiltGroup.add(earthRotationGroup);

    const earthRadius = 2.0;
    const earthGeometry = new THREE.SphereGeometry(earthRadius, 128, 128);
    const earthMaterial = new THREE.MeshStandardMaterial({ 
        color: 0x1d55bb, 
        roughness: 0.6 
    });
    const earth = new THREE.Mesh(earthGeometry, earthMaterial);
    earth.castShadow = true;
    earth.receiveShadow = true;
    earthRotationGroup.add(earth);

    // Точка привязки камеры ("Человек" на поверхности)
    const surfaceAnchor = new THREE.Group();
    // Приподнимаем человека чуть выше радиуса сферы
    surfaceAnchor.position.set(0, earthRadius + 0.005, 0); 
    earthRotationGroup.add(surfaceAnchor);

    // Прикрепляем камеру к поверхности
    surfaceAnchor.add(surfaceCamera);

    // ЛУНА
    const moonOrbitGroup = new THREE.Group();
    earthAxialTiltGroup.add(moonOrbitGroup);

    const moonGeometry = new THREE.SphereGeometry(0.5, 16, 16);
    const moonMaterial = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.9 });
    const moon = new THREE.Mesh(moonGeometry, moonMaterial);
    moon.position.set(12, 0, 0);
    moon.castShadow = true;
    moon.receiveShadow = true;
    moonOrbitGroup.add(moon);

    // Переключение режимов
    const btn = document.getElementById('toggle-cam-btn');
    const modeText = document.getElementById('mode-text');

    btn.addEventListener('click', () => {
        isSurfaceView = !isSurfaceView;
        if (isSurfaceView) {
            activeCamera = surfaceCamera;
            modeText.innerText = "Поверхность Земли";
            spaceControls.enabled = false;
            
            surfaceControls.enabled = true;
            // Точка, куда изначально смотрит камера (на уровень горизонта)
            surfaceControls.target.set(0, earthRadius + 0.005, -1);
        } else {
            activeCamera = spaceCamera;
            modeText.innerText = "Космос";
            surfaceControls.enabled = false;
            spaceControls.enabled = true;
        }
    });

    // Анимация
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);

        const delta = clock.getDelta();

        earthRotationGroup.rotation.y += 0.2 * delta;   
        moonOrbitGroup.rotation.y += 0.05 * delta;     

        if (isSurfaceView) {
            surfaceControls.update();
        } else {
            spaceControls.update();
        }

        renderer.render(scene, activeCamera);
    }

    window.addEventListener('resize', () => {
        spaceCamera.aspect = window.innerWidth / window.innerHeight;
        spaceCamera.updateProjectionMatrix();
        surfaceCamera.aspect = window.innerWidth / window.innerHeight;
        surfaceCamera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
