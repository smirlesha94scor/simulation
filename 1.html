<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Песочница Автоматизации — Чистый Three.js</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      user-select: none;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(20, 20, 20, 0.85);
      padding: 12px;
      border-radius: 8px;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .btn-group {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    button {
      background: #34495e;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.2s;
    }
    button:hover { background: #415b76; }
    button.active { background: #27ae60; }
    #info {
      position: absolute;
      bottom: 10px;
      left: 10px;
      color: white;
      background: rgba(0,0,0,0.7);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 13px;
      pointer-events: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="ui">
    <strong>Инструменты:</strong>
    <div class="btn-group">
      <button id="btn-fan" onclick="selectTool('fan')">🌀 Вентилятор</button>
      <button id="btn-magnet" onclick="selectTool('magnet')">🧲 Магнит</button>
      <button id="btn-panel" onclick="selectTool('panel')">📐 Панель</button>
      <button id="btn-piston" onclick="selectTool('piston')">🔨 Поршень</button>
      <button id="btn-launcher" onclick="selectTool('launcher')">🚀 Запускник</button>
      <button id="btn-spring" onclick="selectTool('spring')">🦘 Пружина</button>
      <button id="btn-rack" onclick="selectTool('rack')">📦 Стойка</button>
      <button id="btn-broom" onclick="selectTool('broom')">🧹 Метла</button>
    </div>
    <hr style="border: 0.5px solid #444; width: 100%;">
    <strong>Спавн объектов:</strong>
    <div class="btn-group">
      <button onclick="spawnMetalBox()">📦 Металл</button>
      <button onclick="spawnDuck()">🦆 Утка</button>
    </div>
  </div>

  <div id="info">Кликните по арене для размещения выбранного инструмента</div>

  <script>
    // --- 1. ИНИЦИАЛИЗАЦИЯ THREE.JS ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a24);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 12, 16);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2, 0);
    controls.update();

    // Гравитация (м/с²)
    const GRAVITY = new THREE.Vector3(0, -15, 0);

    // --- 2. ОСВЕЩЕНИЕ И ОКРУЖЕНИЕ ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);

    // Пол (Арена)
    const groundGeo = new THREE.PlaneGeometry(20, 20);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50 });
    const groundMesh = new THREE.Mesh(groundGeo, groundMat);
    groundMesh.rotation.x = -Math.PI / 2;
    groundMesh.receiveShadow = true;
    scene.add(groundMesh);

    // --- 3. ХРАНИЛИЩА ОБЪЕКТОВ И ИНСТРУМЕНТОВ ---
    const dynamicObjects = []; // Утки и металл
    const activeTools = [];    // Установленные инструменты
    let selectedTool = null;

    // Материалы Three.js
    const materials = {
      metal: new THREE.MeshStandardMaterial({ color: 0x7f8c8d, metalness: 0.8, roughness: 0.2 }),
      duck: new THREE.MeshStandardMaterial({ color: 0xf1c40f, roughness: 0.5 }),
      fan: new THREE.MeshStandardMaterial({ color: 0x3498db }),
      magnet: new THREE.MeshStandardMaterial({ color: 0xe74c3c }),
      panel: new THREE.MeshStandardMaterial({ color: 0xe67e22 }),
      piston: new THREE.MeshStandardMaterial({ color: 0x9b59b6 }),
      launcher: new THREE.MeshStandardMaterial({ color: 0x2ecc71 }),
      spring: new THREE.MeshStandardMaterial({ color: 0x1abc9c }),
      rack: new THREE.MeshStandardMaterial({ color: 0x34495e }),
      broom: new THREE.MeshStandardMaterial({ color: 0xd35400 })
    };

    // --- 4. ДИНАМИЧЕСКИЙ ФИЗИЧЕСКИЙ ОБЪЕКТ (Кастомный калькулятор физики) ---
    class PhysicsObject {
      constructor(mesh, radius, isMetallic) {
        this.mesh = mesh;
        this.radius = radius;
        this.isMetallic = isMetallic;
        this.velocity = new THREE.Vector3(0, 0, 0);
        this.acceleration = new THREE.Vector3(0, 0, 0);
        this.damping = 0.98; // Трение воздуха
        this.bounce = 0.6;  // Коэффициент отскока
      }

      applyForce(force) {
        this.acceleration.add(force);
      }

      update(dt) {
        // Добавляем гравитацию
        this.acceleration.add(GRAVITY);

        // Интегрирование Эйлера
        this.velocity.addScaledVector(this.acceleration, dt);
        this.mesh.position.addScaledVector(this.velocity, dt);

        // Замедление трением
        this.velocity.x *= this.damping;
        this.velocity.z *= this.damping;

        // Коллизия с полом
        if (this.mesh.position.y - this.radius < 0) {
          this.mesh.position.y = this.radius;
          this.velocity.y = -this.velocity.y * this.bounce;
        }

        // Ограничение по границам арены
        const bound = 9.5;
        if (Math.abs(this.mesh.position.x) > bound) {
          this.mesh.position.x = Math.sign(this.mesh.position.x) * bound;
          this.velocity.x *= -this.bounce;
        }
        if (Math.abs(this.mesh.position.z) > bound) {
          this.mesh.position.z = Math.sign(this.mesh.position.z) * bound;
          this.velocity.z *= -this.bounce;
        }

        // Сброс ускорения для следующего кадра
        this.acceleration.set(0, 0, 0);
      }
    }

    // --- 5. КЛАССЫ ИНСТРУМЕНТОВ ---
    class Tool {
      constructor(type, position) {
        this.type = type;
        this.mesh = new THREE.Group();
        this.mesh.position.copy(position);
        scene.add(this.mesh);
      }
      update() {}
    }

    class FanTool extends Tool {
      constructor(pos) {
        super('fan', pos);
        const geo = new THREE.BoxGeometry(1.2, 1.2, 0.5);
        const mesh = new THREE.Mesh(geo, materials.fan);
        mesh.castShadow = true;
        this.mesh.add(mesh);
        this.mesh.position.y += 0.6;
      }
      update() {
        const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(this.mesh.quaternion);
        dynamicObjects.forEach(obj => {
          const dir = new THREE.Vector3().subVectors(obj.mesh.position, this.mesh.position);
          const dist = dir.length();
          if (dist < 7 && dir.angleTo(forward) < 0.6) {
            const force = forward.clone().multiplyScalar(30 / (dist + 1));
            obj.applyForce(force);
          }
        });
      }
    }

    class MagnetTool extends Tool {
      constructor(pos) {
        super('magnet', pos);
        const geo = new THREE.CylinderGeometry(0.5, 0.5, 1, 16);
        const mesh = new THREE.Mesh(geo, materials.magnet);
        mesh.castShadow = true;
        this.mesh.add(mesh);
        this.mesh.position.y += 0.5;
      }
      update() {
        dynamicObjects.forEach(obj => {
          if (obj.isMetallic) {
            const dir = new THREE.Vector3().subVectors(this.mesh.position, obj.mesh.position);
            const dist = dir.length();
            if (dist < 8) {
              dir.normalize().multiplyScalar(50 / (dist * dist + 0.5));
              obj.applyForce(dir);
            }
          }
        });
      }
    }

    class PanelTool extends Tool {
      constructor(pos) {
        super('panel', pos);
        const geo = new THREE.BoxGeometry(2, 0.2, 1);
        const mesh = new THREE.Mesh(geo, materials.panel);
        mesh.castShadow = true;
        this.mesh.add(mesh);
        this.mesh.position.y += 0.5;
        this.mesh.rotation.z = Math.PI / 8; // Небольшой наклон
      }
    }

    class PistonTool extends Tool {
      constructor(pos) {
        super('piston', pos);
        const geo = new THREE.BoxGeometry(1, 1, 1);
        const mesh = new THREE.Mesh(geo, materials.piston);
        mesh.castShadow = true;
        this.mesh.add(mesh);
        this.mesh.position.y += 0.5;
        this.timer = 0;
      }
      update() {
        this.timer += 0.05;
        if (Math.sin(this.timer) > 0.96) {
          dynamicObjects.forEach(obj => {
            const dist = this.mesh.position.distanceTo(obj.mesh.position);
            if (dist < 1.8) {
              obj.velocity.add(new THREE.Vector3(0, 8, 12));
            }
          });
        }
      }
    }

    class SpringTool extends Tool {
      constructor(pos) {
        super('spring', pos);
        const geo = new THREE.CylinderGeometry(0.8, 0.8, 0.3, 16);
        const mesh = new THREE.Mesh(geo, materials.spring);
        mesh.castShadow = true;
        this.mesh.add(mesh);
        this.mesh.position.y += 0.15;
      }
      update() {
        dynamicObjects.forEach(obj => {
          const distXZ = new THREE.Vector2(
            this.mesh.position.x - obj.mesh.position.x,
            this.mesh.position.z - obj.mesh.position.z
          ).length();

          if (distXZ < 0.9 && Math.abs(obj.mesh.position.y - this.mesh.position.y) < 0.6) {
            obj.velocity.y = 12; // Импульс вверх
          }
        });
      }
    }

    // --- 6. СПАВН ОБЪЕКТОВ ---
    function spawnMetalBox() {
      const geo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
      const mesh = new THREE.Mesh(geo, materials.metal);
      mesh.castShadow = true;
      scene.add(mesh);

      const obj = new PhysicsObject(mesh, 0.4, true);
      obj.mesh.position.set((Math.random() - 0.5) * 4, 8, (Math.random() - 0.5) * 4);
      dynamicObjects.push(obj);
    }

    function spawnDuck() {
      const geo = new THREE.SphereGeometry(0.5, 16, 16);
      const mesh = new THREE.Mesh(geo, materials.duck);
      mesh.castShadow = true;
      scene.add(mesh);

      const obj = new PhysicsObject(mesh, 0.5, false);
      obj.mesh.position.set((Math.random() - 0.5) * 4, 8, (Math.random() - 0.5) * 4);
      dynamicObjects.push(obj);
    }

    // --- 7. РАЗМЕЩЕНИЕ И ИНТЕРФЕЙС ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function selectTool(type) {
      selectedTool = type;
      document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById(`btn-${type}`);
      if (activeBtn) activeBtn.classList.add('active');
    }

    window.addEventListener('pointerdown', (e) => {
      if (e.target.tagName === 'BUTTON' || e.target.closest('#ui')) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(groundMesh);

      if (intersects.length > 0 && selectedTool) {
        const point = intersects[0].point;
        let tool = null;

        switch(selectedTool) {
          case 'fan': tool = new FanTool(point); break;
          case 'magnet': tool = new MagnetTool(point); break;
          case 'panel': tool = new PanelTool(point); break;
          case 'piston': tool = new PistonTool(point); break;
          case 'spring': tool = new SpringTool(point); break;
          default:
            tool = new Tool(selectedTool, point);
            const geo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            const mesh = new THREE.Mesh(geo, materials[selectedTool] || materials.rack);
            tool.mesh.add(mesh);
            tool.mesh.position.y += 0.4;
            break;
        }

        if (tool) activeTools.push(tool);
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 8. АНИМАЦИОННЫЙ ЦИКЛ ---
    let lastTime = performance.now();

    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const dt = Math.min((now - lastTime) / 1000, 0.1); // Дельта времени
      lastTime = now;

      // Обновление логики инструментов
      activeTools.forEach(tool => tool.update());

      // Обновление физики всех объектов
      dynamicObjects.forEach(obj => obj.update(dt));

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
