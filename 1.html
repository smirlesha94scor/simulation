<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Гистограмма с защитой от зависания</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #080810;
      color: #fff;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
    }

    /* Панель управления */
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 15px;
      align-items: center;
      z-index: 10;
      background: rgba(255, 255, 255, 0.05);
      padding: 10px 20px;
      border-radius: 20px;
    }
    button {
      padding: 8px 18px;
      font-size: 14px;
      font-weight: bold;
      color: #000;
      background: #00ffcc;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #00cca3;
    }
    button:disabled {
      background: #555;
      color: #888;
      cursor: not-allowed;
    }

    .stats {
      font-size: 14px;
      font-family: monospace;
    }
    .fps-good { color: #00ffcc; }
    .fps-bad { color: #ff3366; }

    /* Контейнер эквалайзера */
    .visualizer-container {
      width: 95vw;
      height: 60vh;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 2px;
      margin-bottom: 20px;
    }

    /* Столбец гистограммы */
    .bar {
      flex: 1;
      height: 0%;
      background: linear-gradient(to top, #00ffcc, #0099ff, #ff0055);
      border-radius: 2px 2px 0 0;
      /* CSS transition специально убран для снижения нагрузки на CPU */
    }
  </style>
</head>
<body>

  <div class="controls">
    <button id="startBtn">Запустить</button>
    <button id="addBarBtn" disabled>+1 столбец</button>
    <div class="stats">
      FPS: <span id="fpsVal" class="fps-good">--</span> | 
      Столбцов: <span id="barsVal">32</span>
    </div>
  </div>

  <div class="visualizer-container" id="equalizer"></div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const addBarBtn = document.getElementById('addBarBtn');
    const equalizer = document.getElementById('equalizer');
    const fpsVal = document.getElementById('fpsVal');
    const barsVal = document.getElementById('barsVal');

    let currentBarsCount = 32; // Стартуем с 32 столбцов
    const maxAllowedBars = 128; // Максимальный лимит для fftSize = 256
    let barsElements = [];

    // Замер FPS
    let lastTime = performance.now();
    let frameCount = 0;
    let currentFps = 60;
    let isRunning = false;

    // Функция обновления DOM-структуры столбцов
    function rebuildBars(count) {
      equalizer.innerHTML = '';
      barsElements = [];
      for (let i = 0; i < count; i++) {
        const bar = document.createElement('div');
        bar.className = 'bar';
        equalizer.appendChild(bar);
        barsElements.push(bar);
      }
      barsVal.textContent = count;
    }

    // Создаем начальные 32 столбца
    rebuildBars(currentBarsCount);

    // Кнопка вручную добавить столбец
    addBarBtn.addEventListener('click', () => {
      if (currentBarsCount < maxAllowedBars) {
        currentBarsCount++;
        rebuildBars(currentBarsCount);
      }
    });

    startBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: true
        });

        const audioTrack = stream.getAudioTracks()[0];
        if (!audioTrack) {
          alert('Не включен доступ к аудио!');
          return;
        }

        startBtn.style.display = 'none';
        addBarBtn.disabled = false;
        isRunning = true;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(new MediaStream([audioTrack]));
        const analyser = audioCtx.createAnalyser();

        analyser.fftSize = 256; 
        source.connect(analyser);

        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        function render() {
          requestAnimationFrame(render);

          // 1. Расчет FPS каждую секунду
          const now = performance.now();
          frameCount++;
          if (now - lastTime >= 1000) {
            currentFps = Math.round((frameCount * 1000) / (now - lastTime));
            fpsVal.textContent = currentFps;
            frameCount = 0;
            lastTime = now;

            // 2. Детектор лагов: если FPS упал ниже 45, автоматически удаляем 1 столбец
            if (currentFps < 45 && currentBarsCount > 4) {
              fpsVal.className = 'fps-bad';
              currentBarsCount--; // Авто-удаление последнего столбца
              rebuildBars(currentBarsCount);
            } else {
              fpsVal.className = 'fps-good';
            }
          }

          // 3. Отрисовка частот
          analyser.getByteFrequencyData(dataArray);
          const step = dataArray.length / currentBarsCount;

          for (let i = 0; i < currentBarsCount; i++) {
            const dataIndex = Math.floor(i * step);
            const value = dataArray[dataIndex];
            const percent = (value / 255) * 100;

            if (barsElements[i]) {
              barsElements[i].style.height = percent + '%';
            }
          }
        }

        render();

      } catch (err) {
        console.error("Ошибка доступа:", err);
      }
    });
  </script>
</body>
</html>
