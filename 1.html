<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>До 1 сентября</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            gap: 25px;
            padding: 20px;
        }

        .settings-panel {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            max-width: 600px;
            width: 100%;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .setting-group label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.9;
        }

        .setting-group select {
            padding: 6px 10px;
            border-radius: 8px;
            border: none;
            outline: none;
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            cursor: pointer;
        }

        .countdown-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 25px;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .timer {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px 8px;
            border-radius: 12px;
            min-width: 65px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .number-wrapper {
            position: relative;
            height: 2.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .number {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1;
            position: absolute;
            width: 100%;
            text-align: center;
            left: 0;
            top: 0;
        }

        .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
            opacity: 0.85;
            display: block;
        }

        @media (max-width: 520px) {
            .timer { gap: 6px; }
            .time-box { min-width: 55px; padding: 10px 4px; }
            .number { font-size: 1.4rem; }
            .number-wrapper { height: 1.4rem; }
            .label { font-size: 0.55rem; }
        }
    </style>
</head>
<body>

    <div class="settings-panel">
        <div class="setting-group">
            <label for="speedSelect">Режим работы</label>
            <select id="speedSelect" onchange="changeTimerSpeed()">
                <option value="1000" selected>Замедленный (10 мс таймера за 1 сек)</option>
                <option value="10">Нормальный (1 сек = 1000 мс)</option>
            </select>
        </div>
    </div>

    <div class="countdown-container">
        <h1>До 1 сентября осталось</h1>
        <div class="timer">
            <div class="time-box">
                <div class="number-wrapper">
                    <span class="number" id="days">00</span>
                </div>
                <span class="label">Дней</span>
            </div>
            <div class="time-box">
                <div class="number-wrapper">
                    <span class="number" id="hours">00</span>
                </div>
                <span class="label">Часов</span>
            </div>
            <div class="time-box">
                <div class="number-wrapper">
                    <span class="number" id="minutes">00</span>
                </div>
                <span class="label">Минут</span>
            </div>
            <div class="time-box">
                <div class="number-wrapper">
                    <span class="number" id="seconds">00</span>
                </div>
                <span class="label">Секунд</span>
            </div>
            <div class="time-box">
                <div class="number-wrapper">
                    <span class="number" id="ms">00</span>
                </div>
                <span class="label">МС</span>
            </div>
        </div>
    </div>

    <script>
        let mainTimerInterval = null;
        let totalRemainingMs = 0;

        function initTargetMs() {
            const now = new Date();
            let targetYear = now.getFullYear();
            let targetDate = new Date(`September 1, ${targetYear} 00:00:00`);
            
            if (now > targetDate) {
                targetDate = new Date(`September 1, ${targetYear + 1} 00:00:00`);
            }
            
            totalRemainingMs = targetDate - now;
        }

        function transitionOpacity(element, newValue, durationMs) {
            const wrapper = element.parentElement;

            const newDigit = document.createElement('span');
            newDigit.className = 'number';
            newDigit.innerText = newValue;

            element.style.opacity = '1';
            newDigit.style.opacity = '0';

            wrapper.appendChild(newDigit);

            let startTime = null;

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                let progress = elapsed / durationMs;
                if (progress > 1) progress = 1;

                element.style.opacity = (1 - progress).toFixed(2);
                newDigit.style.opacity = progress.toFixed(2);

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    element.innerText = newValue;
                    element.style.opacity = '1';
                    newDigit.remove();
                }
            }

            requestAnimationFrame(animate);
        }

        function updateElement(id, newValue, speedMs) {
            const el = document.getElementById(id);
            if (el.innerText !== newValue) {
                transitionOpacity(el, newValue, speedMs);
            }
        }

        function renderTimer(speedMs) {
            if (totalRemainingMs <= 0) {
                totalRemainingMs = 0;
            }

            const totalSeconds = Math.floor(totalRemainingMs / 1000);
            
            const d = String(Math.floor(totalSeconds / (60 * 60 * 24))).padStart(2, '0');
            const h = String(Math.floor((totalSeconds / (60 * 60)) % 24)).padStart(2, '0');
            const m = String(Math.floor((totalSeconds / 60) % 60)).padStart(2, '0');
            const s = String(totalSeconds % 60).padStart(2, '0');
            
            // Вычисляем сотые доли секунды (шаг по 10 мс = 0-99)
            const ms = String(Math.floor((totalRemainingMs % 1000) / 10)).padStart(2, '0');

            updateElement('days', d, speedMs);
            updateElement('hours', h, speedMs);
            updateElement('minutes', m, speedMs);
            updateElement('seconds', s, speedMs);
            updateElement('ms', ms, speedMs);
        }

        function tick() {
            const speed = parseInt(document.getElementById('speedSelect').value) || 1000;
            renderTimer(speed);
            
            if (totalRemainingMs > 0) {
                totalRemainingMs -= 10; // Вычитаем строго по 10 мс таймера за каждый шаг
            }
        }

        function changeTimerSpeed() {
            if (mainTimerInterval) clearInterval(mainTimerInterval);
            const speed = parseInt(document.getElementById('speedSelect').value) || 1000;
            
            initTargetMs();
            tick();
            mainTimerInterval = setInterval(tick, speed);
        }

        initTargetMs();
        changeTimerSpeed();
    </script>

</body>
</html>
