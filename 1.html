<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Декодер стереограмм с точной настройкой</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background: #1e1e1e;
            color: #fff;
            margin-top: 20px;
        }
        #drop-zone {
            width: 80%;
            max-width: 600px;
            height: 80px;
            border: 3px dashed #4CAF50;
            border-radius: 10px;
            margin: 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2d2d2d;
            color: #bbb;
            font-size: 15px;
        }
        #drop-zone.hover { background: #388E3C; color: #fff; }
        .controls {
            margin: 10px auto;
            display: none;
        }
        input[type=range] { width: 250px; }
        canvas { display: none; }
        #result img {
            max-width: 100%;
            margin-top: 15px;
            border-radius: 5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <h2>Декодер стереограмм</h2>
    <div id="drop-zone">Перетащите картинку сюда</div>

    <div class="controls" id="controls">
        <label>Горизонтальный период: <span id="val-x">74</span> px</label><br>
        <input type="range" id="range-x" min="30" max="150" value="74"><br><br>

        <label>Вертикальный сдвиг: <span id="val-y">0</span> px</label><br>
        <input type="range" id="range-y" min="-20" max="20" value="0">
    </div>

    <h3 id="status"></h3>
    <div id="result"></div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const statusText = document.getElementById('status');
        const resultDiv = document.getElementById('result');
        const controls = document.getElementById('controls');
        
        const rangeX = document.getElementById('range-x');
        const rangeY = document.getElementById('range-y');
        const valX = document.getElementById('val-x');
        const valY = document.getElementById('val-y');

        let originalImageData = null;
        let imgWidth = 0;
        let imgHeight = 0;

        // Drag and Drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, e => { e.preventDefault(); e.stopPropagation(); }, false);
        });
        dropZone.addEventListener('dragenter', () => dropZone.classList.add('hover'));
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('hover'));
        dropZone.addEventListener('drop', e => {
            dropZone.classList.remove('hover');
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                loadImage(e.dataTransfer.files[0]);
            }
        });

        function loadImage(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    imgWidth = img.width;
                    imgHeight = img.height;
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = imgWidth;
                    canvas.height = imgHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    
                    originalImageData = ctx.getImageData(0, 0, imgWidth, imgHeight);
                    controls.style.display = 'block';
                    render();
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function render() {
            if (!originalImageData) return;

            const shiftX = parseInt(rangeX.value);
            const shiftY = parseInt(rangeY.value);
            
            valX.innerText = shiftX;
            valY.innerText = shiftY;

            const data = originalImageData.data;
            const outputData = new Uint8ClampedArray(data.length);
            const contrastFactor = 3.5;

            for (let y = 0; y < imgHeight; y++) {
                for (let x = 0; x < imgWidth; x++) {
                    const idx = (y * imgWidth + x) * 4;
                    
                    // Учитываем и горизонтальный период, и вертикальный сдвиг
                    const targetX = x + shiftX;
                    const targetY = y + shiftY;

                    if (targetX < imgWidth && targetY >= 0 && targetY < imgHeight) {
                        const targetIdx = (targetY * imgWidth + targetX) * 4;
                        
                        const r = Math.abs(data[idx] - data[targetIdx]);
                        const g = Math.abs(data[idx + 1] - data[targetIdx + 1]);
                        const b = Math.abs(data[idx + 2] - data[targetIdx + 2]);

                        outputData[idx]     = Math.min(255, r * contrastFactor);
                        outputData[idx + 1] = Math.min(255, g * contrastFactor);
                        outputData[idx + 2] = Math.min(255, b * contrastFactor);
                        outputData[idx + 3] = 255;
                    } else {
                        outputData[idx] = outputData[idx+1] = outputData[idx+2] = 0;
                        outputData[idx + 3] = 255;
                    }
                }
            }

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = imgWidth;
            tempCanvas.height = imgHeight;
            const tempCtx = tempCanvas.getContext('2d');
            const newImgData = tempCtx.createImageData(imgWidth, imgHeight);
            newImgData.data.set(outputData);
            tempCtx.putImageData(newImgData, 0, 0);

            resultDiv.innerHTML = '';
            const resultImg = document.createElement('img');
            resultImg.src = tempCanvas.toDataURL('image/png');
            resultDiv.appendChild(resultImg);
            statusText.innerText = `Готово! (X: ${shiftX}px, Y: ${shiftY}px)`;
        }

        rangeX.addEventListener('input', render);
        rangeY.addEventListener('input', render);
    </script>
</body>
</html>
