<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Телеканалы Украины</title>

    <!-- Подключение Clappr -->
    <script src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .custompanel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
        }

        .panel-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .panel-group label {
            color: #94a3b8;
        }

        input[type="color"] {
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            background: transparent;
        }

        .content-layout {
            display: flex;
            gap: 20px;
        }

        @media (max-width: 800px) {
            .content-layout {
                flex-direction: column;
            }
        }

        .player-box {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .player-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        #player {
            width: 100%;
            height: 100%;
        }

        .custom-buttons-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            align-items: center;
        }

        .custom-btn {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            transition: all 0.2s;
        }

        .custom-btn:hover {
            background: #38bdf8;
            color: #0f172a;
        }

        .custom-btn.active-autoplay {
            background: #ef4444;
            color: #fff;
            border-color: #f87171;
        }

        .timer-info {
            font-size: 0.85rem;
            color: #38bdf8;
            font-weight: bold;
            margin-left: auto;
        }

        [data-player] .bar-fill-1 {
            background-color: var(--accent-color, #38bdf8) !important;
        }

        .playlist-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            max-height: 520px;
            display: flex;
            flex-direction: column;
        }

        .playlist-title {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #38bdf8;
            font-weight: bold;
        }

        .channel-list {
            list-style: none;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 5px;
        }

        .channel-list::-webkit-scrollbar {
            width: 6px;
        }

        .channel-list::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        .channel-item {
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .channel-item:hover {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
        }

        .channel-item.active {
            background: #0284c7;
            color: #fff;
            font-weight: bold;
        }

        .channel-item.verified {
            border-left: 4px solid #10b981;
        }

        .status {
            font-size: 0.9rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>IPTV Телеканалы Украины</h2>
            <div id="status" class="status">Загрузка плейлиста...</div>
        </div>

        <div class="custompanel">
            <div class="panel-group">
                <label for="colorPicker">Цвет акцентов плеера:</label>
                <input type="color" id="colorPicker" value="#38bdf8">
            </div>
            <div class="panel-group">
                <span style="font-size: 0.85rem; color: #10b981;">✔ Работает >10 сек = Сохранён</span>
            </div>
        </div>

        <div class="content-layout">
            <div class="player-box">
                <div class="player-container">
                    <div id="player"></div>
                </div>
                
                <div class="custom-buttons-bar">
                    <button id="autoPlayBtn" class="custom-btn" onclick="toggleAutoPlay()">▶ Автопросмотр (20 сек)</button>
                    <button class="custom-btn" onclick="reloadStream()">🔄 Обновить</button>
                    <button class="custom-btn" onclick="toggleMute()">🔇 Мут / Звук</button>
                    <span id="timerInfo" class="timer-info"></span>
                </div>
            </div>

            <div class="playlist-box">
                <div class="playlist-title">Все каналы</div>
                <ul id="channelList" class="channel-list"></ul>
            </div>
        </div>
    </div>

    <script>
        const M3U_URL = 'https://iptv-org.github.io/iptv/countries/ua.m3u';
        let player = null;
        let globalPlaylist = [];
        let currentIndex = 0;

        let isAutoPlaying = false;
        let nextChannelTimer = null;
        let verifyTimer = null;
        let countdownInterval = null;
        let loadTimeoutTimer = null;
        
        let isChangingChannel = false; // Блокировка фантомных ошибок во время переключения
        let timeLeft = 20;

        document.getElementById('colorPicker').addEventListener('input', (e) => {
            document.documentElement.style.setProperty('--accent-color', e.target.value);
        });

        async function fetchAndParseM3U(url) {
            try {
                const response = await fetch(url);
                const text = await response.text();

                const lines = text.split('\n');
                const playlist = [];
                let currentTitle = '';

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    
                    if (line.startsWith('#EXTINF:')) {
                        const commaIndex = line.lastIndexOf(',');
                        if (commaIndex !== -1) {
                            currentTitle = line.substring(commaIndex + 1).trim();
                        }
                    } else if (line && !line.startsWith('#')) {
                        if (currentTitle) {
                            playlist.push({
                                title: currentTitle,
                                file: line,
                                verified: false
                            });
                            currentTitle = '';
                        }
                    }
                }

                return playlist;
            } catch (error) {
                console.error('Ошибка загрузки плейлиста:', error);
                document.getElementById('status').textContent = 'Ошибка загрузки плейлиста.';
                return [];
            }
        }

        function clearAllTimers() {
            clearTimeout(nextChannelTimer);
            clearTimeout(verifyTimer);
            clearTimeout(loadTimeoutTimer);
            clearInterval(countdownInterval);
            document.getElementById('timerInfo').textContent = '';
        }

        function updateStatusCount() {
            const statusEl = document.getElementById('status');
            statusEl.textContent = `Осталось каналов: ${globalPlaylist.length}`;
        }

        // Вызывается при запуске видеопотока
        function handleStreamPlaying() {
            if (isChangingChannel) return;

            clearTimeout(loadTimeoutTimer);
            const item = globalPlaylist[currentIndex];
            if (!item) return;

            document.getElementById('status').textContent = `Воспроизведение: ${item.title}`;

            // Таймер 10 секунд: Отмечаем канал как гарантированно рабочий
            clearTimeout(verifyTimer);
            verifyTimer = setTimeout(() => {
                if (globalPlaylist[currentIndex]) {
                    globalPlaylist[currentIndex].verified = true;
                    renderChannelList(globalPlaylist);
                    document.getElementById('status').textContent = `Воспроизведение: ${item.title} (Проверен ✔)`;
                }
            }, 10000);

            // Режим автопросмотра
            if (isAutoPlaying) {
                timeLeft = 20;
                const timerInfo = document.getElementById('timerInfo');
                timerInfo.textContent = `Просмотр: ${timeLeft} с.`;

                clearInterval(countdownInterval);
                countdownInterval = setInterval(() => {
                    timeLeft--;
                    if (timeLeft > 0) {
                        timerInfo.textContent = `Просмотр: ${timeLeft} с.`;
                    } else {
                        clearInterval(countdownInterval);
                    }
                }, 1000);

                clearTimeout(nextChannelTimer);
                nextChannelTimer = setTimeout(() => {
                    let nextIdx = (currentIndex + 1) % globalPlaylist.length;
                    switchChannel(nextIdx);
                }, 20000);
            }
        }

        // Вызывается ТОЛЬКО если канал не загрузился и НЕ подтвержден
        function handleStreamError() {
            if (isChangingChannel) return; // Игнорируем ошибки, вызванные закрытием предыдущего потока

            const item = globalPlaylist[currentIndex];
            
            // Если канал уже отработал 10 секунд ранее, НЕ удаляем его
            if (item && item.verified) {
                console.log(`Канал ${item.title} дал сбой, но он ранее был проверен.`);
                return;
            }

            clearAllTimers();
            if (globalPlaylist.length === 0) return;

            const removedItem = globalPlaylist[currentIndex];
            
            // Удаляем нерабочий канал из плейлиста
            globalPlaylist.splice(currentIndex, 1);
            
            renderChannelList(globalPlaylist);
            updateStatusCount();

            document.getElementById('status').textContent = `Канал "${removedItem ? removedItem.title : ''}" не работает и был удален.`;

            if (currentIndex >= globalPlaylist.length) {
                currentIndex = 0;
            }

            setTimeout(() => {
                if (globalPlaylist.length > 0) {
                    switchChannel(currentIndex);
                }
            }, 500);
        }

        // Безопасное закрытие текущего канала перед включением нового
        function switchChannel(index) {
            if (globalPlaylist.length === 0) return;
            if (index < 0 || index >= globalPlaylist.length) index = 0;

            clearAllTimers();
            isChangingChannel = true; // Включаем защиту от фантомных ошибок

            // Останавливаем текущий поток
            if (player) {
                try {
                    player.stop();
                } catch (e) {}
            }

            // Ждем завершения закрытия и запускаем следующий
            setTimeout(() => {
                isChangingChannel = false;
                playChannel(index);
            }, 300);
        }

        function playChannel(index) {
            currentIndex = index;
            const item = globalPlaylist[currentIndex];

            const items = document.querySelectorAll('.channel-item');
            items.forEach((el, idx) => {
                if (idx === currentIndex) {
                    el.classList.add('active');
                    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    el.classList.remove('active');
                }
            });

            document.getElementById('status').textContent = `Подключение: ${item.title}...`;

            if (player) {
                player.load(item.file);
                player.play();

                // Таймаут ожидания загрузки (8 секунд)
                loadTimeoutTimer = setTimeout(() => {
                    if (!isChangingChannel) {
                        handleStreamError();
                    }
                }, 8000);
            }
        }

        function toggleAutoPlay() {
            const btn = document.getElementById('autoPlayBtn');

            if (isAutoPlaying) {
                stopAutoPlay();
            } else {
                isAutoPlaying = true;
                btn.textContent = '⏹ Остановить автопросмотр';
                btn.classList.add('active-autoplay');
                switchChannel(currentIndex);
            }
        }

        function stopAutoPlay() {
            isAutoPlaying = false;
            clearAllTimers();
            
            const btn = document.getElementById('autoPlayBtn');
            btn.textContent = '▶ Автопросмотр (20 сек)';
            btn.classList.remove('active-autoplay');
        }

        function reloadStream() {
            if (globalPlaylist[currentIndex]) {
                switchChannel(currentIndex);
            }
        }

        function toggleMute() {
            if (player) {
                if (player.getVolume() > 0) {
                    player.setVolume(0);
                } else {
                    player.setVolume(100);
                }
            }
        }

        function renderChannelList(playlist) {
            const listEl = document.getElementById('channelList');
            listEl.innerHTML = '';

            playlist.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = 'channel-item';
                
                if (index === currentIndex) li.classList.add('active');
                if (item.verified) li.classList.add('verified');

                li.textContent = `${index + 1}. ${item.title} ${item.verified ? '✔' : ''}`;
                li.title = item.title;

                li.addEventListener('click', () => {
                    if (isAutoPlaying) {
                        stopAutoPlay();
                    }
                    switchChannel(index);
                });

                listEl.appendChild(li);
            });
        }

        async function initPlayer() {
            const statusEl = document.getElementById('status');
            globalPlaylist = await fetchAndParseM3U(M3U_URL);

            if (globalPlaylist.length === 0) {
                statusEl.textContent = 'Плейлист пуст или недоступен.';
                return;
            }

            updateStatusCount();
            renderChannelList(globalPlaylist);

            player = new Clappr.Player({
                source: globalPlaylist[0].file,
                parentId: "#player",
                width: '100%',
                height: '100%',
                autoPlay: true,
                events: {
                    onPlaying: function() {
                        handleStreamPlaying();
                    },
                    onError: function() {
                        handleStreamError();
                    }
                }
            });
        }

        initPlayer();
    </script>

</body>
</html>
