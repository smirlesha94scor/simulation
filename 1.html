<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Задачник — Медиана BM</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d1117;
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-wrapper {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
    }

    .board-container {
      position: relative;
      flex: 1;
      width: 100%;
      max-width: 900px;
      max-height: calc(100vh - 80px);
      background: #19231f;
      border: 8px solid #422817;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7), inset 0 0 80px rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .hud {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      color: #38bdf8;
      backdrop-filter: blur(4px);
      pointer-events: none;
    }

    .controls {
      height: 56px;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 900px;
    }

    button {
      background: #23332c;
      color: #e2e8f0;
      border: 1px solid #3b574b;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
      user-select: none;
    }

    button:hover {
      background: #2f453c;
      border-color: #527a6a;
    }

    button.active {
      background: #38bdf8;
      color: #0f172a;
      font-weight: 700;
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }
  </style>
</head>
<body>

<div class="app-wrapper">
  <div class="board-container">
    <div class="hud" id="hud">BM = ?</div>
    <canvas id="geometryCanvas" width="800" height="520"></canvas>
  </div>
  
  <div class="controls">
    <button id="toggleParallelogramBtn" onclick="toggleParallelogram()">Достроить до параллелограмма</button>
    <button id="toggleAnglesBtn" onclick="toggleAngles()">Подсветить равные углы (73°)</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('geometryCanvas');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');

  let showParallelogram = false;
  let showEqualAngles = false;

  function toggleParallelogram() {
    showParallelogram = !showParallelogram;
    document.getElementById('toggleParallelogramBtn').classList.toggle('active', showParallelogram);
    if (!showParallelogram && showEqualAngles) {
      showEqualAngles = false;
      document.getElementById('toggleAnglesBtn').classList.remove('active');
    }
    draw();
  }

  function toggleAngles() {
    showEqualAngles = !showEqualAngles;
    document.getElementById('toggleAnglesBtn').classList.toggle('active', showEqualAngles);
    if (showEqualAngles && !showParallelogram) {
      showParallelogram = true;
      document.getElementById('toggleParallelogramBtn').classList.add('active');
    }
    draw();
  }

  function drawChalkLine(x1, y1, x2, y2, color = '#ffffff', width = 3, dashed = false) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    if (dashed) {
      ctx.setLineDash([8, 6]);
    }
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.restore();
  }

  function drawText(text, x, y, color = '#ffffff', size = 22) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.font = `500 ${size}px 'Comic Sans MS', cursive, sans-serif`;
    ctx.fillText(text, x, y);
    ctx.restore();
  }

  function drawAngleArc(cx, cy, radius, startAngle, endAngle, label = '', color = '#facc15') {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, startAngle, endAngle);
    ctx.stroke();

    if (label) {
      const midAngle = (startAngle + endAngle) / 2;
      const lx = cx + (radius + 16) * Math.cos(midAngle);
      const ly = cy + (radius + 16) * Math.sin(midAngle);
      drawText(label, lx - 12, ly + 6, color, 16);
    }
    ctx.restore();
  }

  function drawTicks(x1, y1, x2, y2, color = '#ffffff') {
    const mx = (x1 + x2) / 2;
    const my = (y1 + y2) / 2;
    const dx = x2 - x1;
    const dy = y2 - y1;
    const len = Math.hypot(dx, dy);
    const nx = -dy / len;
    const ny = dx / len;

    const tickLen = 7;
    const gap = 3.5;

    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(mx + nx * tickLen - (dx/len)*gap, my + ny * tickLen - (dy/len)*gap);
    ctx.lineTo(mx - nx * tickLen - (dx/len)*gap, my - ny * tickLen - (dy/len)*gap);
    ctx.moveTo(mx + nx * tickLen + (dx/len)*gap, my + ny * tickLen + (dy/len)*gap);
    ctx.lineTo(mx - nx * tickLen + (dx/len)*gap, my - ny * tickLen + (dy/len)*gap);
    ctx.stroke();
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Сдвигаем базовую горизонтальную линию AC вверх до y=290, 
    // чтобы при удвоении медианы точка D (y ≈ 470) не выходила за рамку (height=520)
    const A = { x: 130, y: 290 };
    const C = { x: 670, y: 290 };
    const M = { x: (A.x + C.x) / 2, y: 290 };
    const B = { x: 310, y: 110 };

    // Точка D (удвоение медианы: D = 2M - B)
    const D = {
      x: 2 * M.x - B.x, // 2*400 - 310 = 490
      y: 2 * M.y - B.y  // 2*290 - 110 = 470 (отлично помещается!)
    };

    // Заголовок сверху
    drawText('BM = ?', 360, 48, '#ffffff', 28);

    // Треугольник ABC
    drawChalkLine(A.x, A.y, B.x, B.y, '#ffffff', 3);
    drawChalkLine(B.x, B.y, C.x, C.y, '#ffffff', 3);
    drawChalkLine(A.x, A.y, C.x, C.y, '#ffffff', 3);
    drawChalkLine(B.x, B.y, M.x, M.y, '#ffffff', 3);

    // Засечки равенства AM = MC
    drawTicks(A.x, A.y, M.x, M.y);
    drawTicks(M.x, M.y, C.x, C.y);

    // Подписи вершин
    drawText('A', A.x - 22, A.y + 8, '#ffffff', 24);
    drawText('B', B.x - 6, B.y - 12, '#ffffff', 24);
    drawText('C', C.x + 10, C.y + 8, '#ffffff', 24);
    drawText('M', M.x - 8, M.y + 26, '#ffffff', 24);

    // Значения
    drawText('18', (B.x + C.x)/2 + 18, (B.y + C.y)/2 - 8, '#ffffff', 24);
    drawText('x', (B.x + M.x)/2 + 10, (B.y + M.y)/2, '#ffffff', 22);

    // Углы при B
    const angleBA = Math.atan2(A.y - B.y, A.x - B.x);
    const angleBM = Math.atan2(M.y - B.y, M.x - B.x);
    const angleBC = Math.atan2(C.y - B.y, C.x - B.x);

    drawAngleArc(B.x, B.y, 42, angleBM, angleBA, '73°', '#facc15');
    drawAngleArc(B.x, B.y, 38, angleBC, angleBM, '34°', '#facc15');

    // Достроение до параллелограмма
    if (showParallelogram) {
      drawChalkLine(M.x, M.y, D.x, D.y, '#38bdf8', 2.5, true);
      drawChalkLine(C.x, C.y, D.x, D.y, '#38bdf8', 2.5, true);
      drawChalkLine(A.x, A.y, D.x, D.y, '#38bdf8', 2.5, true);

      drawText('D', D.x + 10, D.y + 10, '#38bdf8', 24);
      drawText('x', (M.x + D.x)/2 + 10, (M.y + D.y)/2, '#38bdf8', 22);
      drawText('18', (A.x + D.x)/2 - 32, (A.y + D.y)/2 + 8, '#38bdf8', 22);

      hud.innerText = '2x = 18  ⇒  x = 9';
    } else {
      hud.innerText = 'BM = ?';
    }

    // Подсветка равных углов (73°)
    if (showEqualAngles) {
      const angleAB = Math.atan2(B.y - A.y, B.x - A.x);
      const angleAD = Math.atan2(D.y - A.y, D.x - A.x);
      drawAngleArc(A.x, A.y, 38, angleAD, angleAB, '73°', '#4ade80');
    }
  }

  draw();
</script>

</body>
</html>
