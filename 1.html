<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Светомузыка в браузерe</title>
  <style>
    body {
      margin: 0;
      background: #050505;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
    }
    canvas {
      border-radius: 50%;
      box-shadow: 0 0 50px rgba(0, 255, 200, 0.2);
    }
    button {
      position: absolute;
      top: 20px;
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
      background: #00ffcc;
      border: none;
      border-radius: 20px;
      font-weight: bold;
      color: #000;
      z-index: 10;
    }
  </style>
</head>
<body>

  <button id="startBtn">Включить светомузыку</button>
  <canvas id="visualizer" width="500" height="500"></canvas>

  <script>
    const startBtn = document.getElementById('startBtn');
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');

    startBtn.addEventListener('click', async () => {
      try {
        // Запрашиваем захват системного звука через захват экрана
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: true
        });

        // Проверяем, дал ли пользователь доступ к аудио
        const audioTrack = stream.getAudioTracks()[0];
        if (!audioTrack) {
          alert('Ошибка: Вы не включили галочку "Общий доступ к аудио" при выборе экрана!');
          return;
        }

        startBtn.style.display = 'none';

        // Настройка Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(new MediaStream([audioTrack]));
        const analyser = audioCtx.createAnalyser();

        analyser.fftSize = 64; // Размер массива частот
        source.connect(analyser);

        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        function draw() {
          requestAnimationFrame(draw);

          // Получаем данные о частотах
          analyser.getByteFrequencyData(dataArray);

          // Вычисляем среднюю громкость низких частот (басы)
          let bassSum = 0;
          for (let i = 0; i < 5; i++) {
            bassSum += dataArray[i];
          }
          let bassAverage = bassSum / 5; // от 0 до 255

          // Очищаем Canvas
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          // Вычисляем радиус и цвет на основе громкости
          const radius = 80 + (bassAverage / 255) * 120;
          const hue = (bassAverage * 1.5) % 360; // Меняем цвет от реактивности

          // Рисуем пульсирующий шар
          ctx.beginPath();
          ctx.arc(canvas.width / 2, canvas.height / 2, radius, 0, Math.PI * 2);
          ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
          ctx.shadowBlur = radius / 2;
          ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;
          ctx.fill();
        }

        draw();

      } catch (err) {
        console.error("Ошибка доступа: ", err);
      }
    });
  </script>
</body>
</html>
