<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Планетарий: Космос и Вид с Земли</title>
    <style>
        body { margin: 0; background: #0a0d14; color: #fff; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        /* Боковая панель */
        #ui { 
            width: 320px; background: #131722; padding: 15px; box-sizing: border-box; 
            display: flex; flex-direction: column; gap: 12px; font-size: 13px; z-index: 10; 
            border-right: 1px solid #232936; 
        }
        h3 { margin: 0; color: #4da6ff; font-size: 16px; }
        label { font-weight: bold; color: #aaa; }
        select, input { 
            width: 100%; padding: 6px; background: #1c2230; border: 1px solid #323b4e; 
            color: #fff; border-radius: 4px; box-sizing: border-box; 
        }
        .time-readout { font-family: monospace; color: #00ffcc; font-size: 14px; font-weight: bold; }
        .btn-preset { background: #ff9800; color: #000; font-weight: bold; border: none; padding: 8px; border-radius: 4px; cursor: pointer; }
        .btn-preset:hover { background: #e68a00; }
        
        /* Область для двух холстов */
        #canvas-container { flex: 1; display: flex; flex-direction: column; height: 100%; }
        .canvas-box { flex: 1; position: relative; border-bottom: 1px solid #232936; }
        .canvas-label { 
            position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); 
            padding: 4px 8px; border-radius: 4px; font-weight: bold; color: #00ffcc; font-size: 12px; 
        }
        canvas { width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>

<div id="ui">
    <h3>2D Астрономический симулятор</h3>
    
    <div>
        <label>Быстрый переход:</label>
        <button class="btn-preset" id="eclipse-btn">Затмение 12 авг 2026 (17:45)</button>
    </div>

    <div>
        <label>Дата и время симуляции:</label>
        <div id="time-display" class="time-readout">2026-08-14 12:00:00</div>
        <input type="datetime-local" id="datetime-picker" style="margin-top: 5px;">
    </div>

    <div>
        <label>Скорость времени: <span id="speed-val">60x</span></label>
        <input type="range" id="time-speed" min="0" max="3600" value="60" step="10">
    </div>

    <div>
        <label>Город (Место наблюдения):</label>
        <select id="city-select">
            <option value="55.75,37.61">Москва (55.75° N, 37.61° E)</option>
            <option value="59.93,30.33">Санкт-Петербург (59.93° N)</option>
            <option value="64.14,-21.94">Рейкьявик (Полное затмение 2026)</option>
            <option value="50.45,30.52">Киев (50.45° N)</option>
            <option value="43.23,76.88">Алматы (43.23° N)</option>
            <option value="0,0">Экватор / Гринвич (0°, 0°)</option>
            <option value="-33.86,151.20">Сидней (-33.86° S)</option>
        </select>
    </div>

    <div style="margin-top: auto; background: #0d111a; padding: 10px; border-radius: 4px; line-height: 1.4;">
        <label>Инфо:</label>
        <div id="info-text" style="color: #ffcc00; margin-top: 4px;">Загрузка...</div>
    </div>
</div>

<div id="canvas-container">
    <!-- ВЕРХНИЙ ЭКРАН: Космическая 2D-схема -->
    <div class="canvas-box">
        <div class="canvas-label">1. Расположение в Космосе (Вид сверху)</div>
        <canvas id="spaceCanvas"></canvas>
    </div>
    <!-- НИЖНИЙ ЭКРАН: Вид с Земли -->
    <div class="canvas-box">
        <div class="canvas-label">2. Вид с Земли (Место наблюдения)</div>
        <canvas id="skyCanvas"></canvas>
    </div>
</div>

<script>
    // Инициализация Canvas
    const spaceCanvas = document.getElementById('spaceCanvas');
    const spaceCtx = spaceCanvas.getContext('2d');
    
    const skyCanvas = document.getElementById('skyCanvas');
    const skyCtx = skyCanvas.getContext('2d');

    function resize() {
        spaceCanvas.width = spaceCanvas.parentElement.clientWidth;
        spaceCanvas.height = spaceCanvas.parentElement.clientHeight;
        skyCanvas.width = skyCanvas.parentElement.clientWidth;
        skyCanvas.height = skyCanvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Переменные состояния
    let simDate = new Date();
    let speed = 60;
    let lat = 55.75, lon = 37.61; // Москва по умолчанию

    // UI элементы
    const timeDisplay = document.getElementById('time-display');
    const datetimePicker = document.getElementById('datetime-picker');
    const speedSlider = document.getElementById('time-speed');
    const speedVal = document.getElementById('speed-val');
    const citySelect = document.getElementById('city-select');
    const eclipseBtn = document.getElementById('eclipse-btn');
    const infoText = document.getElementById('info-text');

    datetimePicker.value = new Date(simDate.getTime() - simDate.getTimezoneOffset()*60000).toISOString().slice(0, 16);

    datetimePicker.addEventListener('change', e => { if(e.target.value) simDate = new Date(e.target.value); });
    speedSlider.addEventListener('input', e => { speed = parseFloat(e.target.value); speedVal.innerText = speed + 'x'; });
    
    citySelect.addEventListener('change', e => {
        const parts = e.target.value.split(',').map(Number);
        lat = parts[0]; lon = parts[1];
    });

    eclipseBtn.addEventListener('click', () => {
        simDate = new Date('2026-08-12T17:44:00Z');
        datetimePicker.value = new Date(simDate.getTime() - simDate.getTimezoneOffset()*60000).toISOString().slice(0, 16);
        citySelect.value = "64.14,-21.94";
        lat = 64.14; lon = -21.94;
        speed = 5;
        speedSlider.value = 5;
        speedVal.innerText = '5x';
    });

    // --- 1. ОРИСОВКА КОСМОСА (Схема Орбит) ---
    function drawSpace() {
        const w = spaceCanvas.width, h = spaceCanvas.height;
        spaceCtx.clearRect(0, 0, w, h);

        const centerX = w / 2;
        const centerY = h / 2;

        // Солнце в центре схемы
        spaceCtx.beginPath();
        spaceCtx.arc(centerX - 180, centerY, 14, 0, Math.PI * 2);
        spaceCtx.fillStyle = '#ffcc00';
        spaceCtx.shadowColor = '#ffcc00';
        spaceCtx.shadowBlur = 15;
        spaceCtx.fill();
        spaceCtx.shadowBlur = 0;

        // Земля
        const earthX = centerX + 40;
        const earthY = centerY;
        const earthR = 18;

        // Атмосфера Земли
        spaceCtx.beginPath();
        spaceCtx.arc(earthX, earthY, earthR, 0, Math.PI * 2);
        spaceCtx.fillStyle = '#1d55bb';
        spaceCtx.fill();

        // Поворот Земли (Время суток)
        const secondsInDay = (simDate.getUTCHours() * 3600) + (simDate.getUTCMinutes() * 60) + simDate.getUTCSeconds();
        const dayAngle = (secondsInDay / 86400) * Math.PI * 2;

        // Город (Красная точка на поверхности)
        const cityAngle = dayAngle + (lon * Math.PI / 180);
        const cityX = earthX + Math.sin(cityAngle) * earthR;
        const cityY = earthY - Math.cos(cityAngle) * earthR;

        spaceCtx.beginPath();
        spaceCtx.arc(cityX, cityY, 3, 0, Math.PI * 2);
        spaceCtx.fillStyle = '#ff0055';
        spaceCtx.fill();

        // Орбита Луны
        const moonOrbitR = 55;
        spaceCtx.beginPath();
        spaceCtx.arc(earthX, earthY, moonOrbitR, 0, Math.PI * 2);
        spaceCtx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        spaceCtx.stroke();

        // Вращение Луны (Цикл ~27.3 дня)
        const start = new Date(simDate.getFullYear(), 0, 0);
        const dayOfYear = (simDate - start) / (1000 * 60 * 60 * 24);
        
        // Для затмения 12 августа 2026 года регулируем позицию
        const eclipsePeak = new Date('2026-08-12T17:46:00Z');
        const minDiff = (simDate - eclipsePeak) / (1000 * 60);
        const moonAngle = Math.PI + (minDiff * 0.0005); 

        const moonX = earthX + Math.cos(moonAngle) * moonOrbitR;
        const moonY = earthY + Math.sin(moonAngle) * moonOrbitR;

        spaceCtx.beginPath();
        spaceCtx.arc(moonX, moonY, 5, 0, Math.PI * 2);
        spaceCtx.fillStyle = '#cccccc';
        spaceCtx.fill();

        // Подписи объектов
        spaceCtx.fillStyle = '#aaa';
        spaceCtx.font = '11px sans-serif';
        spaceCtx.fillText('Солнце', centerX - 200, centerY + 30);
        spaceCtx.fillText('Земля', earthX - 15, earthY + 32);
        spaceCtx.fillText('Луна', moonX - 10, moonY + 15);
        spaceCtx.fillStyle = '#ff4d4d';
        spaceCtx.fillText('Город', cityX + 6, cityY + 4);
    }

    // --- 2. РАСЧЕТ И ОТРИСОВКА ВИДА С ЗЕМЛИ ---
    function drawSky() {
        const w = skyCanvas.width, h = skyCanvas.height;
        const horizonY = h * 0.75;
        const skyH = horizonY - 40;

        // Положение Солнца и Луны на небе
        const eclipsePeak = new Date('2026-08-12T17:46:00Z');
        const minDiff = (simDate - eclipsePeak) / (1000 * 60);

        // Расчет высоты над горизонтом
        const hours = simDate.getUTCHours() + simDate.getUTCMinutes()/60 + (lon/15);
        const sunAltDeg = Math.sin((hours - 6) / 24 * Math.PI * 2) * (90 - Math.abs(lat - 23.44));
        const sunX = w/2 + (hours - 12) * (w / 12);
        const sunY = horizonY - (Math.max(-10, sunAltDeg) / 90) * skyH;

        // Движение Луны относительно Солнца
        const moonX = sunX + (minDiff * 0.15);
        const moonY = sunY + (minDiff * 0.02);

        // Размеры
        const sunR = (0.53 / 90) * skyH;
        const moonR = sunR * 1.02; // Полное затмение

        // Дистанция перекрытия
        const dist = Math.hypot(sunX - moonX, sunY - moonY);
        let coveragePct = Math.max(0, Math.min(100, Math.round((1 - (dist / (sunR * 2))) * 100)));

        infoText.innerText = `Высота Солнца: ${sunAltDeg.toFixed(1)}°\nПерекрытие Луной: ${coveragePct}%`;

        // 1. Градиент Неба
        let skyGrad = skyCtx.createLinearGradient(0, 0, 0, h);
        if (coveragePct > 95) {
            skyGrad.addColorStop(0, '#030814'); skyGrad.addColorStop(1, '#0a101d');
        } else if (sunAltDeg > 5) {
            skyGrad.addColorStop(0, '#1a75ff'); skyGrad.addColorStop(1, '#80b3ff');
        } else if (sunAltDeg > -6) {
            skyGrad.addColorStop(0, '#0b1d3a'); skyGrad.addColorStop(1, '#d9534f');
        } else {
            skyGrad.addColorStop(0, '#020509'); skyGrad.addColorStop(1, '#08101d');
        }
        skyCtx.fillStyle = skyGrad;
        skyCtx.fillRect(0, 0, w, h);

        // 2. Солнечная Корона (при полном затмении)
        if (coveragePct > 95) {
            let corona = skyCtx.createRadialGradient(sunX, sunY, sunR, sunX, sunY, sunR * 3.5);
            corona.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
            corona.addColorStop(0.4, 'rgba(180, 210, 255, 0.4)');
            corona.addColorStop(1, 'rgba(0, 0, 0, 0)');
            skyCtx.beginPath();
            skyCtx.arc(sunX, sunY, sunR * 3.5, 0, Math.PI * 2);
            skyCtx.fillStyle = corona;
            skyCtx.fill();
        }

        // 3. Солнце
        skyCtx.beginPath();
        skyCtx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
        skyCtx.fillStyle = '#ffffff';
        skyCtx.shadowColor = '#ffea9f';
        skyCtx.shadowBlur = coveragePct > 90 ? 2 : 15;
        skyCtx.fill();
        skyCtx.shadowBlur = 0;

        // 4. Луна
        skyCtx.beginPath();
        skyCtx.arc(moonX, moonY, moonR, 0, Math.PI * 2);
        skyCtx.fillStyle = '#080b12';
        skyCtx.fill();

        // 5. Ландшафт
        skyCtx.fillStyle = coveragePct > 95 ? '#030502' : '#0a1207';
        skyCtx.fillRect(0, horizonY, w, h - horizonY);
        skyCtx.strokeStyle = '#1e3818';
        skyCtx.beginPath();
        skyCtx.moveTo(0, horizonY);
        skyCtx.lineTo(w, horizonY);
        skyCtx.stroke();                
    }

    // Анимационный цикл
    let lastTime = performance.now();
    function loop(now) {
        const dt = (now - lastTime) / 1000;
        lastTime = now;

        simDate = new Date(simDate.getTime() + dt * 1000 * speed);
        timeDisplay.innerText = simDate.toISOString().replace('T', ' ').slice(0, 19);

        drawSpace();
        drawSky();

        requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
</script>
</body>
</html>
