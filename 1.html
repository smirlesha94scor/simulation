<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Автоматизация с Утками</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #1e1e24;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(30, 30, 40, 0.9);
      padding: 12px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .btn-group {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    button {
      background: #3a3f58;
      color: white;
      border: 1px solid #555;
      padding: 8px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover { background: #4e5578; }
    button.active { background: #27ae60; border-color: #2ecc71; }
    canvas { display: block; }
  </style>
</head>
<body>

  <div id="ui">
    <strong>Инструменты:</strong>
    <div class="btn-group">
      <button id="btn-fan" onclick="selectTool('fan')">🌀 Вентилятор</button>
      <button id="btn-magnet" onclick="selectTool('magnet')">🧲 Магнит</button>
      <button id="btn-panel" onclick="selectTool('panel')">📐 Панель</button>
      <button id="btn-piston" onclick="selectTool('piston')">🔨 Поршень</button>
      <button id="btn-spring" onclick="selectTool('spring')">🦘 Пружина</button>
      <button id="btn-launcher" onclick="selectTool('launcher')">🚀 Запускник</button>
    </div>
    <hr style="border: 0.5px solid #444; width: 100%;">
    <strong>Спавн:</strong>
    <div class="btn-group">
      <button onclick="spawnDuck()">🦆 Утка</button>
      <button onclick="spawnMetal()">📦 Металл</button>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const GRAVITY = 0.3;
    const dynamicObjects = [];
    const installedTools = [];
    let selectedTool = null;

    // --- ФИЗИЧЕСКИЙ 2D ОБЪЕКТ ---
    class PhysicalBody2D {
      constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = 0;
        this.radius = 18;
        this.type = type; // 'duck' или 'metal'
        this.isMetallic = type === 'metal';
        this.bounce = 0.5;
        this.friction = 0.98;
      }

      update() {
        this.vy += GRAVITY;
        this.vx *= this.friction;
        this.vy *= this.friction;

        this.x += this.vx;
        this.y += this.vy;

        // Пол
        if (this.y + this.radius > canvas.height - 20) {
          this.y = canvas.height - 20 - this.radius;
          this.vy = -this.vy * this.bounce;
        }
        // Стены
        if (this.x - this.radius < 0) {
          this.x = this.radius;
          this.vx = -this.vx * this.bounce;
        }
        if (this.x + this.radius > canvas.width) {
          this.x = canvas.width - this.radius;
          this.vx = -this.vx * this.bounce;
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        if (this.type === 'duck') {
          // Отрисовка 2D-уточки
          ctx.fillStyle = '#f1c40f';
          ctx.beginPath();
          ctx.arc(0, 0, 14, 0, Math.PI * 2); // Тело
          ctx.fill();

          ctx.beginPath();
          ctx.arc(8, -10, 8, 0, Math.PI * 2); // Голова
          ctx.fill();

          ctx.fillStyle = '#e67e22'; // Клюв
          ctx.beginPath();
          ctx.moveTo(14, -10);
          ctx.lineTo(22, -8);
          ctx.lineTo(14, -6);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#000'; // Глаз
          ctx.beginPath();
          ctx.arc(10, -12, 2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // Отрисовка металлического ящика
          ctx.fillStyle = '#7f8c8d';
          ctx.strokeStyle = '#bdc3c7';
          ctx.lineWidth = 2;
          ctx.fillRect(-15, -15, 30, 30);
          ctx.strokeRect(-15, -15, 30, 30);
        }

        ctx.restore();
      }
    }

    // --- 2D ИНСТРУМЕНТЫ ---
    class Tool2D {
      constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type;
        this.timer = 0;
      }

      update() {
        this.timer += 0.05;
        dynamicObjects.forEach(obj => {
          const dx = obj.x - this.x;
          const dy = obj.y - this.y;
          const dist = Math.hypot(dx, dy);

          if (this.type === 'fan' && dist < 180 && dx > 0 && Math.abs(dy) < 50) {
            obj.vx += (180 - dist) * 0.01; // Выдувание вправо
          }
          if (this.type === 'magnet' && obj.isMetallic && dist < 220) {
            obj.vx -= (dx / dist) * 0.8; // Притяжение
            obj.vy -= (dy / dist) * 0.8;
          }
          if (this.type === 'spring' && dist < 30 && Math.abs(dx) < 25) {
            obj.vy = -12; // Подбрасывание
          }
          if (this.type === 'piston' && dist < 40 && Math.sin(this.timer) > 0.8) {
            obj.vx += 10;
            obj.vy -= 4;
          }
          if (this.type === 'launcher' && dist < 35) {
            obj.vx = 15;
            obj.vy = -10;
          }
        });
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        if (this.type === 'fan') {
          ctx.fillStyle = '#3498db';
          ctx.fillRect(-20, -20, 40, 40);
          ctx.fillStyle = '#fff';
          ctx.fillText('🌀', -8, 5);
        } else if (this.type === 'magnet') {
          ctx.fillStyle = '#e74c3c';
          ctx.beginPath();
          ctx.arc(0, 0, 20, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.fillText('🧲', -8, 5);
        } else if (this.type === 'spring') {
          ctx.fillStyle = '#1abc9c';
          ctx.fillRect(-25, 0, 50, 10);
          ctx.fillText('🦘', -8, -5);
        } else if (this.type === 'piston') {
          ctx.fillStyle = '#9b59b6';
          ctx.fillRect(-15, -15, 30, 30);
          ctx.fillText('🔨', -8, 5);
        } else if (this.type === 'panel') {
          ctx.fillStyle = '#e67e22';
          ctx.rotate(-Math.PI / 6);
          ctx.fillRect(-40, -5, 80, 10);
        } else if (this.type === 'launcher') {
          ctx.fillStyle = '#2ecc71';
          ctx.fillRect(-20, -10, 40, 20);
          ctx.fillText('🚀', -8, 5);
        }

        ctx.restore();
      }
    }

    // --- УПРАВЛЕНИЕ ---
    function selectTool(type) {
      selectedTool = type;
      document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
      const btn = document.getElementById(`btn-${type}`);
      if (btn) btn.classList.add('active');
    }

    function spawnDuck() {
      dynamicObjects.push(new PhysicalBody2D(100 + Math.random() * 50, 50, 'duck'));
    }

    function spawnMetal() {
      dynamicObjects.push(new PhysicalBody2D(100 + Math.random() * 50, 50, 'metal'));
    }

    canvas.addEventListener('click', (e) => {
      if (selectedTool) {
        installedTools.push(new Tool2D(e.clientX, e.clientY, selectedTool));
      }
    });

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    // --- ГЛАВНЫЙ ЦИКЛ ---
    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Отрисовка пола
      ctx.fillStyle = '#2c3e50';
      ctx.fillRect(0, canvas.height - 20, canvas.width, 20);

      // Обновление и отрисовка инструментов
      installedTools.forEach(tool => {
        tool.update();
        tool.draw();
      });

      // Обновление и отрисовка физических тел
      dynamicObjects.forEach(obj => {
        obj.update();
        obj.draw();
      });

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
