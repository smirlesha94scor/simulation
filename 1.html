<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>2D Симулятор электросети города</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            width: 320px;
            background: #252525;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
        }
        #canvas-container {
            flex-grow: 1;
            position: relative;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #111;
        }
        .panel {
            background: #333;
            padding: 10px;
            border-radius: 5px;
        }
        .stat-val { font-weight: bold; }
        .ok { color: #4CAF50; }
        .warn { color: #FFC107; }
        .danger { color: #F44336; }
        button {
            background: #444;
            color: white;
            border: 1px solid #666;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
            width: 100%;
            margin-top: 5px;
        }
        button:hover { background: #555; }
        button.active { background: #007acc; border-color: #0099ff; }
        .instructions { font-size: 0.85em; color: #aaa; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Симулятор электросети</h2>
    
    <div class="panel">
        <h3>Состояние сети</h3>
        <div>Генерация: <span id="gen-val" class="stat-val">0</span> МВт</div>
        <div>Потребление: <span id="load-val" class="stat-val">0</span> МВт</div>
        <div>Статус: <span id="status-val" class="stat-val ok">Стабильно</span></div>
    </div>

    <div class="panel">
        <h3>Инструменты</h3>
        <button id="btn-wire" class="active">Провод ЛЭП (клик по 2 узлам)</button>
        <button id="btn-plant">Добавить ТЭЦ (100 МВт)</button>
        <button id="btn-city">Добавить Район (40 МВт)</button>
        <button id="btn-clear" style="margin-top: 15px; background: #822;">Очистить всё</button>
    </div>

    <div class="instructions">
        <p><b>Управление:</b></p>
        <ul>
            <li>Клик по узлу выделит его.</li>
            <li>В режиме "Провод" соедините два узла.</li>
            <li>Клик по существующей ЛЭП — удалит её.</li>
        </ul>
    </div>
</div>

<div id="canvas-container">
    <canvas id="gridCanvas"></canvas>
</div>

<script>
const canvas = document.getElementById('gridCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ================= Данные и Структуры =================
const NodeTypes = {
    PLANT: { name: 'ТЭЦ', color: '#ff9800', radius: 18, capacity: 100, demand: 0 },
    CITY:  { name: 'Район', color: '#2196F3', radius: 15, capacity: 0, demand: 40 },
    SUBSTATION: { name: 'Подстанция', color: '#9c27b0', radius: 10, capacity: 0, demand: 0 }
};

let nodes = [
    { id: 1, x: 150, y: 200, type: NodeTypes.PLANT, powered: true, currentSupply: 100 },
    { id: 2, x: 450, y: 200, type: NodeTypes.SUBSTATION, powered: false, currentSupply: 0 },
    { id: 3, x: 750, y: 150, type: NodeTypes.CITY, powered: false, currentSupply: 0 },
    { id: 4, x: 750, y: 300, type: NodeTypes.CITY, powered: false, currentSupply: 0 }
];

let wires = [
    { from: 1, to: 2, maxCapacity: 120, flow: 0 },
    { from: 2, to: 3, maxCapacity: 50, flow: 0 },
    { from: 2, to: 4, maxCapacity: 50, flow: 0 }
];

let selectedNode = null;
let currentTool = 'wire'; // 'wire', 'plant', 'city'
let animOffset = 0;

// ================= Логика Расчета Сети =================
function updateSimulation() {
    // Сброс показателей
    nodes.forEach(n => {
        n.currentSupply = (n.type === NodeTypes.PLANT) ? n.type.capacity : 0;
        n.powered = false;
    });
    wires.forEach(w => w.flow = 0);

    // Распределяем питание от станций через обход графа (BFS)
    let plants = nodes.filter(n => n.type === NodeTypes.PLANT);
    
    plants.forEach(plant => {
        let visitedNodes = new Set([plant.id]);
        let queue = [plant];
        plant.powered = true;

        while (queue.length > 0) {
            let curr = queue.shift();

            // Ищем соседей
            wires.forEach(wire => {
                let neighborId = null;
                if (wire.from === curr.id) neighborId = wire.to;
                if (wire.to === curr.id) neighborId = wire.from;

                if (neighborId && !visitedNodes.has(neighborId)) {
                    let neighbor = nodes.find(n => n.id === neighborId);
                    visitedNodes.add(neighborId);
                    neighbor.powered = true;
                    queue.push(neighbor);

                    // Условно направляем ток
                    wire.flow = Math.min(wire.maxCapacity, curr.currentSupply);
                }
            });
        }
    });

    // Расчет сводных данных
    let totalGen = nodes.filter(n => n.type === NodeTypes.PLANT).reduce((acc, n) => acc + n.type.capacity, 0);
    let totalDemand = nodes.reduce((acc, n) => acc + n.type.demand, 0);
    let metDemand = nodes.filter(n => n.powered).reduce((acc, n) => acc + n.type.demand, 0);

    // Обновляем UI
    document.getElementById('gen-val').innerText = totalGen;
    document.getElementById('load-val').innerText = `${metDemand} / ${totalDemand}`;

    const statusEl = document.getElementById('status-val');
    if (metDemand === totalDemand) {
        statusEl.innerText = "100% Запитано";
        statusEl.className = "stat-val ok";
    } else if (metDemand > 0) {
        statusEl.innerText = "Дефицит энергии!";
        statusEl.className = "stat-val warn";
    } else {
        statusEl.innerText = "Блэкаут";
        statusEl.className = "stat-val danger";
    }
}

// ================= Рендеринг (2D Canvas) =================
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    animOffset = (animOffset + 0.8) % 16; // Скорость анимации тока

    // 1. Отрисовка проводов (ЛЭП)
    wires.forEach(wire => {
        let n1 = nodes.find(n => n.id === wire.from);
        let n2 = nodes.find(n => n.id === wire.to);
        if (!n1 || !n2) return;

        let isPowered = n1.powered && n2.powered;

        // Основная линия
        ctx.beginPath();
        ctx.moveTo(n1.x, n1.y);
        ctx.lineTo(n2.x, n2.y);
        ctx.lineWidth = 4;
        ctx.strokeStyle = isPowered ? '#4CAF50' : '#444';
        ctx.stroke();

        // Анимация тока (пунктир)
        if (isPowered) {
            ctx.beginPath();
            ctx.moveTo(n1.x, n1.y);
            ctx.lineTo(n2.x, n2.y);
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#fff';
            ctx.setLineDash([4, 8]);
            ctx.lineDashOffset = -animOffset;
            ctx.stroke();
            ctx.setLineDash([]); // сброс
        }
    });

    // 2. Отрисовка узлов
    nodes.forEach(node => {
        ctx.beginPath();
        ctx.arc(node.x, node.y, node.type.radius, 0, Math.PI * 2);
        
        // Цвет заливки в зависимости от типа и наличия питания
        if (node.type === NodeTypes.CITY) {
            ctx.fillStyle = node.powered ? '#2196F3' : '#555';
        } else {
            ctx.fillStyle = node.type.color;
        }
        
        ctx.fill();
        ctx.lineWidth = selectedNode === node ? 4 : 2;
        ctx.strokeStyle = selectedNode === node ? '#fff' : '#000';
        ctx.stroke();

        // Индикатор питаемого города (свечение)
        if (node.type === NodeTypes.CITY && node.powered) {
            ctx.beginPath();
            ctx.arc(node.x, node.y, node.type.radius + 5, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(33, 150, 243, 0.4)';
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        // Текст/Подписи
        ctx.fillStyle = '#fff';
        ctx.font = '12px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(node.type.name, node.x, node.y + node.type.radius + 15);
    });

    requestAnimationFrame(draw);
}

// ================= Интерактив и События =================
canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    // Проверяем клик по узлу
    let clickedNode = nodes.find(n => Math.hypot(n.x - x, n.y - y) < n.type.radius + 5);

    if (currentTool === 'wire') {
        if (clickedNode) {
            if (!selectedNode) {
                selectedNode = clickedNode;
            } else if (selectedNode !== clickedNode) {
                // Создаем соединение, если его еще нет
                let exists = wires.some(w => 
                    (w.from === selectedNode.id && w.to === clickedNode.id) ||
                    (w.from === clickedNode.id && w.to === selectedNode.id)
                );
                if (!exists) {
                    wires.push({ from: selectedNode.id, to: clickedNode.id, maxCapacity: 100, flow: 0 });
                }
                selectedNode = null;
            } else {
                selectedNode = null; // Отмена при повторном клике
            }
        } else {
            selectedNode = null;
        }
    } else if (currentTool === 'plant') {
        let newId = Date.now();
        nodes.push({ id: newId, x, y, type: NodeTypes.PLANT, powered: true, currentSupply: 100 });
    } else if (currentTool === 'city') {
        let newId = Date.now();
        nodes.push({ id: newId, x, y, type: NodeTypes.CITY, powered: false, currentSupply: 0 });
    }

    updateSimulation();
});

// Управление кнопками UI
const btnWire = document.getElementById('btn-wire');
const btnPlant = document.getElementById('btn-plant');
const btnCity = document.getElementById('btn-city');

function setTool(tool, btn) {
    currentTool = tool;
    selectedNode = null;
    document.querySelectorAll('#sidebar button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}

btnWire.onclick = () => setTool('wire', btnWire);
btnPlant.onclick = () => setTool('plant', btnPlant);
btnCity.onclick = () => setTool('city', btnCity);

document.getElementById('btn-clear').onclick = () => {
    nodes = [];
    wires = [];
    selectedNode = null;
    updateSimulation();
};

// Запуск
updateSimulation();
draw();
</script>

</body>
</html>
