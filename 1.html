<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Интерактивный декодер стереограмм</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background: #1e1e1e;
            color: #fff;
            margin-top: 50px;
        }
        #drop-zone {
            width: 80%;
            max-width: 600px;
            height: 150px;
            border: 3px dashed #4CAF50;
            border-radius: 10px;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2d2d2d;
            color: #bbb;
            font-size: 18px;
            transition: 0.3s;
        }
        #drop-zone.hover {
            background: #388E3C;
            color: #fff;
            border-color: #fff;
        }
        canvas { display: none; }
        #result img {
            max-width: 100%;
            margin-top: 20px;
            border-radius: 5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <h2>Перетащите стереограмму сюда</h2>
    <div id="drop-zone">Перетащите картинку в эту область</div>
    <h3 id="status"></h3>
    <canvas id="canvas"></canvas>
    <div id="result"></div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const statusText = document.getElementById('status');
        const resultDiv = document.getElementById('result');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Отключаем стандартное поведение браузера для перетаскивания
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('hover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('hover'), false);
        });

        // Обработка сброса файла
        dropZone.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;

            if (files && files[0]) {
                loadImage(files[0]);
            }
        }

        function loadImage(file) {
            if (!file.type.startsWith('image/')) {
                alert('Пожалуйста, перетащите файл изображения!');
                return;
            }

            statusText.innerText = 'Загрузка и анализ изображения...';
            resultDiv.innerHTML = '';

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    processStereogram(img);
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function processStereogram(img) {
            const width = img.width;
            const height = img.height;

            canvas.width = width;
            canvas.height = height;

            ctx.drawImage(img, 0, 0);
            const imgData = ctx.getImageData(0, 0, width, height);
            const data = imgData.data;

            // --- Шаг 1: Автоматический поиск периода ---
            const midY = Math.floor(height / 2);
            let bestPeriod = 100;
            let minDiffSum = Infinity;

            const minP = 50;
            const maxP = Math.min(300, Math.floor(width / 3));

            for (let p = minP; p <= maxP; p++) {
                let diffSum = 0;
                for (let x = p; x < width - p; x += 2) { // Шаг 2 для ускорения
                    const idx1 = (midY * width + x) * 4;
                    const idx2 = (midY * width + (x + p)) * 4;

                    const rDiff = Math.abs(data[idx1] - data[idx2]);
                    const gDiff = Math.abs(data[idx1+1] - data[idx2+1]);
                    const bDiff = Math.abs(data[idx1+2] - data[idx2+2]);

                    diffSum += (rDiff + gDiff + bDiff);
                }

                if (diffSum < minDiffSum) {
                    minDiffSum = diffSum;
                    bestPeriod = p;
                }
            }

            statusText.innerText = `Период успешно найден: ${bestPeriod}px. Обработка...`;

            // --- Шаг 2: Декодирование (вычитание со сдвигом) ---
            const outputData = new Uint8ClampedArray(data.length);
            const contrastFactor = 3.5;

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4;
                    const targetX = x + bestPeriod;

                    if (targetX < width) {
                        const targetIdx = (y * width + targetX) * 4;

                        const r = Math.abs(data[idx] - data[targetIdx]);
                        const g = Math.abs(data[idx + 1] - data[targetIdx + 1]);
                        const b = Math.abs(data[idx + 2] - data[targetIdx + 2]);

                        outputData[idx]     = Math.min(255, r * contrastFactor);
                        outputData[idx + 1] = Math.min(255, g * contrastFactor);
                        outputData[idx + 2] = Math.min(255, b * contrastFactor);
                        outputData[idx + 3] = 255;
                    } else {
                        outputData[idx]     = 0;
                        outputData[idx + 1] = 0;
                        outputData[idx + 2] = 0;
                        outputData[idx + 3] = 255;
                    }
                }
            }

            imgData.data.set(outputData);
            ctx.putImageData(imgData, 0, 0);

            // Вывод результата
            const resultImg = document.createElement('img');
            resultImg.src = canvas.toDataURL('image/png');
            
            statusText.innerText = `Готово! (Период: ${bestPeriod}px)`;
            resultDiv.appendChild(resultImg);
        }
    </script>
</body>
</html>
