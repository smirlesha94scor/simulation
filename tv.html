<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Монитор сети Netis & Samsung TV</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #334155;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --online-color: #22c55e;
            --offline-color: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .dashboard {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 480px;
            padding: 24px;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h2 { font-size: 18px; font-weight: 700; color: var(--accent-color); }
        .refresh-icon { cursor: pointer; color: var(--text-muted); transition: 0.3s; }
        .refresh-icon:hover { color: var(--accent-color); transform: rotate(180deg); }

        .device-list { display: flex; flex-direction: column; gap: 10px; max-height: 60vh; overflow-y: auto; padding-right: 4px; }
        
        .device-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .device-card:hover { background: var(--card-hover); border-color: rgba(56, 189, 248, 0.3); }

        .device-header { display: flex; justify-content: space-between; align-items: center; }
        .device-name { font-weight: 600; font-size: 15px; }
        .device-type { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

        .status-badge { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 20px; background: rgba(255,255,255,0.05); }
        .online { color: var(--online-color); }
        .offline { color: var(--offline-color); }
        .dot { width: 7px; height: 7px; border-radius: 50%; }
        .dot.online { background: var(--online-color); box-shadow: 0 0 8px var(--online-color); }
        .dot.offline { background: var(--offline-color); box-shadow: 0 0 8px var(--offline-color); }

        .details-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px dashed rgba(255,255,255,0.1);
            margin-top: 0;
            padding-top: 0;
        }
        .device-card.active .details-panel {
            max-height: 100px;
            margin-top: 8px;
            padding-top: 8px;
        }
        .info-row { display: flex; justify-content: space-between; padding: 2px 0; }
        .info-row span:last-child { color: var(--text-main); font-family: monospace; }

        .btn-update {
            width: 100%; background: var(--accent-color); color: #0f172a; border: none;
            padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 700;
            cursor: pointer; margin-top: 16px; transition: 0.2s;
        }
        .btn-update:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="header">
            <h2>📡 Роутер Netis: Клиенты сети</h2>
            <div class="refresh-icon" onclick="loadDevices()">🔄</div>
        </div>

        <div id="deviceContainer" class="device-list">
            <div style="text-align: center; color: var(--text-muted); padding: 20px;">Загрузка данных...</div>
        </div>

        <button class="btn-update" onclick="loadDevices()">Обновить данные</button>
    </div>

    <script>
        const SERVER_URL = 'http://localhost:3000/status';

        function toggleCard(element) {
            element.classList.toggle('active');
        }

        async function loadDevices() {
            const container = document.getElementById('deviceContainer');

            try {
                const response = await fetch(SERVER_URL);
                const data = await response.json();

                if (!data.devices || data.devices.length === 0) {
                    container.innerHTML = '<div style="text-align:center; color:var(--offline-color);">Устройства не найдены</div>';
                    return;
                }

                let html = '';
                data.devices.forEach(dev => {
                    const isOnline = dev.status === 'Online';
                    html += `
                        <div class="device-card" onclick="toggleCard(this)">
                            <div class="device-header">
                                <div>
                                    <div class="device-name">💻 ${dev.hostname}</div>
                                    <div class="device-type">${dev.type}</div>
                                </div>
                                <div class="status-badge ${isOnline ? 'online' : 'offline'}">
                                    <div class="dot ${isOnline ? 'online' : 'offline'}"></div>
                                    ${dev.status}
                                </div>
                            </div>
                            <div class="details-panel">
                                <div class="info-row"><span>IP-адрес:</span><span>${dev.ip}</span></div>
                                <div class="info-row"><span>MAC-адрес:</span><span>${dev.mac}</span></div>
                                <div class="info-row"><span>Шлюз Netis:</span><span>192.168.1.1</span></div>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = '<div style="text-align:center; color:var(--offline-color);">Нет связи с сервером index.js</div>';
            }
        }

        setInterval(loadDevices, 6000);
        loadDevices();
    </script>
</body>
</html>
