<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Монитор Samsung TV</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 350px;
            text-align: center;
        }
        .tv-item {
            background: #2a2a2a;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .status-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 16px;
        }
        .indicator {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: #555;
        }
        .indicator.online {
            background-color: #4CAF50;
            box-shadow: 0 0 8px #4CAF50;
        }
        .indicator.offline {
            background-color: #F44336;
            box-shadow: 0 0 8px #F44336;
        }
        .ip-info {
            font-size: 13px;
            color: #aaa;
            text-align: left;
        }
        .no-tv {
            color: #F44336;
            font-weight: bold;
            margin: 20px 0;
        }
        button {
            background-color: #007ACC;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 15px;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #005999;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Samsung TV Monitor</h2>
        <div id="tvContainer">
            <span>Загрузка данных...</span>
        </div>
        <button onclick="checkStatus()">Обновить статус</button>
    </div>

    <script>
        const SERVER_URL = 'http://localhost:3000/status';

        async function checkStatus() {
            const container = document.getElementById('tvContainer');

            try {
                const response = await fetch(SERVER_URL);
                const data = await response.json();

                // Проверяем, есть ли телевизоры в массиве
                if (!data.tvs || data.tvs.length === 0) {
                    container.innerHTML = '<div class="no-tv">Телевизоры не обнаружены</div>';
                    return;
                }

                let html = '';
                data.tvs.forEach((tv, index) => {
                    const isOnline = tv.status === 'Online';
                    html += `
                        <div class="tv-item">
                            <div class="status-container">
                                <span>Телевизор #${index + 1}</span>
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <span style="font-size: 13px; color: ${isOnline ? '#4CAF50' : '#F44336'}">${tv.status}</span>
                                    <div class="indicator ${isOnline ? 'online' : 'offline'}"></div>
                                </div>
                            </div>
                            <div class="ip-info">IP: ${tv.ip}</div>
                        </div>
                    `;
                });

                container.innerHTML = html;

            } catch (error) {
                container.innerHTML = '<div class="no-tv">Нет связи с локальным мостом<br><span style="font-size:12px; color:#888;">Запустите start.bat на ПК</span></div>';
                console.error('Ошибка соединения:', error);
            }
        }

        // Автообновление каждые 6 секунд
        setInterval(checkStatus, 6000);

        // Первичный вызов при открытии страницы
        checkStatus();
    </script>

</body>
</html>
