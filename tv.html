<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг Samsung TV & Netis Router</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #334155;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --online-color: #22c55e;
            --online-glow: rgba(34, 197, 94, 0.4);
            --offline-color: #ef4444;
            --offline-glow: rgba(239, 68, 68, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 440px;
            padding: 28px;
            backdrop-filter: blur(10px);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .header h2 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h2::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 20px;
            background: var(--accent-color);
            border-radius: 4px;
        }

        .refresh-icon {
            cursor: pointer;
            color: var(--text-muted);
            transition: color 0.2s, transform 0.3s;
        }

        .refresh-icon:hover {
            color: var(--accent-color);
            transform: rotate(90deg);
        }

        .tv-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .tv-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .tv-card:hover {
            background: var(--card-hover);
            border-color: rgba(56, 189, 248, 0.3);
            transform: translateY(-2px);
        }

        .tv-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tv-title {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
        }

        .badge-online {
            color: var(--online-color);
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .badge-offline {
            color: var(--offline-color);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .dot.online {
            background-color: var(--online-color);
            box-shadow: 0 0 10px var(--online-glow);
        }

        .dot.offline {
            background-color: var(--offline-color);
            box-shadow: 0 0 10px var(--offline-glow);
        }

        .tv-subtext {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
        }

        /* Панель детальной информации */
        .details-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0, 1, 0, 1), margin-top 0.2s;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 10px;
            padding: 0 12px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .tv-card.active .details-panel {
            max-height: 200px;
            margin-top: 12px;
            padding: 12px;
            border: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
        }

        .info-row span:last-child {
            color: var(--text-main);
            font-family: monospace;
        }

        .btn-update {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
            transition: all 0.2s ease;
        }

        .btn-update:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
        }

        .empty-state {
            text-align: center;
            padding: 30px 10px;
            color: var(--offline-color);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="header">
            <h2>Samsung TV Monitor</h2>
            <div class="refresh-icon" onclick="checkStatus()" title="Обновить">
                🔄
            </div>
        </div>

        <div id="tvContainer" class="tv-list">
            <div style="text-align: center; color: var(--text-muted); padding: 20px;">Загрузка устройств...</div>
        </div>

        <button class="btn-update" onclick="checkStatus()">Обновить статус</button>
    </div>

    <script>
        const SERVER_URL = 'http://localhost:3000/status';

        function toggleDetails(cardElement) {
            // Переключаем разворачивание детальной панели
            cardElement.classList.toggle('active');
        }

        async function checkStatus() {
            const container = document.getElementById('tvContainer');

            try {
                const response = await fetch(SERVER_URL);
                const data = await response.json();

                if (!data.tvs || data.tvs.length === 0) {
                    container.innerHTML = '<div class="empty-state">Телевизоры не обнаружены</div>';
                    return;
                }

                let html = '';
                data.tvs.forEach((tv, index) => {
                    const isOnline = tv.status === 'Online';
                    const mac = tv.mac || 'a4:30:7a:b5:62:83';
                    const hostname = tv.hostname || 'Samsung Smart TV';

                    html += `
                        <div class="tv-card" onclick="toggleDetails(this)">
                            <div class="tv-header">
                                <div class="tv-title">
                                    📺 Телевизор #${index + 1}
                                </div>
                                <div class="status-badge ${isOnline ? 'badge-online' : 'badge-offline'}">
                                    <div class="dot ${isOnline ? 'online' : 'offline'}"></div>
                                    ${tv.status}
                                </div>
                            </div>
                            <div class="tv-subtext">
                                <span>IP: ${tv.ip}</span>
                                <span>Нажмите для деталей ▾</span>
                            </div>

                            <!-- Скрытая панель с данными Netis -->
                            <div class="details-panel">
                                <div class="info-row">
                                    <span>Устройство (Host):</span>
                                    <span>${hostname}</span>
                                </div>
                                <div class="info-row">
                                    <span>MAC-адрес:</span>
                                    <span>${mac}</span>
                                </div>
                                <div class="info-row">
                                    <span>Производитель:</span>
                                    <span>Samsung Electronics</span>
                                </div>
                                <div class="info-row">
                                    <span>Тип бронирования:</span>
                                    <span>Dynamic (DHCP)</span>
                                </div>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;

            } catch (error) {
                container.innerHTML = `
                    <div class="empty-state">
                        Нет связи с сервером Node.js<br>
                        <span style="font-size: 12px; color: var(--text-muted); font-weight: normal;">
                            Убедитесь, что запущен index.js
                        </span>
                    </div>`;
                console.error('Ошибка соединения:', error);
            }
        }

        // Автообновление каждые 6 секунд
        setInterval(checkStatus, 6000);
        checkStatus();
    </script>
</body>
</html>
