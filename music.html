<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Ultra-Fast Silence Switcher</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .player-card {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            width: 420px;
        }
        h3 {
            margin-top: 0;
            text-align: center;
        }
        .deck {
            background: #262626;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .deck.live {
            border-color: #1db954;
        }
        .deck-title {
            font-size: 13px;
            font-weight: bold;
            color: #aaa;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }
        .track-name {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-time {
            font-size: 12px;
            color: #1db954;
            font-family: monospace;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }
        .visualizer-canvas {
            width: 100%;
            height: 40px;
            background: #111;
            border-radius: 4px;
            margin-top: 6px;
            display: block;
        }
        button, .file-btn {
            background: #333;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        button:hover, .file-btn:hover {
            background: #444;
        }
        button.primary {
            background: #1db954;
        }
        button.primary:hover {
            background: #1ed760;
        }
        input[type=range] {
            width: 100%;
            cursor: pointer;
            margin-top: 5px;
        }
        .global-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .global-controls button {
            flex: 1;
        }
        .upload-section {
            background: #252525;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
            text-align: center;
        }
        input[type="file"] {
            display: none;
        }
        .playlist-container {
            background: #181818;
            border-radius: 8px;
            max-height: 120px;
            overflow-y: auto;
        }
        .playlist-item {
            padding: 8px 10px;
            border-bottom: 1px solid #282828;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
        }
        .playlist-item:hover {
            background: #282828;
        }
        .playlist-item.active {
            color: #1db954;
            font-weight: bold;
            background: #222;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <h3>DJ Ultra-Fast Switcher</h3>

        <div class="upload-section">
            <label for="file-input" class="file-btn" style="width: 100%; display: block; box-sizing: border-box;">📂 Загрузить треки с ПК</label>
            <input type="file" id="file-input" accept="audio/*" multiple onchange="handleFiles(this.files)">
        </div>

        <!-- ДЕКА 1 -->
        <div class="deck live" id="deck1-box">
            <div class="deck-title">
                <span>ДЕКА 1 (LIVE)</span>
                <span id="deck1-status" style="color: #1db954;">В эфире</span>
            </div>
            <div class="track-name" id="track1-name">Трек не выбран</div>
            <div class="track-time">
                <span>🕒 <span id="time1-current">00:00</span></span>
                <span>BPM: <span id="bpm1-val">--</span></span>
                <span>Осталось: <span id="time1-left">00:00</span></span>
            </div>
            
            <canvas id="canvas1" class="visualizer-canvas"></canvas>

            <div style="margin-top: 6px;">
                <label style="font-size: 12px;">Темп: <b id="tempo1-val">1.00x</b></label>
                <input type="range" id="tempo1-slider" min="0.8" max="1.2" step="0.01" value="1.0" oninput="changeDeckTempo(1, this.value)">
            </div>
        </div>

        <!-- ДЕКА 2 -->
        <div class="deck" id="deck2-box">
            <div class="deck-title">
                <span>ДЕКА 2 (CUE / СЛЕДУЮЩИЙ)</span>
                <span id="deck2-status" style="color: #888;">Ожидание</span>
            </div>
            <div class="track-name" id="track2-name">Следующий трек не выбран</div>
            <div class="track-time">
                <span>🕒 <span id="time2-current">00:00</span></span>
                <span>BPM: <span id="bpm2-val">--</span></span>
                <span>Осталось: <span id="time2-left">00:00</span></span>
            </div>

            <canvas id="canvas2" class="visualizer-canvas"></canvas>

            <div style="margin-top: 6px;">
                <label style="font-size: 12px;">Темп: <b id="tempo2-val">1.00x</b></label>
                <input type="range" id="tempo2-slider" min="0.8" max="1.2" step="0.01" value="1.0" oninput="changeDeckTempo(2, this.value)">
            </div>
        </div>

        <div class="global-controls">
            <button class="primary" onclick="executeInstantSwitch()">⚡ Переключить</button>
            <button onclick="nextTrack()">След. трек</button>
        </div>

        <div class="playlist-container" id="playlist-view"></div>
    </div>

    <script>
        let playlist = [];
        let currentIndex = 0;
        let audioContext;
        
        let playerA = new Audio();
        let playerB = new Audio();

        let sourceA, sourceB;
        let gainA, gainB;
        let analyserA, analyserB;

        let activeDeck = 1;
        let isSwitching = false;

        let baseBPM1 = null;
        let baseBPM2 = null;

        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();

                sourceA = audioContext.createMediaElementSource(playerA);
                gainA = audioContext.createGain();
                analyserA = audioContext.createAnalyser();
                analyserA.fftSize = 2048; // Точный анализ волны
                sourceA.connect(analyserA).connect(gainA).connect(audioContext.destination);

                sourceB = audioContext.createMediaElementSource(playerB);
                gainB = audioContext.createGain();
                analyserB = audioContext.createAnalyser();
                analyserB.fftSize = 2048;
                sourceB.connect(analyserB).connect(gainB).connect(audioContext.destination);

                gainA.gain.setValueAtTime(1, audioContext.currentTime);
                gainB.gain.setValueAtTime(0, audioContext.currentTime);

                // Запуск ультрабыстрого цикла через requestAnimationFrame (синхронизация с частотой экрана / долями миллисекунд)
                requestAnimationFrame(ultraFastLoop);
                drawVisualizers();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) return "00:00";
            let mins = Math.floor(seconds / 60);
            let secs = Math.floor(seconds % 60);
            return (mins < 10 ? "0" : "") + mins + ":" + (secs < 10 ? "0" : "") + secs;
        }

        // Ультрабыстрый цикл проверки тишины (работает каждый кадр / каждые ~4-16 мс)
        function ultraFastLoop() {
            requestAnimationFrame(ultraFastLoop);

            let livePlayer = (activeDeck === 1) ? playerA : playerB;
            let liveAnalyser = (activeDeck === 1) ? analyserA : analyserB;

            // Обновляем таймеры на экране реже (раз в секунду через время, чтобы не грузить DOM)
            if (playerA.duration) {
                document.getElementById('time1-current').textContent = formatTime(playerA.currentTime);
                document.getElementById('time1-left').textContent = "-" + formatTime(playerA.duration - playerA.currentTime);
            }
            if (playerB.duration) {
                document.getElementById('time2-current').textContent = formatTime(playerB.currentTime);
                document.getElementById('time2-left').textContent = "-" + formatTime(playerB.duration - playerB.currentTime);
            }

            if (!livePlayer.duration || isNaN(livePlayer.duration) || isSwitching) return;

            let timeLeft = livePlayer.duration - livePlayer.currentTime;
            
            // Проверяем тишину на последних 10 секундах трека
            if (timeLeft <= 10 && liveAnalyser) {
                const pcmData = new Float32Array(liveAnalyser.fftSize);
                liveAnalyser.getFloatTimeDomainData(pcmData); // Получаем сырые колебания звука в реальном времени

                // Вычисляем RMS (среднеквадратичное значение громкости)
                let sumSquares = 0;
                for (let i = 0; i < pcmData.length; i++) {
                    sumSquares += pcmData[i] * pcmData[i];
                }
                let rms = Math.sqrt(sumSquares / pcmData.length);

                // Если уровень громкости упал ниже порога тишины (0.005)
                if (rms < 0.005) {
                    isSwitching = true;
                    executeInstantSwitch();
                }
            }
        }

        function drawVisualizers() {
            requestAnimationFrame(drawVisualizers);
            drawDeckWave('canvas1', analyserA, '#1db954');
            drawDeckWave('canvas2', analyserB, '#00bfff');
        }

        function drawDeckWave(canvasId, analyser, color) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;

            ctx.clearRect(0, 0, width, height);
            if (!analyser) return;

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            ctx.fillStyle = color;
            const barWidth = (width / bufferLength) * 1.5;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                let barHeight = (dataArray[i] / 255) * height;
                ctx.fillRect(x, height - barHeight, barWidth - 1, barHeight);
                x += barWidth;
            }
        }

        function handleFiles(files) {
            if (!files.length) return;
            for (let file of files) {
                const objectURL = URL.createObjectURL(file);
                const cleanName = file.name.replace(/\.[^/.]+$/, "");
                playlist.push({ name: cleanName, url: objectURL });
            }
            renderPlaylist();

            if (playerA.paused && playerB.paused && playlist.length > 0) {
                loadDeck(1, 0);
                loadDeck(2, 1 < playlist.length ? 1 : 0);
                playerA.play();
                activeDeck = 1;
                updateDeckUI();
                prepareNextDeckPreview();
            }
        }

        function renderPlaylist() {
            const container = document.getElementById('playlist-view');
            container.innerHTML = '';
            if (playlist.length === 0) {
                container.innerHTML = '<div style="padding: 10px; text-align: center; color: #666;">Плейлист пуст</div>';
                return;
            }
            playlist.forEach((track, idx) => {
                const item = document.createElement('div');
                item.className = 'playlist-item' + (idx === currentIndex ? ' active' : '');
                item.textContent = `${idx + 1}. ${track.name}`;
                container.appendChild(item);
            });
        }

        async function calculateBPM(url) {
            try {
                const response = await fetch(url);
                const arrayBuffer = await response.arrayBuffer();
                const offlineContext = new OfflineAudioContext(1, arrayBuffer.byteLength, 44100);
                const audioBuffer = await offlineContext.decodeAudioData(arrayBuffer);

                const bufferSource = offlineContext.createBufferSource();
                bufferSource.buffer = audioBuffer;

                const filter = offlineContext.createBiquadFilter();
                filter.type = "lowpass";
                filter.frequency.value = 150;

                bufferSource.connect(filter);
                filter.connect(offlineContext.destination);
                bufferSource.start(0);

                const renderedBuffer = await offlineContext.startRendering();
                const pcmData = renderedBuffer.getChannelData(0);

                let peaks = [];
                let threshold = 0.3;
                for (let i = 0; i < pcmData.length; i += 1000) {
                    if (pcmData[i] > threshold) {
                        peaks.push(i);
                        i += 10000;
                    }
                }

                let intervals = [];
                for (let i = 1; i < peaks.length; i++) {
                    intervals.push(peaks[i] - peaks[i - 1]);
                }

                if (intervals.length === 0) return 120;

                let avgInterval = intervals.reduce((a, b) => a + b, 0) / intervals.length;
                let bpm = Math.round(60 / (avgInterval / 44100));

                while (bpm < 90) bpm *= 2;
                while (bpm > 180) bpm /= 2;

                return Math.round(bpm);
            } catch (err) {
                return 120;
            }
        }

        function loadDeck(deckNum, playlistIdx) {
            initAudioContext();
            if (playlist.length === 0) return;

            let track = playlist[playlistIdx];
            let player = (deckNum === 1) ? playerA : playerB;

            player.src = track.url;
            player.load();
            player.preservesPitch = true;

            if (deckNum === 1) {
                document.getElementById('track1-name').textContent = track.name;
                calculateBPM(track.url).then(bpm => {
                    baseBPM1 = bpm;
                    updateBPMDisplay(1);
                });
            } else {
                document.getElementById('track2-name').textContent = track.name;
                calculateBPM(track.url).then(bpm => {
                    baseBPM2 = bpm;
                    autoSyncBPM();
                });
            }
        }

        function autoSyncBPM() {
            if (!baseBPM1 || !baseBPM2) return;

            let liveBase = (activeDeck === 1) ? baseBPM1 : baseBPM2;
            let currentLiveBPM = liveBase * parseFloat(document.getElementById(`tempo${activeDeck}-slider`).value);

            let requiredSpeed = currentLiveBPM / baseBPM2;
            requiredSpeed = Math.max(0.8, Math.min(1.2, requiredSpeed));

            let nextDeckNum = (activeDeck === 1) ? 2 : 1;
            document.getElementById(`tempo${nextDeckNum}-slider`).value = requiredSpeed.toFixed(2);
            changeDeckTempo(nextDeckNum, requiredSpeed);
        }

        function changeDeckTempo(deckNum, value) {
            let speed = parseFloat(value);
            document.getElementById(`tempo${deckNum}-val`).textContent = speed.toFixed(2) + 'x';

            let player = (deckNum === 1) ? playerA : playerB;
            player.preservesPitch = true;
            player.playbackRate = speed;

            updateBPMDisplay(deckNum);
        }

        function updateBPMDisplay(deckNum) {
            let base = (deckNum === 1) ? baseBPM1 : baseBPM2;
            let sliderVal = parseFloat(document.getElementById(`tempo${deckNum}-slider`).value);
            if (base) {
                document.getElementById(`bpm${deckNum}-val`).textContent = Math.round(base * sliderVal);
            }
        }

        function prepareNextDeckPreview() {
            let previewPlayer = (activeDeck === 1) ? playerB : playerA;
            let previewGain = (activeDeck === 1) ? gainB : gainA;
            let deckNum = (activeDeck === 1) ? 2 : 1;

            previewGain.gain.setValueAtTime(0, audioContext.currentTime);
            previewPlayer.play().then(() => {
                document.getElementById(`deck${deckNum}-status`).textContent = "Готов (тихо)";
                document.getElementById(`deck${deckNum}-status`).style.color = "#00bfff";
            }).catch(e => console.log("Превью:", e));
        }

        function executeInstantSwitch() {
            initAudioContext();
            let now = audioContext.currentTime;

            let liveGain = (activeDeck === 1) ? gainA : gainB;
            let livePlayer = (activeDeck === 1) ? playerA : playerB;

            let nextGain = (activeDeck === 1) ? gainB : gainA;
            let nextPlayer = (activeDeck === 1) ? playerB : playerA;

            if (nextPlayer.paused) {
                nextPlayer.play();
            }

            // Мгновенный свитч сигнала
            nextGain.gain.setValueAtTime(1, now);
            liveGain.gain.setValueAtTime(0, now);

            livePlayer.pause();
            activeDeck = (activeDeck === 1) ? 2 : 1;
            updateDeckUI();
            
            currentIndex = (currentIndex + 1) % playlist.length;
            renderPlaylist();

            let nextDeckToLoad = (activeDeck === 1) ? 2 : 1;
            loadDeck(nextDeckToLoad, (currentIndex + 1) % playlist.length);
            prepareNextDeckPreview();

            isSwitching = false;
        }

        function updateDeckUI() {
            if (activeDeck === 1) {
                document.getElementById('deck1-box').className = "deck live";
                document.getElementById('deck2-box').className = "deck";
                document.getElementById('deck1-status').textContent = "В эфире";
                document.getElementById('deck1-status').style.color = "#1db954";
                document.getElementById('deck2-status').textContent = "Ожидание";
                document.getElementById('deck2-status').style.color = "#888";
            } else {
                document.getElementById('deck1-box').className = "deck";
                document.getElementById('deck2-box').className = "deck live";
                document.getElementById('deck2-status').textContent = "В эфире";
                document.getElementById('deck2-status').style.color = "#1db954";
                document.getElementById('deck1-status').textContent = "Ожидание";
                document.getElementById('deck1-status').style.color = "#888";
            }
        }

        function nextTrack() {
            if (!isSwitching) {
                isSwitching = true;
                executeInstantSwitch();
            }
        }
    </script>

</body>
</html>
