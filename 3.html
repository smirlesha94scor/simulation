<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симуляция Автовокзала — Схема Маршрутов</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        canvas {
            background-color: #1e293b;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <canvas id="simCanvas" width="900" height="750"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // Фиксированная геометрия карты
        const MAP_PARAMS = {
            roadWidth: 98,
            roadStartY: 398,
            platformCenterY: 50,
            platformRadius: 315,
            ringThickness: 76,
            platformCount: 5,
            arcSpread: 140,
            arcRotation: 0,
            stationWidth: 259,
            stationHeight: 117,
            stationY: 58,
            platforms: [
                { angle: 5, offset: -19 },
                { angle: 5, offset: -25 },
                { angle: 0, offset: -22 },
                { angle: -5, offset: -25 },
                { angle: -5, offset: -18 }
            ]
        };

        // Сохраненные пути движения
        const paths = [
            {
                name: 'Заезд на П-1',
                targetPlatform: 0,
                color: '#38bdf8',
                points: [
                    { x: 474, y: 692 },
                    { x: 474, y: 384 },
                    { x: 559, y: 365 },
                    { x: 619, y: 339 },
                    { x: 657, y: 308 },
                    { x: 688, y: 281 },
                    { x: 694, y: 247 },
                    { x: 696, y: 193 },
                    { x: 694, y: 130 }
                ]
            },
            {
                name: 'Маршрут к П-2',
                targetPlatform: 1,
                color: '#f59e0b',
                points: [
                    { x: 472, y: 692 },
                    { x: 470, y: 389 },
                    { x: 525, y: 378 },
                    { x: 573, y: 362 },
                    { x: 588, y: 336 },
                    { x: 592, y: 307 },
                    { x: 594, y: 252 }
                ]
            },
            {
                name: 'Маршрут к П-3',
                targetPlatform: 2,
                color: '#10b981',
                points: [
                    { x: 474, y: 692 },
                    { x: 473, y: 400 },
                    { x: 458, y: 366 },
                    { x: 450, y: 338 },
                    { x: 449, y: 293 }
                ]
            },
            {
                name: 'Маршрут к П-4',
                targetPlatform: 3,
                color: '#ec4899',
                points: [
                    { x: 476, y: 692 },
                    { x: 472, y: 353 },
                    { x: 427, y: 349 },
                    { x: 391, y: 340 },
                    { x: 341, y: 327 },
                    { x: 313, y: 306 },
                    { x: 308, y: 283 },
                    { x: 305, y: 245 }
                ]
            },
            {
                name: 'Маршрут к П-5',
                targetPlatform: 4,
                color: '#8b5cf6',
                points: [
                    { x: 473, y: 692 },
                    { x: 472, y: 344 },
                    { x: 421, y: 342 },
                    { x: 375, y: 334 },
                    { x: 329, y: 318 },
                    { x: 284, y: 293 },
                    { x: 246, y: 263 },
                    { x: 214, y: 225 },
                    { x: 207, y: 127 }
                ]
            }
        ];

        function drawMap() {
            const CENTER_X = canvas.width / 2;

            // Фон
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Главная дорога
            ctx.fillStyle = '#334155';
            ctx.fillRect(CENTER_X - MAP_PARAMS.roadWidth / 2, MAP_PARAMS.roadStartY, MAP_PARAMS.roadWidth, canvas.height - MAP_PARAMS.roadStartY);

            // Разделительная линия
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2;
            ctx.setLineDash([12, 12]);
            ctx.beginPath();
            ctx.moveTo(CENTER_X, MAP_PARAMS.roadStartY + 10);
            ctx.lineTo(CENTER_X, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // Асфальт полукруга
            const innerRadius = Math.max(10, MAP_PARAMS.platformRadius - MAP_PARAMS.ringThickness / 2);

            ctx.beginPath();
            ctx.arc(CENTER_X, MAP_PARAMS.platformCenterY, MAP_PARAMS.platformRadius, 0, Math.PI);
            ctx.lineWidth = MAP_PARAMS.ringThickness;
            ctx.strokeStyle = '#334155';
            ctx.lineCap = 'butt';
            ctx.stroke();

            // Внутренний островок газона
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(CENTER_X, MAP_PARAMS.platformCenterY, innerRadius, 0, Math.PI);
            ctx.fill();

            // Платформы
            const spreadRad = (MAP_PARAMS.arcSpread * Math.PI) / 180;
            const rotationRad = (MAP_PARAMS.arcRotation * Math.PI) / 180;
            const baseCenterAngle = Math.PI * 0.5;
            const startAngle = baseCenterAngle - spreadRad / 2 + rotationRad;
            const endAngle = baseCenterAngle + spreadRad / 2 + rotationRad;

            for (let i = 0; i < MAP_PARAMS.platformCount; i++) {
                let angle = startAngle + (i / (MAP_PARAMS.platformCount - 1)) * (endAngle - startAngle);
                const custom = MAP_PARAMS.platforms[i];
                const placementRadius = innerRadius + custom.offset;

                const pX = CENTER_X + Math.cos(angle) * placementRadius;
                const pY = MAP_PARAMS.platformCenterY + Math.sin(angle) * placementRadius;

                ctx.save();
                ctx.translate(pX, pY);
                ctx.rotate((custom.angle * Math.PI) / 180);

                ctx.fillStyle = '#22c55e';
                ctx.fillRect(-12, -22, 24, 44);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.strokeRect(-12, -22, 24, 44);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`П-${i + 1}`, 0, 4);

                ctx.restore();
            }

            // Здание вокзала
            const stationX = CENTER_X - MAP_PARAMS.stationWidth / 2;
            ctx.fillStyle = '#0284c7';
            ctx.beginPath();
            ctx.roundRect(stationX, MAP_PARAMS.stationY, MAP_PARAMS.stationWidth, MAP_PARAMS.stationHeight, 10);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('АВТОВОКЗАЛ', CENTER_X, MAP_PARAMS.stationY + MAP_PARAMS.stationHeight / 2 + 6);

            // Отрисовка всех траекторий
            paths.forEach(p => {
                if (p.points.length < 2) return;
                ctx.beginPath();
                ctx.moveTo(p.points[0].x, p.points[0].y);
                for (let i = 1; i < p.points.length; i++) {
                    ctx.lineTo(p.points[i].x, p.points[i].y);
                }
                ctx.strokeStyle = p.color || '#38bdf8';
                ctx.lineWidth = 2.5;
                ctx.stroke();

                // Точки путей
                p.points.forEach((pt) => {
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.strokeStyle = p.color;
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                });
            });
        }

        drawMap();
    </script>
</body>
</html>
