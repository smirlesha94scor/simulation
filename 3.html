<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симуляция Автовокзала — Конструктор Маршрутов</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #viewport {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a2332;
            position: relative;
        }

        canvas {
            background-color: #1e293b;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            cursor: crosshair;
        }

        #controls {
            width: 380px;
            background-color: #0f172a;
            border-left: 1px solid #334155;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
        }

        h2 {
            color: #38bdf8;
            font-size: 1.2rem;
            margin-bottom: 2px;
        }

        .section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            margin-top: 6px;
            margin-bottom: 2px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 0.82rem;
            color: #cbd5e1;
            display: flex;
            justify-content: space-between;
        }

        select, input[type="text"] {
            width: 100%;
            background-color: #1e293b;
            color: #38bdf8;
            border: 1px solid #334155;
            padding: 7px;
            border-radius: 6px;
            font-weight: bold;
            outline: none;
            font-size: 0.85rem;
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 9px 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.82rem;
            text-align: center;
        }

        .btn:hover {
            background-color: #0369a1;
        }

        .btn-danger {
            background-color: #ef4444;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .btn-secondary {
            background-color: #475569;
        }

        .btn-secondary:hover {
            background-color: #334155;
        }

        textarea {
            width: 100%;
            height: 150px;
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #38bdf8;
            font-family: monospace;
            font-size: 0.72rem;
            padding: 8px;
            border-radius: 6px;
            resize: none;
            user-select: text;
        }

        .point-list {
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #334155;
            border-radius: 6px;
            background-color: #1e293b;
        }

        .point-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            font-size: 0.8rem;
            border-bottom: 1px solid #334155;
        }

        .point-item:last-child {
            border-bottom: none;
        }

        .del-pt {
            color: #f87171;
            cursor: pointer;
            font-weight: bold;
            padding: 0 4px;
        }

        .del-pt:hover {
            color: #ef4444;
        }

        .hint-box {
            font-size: 0.75rem;
            color: #94a3b8;
            background: #1e293b;
            padding: 8px;
            border-radius: 6px;
            border-left: 3px solid #38bdf8;
        }
    </style>
</head>
<body>

    <div id="viewport">
        <canvas id="simCanvas" width="900" height="750"></canvas>
    </div>

    <div id="controls">
        <h2>Редактор Путей Выезда / Въезда</h2>
        
        <div class="hint-box">
            Кликайте по Canvas для добавления точек пути. Перетаскивайте точки мышью. Отображается только выбранный путь.
        </div>

        <div class="section-title">Управление Путями</div>
        <div class="control-group">
            <label>Выберите активный путь:</label>
            <select id="selectPath"></select>
        </div>

        <div class="btn-row">
            <button class="btn" id="btnAddOutPath">+ Путь выезда (ОТ платформы)</button>
        </div>
        <div class="btn-row" style="margin-top: 4px;">
            <button class="btn btn-secondary" id="btnAddInPath">+ Путь въезда</button>
            <button class="btn btn-danger" id="btnDelPath">Удалить путь</button>
        </div>

        <div class="control-group">
            <label>Имя маршрута:</label>
            <input type="text" id="inputPathName" value="Выезд с П-1">
        </div>

        <div class="control-group">
            <label>Платформа назначения:</label>
            <select id="selectTargetPlatform">
                <option value="0">Платформа П-1</option>
                <option value="1">Платформа П-2</option>
                <option value="2">Платформа П-3</option>
                <option value="3">Платформа П-4</option>
                <option value="4">Платформа П-5</option>
            </select>
        </div>

        <div class="section-title">Точки пути (Waypoints)</div>
        <div class="point-list" id="pointList"></div>

        <div class="btn-row">
            <button class="btn btn-secondary" id="btnClearPoints">Очистить точки</button>
        </div>

        <div class="section-title">Экспорт конфигурации</div>
        <button class="btn" id="btnCopy">Скопировать конфиг для чата</button>
        <textarea id="configOutput" readonly></textarea>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // Фиксированная геометрия карты
        const MAP_PARAMS = {
            roadWidth: 98,
            roadStartY: 398,
            platformCenterY: 50,
            platformRadius: 315,
            ringThickness: 76,
            platformCount: 5,
            arcSpread: 140,
            arcRotation: 0,
            stationWidth: 259,
            stationHeight: 117,
            stationY: 58,
            platforms: [
                { angle: 5, offset: -19 },
                { angle: 5, offset: -25 },
                { angle: 0, offset: -22 },
                { angle: -5, offset: -25 },
                { angle: -5, offset: -18 }
            ]
        };

        // Начальный набор путей (ваши 5 путей заезда + заготовка для выезда)
        let paths = [
            {
                name: 'Заезд на П-1',
                targetPlatform: 0,
                type: 'in',
                color: '#38bdf8',
                points: [[474, 692], [474, 384], [559, 365], [619, 339], [657, 308], [688, 281], [694, 247], [696, 193], [694, 130]].map(p => ({x: p[0], y: p[1]}))
            },
            {
                name: 'Маршрут к П-2',
                targetPlatform: 1,
                type: 'in',
                color: '#f59e0b',
                points: [[472, 692], [470, 389], [525, 378], [573, 362], [588, 336], [592, 307], [594, 252]].map(p => ({x: p[0], y: p[1]}))
            },
            {
                name: 'Маршрут к П-3',
                targetPlatform: 2,
                type: 'in',
                color: '#10b981',
                points: [[474, 692], [473, 400], [458, 366], [450, 338], [449, 293]].map(p => ({x: p[0], y: p[1]}))
            },
            {
                name: 'Маршрут к П-4',
                targetPlatform: 3,
                type: 'in',
                color: '#ec4899',
                points: [[476, 692], [472, 353], [427, 349], [391, 340], [341, 327], [313, 306], [308, 283], [305, 245]].map(p => ({x: p[0], y: p[1]}))
            },
            {
                name: 'Маршрут к П-5',
                targetPlatform: 4,
                type: 'in',
                color: '#8b5cf6',
                points: [[473, 692], [472, 344], [421, 342], [375, 334], [329, 318], [284, 293], [246, 263], [214, 225], [207, 127]].map(p => ({x: p[0], y: p[1]}))
            },
            {
                name: 'Выезд с П-1',
                targetPlatform: 0,
                type: 'out',
                color: '#ef4444',
                points: [{x: 694, y: 130}]
            }
        ];

        let selectedPathIndex = 5; // По умолчанию выбираем создание Выезда с П-1
        let draggingPoint = null;

        const selectPathEl = document.getElementById('selectPath');
        const inputPathNameEl = document.getElementById('inputPathName');
        const selectTargetPlatformEl = document.getElementById('selectTargetPlatform');
        const pointListEl = document.getElementById('pointList');
        const configOutputEl = document.getElementById('configOutput');

        function initUI() {
            renderPathSelect();
            renderPointList();
            updateConfigText();
            drawMap();
        }

        function renderPathSelect() {
            selectPathEl.innerHTML = '';
            paths.forEach((p, i) => {
                const opt = document.createElement('option');
                opt.value = i;
                const prefix = p.type === 'out' ? '🚩 [ВЫЕЗД] ' : '🚌 [ВЪЕЗД] ';
                opt.textContent = `${prefix}${p.name} (П-${p.targetPlatform + 1}) — ${p.points.length} т.`;
                selectPathEl.appendChild(opt);
            });
            selectPathEl.value = selectedPathIndex;
            if (paths[selectedPathIndex]) {
                inputPathNameEl.value = paths[selectedPathIndex].name;
                selectTargetPlatformEl.value = paths[selectedPathIndex].targetPlatform;
            }
        }

        function renderPointList() {
            pointListEl.innerHTML = '';
            const currentPath = paths[selectedPathIndex];
            if (!currentPath) return;

            currentPath.points.forEach((pt, i) => {
                const item = document.createElement('div');
                item.className = 'point-item';
                item.innerHTML = `
                    <span><b>#${i + 1}</b> (X: ${Math.round(pt.x)}, Y: ${Math.round(pt.y)})</span>
                    <span class="del-pt" data-index="${i}">✕</span>
                `;
                pointListEl.appendChild(item);
            });

            pointListEl.querySelectorAll('.del-pt').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = parseInt(e.target.getAttribute('data-index'));
                    currentPath.points.splice(idx, 1);
                    renderPointList();
                    renderPathSelect();
                    updateConfigText();
                    drawMap();
                });
            });
        }

        selectPathEl.addEventListener('change', (e) => {
            selectedPathIndex = parseInt(e.target.value);
            inputPathNameEl.value = paths[selectedPathIndex].name;
            selectTargetPlatformEl.value = paths[selectedPathIndex].targetPlatform;
            renderPointList();
            drawMap();
        });

        inputPathNameEl.addEventListener('input', (e) => {
            if (paths[selectedPathIndex]) {
                paths[selectedPathIndex].name = e.target.value;
                renderPathSelect();
                updateConfigText();
            }
        });

        selectTargetPlatformEl.addEventListener('change', (e) => {
            if (paths[selectedPathIndex]) {
                paths[selectedPathIndex].targetPlatform = parseInt(e.target.value);
                renderPathSelect();
                updateConfigText();
                drawMap();
            }
        });

        document.getElementById('btnAddOutPath').addEventListener('click', () => {
            const outCount = paths.filter(p => p.type === 'out').length + 1;
            paths.push({
                name: `Выезд с П-${outCount}`,
                targetPlatform: Math.min(outCount - 1, 4),
                type: 'out',
                color: '#ef4444',
                points: []
            });
            selectedPathIndex = paths.length - 1;
            renderPathSelect();
            renderPointList();
            updateConfigText();
            drawMap();
        });

        document.getElementById('btnAddInPath').addEventListener('click', () => {
            const inCount = paths.filter(p => p.type === 'in').length + 1;
            paths.push({
                name: `Заезд на П-${inCount}`,
                targetPlatform: Math.min(inCount - 1, 4),
                type: 'in',
                color: '#38bdf8',
                points: []
            });
            selectedPathIndex = paths.length - 1;
            renderPathSelect();
            renderPointList();
            updateConfigText();
            drawMap();
        });

        document.getElementById('btnDelPath').addEventListener('click', () => {
            if (paths.length <= 1) {
                alert('Нельзя удалить единственный путь!');
                return;
            }
            paths.splice(selectedPathIndex, 1);
            selectedPathIndex = Math.max(0, selectedPathIndex - 1);
            renderPathSelect();
            renderPointList();
            updateConfigText();
            drawMap();
        });

        document.getElementById('btnClearPoints').addEventListener('click', () => {
            if (paths[selectedPathIndex]) {
                paths[selectedPathIndex].points = [];
                renderPointList();
                renderPathSelect();
                updateConfigText();
                drawMap();
            }
        });

        // Клик и перетаскивание точек
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const currentPath = paths[selectedPathIndex];
            if (!currentPath) return;

            for (let i = 0; i < currentPath.points.length; i++) {
                const pt = currentPath.points[i];
                const dist = Math.hypot(pt.x - mouseX, pt.y - mouseY);
                if (dist <= 12) {
                    draggingPoint = pt;
                    return;
                }
            }

            currentPath.points.push({ x: mouseX, y: mouseY });
            renderPointList();
            renderPathSelect();
            updateConfigText();
            drawMap();
        });

        canvas.addEventListener('mousemove', (e) => {
            if (draggingPoint) {
                const rect = canvas.getBoundingClientRect();
                draggingPoint.x = Math.round(e.clientX - rect.left);
                draggingPoint.y = Math.round(e.clientY - rect.top);
                renderPointList();
                updateConfigText();
                drawMap();
            }
        });

        window.addEventListener('mouseup', () => {
            draggingPoint = null;
        });

        function updateConfigText() {
            let pathsFormatted = paths.map((p, idx) => {
                const pts = p.points.map(pt => `[${Math.round(pt.x)}, ${Math.round(pt.y)}]`).join(', ');
                const typeLabel = p.type === 'out' ? 'Выезд' : 'Въезд';
                return `  - Путь ${idx + 1} ("${p.name}", ${typeLabel}, Платформа П-${p.targetPlatform + 1}): [${pts}]`;
            }).join('\n');

            const configStr = `Параметры геометрии карты:
- Ширина дороги: ${MAP_PARAMS.roadWidth}
- Высота начала дороги: ${MAP_PARAMS.roadStartY}
- Центр Y полукруга: ${MAP_PARAMS.platformCenterY}
- Радиус полукруга: ${MAP_PARAMS.platformRadius}
- Толщина асфальта: ${MAP_PARAMS.ringThickness}
- Количество платформ: ${MAP_PARAMS.platformCount}
- Размах дуги платформ: ${MAP_PARAMS.arcSpread}°
- Поворот дуги платформ: ${MAP_PARAMS.arcRotation}°
- Ширина вокзала: ${MAP_PARAMS.stationWidth}
- Высота вокзала: ${MAP_PARAMS.stationHeight}
- Y вокзала: ${MAP_PARAMS.stationY}

Траектории движения автобусов:
${pathsFormatted}`;

            configOutputEl.value = configStr;
        }

        function drawMap() {
            const CENTER_X = canvas.width / 2;

            // Фон
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Главная дорога
            ctx.fillStyle = '#334155';
            ctx.fillRect(CENTER_X - MAP_PARAMS.roadWidth / 2, MAP_PARAMS.roadStartY, MAP_PARAMS.roadWidth, canvas.height - MAP_PARAMS.roadStartY);

            // Разделительная линия
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2;
            ctx.setLineDash([12, 12]);
            ctx.beginPath();
            ctx.moveTo(CENTER_X, MAP_PARAMS.roadStartY + 10);
            ctx.lineTo(CENTER_X, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // Асфальт полукруга
            const innerRadius = Math.max(10, MAP_PARAMS.platformRadius - MAP_PARAMS.ringThickness / 2);

            ctx.beginPath();
            ctx.arc(CENTER_X, MAP_PARAMS.platformCenterY, MAP_PARAMS.platformRadius, 0, Math.PI);
            ctx.lineWidth = MAP_PARAMS.ringThickness;
            ctx.strokeStyle = '#334155';
            ctx.lineCap = 'butt';
            ctx.stroke();

            // Внутренний островок газона
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(CENTER_X, MAP_PARAMS.platformCenterY, innerRadius, 0, Math.PI);
            ctx.fill();

            // Платформы
            const spreadRad = (MAP_PARAMS.arcSpread * Math.PI) / 180;
            const rotationRad = (MAP_PARAMS.arcRotation * Math.PI) / 180;
            const baseCenterAngle = Math.PI * 0.5;
            const startAngle = baseCenterAngle - spreadRad / 2 + rotationRad;
            const endAngle = baseCenterAngle + spreadRad / 2 + rotationRad;

            const activePath = paths[selectedPathIndex];
            const currentTargetPlatform = activePath ? activePath.targetPlatform : 0;

            for (let i = 0; i < MAP_PARAMS.platformCount; i++) {
                let angle = startAngle + (i / (MAP_PARAMS.platformCount - 1)) * (endAngle - startAngle);
                const custom = MAP_PARAMS.platforms[i];
                const placementRadius = innerRadius + custom.offset;

                const pX = CENTER_X + Math.cos(angle) * placementRadius;
                const pY = MAP_PARAMS.platformCenterY + Math.sin(angle) * placementRadius;

                ctx.save();
                ctx.translate(pX, pY);
                ctx.rotate((custom.angle * Math.PI) / 180);

                const isTarget = (i === currentTargetPlatform);

                ctx.fillStyle = isTarget ? '#38bdf8' : '#22c55e';
                ctx.fillRect(-12, -22, 24, 44);
                ctx.strokeStyle = isTarget ? '#f59e0b' : '#ffffff';
                ctx.lineWidth = isTarget ? 3 : 2;
                ctx.strokeRect(-12, -22, 24, 44);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`П-${i + 1}`, 0, 4);

                ctx.restore();
            }

            // Здание вокзала
            const stationX = CENTER_X - MAP_PARAMS.stationWidth / 2;
            ctx.fillStyle = '#0284c7';
            ctx.beginPath();
            ctx.roundRect(stationX, MAP_PARAMS.stationY, MAP_PARAMS.stationWidth, MAP_PARAMS.stationHeight, 10);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('АВТОВОКЗАЛ', CENTER_X, MAP_PARAMS.stationY + MAP_PARAMS.stationHeight / 2 + 6);

            // Отрисовка ТОЛЬКО выбранного пути
            if (activePath && activePath.points.length > 0) {
                ctx.beginPath();
                ctx.moveTo(activePath.points[0].x, activePath.points[0].y);
                for (let i = 1; i < activePath.points.length; i++) {
                    ctx.lineTo(activePath.points[i].x, activePath.points[i].y);
                }

                ctx.strokeStyle = activePath.color || '#38bdf8';
                ctx.lineWidth = 3;
                if (activePath.type === 'out') {
                    ctx.setLineDash([8, 6]); // Пунктир для пути выезда
                }
                ctx.stroke();
                ctx.setLineDash([]);

                // Точки пути
                activePath.points.forEach((pt, ptIdx) => {
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, 6, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.strokeStyle = activePath.color;
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 11px sans-serif';
                    ctx.fillText(ptIdx + 1, pt.x, pt.y - 10);
                });
            }
        }

        document.getElementById('btnCopy').addEventListener('click', () => {
            configOutputEl.select();
            navigator.clipboard.writeText(configOutputEl.value);
            alert('Конфигурация маршрутов скопирована!');
        });

        initUI();
    </script>
</body>
</html>
