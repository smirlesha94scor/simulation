<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Детектор: Адаптивный поиск утечек</title>
    <style>
        :root {
            --excel-green: #107c41;
            --excel-light-green: #e6f2ed;
            --border-color: #d4d4d4;
            --header-bg: #f3f3f3;
            --cell-selected: #e7f3fd;
            --cell-border-selected: #106ebe;
            --danger-bg: #fde8e8;
            --danger-color: #9b1c1c;
            --warning-bg: #fef3c7;
            --warning-color: #92400e;
            --helper-bg: #0f172a;
            --helper-text: #f8fafc;
            --helper-accent: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Запрет внешней прокрутки страницы */
        html, body {
            height: 100%;
            overflow: hidden;
            background-color: #f8fafc;
            color: #333;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--excel-green);
            color: white;
            padding: 6px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 0.95rem;
            font-weight: 600;
        }

        /* Строка формул */
        .formula-bar-container {
            display: flex;
            align-items: center;
            background-color: #fff;
            border-bottom: 1px solid var(--border-color);
            padding: 3px 6px;
            gap: 6px;
            flex-shrink: 0;
        }

        .cell-address {
            width: 50px;
            padding: 2px 4px;
            border: 1px solid var(--border-color);
            background-color: #f8f9fa;
            font-weight: bold;
            text-align: center;
            font-size: 0.8rem;
            border-radius: 2px;
        }

        .fx-label {
            font-weight: bold;
            color: #666;
            font-style: italic;
            font-size: 0.85rem;
        }

        .formula-input {
            flex: 1;
            padding: 3px 6px;
            border: 1px solid var(--border-color);
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.85rem;
            border-radius: 2px;
            outline: none;
        }

        /* Панель детектора утечек */
        .live-helper {
            background-color: var(--helper-bg);
            color: var(--helper-text);
            padding: 8px 12px;
            border-bottom: 2px solid var(--helper-accent);
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .helper-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .helper-title-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .helper-badge {
            background-color: var(--helper-accent);
            color: #0f172a;
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .helper-cell-ref {
            color: #facc15;
            font-family: monospace;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .helper-instruction {
            line-height: 1.3;
            color: #e2e8f0;
            background: #1e293b;
            padding: 6px 10px;
            border-radius: 4px;
            border-left: 3px solid var(--helper-accent);
        }

        .helper-code {
            background-color: #0f172a;
            color: #38bdf8;
            padding: 1px 4px;
            border-radius: 2px;
            font-family: monospace;
        }

        /* Область сетки Excel с изолированной прокруткой */
        .sheet-container {
            flex: 1;
            overflow: auto;
            position: relative;
            background-color: #fff;
        }

        table.excel-grid {
            border-collapse: collapse;
            table-layout: fixed;
            font-size: 0.8rem;
            width: 100%;
        }

        table.excel-grid th, table.excel-grid td {
            border: 1px solid var(--border-color);
            height: 22px;
            padding: 0 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        table.excel-grid th {
            background-color: var(--header-bg);
            color: #555;
            font-weight: 600;
            text-align: center;
            user-select: none;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        table.excel-grid th.col-header { min-width: 100px; }
        table.excel-grid th.row-header { width: 35px; min-width: 35px; position: sticky; left: 0; z-index: 3; }

        table.excel-grid td {
            background-color: #fff;
            cursor: cell;
        }

        table.excel-grid td.selected {
            outline: 2px solid var(--cell-border-selected);
            outline-offset: -2px;
            background-color: var(--cell-selected) !important;
        }

        td.cell-leak {
            background-color: var(--danger-bg) !important;
            color: var(--danger-color);
            font-weight: bold;
        }

        td.cell-overspend {
            background-color: var(--warning-bg) !important;
            color: var(--warning-color);
            font-weight: bold;
        }

        td.section-header {
            background-color: var(--excel-light-green) !important;
            font-weight: bold;
            color: var(--excel-green);
        }

        footer {
            background-color: #f1f5f9;
            border-top: 1px solid var(--border-color);
            padding: 4px 12px;
            font-size: 0.75rem;
            color: #475569;
            display: flex;
            justify-content: space-between;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<header>
    <h1>🟢 Excel Детектор: Адаптивная диагностика утечек</h1>
    <button onclick="resetSheet()" style="background:#fff; color:var(--excel-green); border:none; padding:2px 8px; font-size:0.75rem; font-weight:bold; cursor:pointer; border-radius:3px;">Сбросить таблицу</button>
</header>

<!-- Строка формул -->
<div class="formula-bar-container">
    <div class="cell-address" id="active-cell-id">A1</div>
    <div class="fx-label">fx</div>
    <input type="text" class="formula-input" id="formula-input" placeholder="Введите значение или формулу" oninput="liveUpdateFormulaInput()" onkeydown="handleFormulaKey(event)">
</div>

<!-- ПОМОЩНИК-ДЕТЕКТОР В РЕАЛЬНОМ ВРЕМЕНИ -->
<div class="live-helper">
    <div class="helper-header">
        <div class="helper-title-group">
            <span class="helper-badge">🔍 Детектор Утечек</span>
            <span>Выбранная ячейка: <span class="helper-cell-ref" id="helper-cell-id">A1</span></span>
        </div>
    </div>
    <div class="helper-instruction" id="helper-text">
        Кликните по любой ячейке таблицы для анализа.
    </div>
</div>

<!-- Сетка с компактным размещением -->
<div class="sheet-container">
    <table class="excel-grid" id="excel-grid"></table>
</div>

<footer>
    <div id="status-summary">Идет диагностика расходов...</div>
    <div>Кликните по ячейке для деталей.</div>
</footer>

<script>
    const COLS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I'];
    const ROWS_COUNT = 30;

    let cellData = {};
    let selectedCell = 'A1';

    function getInitialData() {
        return {
            'A1': 'Категория', 'B1': 'Запланировано ($)', 'C1': 'Фактически ($)', 'D1': 'Отклонение ($)',
            'A2': 'Продукты', 'B2': '400', 'C2': '=СУММЕСЛИ(C18:C28; A2; D18:D28)', 'D2': '=C2-B2',
            'A3': 'Подписки и сервисы', 'B3': '30', 'C3': '=СУММЕСЛИ(C18:C28; A3; D18:D28)', 'D3': '=C3-B3',
            'A4': 'Развлечения и кафе', 'B4': '150', 'C4': '=СУММЕСЛИ(C18:C28; A4; D18:D28)', 'D4': '=C4-B4',
            'A5': 'Транспорт', 'B5': '80', 'C5': '=СУММЕСЛИ(C18:C28; A5; D18:D28)', 'D5': '=C5-B5',
            'A6': 'Итого', 'B6': '=СУММ(B2:B5)', 'C6': '=СУММ(C2:C5)', 'D6': '=СУММ(D2:D5)',

            'F1': 'Белый список сервисов', 'G1': 'Категория', 'H1': 'Ожидается ($)',
            'F2': 'Netflix', 'G2': 'Подписки и сервисы', 'H2': '15',
            'F3': 'Spotify', 'G3': 'Подписки и сервисы', 'H3': '10',
            'F4': 'Мобильная связь', 'G4': 'Подписки и сервисы', 'H4': '15',

            'A17': 'Дата', 'B17': 'Описание / Магазин', 'C17': 'Категория', 'D17': 'Сумма ($)', 'E17': 'Статус подписки',
            'A18': '01.10', 'B18': 'Супермаркет', 'C18': 'Продукты', 'D18': '65', 'E18': '=ЕСЛИ(C18="Подписки и сервисы"; ВПР(B18; F2:F10; 1); "ОК")',
            'A19': '02.10', 'B19': 'Кофейня', 'C19': 'Развлечения и кафе', 'D19': '5', 'E19': '=ЕСЛИ(C19="Подписки и сервисы"; ВПР(B19; F2:F10; 1); "ОК")',
            'A20': '04.10', 'B20': 'Cloud Storage', 'C20': 'Подписки и сервисы', 'D20': '8', 'E20': '=ЕСЛИ(C20="Подписки и сервисы"; ВПР(B20; F2:F10; 1); "ОК")',
            'A21': '05.10', 'B21': 'Netflix', 'C21': 'Подписки и сервисы', 'D21': '15', 'E21': '=ЕСЛИ(C21="Подписки и сервисы"; ВПР(B21; F2:F10; 1); "ОК")',
            'A22': '10.10', 'B22': 'Ресторан', 'C22': 'Развлечения и кафе', 'D22': '85', 'E22': '=ЕСЛИ(C22="Подписки и сервисы"; ВПР(B22; F2:F10; 1); "ОК")',
            'A23': '12.10', 'B23': 'Spotify', 'C23': 'Подписки и сервисы', 'D23': '10', 'E23': '=ЕСЛИ(C23="Подписки и сервисы"; ВПР(B23; F2:F10; 1); "ОК")',
            'A24': '15.10', 'B24': 'Игровой сервис', 'C24': 'Подписки и сервисы', 'D24': '15', 'E24': '=ЕСЛИ(C24="Подписки и сервисы"; ВПР(B24; F2:F10; 1); "ОК")',
            'A25': '18.10', 'B25': 'Заказ еды', 'C25': 'Продукты', 'D25': '95', 'E25': '=ЕСЛИ(C25="Подписки и сервисы"; ВПР(B25; F2:F10; 1); "ОК")',
            'A26': '20.10', 'B26': 'Мобильная связь', 'C26': 'Подписки и сервисы', 'D26': '15', 'E26': '=ЕСЛИ(C26="Подписки и сервисы"; ВПР(B26; F2:F10; 1); "ОК")',
            'A27': '22.10', 'B27': 'Такси', 'C27': 'Транспорт', 'D27': '35', 'E27': '=ЕСЛИ(C27="Подписки и сервисы"; ВПР(B27; F2:F10; 1); "ОК")',
            'A28': '25.10', 'B28': 'Кинотеатр', 'C28': 'Развлечения и кафе', 'D28': '40', 'E28': '=ЕСЛИ(C28="Подписки и сервисы"; ВПР(B28; F2:F10; 1); "ОК")'
        };
    }

    function init() {
        cellData = getInitialData();
        buildGrid();
        selectCell('E20');
        recalculate();
    }

    function resetSheet() {
        cellData = getInitialData();
        recalculate();
        selectCell('E20');
    }

    function buildGrid() {
        const grid = document.getElementById('excel-grid');
        grid.innerHTML = '';

        let headerRow = '<tr><th class="row-header"></th>';
        COLS.forEach(col => { headerRow += `<th class="col-header">${col}</th>`; });
        headerRow += '</tr>';
        grid.innerHTML += headerRow;

        for (let r = 1; r <= ROWS_COUNT; r++) {
            let rowHtml = `<tr><th class="row-header">${r}</th>`;
            COLS.forEach(col => {
                const cellId = `${col}${r}`;
                rowHtml += `<td id="cell-${cellId}" onclick="selectCell('${cellId}')"></td>`;
            });
            rowHtml += '</tr>';
            grid.innerHTML += rowHtml;
        }
    }

    function selectCell(id) {
        if (selectedCell) {
            const prev = document.getElementById(`cell-${selectedCell}`);
            if (prev) prev.classList.remove('selected');
        }

        selectedCell = id;
        const current = document.getElementById(`cell-${selectedCell}`);
        if (current) current.classList.add('selected');

        document.getElementById('active-cell-id').innerText = id;
        document.getElementById('formula-input').value = cellData[id] || '';

        updateHelper();
    }

    function liveUpdateFormulaInput() {
        const val = document.getElementById('formula-input').value;
        cellData[selectedCell] = val;
        recalculate();
        updateHelper();
    }

    function handleFormulaKey(e) {
        if (e.key === 'Enter') {
            recalculate();
            updateHelper();
        }
    }

    function updateHelper() {
        const cellId = selectedCell;
        const raw = cellData[cellId] || '';
        const computed = evaluateCell(cellId);

        document.getElementById('helper-cell-id').innerText = cellId;
        const helperText = document.getElementById('helper-text');

        if (String(computed).includes('УТЕЧКА')) {
            const rowNum = cellId.replace(/[A-Z]/g, '');
            const serviceName = evaluateCell(`B${rowNum}`);
            const sumVal = evaluateCell(`D${rowNum}`);
            helperText.innerHTML = `🚨 <strong style="color: #ef4444;">УТЕЧКА:</strong> Списание <strong>"${serviceName}"</strong> ($${sumVal}) отсутствует в Белом списке (F2:F10).`;
            return;
        }

        if (['D2', 'D3', 'D4', 'D5'].includes(cellId) && parseFloat(computed) > 0) {
            const catName = evaluateCell(`A${cellId.replace('D', '')}`);
            helperText.innerHTML = `⚠️ <strong style="color: #f59e0b;">ПЕРЕРАСХОД:</strong> Категория <strong>"${catName}"</strong> превышена на <strong>+$${computed}</strong>.`;
            return;
        }

        if (raw.startsWith('=')) {
            helperText.innerHTML = `Формула <span class="helper-code">${raw}</span> = <strong>${computed}</strong>.`;
        } else if (raw) {
            helperText.innerHTML = `Значение ячейки: <strong>"${raw}"</strong>.`;
        } else {
            helperText.innerHTML = `Пустая ячейка ${cellId}.`;
        }
    }

    function parseRange(rangeStr) {
        const parts = rangeStr.trim().split(':');
        if (parts.length === 1) return [parts[0]];

        const startCol = parts[0].charAt(0);
        const startRow = parseInt(parts[0].slice(1));
        const endCol = parts[1].charAt(0);
        const endRow = parseInt(parts[1].slice(1));

        let result = [];
        let colStartIdx = COLS.indexOf(startCol);
        let colEndIdx = COLS.indexOf(endCol);

        for (let c = colStartIdx; c <= colEndIdx; c++) {
            for (let r = startRow; r <= endRow; r++) {
                result.push(`${COLS[c]}${r}`);
            }
        }
        return result;
    }

    function evaluateCell(id) {
        const raw = cellData[id];
        if (!raw) return '';
        if (!raw.startsWith('=')) return raw;

        try {
            let expr = raw.substring(1).trim();

            if (expr.startsWith('СУММЕСЛИ')) {
                const inner = expr.match(/СУММЕСЛИ\((.*)\)/i)[1];
                const args = inner.split(';').map(s => s.trim());
                const condRange = parseRange(args[0]);
                let condition = args[1];
                if (cellData[condition] !== undefined || document.getElementById(`cell-${condition}`)) {
                    condition = evaluateCell(condition);
                } else {
                    condition = condition.replace(/^["']|["']$/g, '');
                }
                const sumRange = parseRange(args[2]);

                let sum = 0;
                condRange.forEach((cId, idx) => {
                    const val = evaluateCell(cId);
                    if (String(val).trim().toLowerCase() === String(condition).trim().toLowerCase()) {
                        const sumVal = parseFloat(evaluateCell(sumRange[idx])) || 0;
                        sum += sumVal;
                    }
                });
                return sum;
            }

            if (expr.startsWith('СУММ')) {
                const inner = expr.match(/СУММ\((.*)\)/i)[1];
                const range = parseRange(inner);
                let sum = 0;
                range.forEach(cId => { sum += parseFloat(evaluateCell(cId)) || 0; });
                return sum;
            }

            if (expr.startsWith('ВПР')) {
                const inner = expr.match(/ВПР\((.*)\)/i)[1];
                const args = inner.split(';').map(s => s.trim());
                let lookupVal = args[0];
                if (cellData[lookupVal] !== undefined || document.getElementById(`cell-${lookupVal}`)) {
                    lookupVal = evaluateCell(lookupVal);
                }

                const range = parseRange(args[1]);
                let found = false;
                range.forEach(cId => {
                    if (String(evaluateCell(cId)).trim().toLowerCase() === String(lookupVal).trim().toLowerCase()) {
                        found = true;
                    }
                });

                return found ? 'ОК' : '⚠️ УТЕЧКА';
            }

            if (expr.startsWith('ЕСЛИ')) {
                const inner = expr.match(/ЕСЛИ\((.*)\)/i)[1];
                const args = inner.split(';').map(s => s.trim());
                
                const condParts = args[0].split('=');
                let leftVal = condParts[0].trim();
                let rightVal = condParts[1].trim().replace(/^["']|["']$/g, '');

                if (cellData[leftVal] !== undefined || document.getElementById(`cell-${leftVal}`)) {
                    leftVal = evaluateCell(leftVal);
                }

                if (String(leftVal).trim() === String(rightVal).trim()) {
                    return evaluateExpr(args[1]);
                } else {
                    return evaluateExpr(args[2]);
                }
            }

            return evaluateExpr(expr);

        } catch (e) {
            return '#ОШИБКА!';
        }
    }

    function evaluateExpr(expr) {
        expr = expr.replace(/^["']|["']$/g, '');
        if (expr === 'ОК' || expr.includes('⚠️')) return expr;

        let parsedExpr = expr.replace(/([A-I][1-2][0-9]|[A-I][1-9])/g, (match) => {
            const val = evaluateCell(match);
            return isNaN(val) ? 0 : val;
        });

        try {
            return Function(`'use strict'; return (${parsedExpr})`)();
        } catch {
            return expr;
        }
    }

    function recalculate() {
        let leakCount = 0;
        let totalOverspend = 0;

        for (let r = 1; r <= ROWS_COUNT; r++) {
            COLS.forEach(col => {
                const id = `${col}${r}`;
                const cellTd = document.getElementById(`cell-${id}`);
                if (!cellTd) return;

                const computedValue = evaluateCell(id);
                cellTd.innerText = computedValue;

                cellTd.className = cellTd.classList.contains('selected') ? 'selected' : '';

                if (['A1', 'B1', 'C1', 'D1', 'F1', 'G1', 'H1', 'A17', 'B17', 'C17', 'D17', 'E17'].includes(id)) {
                    cellTd.classList.add('section-header');
                }

                if (['D2', 'D3', 'D4', 'D5'].includes(id)) {
                    const num = parseFloat(computedValue);
                    if (num > 0) {
                        cellTd.classList.add('cell-overspend');
                        totalOverspend += num;
                    }
                }

                if (col === 'E' && String(computedValue).includes('⚠️ УТЕЧКА')) {
                    cellTd.classList.add('cell-leak');
                    leakCount++;
                }
            });
        }

        document.getElementById('status-summary').innerHTML = `
            <strong>Анализ:</strong> Неучтенных подписок: <span style="color:#ef4444; font-weight:bold;">${leakCount}</span> | Перерасход: <span style="color:#f59e0b; font-weight:bold;">+$${totalOverspend}</span>
        `;
    }

    window.onload = init;
</script>
</body>
</html>
