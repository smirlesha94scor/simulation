<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симуляция Автовокзала с Пассажирами</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #viewport {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a2332;
            position: relative;
        }

        canvas {
            background-color: #1e293b;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
        }

        #sidebar {
            width: 440px;
            background-color: #0f172a;
            border-left: 1px solid #334155;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        h2 {
            color: #38bdf8;
            font-size: 1.2rem;
            margin-bottom: 2px;
        }

        .section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            margin-top: 4px;
            margin-bottom: 2px;
        }

        .clock-box {
            background: #1e293b;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .clock-time {
            font-size: 1.4rem;
            font-weight: bold;
            color: #38bdf8;
            font-family: monospace;
        }

        .announcement-banner {
            background-color: #f59e0b;
            color: #0f172a;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            display: none;
            box-shadow: 0 2px 10px rgba(245, 158, 11, 0.3);
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 9px 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.82rem;
            text-align: center;
        }

        .btn:hover {
            background-color: #0369a1;
        }

        .btn-secondary {
            background-color: #475569;
        }

        .btn-secondary:hover {
            background-color: #334155;
        }

        .btn-test {
            background-color: #eab308;
            color: #0f172a;
        }

        .btn-test:hover {
            background-color: #ca8a04;
        }

        .table-container {
            flex: 1;
            max-height: 460px;
            overflow-y: auto;
            border: 1px solid #334155;
            border-radius: 6px;
            background-color: #1e293b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
            text-align: left;
        }

        th {
            background-color: #0f172a;
            color: #38bdf8;
            padding: 8px 8px;
            position: sticky;
            top: 0;
            border-bottom: 1px solid #334155;
            font-weight: 600;
        }

        td {
            padding: 7px 8px;
            border-bottom: 1px solid #334155;
            color: #cbd5e1;
        }

        tr.active-trip td {
            background-color: rgba(56, 189, 248, 0.15);
            color: #ffffff;
        }

        .platform-badge {
            background-color: #22c55e;
            color: #0f172a;
            padding: 2px 5px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>

    <div id="viewport">
        <canvas id="simCanvas" width="900" height="750"></canvas>
    </div>

    <div id="sidebar">
        <h2>Автовокзал — Живое Табло</h2>

        <div class="clock-box">
            <div>
                <div style="font-size: 0.75rem; color: #94a3b8;">ИГРОВОЕ ВРЕМЯ</div>
                <div class="clock-time" id="clockDisplay">06:00</div>
            </div>
            <div style="display: flex; gap: 6px;">
                <button class="btn" id="btnTogglePlay" style="padding: 6px 12px;">Пауза</button>
                <button class="btn btn-secondary" id="btnSpeed" style="padding: 6px 10px;">x1</button>
            </div>
        </div>

        <div id="announcerBox" class="announcement-banner">
            📢 <span id="announcerText">Внимание! Объявляется посадка...</span>
        </div>

        <div class="btn-row">
            <button class="btn" id="btnGenerate">Обновить расписание</button>
            <button class="btn btn-test" id="btnTestFull">Тест: Все платформы</button>
        </div>

        <div class="section-title">Табло рейсов</div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Рейс / Направление</th>
                        <th>Платф.</th>
                        <th>Прибытие</th>
                        <th>Стоянка</th>
                        <th>Отправление</th>
                    </tr>
                </thead>
                <tbody id="scheduleBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        const MAP_PARAMS = {
            roadWidth: 98,
            roadStartY: 398,
            platformCenterY: 50,
            platformRadius: 325,
            ringThickness: 110,
            platformCount: 5,
            arcSpread: 140,
            arcRotation: 0,
            stationWidth: 259,
            stationHeight: 117,
            stationY: 58,
            platforms: [
                { angle: 5, offset: -19 },
                { angle: 5, offset: -25 },
                { angle: 0, offset: -22 },
                { angle: -5, offset: -25 },
                { angle: -5, offset: -18 }
            ]
        };

        const pathRoutes = {
            in: [
                [[474, 692], [474, 384], [559, 365], [619, 339], [657, 308], [688, 281]],
                [[472, 692], [470, 389], [525, 378], [573, 362], [588, 336], [592, 307]],
                [[474, 692], [473, 400], [458, 366]],
                [[476, 692], [472, 353], [427, 349], [391, 340], [341, 327], [311, 304]],
                [[473, 692], [472, 344], [421, 342], [375, 334], [329, 318], [284, 293], [214, 221]]
            ],
            out: [
                [[691, 209], [675, 240], [611, 298], [511, 338], [426, 347], [425, 692]],
                [[592, 315], [564, 330], [527, 345], [479, 355], [426, 360], [423, 692]],
                [[451, 360], [425, 390], [423, 691]],
                [[311, 360], [352, 375], [425, 390], [427, 692]],
                [[217, 286], [241, 313], [285, 342], [348, 367], [425, 389], [426, 691]]
            ]
        };

        const busColors = ['#38bdf8', '#f59e0b', '#10b981', '#ec4899', '#8b5cf6'];
        const destinations = ["№502 Областной центр", "№124 Заречное", "№310 Пригородное", "№715 Северный", "№208 Мельницы", "№441 Каменка", "№112 Степное", "№630 Южный", "№225 Лесное"];

        let schedule = [];
        let passengers = [];
        let gameTimeMinutes = 6 * 60;
        let isPlaying = true;
        let timeSpeed = 1;
        let isTestMode = false;

        const TOP_ENTRANCE = { x: 450, y: 58 };
        const TICKET_BOX = { x: 450, y: 85 };
        const WAITING_AREA = { x: 410, y: 110 };
        const BOTTOM_EXIT = { x: 450, y: 58 + 117 };

        function getPlatformCoords(idx) {
            const CENTER_X = canvas.width / 2;
            const innerRadius = Math.max(10, MAP_PARAMS.platformRadius - MAP_PARAMS.ringThickness / 2);
            const spreadRad = (MAP_PARAMS.arcSpread * Math.PI) / 180;
            const rotationRad = (MAP_PARAMS.arcRotation * Math.PI) / 180;
            const baseCenterAngle = Math.PI * 0.5;
            const startAngle = baseCenterAngle - spreadRad / 2 + rotationRad;
            const endAngle = baseCenterAngle + spreadRad / 2 + rotationRad;

            let angle = startAngle + (idx / (MAP_PARAMS.platformCount - 1)) * (endAngle - startAngle);
            const custom = MAP_PARAMS.platforms[idx];
            const placementRadius = innerRadius + custom.offset;

            return {
                x: CENTER_X + Math.cos(angle) * placementRadius,
                y: MAP_PARAMS.platformCenterY + Math.sin(angle) * placementRadius,
                customAngleRad: (custom.angle * Math.PI) / 180,
                angle: angle
            };
        }

        // Позиционирование пассажиров строго СПРАВА от платформы без наложения
        function getDistributedCrowdCoords(idx, personIndex, totalPersons) {
            const pos = getPlatformCoords(idx);
            
            const platAngle = pos.customAngleRad + Math.PI / 2;
            const rightVectorX = Math.cos(platAngle);
            const rightVectorY = Math.sin(platAngle);
            const forwardVectorX = -Math.sin(platAngle);
            const forwardVectorY = Math.cos(platAngle);

            const rowSideOffset = 22 + (personIndex % 3) * 7;
            const forwardOffset = (Math.floor(personIndex / 3) / (totalPersons / 3) - 0.5) * 40;

            return {
                x: pos.x + rightVectorX * rowSideOffset + forwardVectorX * forwardOffset + (Math.random() * 4 - 2),
                y: pos.y + rightVectorY * rowSideOffset + forwardVectorY * forwardOffset + (Math.random() * 4 - 2)
            };
        }

        function generateSchedule() {
            isTestMode = false;
            schedule = [];
            passengers = [];
            let currentTime = Math.floor(gameTimeMinutes);
            let platformFreeTime = [0, 0, 0, 0, 0];
            let lastArrivalAnyPlatform = currentTime - 10;
            let lastUsedPlatform = -1;

            for (let i = 1; i <= 14; i++) {
                let platformIdx;
                do {
                    platformIdx = Math.floor(Math.random() * MAP_PARAMS.platformCount);
                } while (platformIdx === lastUsedPlatform);

                lastUsedPlatform = platformIdx;

                let dwellTime = Math.floor(Math.random() * 11) + 10;
                let minArrByPlatform = platformFreeTime[platformIdx] + 30;
                let randomRoadGap = Math.floor(Math.random() * 11) + 5; 
                let minArrByRoad = lastArrivalAnyPlatform + randomRoadGap;

                let arrivalTime = Math.max(currentTime, minArrByPlatform, minArrByRoad);
                let departureTime = arrivalTime + dwellTime;

                platformFreeTime[platformIdx] = departureTime;
                lastArrivalAnyPlatform = arrivalTime;
                currentTime = arrivalTime;

                let trip = {
                    id: Date.now() + i,
                    busName: destinations[Math.floor(Math.random() * destinations.length)],
                    platform: platformIdx,
                    arrivalTime: arrivalTime,
                    dwellTime: dwellTime,
                    departureTime: departureTime,
                    color: busColors[(i - 1) % busColors.length],
                    announced: false
                };

                schedule.push(trip);

                let passCount = Math.floor(Math.random() * 3) + 3;
                for (let p = 0; p < passCount; p++) {
                    let isAdvanceBuyer = Math.random() < 0.35;
                    passengers.push({
                        id: `p_${trip.id}_${p}`,
                        tripId: trip.id,
                        platform: trip.platform,
                        arrivalTime: trip.arrivalTime,
                        isAdvanceBuyer: isAdvanceBuyer,
                        state: isAdvanceBuyer ? 'buying_advance' : 'waiting_in_hall',
                        x: TOP_ENTRANCE.x + (Math.random() * 40 - 20),
                        y: TOP_ENTRANCE.y - 35 - (Math.random() * 20),
                        targetX: TICKET_BOX.x + (Math.random() * 30 - 15),
                        targetY: TICKET_BOX.y + (Math.random() * 10 - 5),
                        speed: 1.2 + Math.random() * 0.5,
                        color: ['#e2e8f0', '#f43f5e', '#a855f7', '#06b6d4', '#f97316'][p % 5]
                    });
                }
            }
            renderScheduleTable();
        }

        function runTestAllPlatforms() {
            isTestMode = true;
            schedule = [];
            passengers = [];
            let currentTime = Math.floor(gameTimeMinutes);

            for (let i = 0; i < MAP_PARAMS.platformCount; i++) {
                let trip = {
                    id: Date.now() + i + 1,
                    busName: destinations[i % destinations.length],
                    platform: i,
                    arrivalTime: currentTime - 2,
                    dwellTime: 200,
                    departureTime: currentTime + 200,
                    color: busColors[i % busColors.length],
                    announced: true
                };
                schedule.push(trip);

                for (let p = 0; p < 30; p++) {
                    const crowdPos = getDistributedCrowdCoords(i, p, 30);
                    passengers.push({
                        id: `test_p_${i}_${p}`,
                        tripId: trip.id,
                        platform: i,
                        arrivalTime: trip.arrivalTime,
                        isAdvanceBuyer: false,
                        state: 'waiting_on_platform_crowd',
                        x: crowdPos.x,
                        y: crowdPos.y,
                        targetX: crowdPos.x,
                        targetY: crowdPos.y,
                        speed: 1.2 + Math.random() * 0.5,
                        color: ['#e2e8f0', '#f43f5e', '#a855f7', '#06b6d4', '#f97316'][p % 5]
                    });
                }
            }

            playAnnouncement("ТЕСТ: Все платформы заняты, 30 пассажиров стоят СПРАВА от каждой платформы!");
            renderScheduleTable();
        }

        function formatTime(totalMinutes) {
            const hrs = Math.floor(totalMinutes / 60) % 24;
            const mins = Math.floor(totalMinutes % 60);
            return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;
        }

        function playAnnouncement(text) {
            const announcerBox = document.getElementById('announcerBox');
            const announcerText = document.getElementById('announcerText');
            announcerText.textContent = text;
            announcerBox.style.display = 'block';

            setTimeout(() => {
                announcerBox.style.display = 'none';
            }, 6000);
        }

        function renderScheduleTable() {
            const tbody = document.getElementById('scheduleBody');
            tbody.innerHTML = '';

            schedule.forEach(item => {
                const tr = document.createElement('tr');
                tr.id = `trip-row-${item.id}`;
                tr.innerHTML = `
                    <td><b>${item.busName}</b></td>
                    <td><span class="platform-badge">П-${item.platform + 1}</span></td>
                    <td>${formatTime(item.arrivalTime)}</td>
                    <td>${item.dwellTime} мин</td>
                    <td><b>${formatTime(item.departureTime)}</b></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function moveTowards(p, tx, ty) {
            let dx = tx - p.x;
            let dy = ty - p.y;
            let dist = Math.hypot(dx, dy);
            if (dist < p.speed) {
                p.x = tx;
                p.y = ty;
                return true;
            }
            p.x += (dx / dist) * p.speed;
            p.y += (dy / dist) * p.speed;
            return false;
        }

        function updateSimulation(dt) {
            if (!isPlaying) return;

            gameTimeMinutes += (dt / 1000) * (1 / 5) * timeSpeed;
            if (gameTimeMinutes >= 24 * 60) gameTimeMinutes = 6 * 60;

            document.getElementById('clockDisplay').textContent = formatTime(gameTimeMinutes);

            if (!isTestMode) {
                schedule.forEach(trip => {
                    let timeUntilArrival = trip.arrivalTime - gameTimeMinutes;

                    if (timeUntilArrival <= 10 && timeUntilArrival > 0 && !trip.announced) {
                        trip.announced = true;
                        playAnnouncement(`Внимание! Рейс ${trip.busName} прибывает на платформу №${trip.platform + 1} через 10 минут. Просим пассажиров пройти на посадку.`);

                        let hallPassengers = passengers.filter(p => p.tripId === trip.id && p.state === 'waiting_in_hall');
                        hallPassengers.forEach((p, idx) => {
                            p.state = 'leaving_building_bottom';
                            const crowdPos = getDistributedCrowdCoords(p.platform, idx, Math.max(1, hallPassengers.length));
                            p.targetX = crowdPos.x;
                            p.targetY = crowdPos.y;
                        });
                    }
                });
            }

            passengers.forEach(p => {
                if (p.isAdvanceBuyer && p.state === 'waiting_at_home') {
                    if (p.arrivalTime - gameTimeMinutes <= 15) {
                        p.state = 'leaving_building_bottom';
                        p.x = TOP_ENTRANCE.x + (Math.random() * 20 - 10);
                        p.y = TOP_ENTRANCE.y - 20;
                        p.targetX = BOTTOM_EXIT.x + (Math.random() * 20 - 10);
                        p.targetY = BOTTOM_EXIT.y + 10;
                    }
                }
            });

            passengers.forEach(p => {
                if (p.state === 'buying_advance') {
                    if (moveTowards(p, p.targetX, p.targetY)) {
                        p.state = 'going_home';
                        p.targetX = TOP_ENTRANCE.x + (Math.random() * 20 - 10);
                        p.targetY = TOP_ENTRANCE.y - 40;
                    }
                }
                else if (p.state === 'going_home') {
                    if (moveTowards(p, p.targetX, p.targetY)) {
                        p.state = 'waiting_at_home';
                    }
                }
                else if (p.state === 'waiting_in_hall') {
                    if (!p.hallSeat) {
                        p.targetX = WAITING_AREA.x + (Math.random() * 60 - 30);
                        p.targetY = WAITING_AREA.y + (Math.random() * 20 - 10);
                        p.hallSeat = true;
                    }
                    moveTowards(p, p.targetX, p.targetY);
                }
                else if (p.state === 'leaving_building_bottom') {
                    if (moveTowards(p, p.targetX, p.targetY)) {
                        p.state = 'waiting_on_platform_crowd';
                    }
                }
                else if (p.state === 'waiting_on_platform_crowd') {
                    moveTowards(p, p.targetX, p.targetY);

                    if (!isTestMode) {
                        let trip = schedule.find(s => s.id === p.tripId);
                        if (trip && gameTimeMinutes >= trip.arrivalTime && gameTimeMinutes <= trip.departureTime) {
                            p.state = 'boarding';
                        }
                    }
                }
                else if (p.state === 'boarding') {
                    let platPos = getPlatformCoords(p.platform);
                    if (moveTowards(p, platPos.x, platPos.y)) {
                        p.state = 'done';
                    }
                }
            });

            const travelDuration = 1.5;
            const initialLength = schedule.length;
            
            schedule = schedule.filter(trip => {
                return gameTimeMinutes < trip.departureTime + travelDuration;
            });

            if (schedule.length !== initialLength) {
                renderScheduleTable();
            }

            if (schedule.length === 0 && !isTestMode) {
                generateSchedule();
            }
        }

        function getPointOnPath(points, progress) {
            if (!points || points.length === 0) return null;
            let pts = points.map(p => ({x: p[0], y: p[1]}));
            if (pts.length === 1) return pts[0];

            let totalLen = 0;
            let segments = [];
            for (let i = 0; i < pts.length - 1; i++) {
                let d = Math.hypot(pts[i+1].x - pts[i].x, pts[i+1].y - pts[i].y);
                segments.push({ p1: pts[i], p2: pts[i+1], len: d });
                totalLen += d;
            }

            if (totalLen === 0) return pts[0];
            let targetDist = progress * totalLen;
            let currentDist = 0;

            for (let seg of segments) {
                if (currentDist + seg.len >= targetDist) {
                    let t = (targetDist - currentDist) / seg.len;
                    let x = seg.p1.x + (seg.p2.x - seg.p1.x) * t;
                    let y = seg.p1.y + (seg.p2.y - seg.p1.y) * t;
                    let angle = Math.atan2(seg.p2.y - seg.p1.y, seg.p2.x - seg.p1.x);
                    return { x, y, angle };
                }
                currentDist += seg.len;
            }
            return pts[pts.length - 1];
        }

        function drawMap() {
            const CENTER_X = canvas.width / 2;

            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#334155';
            ctx.fillRect(CENTER_X - MAP_PARAMS.roadWidth / 2, MAP_PARAMS.roadStartY, MAP_PARAMS.roadWidth, canvas.height - MAP_PARAMS.roadStartY);

            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2;
            ctx.setLineDash([12, 12]);
            ctx.beginPath();
            ctx.moveTo(CENTER_X, MAP_PARAMS.roadStartY + 10);
            ctx.lineTo(CENTER_X, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            const innerRadius = Math.max(10, MAP_PARAMS.platformRadius - MAP_PARAMS.ringThickness / 2);

            ctx.beginPath();
            ctx.arc(CENTER_X, MAP_PARAMS.platformCenterY, MAP_PARAMS.platformRadius, 0, Math.PI);
            ctx.lineWidth = MAP_PARAMS.ringThickness;
            ctx.strokeStyle = '#334155';
            ctx.lineCap = 'butt';
            ctx.stroke();

            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(CENTER_X, MAP_PARAMS.platformCenterY, innerRadius, 0, Math.PI);
            ctx.fill();

            const spreadRad = (MAP_PARAMS.arcSpread * Math.PI) / 180;
            const rotationRad = (MAP_PARAMS.arcRotation * Math.PI) / 180;
            const baseCenterAngle = Math.PI * 0.5;
            const startAngle = baseCenterAngle - spreadRad / 2 + rotationRad;
            const endAngle = baseCenterAngle + spreadRad / 2 + rotationRad;

            for (let i = 0; i < MAP_PARAMS.platformCount; i++) {
                let angle = startAngle + (i / (MAP_PARAMS.platformCount - 1)) * (endAngle - startAngle);
                const custom = MAP_PARAMS.platforms[i];
                const placementRadius = innerRadius + custom.offset;

                const pX = CENTER_X + Math.cos(angle) * placementRadius;
                const pY = MAP_PARAMS.platformCenterY + Math.sin(angle) * placementRadius;

                ctx.save();
                ctx.translate(pX, pY);
                ctx.rotate((custom.angle * Math.PI) / 180);

                ctx.fillStyle = '#22c55e';
                ctx.fillRect(-12, -22, 24, 44);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.strokeRect(-12, -22, 24, 44);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`П-${i + 1}`, 0, 4);

                ctx.restore();
            }

            const stationX = CENTER_X - MAP_PARAMS.stationWidth / 2;
            ctx.fillStyle = '#0284c7';
            ctx.beginPath();
            ctx.roundRect(stationX, MAP_PARAMS.stationY, MAP_PARAMS.stationWidth, MAP_PARAMS.stationHeight, 10);
            ctx.fill();

            ctx.fillStyle = '#0369a1';
            ctx.fillRect(TICKET_BOX.x - 20, TICKET_BOX.y - 12, 40, 10);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 9px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('КАССА', TICKET_BOX.x, TICKET_BOX.y - 14);

            ctx.fillStyle = '#1e293b';
            ctx.fillRect(WAITING_AREA.x - 40, WAITING_AREA.y - 10, 80, 20);
            ctx.fillStyle = '#94a3b8';
            ctx.fillText('ЗАЛ ОЖИДАНИЯ', WAITING_AREA.x, WAITING_AREA.y + 4);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 14px sans-serif';
            ctx.fillText('АВТОВОКЗАЛ', CENTER_X, MAP_PARAMS.stationY + MAP_PARAMS.stationHeight - 10);

            passengers.forEach(p => {
                if (p.state !== 'done' && p.state !== 'waiting_at_home') {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            });

            schedule.forEach(trip => {
                const rowEl = document.getElementById(`trip-row-${trip.id}`);
                const pIdx = trip.platform;
                
                const travelDuration = 1.5;
                const arrTime = trip.arrivalTime;
                const depTime = trip.departureTime;
                const startDriveIn = arrTime - travelDuration;
                const endDriveOut = depTime + travelDuration;

                if (gameTimeMinutes >= startDriveIn && gameTimeMinutes <= endDriveOut) {
                    if (rowEl) rowEl.classList.add('active-trip');

                    let busPos = null;
                    let isParked = false;

                    if (gameTimeMinutes < arrTime) {
                        let progress = (gameTimeMinutes - startDriveIn) / travelDuration;
                        let inPoints = [...pathRoutes.in[pIdx]];
                        let platInfo = getPlatformCoords(pIdx);
                        inPoints.push([platInfo.x, platInfo.y]);
                        busPos = getPointOnPath(inPoints, progress);
                    } 
                    else if (gameTimeMinutes <= depTime) {
                        isParked = true;
                    } 
                    else {
                        let progress = (gameTimeMinutes - depTime) / travelDuration;
                        let platInfo = getPlatformCoords(pIdx);
                        let outPoints = [[platInfo.x, platInfo.y], ...pathRoutes.out[pIdx]];
                        busPos = getPointOnPath(outPoints, progress);
                    }

                    ctx.save();
                    if (isParked) {
                        let platInfo = getPlatformCoords(pIdx);
                        ctx.translate(platInfo.x, platInfo.y);
                        ctx.rotate(platInfo.customAngleRad);
                    } else if (busPos) {
                        ctx.translate(busPos.x, busPos.y);
                        ctx.rotate(busPos.angle + Math.PI / 2);
                    }

                    ctx.fillStyle = trip.color;
                    ctx.beginPath();
                    ctx.roundRect(-10, -18, 20, 36, 5);
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    ctx.fillStyle = '#0f172a';
                    ctx.fillRect(-7, -14, 14, 8);

                    ctx.restore();
                } else {
                    if (rowEl) rowEl.classList.remove('active-trip');
                }
            });
        }

        document.getElementById('btnGenerate').addEventListener('click', generateSchedule);
        document.getElementById('btnTestFull').addEventListener('click', runTestAllPlatforms);

        const btnTogglePlay = document.getElementById('btnTogglePlay');
        btnTogglePlay.addEventListener('click', () => {
            isPlaying = !isPlaying;
            btnTogglePlay.textContent = isPlaying ? 'Пауза' : 'Старт';
            btnTogglePlay.style.backgroundColor = isPlaying ? '#0284c7' : '#10b981';
        });

        const btnSpeed = document.getElementById('btnSpeed');
        let speedModes = [0.2, 0.5, 1, 2, 5];
        let speedIdx = 2;
        btnSpeed.addEventListener('click', () => {
            speedIdx = (speedIdx + 1) % speedModes.length;
            timeSpeed = speedModes[speedIdx];
            btnSpeed.textContent = `x${timeSpeed}`;
        });

        let lastTime = performance.now();
        function mainLoop(now) {
            let dt = now - lastTime;
            lastTime = now;

            updateSimulation(dt);
            drawMap();
            requestAnimationFrame(mainLoop);
        }

        generateSchedule();
        requestAnimationFrame(mainLoop);
    </script>
</body>
</html>
