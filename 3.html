<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симуляция Автовокзала — Расписание</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #viewport {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a2332;
            position: relative;
        }

        canvas {
            background-color: #1e293b;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
        }

        #sidebar {
            width: 420px;
            background-color: #0f172a;
            border-left: 1px solid #334155;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
        }

        h2 {
            color: #38bdf8;
            font-size: 1.2rem;
            margin-bottom: 2px;
        }

        .section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            margin-top: 6px;
            margin-bottom: 2px;
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.85rem;
            text-align: center;
        }

        .btn:hover {
            background-color: #0369a1;
        }

        .table-container {
            flex: 1;
            max-height: 480px;
            overflow-y: auto;
            border: 1px solid #334155;
            border-radius: 6px;
            background-color: #1e293b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            text-align: left;
        }

        th {
            background-color: #0f172a;
            color: #38bdf8;
            padding: 8px 10px;
            position: sticky;
            top: 0;
            border-bottom: 1px solid #334155;
            font-weight: 600;
        }

        td {
            padding: 8px 10px;
            border-bottom: 1px solid #334155;
            color: #cbd5e1;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #334155;
        }

        .platform-badge {
            background-color: #22c55e;
            color: #0f172a;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.75rem;
        }

        .hint-box {
            font-size: 0.75rem;
            color: #94a3b8;
            background: #1e293b;
            padding: 8px;
            border-radius: 6px;
            border-left: 3px solid #38bdf8;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div id="viewport">
        <canvas id="simCanvas" width="900" height="750"></canvas>
    </div>

    <div id="sidebar">
        <h2>Расписание Автовокзала</h2>

        <div class="hint-box">
            • Перерыв на платформе: <b>мин. 10 мин</b><br>
            • Разница прибытий на любые платформы: <b>мин. 3–5 мин</b><br>
            • Время стоянки: <b>10–20 мин</b>
        </div>

        <div class="btn-row">
            <button class="btn" id="btnGenerate">Сгенерировать расписание</button>
        </div>

        <div class="section-title">График движения рейсов</div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Рейс</th>
                        <th>Платф.</th>
                        <th>Прибытие</th>
                        <th>Стоянка</th>
                        <th>Отправление</th>
                    </tr>
                </thead>
                <tbody id="scheduleBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // Фиксированная геометрия карты
        const MAP_PARAMS = {
            roadWidth: 98,
            roadStartY: 398,
            platformCenterY: 50,
            platformRadius: 315,
            ringThickness: 76,
            platformCount: 5,
            arcSpread: 140,
            arcRotation: 0,
            stationWidth: 259,
            stationHeight: 117,
            stationY: 58,
            platforms: [
                { angle: 5, offset: -19 },
                { angle: 5, offset: -25 },
                { angle: 0, offset: -22 },
                { angle: -5, offset: -25 },
                { angle: -5, offset: -18 }
            ]
        };

        const MIN_PLATFORM_BUFFER = 10; // Минимальный перерыв на платформе (мин)
        const MIN_ARRIVAL_GAP = 3;       // Мин. разница во времени прибытия разных автобусов (мин)
        const TOTAL_TRIPS = 15;          // Количество рейсов для генерации

        let schedule = [];

        // Форматирование минут в формат ЧЧ:ММ
        function formatTime(totalMinutes) {
            const hrs = Math.floor(totalMinutes / 60) % 24;
            const mins = totalMinutes % 60;
            return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;
        }

        // Логика автоматического формирования расписания без конфликтов
        function generateSchedule() {
            schedule = [];
            let currentTime = 6 * 60 + 0; // Старт работы вокзала в 06:00
            
            // Время освобождения каждой из 5 платформ (в минутах)
            let platformFreeTime = [0, 0, 0, 0, 0];
            let lastArrivalAnyPlatform = -MIN_ARRIVAL_GAP;

            for (let i = 1; i <= TOTAL_TRIPS; i++) {
                // Выбираем платформу случайным образом или по очереди
                let platformIdx = Math.floor(Math.random() * MAP_PARAMS.platformCount);

                // Случайная стоянка от 10 до 20 минут
                let dwellTime = Math.floor(Math.random() * 11) + 10; 

                // Рассчитываем самое раннее возможное время прибытия на выбранную платформу
                let minArrByPlatform = platformFreeTime[platformIdx] + MIN_PLATFORM_BUFFER;
                let minArrByRoad = lastArrivalAnyPlatform + MIN_ARRIVAL_GAP;

                let arrivalTime = Math.max(currentTime, minArrByPlatform, minArrByRoad);
                
                // Случайная небольшая добавка от 0 до 4 минут для естественности графика
                arrivalTime += Math.floor(Math.random() * 5);

                let departureTime = arrivalTime + dwellTime;

                // Обновляем ограничения времени
                platformFreeTime[platformIdx] = departureTime;
                lastArrivalAnyPlatform = arrivalTime;
                currentTime = arrivalTime;

                schedule.push({
                    id: i,
                    busName: `№ ${100 + i * 5}`,
                    platform: platformIdx + 1,
                    arrivalTime: arrivalTime,
                    dwellTime: dwellTime,
                    departureTime: departureTime
                });
            }

            renderSchedule();
        }

        function renderSchedule() {
            const tbody = document.getElementById('scheduleBody');
            tbody.innerHTML = '';

            schedule.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${item.busName}</b></td>
                    <td><span class="platform-badge">П-${item.platform}</span></td>
                    <td>${formatTime(item.arrivalTime)}</td>
                    <td>${item.dwellTime} мин</td>
                    <td><b>${formatTime(item.departureTime)}</b></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function drawMap() {
            const CENTER_X = canvas.width / 2;

            // Фон
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Главная дорога
            ctx.fillStyle = '#334155';
            ctx.fillRect(CENTER_X - MAP_PARAMS.roadWidth / 2, MAP_PARAMS.roadStartY, MAP_PARAMS.roadWidth, canvas.height - MAP_PARAMS.roadStartY);

            // Разделительная линия
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2;
            ctx.setLineDash([12, 12]);
            ctx.beginPath();
            ctx.moveTo(CENTER_X, MAP_PARAMS.roadStartY + 10);
            ctx.lineTo(CENTER_X, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // Асфальт полукруга
            const innerRadius = Math.max(10, MAP_PARAMS.platformRadius - MAP_PARAMS.ringThickness / 2);

            ctx.beginPath();
            ctx.arc(CENTER_X, MAP_PARAMS.platformCenterY, MAP_PARAMS.platformRadius, 0, Math.PI);
            ctx.lineWidth = MAP_PARAMS.ringThickness;
            ctx.strokeStyle = '#334155';
            ctx.lineCap = 'butt';
            ctx.stroke();

            // Внутренний островок газона
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(CENTER_X, MAP_PARAMS.platformCenterY, innerRadius, 0, Math.PI);
            ctx.fill();

            // Платформы
            const spreadRad = (MAP_PARAMS.arcSpread * Math.PI) / 180;
            const rotationRad = (MAP_PARAMS.arcRotation * Math.PI) / 180;
            const baseCenterAngle = Math.PI * 0.5;
            const startAngle = baseCenterAngle - spreadRad / 2 + rotationRad;
            const endAngle = baseCenterAngle + spreadRad / 2 + rotationRad;

            for (let i = 0; i < MAP_PARAMS.platformCount; i++) {
                let angle = startAngle + (i / (MAP_PARAMS.platformCount - 1)) * (endAngle - startAngle);
                const custom = MAP_PARAMS.platforms[i];
                const placementRadius = innerRadius + custom.offset;

                const pX = CENTER_X + Math.cos(angle) * placementRadius;
                const pY = MAP_PARAMS.platformCenterY + Math.sin(angle) * placementRadius;

                ctx.save();
                ctx.translate(pX, pY);
                ctx.rotate((custom.angle * Math.PI) / 180);

                ctx.fillStyle = '#22c55e';
                ctx.fillRect(-12, -22, 24, 44);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.strokeRect(-12, -22, 24, 44);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`П-${i + 1}`, 0, 4);

                ctx.restore();
            }

            // Здание вокзала
            const stationX = CENTER_X - MAP_PARAMS.stationWidth / 2;
            ctx.fillStyle = '#0284c7';
            ctx.beginPath();
            ctx.roundRect(stationX, MAP_PARAMS.stationY, MAP_PARAMS.stationWidth, MAP_PARAMS.stationHeight, 10);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('АВТОВОКЗАЛ', CENTER_X, MAP_PARAMS.stationY + MAP_PARAMS.stationHeight / 2 + 6);
        }

        document.getElementById('btnGenerate').addEventListener('click', generateSchedule);

        // Инициализация при старте
        drawMap();
        generateSchedule();
    </script>
</body>
</html>
