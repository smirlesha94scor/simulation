<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симуляция Автовокзала — Конструктор платформ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #viewport {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a2332;
        }

        canvas {
            background-color: #1e293b;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
        }

        #controls {
            width: 360px;
            background-color: #0f172a;
            border-left: 1px solid #334155;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
        }

        h2 {
            color: #38bdf8;
            font-size: 1.2rem;
            margin-bottom: 2px;
        }

        .section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            margin-top: 6px;
            margin-bottom: 2px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 0.82rem;
            color: #cbd5e1;
            display: flex;
            justify-content: space-between;
        }

        span.val {
            color: #38bdf8;
            font-weight: bold;
        }

        input[type="range"], select {
            width: 100%;
            accent-color: #38bdf8;
            cursor: pointer;
        }

        select {
            background-color: #1e293b;
            color: #38bdf8;
            border: 1px solid #334155;
            padding: 6px;
            border-radius: 6px;
            font-weight: bold;
            outline: none;
        }

        .btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 6px;
        }

        .btn:hover {
            background-color: #0369a1;
        }

        textarea {
            width: 100%;
            height: 140px;
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #38bdf8;
            font-family: monospace;
            font-size: 0.75rem;
            padding: 8px;
            border-radius: 6px;
            resize: none;
            user-select: text;
        }

        .indiv-box {
            background: #1e293b;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div id="viewport">
        <canvas id="simCanvas" width="900" height="750"></canvas>
    </div>

    <div id="controls">
        <h2>Конструктор Автовокзала</h2>
        
        <div class="section-title">Геометрия</div>
        <div class="control-group">
            <label>Ширина дороги: <span class="val" id="val-roadWidth">98</span>px</label>
            <input type="range" id="param-roadWidth" min="40" max="200" value="98">
        </div>
        <div class="control-group">
            <label>Высота начала дороги: <span class="val" id="val-roadStartY">398</span>px</label>
            <input type="range" id="param-roadStartY" min="150" max="600" value="398">
        </div>

        <div class="section-title">Полукруг / Дорога</div>
        <div class="control-group">
            <label>Центр Y полукруга: <span class="val" id="val-platformCenterY">100</span>px</label>
            <input type="range" id="param-platformCenterY" min="50" max="450" value="100">
        </div>
        <div class="control-group">
            <label>Радиус полукруга: <span class="val" id="val-platformRadius">272</span>px</label>
            <input type="range" id="param-platformRadius" min="100" max="400" value="272">
        </div>
        <div class="control-group">
            <label>Толщина асфальта: <span class="val" id="val-ringThickness">80</span>px</label>
            <input type="range" id="param-ringThickness" min="40" max="140" value="80">
        </div>

        <div class="section-title">Общие параметры платформ</div>
        <div class="control-group">
            <label>Количество платформ: <span class="val" id="val-platformCount">5</span> шт</label>
            <input type="range" id="param-platformCount" min="2" max="10" value="5">
        </div>
        <div class="control-group">
            <label>Общий размах дуги: <span class="val" id="val-arcSpread">140</span>°</label>
            <input type="range" id="param-arcSpread" min="30" max="270" step="5" value="140">
        </div>
        <div class="control-group">
            <label>Поворот расстановки: <span class="val" id="val-arcRotation">0</span>°</label>
            <input type="range" id="param-arcRotation" min="-180" max="180" step="5" value="0">
        </div>

        <div class="section-title">Индивидуальная настройка платформ</div>
        <div class="indiv-box">
            <div class="control-group">
                <label>Выберите платформу:</label>
                <select id="selectPlatform"></select>
            </div>
            <div class="control-group">
                <label>Угол наклона: <span class="val" id="val-indivAngle">0</span>°</label>
                <input type="range" id="param-indivAngle" min="-180" max="180" step="5" value="0">
            </div>
            <div class="control-group">
                <label>Смещение от дуги: <span class="val" id="val-indivOffset">-22</span>px</label>
                <input type="range" id="param-indivOffset" min="-80" max="80" step="1" value="-22">
            </div>
        </div>

        <div class="section-title">Здание вокзала</div>
        <div class="control-group">
            <label>Ширина здания: <span class="val" id="val-stationWidth">259</span>px</label>
            <input type="range" id="param-stationWidth" min="140" max="400" value="259">
        </div>
        <div class="control-group">
            <label>Высота здания: <span class="val" id="val-stationHeight">117</span>px</label>
            <input type="range" id="param-stationHeight" min="50" max="180" value="117">
        </div>
        <div class="control-group">
            <label>Позиция Y здания: <span class="val" id="val-stationY">58</span>px</label>
            <input type="range" id="param-stationY" min="10" max="250" value="58">
        </div>

        <button class="btn" id="btnCopy">Скопировать конфиг для чата</button>
        <textarea id="configOutput" readonly></textarea>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        const params = {
            roadWidth: 98,
            roadStartY: 398,
            platformCenterY: 100,
            platformRadius: 272,
            ringThickness: 80,
            platformCount: 5,
            arcSpread: 140,
            arcRotation: 0,
            stationWidth: 259,
            stationHeight: 117,
            stationY: 58
        };

        let platformCustoms = [
            { angle: 5, offset: -19 },
            { angle: 5, offset: -25 },
            { angle: 0, offset: -22 },
            { angle: -5, offset: -25 },
            { angle: -5, offset: -18 },
            { angle: 0, offset: -22 },
            { angle: 0, offset: -22 },
            { angle: 0, offset: -22 },
            { angle: 0, offset: -22 },
            { angle: 0, offset: -22 }
        ];
        let selectedPlatformIndex = 0;

        const inputs = [
            'roadWidth', 'roadStartY', 'platformCenterY', 
            'platformRadius', 'ringThickness', 'platformCount',
            'arcSpread', 'arcRotation', 'stationWidth', 'stationHeight', 'stationY'
        ];

        inputs.forEach(key => {
            const el = document.getElementById(`param-${key}`);
            const valEl = document.getElementById(`val-${key}`);
            
            el.addEventListener('input', (e) => {
                params[key] = parseInt(e.target.value);
                valEl.innerText = params[key];
                
                if (key === 'platformCount') {
                    updatePlatformSelect();
                }

                drawMap();
                updateConfigText();
            });
        });

        const platformSelect = document.getElementById('selectPlatform');
        const indivAngleInput = document.getElementById('param-indivAngle');
        const indivOffsetInput = document.getElementById('param-indivOffset');
        const indivAngleVal = document.getElementById('val-indivAngle');
        const indivOffsetVal = document.getElementById('val-indivOffset');

        function updatePlatformSelect() {
            platformSelect.innerHTML = '';
            for (let i = 0; i < params.platformCount; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `Платформа П-${i + 1}`;
                platformSelect.appendChild(opt);
            }
            if (selectedPlatformIndex >= params.platformCount) {
                selectedPlatformIndex = 0;
            }
            platformSelect.value = selectedPlatformIndex;
            loadIndivUI();
        }

        function loadIndivUI() {
            const current = platformCustoms[selectedPlatformIndex];
            indivAngleInput.value = current.angle;
            indivOffsetInput.value = current.offset;
            indivAngleVal.innerText = current.angle;
            indivOffsetVal.innerText = current.offset;
        }

        platformSelect.addEventListener('change', (e) => {
            selectedPlatformIndex = parseInt(e.target.value);
            loadIndivUI();
            drawMap();
        });

        indivAngleInput.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            platformCustoms[selectedPlatformIndex].angle = val;
            indivAngleVal.innerText = val;
            drawMap();
            updateConfigText();
        });

        indivOffsetInput.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            platformCustoms[selectedPlatformIndex].offset = val;
            indivOffsetVal.innerText = val;
            drawMap();
            updateConfigText();
        });

        function updateConfigText() {
            let indivText = '';
            for (let i = 0; i < params.platformCount; i++) {
                indivText += `  - П-${i + 1}: Наклон=${platformCustoms[i].angle}°, Смещение=${platformCustoms[i].offset}px\n`;
            }

            const configStr = `Параметры геометрии и платформ:
- Ширина дороги: ${params.roadWidth}
- Высота начала дороги: ${params.roadStartY}
- Центр Y полукруга: ${params.platformCenterY}
- Радиус полукруга: ${params.platformRadius}
- Толщина асфальта: ${params.ringThickness}
- Количество платформ: ${params.platformCount}
- Размах дуги платформ: ${params.arcSpread}°
- Поворот дуги платформ: ${params.arcRotation}°
- Индивидуальные параметры платформ:
${indivText}- Ширина вокзала: ${params.stationWidth}
- Высота вокзала: ${params.stationHeight}
- Y вокзала: ${params.stationY}`;
            document.getElementById('configOutput').value = configStr;
        }

        function drawMap() {
            const CENTER_X = canvas.width / 2;

            // Фон
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Главная дорога
            ctx.fillStyle = '#334155';
            ctx.fillRect(CENTER_X - params.roadWidth / 2, params.roadStartY, params.roadWidth, canvas.height - params.roadStartY);

            // Разделительная линия
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2;
            ctx.setLineDash([12, 12]);
            ctx.beginPath();
            ctx.moveTo(CENTER_X, params.roadStartY + 10);
            ctx.lineTo(CENTER_X, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // Расчет радиусов асфальта
            const outerRadius = params.platformRadius + params.ringThickness / 2;
            const innerRadius = Math.max(10, params.platformRadius - params.ringThickness / 2);

            // Верхняя область за вокзалом закрашена в цвет фона (#1e293b)
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(CENTER_X - outerRadius, params.platformCenterY - outerRadius, outerRadius * 2, outerRadius);

            // Основная полукруглая дуга асфальта снизу (#334155)
            ctx.beginPath();
            ctx.arc(CENTER_X, params.platformCenterY, params.platformRadius, 0, Math.PI);
            ctx.lineWidth = params.ringThickness;
            ctx.strokeStyle = '#334155';
            ctx.lineCap = 'round';
            ctx.stroke();

            // Внутренний островок газона (полукруг)
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(CENTER_X, params.platformCenterY, innerRadius, 0, Math.PI);
            ctx.fill();

            // Отрисовка платформ по дуге
            const spreadRad = (params.arcSpread * Math.PI) / 180;
            const rotationRad = (params.arcRotation * Math.PI) / 180;

            const baseCenterAngle = Math.PI * 0.5; // Центр нижней дуги
            const startAngle = baseCenterAngle - spreadRad / 2 + rotationRad;
            const endAngle = baseCenterAngle + spreadRad / 2 + rotationRad;

            for (let i = 0; i < params.platformCount; i++) {
                let angle;
                if (params.platformCount === 1) {
                    angle = baseCenterAngle + rotationRad;
                } else {
                    angle = startAngle + (i / (params.platformCount - 1)) * (endAngle - startAngle);
                }

                const custom = platformCustoms[i];
                const placementRadius = innerRadius + custom.offset;

                const pX = CENTER_X + Math.cos(angle) * placementRadius;
                const pY = params.platformCenterY + Math.sin(angle) * placementRadius;

                ctx.save();
                ctx.translate(pX, pY);

                const customAngleRad = (custom.angle * Math.PI) / 180;
                ctx.rotate(customAngleRad);

                const isSelected = (i === selectedPlatformIndex);

                // Платформа
                ctx.fillStyle = isSelected ? '#38bdf8' : '#22c55e';
                ctx.fillRect(-12, -22, 24, 44);
                ctx.strokeStyle = isSelected ? '#f59e0b' : '#ffffff';
                ctx.lineWidth = isSelected ? 3 : 2;
                ctx.strokeRect(-12, -22, 24, 44);

                // Номер платформы
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`П-${i + 1}`, 0, 4);

                ctx.restore();
            }

            // Здание вокзала
            const stationX = CENTER_X - params.stationWidth / 2;
            ctx.fillStyle = '#0284c7';
            ctx.beginPath();
            ctx.roundRect(stationX, params.stationY, params.stationWidth, params.stationHeight, 10);
            ctx.fill();

            // Текст
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('АВТОВОКЗАЛ', CENTER_X, params.stationY + params.stationHeight / 2 + 6);
        }

        document.getElementById('btnCopy').addEventListener('click', () => {
            const textarea = document.getElementById('configOutput');
            textarea.select();
            navigator.clipboard.writeText(textarea.value);
            alert('Конфигурация скопирована!');
        });

        updatePlatformSelect();
        updateConfigText();
        drawMap();
    </script>
</body>
</html>
