<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симуляция Автовокзала — Редактор Траекторий</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #viewport {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a2332;
            position: relative;
        }

        canvas {
            background-color: #1e293b;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            cursor: crosshair;
        }

        #controls {
            width: 380px;
            background-color: #0f172a;
            border-left: 1px solid #334155;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
        }

        h2 {
            color: #38bdf8;
            font-size: 1.2rem;
            margin-bottom: 2px;
        }

        .section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            margin-top: 6px;
            margin-bottom: 2px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 0.82rem;
            color: #cbd5e1;
            display: flex;
            justify-content: space-between;
        }

        select, input[type="text"] {
            width: 100%;
            background-color: #1e293b;
            color: #38bdf8;
            border: 1px solid #334155;
            padding: 7px;
            border-radius: 6px;
            font-weight: bold;
            outline: none;
            font-size: 0.85rem;
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 9px 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.82rem;
            text-align: center;
        }

        .btn:hover {
            background-color: #0369a1;
        }

        .btn-toggle {
            background-color: #eab308;
            color: #0f172a;
        }

        .btn-toggle:hover {
            background-color: #ca8a04;
        }

        .btn-danger {
            background-color: #ef4444;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .btn-secondary {
            background-color: #475569;
        }

        .btn-secondary:hover {
            background-color: #334155;
        }

        textarea {
            width: 100%;
            height: 140px;
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #38bdf8;
            font-family: monospace;
            font-size: 0.72rem;
            padding: 8px;
            border-radius: 6px;
            resize: none;
            user-select: text;
        }

        .point-list {
            max-height: 160px;
            overflow-y: auto;
            border: 1px solid #334155;
            border-radius: 6px;
            background-color: #1e293b;
        }

        .point-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            font-size: 0.8rem;
            border-bottom: 1px solid #334155;
        }

        .point-item:last-child {
            border-bottom: none;
        }

        .del-pt {
            color: #f87171;
            cursor: pointer;
            font-weight: bold;
            padding: 0 4px;
        }

        .del-pt:hover {
            color: #ef4444;
        }

        .hint-box {
            font-size: 0.75rem;
            color: #94a3b8;
            background: #1e293b;
            padding: 8px;
            border-radius: 6px;
            border-left: 3px solid #38bdf8;
        }
    </style>
</head>
<body>

    <div id="viewport">
        <canvas id="simCanvas" width="900" height="750"></canvas>
    </div>

    <div id="controls">
        <h2>Маршруты Автобусов</h2>
        
        <div class="hint-box">
            Служебный ориентир (красный) автоматически сопрягается с выбранной платформой. Кликайте по Canvas, чтобы расставлять свои точки.
        </div>

        <div class="section-title">Ориентир</div>
        <button class="btn btn-toggle" id="btnToggleService">Скрыть служебный ориентир</button>

        <div class="section-title">Управление Путями</div>
        <div class="control-group">
            <label>Выберите активный путь:</label>
            <select id="selectPath"></select>
        </div>

        <div class="btn-row">
            <button class="btn" id="btnAddPath">+ Новый путь</button>
            <button class="btn btn-danger" id="btnDelPath">Удалить путь</button>
        </div>

        <div class="control-group">
            <label>Имя маршрута:</label>
            <input type="text" id="inputPathName" value="Маршрут к П-1">
        </div>

        <div class="control-group">
            <label>Привязка к платформе:</label>
            <select id="selectTargetPlatform">
                <option value="0">Платформа П-1</option>
                <option value="1">Платформа П-2</option>
                <option value="2">Платформа П-3</option>
                <option value="3">Платформа П-4</option>
                <option value="4">Платформа П-5</option>
            </select>
        </div>

        <div class="section-title">Точки пути (Waypoints)</div>
        <div class="point-list" id="pointList"></div>

        <div class="btn-row">
            <button class="btn btn-secondary" id="btnClearPoints">Очистить точки</button>
        </div>

        <div class="section-title">Экспорт конфигурации</div>
        <button class="btn" id="btnCopy">Скопировать конфиг для чата</button>
        <textarea id="configOutput" readonly></textarea>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // Фиксированная геометрия карты
        const MAP_PARAMS = {
            roadWidth: 98,
            roadStartY: 398,
            platformCenterY: 50,
            platformRadius: 315,
            ringThickness: 76,
            platformCount: 5,
            arcSpread: 140,
            arcRotation: 0,
            stationWidth: 259,
            stationHeight: 117,
            stationY: 58,
            platforms: [
                { angle: 5, offset: -19 },
                { angle: 5, offset: -25 },
                { angle: 0, offset: -22 },
                { angle: -5, offset: -25 },
                { angle: -5, offset: -18 }
            ]
        };

        // Пути по умолчанию
        let paths = [
            {
                name: 'Заезд на П-1',
                targetPlatform: 0,
                color: '#38bdf8',
                points: [
                    { x: 474, y: 720 },
                    { x: 474, y: 398 },
                    { x: 550, y: 340 },
                    { x: 670, y: 220 },
                    { x: 685, y: 155 }
                ]
            },
            {
                name: 'Заезд на П-3',
                targetPlatform: 2,
                color: '#10b981',
                points: [
                    { x: 474, y: 720 },
                    { x: 474, y: 398 },
                    { x: 450, y: 340 }
                ]
            }
        ];

        let selectedPathIndex = 0;
        let showServiceGuide = true;
        let draggingPoint = null;

        const selectPathEl = document.getElementById('selectPath');
        const inputPathNameEl = document.getElementById('inputPathName');
        const selectTargetPlatformEl = document.getElementById('selectTargetPlatform');
        const pointListEl = document.getElementById('pointList');
        const configOutputEl = document.getElementById('configOutput');
        const btnToggleServiceEl = document.getElementById('btnToggleService');

        function initUI() {
            renderPathSelect();
            renderPointList();
            updateConfigText();
            drawMap();
        }

        btnToggleServiceEl.addEventListener('click', () => {
            showServiceGuide = !showServiceGuide;
            btnToggleServiceEl.innerText = showServiceGuide ? 'Скрыть служебный ориентир' : 'Показать служебный ориентир';
            btnToggleServiceEl.classList.toggle('btn-secondary', !showServiceGuide);
            btnToggleServiceEl.classList.toggle('btn-toggle', showServiceGuide);
            drawMap();
        });

        function renderPathSelect() {
            selectPathEl.innerHTML = '';
            paths.forEach((p, i) => {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `🚌 ${p.name} (П-${p.targetPlatform + 1}) — ${p.points.length} т.`;
                selectPathEl.appendChild(opt);
            });
            selectPathEl.value = selectedPathIndex;
            if (paths[selectedPathIndex]) {
                inputPathNameEl.value = paths[selectedPathIndex].name;
                selectTargetPlatformEl.value = paths[selectedPathIndex].targetPlatform;
            }
        }

        function renderPointList() {
            pointListEl.innerHTML = '';
            const currentPath = paths[selectedPathIndex];
            if (!currentPath) return;

            currentPath.points.forEach((pt, i) => {
                const item = document.createElement('div');
                item.className = 'point-item';
                item.innerHTML = `
                    <span><b>#${i + 1}</b> (X: ${Math.round(pt.x)}, Y: ${Math.round(pt.y)})</span>
                    <span class="del-pt" data-index="${i}">✕</span>
                `;
                pointListEl.appendChild(item);
            });

            pointListEl.querySelectorAll('.del-pt').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = parseInt(e.target.getAttribute('data-index'));
                    currentPath.points.splice(idx, 1);
                    renderPointList();
                    renderPathSelect();
                    updateConfigText();
                    drawMap();
                });
            });
        }

        selectPathEl.addEventListener('change', (e) => {
            selectedPathIndex = parseInt(e.target.value);
            inputPathNameEl.value = paths[selectedPathIndex].name;
            selectTargetPlatformEl.value = paths[selectedPathIndex].targetPlatform;
            renderPointList();
            drawMap();
        });

        inputPathNameEl.addEventListener('input', (e) => {
            if (paths[selectedPathIndex]) {
                paths[selectedPathIndex].name = e.target.value;
                renderPathSelect();
                updateConfigText();
            }
        });

        selectTargetPlatformEl.addEventListener('change', (e) => {
            if (paths[selectedPathIndex]) {
                paths[selectedPathIndex].targetPlatform = parseInt(e.target.value);
                renderPathSelect();
                updateConfigText();
                drawMap();
            }
        });

        document.getElementById('btnAddPath').addEventListener('click', () => {
            const nextPlatformIndex = (paths.length) % MAP_PARAMS.platformCount;
            paths.push({
                name: `Маршрут к П-${nextPlatformIndex + 1}`,
                targetPlatform: nextPlatformIndex,
                color: getRandomColor(),
                points: []
            });
            selectedPathIndex = paths.length - 1;
            renderPathSelect();
            renderPointList();
            updateConfigText();
            drawMap();
        });

        document.getElementById('btnDelPath').addEventListener('click', () => {
            if (paths.length <= 1) {
                alert('Нельзя удалить единственный путь!');
                return;
            }
            paths.splice(selectedPathIndex, 1);
            selectedPathIndex = Math.max(0, selectedPathIndex - 1);
            renderPathSelect();
            renderPointList();
            updateConfigText();
            drawMap();
        });

        document.getElementById('btnClearPoints').addEventListener('click', () => {
            if (paths[selectedPathIndex]) {
                paths[selectedPathIndex].points = [];
                renderPointList();
                renderPathSelect();
                updateConfigText();
                drawMap();
            }
        });

        function getRandomColor() {
            const colors = ['#38bdf8', '#f59e0b', '#10b981', '#ec4899', '#8b5cf6', '#06b6d4', '#f97316'];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        // Вычисление динамической служебной траектории под выбранную платформу
        function getServiceGuidePoints(platformIdx) {
            const CENTER_X = canvas.width / 2;
            const innerRadius = Math.max(10, MAP_PARAMS.platformRadius - MAP_PARAMS.ringThickness / 2);
            
            const spreadRad = (MAP_PARAMS.arcSpread * Math.PI) / 180;
            const rotationRad = (MAP_PARAMS.arcRotation * Math.PI) / 180;
            const baseCenterAngle = Math.PI * 0.5;
            const startAngle = baseCenterAngle - spreadRad / 2 + rotationRad;
            const endAngle = baseCenterAngle + spreadRad / 2 + rotationRad;

            let angle = startAngle + (platformIdx / (MAP_PARAMS.platformCount - 1)) * (endAngle - startAngle);
            const custom = MAP_PARAMS.platforms[platformIdx];
            const placementRadius = innerRadius + custom.offset;

            const targetX = Math.round(CENTER_X + Math.cos(angle) * placementRadius);
            const targetY = Math.round(MAP_PARAMS.platformCenterY + Math.sin(angle) * placementRadius);

            // Формируем путь со въезда от нижней дороги до конкретной платформы
            const midX = Math.round(CENTER_X + Math.cos(angle) * (placementRadius * 0.7));
            const midY = Math.round(MAP_PARAMS.platformCenterY + Math.sin(angle) * (placementRadius * 0.7));

            return [
                { x: 474, y: 720 },
                { x: 474, y: MAP_PARAMS.roadStartY },
                { x: midX, y: Math.max(MAP_PARAMS.roadStartY - 60, midY) },
                { x: targetX, y: targetY }
            ];
        }

        // Клик и перетаскивание точек
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const currentPath = paths[selectedPathIndex];
            if (!currentPath) return;

            for (let i = 0; i < currentPath.points.length; i++) {
                const pt = currentPath.points[i];
                const dist = Math.hypot(pt.x - mouseX, pt.y - mouseY);
                if (dist <= 12) {
                    draggingPoint = pt;
                    return;
                }
            }

            currentPath.points.push({ x: mouseX, y: mouseY });
            renderPointList();
            renderPathSelect();
            updateConfigText();
            drawMap();
        });

        canvas.addEventListener('mousemove', (e) => {
            if (draggingPoint) {
                const rect = canvas.getBoundingClientRect();
                draggingPoint.x = Math.round(e.clientX - rect.left);
                draggingPoint.y = Math.round(e.clientY - rect.top);
                renderPointList();
                updateConfigText();
                drawMap();
            }
        });

        window.addEventListener('mouseup', () => {
            draggingPoint = null;
        });

        function updateConfigText() {
            let pathsFormatted = paths.map((p, idx) => {
                const pts = p.points.map(pt => `[${Math.round(pt.x)}, ${Math.round(pt.y)}]`).join(', ');
                return `  - Путь ${idx + 1} ("${p.name}", Платформа П-${p.targetPlatform + 1}): [${pts}]`;
            }).join('\n');

            const configStr = `Параметры геометрии карты:
- Ширина дороги: ${MAP_PARAMS.roadWidth}
- Высота начала дороги: ${MAP_PARAMS.roadStartY}
- Центр Y полукруга: ${MAP_PARAMS.platformCenterY}
- Радиус полукруга: ${MAP_PARAMS.platformRadius}
- Толщина асфальта: ${MAP_PARAMS.ringThickness}
- Количество платформ: ${MAP_PARAMS.platformCount}
- Размах дуги платформ: ${MAP_PARAMS.arcSpread}°
- Поворот дуги платформ: ${MAP_PARAMS.arcRotation}°
- Ширина вокзала: ${MAP_PARAMS.stationWidth}
- Высота вокзала: ${MAP_PARAMS.stationHeight}
- Y вокзала: ${MAP_PARAMS.stationY}

Траектории движения автобусов:
${pathsFormatted}`;

            configOutputEl.value = configStr;
        }

        function drawMap() {
            const CENTER_X = canvas.width / 2;

            // Фон
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Главная дорога
            ctx.fillStyle = '#334155';
            ctx.fillRect(CENTER_X - MAP_PARAMS.roadWidth / 2, MAP_PARAMS.roadStartY, MAP_PARAMS.roadWidth, canvas.height - MAP_PARAMS.roadStartY);

            // Разделительная линия
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2;
            ctx.setLineDash([12, 12]);
            ctx.beginPath();
            ctx.moveTo(CENTER_X, MAP_PARAMS.roadStartY + 10);
            ctx.lineTo(CENTER_X, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // Асфальт полукруга
            const outerRadius = MAP_PARAMS.platformRadius + MAP_PARAMS.ringThickness / 2;
            const innerRadius = Math.max(10, MAP_PARAMS.platformRadius - MAP_PARAMS.ringThickness / 2);

            ctx.beginPath();
            ctx.arc(CENTER_X, MAP_PARAMS.platformCenterY, MAP_PARAMS.platformRadius, 0, Math.PI);
            ctx.lineWidth = MAP_PARAMS.ringThickness;
            ctx.strokeStyle = '#334155';
            ctx.lineCap = 'butt';
            ctx.stroke();

            // Внутренний островок газона
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(CENTER_X, MAP_PARAMS.platformCenterY, innerRadius, 0, Math.PI);
            ctx.fill();

            // Платформы
            const spreadRad = (MAP_PARAMS.arcSpread * Math.PI) / 180;
            const rotationRad = (MAP_PARAMS.arcRotation * Math.PI) / 180;
            const baseCenterAngle = Math.PI * 0.5;
            const startAngle = baseCenterAngle - spreadRad / 2 + rotationRad;
            const endAngle = baseCenterAngle + spreadRad / 2 + rotationRad;

            const activePath = paths[selectedPathIndex];
            const currentTargetPlatform = activePath ? activePath.targetPlatform : 0;

            for (let i = 0; i < MAP_PARAMS.platformCount; i++) {
                let angle = startAngle + (i / (MAP_PARAMS.platformCount - 1)) * (endAngle - startAngle);
                const custom = MAP_PARAMS.platforms[i];
                const placementRadius = innerRadius + custom.offset;

                const pX = CENTER_X + Math.cos(angle) * placementRadius;
                const pY = MAP_PARAMS.platformCenterY + Math.sin(angle) * placementRadius;

                ctx.save();
                ctx.translate(pX, pY);
                ctx.rotate((custom.angle * Math.PI) / 180);

                const isTarget = (i === currentTargetPlatform);

                ctx.fillStyle = isTarget ? '#38bdf8' : '#22c55e';
                ctx.fillRect(-12, -22, 24, 44);
                ctx.strokeStyle = isTarget ? '#f59e0b' : '#ffffff';
                ctx.lineWidth = isTarget ? 3 : 2;
                ctx.strokeRect(-12, -22, 24, 44);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`П-${i + 1}`, 0, 4);

                ctx.restore();
            }

            // Здание вокзала
            const stationX = CENTER_X - MAP_PARAMS.stationWidth / 2;
            ctx.fillStyle = '#0284c7';
            ctx.beginPath();
            ctx.roundRect(stationX, MAP_PARAMS.stationY, MAP_PARAMS.stationWidth, MAP_PARAMS.stationHeight, 10);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('АВТОВОКЗАЛ', CENTER_X, MAP_PARAMS.stationY + MAP_PARAMS.stationHeight / 2 + 6);

            // Отрисовка динамического СЛУЖЕБНОГО ОРИЕНТИРА к активной платформе
            if (showServiceGuide && activePath) {
                const servicePts = getServiceGuidePoints(currentTargetPlatform);
                ctx.beginPath();
                ctx.moveTo(servicePts[0].x, servicePts[0].y);
                for (let i = 1; i < servicePts.length; i++) {
                    ctx.lineTo(servicePts[i].x, servicePts[i].y);
                }
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 6]);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Отрисовка активного пользовательского пути
            if (activePath && activePath.points.length > 0) {
                ctx.beginPath();
                ctx.moveTo(activePath.points[0].x, activePath.points[0].y);
                for (let i = 1; i < activePath.points.length; i++) {
                    ctx.lineTo(activePath.points[i].x, activePath.points[i].y);
                }

                ctx.strokeStyle = activePath.color || '#38bdf8';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Точки (Waypoints)
                activePath.points.forEach((pt, ptIdx) => {
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, 6, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.strokeStyle = activePath.color;
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 11px sans-serif';
                    ctx.fillText(ptIdx + 1, pt.x, pt.y - 10);
                });
            }
        }

        document.getElementById('btnCopy').addEventListener('click', () => {
            configOutputEl.select();
            navigator.clipboard.writeText(configOutputEl.value);
            alert('Конфигурация траекторий скопирована!');
        });

        initUI();
    </script>
</body>
</html>
