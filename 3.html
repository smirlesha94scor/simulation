<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Синтезатор речи на чистом JS</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 440px;
        }
        h2 { margin-top: 0; font-size: 20px; color: #2c3e50; text-align: center; }
        textarea {
            width: 100%;
            height: 110px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 15px;
            font-size: 14px;
        }
        label { display: block; font-size: 12px; color: #555; margin-bottom: 5px; }
        select, input[type="range"] {
            width: 100%;
            margin-bottom: 15px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .range-value { float: right; font-weight: bold; color: #3498db; }
        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background: #2980b9; }
        .status {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Синтезатор речи</h2>
    
    <label for="textInput">Введите текст:</label>
    <textarea id="textInput">Привет! Этот синтезатор работает стабильно, без ошибок и сторонних серверов.</textarea>
    
    <label for="voiceSelect">Голос:</label>
    <select id="voiceSelect"></select>

    <label for="volumeRange">Громкость: <span id="volumeVal" class="range-value">100%</span></label>
    <input type="range" id="volumeRange" min="0" max="100" value="100" step="1">

    <label for="rateRange">Скорость: <span id="rateVal" class="range-value">1.0</span></label>
    <input type="range" id="rateRange" min="0.5" max="2" value="1.0" step="0.1">

    <label for="pitchRange">Высота тона: <span id="pitchVal" class="range-value">1.0</span></label>
    <input type="range" id="pitchRange" min="0.5" max="1.5" value="1.0" step="0.1">

    <button id="speakBtn">Озвучить текст</button>
    <div id="status" class="status">Готов к работе</div>
</div>

<script>
    const synth = window.speechSynthesis;
    const textInput = document.getElementById('textInput');
    const voiceSelect = document.getElementById('voiceSelect');
    const volumeRange = document.getElementById('volumeRange');
    const rateRange = document.getElementById('rateRange');
    const pitchRange = document.getElementById('pitchRange');
    const speakBtn = document.getElementById('speakBtn');
    const statusDiv = document.getElementById('status');

    let voices = [];

    function loadVoices() {
        voices = synth.getVoices();
        voiceSelect.innerHTML = '';
        
        voices.forEach((voice, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = `${voice.name} (${voice.lang})`;
            voiceSelect.appendChild(option);
        });

        // Автовыбор русского голоса
        let bestVoiceIndex = voices.findIndex(v => 
            (v.lang.includes('ru') || v.lang.includes('RU')) && 
            (v.name.includes('Natural') || v.name.includes('Online') || v.name.includes('Google'))
        );
        if (bestVoiceIndex === -1) {
            bestVoiceIndex = voices.findIndex(v => v.lang.includes('ru') || v.lang.includes('RU'));
        }
        if (bestVoiceIndex !== -1) {
            voiceSelect.value = bestVoiceIndex;
        }
    }

    loadVoices();
    if (synth.onvoiceschanged !== undefined) {
        synth.onvoiceschanged = loadVoices;
    }

    volumeRange.oninput = () => document.getElementById('volumeVal').textContent = volumeRange.value + '%';
    rateRange.oninput = () => document.getElementById('rateVal').textContent = rateRange.value;
    pitchRange.oninput = () => document.getElementById('pitchVal').textContent = pitchRange.value;

    speakBtn.addEventListener('click', () => {
        if (synth.speaking) {
            synth.cancel();
        }

        const text = textInput.value.trim();
        if (!text) return;

        const utterance = new SpeechSynthesisUtterance(text);
        
        const selectedVoiceIndex = voiceSelect.value;
        if (voices[selectedVoiceIndex]) {
            utterance.voice = voices[selectedVoiceIndex];
        }

        utterance.volume = parseFloat(volumeRange.value) / 100;
        utterance.rate = parseFloat(rateRange.value);
        utterance.pitch = parseFloat(pitchRange.value);

        utterance.onstart = () => { statusDiv.textContent = "Воспроизведение..."; };
        utterance.onend = () => { statusDiv.textContent = "Готов к работе"; };
        utterance.onerror = () => { statusDiv.textContent = "Ошибка воспроизведения"; };

        synth.speak(utterance);
    });
</script>

</body>
</html>
