<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симуляция Автовокзала</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        canvas {
            background-color: #1e293b;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <canvas id="simCanvas" width="900" height="750"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // Основные параметры геометрии
        const CENTER_X = canvas.width / 2;
        const ROAD_WIDTH = 80;

        // Здание вокзала (вверху по центру)
        const station = {
            x: CENTER_X - 140,
            y: 40,
            width: 280,
            height: 90
        };

        // Параметры полукруглого разворота/перронов
        const platformCenterY = 230;
        const platformRadius = 200;

        function drawMap() {
            // Background
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Главная дорога (снизу вверх до развязки)
            ctx.fillStyle = '#334155';
            ctx.fillRect(CENTER_X - ROAD_WIDTH / 2, 350, ROAD_WIDTH, canvas.height - 350);

            // Разделительная линия на главной дороге
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2;
            ctx.setLineDash([12, 12]);
            ctx.beginPath();
            ctx.moveTo(CENTER_X, 360);
            ctx.lineTo(CENTER_X, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // Асфальтированная площадка полукругом перед вокзалом
            ctx.fillStyle = '#334155';
            ctx.beginPath();
            ctx.arc(CENTER_X, platformCenterY, platformRadius + 35, 0, Math.PI * 2);
            ctx.fill();

            // Внутренний островок безопасности / газон
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(CENTER_X, platformCenterY, platformRadius - 45, 0, Math.PI * 2);
            ctx.fill();

            // Здание вокзала
            ctx.fillStyle = '#0284c7';
            ctx.beginPath();
            ctx.roundRect(station.x, station.y, station.width, station.height, 10);
            ctx.fill();

            // Текст вокзала
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('АВТОВОКЗАЛ', CENTER_X, station.y + 52);
        }

        drawMap();
    </script>
</body>
</html>
