<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реалистичный нейросетевой JS-синтезатор</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 440px;
        }
        h2 { margin-top: 0; font-size: 20px; color: #2c3e50; text-align: center; }
        textarea {
            width: 100%;
            height: 110px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 15px;
            font-size: 14px;
        }
        label { display: block; font-size: 12px; color: #555; margin-bottom: 5px; }
        select {
            width: 100%;
            margin-bottom: 15px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background: #219150; }
        button:disabled { background: #95a5a6; cursor: not-allowed; }
        .status {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Нейросетевой синтез речи (Edge Neural)</h2>
    
    <label for="textInput">Введите текст:</label>
    <textarea id="textInput">Привет! Это высококачественный нейросетевой голос, который генерируется прямо через код JavaScript абсолютно бесплатно.</textarea>
    
    <label for="voiceSelect">Нейросетевой голос:</label>
    <select id="voiceSelect">
        <option value="ru-RU-SvetlanaNeural">Светлана (Женский, реалистичный)</option>
        <option value="ru-RU-DmitryNeural">Дмитрий (Мужской, реалистичный)</option>
    </select>

    <button id="speakBtn">Озвучить нейросетью</button>
    <div id="status" class="status">Готов к работе</div>
</div>

<script>
    const speakBtn = document.getElementById('speakBtn');
    const textInput = document.getElementById('textInput');
    const voiceSelect = document.getElementById('voiceSelect');
    const statusDiv = document.getElementById('status');

    // Ключ подключения к бесплатному серверу генерации
    const TRUSTED_CLIENT_TOKEN = "6A5AA1D4EA01472831981F123881F7ED3";

    async function generateNeuralSpeech(text, voice) {
        return new Promise((resolve, reject) => {
            statusDiv.textContent = "Подключение к нейросети...";
            
            // Открываем WebSocket-соединение с нейросетевым движком Microsoft Edge
            const ws = new WebSocket(`wss://speech.platform.bing.com/consumer/speech/synthesize/readaloud/edge/v1?TrustedClientToken=${TRUSTED_CLIENT_TOKEN}`);
            ws.binaryType = 'arraybuffer';

            let audioChunks = [];

            ws.onopen = () => {
                statusDiv.textContent = "Генерация человеческого голоса...";
                
                // 1. Отправляем конфигурацию аудио (MP3)
                const configHeader = "Content-Type:application/json; charset=utf-8\r\nPath:speech.config\r\n\r\n" +
                    JSON.stringify({
                        context: {
                            synthesis: {
                                audio: {
                                    metadataversion: "A",
                                    outputformat: "audio-24khz-48kbitrate-mono-mp3"
                                }
                            }
                        }
                    });
                ws.send(configHeader);

                // 2. Отправляем SSML-запрос с текстом и выбранной нейромоделью
                const requestId = Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join('');
                const ssml = `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xml:lang='ru-RU'><voice name='${voice}'>${text}</voice></speak>`;
                
                const ssmlHeader = `X-RequestId:${requestId}\r\nContent-Type:application/ssml+xml\r\nPath:ssml\r\n\r\n${ssml}`;
                ws.send(ssmlHeader);
            };

            ws.onmessage = (event) => {
                if (typeof event.data === 'string') {
                    // Завершение передачи данных
                    if (event.data.includes("Path:turn.end")) {
                        ws.close();
                    }
                } else if (event.data instanceof ArrayBuffer) {
                    // Получаем бинарные данные MP3 кадра
                    const view = new DataView(event.data);
                    const headerLength = view.getUint16(0);
                    const audioData = event.data.slice(2 + headerLength);
                    if (audioData.byteLength > 0) {
                        audioChunks.push(audioData);
                    }
                }
            };

            ws.onerror = (err) => {
                statusDiv.textContent = "Ошибка генерации";
                reject(err);
            };

            ws.onclose = () => {
                if (audioChunks.length > 0) {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                    resolve(audioBlob);
                } else {
                    reject("Не удалось получить аудиоданные");
                }
            };
        });
    }

    speakBtn.addEventListener('click', async () => {
        const text = textInput.value.trim();
        if (!text) return;

        speakBtn.disabled = true;

        try {
            const selectedVoice = voiceSelect.value;
            const audioBlob = await generateNeuralSpeech(text, selectedVoice);
            
            statusDiv.textContent = "Воспроизведение...";
            
            const audioUrl = URL.createObjectURL(audioBlob);
            const audio = new Audio(audioUrl);
            
            audio.onended = () => {
                statusDiv.textContent = "Готов к работе";
                speakBtn.disabled = false;
            };

            await audio.play();

        } catch (error) {
            console.error(error);
            statusDiv.textContent = "Произошла ошибка при генерации";
            speakBtn.disabled = false;
        }
    });
</script>

</body>
</html>
