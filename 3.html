<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Физическая модель: Кубики и Стена ($\pi$ + Фазовое пространство)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        body {
            padding: 10px 15px;
            gap: 10px;
        }

        h1 {
            font-size: 1.15rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: #e5e7eb;
            text-align: center;
            flex-shrink: 0;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            flex: 1;
            min-height: 0;
        }

        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            flex-shrink: 0;
        }

        canvas {
            background: #030712;
            border-radius: 8px;
            width: 100%;
            flex: 1;
            min-height: 0;
            display: block;
            border: 1px solid #1f2937;
        }

        .panel {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 10px;
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }

        .controls-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        button {
            background: #1f2937;
            color: #f3f4f6;
            border: 1px solid #374151;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        button:hover {
            background: #374151;
            border-color: #4b5563;
        }

        button.primary {
            background: #f59e0b;
            color: #030712;
            border-color: #d97706;
            font-weight: 600;
        }

        button.primary:hover { background: #fbbf24; }

        .presets-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .inputs-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .input-group {
            background: #030712;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 0.7rem;
            color: #9ca3af;
        }

        .input-group input {
            background: #111827;
            border: 1px solid #374151;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            width: 100%;
        }

        .info-text {
            font-size: 0.75rem;
            color: #9ca3af;
            border-top: 1px solid #1f2937;
            padding-top: 6px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <h1>Модель «Кубики и Стена»: Физическое и Фазовое Пространство</h1>

    <div class="container">
        <!-- Слева: Физическая симуляция -->
        <div class="card">
            <div class="card-header">
                <span>1. Движение кубиков</span>
                <span style="color: #f59e0b;">Ударов: <span id="collisionCount">0</span></span>
            </div>
            <canvas id="simCanvas"></canvas>
        </div>

        <!-- Справа: Фазовое пространство -->
        <div class="card">
            <div class="card-header">
                <span>2. Фазовый портрет (Движение по дуге энергии)</span>
                <span style="color: #60a5fa;">v₂ vs v₁</span>
            </div>
            <canvas id="phaseCanvas"></canvas>
        </div>
    </div>

    <!-- Панель управления -->
    <div class="panel">
        <div class="presets-bar">
            <span style="font-size: 0.75rem; color: #f59e0b; align-self: center; font-weight: 600;">Пресеты (m₂/m₁):</span>
            <button onclick="setMassPreset(1)">1 : 1 (3 удара)</button>
            <button onclick="setMassPreset(100)">1 : 100 (31 удар)</button>
            <button onclick="setMassPreset(10000)">1 : 10 000 (314 ударов)</button>
            <button onclick="setMassPreset(1000000)">1 : 1 000 000 (3141 удар)</button>
        </div>

        <div class="controls-row">
            <button id="playPauseBtn" class="primary" onclick="togglePlay()">⏸ Пауза</button>
            <button onclick="resetSimulation()">🔄 Перезапуск</button>
            <button onclick="clearTrail()">🧹 Очистить след</button>
            
            <div class="inputs-grid" style="margin-left: auto; width: 320px;">
                <div class="input-group">
                    <label>Масса 1 (m₁ - у стены)</label>
                    <input type="number" id="m1Input" value="1" min="1" onchange="updateParams()">
                </div>
                <div class="input-group">
                    <label>Масса 2 (m₂ - свободный)</label>
                    <input type="number" id="m2Input" value="100" min="1" onchange="updateParams()">
                </div>
                <div class="input-group">
                    <label>Шагов/кадр</label>
                    <input type="number" id="subStepsInput" value="100" min="1" max="1000" onchange="updateParams()">
                </div>
            </div>
        </div>

        <div class="info-text">
            <span>Оси фазового пространства: Горизонтально — $\sqrt{m_2}v_2$ (у стены), Вертикально — $\sqrt{m_1}v_1$ (свободный).</span>
            <span id="statusText" style="color: #10b981;">Запущено</span>
        </div>
    </div>

    <script>
        const simCanvas = document.getElementById('simCanvas');
        const simCtx = simCanvas.getContext('2d');
        const phaseCanvas = document.getElementById('phaseCanvas');
        const phaseCtx = phaseCanvas.getContext('2d');

        function resizeCanvases() {
            simCanvas.width = simCanvas.clientWidth;
            simCanvas.height = simCanvas.clientHeight;
            phaseCanvas.width = phaseCanvas.clientWidth;
            phaseCanvas.height = phaseCanvas.clientHeight;
        }
        window.addEventListener('resize', resizeCanvases);
        resizeCanvases();

        let m1 = 1;
        let m2 = 100;
        let subSteps = 100;
        let isRunning = true;
        let collisionCount = 0;

        let x1 = 150, v1 = 0, size1 = 35;
        let x2 = 320, v2 = -1.5, size2 = 60;
        const wallX = 50;

        let phaseTrail = [];
        const maxTrailLength = 4000;

        // Переменные для плавной интерполяции угла по окружности энергии
        let currentAngle = 0;
        let targetAngle = 0;
        let currentRadius = 1;

        function updateParams() {
            m1 = parseFloat(document.getElementById('m1Input').value) || 1;
            m2 = parseFloat(document.getElementById('m2Input').value) || 100;
            subSteps = parseInt(document.getElementById('subStepsInput').value) || 100;
            resetSimulation();
        }

        function setMassPreset(ratio) {
            document.getElementById('m1Input').value = 1;
            document.getElementById('m2Input').value = ratio;
            if (ratio === 1) document.getElementById('subStepsInput').value = 10;
            else if (ratio === 100) document.getElementById('subStepsInput').value = 50;
            else if (ratio === 10000) document.getElementById('subStepsInput').value = 200;
            else document.getElementById('subStepsInput').value = 500;
            updateParams();
        }

        function getAngle(pv2, pv1) {
            return Math.atan2(pv1, pv2);
        }

        function resetSimulation() {
            collisionCount = 0;
            x1 = wallX + 60;
            v1 = 0;
            x2 = wallX + 220;
            v2 = -1.5;
            phaseTrail = [];
            
            let pv2 = Math.sqrt(m2) * v2;
            let pv1 = Math.sqrt(m1) * v1;
            currentRadius = Math.sqrt(pv2 * pv2 + pv1 * pv1) || 1;
            currentAngle = getAngle(pv2, pv1);
            targetAngle = currentAngle;

            document.getElementById('collisionCount').innerText = collisionCount;
            phaseTrail.push({ pv2: pv2, pv1: pv1 });
        }

        function clearTrail() {
            phaseTrail = [];
        }

        function togglePlay() {
            isRunning = !isRunning;
            document.getElementById('playPauseBtn').innerText = isRunning ? '⏸ Пауза' : '▶ Возобновить';
            document.getElementById('statusText').innerText = isRunning ? 'Запущено' : 'Пауза';
            document.getElementById('statusText').style.color = isRunning ? '#10b981' : '#f59e0b';
        }

        function physicsStep() {
            let dt = 1.0 / subSteps;

            for (let step = 0; step < subSteps; step++) {
                x1 += v1 * dt;
                x2 += v2 * dt;

                let stateChanged = false;

                // 1. Удар первого кубика о стену
                if (x1 <= wallX) {
                    x1 = wallX;
                    v1 = -v1;
                    collisionCount++;
                    stateChanged = true;
                }

                // 2. Удар кубиков друг о друга
                if (x1 + size1 >= x2) {
                    let overlap = (x1 + size1) - x2;
                    x1 -= overlap / 2;
                    x2 += overlap / 2;

                    let u1 = v1;
                    let u2 = v2;

                    v1 = ((m1 - m2) * u1 + 2 * m2 * u2) / (m1 + m2);
                    v2 = ((m2 - m1) * u2 + 2 * m1 * u1) / (m1 + m2);

                    collisionCount++;
                    stateChanged = true;
                }

                let pv2 = Math.sqrt(m2) * v2;
                let pv1 = Math.sqrt(m1) * v1;
                let targetR = Math.sqrt(pv2 * pv2 + pv1 * pv1);
                if (targetR > 0) currentRadius = targetR;

                targetAngle = getAngle(pv2, pv1);

                // Плавное сглаживание угла для движения по круговой дуге между столкновениями
                let angleDiff = targetAngle - currentAngle;
                // Нормализация разницы углов в диапазон [-PI, PI]
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;

                currentAngle += angleDiff * 0.15; // Скорость интерполяции по дуге

                let smoothPv2 = currentRadius * Math.cos(currentAngle);
                let smoothPv1 = currentRadius * Math.sin(currentAngle);

                phaseTrail.push({
                    pv2: smoothPv2,
                    pv1: smoothPv1
                });

                if (phaseTrail.length > maxTrailLength) {
                    phaseTrail.shift();
                }
            }
            document.getElementById('collisionCount').innerText = collisionCount;
        }

        function drawSim() {
            simCtx.fillStyle = '#030712';
            simCtx.fillRect(0, 0, simCanvas.width, simCanvas.height);

            const groundY = simCanvas.height / 2 + 40;

            simCtx.strokeStyle = '#374151';
            simCtx.lineWidth = 2;
            simCtx.beginPath();
            simCtx.moveTo(wallX - 20, groundY);
            simCtx.lineTo(simCanvas.width - 20, groundY);
            simCtx.stroke();

            simCtx.fillStyle = '#4b5563';
            simCtx.fillRect(wallX - 15, groundY - 120, 15, 120);

            // Кубик 1 (у стены)
            simCtx.fillStyle = '#f472b6';
            simCtx.fillRect(x1, groundY - size1, size1, size1);

            // Кубик 2 (свободный)
            simCtx.fillStyle = '#60a5fa';
            simCtx.fillRect(x2, groundY - size2, size2, size2);
        }

        function drawPhaseSpace() {
            const w = phaseCanvas.width;
            const h = phaseCanvas.height;
            const cx = w / 2;
            const cy = h / 2;

            phaseCtx.fillStyle = '#030712';
            phaseCtx.fillRect(0, 0, w, h);

            phaseCtx.strokeStyle = '#374151';
            phaseCtx.lineWidth = 1;
            phaseCtx.beginPath();
            phaseCtx.moveTo(20, cy); phaseCtx.lineTo(w - 20, cy);
            phaseCtx.moveTo(cx, 20); phaseCtx.lineTo(cx, h - 20);
            phaseCtx.stroke();

            phaseCtx.fillStyle = '#9ca3af';
            phaseCtx.font = '11px sans-serif';
            phaseCtx.fillText('√m₂·v₂ (у стены) →', w - 120, cy - 8);
            phaseCtx.fillText('↑ √m₁·v₁ (свободный)', cx + 8, 30);

            const maxEnergySpeed = Math.abs(Math.sqrt(m2) * -1.5) * 1.3;
            const scale = (Math.min(w, h) / 2 - 40) / (maxEnergySpeed || 1);

            if (phaseTrail.length > 1) {
                phaseCtx.beginPath();
                phaseCtx.strokeStyle = '#f59e0b';
                phaseCtx.lineWidth = 1.5;

                for (let i = 0; i < phaseTrail.length; i++) {
                    let px = cx + phaseTrail[i].pv2 * scale;
                    let py = cy - phaseTrail[i].pv1 * scale;

                    if (i === 0) phaseCtx.moveTo(px, py);
                    else phaseCtx.lineTo(px, py);
                }
                phaseCtx.stroke();
            }

            let curX = cx + (currentRadius * Math.cos(currentAngle)) * scale;
            let curY = cy - (currentRadius * Math.sin(currentAngle)) * scale;

            phaseCtx.fillStyle = '#ffffff';
            phaseCtx.beginPath();
            phaseCtx.arc(curX, curY, 4, 0, Math.PI * 2);
            phaseCtx.fill();
        }

        function loop() {
            if (isRunning) {
                physicsStep();
            }
            drawSim();
            drawPhaseSpace();
            requestAnimationFrame(loop);
        }

        resetSimulation();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
