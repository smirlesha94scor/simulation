<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Формантный синтезатор речи на чистом JS</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 440px;
            text-align: center;
        }
        h2 { margin-top: 0; font-size: 20px; color: #2c3e50; }
        p { font-size: 13px; color: #666; margin-bottom: 20px; }
        
        .section-title {
            font-size: 14px;
            font-weight: bold;
            color: #444;
            margin: 15px 0 8px;
            text-align: left;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }
        .consonants {
            grid-template-columns: repeat(3, 1fr);
        }
        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover { background: #2980b9; }
        button:active { transform: scale(0.95); }
        .noise-btn { background: #e67e22; }
        .noise-btn:hover { background: #d35400; }

        .controls {
            margin-top: 20px;
            text-align: left;
            background: #f9f9f9;
            padding: 12px;
            border-radius: 6px;
        }
        label { display: block; font-size: 12px; color: #555; margin-bottom: 4px; }
        input[type="range"] { width: 100%; margin-bottom: 10px; }
        .range-value { float: right; font-weight: bold; color: #3498db; }
    </style>
</head>
<body>

<div class="card">
    <h2>Формантный синтезатор голоса</h2>
    <p>Синтез звуков речи физическим методом (Web Audio API без внешних файлов)</p>
    
    <div class="section-title">Гласные звуки (связки + форманты):</div>
    <div class="buttons">
        <button onclick="playVowel('A')">А</button>
        <button onclick="playVowel('E')">Э</button>
        <button onclick="playVowel('I')">И</button>
        <button onclick="playVowel('O')">О</button>
        <button onclick="playVowel('U')">У</button>
    </div>

    <div class="section-title">Согласные звуки (белый шум + фильтр):</div>
    <div class="buttons consonants">
        <button class="noise-btn" onclick="playConsonant('S')">С</button>
        <button class="noise-btn" onclick="playConsonant('SH')">Ш</button>
        <button class="noise-btn" onclick="playConsonant('F')">Ф</button>
    </div>

    <div class="controls">
        <label for="pitchRange">Тон голоса (Гц): <span id="pitchVal" class="range-value">120</span></label>
        <input type="range" id="pitchRange" min="80" max="250" value="120" step="1">

        <label for="durRange">Длительность (сек): <span id="durVal" class="range-value">0.6</span></label>
        <input type="range" id="durRange" min="0.2" max="1.5" value="0.6" step="0.1">
    </div>
</div>

<script>
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    // Настройки интерфейса ползунков
    const pitchRange = document.getElementById('pitchRange');
    const durRange = document.getElementById('durRange');
    
    pitchRange.oninput = () => document.getElementById('pitchVal').textContent = pitchRange.value;
    durRange.oninput = () => document.getElementById('durVal').textContent = durRange.value;

    // Частоты формант для гласных (F1, F2, F3, F4)
    const formantData = {
        'A': { freqs: [730, 1090, 2440, 3500], gains: [1.0, 0.5, 0.2, 0.1] },
        'E': { freqs: [530, 1840, 2480, 3600], gains: [1.0, 0.7, 0.3, 0.1] },
        'I': { freqs: [270, 2290, 3010, 3600], gains: [1.0, 0.8, 0.2, 0.05] },
        'O': { freqs: [570, 840, 2410, 3400], gains: [1.0, 0.6, 0.2, 0.1] },
        'U': { freqs: [300, 870, 2240, 3300], gains: [1.0, 0.5, 0.2, 0.1] }
    };

    // Функция синтеза гласной
    function playVowel(vowelKey) {
        initAudio();
        const now = audioCtx.currentTime;
        const baseFreq = parseFloat(pitchRange.value);
        const duration = parseFloat(durRange.value);

        // 1. Создание сложной формы волны (имитация импульса голосовых связок)
        const real = new Float32Array([0, 0.5, 0.25, 0.12, 0.06, 0.03]);
        const imag = new Float32Array(real.length);
        const wave = audioCtx.createPeriodicWave(real, imag);

        const osc = audioCtx.createOscillator();
        osc.setPeriodicWave(wave);

        // Живая интонация: легкое плавание частоты тона вниз к концу звука
        osc.frequency.setValueAtTime(baseFreq, now);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.92, now + duration);

        // 2. Общая огибающая громкости (плавная атака и затухание)
        const masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(0, now);
        masterGain.gain.linearRampToValueAtTime(0.25, now + 0.05);
        masterGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        // 3. Формантная фильтрация (моделирование речевого тракта рта/гортани)
        const formants = formantData[vowelKey];
        formants.freqs.forEach((f, i) => {
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = f;
            filter.Q.value = f / 80; // ширина полосы пропускания резонатора

            const fGain = audioCtx.createGain();
            fGain.gain.value = formants.gains[i];

            osc.connect(filter);
            filter.connect(fGain);
            fGain.connect(masterGain);
        });

        masterGain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + duration);
    }

    // Функция синтеза согласной (шумовая компонента)
    function playConsonant(type) {
        initAudio();
        const now = audioCtx.currentTime;
        const duration = 0.25;
        const bufferSize = audioCtx.sampleRate * duration;
        
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        
        // Генерация белого шума
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        // Полосовой фильтр для настройки характера шума (С, Ш или Ф)
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        if (type === 'S') { filter.frequency.value = 6500; filter.Q.value = 6; }
        else if (type === 'SH') { filter.frequency.value = 2500; filter.Q.value = 4; }
        else if (type === 'F') { filter.frequency.value = 1500; filter.Q.value = 2; }

        const gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(0.15, now);
        gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration);

        noise.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        noise.start(now);
    }
</script>

</body>
</html>
