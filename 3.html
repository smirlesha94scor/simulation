<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симуляция Автовокзала</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #viewport {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a2332;
            position: relative;
        }

        canvas {
            background-color: #1e293b;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
        }

        #sidebar {
            width: 380px;
            background-color: #0f172a;
            border-left: 1px solid #334155;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        h2 {
            color: #38bdf8;
            font-size: 1.2rem;
            margin-bottom: 2px;
        }

        .section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            margin-top: 4px;
            margin-bottom: 2px;
        }

        .clock-box {
            background: #1e293b;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .clock-time {
            font-size: 1.4rem;
            font-weight: bold;
            color: #38bdf8;
            font-family: monospace;
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 9px 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.82rem;
            text-align: center;
        }

        .btn:hover {
            background-color: #0369a1;
        }

        .btn-secondary {
            background-color: #475569;
        }

        .btn-secondary:hover {
            background-color: #334155;
        }

        .table-container {
            flex: 1;
            max-height: 520px;
            overflow-y: auto;
            border: 1px solid #334155;
            border-radius: 6px;
            background-color: #1e293b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78rem;
            text-align: left;
        }

        th {
            background-color: #0f172a;
            color: #38bdf8;
            padding: 8px 10px;
            position: sticky;
            top: 0;
            border-bottom: 1px solid #334155;
            font-weight: 600;
        }

        td {
            padding: 7px 10px;
            border-bottom: 1px solid #334155;
            color: #cbd5e1;
        }

        tr.active-trip td {
            background-color: rgba(56, 189, 248, 0.15);
            color: #ffffff;
        }

        .platform-badge {
            background-color: #22c55e;
            color: #0f172a;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <div id="viewport">
        <canvas id="simCanvas" width="900" height="750"></canvas>
    </div>

    <div id="sidebar">
        <h2>Симуляция по Расписанию</h2>

        <div class="clock-box">
            <div>
                <div style="font-size: 0.75rem; color: #94a3b8;">ИГРОВОЕ ВРЕМЯ</div>
                <div class="clock-time" id="clockDisplay">06:00</div>
            </div>
            <div style="display: flex; gap: 6px;">
                <button class="btn" id="btnTogglePlay" style="padding: 6px 12px;">Пауза</button>
                <button class="btn btn-secondary" id="btnSpeed" style="padding: 6px 10px;">x1</button>
            </div>
        </div>

        <div class="btn-row">
            <button class="btn" id="btnGenerate">Обновить расписание</button>
        </div>

        <div class="section-title">Текущие рейсы</div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Рейс</th>
                        <th>Платф.</th>
                        <th>Прибытие</th>
                        <th>Стоянка</th>
                        <th>Отправление</th>
                    </tr>
                </thead>
                <tbody id="scheduleBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // Геометрия карты
        const MAP_PARAMS = {
            roadWidth: 98,
            roadStartY: 398,
            platformCenterY: 50,
            platformRadius: 315,
            ringThickness: 76,
            platformCount: 5,
            arcSpread: 140,
            arcRotation: 0,
            stationWidth: 259,
            stationHeight: 117,
            stationY: 58,
            platforms: [
                { angle: 5, offset: -19 },
                { angle: 5, offset: -25 },
                { angle: 0, offset: -22 },
                { angle: -5, offset: -25 },
                { angle: -5, offset: -18 }
            ]
        };

        // Точные точки парковки
        const paths = {
            in: [
                [[474, 692], [474, 384], [559, 365], [619, 339], [657, 308], [688, 281], [693, 138]], // П-1
                [[472, 692], [470, 389], [525, 378], [573, 362], [588, 336], [595, 257]],          // П-2
                [[474, 692], [473, 400], [458, 366], [450, 305]],                                  // П-3
                [[476, 692], [472, 353], [427, 349], [391, 340], [341, 327], [306, 256]],          // П-4
                [[473, 692], [472, 344], [421, 342], [375, 334], [329, 318], [284, 293], [206, 138]] // П-5
            ],
            out: [
                [[693, 138], [691, 209], [675, 240], [611, 298], [511, 338], [426, 347], [425, 692]],
                [[595, 257], [592, 303], [564, 319], [527, 333], [479, 344], [426, 349], [423, 692]],
                [[450, 305], [451, 346], [425, 381], [423, 691]],
                [[306, 256], [311, 353], [352, 370], [425, 387], [427, 692]],
                [[206, 138], [217, 286], [241, 313], [285, 342], [348, 367], [425, 389], [426, 691]]
            ]
        };

        const busColors = ['#38bdf8', '#f59e0b', '#10b981', '#ec4899', '#8b5cf6'];

        let schedule = [];
        let gameTimeMinutes = 6 * 60;
        let isPlaying = true;
        let timeSpeed = 1;

        function generateSchedule() {
            schedule = [];
            let currentTime = Math.floor(gameTimeMinutes);
            let platformFreeTime = [0, 0, 0, 0, 0];
            let lastArrivalAnyPlatform = currentTime - 10;

            for (let i = 1; i <= 14; i++) {
                let platformIdx = Math.floor(Math.random() * MAP_PARAMS.platformCount);
                let dwellTime = Math.floor(Math.random() * 11) + 10;

                let minArrByPlatform = platformFreeTime[platformIdx] + 30;
                let randomRoadGap = Math.floor(Math.random() * 11) + 5; 
                let minArrByRoad = lastArrivalAnyPlatform + randomRoadGap;

                let arrivalTime = Math.max(currentTime, minArrByPlatform, minArrByRoad);
                let departureTime = arrivalTime + dwellTime;

                platformFreeTime[platformIdx] = departureTime;
                lastArrivalAnyPlatform = arrivalTime;
                currentTime = arrivalTime;

                schedule.push({
                    id: Date.now() + i,
                    busName: `Рейс ${100 + i * 7}`,
                    platform: platformIdx,
                    arrivalTime: arrivalTime,
                    dwellTime: dwellTime,
                    departureTime: departureTime,
                    color: busColors[(i - 1) % busColors.length]
                });
            }
            renderScheduleTable();
        }

        function formatTime(totalMinutes) {
            const hrs = Math.floor(totalMinutes / 60) % 24;
            const mins = Math.floor(totalMinutes % 60);
            return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;
        }

        function renderScheduleTable() {
            const tbody = document.getElementById('scheduleBody');
            tbody.innerHTML = '';

            schedule.forEach(item => {
                const tr = document.createElement('tr');
                tr.id = `trip-row-${item.id}`;
                tr.innerHTML = `
                    <td><b>${item.busName}</b></td>
                    <td><span class="platform-badge">П-${item.platform + 1}</span></td>
                    <td>${formatTime(item.arrivalTime)}</td>
                    <td>${item.dwellTime} мин</td>
                    <td><b>${formatTime(item.departureTime)}</b></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function getPointOnPath(points, progress) {
            if (!points || points.length === 0) return null;
            let pts = points.map(p => ({x: p[0], y: p[1]}));
            if (pts.length === 1) return pts[0];

            let totalLen = 0;
            let segments = [];
            for (let i = 0; i < pts.length - 1; i++) {
                let d = Math.hypot(pts[i+1].x - pts[i].x, pts[i+1].y - pts[i].y);
                segments.push({ p1: pts[i], p2: pts[i+1], len: d });
                totalLen += d;
            }

            if (totalLen === 0) return pts[0];
            let targetDist = progress * totalLen;
            let currentDist = 0;

            for (let seg of segments) {
                if (currentDist + seg.len >= targetDist) {
                    let t = (targetDist - currentDist) / seg.len;
                    let x = seg.p1.x + (seg.p2.x - seg.p1.x) * t;
                    let y = seg.p1.y + (seg.p2.y - seg.p1.y) * t;
                    let angle = Math.atan2(seg.p2.y - seg.p1.y, seg.p2.x - seg.p1.x);
                    return { x, y, angle };
                }
                currentDist += seg.len;
            }
            return pts[pts.length - 1];
        }

        function updateSimulation(dt) {
            if (!isPlaying) return;

            gameTimeMinutes += (dt / 1000) * (1 / 5) * timeSpeed;
            if (gameTimeMinutes >= 24 * 60) gameTimeMinutes = 6 * 60;

            document.getElementById('clockDisplay').textContent = formatTime(gameTimeMinutes);

            const travelDuration = 1.5;
            const initialLength = schedule.length;
            
            schedule = schedule.filter(trip => {
                const endDriveOut = trip.departureTime + travelDuration;
                return gameTimeMinutes < endDriveOut;
            });

            if (schedule.length !== initialLength) {
                renderScheduleTable();
            }

            if (schedule.length === 0) {
                generateSchedule();
            }
        }

        function drawMap() {
            const CENTER_X = canvas.width / 2;

            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#334155';
            ctx.fillRect(CENTER_X - MAP_PARAMS.roadWidth / 2, MAP_PARAMS.roadStartY, MAP_PARAMS.roadWidth, canvas.height - MAP_PARAMS.roadStartY);

            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2;
            ctx.setLineDash([12, 12]);
            ctx.beginPath();
            ctx.moveTo(CENTER_X, MAP_PARAMS.roadStartY + 10);
            ctx.lineTo(CENTER_X, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            const innerRadius = Math.max(10, MAP_PARAMS.platformRadius - MAP_PARAMS.ringThickness / 2);

            ctx.beginPath();
            ctx.arc(CENTER_X, MAP_PARAMS.platformCenterY, MAP_PARAMS.platformRadius, 0, Math.PI);
            ctx.lineWidth = MAP_PARAMS.ringThickness;
            ctx.strokeStyle = '#334155';
            ctx.lineCap = 'butt';
            ctx.stroke();

            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(CENTER_X, MAP_PARAMS.platformCenterY, innerRadius, 0, Math.PI);
            ctx.fill();

            const spreadRad = (MAP_PARAMS.arcSpread * Math.PI) / 180;
            const rotationRad = (MAP_PARAMS.arcRotation * Math.PI) / 180;
            const baseCenterAngle = Math.PI * 0.5;
            const startAngle = baseCenterAngle - spreadRad / 2 + rotationRad;
            const endAngle = baseCenterAngle + spreadRad / 2 + rotationRad;

            for (let i = 0; i < MAP_PARAMS.platformCount; i++) {
                let angle = startAngle + (i / (MAP_PARAMS.platformCount - 1)) * (endAngle - startAngle);
                const custom = MAP_PARAMS.platforms[i];
                const placementRadius = innerRadius + custom.offset;

                const pX = CENTER_X + Math.cos(angle) * placementRadius;
                const pY = MAP_PARAMS.platformCenterY + Math.sin(angle) * placementRadius;

                ctx.save();
                ctx.translate(pX, pY);
                ctx.rotate((custom.angle * Math.PI) / 180);

                ctx.fillStyle = '#22c55e';
                ctx.fillRect(-12, -22, 24, 44);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.strokeRect(-12, -22, 24, 44);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`П-${i + 1}`, 0, 4);

                ctx.restore();
            }

            const stationX = CENTER_X - MAP_PARAMS.stationWidth / 2;
            ctx.fillStyle = '#0284c7';
            ctx.beginPath();
            ctx.roundRect(stationX, MAP_PARAMS.stationY, MAP_PARAMS.stationWidth, MAP_PARAMS.stationHeight, 10);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('АВТОВОКЗАЛ', CENTER_X, MAP_PARAMS.stationY + MAP_PARAMS.stationHeight / 2 + 6);

            // Отрисовка автобусов
            schedule.forEach(trip => {
                const rowEl = document.getElementById(`trip-row-${trip.id}`);
                const pIdx = trip.platform;
                
                const travelDuration = 1.5;
                const arrTime = trip.arrivalTime;
                const depTime = trip.departureTime;
                const startDriveIn = arrTime - travelDuration;
                const endDriveOut = depTime + travelDuration;

                if (gameTimeMinutes >= startDriveIn && gameTimeMinutes <= endDriveOut) {
                    if (rowEl) rowEl.classList.add('active-trip');

                    let busPos = null;
                    let angleOffset = Math.PI / 2;

                    if (gameTimeMinutes < arrTime) {
                        let progress = (gameTimeMinutes - startDriveIn) / travelDuration;
                        busPos = getPointOnPath(paths.in[pIdx], progress);
                    } 
                    else if (gameTimeMinutes <= depTime) {
                        busPos = getPointOnPath(paths.in[pIdx], 1.0);
                    } 
                    else {
                        let progress = (gameTimeMinutes - depTime) / travelDuration;
                        busPos = getPointOnPath(paths.out[pIdx], progress);
                    }

                    if (busPos) {
                        ctx.save();
                        ctx.translate(busPos.x, busPos.y);
                        ctx.rotate(busPos.angle + angleOffset);

                        ctx.fillStyle = trip.color;
                        ctx.beginPath();
                        ctx.roundRect(-10, -18, 20, 36, 5);
                        ctx.fill();
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 2;
                        ctx.stroke();

                        ctx.fillStyle = '#0f172a';
                        ctx.fillRect(-7, -14, 14, 8);

                        ctx.restore();
                    }
                } else {
                    if (rowEl) rowEl.classList.remove('active-trip');
                }
            });
        }

        document.getElementById('btnGenerate').addEventListener('click', generateSchedule);

        const btnTogglePlay = document.getElementById('btnTogglePlay');
        btnTogglePlay.addEventListener('click', () => {
            isPlaying = !isPlaying;
            btnTogglePlay.textContent = isPlaying ? 'Пауза' : 'Старт';
            btnTogglePlay.style.backgroundColor = isPlaying ? '#0284c7' : '#10b981';
        });

        const btnSpeed = document.getElementById('btnSpeed');
        let speedModes = [0.2, 0.5, 1, 2, 5];
        let speedIdx = 2;
        btnSpeed.addEventListener('click', () => {
            speedIdx = (speedIdx + 1) % speedModes.length;
            timeSpeed = speedModes[speedIdx];
            btnSpeed.textContent = `x${timeSpeed}`;
        });

        let lastTime = performance.now();
        function mainLoop(now) {
            let dt = now - lastTime;
            lastTime = now;

            updateSimulation(dt);
            drawMap();
            requestAnimationFrame(mainLoop);
        }

        generateSchedule();
        requestAnimationFrame(mainLoop);
    </script>
</body>
</html>
